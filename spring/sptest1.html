<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Framework Mock Test — 100 MCQs</title>
<meta name="description" content="100 Spring Framework MCQs (no Spring Boot): IoC container, dependency injection, bean scopes and lifecycle, AOP, Spring MVC, JDBC, transactions, SpEL, validation, events and testing.">
<style>
  :root{
    --brand:#4f7f2b;
    --brand-dark:#2f4f16;
    --accent:#8bc34a;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#1b2f08;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ecfccb;border-color:#d9f99d}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,127,43,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f7fee7}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ecfccb}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🌱 Spring Framework Mock Test <span class="setpill">CORE · NO BOOT</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SPRING FRAMEWORK SET 1 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : IoC container ---------- */
{q:'What is the primary responsibility of the Spring IoC container?',
 o:['Compiling Java classes','Managing the creation, wiring and lifecycle of objects (beans)','Providing a web server','Generating database schemas'],a:1,
 e:'Inversion of Control means the container, not your code, instantiates and wires objects. You describe beans and their dependencies; the container constructs the graph and manages lifecycles.'},

{q:'How does ApplicationContext extend BeanFactory?',
 o:['They are identical','BeanFactory is the minimal container; ApplicationContext adds events, i18n, resource loading and automatic BeanPostProcessor registration','ApplicationContext is older and deprecated','BeanFactory supports AOP but ApplicationContext does not'],a:1,
 e:'BeanFactory is the root interface and is lazy by default. ApplicationContext is the enterprise-grade superset that eagerly instantiates singletons and adds ApplicationEventPublisher, MessageSource and ResourceLoader.'},

{q:'What is the default bean scope in Spring?',
 o:['singleton','prototype','request','session'],a:0,
 e:'Singleton is the default: one shared instance per container. It is not the GoF Singleton pattern, just one instance per Spring container (per application context).'},

{q:'What is the difference between @Component and @Bean?',
 o:['They are interchangeable','@Component is class-level scanning of your own code; @Bean is a method-level declaration that lets you build and return objects you cannot annotate','@Bean only works in XML','@Component cannot be injected'],a:1,
 e:'@Bean is the way to register third-party classes or objects that need imperative construction logic. @Component is picked up by component scanning for classes you own.'},

{q:'Which stereotype annotation adds exception translation for persistence exceptions?',
 o:['@Service','@Controller','@Component','@Repository'],a:3,
 e:'@Repository activates PersistenceExceptionTranslationPostProcessor, converting vendor-specific exceptions such as SQLException into Spring\'s DataAccessException hierarchy.'},

{q:'What does @Configuration signal to the container?',
 o:['The class is a controller','The class should be excluded from scanning','The class declares bean definitions via @Bean methods, and in full mode it is subclassed to ensure singleton semantics','The class is a test class'],a:2,
 e:'In full mode (proxyBeanMethods=true, the default) the class is enhanced with CGLIB so that calling one @Bean method from another returns the same singleton, not a new instance.'},

{q:'Which annotation registers a bean only when a specified condition is met?',
 o:['@Profile','@Conditional','@DependsOn','@Lazy'],a:1,
 e:'@Conditional takes Condition implementations that inspect the environment, classpath or other beans. @Profile is a convenience built on top of @Conditional.'},

{q:'Which class would you use to bootstrap a container from an XML bean definition file?',
 o:['AnnotationConfigApplicationContext','GenericApplicationContext','FileSystemXmlApplicationContext only','ClassPathXmlApplicationContext'],a:3,
 e:'ClassPathXmlApplicationContext loads XML from the classpath. FileSystemXmlApplicationContext does the same from the filesystem, and AnnotationConfigApplicationContext handles @Configuration classes.'},

{q:'What is the purpose of a BeanFactoryPostProcessor?',
 o:['To post-process bean instances after initialisation','To modify bean definitions before any bean is instantiated','To publish application events','To resolve message bundles'],a:1,
 e:'BeanFactoryPostProcessors run before bean instantiation and can alter definitions. PropertySourcesPlaceholderConfigurer is a classic example that resolves ${...} placeholders in definitions.'},

{q:'What does implementing ApplicationContextAware give a bean?',
 o:['The ability to create child contexts','Access to the ApplicationContext, for example to look up beans programmatically','Automatic transaction management','Automatic AOP proxying'],a:1,
 e:'Aware interfaces let beans receive container infrastructure. Others include BeanNameAware, BeanFactoryAware, EnvironmentAware and ResourceLoaderAware. Prefer injection over Aware where possible.'},

/* ---------- 11–20 : Dependency injection ---------- */
{q:'Which injection style does the Spring team recommend?',
 o:['Constructor injection','Field injection with @Autowired','Setter injection','Static field injection'],a:0,
 e:'Constructor injection makes dependencies explicit, allows fields to be final, guarantees a fully initialised object and makes unit testing trivial without a container.'},

{q:'By what does @Autowired resolve a dependency by default?',
 o:['By bean name','By type, falling back to name when multiple candidates match','By order of registration','By declaration order in the class'],a:1,
 e:'Autowiring is primarily by type. When more than one candidate exists, Spring tries @Primary and then @Qualifier; if still ambiguous, it throws NoUniqueBeanDefinitionException.'},

{q:'What does @Qualifier do?',
 o:['Marks a bean as primary','Declares a bean','Narrows autowiring to a specific named bean when several candidates of the same type exist','Enables caching'],a:2,
 e:'@Qualifier("mysqlDataSource") picks a specific bean by its qualifier value. It is usually combined with @Autowired or as a constructor parameter annotation.'},

{q:'What does @Primary mean on a bean?',
 o:['It is chosen by default when multiple candidates exist for an injection point','It is the only bean allowed','It starts the container','It is created before other beans'],a:0,
 e:'@Primary is the tie-breaker for ambiguity. It does not prevent other beans from being injected via @Qualifier; it just provides a default choice.'},

{q:'How does @Resource differ from @Autowired?',
 o:['They are identical','@Resource is JSR-250 and resolves by name first; @Autowired is Spring-specific and resolves by type first','@Resource only works with setters','@Autowired cannot be used on constructors'],a:1,
 e:'@Resource is part of the standard and uses the field or setter name as the default bean name. @Autowired is Spring\'s annotation and also works on constructors and methods.'},

{q:'What happens with a circular dependency between two beans that both use constructor injection?',
 o:['Spring resolves it automatically','Spring creates both with nulls','Spring retries until it works','The container fails to start with a BeanCurrentlyInCreationException'],a:3,
 e:'Constructor cycles cannot be resolved because neither object can be constructed first. Setter or field injection can break the cycle via early references, but redesigning to remove the cycle is the correct fix.'},

{q:'How do you inject every bean of a given type?',
 o:['Use @Autowired twice','Use a Map of names only','Declare a List<T> or Map<String,T> parameter, and Spring injects all matching beans','It is not possible'],a:2,
 e:'Spring supports collection injection: List<MyStrategy> gives all implementations, and Map<String,MyStrategy> gives them keyed by bean name. This is the idiomatic way to build a strategy registry.'},

{q:'How do you declare an optional dependency?',
 o:['Annotate the class with @Optional','Use @Autowired(required=false), Optional<T>, or @Nullable on the parameter','Use @Lazy','Optional injection is not supported'],a:1,
 e:'For constructor injection, Optional<T> or @Nullable is cleanest. For fields, @Autowired(required=false) leaves the field null when no bean is found.'},

{q:'How do you inject a value from a properties file into a field?',
 o:['@Value("${app.name}")','@Autowired("app.name")','@Property("app.name")','@Resource("app.name")'],a:0,
 e:'@Value supports ${...} placeholders for properties, which are resolved by a PropertySourcesPlaceholderConfigurer, and #{...} for SpEL expressions.'},

{q:'What does @Autowired on a setter method do?',
 o:['Nothing, it is invalid','Marks the setter as a bean definition','Performs setter-based injection when the bean is created','Overrides the field value at runtime'],a:2,
 e:'Method injection via @Autowired on a setter allows dependencies to be provided after construction, which is a common way to break constructor cycles when redesigning is not yet possible.'},

/* ---------- 21–30 : Scopes & lifecycle ---------- */
{q:'Which of the following is NOT a built-in Spring bean scope?',
 o:['singleton','prototype','request','thread'],a:3,
 e:'The standard scopes are singleton, prototype, request, session, application and websocket. A thread scope is not built in; it requires a custom Scope implementation.'},

{q:'A prototype bean is injected into a singleton. How many prototype instances are created?',
 o:['A new one per method call','One, created once when the singleton is initialised','One per request','One per thread'],a:1,
 e:'The singleton resolves its dependencies only once at creation. To get a new prototype per use, inject ObjectProvider, use @Lookup, or apply a scoped proxy.'},

{q:'What does @Lookup do?',
 o:['Performs a database lookup','Finds a bean by name','Provides method injection so a method returns a fresh bean from the container on each call','Caches a bean reference'],a:2,
 e:'@Lookup on an abstract or concrete method lets the container override it to fetch a bean at call time, which is the classic solution for prototype-per-use semantics.'},

{q:'What does injecting an ObjectProvider<T> give you?',
 o:['Lazy, on-demand retrieval of a bean, with optional and streaming access','A direct singleton reference','A proxy for remote calls','A thread-local copy'],a:0,
 e:'ObjectProvider.getObject() resolves at call time, and getIfAvailable/getIfUnique handle optional cases. It is the modern replacement for many @Lookup use cases.'},

{q:'Why is a scoped proxy used with request-scoped beans injected into singletons?',
 o:['To serialise the bean','To inject a proxy that resolves the real request-scoped instance on each call, since a singleton cannot hold a request-bound object','To encrypt the bean','To cache it globally'],a:1,
 e:'Without a proxy, the singleton would capture one request-scoped instance and hold it forever. proxyMode=ScopedProxyMode.TARGET_CLASS creates a subclass proxy that delegates per call.'},

{q:'When does a @PostConstruct method run?',
 o:['Before dependency injection','After the container shuts down','After all dependencies are injected and before any custom init method','Only when the bean is lazy'],a:2,
 e:'The order is: construct, inject dependencies, BeanPostProcessor.postProcessBeforeInitialization, @PostConstruct, InitializingBean.afterPropertiesSet, custom init-method, then postProcessAfterInitialization.'},

{q:'What is the role of a BeanPostProcessor?',
 o:['To modify bean definitions before instantiation','To create bean definitions','To replace the ApplicationContext','To post-process bean instances before and after initialisation callbacks, enabling features such as AOP proxying and @Autowired'],a:3,
 e:'Autowiring, annotation processing and AOP advice all run through BeanPostProcessors. They operate on instances, whereas BeanFactoryPostProcessors operate on definitions.'},

{q:'Which callbacks run when a singleton bean is destroyed at container shutdown?',
 o:['Only finalize()','@PreDestroy, then DisposableBean.destroy(), then a custom destroy-method','@PostConstruct again','Nothing by default'],a:1,
 e:'Prototype beans are not managed after creation, so destroy callbacks never run for them. Only singletons (and other managed scopes) receive @PreDestroy and destroy callbacks.'},

{q:'What does @Lazy on a bean definition do?',
 o:['Defers bean creation until it is first requested instead of at container startup','Makes the bean thread-local','Disables autowiring','Skips the post-processors'],a:0,
 e:'@Lazy can also be placed on an injection point, where it injects a proxy and defers resolution until first use, which is a useful tool for breaking some circular dependencies.'},

{q:'What does @DependsOn("otherBean") guarantee?',
 o:['That otherBean is injected','That otherBean is initialised before this bean, without implying a runtime dependency','That otherBean is destroyed first','Nothing; it is documentation only'],a:1,
 e:'It is about initialisation order rather than injection, and is typically used for beans that must start after something else, such as a cache warmer or a schema initialiser.'},

/* ---------- 31–40 : AOP ---------- */
{q:'What problem does Spring AOP primarily solve?',
 o:['Database migration','Applying cross-cutting concerns such as logging, security, transactions and caching without scattering code through business logic','Distributed tracing','Class loading'],a:1,
 e:'AOP centralises behaviour that would otherwise be duplicated across many methods, keeping business logic focused and making the concern configurable in one place.'},

{q:'Which advice type can control whether the target method executes at all?',
 o:['@Around','@Before','@After','@AfterReturning'],a:0,
 e:'Only @Around receives a ProceedingJoinPoint and decides whether to call proceed(). It can short-circuit, retry, time or alter the return value of the invocation.'},

{q:'What does the pointcut `execution(* com.example.service.*.*(..))` match?',
 o:['All classes in the package','Only constructors','Any method in any class directly in com.example.service, with any return type and any arguments','Only public methods of interfaces'],a:2,
 e:'execution is the most common pointcut designator: modifiers, return type, declaring type, method name and parameter pattern, in that order.'},

{q:'For a bean that implements an interface, which proxy does Spring AOP create by default in plain Spring Framework?',
 o:['A CGLIB subclass','A JDK dynamic proxy that implements the bean\'s interfaces','A bytecode-rewritten class','A static proxy'],a:1,
 e:'Plain Spring Framework defaults to JDK proxies when the target implements an interface, because no extra dependency is needed. proxyTargetClass=true forces CGLIB subclassing.'},

{q:'Why does calling an advised method from within the same class bypass the advice?',
 o:['Because the method is private','Because Spring ignores internal calls','Because advice only applies to static methods','Because the call does not go through the proxy — it is a direct this invocation'],a:3,
 e:'Self-invocation is a this call on the target object, not on the proxy, so no advice and no @Transactional interception happens. Refactor into another bean or inject a self-reference.'},

{q:'Which annotation enables @AspectJ-style annotation-based AOP in a plain Spring context?',
 o:['@EnableAspectJAutoProxy','@EnableAop','@EnableAutoProxy','@AspectScan'],a:0,
 e:'@EnableAspectJAutoProxy registers AnnotationAwareAspectJAutoProxyCreator. In XML it is the <aop:aspectj-autoproxy/> element.'},

{q:'What is the difference between JoinPoint and ProceedingJoinPoint?',
 o:['They are identical','ProceedingJoinPoint adds proceed() and is only available to @Around advice; JoinPoint exposes method signature and arguments to all advice types','JoinPoint is only for @Before','ProceedingJoinPoint is for @AfterReturning'],a:1,
 e:'If you need to invoke the target, you need @Around and a ProceedingJoinPoint. Other advice types receive a read-only JoinPoint.'},

{q:'How do you control the order in which two aspects apply to the same method?',
 o:['Declare them in alphabetical order','Use @Priority on the class','Annotate the aspect with @Order or implement Ordered, with lower values having higher precedence','Aspects cannot be ordered'],a:2,
 e:'@Order(1) wraps @Order(2), so the lower number is the outermost advice. Without explicit order, the result depends on discovery order and is not reliable.'},

{q:'What does the pointcut `@annotation(com.example.Loggable)` match?',
 o:['Classes annotated with Loggable','Methods annotated with Loggable','Fields annotated with Loggable','Packages named Loggable'],a:1,
 e:'@annotation matches join points whose method carries the annotation. @within matches the declaring type, and @target matches the runtime type of the target object.'},

{q:'When does Spring AOP weave advice into a bean?',
 o:['At runtime, by wrapping the bean in a proxy during creation','At compile time with the AspectJ compiler','At class load time with a Java agent','At build time'],a:0,
 e:'Spring AOP is proxy-based and weaves at bean creation. Full AspectJ weaving (compile-time or load-time) supports join points Spring AOP cannot, such as field access and constructors.'},

/* ---------- 41–55 : Spring MVC ---------- */
{q:'What role does DispatcherServlet play in Spring MVC?',
 o:['It renders JSP pages directly','It is the front controller that receives every request and dispatches it to the appropriate handler','It manages database connections','It performs authentication'],a:1,
 e:'DispatcherServlet orchestrates the request: handler mapping, handler adapter, argument resolution, method invocation, return value handling, view resolution and exception handling.'},

{q:'What is the difference between @Controller and @RestController?',
 o:['They are the same','@RestController is only for JSON','@RestController is @Controller plus @ResponseBody, so return values are written to the response body rather than resolved as views','@Controller cannot return objects'],a:2,
 e:'@RestController is a composed annotation that saves annotating every method with @ResponseBody. It is commonly used for REST APIs but is not limited to JSON.'},

{q:'What is the difference between @RequestParam and @PathVariable?',
 o:['@RequestParam binds a query-string or form parameter; @PathVariable binds a URI template variable such as /users/{id}','They are identical','@PathVariable works only for POST','@RequestParam requires a body'],a:0,
 e:'@PathVariable extracts the {id} segment from the mapping. @RequestParam reads ?page=2 style parameters and also form-encoded bodies in non-multipart requests.'},

{q:'Which annotation binds the HTTP request body to a method parameter, typically as JSON?',
 o:['@ModelAttribute','@RequestParam','@PathVariable','@RequestBody'],a:3,
 e:'@RequestBody uses an HttpMessageConverter, such as Jackson, to deserialise the body. It should be combined with @Valid when you want bean validation applied.'},

{q:'What does @ModelAttribute do?',
 o:['Serialises the return value to JSON','Binds request parameters to a model object and adds it to the model for view rendering','Reads the raw body','Declares a URI variable'],a:1,
 e:'It is the classic form-binding approach for server-side rendered views. The bound object is exposed to the view under its attribute name.'},

{q:'What does @ResponseBody indicate?',
 o:['The method returns a view name','The request has no body','The return value should be written directly to the response body via an HttpMessageConverter','The method is asynchronous'],a:2,
 e:'@ResponseBody bypasses view resolution. With a class-level @RestController you get it implicitly on every handler method.'},

{q:'What is the job of a ViewResolver?',
 o:['To map a logical view name returned by a handler to a concrete View implementation, such as a JSP or Thymeleaf template','To resolve bean dependencies','To resolve request parameters','To resolve database queries'],a:0,
 e:'InternalResourceViewResolver maps "home" to /WEB-INF/views/home.jsp using prefix and suffix. Returning a @ResponseBody bypasses this step entirely.'},

{q:'What is a HandlerInterceptor used for?',
 o:['Replacing the DispatcherServlet','Running cross-cutting logic before, after and after-completion of handler execution, such as authentication or logging','Mapping URLs to methods','Rendering views'],a:1,
 e:'preHandle, postHandle and afterCompletion form the interceptor lifecycle. Unlike a filter, an interceptor runs inside the DispatcherServlet and has access to the handler.'},

{q:'Which class-level annotation centralises exception handling across controllers?',
 o:['@ExceptionHandler','@ControllerAdvice','@RestController','@InitBinder'],a:1,
 e:'@ControllerAdvice combined with @ExceptionHandler methods applies handling globally. @RestControllerAdvice is the same with an implicit @ResponseBody.'},

{q:'Which parameter type receives an uploaded file in a controller?',
 o:['java.io.File','byte[] only','org.springframework.web.multipart.MultipartFile','java.nio.Path'],a:2,
 e:'MultipartFile gives access to the original filename, content type, size and bytes, plus transferTo. Multipart support must be enabled with a MultipartResolver.'},

{q:'What does @SessionAttributes do?',
 o:['Creates an HTTP session','Keeps a model attribute in the HTTP session across requests for the controller','Stores data in a database','Configures cookie settings'],a:1,
 e:'It is a convenient way to carry a form-backing object across a multi-step flow. For anything larger, manage the session explicitly or use a dedicated conversation scope.'},

{q:'A controller returns "redirect:/orders". What happens?',
 o:['The browser is instructed to issue a new request to /orders, changing the URL','The server forwards internally to /orders without changing the URL','A 404 is returned','The view is rendered directly'],a:0,
 e:'"redirect:" triggers a 302 with a Location header. "forward:" performs a server-side forward, preserving the original URL and request attributes.'},

{q:'What is content negotiation in Spring MVC?',
 o:['Negotiating database transactions','Choosing the response representation (JSON, XML, HTML) based on the Accept header, URL extension or a configured strategy','Selecting a controller','Validating content length'],a:1,
 e:'@RequestMapping(produces=...) and the Accept header drive which handler and HttpMessageConverter are used. @ResponseStatus and ResponseEntity let you control status codes precisely.'},

{q:'Without web.xml, how do you register DispatcherServlet in a Servlet 3+ container?',
 o:['It is automatic, no registration is needed','By editing server.properties','By extending AbstractAnnotationConfigDispatcherServletInitializer or implementing WebApplicationInitializer','By using a context-param only'],a:2,
 e:'Spring provides WebApplicationInitializer implementations detected by ServletContainerInitializer. AbstractAnnotationConfigDispatcherServletInitializer lets you supply root and servlet configuration classes in Java.'},

{q:'What does @CrossOrigin enable on a controller or handler?',
 o:['Cross-database queries','CORS headers so browsers allow cross-origin requests to the endpoint','Cross-cluster replication','Cross-field validation'],a:1,
 e:'It configures Access-Control-Allow-Origin and related headers. For application-wide policy, a CorsConfigurationSource bean or a WebMvcConfigurer is usually preferable.'},

/* ---------- 56–70 : Data access & transactions ---------- */
{q:'What is JdbcTemplate for?',
 o:['A helper that removes JDBC boilerplate — connection handling, statement creation, resource cleanup and exception translation','An ORM','A connection pool','A migration tool'],a:0,
 e:'JdbcTemplate executes SQL and maps rows with a RowMapper or ResultSetExtractor, translating SQLException into DataAccessException. It leaves transaction management to Spring.'},

{q:'What is a RowMapper used for?',
 o:['To map URL routes','To map a request body','To convert one row of a ResultSet into an object','To map exceptions'],a:2,
 e:'RowMapper.mapRow(ResultSet, int) is called once per row. ResultSetExtractor handles the whole ResultSet and is appropriate for aggregated results.'},

{q:'How is @Transactional implemented in Spring?',
 o:['By the database driver automatically','By an AOP proxy that begins, commits or rolls back the transaction around the advised method','By a bytecode agent','By a JVM flag'],a:1,
 e:'Because it is proxy-based, only calls through the proxy are intercepted. Self-invocation and private methods are not advised, which is why @Transactional appears to "do nothing" in those cases.'},

{q:'What is the default propagation of @Transactional?',
 o:['REQUIRES_NEW','SUPPORTS','MANDATORY','REQUIRED'],a:3,
 e:'REQUIRED joins an existing transaction if one exists and creates one otherwise. It is the default for good reason: most service methods should participate in the caller\'s unit of work.'},

{q:'Which propagation always suspends any existing transaction and starts a brand-new one?',
 o:['REQUIRES_NEW','REQUIRED','NESTED','SUPPORTS'],a:0,
 e:'REQUIRES_NEW is used for audit logging or out-of-band writes that must commit even if the caller rolls back. NESTED uses a savepoint instead of a separate transaction.'},

{q:'By default, which exceptions cause a @Transactional method to roll back?',
 o:['All exceptions','Only checked exceptions','Unchecked exceptions (RuntimeException) and Error','Only SQLException'],a:2,
 e:'Checked exceptions commit by default, which surprises many developers. Use @Transactional(rollbackFor=Exception.class) when you need every exception to roll back.'},

{q:'A @Transactional method calls another @Transactional method on the same bean. What happens?',
 o:['The second method joins the transaction normally','No transaction advice applies to the inner call because it bypasses the proxy','The transaction is automatically committed','A new transaction is always started'],a:1,
 e:'This is the classic self-invocation pitfall. Move the inner method to another bean, inject a self-reference, or use TransactionTemplate to make the transaction boundary explicit.'},

{q:'Which annotation enables annotation-driven transaction management in a plain Spring context?',
 o:['@EnableTransactions','@EnableTransactional','@Transactional','@EnableTransactionManagement'],a:3,
 e:'@EnableTransactionManagement registers the infrastructure that proxies @Transactional beans. A PlatformTransactionManager bean must also be configured.'},

{q:'Which abstraction does Spring use to manage transactions across different resources?',
 o:['PlatformTransactionManager','DataSource','SessionFactory','ConnectionPool'],a:0,
 e:'Implementations include DataSourceTransactionManager for JDBC, JpaTransactionManager for JPA and JtaTransactionManager for distributed transactions across resources.'},

{q:'What is the effect of @Transactional(readOnly = true)?',
 o:['It makes the database read-only permanently','It is only a hint that lets the provider optimise (for example skip dirty checking in Hibernate) and may route to a read replica','It blocks all writes','It disables the transaction'],a:1,
 e:'It is advisory. The database still enforces permissions. In Hibernate it can skip dirty checking, which measurably improves the performance of read-heavy service methods.'},

{q:'Why is @Repository recommended on DAO classes?',
 o:['It enables transactions automatically','It triggers exception translation so vendor exceptions become Spring\'s DataAccessException hierarchy','It creates a connection pool','It enables caching'],a:1,
 e:'Having a consistent unchecked exception hierarchy means service code can catch DataAccessException without depending on a specific database driver.'},

{q:'When would you use NamedParameterJdbcTemplate over JdbcTemplate?',
 o:['When you need transactions','When you need batch inserts only','When using :name placeholders to make queries with many parameters readable and safe','When using stored procedures'],a:2,
 e:'Named parameters avoid positional mismatch bugs when the same parameter appears several times. Both classes use PreparedStatement under the hood, so both prevent SQL injection.'},

{q:'What does `jdbcTemplate.queryForObject(sql, Integer.class)` return?',
 o:['A single value of the requested type, throwing if zero or more than one row is returned','A list of values','A ResultSet','Null always'],a:0,
 e:'queryForObject requires exactly one row. Use queryForList or query when the result may be empty or contain multiple rows, otherwise you get an IncorrectResultSizeDataAccessException.'},

{q:'What does @Transactional(timeout = 5) mean?',
 o:['Wait 5 seconds before starting','The transaction is rolled back if it runs longer than 5 seconds, enforced by the transaction manager','Commit every 5 seconds','The connection pool waits 5 seconds'],a:1,
 e:'The timeout is applied to the underlying transaction. Enforcement depends on the resource; JDBC uses the statement timeout, and some providers only honour it best-effort.'},

/* ---------- 71–80 : SpEL, validation, events ---------- */

{q:'Which syntax resolves a property placeholder such as a value from a properties file?',
 o:['#{...}','%{...}','@{...}','${...}'],a:3,

{q:'What is the difference between @Valid and @Validated?',
 o:['They are identical','@Valid is JSR-303 standard and triggers validation; @Validated is Spring-specific and additionally supports validation groups','@Validated only works on fields','@Valid cannot be used on method parameters'],a:1,
 e:'@Validated on a class enables method-level validation via an AOP proxy. Use @Valid or @Validated with groups to control which constraints run for a given flow.'},

{q:'Which annotation triggers bean validation on a @RequestBody parameter in Spring MVC?',
 o:['@Checked','@NotNull','@Valid','@Verified'],a:2,
 e:'Add @Valid next to @RequestBody and Spring will run the JSR-303/380 validator. Combine it with a MethodArgumentNotValidException handler to return structured errors.'},

{q:'How do you publish a custom application event?',
 o:['Call ApplicationEventPublisher.publishEvent(event)','Call event.fire()','Annotate the event with @Publish','Return it from a controller'],a:0,
 e:'Inject ApplicationEventPublisher and call publishEvent. Events published inside a transaction can be observed after commit with @TransactionalEventListener.'},

{q:'Which annotation subscribes a method to application events?',
 o:['@Subscribe','@Handler','@OnEvent','@EventListener'],a:3,
 e:'@EventListener resolves the event type from the method parameter. The method can also declare a condition using a SpEL condition attribute, or be declared async with @Async.'},

{q:'What is the advantage of @TransactionalEventListener over @EventListener?',
 o:['It runs synchronously','It lets you bind the listener to a transaction phase such as AFTER_COMMIT, so the handler only runs if the transaction commits','It supports multiple event types','It is faster'],a:1,
 e:'This is the standard pattern for sending emails or publishing to a broker after a successful database commit, avoiding the classic "action taken but transaction rolled back" bug.'},

{q:'How do you inject a classpath resource as a Resource field?',
 o:['@Value("classpath:config/app.properties") into a Resource field','@Resource("file")','@Autowired("classpath:app.properties")','Use new File()'],a:0,
 e:'@Value supports classpath:, file:, http: and similar prefixes, and the result can be injected as a Resource, InputStream or byte array depending on the field type.'},

{q:'What is MessageSource used for?',
 o:['Internationalised messages with locale resolution, typically backed by messages.properties files','Sending emails','Logging','Converting JSON'],a:0,
 e:'MessageSource.getMessage(code, args, locale) resolves text from bundles. ApplicationContext implements MessageSource, so it can be injected directly.'},

{q:'What does ResourceLoader let a bean do?',
 o:['Load database records','Resolve Resource handles such as classpath and file locations without hard-coding a class','Load bean definitions','Load plugins'],a:1,
 e:'ResourceLoader.getResource("classpath:app.properties") returns a Resource you can check for existence and open as a stream. ApplicationContext implements this interface.'},

/* ---------- 81–90 : Configuration & container details ---------- */
{q:'What does @Configuration(proxyBeanMethods = false) change?',
 o:['It makes the class abstract','It skips CGLIB subclassing, so inter-bean method calls create new instances instead of returning the shared singleton','It disables bean definitions','It enables XML parsing'],a:1,

{q:'What does @Import do in a configuration class?',

{q:'What does @PropertySource do?',
 o:['Adds a properties file to the Environment so ${...} placeholders can resolve from it','Creates a database source','Declares a bean','Adds a package to scanning'],a:0,

{q:'What does @Profile("dev") do on a bean or configuration class?',
 o:['Enables debug logging','Sets the JVM profile','Registers the bean only when the specified profile is active','Marks the bean as primary'],a:2,
 e:'Profiles are activated via the environment, for example spring.profiles.active as a system property or context parameter. It is a common way to swap data sources between environments.'},

{q:'Which interface gives programmatic access to properties, profiles and system environment?',
 o:['PropertySource','Environment','ApplicationContext','BeanFactory'],a:1,
 e:'Environment extends PropertyResolver and exposes getProperty, getActiveProfiles and acceptsProfiles. It is the preferred API for runtime configuration lookups.'},

{q:'What does implementing FactoryBean<T> let you do?',
 o:['Create a factory for unrelated beans','Replace the ApplicationContext','Produce an object via getObject() while the bean itself participates in lifecycle callbacks and can be looked up with an & prefix','Register bean post-processors'],a:2,
 e:'FactoryBean is how Spring integrates with frameworks that produce objects imperatively, such as SqlSessionFactoryBean. getObject() returns the product; "&beanName" returns the factory.'},

{q:'What is the correct order of Spring bean initialisation callbacks?',
 o:['Constructor → dependency injection → postProcessBeforeInitialization → @PostConstruct → afterPropertiesSet → custom init-method → postProcessAfterInitialization','@PostConstruct → constructor → injection','afterPropertiesSet → injection → @PostConstruct','postProcessAfterInitialization → @PostConstruct → constructor'],a:0,
 e:'Knowing this order matters when debugging "why is my field still null in @PostConstruct". AOP proxies are typically created in the after-initialisation phase.'},

{q:'How does @ComponentScan know what to scan?',
 o:['It always scans the whole classpath','It scans the package of the annotated class and its subpackages by default','It scans only the current directory','It scans packages listed in pom.xml'],a:1,
 e:'basePackages, basePackageClasses and includeFilters/excludeFilters give control. Using basePackageClasses avoids fragile string package names when refactoring.'},

{q:'What does calling ApplicationContext.refresh() do?',
 o:['Restarts the JVM','Completes container startup: loads definitions, instantiates non-lazy singletons, starts lifecycle beans and publishes ContextRefreshedEvent','Clears the bean cache','Reloads properties only'],a:1,
 e:'refresh() is the standard bootstrap sequence, called by constructors of the concrete contexts. Calling it twice on the same context throws IllegalStateException.'},

{q:'What does @ImportResource do?',
 o:['Imports a Java class','Imports a resource bundle','Loads bean definitions from an XML file into a Java-based configuration','Imports a database script'],a:2,

{q:'What does @ContextConfiguration do in a Spring test?',

{q:'What is @TestConfiguration for?',

{q:'What is the difference between BeanFactory and FactoryBean?',

{q:'Two BeanPostProcessors both apply to a bean. How is their order determined?',

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Framework Mock Test — Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
