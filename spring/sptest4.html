<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Framework Mock Test — Set 4 · 100 MCQs</title>
<meta name="description" content="100 advanced Spring Framework MCQs (no Spring Boot): XML bean-definition internals, component-scanning internals, conversion and type internals, BeanWrapper, i18n, task executors, view resolvers, message converters, MVC async, static resources, form tags, content negotiation, handler mapping, AOP proxy internals, @Bean attributes and testing utilities.">
<style>
  :root{
    --brand:#15803d;
    --brand-dark:#052e16;
    --accent:#4ade80;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#052e16;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#dcfce7;border-color:#bbf7d0}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(21,128,61,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdf4}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#dcfce7}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🌲 Spring Framework Mock Test <span class="setpill">SET 4 · NO BOOT</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SPRING FRAMEWORK SET 4 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : XML configuration & bean definition internals ---------- */
{q:"What does marking a bean definition as abstract in XML mean?",
 o:["It creates a Java abstract class instance","It excludes the bean from autowiring","It is a bean definition used only as a template for other definitions and is never instantiated","It creates the bean lazily"],
 a:2,
 e:"Setting abstract=\"true\" (or AbstractBeanDefinition.setAbstract(true)) marks a definition as a template. The container refuses to instantiate it, and child definitions inherit its metadata."},

{q:"What does the parent attribute on a <bean> element do?",
 o:["It creates a Java class inheritance hierarchy","It lets a bean definition inherit property values and constructor arguments from another definition, without Java inheritance","It defines the parent ApplicationContext","It only works with abstract beans"],
 a:1,
 e:"The parent attribute references another bean definition by id or name and inherits its properties, constructor args, scope and lazy-init settings. Child definitions can override individual values."},

{q:"What does the factory-method attribute do when used without factory-bean?",
 o:["It invokes an instance method on another bean","It creates a FactoryBean","It configures a BeanFactoryPostProcessor","It calls a static method on the declared class to create the bean instead of a constructor"],
 a:3,
 e:"<bean id=\"x\" class=\"X\" factory-method=\"create\"/> calls the static create() method on X. The return type can be any class, not necessarily the declared one."},

{q:"How do you call a non-static factory method that lives on another bean?",
 o:["factory-bean names the bean that hosts the instance factory method, and factory-method names the method","factory-bean only works with static methods","factory-method alone is enough","It requires a FactoryBean implementation"],
 a:0,
 e:"When the factory method is an instance method, the container must first obtain the factory bean. factory-bean gives its name, factory-method gives the method to invoke on it."},

{q:"What does the <lookup-method> element do?",
 o:["It replaces the method with a no-op","It looks up a bean by name once","It is the XML equivalent of @Lookup and lets a bean obtain a fresh instance of a target bean on each call","It only works with singleton beans"],
 a:2,
 e:"<lookup-method name=\"createCommand\" bean=\"command\"/> makes the container generate a subclass that overrides the method to fetch the bean each time. It is the XML form of method injection."},

{q:"What does <replaced-method> together with a MethodReplacer allow?",
 o:["It replaces a method's implementation with a MethodReplacer at runtime","It replaces a bean definition","It replaces the return type","It replaces a constructor"],
 a:0,
 e:"<replaced-method name=\"compute\" replacer=\"myReplacer\"/> requires a bean implementing MethodReplacer. Its reimplement method receives the target, method and arguments, and returns the new result."},

{q:"What does the p: namespace provide in XML configuration?",
 o:["A namespace for profiles","A namespace for persistence","A namespace for prototypes","A shorthand for property injection using attributes such as p:name=\"value\""],
 a:3,
 e:"After declaring xmlns:p=\"http://www.springframework.org/schema/p\", you can write <bean class=\"X\" p:name=\"Sam\" p:age=\"30\"/>, which is equivalent to nested <property> elements."},

{q:"What do the init-method and destroy-method attributes on a <bean> element specify?",
 o:["They specify the bean class","They specify constructor arguments","They specify the scope","They name lifecycle callback methods invoked after construction and before destruction"],
 a:3,
 e:"They are the XML alternatives to @PostConstruct and DisposableBean. The container calls init-method after dependency injection, and destroy-method on shutdown for singletons."},

{q:"What does the <alias> element do?",
 o:["It creates a second bean with the same class","It clones the bean instance","It registers an additional name for an existing bean","It creates a second ApplicationContext"],
 a:2,
 e:"<alias name=\"from\" alias=\"to\"/> adds another name for the same bean definition, not a second instance. The @Bean annotation can also declare aliases through its name attribute."},

{q:"What is the difference between the id and name attributes on a <bean> element?",
 o:["They are identical","The id must be a valid XML ID; name accepts a list of names and can include characters that are invalid in an XML ID","name is deprecated","id can hold multiple names"],
 a:1,
 e:"id is constrained by XML ID rules. name is more permissive, accepts comma- or semicolon-separated names, and is how you declare aliases inline. Both become bean names internally."},

/* ---------- 11–18 : Component scanning internals ---------- */
{q:"Which class actually performs classpath component scanning?",
 o:["A BeanPostProcessor","A DataSource factory","ClassPathScanningCandidateComponentProvider","A message converter"],
 a:2,
 e:"It walks the classpath and applies include and exclude filters. @ComponentScan configures it through the ConfigurationClassPostProcessor, and it returns BeanDefinitions without instantiating anything."},

{q:"What is the role of MetadataReader during component scanning?",
 o:["It reads properties files","It exposes class metadata without loading the class, using ASM","It reads JDBC metadata","It reads message bundles"],
 a:1,
 e:"The scanner uses MetadataReader so it can inspect annotations on candidate classes without loading them into the JVM. This keeps startup fast and avoids side effects from static initialisers."},

{q:"What does AnnotationTypeFilter match?",
 o:["It filters by regular expression","It filters by class name","It filters by interface","It matches candidates annotated with a given annotation, including via meta-annotations"],
 a:3,
 e:"It is why @Service, @Repository and custom stereotypes work: the filter resolves merged annotations. AssignableTypeFilter matches by type, RegexPatternTypeFilter matches by class name pattern."},

{q:"What does AssignableTypeFilter match?",
 o:["Classes that are assignable to a given type","Classes with a given annotation","Classes matching a regular expression","Classes with a given bean name"],
 a:0,
 e:"It is used to scan all implementations of an interface or subclasses of a base class. CompositeTypeFilter and combineWith let you build compound filters."},

{q:"What does RegexPatternTypeFilter match?",
 o:["Classes with a given annotation","Classes assignable to a type","The fully qualified class name against a regular expression","Only classes in a specific package"],
 a:2,
 e:"The pattern is applied to the class name from the metadata. AspectJTypeFilter is a more expressive alternative that uses AspectJ type patterns."},

{q:"What does the nameGenerator attribute on @ComponentScan control?",
 o:["It generates the bean class","It generates the scope","It generates aliases only","It controls how bean names are generated for scanned components, defaulting to AnnotationBeanNameGenerator"],
 a:3,
 e:"AnnotationBeanNameGenerator decapitalises the short class name or uses the stereotype annotation value. FullyQualifiedAnnotationBeanNameGenerator uses the fully qualified class name."},

{q:"What does setting useDefaultFilters = false on @ComponentScan do?",
 o:["It disables all filters","It enables all filters","It has no effect","It disables the default stereotype filters, so only explicit include filters contribute candidates"],
 a:3,
 e:"With useDefaultFilters = false, the @Component, @ManagedBean and @Named detection is turned off. Frameworks use this to restrict scanning to a small set of annotations."},

{q:"What does the @Indexed annotation do?",
 o:["It creates a database index","It indexes the bean in the container","It marks the class for inclusion in a JPA index used to speed up persistence-unit scanning","It creates a cache index"],
 a:2,
 e:"The JPA spec requires scanning every class in a persistence unit, which is slow at scale. @Indexed lets the persistence provider read a prebuilt list from META-INF instead."},

/* ---------- 19–28 : Conversion & type internals ---------- */
{q:"What does TypeDescriptor describe?",
 o:["A database column","A class for conversion and binding, including its generics and annotations","A bean definition","A property file"],
 a:1,
 e:"TypeDescriptor is the key abstraction for conversion because it carries the annotations on the source field or parameter, for example @DateTimeFormat, which ConditionalConverter implementations inspect."},

{q:"What does ResolvableType provide?",
 o:["It resolves bean definitions","It resolves property files","It resolves annotations","Generics-aware type information used for generic injection points and generic return types"],
 a:3,
 e:"ResolvableType.forClass, forMethodReturnType, forField and forInstance let Spring reason about type parameters at runtime, which a plain Class object cannot express."},

{q:"What does a ConverterFactory do?",
 o:["It creates a Converter for a specific source/target pair, typically for a family of types sharing a base type","It is a factory for Converter beans","It replaces the Converter interface","It creates the ConversionService"],
 a:0,
 e:"getConverter(targetType) returns a specialised Converter. This is how Spring handles String to any enum or any Collection subtype with a single implementation."},

{q:"What does GenericConverter support that Converter does not?",
 o:["Nothing, they are the same","It only converts to String","It handles multiple source and target type pairs and can access TypeDescriptor","It is deprecated"],
 a:2,
 e:"getConvertibleTypes returns the pairs it can handle, and convert receives both source and target TypeDescriptor. It is the most flexible converter abstraction."},

{q:"What does DefaultFormattingConversionService add over a plain conversion service?",
 o:["It is a date formatter","It only converts strings to numbers","It is a BeanPostProcessor","It combines the default conversion service with default formatters for numbers and dates, including JSR-310"],
 a:3,
 e:"It is the base for ApplicationConversionService and the MVC conversion service, and it can be customised by adding converters and formatters."},

{q:"What does ApplicationConversionService add over DefaultFormattingConversionService?",
 o:["It is a bean factory","It is a message source","It is a resource loader","It is a conversion service that adds Spring-specific converters and formatters"],
 a:3,
 e:"It registers converters for Spring types such as Resource, MimeType, Duration and DataSize, so String values can be converted directly to those types."},

{q:"What does ConditionalGenericConverter combine?",
 o:["A converter that only runs on weekdays","GenericConverter with ConditionalConverter, so it is selected only when the TypeDescriptor conditions match","A converter that only runs in tests","A converter that is disabled by default"],
 a:1,
 e:"This is how format-annotation-driven converters work: @DateTimeFormat on a field decides whether the date converter applies for that specific field or parameter."},

{q:"What does GenericTypeResolver do?",
 o:["It resolves bean names","It resolves annotations","It resolves generic types against a concrete class, used for dependency injection by generics","It resolves message codes"],
 a:2,
 e:"It is how @Autowired can distinguish List<Foo> from List<Bar>, and how ResolvableType is constructed for each injection point."},

{q:"What does TypeDescriptor.getAnnotations return?",
 o:["The annotations attached to this TypeDescriptor's type, which converters can inspect","The package annotations","A list of methods","The superclass"],
 a:0,
 e:"TypeDescriptor can carry annotations from the field, parameter or method it describes. That is how @DateTimeFormat, @NumberFormat and custom format annotations are honoured during binding."},

{q:"What does ClassUtils.isAssignable provide over Class.isAssignableFrom?",
 o:["It checks whether a class implements an interface","It converts a class to a string","It creates a class instance","It checks whether a source type can be assigned to a target type, and is null-safe"],
 a:3,
 e:"isAssignable(value, type) takes an instance and isAssignable(Class, Class) takes types; both handle null gracefully, unlike Class.isAssignableFrom."},

/* ---------- 29–33 : BeanWrapper & property editing ---------- */
{q:"What does BeanWrapper provide?",
 o:["It wraps a DataSource","It wraps a bean and provides property access with type conversion and nested property navigation","It wraps a bean definition","It wraps a message source"],
 a:1,
 e:"BeanWrapperImpl uses a ConversionService and PropertyEditors to set nested properties such as address.city, which is exactly how DataBinder applies request parameters."},

{q:"What is a PropertyEditor?",
 o:["It is a Spring-specific interface","It is a BeanPostProcessor","It is a java.beans interface used to convert values to and from String, used by Spring binding","It is a UI editor"],
 a:2,
 e:"PropertyEditor is legacy but still used. Custom editors are registered with CustomEditorConfigurer or DataBinder.registerCustomEditor. Converter and Formatter are the modern alternatives."},

{q:"What does CustomEditorConfigurer do?",
 o:["It configures a custom DataBinder","It is a BeanFactoryPostProcessor that registers PropertyEditor implementations for binding","It creates custom beans","It disables default editors"],
 a:1,
 e:"It applies before bean instances are created, which is why the editors are available for all subsequent binding. DataBinder.registerCustomEditor is the per-binder alternative."},

{q:"What does PropertyDescriptor describe?",
 o:["A database column","A bean definition","A message code","A JavaBean property, including its getter, setter and property type"],
 a:3,
 e:"Spring's BeanWrapperImpl uses PropertyDescriptor to introspect the properties of a bean and to know the target type that a conversion needs to produce."},

{q:"What does BeanWrapper.setPropertyValue(\"address.city\", \"Paris\") do?",
 o:["It sets a property by name, with type conversion and nested path navigation","It sets the bean class","It sets the scope","It sets the autowire mode"],
 a:0,
 e:"Nested path navigation is the key feature. The wrapper resolves address on the bean, then city on that object, converting the String to the target type via the configured ConversionService."},

/* ---------- 34–40 : i18n & locale ---------- */
{q:"What does ResourceBundleMessageSource load messages from?",
 o:["YAML files","Standard java.util.ResourceBundle files","A database","Redis"],
 a:1,
 e:"It is the classic MessageSource. ResourceBundle properties files must be ISO-8859-1 or escaped, and they cannot be reloaded at runtime."},

{q:"What does ReloadableResourceBundleMessageSource add over ResourceBundleMessageSource?",
 o:["It is identical","It only reads from the classpath","It loads from any Spring Resource, supports caching and reloading, and can read UTF-8 properties","It cannot be used in a web application"],
 a:2,
 e:"cacheSeconds enables reloading at runtime and defaultEncoding supports UTF-8. The trade-off is that it does not use standard ResourceBundle, so bundle inheritance behaves differently."},

{q:"What does AcceptHeaderLocaleResolver do?",
 o:["It resolves the locale from the Accept-Language header and is the default","It resolves from a session attribute","It resolves from a cookie","It resolves from a query parameter"],
 a:0,
 e:"It is read-only: it cannot be changed at runtime because it has no setLocale implementation. Use SessionLocaleResolver or CookieLocaleResolver if the user must switch language."},

{q:"What does SessionLocaleResolver do?",
 o:["It stores locale in a cookie","It stores locale in a database","It reads the Accept-Language header","It stores the locale in the HTTP session and supports setLocale"],
 a:3,
 e:"Because it supports setLocale, it works with LocaleChangeInterceptor for a language-switch link. It requires an HTTP session, so it is stateful."},

{q:"What does CookieLocaleResolver do?",
 o:["It stores locale in a session","It stores locale in a cookie, with configurable name, max age and path","It stores locale in a database","It reads the Accept-Language header"],
 a:1,
 e:"It is stateless on the server. You can also configure secure and http-only flags, which makes it a good choice for public sites that must scale horizontally."},

{q:"What does LocaleChangeInterceptor do?",
 o:["It changes the locale on every request","It changes the default locale","It changes the locale based on a configurable request parameter, typically lang","It changes the timezone"],
 a:2,
 e:"Combined with a mutable LocaleResolver such as SessionLocaleResolver or CookieLocaleResolver, it makes a language switcher a one-line configuration."},

{q:"What is DelegatingMessageSource?",

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Framework Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
