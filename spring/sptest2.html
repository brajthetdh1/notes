<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Framework Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 advanced Spring Framework MCQs (no Spring Boot): container internals, BeanDefinition API, meta-annotations, environment and conversion, AOP internals, MVC extension points, JDBC, transaction internals, caching, async, scheduling, SpEL, validation and testing.">
<style>
  :root{
    --brand:#3f6212;
    --brand-dark:#1a2e05;
    --accent:#a3e635;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#1a2e05;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ecfccb;border-color:#d9f99d}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(63,98,18,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f7fee7}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ecfccb}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🌿 Spring Framework Mock Test <span class="setpill">SET 2 · NO BOOT</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SPRING FRAMEWORK SET 2 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Container internals ---------- */
{q:'Which class is the default BeanFactory implementation that most Spring contexts build on?',
 o:['DefaultBeanFactory','SimpleBeanFactory','DefaultListableBeanFactory','GenericBeanFactory'],a:2,
 e:'DefaultListableBeanFactory is the full-featured bean factory: it holds the bean definition registry, resolves dependencies, applies post-processors and supports autowiring. ApplicationContext implementations wrap it.'},

{q:'Which post-processor type runs before ordinary BeanFactoryPostProcessors and can register new bean definitions?',
 o:['BeanPostProcessor','BeanDefinitionRegistryPostProcessor','AspectJAwareAdvisorAutoProxyCreator','PropertySourcesPlaceholderConfigurer'],a:1,
 e:'BeanDefinitionRegistryPostProcessor extends BeanFactoryPostProcessor and runs first. ConfigurationClassPostProcessor uses it to scan @Configuration classes and register their beans.'},

{q:'How do you register an extra bean programmatically on an AnnotationConfigApplicationContext after construction?',
 o:['ctx.addBean(...)','ctx.setBean(...)','ctx.inject(...)','ctx.registerBean(MyService.class) or ctx.register(MyConfig.class)'],a:3,
 e:'registerBean and register take effect on the next refresh. Registering a class that is not annotated requires supplying a supplier or constructor arguments.'},

{q:'How does GenericApplicationContext differ from AnnotationConfigApplicationContext?',
 o:['It requires an explicit refresh() before beans are available','It cannot read annotations','It cannot hold bean definitions','It is deprecated'],a:0,
 e:'AnnotationConfigApplicationContext refreshes itself in its constructor. GenericApplicationContext does not, which makes it useful when you want to add definitions conditionally before starting the container.'},

{q:'What is the role of AnnotatedBeanDefinitionReader?',
 o:['It renders bean definitions as XML','It executes bean post-processors','It registers annotated classes as bean definitions in a bean factory','It loads properties files'],a:2,
 e:'It is the component AnnotationConfigApplicationContext uses internally. Registering classes through it enables the annotation-config post-processors needed for @Autowired and friends.'},

{q:'Which of these is NOT part of a BeanDefinition?',
 o:['The bean class name and scope','The instantiated bean object itself','Lazy-init and depends-on settings','Constructor argument and property values'],a:1,
 e:'A BeanDefinition is metadata. Instances live in the singleton registry and are created lazily or eagerly by the factory; the definition itself holds no instance reference.'},

{q:'What is BeanDefinitionBuilder used for?',
 o:['Building an ApplicationContext','Generating XML','Creating bean instances','Fluent, programmatic construction of a BeanDefinition'],a:3,
 e:'It is the readable way to build definitions in code, typically inside a BeanDefinitionRegistryPostProcessor or ImportBeanDefinitionRegistrar.'},

{q:'Which method closes a ConfigurableApplicationContext and destroys its singleton beans?',
 o:['close()','destroy()','shutdown()','stop()'],a:0,
 e:'close() releases resources and runs destruction callbacks for singletons. Alternatively, register a shutdown hook so the JVM does this on normal termination.'},

{q:'Which ConfigurableApplicationContext method registers a JVM shutdown hook that closes the context?',
 o:['addShutdownCallback()','enableShutdownHook()','registerShutdownHook()','setShutdownHandler()'],a:2,
 e:'It is essential for standalone applications such as a main method or a command-line tool, so @PreDestroy callbacks and resource cleanup actually run.'},

{q:'Which method returns an ObjectProvider for on-demand resolution of a bean type?',
 o:['getBeanLazy()','getBeanProvider()','providerOf()','resolveBean()'],a:1,
 e:'getBeanProvider returns an ObjectProvider, which supports getIfAvailable, getIfUnique and stream access, and resolves at call time rather than at injection time.'},

/* ---------- 11–20 : Annotation processing & meta-annotations ---------- */
{q:'What does @AliasFor let an annotation author do?',
 o:['Rename a bean at runtime','Deprecate an attribute','Inherit a value from a superclass','Declare that one attribute is an alias of another, so either can be used or they can be overridden together'],a:3,
 e:'It is the mechanism behind composed annotations: @RestController aliases value to @Controller path, and @RequestMapping aliases path to value.'},

{q:'Which utility resolves a merged, synthesised annotation including meta-annotations?',
 o:['AnnotationUtils.getAnnotation only','AnnotatedElementUtils.getMergedAnnotation','BeanUtils.findAnnotation','AnnotationConfigUtils.resolve'],a:1,
 e:'Merged annotations include attribute overrides from composed annotations, which plain reflection does not expose. MergedAnnotations is the underlying model.'},

{q:'Which statement about composed (meta-)annotations is true?',
 o:['They only work on interfaces','They must be declared in the same package as @Component','An annotation meta-annotated with @Component is treated as a component stereotype during scanning','They cannot carry attributes'],a:2,
 e:'That is how custom annotations such as @MyService become stereotypes. Component scanning looks for the merged @Component meta-annotation, not only a direct annotation.'},

{q:'What does the @Named annotation belong to and do?',
 o:['Spring, and it is an alias for @Bean','JSR-330, and it names a component for injection by name','JSR-250, and it is used for lifecycle callbacks','Java EE, and it declares a REST endpoint'],a:1,
 e:'@Named is the JSR-330 equivalent of @Component and also serves as a qualifier. Spring supports it alongside its own annotations.'},

{q:'What does JSR-330 @Inject do in a Spring context?',
 o:['Injects by name only','Replaces the need for any Spring annotation but requires the container to be a Spring context','Marks a bean as prototype','Declares a lifecycle callback'],a:1,
 e:'Spring supports JSR-330 injection annotations. @Inject is roughly equivalent to @Autowired(required=true); the standard has no required=false equivalent, so Optional is used.'},

{q:'Which JSR-330 annotation corresponds most closely to @Qualifier?',
 o:['@Named','@Inject','@Singleton','@Scope'],a:0,
 e:'@Named on a bean provides a qualifier name, and @Named on an injection point narrows by name. Spring maps its own @Qualifier to this concept.'},

{q:'Which type of filter excludes classes during component scanning?',
 o:['excludeFilters with an AssignableTypeFilter or AnnotationTypeFilter','basePackages','includeFilters with a RegexPatternTypeFilter','@ComponentScan has no filters'],a:0,
 e:'includeFilters adds candidates beyond the default stereotypes; excludeFilters removes them. useDefaultFilters=false turns off stereotype detection so only explicit includes are scanned.'},

{q:'What is the difference between @Conditional on a class and on a @Bean method?',
 o:['There is no difference','@Conditional is only allowed on classes','On a class it gates the whole configuration class; on a method it gates just that bean definition','On a method it is ignored'],a:2,
 e:'Class-level conditions are evaluated first; if they fail, none of the class beans are registered. Conditions can implement ConfigurationCondition to control the evaluation phase.'},

{q:'Which interface lets you programmatically decide which configuration classes to import, by name?',
 o:['BeanFactoryPostProcessor','ImportSelector','ImportBeanDefinitionRegistrar','Condition'],a:1,
 e:'ImportSelector returns class names to import and can inspect AnnotationMetadata. ImportBeanDefinitionRegistrar is for the stronger case where you need to register definitions yourself.'},

{q:'When must you use ImportBeanDefinitionRegistrar instead of ImportSelector?',
 o:['When the imported class is annotated with @Configuration','When you need to register bean definitions imperatively, for example with dynamic names or existing instances','When you need to add properties','When you need ordering'],a:1,
 e:'ImportSelector can only return class names. If you need BeanDefinitionBuilder, registerBeanDefinition, or to add an already-created singleton instance, use ImportBeanDefinitionRegistrar.'},

/* ---------- 21–30 : Environment, properties & conversion ---------- */
{q:'Which property sources does StandardEnvironment provide by default?',
 o:['Only the classpath resource loader','Only system properties','System properties and system environment variables','A JDBC-backed source'],a:2,
 e:'StandardEnvironment adds systemProperties and systemEnvironment. StandardServletEnvironment additionally adds servlet config, servlet context init params and JNDI sources.'},

{q:'Which of system properties and environment variables has higher precedence in StandardEnvironment?',
 o:['System properties','Environment variables','They are equal','Neither; precedence is undefined'],a:0,
 e:'System properties come first in the property source list, so -Dapp.port=8081 overrides an APP_PORT environment variable. You can reorder with MutablePropertySources.'},

{q:'What happens if @PropertySource points at a file that does not exist?',
 o:['The placeholder is left unresolved','The container starts with a warning only','The bean is skipped','Context startup fails unless ignoreResourceNotFound is set to true'],a:3,
 e:'Failing fast is intentional, because a missing configuration file usually means a deployment mistake. Set ignoreResourceNotFound only when the file is genuinely optional.'},

{q:'Which method adds a property source with the highest precedence?',
 o:['addLast on MutablePropertySources','addFirst on MutablePropertySources','PropertySource.add()','Environment.put()'],a:1,
 e:'addFirst places the new source ahead of all others, so it wins resolution. addLast makes it the lowest priority. addBefore and addAfter give positional control.'},

{q:'Which abstraction converts a String property value into a typed object such as an Integer or a custom type?',
 o:['PropertyEditor only','TypeResolver','ConversionService','ResourceEditor'],a:2,
 e:'Environment.getProperty(key, TargetType.class) delegates to the ConversionService. The default is ApplicationConversionService, which also includes common Spring types.'},

{q:'What does a Formatter add over a plain Converter?',
 o:['Locale-aware parsing and printing of values in addition to conversion','Thread safety','Caching','Conditional execution'],a:0,
 e:'Formatter combines Printer and Parser and receives a Locale, which matters for dates and numbers. Register them with FormattingConversionService or a FormatterRegistry.'},

{q:'Which annotation controls date formatting when binding a request parameter to a date field?',
 o:['@DateFormat','@TemporalFormat','@Format','@DateTimeFormat'],a:3,
 e:'@DateTimeFormat accepts an ISO pattern or an iso constant. @NumberFormat is the numeric counterpart, and both are honoured by the default conversion service in MVC.'},

{q:'What is a ConditionalConverter used for?',
 o:['Conditionally skipping bean creation','Applying a converter only when source and target types match its declared criteria','Enabling caching','Conditionally enabling transactions'],a:1,
 e:'ConditionalGenericConverter extends this idea to converters that can handle multiple type pairs, letting Spring pick the most specific match at runtime.'},

{q:'How do you add a custom Converter to a Spring MVC application?',
 o:['Annotate the converter with @Component only','Register it as a bean of type Converter','Override addFormatters(FormatterRegistry) in a WebMvcConfigurer','Use @EnableConversion'],a:2,
 e:'addFormatters is also the place to register Formatter and GenericConverter implementations so they apply to request binding and to @Value conversion.'},

{q:'What does @Profile on an @Bean method mean?',
 o:['The bean is only registered when the named profile is active','The bean is only registered in tests','The bean is lazy','The bean is primary'],a:0,
 e:'@Profile can be negated with a ! prefix and combined with expressions in recent versions. It is implemented with @Conditional and ProfileCondition internally.'},

/* ---------- 31–40 : AOP internals ---------- */
{q:'Which Spring class builds an AOP proxy programmatically without any container?',
 o:['AspectJProxyFactory only','ProxyBuilder','AopUtils','ProxyFactory'],a:3,
 e:'ProxyFactory lets you add advisors, interfaces and advice to a target and then call getProxy(). AspectJProxyFactory is the variant that understands @AspectJ annotations.'},

{q:'Which type combines a pointcut with advice in the advisor model?',
 o:['Advice','PointcutAdvisor','Interceptor','IntroductionInfo'],a:1,
 e:'PointcutAdvisor pairs a Pointcut with Advice, which is what auto-proxy creators look for. NameMatchMethodPointcutAdvisor is a simple example.'},

{q:'Which AspectJ construct adds a new interface and implementation to an advised object?',
 o:['@Around','@Before','@DeclareParents','@Introduce'],a:2,
 e:'@DeclareParents (the introduction form) is how Spring AOP adds mixin behaviour. The advised object becomes an instance of the new interface, and calls are delegated.'},

{q:'What must be enabled to use AopContext.currentProxy() inside an advised bean?',
 o:['exposeProxy=true on the proxy configuration','Nothing, it always works','proxyTargetClass=false','A custom Advisor'],a:0,
 e:'exposeProxy stores the proxy in a ThreadLocal so a self-invocation can obtain it. @EnableAspectJAutoProxy(exposeProxy = true) is the usual way to turn it on.'},

{q:'How do you reuse a pointcut definition across several advice methods?',
 o:['Copy the expression into every annotation','Declare it in XML only','Use a static field','Declare an empty method annotated with @Pointcut and reference it by name'],a:3,
 e:'A named @Pointcut can be referenced as pointcutName() or fully qualified. This keeps expressions consistent and avoids the drift that copy-paste causes.'},

{q:'What is the difference between args() and @args() pointcut designators?',
 o:['args() matches runtime argument types; @args() matches when the runtime arguments have the specified annotations','They are identical','@args() matches method annotations','args() only matches primitives'],a:0,
 e:'A related trap: args(java.lang.String) requires the runtime argument to actually be a String instance, unlike execution(..String..) which matches the declared parameter type.'},

{q:'What is the difference between this() and target() pointcut designators?',
 o:['They are identical','this() matches the type of the target object','this() matches the type of the proxy object, target() matches the type of the target object','target() only applies to interfaces'],a:2,
 e:'The distinction only matters with introductions or with interfaces, where the proxy implements more types than the target. Most code should use target().'},

{q:'What does proxyTargetClass=true force?',
 o:['CGLIB subclass proxying instead of JDK interface proxying','JDK proxying','Disabling proxying','Interface-only advice'],a:0,
 e:'CGLIB is needed when the bean has no interface, or when you need to advise methods that are not on an interface. It cannot advise final classes or final methods.'},

{q:'Why can a final method not be advised by a CGLIB proxy?',
 o:['Final methods are private','CGLIB works by subclassing and overriding, and a final method cannot be overridden','Final methods are static','CGLIB refuses classes with generics'],a:1,
 e:'The same applies to final classes, private methods and static methods. If you must advise such a member, AspectJ weaving is the only option.'},

{q:'How do you ensure one aspect wraps another, for example security outside transactions?',
 o:['Rely on declaration order in the file','Annotate both with @Aspect only','Use proxyTargetClass','Implement Ordered or add @Order, where a lower value means higher precedence'],a:3,
 e:'Lower order means the advice is applied closer to the outside of the chain. Without explicit ordering, precedence depends on discovery order and is not guaranteed.'},

/* ---------- 41–52 : Spring MVC extension points ---------- */
{q:'Which WebMvcConfigurer callback adds a HandlerInterceptor to all handlers?',
 o:['addViewControllers','configurePathMatch','addInterceptors','addResourceHandlers'],a:2,
 e:'The interceptor is registered with a path pattern, so you can scope it to /api/** rather than applying it to every request including static resources.'},

{q:'Which WebMvcConfigurer callback maps a URL pattern to a classpath location for static files?',
 o:['addResourceHandlers','addViewControllers','configureDefaultServletHandling','addCorsMappings'],a:0,
 e:'registry.addResourceHandler("/static/**").addResourceLocations("classpath:/static/"). Note that a Security filter chain, not this mapping, controls access.'},

{q:'What is @InitBinder used for in a controller?',
 o:['Initialising a bean after construction','Customising the WebDataBinder, for example registering a PropertyEditor or a validator for a specific field','Registering an interceptor','Configuring content negotiation'],a:1,

{q:'How do you add a custom HandlerMethodArgumentResolver?',
 o:['Annotate the resolver with @Component only','Declare it as a bean and rely on scanning','Override addArgumentResolvers in WebMvcConfigurer','Override addInterceptors'],a:2,

{q:'How does Spring select an HttpMessageConverter for a request body?',
 o:['By declaration order only','By the parameter name','By matching the content type, the target type and the converter canRead/canWrite results','By the converter bean name'],a:2,

{q:'What is the difference between configureMessageConverters and extendMessageConverters?',
 o:['configure replaces the default converter list; extend keeps the defaults and lets you add or modify','They are identical','configure is deprecated','extend removes all defaults'],a:0,
 e:'If you call configureMessageConverters, the defaults are not registered, so you must add back everything you need. extendMessageConverters is usually the safer choice.'},

{q:'Which HandlerExceptionResolver runs first by default?',
 o:['DefaultHandlerExceptionResolver','ExceptionHandlerExceptionResolver','ResponseStatusExceptionResolver','SimpleMappingExceptionResolver'],a:1,
 e:'The order is @ExceptionHandler methods, then @ResponseStatus-annotated exceptions, then Spring MVC standard exceptions. Custom resolvers can be inserted with ordered configuration.'},

{q:'How do you map a custom exception to an HTTP status without writing a handler method?',
 o:['Annotate the controller with @ResponseStatus','Configure it in web.xml','Add the status to the exception message','Annotate the exception class with @ResponseStatus(HttpStatus.NOT_FOUND)'],a:3,
 e:'ResponseStatusExceptionResolver honours class-level @ResponseStatus and also ResponseStatusException thrown at runtime, which is useful when the status must be dynamic.'},

{q:'What does returning ResponseEntity from a handler give you over @ResponseBody?',
 o:['Full control of status code, headers and body in one return value','Automatic validation','Automatic CORS','Faster serialisation'],a:0,

{q:'Which synchronous HTTP client did Spring Framework 6.1 introduce as the recommended replacement for RestTemplate?',
 o:['WebClient','RestTemplate2','RestClient','HttpClientAdapter'],a:2,
 e:'RestClient offers a fluent, modern API on the same underlying request factories. WebClient remains the reactive option, and RestTemplate is in maintenance mode.'},

{q:'Why does a servlet Filter run before a HandlerInterceptor?',
 o:['Filters are only for static resources','The filter chain is managed by the servlet container, outside the DispatcherServlet, while interceptors run inside handler mapping','Interceptors were added later','They are identical'],a:1,
 e:'A filter sees every request including static assets and non-Spring servlets and cannot see the handler. Use filters for cross-cutting infrastructure and interceptors for handler-aware logic.'},

{q:'Which class gives access to the current HttpServletRequest outside a controller method?',
 o:['ServletContextHolder','HttpContextHolder','WebRequestContext','RequestContextHolder'],a:3,

{q:'What is the key difference between a RowMapper and a RowCallbackHandler?',

{q:'What is SimpleJdbcInsert for?',

{q:'Which exception does Spring throw for a primary-key or unique-constraint violation?',

{q:'Which exception does queryForObject throw when the query returns no rows?',

{q:'Which class lets you run a unit of work transactionally without annotations?',

{q:'How do you register a callback that runs after the current transaction commits?',

{q:'Which setting must be enabled for NESTED propagation to use savepoints?',

{q:'Which propagation throws an exception when no transaction is already active?',

{q:'What isolation does ISOLATION_DEFAULT use?',

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Framework Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
