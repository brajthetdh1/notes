<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Mock Test — Set 3 · 100 MCQs</title>
<meta name="description" content="100 Spring Boot MCQs (Set 3): Maven/Gradle plugins, SpringApplicationBuilder, EnvironmentPostProcessor, @HttpExchange, multi-datasource, MockMvcTester, Docker Compose, CDS, DevTools internals, JPA auditing and tuning.">
<style>
  :root{--brand:#16a34a;--brand-dark:#166534;--accent:#86efac;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#0a3d1a;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#f0fdf4;border-color:#bbf7d0}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(22,163,74,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f7fee7}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ecfccb}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 Spring Boot Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* ---------- 1–10: Build tooling & project setup ---------- */
{q:'By default, what does the spring-boot-maven-plugin repackage goal do to the main artifact?',
 o:['Deletes it','Replaces it with the executable jar and saves the original as <name>.jar.original','Adds a second jar without touching the original','Only creates an executable script wrapper'],a:1,
 e:'The plugin rewrites the main artifact so `java -jar target/app.jar` works, and renames the original to `.jar.original`. Setting `<classifier>exec</classifier>` makes it produce `app-exec.jar` and leaves the plain jar untouched.'},

{q:'Why would you import spring-boot-dependencies instead of inheriting spring-boot-starter-parent as the parent POM?',
 o:['It is required for Maven 4','It provides dependency management without forcing Spring Boot\'s plugin, resource and encoding defaults over your own corporate parent','It is the only way to get starters','It disables auto-configuration'],a:1,
 e:'The BOM gives you managed versions via `<dependencyManagement>` with `<scope>import</scope>`, letting you keep an existing parent. You then configure the Maven plugin yourself.'},

{q:'Which Gradle task produces the executable Spring Boot jar?',
 o:['jar','bootJar','assemble','bootPackage'],a:1,
 e:'The Spring Boot Gradle plugin adds `bootJar` for the executable jar and `bootRun` to run the application. The standard `jar` task remains available for a plain library jar.'},

{q:'Which scope or marker is used for the DevTools dependency so it is not shipped in the production jar?',
 o:['compile','runtime','test','optional (provided by starter-parent)'],a:3,
 e:'DevTools is declared as optional/provided in the starter, so it is not a transitive dependency and the repackage goal excludes it. Never include DevTools in a production artifact.'},

{q:'Which plugin property overrides the main class that the Maven plugin uses for the executable jar and spring-boot:run?',
 o:['<mainClass> or spring-boot.run.main-class','<launchClass>','<bootMainClass>','<entryClass>'],a:0,
 e:'Both the executable jar and spring-boot:run read this value. The plugin also tries to auto-detect a single class with a main method, so the property is only needed when detection is ambiguous.'},

{q:'Which property overrides the default image name produced by spring-boot:build-image?',
 o:['spring-boot.build-image.name','<image><name>','DOCKER_IMAGE','build.image'],a:1,
 e:'The plugin configuration exposes `<image><name>tag</name></image>`. There is also a plugin-level property `spring-boot.build-image.imageName` and the `-Dspring-boot.build-image.imageName` command-line form.'},

{q:'What does `spring init` (Spring Boot CLI) do?',
 o:['Creates a Maven repository','Initialises a database','Downloads a project skeleton from start.spring.io, so you can generate a project from the terminal','Starts the application'],a:2,
 e:'`spring init` calls the Initializr API and unpacks the result, so CI scripts and tutorials can bootstrap a project without opening a browser.'},

{q:'What does `java -Djarmode=tools -jar app.jar extract` do in Spring Boot 3.3+?',
 o:['Extracts the jar into dependencies, spring-boot-loader and snapshot-dependencies directories for a Dockerfile','Encrypts the jar','Decompiles the classes','Starts the app in tool mode'],a:0,
 e:'The tools jarmode unpacks the layered jar so a Dockerfile can copy each layer independently. In older versions the mode was `layertools`, which is now deprecated in favour of `tools`.'},

{q:'How do you pass program arguments to `mvn spring-boot:run`?',
 o:['-Dspring-boot.run.arguments="--server.port=9090"','-Dargs="--server.port=9090"','-Dexec.args only','It is not supported'],a:0,
 e:'spring-boot.run.arguments takes a space-separated string. You can also set spring-boot.run.profiles and spring-boot.run.jvmArguments, which keeps launch configuration out of shell scripts.'},

{q:'What does the `spring-boot-properties-migrator` module do?',
 o:['Rewrites application.properties on disk','Detects properties that were renamed or removed during upgrades and reports them at startup','Encrypts properties','Generates a properties schema'],a:1,
 e:'It is a temporary diagnostic dependency. It prints clear warnings such as "Property X is deprecated in favour of Y", which shortens the pain of a major version upgrade.'},

/* ---------- 11–20: Startup, lifecycle & bootstrap ---------- */
{q:'What is SpringApplicationBuilder primarily used for?',
 o:['Building a jar','A fluent API to configure and run a SpringApplication, including profiles, properties and banner mode, before startup','Creating a Spring MVC configuration','Generating bean definitions'],a:1,
 e:'It is the alternative to static run() when you need to programmatically set properties, add initializers or listeners, or chain parent contexts before starting.'},

{q:'What is the consequence of setting spring.main.lazy-initialization=true?',
 o:['Beans are only created on first use, giving faster startup but moving missing-bean and configuration errors to runtime','It disables all beans','It makes every bean prototype-scoped','It prevents the container from starting'],a:0,
 e:'Lazy initialisation reduces startup time and idle memory, at the cost of slower first requests and errors surfacing late. Annotate critical beans with @Lazy(false) to opt out.'},

{q:'Since which version has bean definition overriding been disabled by default?',
 o:['1.5','2.1','2.6','3.0'],a:1,
 e:'Spring Boot 2.1 set spring.main.allow-bean-definition-overriding to false by default. Enabling it again lets a later definition silently replace an earlier one, which can hide configuration mistakes.'},

{q:'Since which version has circular reference support been disabled by default?',
 o:['2.1','2.3','2.6','3.0'],a:2,
 e:'Spring Boot 2.6 disabled circular references by default. Re-enable with spring.main.allow-circular-references=true, but treat that as a temporary fix while you refactor the cycle away.'},

{q:'What does spring.main.web-application-type=none do?',
 o:['Starts a servlet server','Starts a reactive server','Turns off the web server entirely, so the application runs as a non-web application','Disables error handling'],a:2,
 e:'It is useful for CLI tools, batch jobs and message-driven applications where starting Tomcat would just consume resources. Values are NONE, SERVLET and REACTIVE.'},

{q:'What class writes a PID file on startup so external tools can manage the process?',
 o:['PidFileListener','ApplicationPidFileWriter','SpringApplicationPid','ProcessIdWriter'],a:1,
 e:'Add it via SpringApplication.addListeners(new ApplicationPidFileWriter("app.pid")) or set spring.pid.file. Pair it with spring.pid.fail-on-write-error to fail fast when the file cannot be written.'},

{q:'Which banner placeholders are available inside banner.txt?',
 o:['Only ${version}','${spring-boot.version}, ${application.version} and ${application.formatted-version} (the last two need the build-info goal)','Only ${date}','No placeholders are supported'],a:1,
 e:'Application values come from the build-info properties generated by the spring-boot-maven-plugin\'s build-info goal, so the placeholders are empty until that goal runs.'},

{q:'Why is spring.application.name important beyond logging?',
 o:['It sets the server port','It is used as the default service name in Micrometer metrics, tracing and Spring Cloud discovery','It configures the DataSource','It defines the main class'],a:1,
 e:'Tracing spans, metrics tags and discovery registrations fall back to this name. Setting it explicitly avoids an application showing up as the generic default "application".'},

{q:'What does `spring.main.add-command-line-properties=true` do?',
 o:['Adds command line arguments as the highest-precedence PropertySource, above system properties and OS environment variables','Prints the command line at startup','Validates command line arguments','Disables command line parsing'],a:0,
 e:'It is on by default in normal SpringApplication startup. Adding an explicit SimpleCommandLinePropertySource on top of the environment makes those arguments beat every other source.'},

{q:'Which listener interface is the correct place to register an ApplicationPidFileWriter or custom startup listener programmatically?',
 o:['ApplicationListener<ApplicationPreparedEvent> only','SpringApplicationRunListener','ApplicationRunner','CommandLineRunner'],a:1,
 e:'SpringApplicationRunListener gets callbacks at each startup phase (starting, environment prepared, context prepared, started, ready, failed), which is where infrastructure listeners hook in. ApplicationRunners run much later, after the context is ready.'},

/* ---------- 21–32: Advanced configuration & property binding ---------- */
{q:'How do you bind a Map<String, Endpoint> in @ConfigurationProperties?',
 o:['Declare a Map field and set sub-keys like app.endpoints.users.url=...; keys become map entries','Use @ConfigurationPropertiesMap only','Maps cannot be bound','Use a List of pairs instead'],a:0,
 e:'Any property under the prefix that does not match an existing field is grouped as a map entry, with the map key taken from the next segment. This is a very common pattern for feature flags and per-tenant settings.'},

{q:'How do you bind a List of complex objects in @ConfigurationProperties?',
 o:['Only via constructor parameters','Use indexed keys such as app.servers[0].host and app.servers[1].host, or repeated YAML list items','Lists cannot be bound','Use a comma-separated string only'],a:1,
 e:'YAML list syntax binds naturally. In properties files you use bracket indexing. Validation on list elements requires @Valid on the list field and constraints on the element class.'},

{q:'Which formats are valid for binding a Duration property such as app.timeout?',
 o:['Only milliseconds as a long','Only ISO-8601 PT30S','A simple form such as 30s, 5m or 500ms, or ISO-8601 with a @DurationUnit default','Only a cron expression'],a:2,
 e:'Without a unit, a bare number is interpreted in the unit declared by @DurationUnit (milliseconds by default). Always specifying the unit avoids ambiguity.'},

{q:'Which values are valid for a DataSize property such as app.max-size?',
 o:['Only bytes as a long','10MB, 1GB, 512KB, or a bare number interpreted as bytes','Only "10 megabytes" as text','Only ISO-8601'],a:1,
 e:'DataSize accepts a number plus a unit suffix. Use @DataSizeUnit to set the default unit for bare numbers. Binary suffixes are also accepted: 10MiB, 1GiB.'},

{q:'How do you support a custom type in @ConfigurationProperties that Spring Boot cannot convert automatically?',
 o:['You cannot; the type must be a String','Annotate the property with @String','Register a Converter<S, T> (or a GenericConverter) bean, and Spring Boot will use it during binding','Use @Value instead'],a:2,
 e:'Converters and Formatters registered as beans are picked up by the binder. This is the documented extension point for domain-specific value objects such as currency codes or durations with custom semantics.'},

{q:'Which of these is required to make constructor binding work on a record annotated with @ConfigurationProperties?',
 o:['@ConstructorBinding on the record','A no-arg constructor plus setters','Nothing extra — a record with a single canonical constructor is bound by constructor automatically','@Immutable'],a:2,
 e:'Since Spring Boot 3.0 a single parameterised constructor is used automatically, and records qualify. @ConstructorBinding is only needed to disambiguate when there are several constructors.'},

{q:'How do you apply validation groups to a @ConfigurationProperties class?',
 o:['Annotate the class with @Validated(MyGroup.class) and add group markers on the constraints','It is not supported','Only default group validation works','Use @Valid instead'],a:0,
 e:'The binder runs the groups declared on @Validated. This lets you apply stricter rules for production profiles and looser ones for tests without duplicating the class.'},

{q:'What does spring.config.activate.on-cloud-platform=kubernetes do?',
 o:['Starts Kubernetes','Requires a Kubernetes cluster to boot','Activates the containing config document only when the detected cloud platform is Kubernetes','Disables probes'],a:2,
 e:'It is the same mechanism as spring.config.activate.on-profile, applied to a cloud platform. It is the correct way to ship Kubernetes-specific config inside a packaged jar without a profile flag.'},

{q:'What does an import with `optional:` prefix change about startup?',
 o:['Nothing','The file is read later','The application fails if the target is missing','The import is skipped if the target cannot be found, instead of failing startup'],a:3,
 e:'Without `optional:`, a missing config data import fails startup. Marking it optional lets a single jar run both inside a cluster with mounted config and on a developer laptop without it.'},

{q:'Which of these is NOT a supported way to supply `spring.config.import` values?',
 o:['In application.properties','On the command line','Via the SPRING_CONFIG_IMPORT environment variable','Via a Java annotation on the main class'],a:3,
 e:'Config imports are read from the Environment itself, not from an annotation. This is why the property must be discoverable through a properties file, system property, env var or command-line argument.'},

{q:'What is the main advantage of `spring-boot-configuration-processor` for a library author?',
 o:['It compiles faster','It generates the metadata JSON that IDEs use for autocomplete and documentation of configuration keys for library consumers','It validates the configuration at runtime','It creates the properties class automatically'],a:1,
 e:'Without the metadata, a consumer of your library sees no completion and no documentation for your properties. It is the single highest-leverage addition for a Spring Boot library.'},

{q:'How do you override a single property in a test without editing application.properties?',
 o:['@TestPropertySource(properties = "app.mode=test")','You cannot; the file must be edited','@Profile("test") alone','Use System.setProperty in a static block'],a:0,
 e:'@TestPropertySource contributes to the test Environment, so it participates in the normal precedence rules. Its inline properties sit above the packaged files, which is exactly what you want in tests.'},

/* ---------- 33–40: Environment post-processing & initialisers ---------- */
{q:'How is an EnvironmentPostProcessor registered so that Spring Boot invokes it during startup?',
 o:['As a @Component','In META-INF/spring.factories under org.springframework.boot.env.EnvironmentPostProcessor','In META-INF/spring/org.springframework.boot.env.EnvironmentPostProcessor.imports only','By extending SpringApplication'],a:1,
 e:'EnvironmentPostProcessor is an SPI loaded before the ApplicationContext exists, so it cannot be a bean. It is registered in spring.factories, and it is the correct place for programmatic property sources such as Vault or a cloud metadata service.'},

{q:'What is the difference between EnvironmentPostProcessor and ApplicationContextInitializer?',
 o:['They are identical','EnvironmentPostProcessor runs before the context is created and modifies the Environment; ApplicationContextInitializer runs after creation but before refresh and can touch the context','ApplicationContextInitializer is deprecated','EnvironmentPostProcessor only works in tests'],a:1,
 e:'Both are SPI extension points. Initializers are useful for registering custom PropertySources or setting active profiles before beans are created, but they run later than EnvironmentPostProcessors.'},

{q:'Where does RandomValuePropertySource sit in the property source precedence order?',
 o:['Above command line arguments','Below application.properties','Above OS environment variables','Last, so it only provides values nothing else defines'],a:3,
 e:'Random values are a fallback source consulted last. They are useful for defaults such as test ports or ephemeral credentials but never for overriding a real value.'},

{q:'Which property source provides the highest precedence among the sources SpringApplication installs?',
 o:['SimpleCommandLinePropertySource (command line arguments)','SystemEnvironmentPropertySource','application.properties','RandomValuePropertySource'],a:0,
 e:'Command-line arguments beat both Java system properties and OS environment variables, which is why `--server.port=9090` reliably overrides everything in a packaged jar.'},

{q:'How do you add a custom PropertySource whose values are fetched from a remote service at startup?',
 o:['Implement EnvironmentPostProcessor and insert a PropertySource before the context refreshes','Override DispatcherServlet','Use a static initializer in the main class','Add a property in application.properties'],a:0,
 e:'A remote call must happen before beans are created, which is exactly the EnvironmentPostProcessor phase. Do not do network I/O in a bean constructor, since failures are harder to handle and ordering is unclear.'},

{q:'What is the purpose of ApplicationContextInitializer?',
 o:['To execute after the context is refreshed','To run after the web server starts','To programmatically configure the context before refresh, for example by registering a custom PropertySource or setting profiles','To define beans'],a:2,
 e:'It runs after the context is created but before any beans are instantiated, which makes it a good place for profile or property decisions that affect the whole context.'},

{q:'Which mechanism lets a library activate a profile automatically when it detects a specific cloud platform?',

{q:'What does spring.main.background-preinitialization=false control?',

{q:'What does server.forward-headers-strategy=framework do?',

{q:'Which properties are required to terminate TLS in the embedded server?',

{q:'Which property configures how long browsers cache static resources served by Spring MVC?',

{q:'What does spring.thymeleaf.cache=false do?',

{q:'Which properties enable Hibernate\'s second-level cache?',
