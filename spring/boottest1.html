<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Mock Test — 100 MCQs</title>
<meta name="description" content="100 Spring Boot MCQs: auto-configuration, starters, @ConfigurationProperties, profiles, Actuator, test slices, JPA, DevTools, buildpacks and more.">
<style>
  :root{--brand:#6db33f;--brand-dark:#3f6b1f;--accent:#8ee36a;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#183a06;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#f0fdf4;border-color:#bbf7d0}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(109,179,63,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f7fee7}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ecfccb}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 Spring Boot Mock Test <span class="setpill">BOOT</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Basics & @SpringBootApplication */
{q:'Which three annotations does @SpringBootApplication combine?',
 o:['@SpringBootConfiguration, @EnableAutoConfiguration, @ComponentScan','@Configuration, @EnableTransactionManagement, @ComponentScan','@SpringBootConfiguration, @EnableWebMvc, @ComponentScan','@Configuration, @EnableCaching, @EnableScheduling'],a:0,
 e:'@SpringBootApplication is a composed annotation: @SpringBootConfiguration (a form of @Configuration), @EnableAutoConfiguration (triggers auto-configuration) and @ComponentScan (scans the package of the main class and below).'},

{q:'Where does Spring Boot 3 look for auto-configuration class listings?',
 o:['WEB-INF/spring.factories','META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports','META-INF/autoconfigure.imports','META-INF/services/java.sql.Driver'],a:1,
 e:'Spring Boot 2.7+ introduced the new import file, and Spring Boot 3 requires it. The old META-INF/spring.factories file is deprecated for auto-configuration and only still works for a limited compatibility path.'},

{q:'What does @ConditionalOnMissingBean do on an auto-configuration bean?',
 o:['Replaces an existing bean','Runs only if a class is missing from the classpath','Never registers the bean','Registers the bean only if no bean of that type already exists'],a:3,
 e:'It is the primary mechanism for user overrides. Auto-configuration defines sensible defaults guarded by @ConditionalOnMissingBean, so any bean you declare yourself wins without needing an exclude.'},

{q:'Which starter pulls in Spring MVC, embedded Tomcat and Jackson?',
 o:['spring-boot-starter-web','spring-boot-starter-mvc','spring-boot-starter-tomcat','spring-boot-starter-json'],a:0,
 e:'spring-boot-starter-web depends on spring-webmvc, spring-boot-starter-tomcat, spring-boot-starter-json (Jackson) and spring-boot-starter-validation is separate. Swapping the server means excluding Tomcat and adding Jetty or Undertow.'},

{q:'What is the minimum Java version required by Spring Boot 3?',
 o:['Java 8','Java 11','Java 17','Java 21'],a:2,
 e:'Spring Boot 3 requires Java 17 or later and Jakarta EE 9+. Spring Boot 2.7 was the last line supporting Java 8 and the javax.* namespace.'},

{q:'Which namespace do Spring Boot 3 servlet applications use?',
 o:['javax.servlet','jakarta.servlet','java.servlet','org.springframework.servlet'],a:1,
 e:'Spring Boot 3 moved from javax.* to jakarta.*. Dependencies still on javax.* (older libraries, older JPA annotations) will not work and must be upgraded or swapped.'},

{q:'Which embedded servlet container does spring-boot-starter-web use by default?',
 o:['Jetty','Undertow','Reactor Netty','Tomcat'],a:3,
 e:'Tomcat is the default. Jetty or Undertow can be substituted by excluding spring-boot-starter-tomcat and adding the corresponding starter.'},

{q:'What does SpringApplication.run(MyApp.class, args) return?',
 o:['A ConfigurableApplicationContext','void','A Future<ApplicationContext>','A SpringApplicationBuilder'],a:0,
 e:'It bootstraps the application and returns the running context, which you can use in tests or to inspect beans. In production code you usually ignore the return value.'},

{q:'Which property disables the startup banner?',
 o:['spring.main.banner=off','banner.enabled=false','spring.main.banner-mode=off','spring.banner.off=true'],a:2,
 e:'spring.main.banner-mode accepts off, console or log. You can also place a custom banner.txt on the classpath to replace the default Spring Boot banner.'},

{q:'What does @SpringBootConfiguration extend?',
 o:['@EnableAutoConfiguration','@Configuration','@ComponentScan','@SpringBootApplication'],a:1,
 e:'It is a specialised @Configuration used by @SpringBootTest to locate the primary configuration class. @SpringBootApplication meta-annotates it, so a single main class satisfies both roles.'},

/* 11–22: Auto-configuration */
{q:'In Spring Boot 2.x (before the new imports file), which file listed auto-configuration classes?',
 o:['META-INF/spring.factories','META-INF/autoconfigure.xml','spring-boot.properties','WEB-INF/auto-config.xml'],a:0,
 e:'The EnableAutoConfiguration key in spring.factories listed all auto-configuration classes. Spring Boot 2.7 introduced the new .imports file and Spring Boot 3 removed the spring.factories fallback.'},

{q:'How do you exclude a specific auto-configuration class?',
 o:['Delete the class from the jar','Annotate the bean with @Exclude','Add @EnableAutoConfiguration(exclude = XxxAutoConfiguration.class) or set spring.autoconfigure.exclude','Use @DisableAutoConfiguration'],a:2,
 e:'Exclusion works at the annotation level or via property. Prefer the property form when the exclusion is environment-specific, since it keeps the main class identical across environments.'},

{q:'Which annotation enables the condition evaluation report at startup?',
 o:['@EnableReport','Adding --debug=true or debug=true in application.properties','@ConditionalReport','@EnableDebug'],a:1,
 e:'The report lists every auto-configuration class and which condition matched or failed. It is the fastest way to understand why a bean you expected is missing.'},

{q:'What is spring-boot-starter-parent primarily for?',
 o:['A required dependency','A Maven parent POM providing dependency management (BOM), plugin defaults and sensible resource filtering','A Spring Boot runtime','A build tool plugin'],a:1,
 e:'It imports spring-boot-dependencies so managed dependencies need no versions, and configures the Maven plugin, resource filtering and encoding. You can also import the BOM directly without inheriting the parent.'},

{q:'Which logging framework does Spring Boot use by default?',
 o:['Logback','Log4j2','java.util.logging','SLF4J Simple'],a:0,
 e:'Logback is the default through spring-boot-starter-logging. Log4j2 can be substituted by excluding spring-boot-starter-logging and adding spring-boot-starter-log4j2.'},

{q:'Which file name enables Spring-specific extensions such as <springProfile> in Logback configuration?',
 o:['logback.xml','logback-spring.xml','logback-boot.xml','spring-logback.xml'],a:1,
 e:'logback-spring.xml is processed by Spring Boot, so you can use <springProfile> and <springProperty>. Plain logback.xml is read by Logback directly and cannot see the Environment.'},

{q:'What does a logging group let you do?',
 o:['Group loggers under one name so you can set their level together','Group log files into one','Compress logs','Send logs to Kafka'],a:0,
 e:'For example logging.group.myapp=com.example.web,com.example.service then logging.level.myapp=DEBUG. Log groups are useful when a feature spans multiple packages.'},

{q:'What does @ConditionalOnProperty do?',
 o:['Creates a property','Reads a property value','Registers the bean only when the named property matches a value (or is present)','Disables all properties'],a:2,
 e:'Typical usage is @ConditionalOnProperty(name="feature.x.enabled", havingValue="true", matchIfMissing=false). It is heavily used to turn optional auto-configurations on and off.'},

{q:'Which property disables a specific auto-configuration without code changes?',
 o:['spring.autoconfigure.exclude','spring.auto.exclude','autoconfigure.disabled','spring.boot.exclude'],a:0,
 e:'The property takes a comma-separated list of fully qualified class names. It is often set per environment so an optional feature can be turned off without rebuilding.'},

{q:'Which class is the entry point for the auto-configuration mechanism?',
 o:['SpringBootApplication','EnableAutoConfiguration','AutoConfigurationImportSelector','ImportSelector'],a:2,
 e:'AutoConfigurationImportSelector reads the .imports file, filters candidates through @Conditional checks and registers the surviving configurations. It is imported by @EnableAutoConfiguration.'},

{q:'What is the auto-configuration package for a class annotated with @SpringBootApplication?',
 o:['The package of the annotated class and all sub-packages','The root package of the jar','java.*','org.springframework.boot.*'],a:0,
 e:'Component scanning starts at the main class package. Putting the main class at the top of your package hierarchy is the simplest way to avoid missing beans.'},

{q:'Why might a custom bean NOT override an auto-configured one?',
 o:['Auto-configuration always wins','The custom bean is in a package not scanned, or the auto-config lacks @ConditionalOnMissingBean','Spring Boot forbids overrides','The bean name collides'],a:1,
 e:'Most auto-configurations guard with @ConditionalOnMissingBean, but only if your bean is actually registered — which requires the package to be scanned or a @Bean method in a @Configuration class.'},

{q:'What does the ConditionEvaluationReport show when run with --debug?',
 o:['A list of bean definitions only','A log of every HTTP request','Every auto-configuration class and which conditions matched or failed','The current classpath'],a:2,
 e:'It is grouped into Positive matches, Negative matches, Exclusions and Unconditional classes. Read it from the bottom up when hunting for a missing bean.'},

{q:'Which annotation marks a class as an auto-configuration class in Spring Boot 3?',
 o:['@Configuration + @ConditionalOnClass','@AutoConfiguration','@AutoConfigure','@SpringBootConfiguration'],a:1,
 e:'@AutoConfiguration is a specialised @Configuration used for auto-configuration classes. It also ensures the class is only processed in the right phase, after user configuration.'},

{q:'What does FailureAnalyzer provide?',
 o:['A stack trace formatter','A readable explanation with a suggested action for common startup failures, such as port in use or a missing driver','A retry policy','A health check'],a:1,
 e:'Spring Boot ships FailureAnalyzers for common problems. A broken DataSource URL or a port conflict produces a concise actionable message rather than a wall of stack trace.'},

/* 23–34: Starters & configuration properties */
{q:'Which starter provides Actuator endpoints?',
 o:['spring-boot-starter-monitor','spring-boot-starter-actuator','spring-boot-starter-management','spring-boot-starter-metrics'],a:1,
 e:'spring-boot-starter-actuator adds /actuator endpoints, health indicators and Micrometer metrics. By default, only /actuator/health is exposed over HTTP.'},

{q:'Which library does Spring Boot Actuator use for metrics?',
 o:['Dropwizard Metrics','Micrometer','JMX only','Prometheus client directly'],a:1,
 e:'Micrometer is a vendor-neutral facade. Registries for Prometheus, Datadog, New Relic and others are added as dependencies, so application code stays registry-agnostic.'},

{q:'Which annotation binds external configuration to a bean with relaxed binding?',
 o:['@Value','@PropertySource','@ConfigurationProperties','@EnableConfigurationProperties'],a:2,
 e:'@ConfigurationProperties supports kebab-case, camelCase, snake_case and upper-underscore forms for the same property. @Value does not, which is why @ConfigurationProperties is the recommended approach for grouped configuration.'},

{q:'Which of the following is NOT a valid relaxed-binding form for the property firstName?',
 o:['first-name','first_name','FIRST_NAME','FIRST__NAME'],a:3,
 e:'Relaxed binding supports camelCase, kebab-case, snake_case and upper-underscore. A double underscore in the middle is not a recognised form and will not bind.'},

{q:'How do you enable scanning of @ConfigurationProperties classes outside the main package?',
 o:['@ConfigurationPropertiesScan on a @Configuration class or the main class','@EnableConfigurationPropertiesScan only','@ScanConfigurationProperties','@ComponentScanProperties'],a:0,
 e:'@ConfigurationPropertiesScan finds and registers them. Alternatively, list them explicitly with @EnableConfigurationProperties(MyProps.class) on a configuration class.'},

{q:'How do you validate values bound by @ConfigurationProperties?',
 o:['Annotate the class with @Validated and add JSR-303 constraints on the fields','Implement Validatable','Override validate()','Add @Check'],a:0,
 e:'Put @Validated on the properties class and @NotNull, @Min, @Pattern etc. on its fields. A binding failure throws BindException at startup rather than failing later at runtime.'},

{q:'Does constructor binding require @ConstructorBinding in Spring Boot 3?',
 o:['Yes, always','Yes, unless using @Autowired','No — a single constructor is automatically used for binding','Only for records'],a:2,
 e:'Since Spring Boot 3.0 (and 2.6 before it), a class with a single parameterised constructor uses constructor binding automatically. @ConstructorBinding is only needed to disambiguate multiple constructors.'},

{q:'What does @DefaultValue do on a @ConfigurationProperties constructor parameter?',
 o:['Sets a value if the property is missing','Sets a value always, overriding the property','Marks the parameter as optional but leaves it null','Sets a default for Maven'],a:0,
 e:'@DefaultValue("8080") provides a fallback when the property is not present. It pairs naturally with constructor binding and immutable properties classes.'},

{q:'What does the placeholder ${random.int} provide in a properties file?',
 o:['A compile-time constant','A random value generated per application start, useful for defaults or test values','A random bean name','A random port only'],a:1,
 e:'RandomValuePropertySource offers random.int, random.long, random.uuid and similar. It is a convenient way to avoid hard-coded defaults that collide between instances.'},

{q:'How do you inject a property value into a bean using SpEL and a placeholder together?',
 o:['@Value("${app.enabled}")','@Value("#{${app.enabled}}")','@Value("app.enabled")','@Inject("${app.enabled}")'],a:1,
 e:'Outer #{...} is SpEL, inner ${...} resolves the property. This pattern is used when you need a typed evaluation, such as converting a string property to a boolean or arithmetic.'},

{q:'Which order applies to external configuration (highest precedence first)?',
 o:['application.properties > command line args > environment variables','Environment variables > command line args > application.properties','application.properties > environment variables > command line args','Command line args > Java system properties > OS environment variables > application.properties'],a:3,
 e:'Command line arguments win first, then system properties, then OS environment variables, then profile-specific and then default application.properties files. This is why --server.port=9090 overrides everything else.'},

{q:'Which annotation provides Spring extensions inside logback-spring.xml?',
 o:['<springProfile> and <springProperty>','<spring:profile> and <spring:property>','<profile> and <property>','<boot>'],a:0,
 e:'These tags let you switch log appenders per profile and pull properties from the Environment. They only work because the file is processed by Spring Boot, not by Logback directly.'},

{q:'What does @TestConfiguration add over @Configuration in a test?',
 o:['It is detected by component scanning','It is excluded from component scanning so it only applies when explicitly imported by a test','It enables transactions','It mocks all beans'],a:1,
 e:'It is the clean way to add test-only beans such as mocks or an in-memory client. Import it with @Import(MyTestConfig.class) on the test class.'},

/* 35–44: Profiles & environment */
{q:'How do you activate the dev profile on the command line?',
 o:['--profile=dev','-P dev','--spring.profiles.active=dev','--activate=dev'],a:2,
 e:'The property form works from the command line, environment variables (SPRING_PROFILES_ACTIVE), application.properties, or as a servlet context parameter. Multiple profiles can be comma-separated.'},

{q:'What does @Profile("dev") on a @Bean method do?',
 o:['Registers the bean only when the dev profile is active','Disables the bean','Sets the bean name to dev','Enables transactions'],a:0,
 e:'The condition is evaluated at registration time. If the profile is not active, the bean definition is skipped entirely, which makes it useful for swapping data sources between environments.'},

{q:'Which file loads only when the dev profile is active?',
 o:['application.properties','application-dev.properties','application.default.properties','dev.properties'],a:1,
 e:'The pattern is application-{profile}.properties or .yml. Profile-specific files override the base application.properties for the keys they set.'},

{q:'What is the name of the default profile if none is configured?',
 o:['prod','main','default','application'],a:2,
 e:'The default profile is named "default". Use @Profile("!prod") or @Profile("default") to register beans only when no explicit profile is active.'},

{q:'What does spring.profiles.include do?',
 o:['Adds additional active profiles without replacing the ones already configured','Replaces the active profiles','Disables profiles','Removes the default profile'],a:0,
 e:'It is the additive counterpart to spring.profiles.active. spring.profiles.group also lets you activate several profiles with a single name.'},

{q:'What does @ActiveProfiles("test") do in a Spring Boot test?',
 o:['Tells Spring to run in test mode','Sets the bean scope to test','Activates the given profiles for the test context, so profile-specific beans and properties apply','Mocks the production database'],a:2,
 e:'It is the standard way to load a test-specific configuration. Combine it with src/test/resources/application-test.properties to override production values.'},

{q:'Which annotation is used for conditional activation based on a Spring profile?',
 o:['@Profile','@Conditional','@ConditionalOnProfile','@ProfileActive'],a:0,
 e:'@Profile is a convenience meta-annotation over @Conditional. For more complex conditions, implement Condition and use @Conditional directly.'},

{q:'Why is "spring" a reserved profile name that cannot be used?',
 o:['It clashes with the framework','It is used internally by Spring Boot and cannot be activated for user beans','It is case-sensitive and cannot be typed','It requires a licence'],a:1,
 e:'Spring Boot documents "spring" as reserved and may activate it internally in future versions. Using it for application profiles is unsupported.'},

{q:'What is @TestPropertySource primarily used for?',
 o:['Adding inline properties or property file locations to a test context','Mocking beans','Enabling transactions','Disabling security'],a:0,

{q:'How can a bean read the active profiles programmatically?',
 o:['Inject @Autowired ApplicationContext and call getActiveProfiles()','Inject @Autowired Environment and call getActiveProfiles()','Read System.getenv("SPRING_PROFILES_ACTIVE")','Use a static method on SpringApplication'],a:1,

/* 45–55: Web, REST & error handling */

{q:'Which properties prefix configures Jackson globally?',

{q:'Which of these is NOT a default static resource location in Spring Boot?',

{q:'What happens by default when no handler matches a request in Spring Boot?',

{q:'How do you provide a custom HTML error page?',

{q:'Which annotation returns a specific HTTP status for an exception handler in Spring Boot?',

{q:'What does @RestControllerAdvice combine?',
 o:['@ControllerAdvice and @ResponseBody','@Controller and @ResponseBody','@RestController and @Advice','@Component and @ExceptionHandler'],a:0,

{q:'Which property sets the servlet context path?',

/* 56–68: Actuator */
{q:'Which Actuator endpoint is exposed over HTTP by default?',
 o:['/actuator/health only','All endpoints','/actuator/health and /actuator/info','/actuator/env'],a:0,

{q:'Which property exposes additional Actuator endpoints?',
 o:['management.endpoints.web.exposure.include','management.expose','actuator.endpoints','endpoints.web.include'],a:0,

{q:'What is the default base path for Actuator endpoints?',
 o:['/manage','/actuator','/admin','/spring'],a:1,

{q:'What does management.server.port do?',
 o:['Sets the main server port','Enables TLS','Exposes Actuator endpoints on a separate port, so you can firewall them independently','Disables Actuator'],a:2,

{q:'What is the default visibility of health details on /actuator/health?',
 o:['Always shown','Never shown unless management.endpoint.health.show-details is configured','Shown only to admins','Shown only in dev profile'],a:1,

{q:'Which annotation registers a custom Actuator endpoint?',

{q:'How do you add a custom health indicator?',
 o:['Implement HealthIndicator and register it as a bean','Add a property','Implement ApplicationRunner','Subclass /actuator/health'],a:0,

{q:'Which management property configures the health status codes for HTTP?',
 o:['management.endpoint.health.status.http-mapping.*','management.health.codes','health.http.status','management.health.mapping'],a:0,

{q:'What does the shutdown Actuator endpoint do?',
 o:['Restarts the JVM','Shuts down the application gracefully','Stops a single bean','Kills the container'],a:1,
 e:'It is disabled by default and must be explicitly enabled with management.endpoint.shutdown.enabled=true and exposed. It is often used by orchestration tooling.'},

{q:'What does the /actuator/env endpoint expose?',
 o:['Only the active profiles','The resolved environment properties and their sources, which can include secrets','Only the command line arguments','Nothing without a flag'],a:1,
 e:'This is why /actuator/env is often disabled in production. It can reveal datasource passwords or API keys, so it must be secured and preferably never exposed externally.'},

{q:'How do you add a custom metric?',
 o:['Inject MeterRegistry and call counter(), gauge(), timer()','Annotate a method with @Metric','Override /actuator/metrics','Add a property'],a:0,

{q:'Which Micrometer registry exposes a /actuator/prometheus endpoint?',

{q:'What is Spring Boot Admin?',

{q:'Which annotation starts the full application context in a test?',

{q:'What is the default web environment for @SpringBootTest?',

{q:'What is @DataJpaTest\'s transaction behaviour per test method?',

{q:'What does @JsonTest provide?',

{q:'Which annotation replaced @MockBean in Spring Boot 3.4?',

{q:'What is the purpose of @DirtiesContext in a Spring Boot test?',

{q:'Which annotation auto-configures MockMvc in a @SpringBootTest?',

{q:'What does spring-boot-starter-test include?',

{q:'What does TestRestTemplate offer over plain RestTemplate in a test?',

{q:'Which annotation loads a slice test for JDBC components?',

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Boot Mock Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
