<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Framework Mock Test — Set 3 · 100 MCQs</title>
<meta name="description" content="100 advanced Spring Framework MCQs (no Spring Boot): WebFlux, WebClient, RestClient, HTTP Interface, WebSocket/STOMP, JMS, lifecycle and context events, caching and scheduling internals, JDBC advanced, testing internals and utility APIs.">
<style>
  :root{
    --brand:#0f766e;
    --brand-dark:#042f2e;
    --accent:#2dd4bf;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#042f2e;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(15,118,110,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdfa}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🌊 Spring Framework Mock Test <span class="setpill">SET 3 · NO BOOT</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SPRING FRAMEWORK SET 3 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Spring WebFlux ---------- */
{q:'Which reactive types does Spring WebFlux use by default?',
 o:['RxJava Observable only','CompletableFuture','Mono and Flux from Project Reactor','Akka Streams'],a:2,
 e:'Mono represents 0..1 values and Flux 0..N. WebFlux also accepts RxJava types through adapters, but Reactor is the native and default choice.'},

{q:'What is the fundamental difference between Spring MVC and Spring WebFlux?',
 o:['MVC is thread-per-request blocking; WebFlux is non-blocking and event-loop based with backpressure','They are the same engine with a different name','WebFlux can only serve JSON','MVC cannot serve REST APIs'],a:0,
 e:'MVC uses the servlet API and blocks threads. WebFlux runs on a small event loop and returns reactive types, which avoids tying up threads while waiting on I/O.'},

{q:'Which server does WebFlux use by default?',
 o:['Tomcat','Netty','Undertow','Jetty'],a:1,
 e:'Netty is the default runtime. WebFlux can also run on Tomcat, Jetty and Undertow in non-blocking servlet mode, but Netty is the typical choice.'},

{q:'What is the role of a WebFilter in WebFlux?',
 o:['To route requests to handlers','To convert request bodies','To intercept the request/response chain before and after the handler, similar to a servlet filter','To render views'],a:2,
 e:'WebFilter runs in the reactive chain and can modify the ServerWebExchange. It is the natural place for correlation IDs, authentication checks and CORS handling.'},

{q:'What does ServerWebExchange represent?',
 o:['A database connection','The request, the response and the session attributes in one object passed through the WebFlux chain','A WebSocket session','A scheduled task'],a:1,
 e:'Exchange is the reactive analogue of a servlet request/response pair, and its attributes map is a common way for filters and handlers to share per-request state.'},

{q:'How is a WebExceptionHandler different from an @ExceptionHandler in WebFlux?',
 o:['It handles exceptions globally at the reactive chain level, including for functional endpoints','They are identical','@ExceptionHandler cannot be used in WebFlux','WebExceptionHandler only handles 404'],a:0,
 e:'@ExceptionHandler works inside annotated controllers. WebExceptionHandler operates on the exchange, so it also covers RouterFunction and errors thrown by filters.'},

{q:'Which approach defines routes in WebFlux without annotations?',
 o:['@RequestMapping','RouterFunction and HandlerFunction','@RestController','Servlet mappings'],a:1,
 e:'Functional endpoints pair a RequestPredicate with a HandlerFunction and return a RouterFunction. They are a good fit when routes must be composed programmatically.'},

{q:'What does backpressure mean in the reactive model?',
 o:['Retrying failed requests','A consumer signals how many items it can handle so the producer does not overwhelm it','Limiting thread pool size','Compressing the response'],a:1,
 e:'Reactive Streams defines request(n) so consumers pull at their own pace. This is the main reason reactive code can stay stable under load instead of accumulating queued work.'},

{q:'What is a common misconception about WebFlux performance compared to MVC?',
 o:['WebFlux is always faster for every workload','WebFlux only works with MongoDB','WebFlux has no threading model','WebFlux is faster only for I/O-bound, high-concurrency workloads with slow dependencies, not necessarily for CPU-bound work'],a:3,
 e:'For a fast in-memory handler, the servlet stack is often as fast or faster. The benefit appears when many concurrent requests are waiting on slow I/O.'},

{q:'Which class is used to test WebFlux endpoints without a running server?',
 o:['MockMvc','WebTestClient bound to a RouterFunction or application context','TestRestTemplate','HttpClient'],a:1,
 e:'WebTestClient has a reactive API and can test both annotated controllers and functional routes. Its bindToApplicationContext and bindToRouterFunction variants skip a real server.'},

/* ---------- 11–20 : HTTP clients ---------- */
{q:'Which Spring Framework 6.1 class is the recommended replacement for RestTemplate in synchronous code?',
 o:['WebClient','RestClient','HttpClientAdapter','FeignClient'],a:1,
 e:'RestClient keeps the synchronous, fluent style of RestTemplate with a modern API. RestTemplate is in maintenance mode; WebClient remains the reactive option.'},

{q:'In which version did RestTemplate enter maintenance mode?',
 o:['Spring Framework 5.0','Spring Framework 6.0','Spring Framework 6.1','Spring Framework 6.2'],a:2,
 e:'The 6.1 release notes explicitly recommended RestClient for new synchronous work. RestTemplate is still supported but will not gain new features.'},

{q:'Which interface allows intercepting RestTemplate requests to add headers or logging?',
 o:['ResponseErrorHandler','ClientHttpRequestInterceptor','HttpMessageConverter','RequestCallback'],a:1,
 e:'Interceptors chain around the actual HTTP call. Adding them to the RestTemplate bean is the standard way to inject tracing headers, auth tokens and latency metrics.'},

{q:'How do you customise error handling in RestTemplate?',
 o:['Set a ResponseErrorHandler, for example a subclass of DefaultResponseErrorHandler','Annotate the class with @ResponseStatus','Set a timeout','Use a different message converter'],a:0,
 e:'By default RestTemplate throws HttpClientErrorException or HttpServerErrorException for 4xx and 5xx. A custom handler lets you map statuses to domain exceptions or ignore certain codes.'},

{q:'What does WebClient.builder().baseUrl(...).build() produce?',
 o:['A blocking HTTP client','A template for a single call','An immutable, reusable WebClient instance that should be created once and shared','A connection pool'],a:2,
 e:'WebClient instances are thread-safe and immutable. Creating one per request wastes resources and defeats connection pooling and metrics instrumentation.'},

{q:'Which WebClient method converts the response body to a single reactive value?',
 o:['retrieve()','bodyToMono()','bodyToFlux()','exchangeToMono()'],a:1,
 e:'bodyToMono returns Mono<T> for a single value, while bodyToFlux returns Flux<T> for a stream. exchangeToMono gives full access to status and headers.'},

{q:'What does the Spring 6.0 @HttpExchange annotation declare?',
 o:['A REST controller mapping','An interface method that describes an outbound HTTP call for HTTP Interface clients','A WebSocket endpoint','A scheduled job'],a:1,
 e:'Annotating an interface with @HttpExchange creates a declarative client. HttpServiceProxyFactory builds the implementation, similar to a Feign-style client but entirely within Spring Framework.'},

{q:'Which factory creates a proxy implementation of an @HttpExchange interface?',
 o:['RestClientFactory','WebClientFactory','HttpServiceProxyFactory','ProxyFactoryBean'],a:2,
 e:'HttpServiceProxyFactory takes a client adapter such as RestClientAdapter or WebClientAdapter and returns a working proxy. It is the modern way to write type-safe outbound clients.'},

{q:'Which class would you use to safely assemble a URI with path and query parameters?',
 o:['StringBuilder','UriComponentsBuilder','UriTemplate','URLEncoder'],a:1,
 e:'UriComponentsBuilder handles encoding, path variables and query parameters correctly. Hand-concatenating URLs is a common source of double-encoding and injection bugs.'},

{q:'Why should a RestTemplate or WebClient bean be created once at startup?',
 o:['They are immutable and thread-safe, and reuse connection pools, converters and interceptors','They can only make one request each','They hold a database connection','They must be prototype-scoped'],a:0,
 e:'Reusing the instance gives you HTTP connection pooling, a consistent converter list and one place to configure timeouts, error handling and instrumentation.'},

/* ---------- 21–28 : WebSocket & STOMP ---------- */
{q:'Which annotation enables low-level WebSocket handler support?',
 o:['@EnableWebSocketMessageBroker','@EnableWebSocket','@EnableWebSocketHandler','@EnableWebSocketTransport'],a:1,
 e:'@EnableWebSocket registers handlers implementing WebSocketHandler and maps URL paths to them. It is the plain WebSocket option without a messaging protocol on top.'},

{q:'Which annotation enables a STOMP-based messaging broker inside Spring MVC?',
 o:['@EnableWebSocket','@EnableStomp','@EnableMessaging','@EnableWebSocketMessageBroker'],a:3,
 e:'It configures the STOMP message handling infrastructure, including the inbound channel, the broker relay or simple broker, and the @MessageMapping handler mapping.'},

{q:'What does SimpleBroker do?',
 o:['Relays messages to an external RabbitMQ','Handles subscriptions and message fan-out in memory, suitable for a single application instance','Encrypts STOMP traffic','Persists messages to a database'],a:1,
 e:'SimpleBroker supports /topic and /queue semantics in memory. In a cluster you need an external broker or a relay so that clients connected to different instances can see each other messages.'},

{q:'Which annotation sends the return value of a STOMP handler method to a destination?',
 o:['@SendTo','@ResponseBody','@Destination','@Broker'],a:0,
 e:'@SendTo specifies the destination, and @SendToUser targets only the originating user. A method can also return a value written to the default reply destination.'},

{q:'Which class lets application code send messages to a STOMP destination programmatically?',
 o:['StompSession','SimpMessagingTemplate','MessageChannel','BrokerRelay'],a:1,
 e:'SimpMessagingTemplate.convertAndSend(destination, payload) is the usual way to push from a service, for example a background job broadcasting progress updates.'},

{q:'What is SockJS used for?',
 o:['Compressing STOMP frames','Providing a fallback transport for browsers that do not support WebSocket','Encrypting WebSocket frames','Load balancing WebSocket connections'],a:1,
 e:'SockJS negotiates a fallback transport such as XHR streaming or long polling. Modern browsers support WebSocket natively, so it is often unnecessary today.'},

{q:'Which interface lets you intercept STOMP messages inside the messaging channel?',
 o:['HandshakeInterceptor','ChannelInterceptor','WebSocketHandler','HandshakeHandler'],a:1,
 e:'ChannelInterceptor acts on messages in the channel, which makes it the right place for authentication and authorization checks per STOMP destination.'},

{q:'Which interface lets you inspect the HTTP handshake request before the WebSocket session is created?',
 o:['ChannelInterceptor','WebSocketHandler','HandshakeInterceptor','StompDecoder'],a:2,
 e:'HandshakeInterceptor has beforeHandshake and afterHandshake, which is where you typically extract a token from the HTTP request and store the authenticated principal in attributes.'},

/* ---------- 29–36 : JMS & messaging ---------- */
{q:'Which class is the Spring equivalent of a JMS producer helper?',
 o:['JmsTemplate','JmsProducer','MessageTemplate','JmsSessionFactory'],a:0,
 e:'JmsTemplate handles connection, session and producer lifecycle, destination resolution and exception translation, so application code only supplies the payload and destination.'},

{q:'Which annotation registers a method as a JMS message listener?',
 o:['@JmsListener','@MessageListener','@JmsHandler','@Consume'],a:0,
 e:'@JmsListener declares the destination and optional container factory. @EnableJms activates the infrastructure that scans for these annotated methods.'},

{q:'Which class is the default message listener container implementation?',
 o:['SimpleMessageListenerContainer','DefaultMessageListenerContainer','JmsListenerContainerFactory','CachingConnectionFactory'],a:1,
 e:'DefaultMessageListenerContainer supports dynamic scaling of consumers and participates in JTA transactions. SimpleMessageListenerContainer creates a fixed number of consumers and is easier to reason about.'},

{q:'Which interface converts between a Java object and a JMS Message?',
 o:['JmsTemplate','DestinationResolver','MessageConverter','MessagePostProcessor'],a:2,
 e:'SimpleMessageConverter handles strings, bytes, maps and serialisable objects. MappingJackson2MessageConverter and MarshallingMessageConverter are used for structured payloads.'},

{q:'Which transaction manager integrates JMS with Spring transaction management?',
 o:['DataSourceTransactionManager','JmsTransactionManager','HibernateTransactionManager','JtaTransactionManager only'],a:1,
 e:'It binds a JMS connection and session to the thread. For cross-resource transactions spanning a database and a broker, use a JTA transaction manager instead.'},

{q:'What does a MessagePostProcessor let you do in JmsTemplate?',
 o:['Convert the payload','Modify the JMS Message after it is created, such as setting headers, correlation ID or time-to-live','Decode STOMP frames','Resolve the destination'],a:1,
 e:'convertAndSend overloads accept a MessagePostProcessor, which is how you set JMSCorrelationID, JMSPriority or custom properties without dropping to the raw JMS API.'},

{q:'What does DestinationResolver do?',
 o:['Resolves a destination name to a JMS Destination, allowing dynamic queue and topic names','Resolves bean dependencies','Resolves message converters','Resolves transactions'],a:0,
 e:'The default DynamicDestinationResolver creates Queue or Topic instances from names. A JndiDestinationResolver looks them up from JNDI when the broker requires it.'},

{q:'How do you acknowledge a JMS message manually?',
 o:['Set sessionAcknowledgeMode to CLIENT_ACKNOWLEDGE and call message.acknowledge()','Use a transaction only','Annotate the listener with @Acknowledge','Call acknowledgeAll on the template'],a:0,
 e:'Manual acknowledgement gives fine control over when a message is considered consumed, but it requires careful error handling so a failed message is not acknowledged by accident.'},

/* ---------- 37–46 : Lifecycle, context events & Aware ---------- */
{q:'Which interface should a bean implement if it needs to start and stop background activity as the context starts and stops?',
 o:['InitializingBean','DisposableBean','Lifecycle or SmartLifecycle','ApplicationListener'],a:2,
 e:'Lifecycle gives start() and stop() with isRunning(). SmartLifecycle adds phase ordering, automatic startup and an explicit callback, which is why it is preferred for long-running workers.'},

{q:'What does SmartLifecycle.getPhase() control?',
 o:['The transaction isolation level','The HTTP port','The startup and shutdown order relative to other lifecycle beans, where lower phases start first and stop last','The log level'],a:2,
 e:'Defaults are Integer.MAX_VALUE for normal components and 0 for some infrastructure. Ordering matters when one component depends on another being ready.'},

{q:'Which event is published when the ApplicationContext finishes refreshing?',
 o:['ContextStartedEvent','ContextRefreshedEvent','ContextClosedEvent','ContextStoppedEvent'],a:1,
 e:'ContextRefreshedEvent is the standard "container ready" signal. It is also published on a later explicit refresh, so listeners must be idempotent.'},

{q:'Which event is published when the context is closed?',
 o:['ContextClosedEvent','ContextDestroyedEvent','ApplicationShutdownEvent','ContextStoppedEvent'],a:0,
 e:'Listeners can use it for final cleanup, such as flushing buffers or deregistering from a service registry. It runs before bean destruction callbacks in most flows.'},

{q:'What is the difference between ContextStartedEvent and ContextRefreshedEvent?',
 o:['They are identical','Refreshed is published after initialisation; Started is published when start() is explicitly called on a ConfigurableApplicationContext','Started fires on every request','Refreshed only fires on shutdown'],a:1,
 e:'Most applications never call start(), so ContextRefreshedEvent is the one you normally listen for. ContextStartedEvent matters for components using Lifecycle.'},

{q:'Which interface must a bean implement to receive a callback when an application event is published?',
 o:['BeanPostProcessor','ApplicationListener<E extends ApplicationEvent>','MessageSource','ResourceLoader'],a:1,
 e:'Since Spring 4.2 an ApplicationListener can listen to arbitrary object types, not only ApplicationEvent subclasses, which enables payload-style events.'},

{q:'Which Aware interface gives a bean access to the bean name assigned by the container?',
 o:['BeanFactoryAware','ApplicationContextAware','BeanNameAware','EnvironmentAware'],a:2,
 e:'BeanNameAware is occasionally used for logging or metrics labels. Prefer explicit injection where possible; Aware interfaces create a hard dependency on the container.'},

{q:'Which Aware interface gives a bean access to the Environment for property and profile lookups?',
 o:['EnvironmentAware','ResourceLoaderAware','MessageSourceAware','ApplicationEventPublisherAware'],a:0,
 e:'EnvironmentAware is useful in infrastructure code. In application code, injecting the specific values with @Value is usually clearer than pulling the whole Environment.'},

{q:'Which interface allows a bean to resolve ${...} placeholders itself without a full Environment?',
 o:['MessageSourceAware','EmbeddedValueResolverAware','BeanFactoryAware','ApplicationContextAware'],a:1,

{q:'Which interface gives a bean access to a ServletContext in a web application?',

{q:'What does a KeyGenerator do?',
 o:['Generates the cache name','Produces the cache key from the target, method and arguments','Generates the value','Generates the TTL'],a:1,

{q:'What does a CacheResolver do?',
 o:['Resolves the value from the cache','Resolves the cache beans to use at invocation time, enabling per-tenant or dynamic cache selection','Resolves the key','Resolves the cache manager'],a:1,
 e:'When you need different caches per customer or region, a CacheResolver inspects the invocation context and returns the right Cache instances for that call.'},

{q:'What does a CacheErrorHandler do?',
 o:['Retries failed cache operations','Handles exceptions thrown by the cache provider so a cache outage does not break the application','Encrypts cache entries','Logs cache hits'],a:1,
 e:'The default SimpleCacheErrorHandler rethrows, which means a Redis outage can take down a service. A custom handler that logs and swallows failures is a common resilience pattern.'},

{q:'What does the unless attribute on @Cacheable do?',
 o:['Skips the method when the cache is empty','Excludes the value from being cached when the SpEL expression is true, evaluated after the method returns','Skips caching entirely','Excludes the cache name'],a:1,

{q:'What does the condition attribute on @Cacheable do?',
 o:['Evaluates before the call to decide whether caching applies at all','Evaluates after the call','Sets the TTL','Chooses the cache manager'],a:0,
 e:'condition is evaluated before invocation and cannot reference #result. Use it when caching only makes sense for some arguments, for example ids above a threshold.'},

{q:'Which restriction applies to @Cacheable(sync = true)?',
 o:['Only one cache may be specified, unless is not supported, and the method must return a value','It cannot be used with Redis','It requires @EnableAsync','It requires a custom KeyGenerator'],a:0,
 e:'sync = true is implemented by locking on the cache entry. Those restrictions exist because the locking path cannot support all of the general caching semantics.'},

{q:'What does a CompositeCacheManager do?',
 o:['Combines several cache managers, falling back to the next when a cache is not found','Merges cache entries','Combines key generators','Combines cache resolvers'],a:0,
 e:'It is useful when you use a remote cache for hot data and a local cache for the rest, or during migration from one provider to another.'},

{q:'What happens with @CacheEvict(beforeInvocation = true) if the method then throws?',
 o:['The entry is restored','The eviction still happens because it occurred before the method ran','The eviction is rolled back','The method is retried'],a:1,
 e:'Evicting before invocation guarantees the entry is gone even if the update fails, which is the safer default when a stale read would be worse than a cache miss.'},

{q:'What does a CacheManager bean need in order for @EnableCaching to work?',

/* ---------- 57–66 : Scheduling & async internals ---------- */
{q:'How many fields does a Spring cron expression have?',

{q:'What is the default TaskScheduler when only @EnableScheduling is present?',
 o:['ThreadPoolTaskScheduler with 10 threads','A single-threaded scheduler','A ScheduledThreadPoolExecutor with one thread','A work-stealing pool'],a:2,

{q:'Which class should a @Bean provide to customise the default scheduler?',

{q:'Which return types are valid for an @Async method?',

{q:'What does AsyncUncaughtExceptionHandler do?',
 o:['Handles exceptions thrown by @Async void methods','Handles all executor rejections','Handles exceptions in @Scheduled methods','Retries @Async tasks'],a:0,

{q:'Which interface lets you provide both a custom executor and an exception handler for @Async?',

{q:'If several TaskExecutor beans exist, how do you choose which one @Async uses?',

{q:'What is the difference between ThreadPoolTaskExecutor and SimpleAsyncTaskExecutor?',

{q:'What does the TaskDecorator on ThreadPoolTaskExecutor allow?',

{q:'Why is BeanPropertyRowMapper sometimes risky on large result sets?',

{q:'What is the main benefit of the Spring TestContext framework context cache?',

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Framework Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
