<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Mock Test — Set 3 · 100 MCQs</title>
<style>
:root{--brand:#16a34a;--brand-dark:#166534;--accent:#86efac;--ok:#10b981;--bad:#ef4444;--bg:#eef2f7;--card:#fff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
.setpill{background:var(--accent);color:#0a3d1a;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
.timer.low{background:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
@media (max-width:900px){aside.palette{position:static}}
.palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.lg-ans{background:#d1fae5;border-color:#10b981!important}
.lg-mark{background:#fef3c7;border-color:#f59e0b!important}
.lg-cur{background:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
.pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
.pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
.pbtn.seen{background:#f0fdf4;border-color:#bbf7d0}
.pbtn.answered{background:#d1fae5;border-color:#10b981}
.pbtn.marked{background:#fef3c7;border-color:#f59e0b}
.pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(22,163,74,.3)}
.progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
@media (max-width:520px){.card{padding:16px}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
.qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
.options{display:grid;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
.option:hover{border-color:var(--brand);background:#f7fee7}
.option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
.option .otext{flex:1;font-size:.95rem}
.option.selected{border-color:var(--brand);background:#ecfccb}
.option.selected .key{background:var(--brand);color:#fff}
.option.correct{border-color:var(--ok);background:#ecfdf5}
.option.correct .key{background:var(--ok);color:#fff}
.option.wrong{border-color:var(--bad);background:#fef2f2}
.option.wrong .key{background:var(--bad);color:#fff}
.option.locked{cursor:default}
.option.locked:hover{border-color:var(--line);background:#f8fafc}
.explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
.explain-title{font-weight:700;color:#166534;margin-bottom:6px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-dark)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
.btn.warn:hover{background:#ffedd5}
.btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
.btn.danger:hover{background:#fee2e2}
@media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
.hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
@media (max-width:640px){.hint{display:none}}
.scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
.scorecard h2{margin:0 0 4px}
.bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
.stats b{display:block;font-size:1.3rem}
.st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
.fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
.revitem.ok{border-left-color:var(--ok)}
.revitem.bad{border-left-color:var(--bad)}
.revitem.skip{border-left-color:#94a3b8}
.revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
.revline{font-size:.86rem;margin:3px 0}
.revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
.revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
.tagbad{color:var(--bad);font-weight:700}
.tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🍃 Spring Boot Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>
<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head"><span>Question Palette</span><button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button></div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span><span><i class="lg-ans"></i>Answered</span><span><i class="lg-mark"></i>Marked</span><span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>
  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead"><span class="qnum" id="qnum">Question 1 of 100</span><span class="marktag" id="markTag" hidden>★ Marked for review</span></div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden><div class="explain-title" id="explainTitle"></div><div class="explain-body" id="explainText"></div></div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn" id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>
    <div id="resultView" hidden></div>
  </main>
</div>

<script>
var QS = [
/* 1–10 Build tooling */
{q:'By default, what does the spring-boot-maven-plugin repackage goal do to the main artifact?',o:['Deletes it','Replaces it with the executable jar and saves the original as <name>.jar.original','Adds a second jar without touching the original','Only creates a shell wrapper'],a:1,e:'The plugin rewrites the main artifact so java -jar works, and keeps the plain jar as .jar.original.'},
{q:'Why import spring-boot-dependencies instead of inheriting spring-boot-starter-parent?',o:['Required for Maven 4','Dependency management without forcing Spring Boot\'s plugin/resource defaults over your corporate parent','Only way to get starters','Disables auto-configuration'],a:1,e:'The BOM gives managed versions via dependencyManagement with scope import; you keep your own parent.'},
{q:'Which Gradle task produces the executable Spring Boot jar?',o:['jar','bootJar','assemble','bootPackage'],a:1,e:'The Boot Gradle plugin adds bootJar (executable) and bootRun (run); jar remains for plain libraries.'},
{q:'How is DevTools scoped so it is not shipped in the production jar?',o:['compile','runtime','test','optional/provided by starter-parent'],a:3,e:'DevTools is optional, so it is not transitive and repackage excludes it from the fat jar.'},
{q:'Which configuration overrides the main class for the executable jar and spring-boot:run?',o:['<mainClass> or spring-boot.run.main-class','<launchClass>','<bootMainClass>','<entryClass>'],a:0,e:'Only needed when auto-detection is ambiguous (zero or multiple main methods).'},
{q:'Which configuration overrides the default image name for spring-boot:build-image?',o:['spring-boot.build-image.name','<image><name>','DOCKER_IMAGE','build.image'],a:1,e:'Also available as -Dspring-boot.build-image.imageName on the command line.'},
{q:'What does the Spring Boot CLI command spring init do?',o:['Creates a Maven repo','Initialises a DB','Downloads a project skeleton from start.spring.io','Starts the app'],a:2,e:'It calls the Initializr API and unpacks the result, useful for scaffolding from a terminal.'},
{q:'What does java -Djarmode=tools -jar app.jar extract do in Spring Boot 3.3+?',o:['Extracts into layers (dependencies, spring-boot-loader, snapshot-dependencies, application)','Encrypts the jar','Decompiles classes','Starts in tool mode'],a:0,e:'The tools jarmode supersedes layertools and supports layered Dockerfiles.'},
{q:'How do you pass program arguments to mvn spring-boot:run?',o:['-Dspring-boot.run.arguments="--server.port=9090"','-Dargs="--server.port=9090"','-Dexec.args only','Not supported'],a:0,e:'Matching properties exist for profiles and jvmArguments, keeping launch config out of shell scripts.'},
{q:'What does spring-boot-properties-migrator do?',o:['Rewrites application.properties','Reports renamed or removed properties at startup','Encrypts properties','Generates a schema'],a:1,e:'It is a temporary diagnostic for major upgrades, printing clear "use Y instead of X" warnings.'},
/* 11–20 Startup & lifecycle */
{q:'What is SpringApplicationBuilder used for?',o:['Building a jar','Fluent configuration of a SpringApplication before startup','MVC configuration','Generating bean definitions'],a:1,e:'It configures profiles, default properties, listeners and initializers programmatically, and can chain parent/child contexts.'},
{q:'What is the consequence of spring.main.lazy-initialization=true?',o:['Beans are created on first use: faster startup but later errors','Disables all beans','Makes beans prototype-scoped','Prevents startup'],a:0,e:'Faster boot at the cost of moving missing-bean and configuration errors to first use.'},
{q:'Since which version has bean-definition overriding been disabled by default?',o:['1.5','2.1','2.6','3.0'],a:1,e:'Spring Boot 2.1 set spring.main.allow-bean-definition-overriding=false by default.'},
{q:'Since which version have circular references been disabled by default?',o:['2.1','2.3','2.6','3.0'],a:2,e:'Spring Boot 2.6 disabled them; re-enable with spring.main.allow-circular-references=true only as a stopgap.'},
{q:'What does spring.main.web-application-type=none do?',o:['Starts servlet','Starts reactive','Turns off the web server (non-web application)','Disables error handling'],a:2,e:'Values are SERVLET, REACTIVE and NONE; NONE suits CLI tools, batch jobs and message consumers.'},
{q:'Which class writes a PID file at startup?',o:['PidFileListener','ApplicationPidFileWriter','SpringApplicationPid','ProcessIdWriter'],a:1,e:'Register it as a listener or use spring.pid.file, plus spring.pid.fail-on-write-error=true.'},
{q:'Which banner.txt placeholders are available out of the box?',o:['Only ${version}','${spring-boot.version}, ${application.version}, ${application.formatted-version}, ${spring-boot.formatted-version}','Only ${date}','None'],a:1,e:'Application placeholders need the build-info goal; they are empty until it runs.'},
{q:'Why is spring.application.name important beyond logging?',o:['Sets the port','Default service name for metrics, tracing and discovery','Configures DataSource','Defines the main class'],a:1,e:'Tracing spans, metric tags and registrations fall back to it, avoiding the generic default "application".'},
{q:'What does spring.main.add-command-line-properties=true do?',o:['Adds command line args as a higher-precedence PropertySource than system properties and OS env','Prints the command line','Validates args','Disables parsing'],a:0,e:'This is why --server.port=9090 reliably wins over everything else; the default is on in normal startup.'},
{q:'Which listener receives a callback at each startup phase (starting, environment prepared, context prepared, started, ready, failed)?',o:['ApplicationListener<ApplicationPreparedEvent> only','SpringApplicationRunListener','ApplicationRunner','CommandLineRunner'],a:1,e:'It is the correct hook for startup-time infrastructure; runners execute much later.'},
/* 21–32 Advanced config */
{q:'How do you bind a Map<String, Endpoint> in @ConfigurationProperties?',o:['Declare a Map field; sub-keys like app.endpoints.users.url become entries','Use @ConfigurationPropertiesMap','Maps cannot be bound','Use a List of pairs'],a:0,e:'Unmatched sub-keys are grouped as map entries; a common pattern for feature flags.'},
{q:'How do you bind a List of complex objects in @ConfigurationProperties?',o:['Only via constructors','Indexed keys (app.servers[0].host) or repeated YAML list items','Cannot be bound','Only comma-separated'],a:1,e:'Add @Valid on the list field and constraints on the element class to validate each entry.'},
{q:'Which formats are valid when binding a Duration property?',o:['Only a long in milliseconds','Only ISO-8601 PT30S','Simple forms (30s, 5m, 500ms) or ISO-8601, with a @DurationUnit default','Only a cron expression'],a:2,e:'A bare number uses @DurationUnit (ms by default); always specifying the unit avoids ambiguity.'},
{q:'Which values are valid for a DataSize property?',o:['Only a long in bytes','10MB, 1GB, 512KB, or a bare number as bytes; binary 10MiB/1GiB also accepted','Only "10 megabytes"','Only ISO-8601'],a:1,e:'@DataSizeUnit sets the default unit for bare numbers; used for multipart, cache and buffer sizes.'},
{q:'How do you support a custom value type in @ConfigurationProperties?',o:['It must be String','Use @String','Register a Converter<S,T> or GenericConverter bean; Spring Boot picks it up','Use @Value'],a:2,e:'Converters and Formatters declared as beans are used by the Binder.'},
{q:'What is required for constructor binding on a record with @ConfigurationProperties in Boot 3?',o:['@ConstructorBinding','No-arg constructor plus setters','Nothing — a single canonical constructor is used automatically','@Immutable'],a:2,e:'Since 3.0 a single parameterised constructor is bound automatically; @ConstructorBinding is only needed to disambiguate.'},
{q:'How do you apply validation groups to a @ConfigurationProperties class?',o:['@Validated(MyGroup.class) plus group markers on constraints','Not supported','Only default group','Use @Valid'],a:0,e:'This lets you enforce stricter rules in production and looser ones in tests from one class.'},
{q:'What does spring.config.activate.on-cloud-platform=kubernetes do?',o:['Starts Kubernetes','Requires a cluster to boot','Activates the config document only when the detected cloud platform is Kubernetes','Disables probes'],a:2,e:'Spring Boot detects Kubernetes, Cloud Foundry, Heroku and others automatically.'},
{q:'What changes when a config data import is prefixed with optional:?',o:['The file is read later','Runs in a background thread','Fails if missing','Skips gracefully if the target is missing'],a:3,e:'Optional imports let one jar run in a cluster with mounted config and on a laptop without it.'},
{q:'Which of these is NOT a supported source for spring.config.import?',o:['application.properties','Command line','SPRING_CONFIG_IMPORT env var','An annotation on the main class'],a:3,e:'Imports are read from the Environment, not from an annotation.'},
{q:'What is the main benefit of spring-boot-configuration-processor?',o:['Faster compile','Generates metadata JSON for IDE completion and documentation','Validates at runtime','Generates the properties class'],a:1,e:'Without the metadata file consumers see no autocomplete or descriptions for library keys.'},
{q:'How do you override one property in a test without editing application.properties?',o:['@TestPropertySource(properties = "app.mode=test")','Edit the file','@Profile("test") alone','System.setProperty in a static block'],a:0,e:'Inline properties participate in normal Environment precedence and sit above packaged files.'},
/* 33–42 Environment & initialisers */
{q:'How is an EnvironmentPostProcessor registered?',o:['As a @Component','In META-INF/spring.factories under org.springframework.boot.env.EnvironmentPostProcessor','Only in an .imports file','By extending SpringApplication'],a:1,e:'It runs before the context exists, so it cannot be a bean; it is the place for Vault or cloud metadata.'},
{q:'Difference between EnvironmentPostProcessor and ApplicationContextInitializer?',o:['Identical','PostProcessor modifies Environment before context exists; Initializer runs after creation but before refresh','Initializer deprecated','PostProcessor only in tests'],a:1,e:'Both are SPI hooks; initializers run later and can register PropertySources or set profiles.'},
{q:'Where does RandomValuePropertySource sit in precedence?',o:['Above command line','Below application.properties','Above OS env','Last, so it only supplies a value nothing else defines'],a:3,e:'Random values are a fallback, appropriate for test ports and ephemeral credentials.'},
{q:'Which property source has the highest precedence among those SpringApplication installs?',o:['Command line arguments (SimpleCommandLinePropertySource)','SystemEnvironmentPropertySource','application.properties','RandomValuePropertySource'],a:0,e:'Command line arguments beat system properties and OS env vars in the default configuration.'},
{q:'How would you add a PropertySource whose values come from a remote service at startup?',o:['EnvironmentPostProcessor inserting a PropertySource before refresh','Override DispatcherServlet','Static initializer in main','Add a property'],a:0,e:'A remote fetch must happen before beans are created; doing it in a bean constructor makes failures harder to handle.'},
{q:'What is ApplicationContextInitializer for?',o:['After refresh','After web server start','Programmatic configuration before refresh, e.g. register a PropertySource or set profiles','Define beans'],a:2,e:'It runs after the context exists but before any singleton is instantiated.'},
{q:'Which mechanism activates a profile automatically when a cloud platform is detected?',o:['A @Bean reading System.getenv','spring.config.activate.on-cloud-platform in a bundled document','@Profile("cloud")','Static initializer'],a:1,e:'Boot detects the platform; the same jar behaves correctly on cluster and laptop with no flags.'},
{q:'What does spring.main.background-preinitialization=false do?',o:['Logging','Lazy beans','Starts server earlier','Disables concurrent background pre-init of beans, lengthening startup but improving ordering determinism'],a:3,e:'Useful for diagnosing ordering issues; disables the concurrent initialisation that shortens boot time.'},
{q:'Which listener reacts to the context being closed during shutdown?',o:['ApplicationListener<ContextClosedEvent>','ApplicationRunner','SpringApplicationRunListener','CommandLineRunner'],a:0,e:'The standard way to release external resources or deregister from discovery on shutdown.'},
{q:'What is spring.pid.file for?',o:['Writes the application PID to a file for supervisors','Prints the PID to console','Sets the process group id','Enables systemd integration'],a:0,e:'Equivalent to registering an ApplicationPidFileWriter; pair with spring.pid.fail-on-write-error.'},
/* 43–55 Web advanced */
{q:'Which annotation declares a declarative HTTP client interface in Spring 6 / Boot 3.2+?',o:['@FeignClient','@HttpExchange','@RestClient','@WebService'],a:1,e:'Combined with @GetExchange / @PostExchange on methods; implementations are generated.'},
{q:'Which factory turns @HttpExchange into a working proxy?',o:['HttpServiceProxyFactory','RestClientBuilder','WebClientFactory','ExchangeProxyFactory'],a:0,e:'HttpServiceProxyFactory.builder(clientAdapter).build().createClient(MyApi.class).'},
{q:'Which annotation imports a set of @HttpExchange interfaces as beans in Boot 3.4+?',o:['@EnableHttpInterfaces','@ImportHttpServices','@EnableRestClients','@EnableDeclarativeClients'],a:1,e:'Grouping lets you apply shared base URLs and timeouts per group.'},
{q:'What does server.forward-headers-strategy=framework do?',o:['Uses ForwardedHeaderFilter in Spring rather than container-level handling','Disables X-Forwarded-*','Adds outbound headers','Only rewrites Location'],a:0,e:'FRAMEWORK is container-agnostic; NATIVE configures Tomcat/Jetty/Undertow directly.'},
{q:'Which property enables gzip compression?',o:['server.compress=true','spring.compression.enabled=true','server.compression.enabled=true','http.compression=true'],a:2,e:'Pair with server.compression.mime-types and min-response-size; often handled at the proxy.'},
{q:'Which property enables HTTP/2?',o:['server.http2.enabled=true','http2.enabled=true','server.protocol=http2','spring.http.http2=true'],a:0,e:'Negotiated over TLS by default (h2); frequently configured at the ingress instead.'},
{q:'Which properties terminate TLS in the embedded server?',o:['Only server.ssl.enabled=true','server.ssl.key-store and server.ssl.key-store-password','server.tls.cert and server.tls.key','spring.ssl.enabled and spring.ssl.cert'],a:1,e:'A PKCS12 keystore and password are the minimum; TLS is often terminated at an ingress.'},
{q:'Which property sets the browser cache lifetime for static resources?',o:['server.static.cache-time','spring.web.resources.cache.cachecontrol.max-age','spring.resources.cache','web.cache.max-age'],a:1,e:'Long max-age with content-hashed filenames lets CDNs cache indefinitely.'},
{q:'Which starter auto-configures Thymeleaf?',o:['spring-boot-starter-web','spring-boot-starter-template','spring-boot-starter-thymeleaf','thymeleaf-spring'],a:2,e:'It configures the resolver to look in classpath:/templates/; String returns resolve to templates/<name>.html.'},
{q:'What does spring.thymeleaf.cache=false do?',o:['Clears once','Disables caching so template changes appear without restart','Disables templates','Disables dialects'],a:1,e:'Standard development setting; DevTools enables it automatically.'},
{q:'Which starter adds Spring Session with a JDBC store?',o:['spring-boot-starter-session','spring-boot-starter-session-jdbc','spring-boot-starter-data-session','spring-session-starter'],a:1,e:'Replaces the in-memory HTTP session with a database table for cross-instance sharing.'},
{q:'Which starter enables WebSocket support with STOMP?',o:['spring-boot-starter-realtime','spring-boot-starter-web-socket','spring-boot-starter-stomp','spring-boot-starter-websocket'],a:3,e:'Enable STOMP on a config class with @EnableWebSocketMessageBroker.'},
{q:'Which property sets the per-file limit for multipart uploads?',o:['server.upload.max-size','spring.servlet.multipart.max-file-size','spring.web.multipart.limit','spring.http.multipart.max'],a:1,e:'max-request-size sets the total request limit; raise both together.'},
/* 56–70 Data access */
{q:'How do you configure two DataSources in one Spring Boot app?',o:['Declare both @Bean, mark one @Primary, use @Qualifier / @ConfigurationProperties per prefix','Only one allowed','Two properties files','Two contexts'],a:0,e:'The auto-configured DataSource backs off once you declare your own; prefix binding keeps settings isolated.'},
{q:'How do you select a specific transaction manager for @Transactional?',o:['@TransactionalManager','@Transactional("tx2") or @Transactional(transactionManager = "tx2")','One annotation per manager','Not possible'],a:1,e:'Without the qualifier the @Primary manager is used, silently targeting the wrong database.'},
{q:'What does @EnableJpaAuditing enable?',o:['SQL logging','Automatic @CreatedDate, @LastModifiedDate, @CreatedBy and @LastModifiedBy population','Transaction auditing','Second-level cache'],a:1,e:'Add @EntityListeners(AuditingEntityListener.class) on the entity and an AuditorAware bean for the By fields.'},
{q:'Which properties enable Hibernate second-level cache?',o:['spring.jpa.cache=true','spring.jpa.properties.hibernate.cache.use_second_level_cache=true plus a provider','spring.cache.hibernate=true','Only @Cacheable'],a:1,e:'Add Caffeine or Hazelcast and annotate entities with @Cache; separate from the Spring cache abstraction.'},
{q:'Which starter auto-configures MongoDB with MongoTemplate and repositories?',o:['spring-boot-starter-mongo','spring-boot-starter-data-mongodb','spring-boot-starter-mongodb','spring-boot-starter-nosql'],a:1,e:'Configure the endpoint with spring.data.mongodb.uri.'},
{q:'Which property in Spring Boot 3 configures the Redis host?',o:['spring.redis.host','spring.data.redis.host','spring.cache.redis.host','redis.host'],a:1,e:'Boot 3 moved Redis properties under spring.data.redis.*; the old names no longer bind.'},
{q:'Which starter auto-configures Spring Data Elasticsearch?',o:['spring-boot-starter-data-elasticsearch','spring-boot-starter-elastic','spring-boot-starter-elasticsearch','spring-boot-starter-search'],a:0,e:'Client and server major versions must be compatible.'},
{q:'What distinguishes Spring Data JDBC from Spring Data JPA?',o:['Aggregate-oriented repositories without a JPA provider, lazy loading or persistence context','Identical','Only MySQL','No repositories'],a:0,e:'Issues explicit SQL and keeps entities as simple aggregates, so behaviour is predictable.'},
{q:'Which property makes data.sql run after Hibernate creates the schema?',o:['spring.sql.init.after-jpa=true','spring.jpa.defer-datasource-initialization=true','spring.datasource.late-init=true','spring.sql.init.mode=always alone'],a:1,e:'By default scripts run before JPA; deferring lets data.sql and schema.sql run after tables exist.'},
{q:'Which Hibernate property enables JDBC batching?',o:['spring.jpa.properties.hibernate.batch_size','spring.jdbc.batch=true','spring.jpa.properties.hibernate.jdbc.batch_size','spring.jpa.batch-size'],a:2,e:'Pair with order_inserts and order_updates, and avoid IDENTITY generation, which disables batching.'},
{q:'How is optimistic locking enabled in JPA?',o:['@Version on a numeric or timestamp field','Database trigger','SERIALIZABLE isolation','spring.jpa.lock=optimistic'],a:0,e:'The version is added to the UPDATE WHERE clause, throwing OptimisticLockException on conflict.'},
{q:'Which starter supports Spring Data R2DBC?',o:['spring-boot-starter-r2dbc','spring-boot-starter-data-r2dbc','spring-boot-starter-reactive-jdbc','spring-boot-starter-jdbc-reactive'],a:1,e:'Provides DatabaseClient, R2dbcEntityTemplate and reactive repositories; not an ORM.'},
{q:'Which annotation marks a @Query as an update/delete?',o:['@ReadOnly','@Modifying','@Transactional(readOnly = true)','@Query(nativeQuery = true)'],a:1,e:'Required on @Query methods that INSERT/UPDATE/DELETE; otherwise the query is treated as a read.'},
{q:'Which property shows the SQL Hibernate generates?',o:['spring.jpa.show-sql=true','spring.datasource.log-sql=true','spring.jpa.sql-log=true','hibernate.showSql=true'],a:0,e:'Pair with hibernate.format_sql=true for readability; prefer driver logging in production.'},
{q:'Which Spring Data MongoDB annotation declares a JSON query?',o:['@MongoQuery','@Query with a JSON document string and value-argument binding','@NativeQuery','@JsonQuery'],a:1,e:'@Query("{ \'name\' : ?0 }") binds parameters; MongoTemplate uses the fluent Criteria API.'},
/* 71–80 Testing */
{q:'What is ApplicationContextRunner used for?',o:['Running the app','Assertions on a minimal programmatic context without full test framework startup','HTTP tests','Mocking'],a:1,e:'The standard tool for testing auto-configuration classes; each test gets a fresh tiny context.'},
{q:'What does @SpringBootTest(webEnvironment = DEFINED_PORT) do?',o:['Starts a server on the configured server.port and fails if busy','Random port','MockMvc without server','Reactive server'],a:0,e:'Useful when a caller needs a fixed port; RANDOM_PORT is more robust for parallel runs.'},
{q:'Static vs instance @Container fields in Testcontainers?',o:['Identical','Static = one container per class; instance = start/stop per test method','Static cannot be shared','Instance deprecated'],a:1,e:'Static containers are much faster because startup dominates test time.'},
{q:'What is MockMvcTester in Spring Boot 3.4?',o:['A MockMvc replacement','An AssertJ-style fluent facade over MockMvc for natural request/response assertions','Reactive client','Mocking framework'],a:1,e:'assertThat(response).hasStatusOk().jsonPath(...) reads naturally while MockMvc does the work.'},
{q:'What does @Sql do in a @DataJpaTest?',o:['Executes SQL scripts before/after a test to set up or clean data','Generates SQL','Replaces DataSource','Disables transactions'],a:0,e:'Takes script paths and an executionPhase, running inside the test transaction by default.'},
{q:'What does @AutoConfigureTestDatabase(replace = Replace.NONE) do?',o:['Disables the DB','Uses the embedded DB','Prevents replacing your configured DataSource so tests hit the real database','Removes the bean'],a:2,e:'Standard when combining a slice with Testcontainers or a real staging database.'},
{q:'What is JacksonTester for?',o:['Mocking clients','AssertJ-style assertions on JSON serialisation/deserialisation','End-to-end HTTP','Testing entities'],a:1,e:'Wraps the configured ObjectMapper so Jackson annotation regressions are caught early.'},
{q:'Which annotation imports a test-only configuration class into a slice test?',o:['@Import','@Include','@ContextConfiguration only','@ComponentScan'],a:0,e:'@Import(MyTestConfig.class) adds the beans the slice needs; @TestConfiguration beans are not picked up automatically.'},
{q:'How does @MockitoSpyBean differ from @MockitoBean?',o:['Identical','Spy wraps the real bean, keeping real behaviour while allowing stubs and verification','Fully mocks the bean','Registers an AOP proxy'],a:1,e:'A spy stubs one method while keeping the rest real, which is usually what you actually want to test.'},
{q:'Which Testcontainers feature avoids restarting containers across JVM forks in CI?',o:['Reuse (testcontainers.reuse.enable=true) — convenient locally but discouraged in CI','JUnit extensions','@ServiceConnection','Docker Compose'],a:0,e:'Configured in .testcontainers.properties; CI usually wants a clean container per run.'},
/* 81–90 Observability & DevTools */
{q:'Which class creates a programmatic Observation in Micrometer?',o:['new Observation()','ObservationRegistry.observe(...) with an Observation.Context','Tracer.newObservation()','MeterRegistry.observe()'],a:1,e:'Observation.createNotStarted(...).observe(work) records metrics and traces from one call site.'},
{q:'Which annotation instruments a method with Micrometer Observation?',o:['@Observed','@Instrumented','@Timed','@Metered'],a:0,e:'Requires an ObservedAspect bean; replaces separate metric and tracing annotations.'},
{q:'How do you add a tag to every Micrometer meter?',o:['Annotate each metric','management.metrics.tags.<name>=<value> properties, or a MeterRegistryCustomizer bean','Use @Metered(tags=...)','METER_TAG env var'],a:1,e:'Global tags are ideal for environment, region or cluster labels.'},
{q:'Which property configures percentiles for a timer?',o:['management.metrics.distribution.percentiles','management.metrics.percentiles','spring.metrics.percentiles','metrics.distribution'],a:0,e:'Set percentiles-histogram=true to publish histograms suitable for server-side calculation.'},
{q:'Which property disables DevTools LiveReload?',o:['spring.devtools.livereload.enabled=false','spring.livereload.enabled=false','devtools.livereload=false','spring.devtools.live=false'],a:0,e:'LiveReload listens on 35729 by default and requires a browser extension.'},
{q:'Which property configures the DevTools remote debugging secret?',o:['spring.devtools.remote.secret','devtools.remote.key','spring.remote.password','spring.devtools.secret'],a:0,e:'The secret is supplied to RemoteSpringApplication; never expose the remote endpoint publicly.'},
{q:'What does spring.devtools.restart.trigger-file change?',o:['Restarts at a fixed time','Restarts only when the named file is modified, giving manual restart control','Disables restarts','Triggers on any change'],a:1,e:'Pairs well with IDEs that compile continuously, so you decide when to restart.'},
{q:'Why is DevTools excluded from the repackaged fat jar?',o:['Too large','Declared optional and excluded by repackage, so production never auto-restarts or opens LiveReload','Cannot run in a jar','Requires native code'],a:1,e:'Even if present, DevTools detects a packaged jar and disables itself; exclusion removes attack surface.'},
{q:'Which property disables DevTools automatic restart entirely?',o:['spring.devtools.restart.enabled=false','devtools.restart=false','spring.restart.enabled=false','spring.devtools.reload=false'],a:0,e:'Useful on a shared development server that still wants LiveReload without restart cost.'},
{q:'Which inputs populate /actuator/info with build and git data?',o:['A property alone','build-info and git-commit-id goals generating build-info.properties and git.properties','A bean alone','A static file'],a:1,e:'The endpoint reads those files; InfoContributor beans can add runtime data.'},
/* 91–100 Containerisation & integrations */
{q:'Which dependency activates Spring Boot Docker Compose support?',o:['spring-boot-starter-docker','spring-boot-docker-compose','spring-boot-compose','docker-compose-spring'],a:1,e:'With it on the classpath Spring Boot runs docker compose up at startup and registers connection details.'},
{q:'Which property points Docker Compose support at a non-default Compose file?',o:['spring.docker.compose.file','spring.compose.file','docker.compose.path','spring.docker.file'],a:0,e:'Related properties are spring.docker.compose.project and spring.docker.compose.skip.in-tests.'},
{q:'How do you generate a CDS archive for faster startup?',o:['-XX:ArchiveClassesAtExit=app.jsa, then -XX:SharedArchiveFile=app.jsa','spring.aot.enabled=true','spring-boot:cds','Not supported'],a:0,e:'CDS memory-maps pre-parsed class metadata; a low-risk complement to AOT and native images.'},
{q:'Which command extracts the layered jar for a Dockerfile?',o:['java -Djarmode=tools -jar app.jar extract','java -jar app.jar --extract','spring-boot:extract','docker layers extract'],a:0,e:'Extracted directories can be copied in separate Dockerfile steps so code-only changes invalidate the smallest layer.'},
{q:'Which property forces Kubernetes behaviour such as probe endpoints without an environment check?',o:['spring.main.cloud-platform=KUBERNETES','kubernetes.enabled=true','spring.profiles.active=kubernetes','server.kubernetes=true'],a:0,e:'Normally auto-detected; forcing it is useful in tests and unusual environments.'},
{q:'What does a @ServiceConnection method contribute in a Boot integration test?',o:['A JDBC string','A bean that derives connection properties from a container and registers them in the context','A mock','A transaction manager'],a:1,e:'Replaces boilerplate @DynamicPropertySource; Testcontainers containers annotated with @ServiceConnection auto-register their details.'},
{q:'Which property enables ResponseBodyAdvice-based response modification?',o:['No property; declaring a ResponseBodyAdvice bean in @ControllerAdvice is enough','spring.mvc.advice.enabled=true','server.response.advice=true','spring.web.response-advice=true'],a:0,e:'ResponseBodyAdvice modifies the serialised body of any controller returning through a message converter.'},
{q:'Which property makes Spring MVC accept ?format=json as a content-negotiation parameter?',o:['spring.mvc.contentnegotiation.favor-parameter=true','spring.mvc.format-parameter=true','spring.web.format=query','server.format.parameter=true'],a:0,e:'Usually discouraged for public APIs because it affects caching; prefer the Accept header.'},
{q:'Which properties configure a custom mail sender?',o:['spring.mail.host and spring.mail.port (plus username/password/properties)','spring.email.host','mail.host and mail.port','spring.smtp.host'],a:0,e:'Adding spring-boot-starter-mail auto-configures a JavaMailSender; properties map onto the JavaMail session.'},
{q:'Which resolver does Spring MVC use by default to determine the current locale?',o:['SessionLocaleResolver','CookieLocaleResolver','AcceptHeaderLocaleResolver','FixedLocaleResolver'],a:2,e:'It reads the Accept-Language header; declare a LocaleResolver bean to switch to session or cookie.'}
];
</script>

<script>
(function(){
  var TOTAL_SECONDS = 7200, remaining = TOTAL_SECONDS, timerId = null;
  var state = {cur:0, ans:new Array(QS.length).fill(null), revealed:new Array(QS.length).fill(false), marked:new Array(QS.length).fill(false), visited:new Array(QS.length).fill(false), submitted:false};
  var LETTERS = ['A','B','C','D'];
  function $(id){return document.getElementById(id);}
  function fmt(s){var m=Math.floor(s/60),sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
  function updateTimer(){var t=$('timer');t.textContent=fmt(remaining);t.classList.toggle('low',remaining<=300);}
  function startTimer(){clearInterval(timerId);timerId=setInterval(function(){remaining--;if(remaining<=0){remaining=0;updateTimer();clearInterval(timerId);submitExam(true);return;}updateTimer();},1000);}
  function buildPalette(){var g=$('pgrid');g.innerHTML='';for(var i=0;i<QS.length;i++){(function(i){var b=document.createElement('button');b.className='pbtn';b.textContent=i+1;b.dataset.i=i;b.addEventListener('click',function(){goTo(i);});g.appendChild(b);})(i);}}
  function refreshPalette(){var btns=document.querySelectorAll('.pbtn');for(var k=0;k<btns.length;k++){var b=btns[k];var i=+b.dataset.i;b.className='pbtn';if(state.visited[i])b.classList.add('seen');if(state.marked[i])b.classList.add('marked');if(state.ans[i]!==null)b.classList.add('answered');if(i===state.cur)b.classList.add('current');}}
  function refreshProgress(){var done=state.ans.filter(function(a){return a!==null;}).length;$('pbar').style.width=(done/QS.length*100)+'%';}
  function renderQuestion(){
    var i=state.cur,q=QS[i];state.visited[i]=true;
    $('qnum').textContent='Question '+(i+1)+' of '+QS.length;
    $('qtext').textContent=q.q;
    $('markTag').hidden=!state.marked[i];
    var wrap=$('options');wrap.innerHTML='';
    for(var idx=0;idx<q.o.length;idx++){(function(idx){
      var btn=document.createElement('button');btn.className='option';btn.type='button';
      var key=document.createElement('span');key.className='key';key.textContent=LETTERS[idx];
      var txt=document.createElement('span');txt.className='otext';txt.textContent=q.o[idx];
      btn.appendChild(key);btn.appendChild(txt);
      if(state.ans[i]===idx)btn.classList.add('selected');
      if(state.revealed[i]){btn.classList.add('locked');if(idx===q.a)btn.classList.add('correct');else if(state.ans[i]===idx)btn.classList.add('wrong');}
      else btn.addEventListener('click',function(){selectOption(idx);});
      wrap.appendChild(btn);
    })(idx);}
    var box=$('explainBox');
    if(state.revealed[i]){box.hidden=false;$('explainTitle').textContent='✅ Correct answer: '+LETTERS[q.a]+' — '+q.o[q.a];$('explainText').textContent=q.e;$('btnShow').textContent='🙈 Hide Answer';}
    else{box.hidden=true;$('btnShow').textContent='👁 Show Answer';}
    $('btnPrev').disabled=(i===0);$('btnNext').disabled=(i===QS.length-1);
    $('btnMark').textContent=state.marked[i]?'★ Unmark':'★ Mark for Review';
    refreshPalette();refreshProgress();window.scrollTo({top:0,behavior:'smooth'});
  }
  function selectOption(idx){if(state.submitted)return;var i=state.cur;if(state.revealed[i])return;state.ans[i]=(state.ans[i]===idx)?null:idx;renderQuestion();}
  function goTo(i){if(i<0||i>=QS.length)return;state.cur=i;renderQuestion();}
  function toggleMark(){if(state.submitted)return;state.marked[state.cur]=!state.marked[state.cur];renderQuestion();}
  function toggleReveal(){if(state.submitted)return;state.revealed[state.cur]=!state.revealed[state.cur];renderQuestion();}
  function submitExam(auto){
    if(state.submitted)return;
    if(!auto){
      var unanswered=state.ans.filter(function(a){return a===null;}).length;
      if(!confirm('Submit the test now?\n\nAnswered: '+(QS.length-unanswered)+'\nUnanswered: '+unanswered+'\n\nYou will still be able to review every answer and explanation.'))return;
    }
    state.submitted=true;clearInterval(timerId);
    $('quizView').hidden=true;$('resultView').hidden=false;
    renderResults(auto);window.scrollTo({top:0,behavior:'smooth'});
  }
  function renderResults(auto){
    var correct=0,wrong=0,skipped=0;
    for(var i=0;i<QS.length;i++){if(state.ans[i]===null)skipped++;else if(state.ans[i]===QS[i].a)correct++;else wrong++;}
    var pct=Math.round(correct/QS.length*100),used=TOTAL_SECONDS-remaining;
    var grade,gradeColor;
    if(pct>=90){grade='Outstanding 🏆';gradeColor='#16a34a';}
    else if(pct>=75){grade='Strong 👍';gradeColor='#0d9488';}
    else if(pct>=60){grade='Pass ✅';gradeColor='#f59e0b';}
    else if(pct>=40){grade='Needs review 📖';gradeColor='#ea580c';}
    else{grade='Keep practising 🔁';gradeColor='#dc2626';}
    var html='';
    if(auto)html+='<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';
    html+='<div class="scorecard"><h2>Spring Boot Mock Test — Set 3 Complete</h2><div class="bignum">'+pct+'%</div><div style="color:'+gradeColor+';font-weight:700;font-size:1.05rem">'+grade+'</div><div class="stats"><div class="st-ok"><b>'+correct+'</b>Correct</div><div class="st-bad"><b>'+wrong+'</b>Incorrect</div><div class="st-skip"><b>'+skipped+'</b>Unanswered</div><div><b>'+fmt(used)+'</b>Time used</div></div><div style="margin-top:20px"><button class="btn primary" id="btnRetake">🔄 Retake Test</button> <button class="btn ghost" id="btnBackTop">↑ Back to top</button></div></div>';
    html+='<div class="filters"><button class="fbtn active" data-f="all">All ('+QS.length+')</button><button class="fbtn" data-f="wrong">Incorrect ('+wrong+')</button><button class="fbtn" data-f="skipped">Unanswered ('+skipped+')</button><button class="fbtn" data-f="correct">Correct ('+correct+')</button></div>';
    for(var j=0;j<QS.length;j++){
      var q=QS[j],status,cls;
      if(state.ans[j]===null){status='skipped';cls='skip';}
      else if(state.ans[j]===q.a){status='correct';cls='ok';}
      else{status='wrong';cls='bad';}
      html+='<div class="revitem '+cls+'" data-status="'+status+'"><p class="revq">Q'+(j+1)+'. '+q.q+'</p>';
      if(state.ans[j]===null){
        html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
        html+='<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">'+LETTERS[q.a]+') '+q.o[q.a]+'</span></div>';
      }else if(state.ans[j]===q.a){
        html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">'+LETTERS[state.ans[j]]+') '+q.o[state.ans[j]]+' ✓</span></div>';
      }else{
        html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">'+LETTERS[state.ans[j]]+') '+q.o[state.ans[j]]+' ✗</span></div>';
        html+='<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">'+LETTERS[q.a]+') '+q.o[q.a]+'</span></div>';
      }
      html+='<div class="revexp"><b>Explanation:</b> '+q.e+'</div></div>';
    }
    $('resultView').innerHTML=html;
    $('btnRetake').addEventListener('click',retake);
    $('btnBackTop').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
    var fbtns=document.querySelectorAll('.fbtn[data-f]');
    for(var k=0;k<fbtns.length;k++){(function(b){
      b.addEventListener('click',function(){
        var all=document.querySelectorAll('.fbtn[data-f]');
        for(var n=0;n<all.length;n++)all[n].classList.remove('active');
        b.classList.add('active');
        var f=b.dataset.f,items=document.querySelectorAll('.revitem');
        for(var n=0;n<items.length;n++){items[n].style.display=(f==='all'||items[n].dataset.status===f)?'':'none';}
      });
    })(fbtns[k]);}
  }
  function retake(){
    state.ans.fill(null);state.revealed.fill(false);state.marked.fill(false);state.visited.fill(false);
    state.cur=0;state.submitted=false;
    remaining=TOTAL_SECONDS;updateTimer();startTimer();
    $('resultView').hidden=true;$('quizView').hidden=false;renderQuestion();
  }
  $('btnPrev').addEventListener('click',function(){goTo(state.cur-1);});
  $('btnNext').addEventListener('click',function(){goTo(state.cur+1);});
  $('btnMark').addEventListener('click',toggleMark);
  $('btnShow').addEventListener('click',toggleReveal);
  $('btnSubmit').addEventListener('click',function(){submitExam(false);});
  $('togglePalette').addEventListener('click',function(){
    var g=$('pgrid'),l=$('legend'),hidden=g.style.display==='none';
    g.style.display=hidden?'':'none';l.style.display=hidden?'':'none';
    $('togglePalette').textContent=hidden?'Hide':'Show';
  });
  document.addEventListener('keydown',function(e){
    if(state.submitted)return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    var k=e.key;
    if(k==='ArrowRight'){e.preventDefault();goTo(state.cur+1);}
    else if(k==='ArrowLeft'){e.preventDefault();goTo(state.cur-1);}
    else if(['1','2','3','4'].indexOf(k)!==-1){e.preventDefault();selectOption(+k-1);}
    else if(k.toLowerCase()==='r'){e.preventDefault();toggleMark();}
    else if(k.toLowerCase()==='s'){e.preventDefault();toggleReveal();}
  });
  $('qcountPill').textContent=QS.length+' Questions';
  buildPalette();updateTimer();startTimer();renderQuestion();
})();
</script>
</body>
</html>
