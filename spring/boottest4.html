<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Mock Test — Set 4 · 100 MCQs</title>
<meta name="description" content="100 Spring Boot MCQs (Set 4): Actuator endpoint internals, all test slices, reactive WebFlux, Spring Batch, JMS/Kafka, native reachability metadata, security depth, GraphQL and HATEOAS.">
<style>
  :root{--brand:#0284c7;--brand-dark:#075985;--accent:#7dd3fc;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#0c4a6e;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0f2fe;border-color:#bae6fd}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(2,132,199,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#e0f2fe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 Spring Boot Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* ---------- 1–15: Actuator endpoint internals ---------- */
{q:'Which Actuator endpoint lists every bean in the application context, including its type and dependencies?',
 o:['/actuator/conditions','/actuator/beans','/actuator/context','/actuator/registry'],a:1,
 e:'/actuator/beans returns the full bean registry grouped by name. It is the fastest way to confirm a bean exists and to inspect its dependencies without adding logs.'},

{q:'Which endpoint shows the same positive and negative matches as the --debug startup report?',
 o:['/actuator/conditions','/actuator/startup','/actuator/configprops','/actuator/autoconfig'],a:0,
 e:'/actuator/conditions is the runtime view of the ConditionEvaluationReport. Unlike --debug, it is available on a running instance without restarting.'},

{q:'Which endpoint allows you to clear a cache that was registered with the Spring cache abstraction?',
 o:['/actuator/caches (POST to /actuator/caches/{name})','/actuator/refresh','/actuator/clear','/actuator/cachemanagers'],a:0,
 e:'It works only when a CacheManager bean exists and is well suited to busting a stale cache without redeploying. DELETE /actuator/caches clears them all.'},

{q:'Which endpoint lists the @Scheduled methods and their cron, fixedRate or fixedDelay triggers?',
 o:['/actuator/tasks','/actuator/scheduling','/actuator/scheduledtasks','/actuator/jobs'],a:2,
 e:'It is genuinely useful for spotting a misconfigured cron expression before it does damage. The endpoint is read-only and never triggers a task.'},

{q:'Which endpoint exposes every request mapping across @RequestMapping, functional endpoints and Actuator endpoints?',
 o:['/actuator/routes','/actuator/mappings','/actuator/endpoints','/actuator/web'],a:1,
 e:'/actuator/mappings is the runtime equivalent of a route table and is invaluable when a 404 suggests a controller is not registered as expected.'},

{q:'What does /actuator/startup (Spring Boot 2.4+) expose?',
 o:['The number of tasks executed','A timeline of the startup steps captured with buffering, useful for diagnosing slow startup','The servlet context path','The startup exception class'],a:1,
 e:'It requires a BufferingApplicationStartup bean. Each step shows its duration and parent step, so you can see exactly which auto-configuration or runner is slow.'},

{q:'Which endpoint reports the state of Flyway migrations?',
 o:['/actuator/db','/actuator/migrations','/actuator/flyway','/actuator/schema'],a:2,
 e:'It lists every applied migration with its version and status. It is enabled only when Flyway is on the classpath and auto-configuration ran.'},

{q:'Which endpoint reports the state of Liquibase changesets?',
 o:['/actuator/liquibase','/actuator/changesets','/actuator/changelog','/actuator/migrations'],a:0,
 e:'It lists applied changesets with execution context and deployment id, which is the fastest way to confirm a migration actually ran in an environment.'},

{q:'Which endpoint lists active HTTP sessions when Spring Session is on the classpath?',
 o:['/actuator/sessions','/actuator/session','/actuator/springsession','/actuator/web-sessions'],a:0,
 e:'It is enabled by spring-session-core and works with JDBC, Redis and Hazelcast stores. DELETE /actuator/sessions/{id} expires a specific session.'},

{q:'Which dependency enables the /actuator/prometheus endpoint?',
 o:['spring-boot-starter-actuator alone','micrometer-registry-prometheus','spring-boot-starter-prometheus','micrometer-core'],a:1,
 e:'The Actuator starter provides the endpoint infrastructure, but the Prometheus registry dependency is what produces the scrapeable text format.'},

{q:'What does /actuator/logfile return?',
 o:['The contents of the log file configured by logging.file.name, with Range and HEAD request support','The last 100 log lines only','The logback configuration','The logger levels'],a:0,
 e:'If logging.file.name is not set, the endpoint is not available. Range requests make it usable for tailing large files from a browser.'},

{q:'What does /actuator/auditevents expose?',
 o:['A list of user actions','Application events','An audit trail of authentication success and failure events published by Spring Security','Database audit logs'],a:2,
 e:'It is enabled when spring-boot-starter-security is present and an AuditEventRepository bean exists. It complements rather than replaces a real audit database.'},

{q:'Which three annotations can decorate methods of a class annotated with @Endpoint?',
 o:['@Get, @Post, @Put','@ReadOperation, @WriteOperation, @DeleteOperation','@Query, @Mutation, @Subscribe','@Handle, @Invoke, @Remove'],a:1,
 e:'The operation is automatically exposed over JMX and, if web exposure is enabled, over HTTP. @Selector on a parameter adds a path variable to the web form.'},

{q:'What is @EndpointWebExtension used for?',
 o:['A replacement for @Endpoint','Adding web-specific operations to an endpoint that also exists over JMX, such as returning HTTP-specific data','Hiding the endpoint from JMX','Enabling SSL on the endpoint'],a:1,
 e:'It lets the JMX and HTTP representations diverge where necessary, for example to return a Content-Type or to expose a download operation only over HTTP.'},

{q:'What does @Selector do on a parameter of an @Endpoint operation?',
 o:['Selects the transport (JMX vs HTTP)','Selects the security realm','Binds a path variable so the operation becomes /actuator/myendpoint/{name}','Selects the logging level'],a:2,
 e:'It is the standard way to build a resource-style custom endpoint, for example /actuator/myendpoint/{name} for a lookup. Only one selector parameter is supported per operation.'},

/* ---------- 16–30: Test slices & advanced testing ---------- */
{q:'Which slice test is designed for Spring Data JDBC and plain JDBC components?',
 o:['@JdbcTest','@JooqTest','@DataJdbcTest','@SqlTest'],a:0,
 e:'@JdbcTest configures an embedded DataSource, JdbcTemplate and transaction management only. It is the right slice for repository classes that use JdbcTemplate or Spring Data JDBC.'},

{q:'Which slice test auto-configures jOOQ DSLContext?',
 o:['@JooqTest','@JdbcTest','@DataJdbcTest','@QueryTest'],a:0,
 e:'It replaces the DataSource with an embedded one and configures the jOOQ DSLContext, so you can test DSL queries without the full application context.'},

{q:'Which slice test targets GraphQL controllers written with @QueryMapping and @MutationMapping?',
 o:['@WebMvcTest','@WebFluxTest','@GraphQlTest','@ApiTest'],a:2,
 e:'@GraphQlTest configures the GraphQL infrastructure, the schema and the GraphQlTester, without loading unrelated web or data beans.'},

{q:'Which slice test is used for Spring Data MongoDB repositories?',
 o:['@DataMongoTest','@MongoTest','@DataRepositoryTest','@DocumentTest'],a:0,
 e:'It auto-configures a MongoTemplate and repositories and, when the MongoDB driver is present, tries to run an embedded MongoDB server. Testcontainers is the modern alternative.'},

{q:'Which slice test is used for Spring Data Redis repositories?',
 o:['@DataRedisTest','@RedisTest','@CacheTest','@DataKeyValueTest'],a:0,
 e:'It configures RedisConnectionFactory and repositories. In practice, most teams point it at a Testcontainers Redis rather than a real server because embedded Redis projects are unreliable.'},

{q:'Which slice test is used for Spring Data Neo4j repositories?',
 o:['@GraphTest','@DataNeo4jTest','@Neo4jTest','@DataGraphTest'],a:1,
 e:'It configures a Neo4j client and repository scanning. As with MongoDB, Testcontainers is the standard way to provide a real server in CI.'},

{q:'How do you stub an external HTTP API in an integration test with a real server rather than MockMvc?',
 o:['MockRestServiceServer','WebTestClient','WireMockServer started on a dynamic port, with the client base URL pointed at it','@MockBean on the HTTP client'],a:2,
 e:'WireMock provides a real HTTP server with stubs, request verification and fault injection. Use @DynamicPropertySource or @ServiceConnection to set the base URL, so the production client is exercised end to end.'},

{q:'How do you use RestAssured against a @SpringBootTest with RANDOM_PORT?',
 o:['RestAssured.baseURI = "http://localhost"; RestAssured.port = port; with @LocalServerPort','RestAssured is not compatible with Spring Boot','Inject MockMvc and call RestAssured.fromMockMvc()','Use @AutoConfigureRestAssured only'],a:0,
 e:'Spring Boot also supports RestAssured.fromMockMvc(mockMvc) for BDD-style assertions without a real server. Both are commonly used in different test tiers.'},

{q:'What does OutputCaptureExtension provide in a Spring Boot test?',
 o:['It redirects logs to a file','It captures stdout and stderr so you can assert on log output','It disables logging','It writes logs to Kafka'],a:1,
 e:'It is a JUnit 5 extension that gives you a CapturedOutput parameter. It is the clean way to test that a warning was logged without resorting to static state.'},

{q:'What is TestPropertyValues used for?',
 o:['Writes properties to application.properties','Adds properties to a ConfigurableEnvironment programmatically in a test','Removes properties from the environment','Mocks all properties'],a:1,
 e:'TestPropertyValues.of("a=1","b=2").applyTo(env) is a neat way to configure an ApplicationContextRunner or a manually built context without annotations.'},

{q:'How does a @Nested inner class in a @SpringBootTest behave with respect to context caching?',
 o:['Each @Nested class creates a new context','The context is shared with the outer class unless the nested class adds configuration that changes the context cache key','@Nested is not supported by Spring Test','@Nested runs in parallel with the outer class'],a:1,
 e:'Adding @MockitoBean, @TestPropertySource or extra @Import to a nested class changes the cache key and forces a new context. Keeping those out of nested classes preserves the caching benefit.'},

{q:'What does @ImportAutoConfiguration do in a test?',
 o:['Runs the full application','Imports a specific auto-configuration class without loading the whole application context','Disables auto-configuration','Imports beans from another module'],a:1,
 e:'It is used alongside ApplicationContextRunner to test an auto-configuration in isolation, for example @ImportAutoConfiguration(MyFeatureAutoConfiguration.class) on a plain (non-@SpringBootTest) test.'},

{q:'How do JUnit 5 @ParameterizedTest methods interact with @SpringBootTest?',
 o:['They do not work with Spring','Each parameterised invocation runs with the same cached ApplicationContext and injected fields','Each invocation forces a fresh context','They require @TestConstructor'],a:1,
 e:'Parameterised tests share the context, which is why they are a great way to test many inputs against the same expensive setup. Inject dependencies as fields or via constructor injection with @TestConstructor.'},

{q:'Which annotation explicitly declares the configuration classes for a @SpringBootTest and stops it from searching for @SpringBootConfiguration?',
 o:['@SpringBootTest(classes = MyConfig.class)','@ContextConfiguration only','@Import','@SpringBootConfiguration'],a:0,
 e:'It is essential for multi-module projects where the main class lives in a different module. Without it, the test fails with "Unable to find a @SpringBootConfiguration".'},

{q:'What is @BootstrapWith for in Spring Test?',
 o:['Bootstrapping a Docker container','Applying a TestContextBootstrapper to customise how the test context is built, used when writing a custom slice annotation','Registering a @Configuration','Loading properties'],a:1,
 e:'Meta-annotations such as @WebMvcTest use it internally. It is the extension point for building your own test slice with the same semantics as the built-in ones.'},

/* ---------- 31–45: Reactive & WebFlux ---------- */
{q:'What is the key difference between WebClient.retrieve() and exchangeToMono()?',
 o:['They are the same','retrieve() gives declarative status handling through onStatus; exchangeToMono() gives access to the full ClientResponse including headers and body','exchangeToMono() is blocking','retrieve() only supports GET'],a:1,
 e:'Use retrieve() for the common case and exchangeToMono() when the error body, headers or status-specific response shape is part of the contract.'},

{q:'How do you turn a non-2xx WebClient response into an exception?',
 o:['onStatus(status -> status.isError(), resp -> Mono.error(...))','retrieve().onSuccess(...)','.block() on the response','throwOnError()'],a:0,
 e:'onStatus is called for the matching statuses only, and returning an empty Mono lets the response pass through. Missing onStatus is one of the most common reasons errors go undetected.'},

{q:'What is the recommended way to apply a timeout to a WebClient call?',
 o:['setConnectTimeout only','apply a Mono.timeout(...) operator around the call, or configure an HttpClient with responseTimeout','setReadTimeout on the WebClient','Use a CompletableFuture'],a:1,
 e:'Mono.timeout cancels the whole call; HttpClient.responseTimeout bounds the time to the first response byte. Both are useful together, and both are configured globally via ClientHttpConnector where possible.'},

{q:'What does reactor.util.retry.Retry.backoff(...) provide over a simple retry()?',
 o:['Nothing','Exponential or filtered retries with a maximum count and optional jitter, applied via retryWhen','It retries forever','It retries only on 4xx'],a:1,
 e:'retryWhen(Retry.backoff(3, Duration.ofMillis(100))) retries only on the configured errors and applies backoff. Filters such as filter(e -> e instanceof WebClientResponseException.ServiceUnavailable.class) keep retries meaningful.'},

{q:'What is the practical difference between flatMap and concatMap?',
 o:['flatMap preserves order; concatMap does not','concatMap preserves order by processing one inner publisher at a time; flatMap subscribes to all inners concurrently and interleaves results','They are identical','concatMap is blocking'],a:1,
 e:'Use concatMap when ordering matters and flatMap(..., concurrency) when throughput matters more. This is one of the most common causes of intermittent ordering bugs in reactive code.'},

{q:'What is the difference between subscribeOn and publishOn?',
 o:['subscribeOn affects where the subscription and upstream work happen; publishOn shifts downstream work to another scheduler','They are identical','publishOn changes the data type','subscribeOn is for Mono only'],a:0,
 e:'subscribeOn is usually applied once, at the start of the chain, to control the source scheduler. publishOn can appear multiple times to move work off an event loop before blocking or CPU-heavy operators.'},

{q:'What does backpressure mean in Project Reactor?',
 o:['Dropping records when overloaded','The subscriber signals how many elements it can accept, and the publisher emits at most that many','Buffering forever','Retrying failed requests'],a:1,
 e:'Flux supports request(n) and strategies like onBackpressureBuffer, drop or latest. WebFlux returns Reactive Streams types, so backpressure is available end to end over HTTP/2 and SSE.'},

{q:'Which class configures security in a WebFlux application?',
 o:['HttpSecurity','ServerHttpSecurity','WebSecurity','SecurityFilterChain'],a:1,
 e:'ServerHttpSecurity is the reactive equivalent of HttpSecurity and is exposed by a SecurityWebFilterChain bean. Using HttpSecurity in a WebFlux application causes a startup failure.'},

{q:'What does WebTestClient.bindToRouterFunction(myRouter).build() do?',
 o:['Starts a real server','Binds the test client to a functional router without a running server, so the full reactive pipeline is exercised','Mocks the router','Blocks the router'],a:1,
 e:'bindToApplicationContext, bindToController and bindToServer cover the other common cases. All of them share the same assertion API.'},

{q:'How does a transaction work with R2DBC?',
 o:['@Transactional works exactly as with JDBC','Use TransactionalOperator, or annotate the method with @Transactional and rely on the reactive transaction manager','R2DBC has no transactions','Transactions must be managed manually with connection.commit()'],a:1,
 e:'Spring\'s reactive transaction support is built into @Transactional; you just need a ReactiveTransactionManager bean (R2dbcTransactionManager). For manual control, TransactionalOperator.execute is the API.'},

{q:'How do Kotlin coroutines integrate with WebFlux controllers in Spring Boot?',
 o:['Not supported','Suspend functions can be used directly in @RestController methods, and the framework adapts them to Mono and Flux','Only with a plugin','Only with Mono'],a:1,
 e:'Kotlin suspend functions are treated as asynchronous return types. WebTestClient and WebClient also expose awaitBody and similar extensions, so a coroutine-based stack is fully supported.'},

{q:'What does returning a Flux<ServerSentEvent<T>> from a controller produce?',
 o:['A chunked download','A Server-Sent Events stream over text/event-stream, with backpressure applied to the source','A JSON array','A WebSocket'],a:1,
 e:'SSE is simpler than WebSockets and works through most proxies. It is often the right choice for dashboards and notifications where one-way streaming is sufficient.'},

{q:'How do you propagate a value (such as a trace id) through a reactive chain?',
 o:['ThreadLocal','Reactor Context: contextWrite(...) and deferContextual { ctx -> ... }','Static fields','MDC only'],a:1,
 e:'Reactor Context is attached to the subscriber chain, which is why ThreadLocal-based tracing does not work in WebFlux. Micrometer Context Propagation bridges Reactor Context and MDC for logging.'},

{q:'What does the system property reactor.tools.agent.reactorDebugAgent do?',
 o:['Disables logging','Enables the Reactor debug agent, which enriches stack traces with operator assembly information at runtime','Enables the block-detection agent','Turns on checkpoints'],a:1,
 e:'Without it, reactive stack traces show assembly points rather than the actual chain. Spring Boot can add the agent automatically with spring.reactor.debug-agent.enabled=true.'},

/* ---------- 46–60: Batch, JMS & Kafka ---------- */
{q:'What is the relationship between a Job and a Step in Spring Batch?',
 o:['They are interchangeable','A Job is the whole batch process made up of one or more Steps executed in order; each Step can be a chunk or a tasklet','A Step contains multiple Jobs','Only Jobs execute'],a:1,
 e:'Jobs also have flow, decision and split variants, but the fundamental unit is Job → Steps → (Reader, Processor, Writer) or Tasklet.'},

{q:'In a chunk-oriented step, what does the commit-interval control?',
 o:['The maximum number of items read, processed and written per transaction','The number of retries','The file size','The parallelism'],a:0,
 e:'With a chunk size of 100, the reader-processor-writer sequence runs 100 times and then a single transaction commits. Chunk size is the most important performance tuning knob.'},

{q:'When would you use a Tasklet step instead of a chunk-oriented step?',
 o:['For bulk reads and writes','For simple, non-item-oriented work such as calling an API once, deleting a table or sending a notification','Only for file processing','Never'],a:1,
 e:'A Tasklet gets one execute() call and returns a RepeatStatus. A common pattern is a Tasklet step that deletes staging data after a chunk step has run.'},

{q:'What does Spring Batch do when a Job fails and is started again?',
 o:['It restarts from the beginning by default','It resumes from the last committed position and step exit status, which requires job parameters to include the same identifying value','It always recreates the JobRepository','It cannot be restarted'],a:1,
 e:'Restartability is a core Batch feature. Adding a unique run id such as a timestamp to the JobParameters is the standard trick to deliberately start a fresh execution instead of resuming.'},

{q:'What is the JobRepository responsible for?',
 o:['Storing job configuration','Persisting JobExecution, StepExecution and context so jobs can restart and be inspected','Scheduling jobs','Reading input'],a:1,
 e:'By default it uses an in-memory database, which works for demos but loses state on restart. Production requires a real schema (the Batch metadata tables) so restart and monitoring work.'},

{q:'What does Spring Batch partitioning enable?',
 o:['Reading multiple files at once','Splitting a step into several sub-steps that run in parallel across threads or worker nodes, with a manager step coordinating them','Restarting failed jobs','Committing more often'],a:1,
 e:'Partitioner implementations decide the split, and a partition handler executes the sub-steps. Remote partitioning is common for scaling heavy batch workloads horizontally.'},

{q:'Which starter auto-configures Spring\'s JMS abstraction?',
 o:['spring-boot-starter-jms','spring-boot-starter-messaging','spring-boot-starter-activemq','spring-boot-starter-amqp'],a:0,
 e:'spring-boot-starter-activemq is the ActiveMQ-specific starter for embedded and external brokers. The generic JMS starter gives you JmsTemplate and @JmsListener without assuming a broker.'},

{q:'What does JmsTemplate do?',
 o:['Configures the broker','Sends and receives JMS messages synchronously with connection and session handling taken care of','Provides an asynchronous listener','Creates queues only'],a:1,
 e:'JmsTemplate is the synchronous façade; @JmsListener handles asynchronous consumption. For very high throughput, consider the caching connection factory or a dedicated messaging library.'},

{q:'What does the concurrency attribute on @KafkaListener control?',
 o:['The number of topics','The number of consumer threads created by the listener container, which must not exceed the topic\'s partition count','The number of producer retries','The fetch size'],a:1,
 e:'Extra threads beyond the partition count sit idle. concurrency is the main way to scale a listener, and it is often paired with scaling the topic\'s partition count first.'},

{q:'Which property configures a Kafka listener to acknowledge messages after processing?',
 o:['spring.kafka.listener.ack-mode=manual or record, depending on the desired granularity','spring.kafka.consumer.ack=true','spring.kafka.listener.manual=true','Ack is not configurable'],a:0,
 e:'Values include RECORD, BATCH, TIME, COUNT, MANUAL and MANUAL_IMMEDIATE. With manual ack, the listener receives an Acknowledgment parameter and calls acknowledge() only after processing succeeds.'},

{q:'Which starter enables Kafka Streams with auto-configuration?',
 o:['spring-boot-starter-kafka','spring-boot-starter-kafka-streams','spring-boot-starter-streams','spring-kafka-streams'],a:1,
 e:'It auto-configures StreamsBuilderFactoryBean and wires the topology into the application lifecycle. spring.kafka.streams.* configures application id, bootstrap servers and properties.'},

{q:'How would you send a record to a specific Kafka partition?',
 o:['KafkaTemplate.send() always round-robins','KafkaTemplate.send(topic, partition, key, value)','Set a header','It is not possible'],a:1,
 e:'Specifying the partition overrides the partitioner. It is rarely needed outside tests, and using the key is usually more robust because the partitioner remains the single source of truth.'},

{q:'What does a Spring Kafka DeadLetterPublishingRecoverer do?',
 o:['Retries failed records','Publishes records that fail processing to a dead letter topic, preserving headers and error details','Logs the error','Blocks the consumer'],a:1,
 e:'It is installed on a DefaultErrorHandler. Combined with a limited retry policy, it gives you the classic bounded-retry-then-DLT pattern without custom code.'},

{q:'What does the KafkaAdmin auto-configuration provide?',
 o:['Cluster monitoring','Programmatic topic creation and configuration through NewTopic beans','Consumer group management','Schema registry management'],a:1,
 e:'Declaring a NewTopic bean registers the topic at startup when spring.kafka.admin.fail-fast is set. It is convenient in development and CI, but production topics are usually provisioned by infrastructure code.'},

{q:'What does JmsTemplate.setDeliveryPersistent(true) control?',
 o:['Message encryption','Whether the broker persists the message to disk so it survives a broker restart','Ack mode','Consumer concurrency'],a:1,
 e:'By default JMS delivery is persistent for queue destinations. For non-critical telemetry, setting it to false can measurably increase throughput at the cost of losing messages on broker restart.'},

/* ---------- 61–75: Native, Docker & cloud deployment ---------- */
{q:'What is GraalVM reachability metadata, and why does it matter for Spring Boot native images?',
 o:['A list of classes to exclude','A JSON file describing reflection, resources and proxies used by a library, so native-image knows what to preserve at build time','A logging configuration','A JDK module file'],a:1,
 e:'Modern libraries ship reachability metadata under META-INF/native-image. Spring Boot\'s AOT engine generates its own contribution, and Native Build Tools can generate missing hints automatically.'},

{q:'What does a class annotated with @NativeHint do?',
 o:['Runs only in native mode','Declares the reflection, resource, proxy and serialization requirements for native-image in code, in a class registered via AOT factories','AOT-compiles the class','Disables the AOT engine'],a:1,
 e:'@NativeHint is a shortcut for the more programmatic RuntimeHintsRegistrar. Use it for a fixed set of hints and a RuntimeHintsRegistrar when the hints must be computed.'},

{q:'What is the main advantage of a multi-stage Dockerfile with the extracted layers over a single `COPY app.jar`?',
 o:['It produces a smaller image','It places dependencies in a layer that rarely changes, so a code-only rebuild only invalidates the small application layer','It uses less CPU to build','It removes the need for a JRE'],a:1,
 e:'The application layer is typically tens of kilobytes; the dependency layer is tens of megabytes. Separating them reduces push and pull time on every code change.'},

{q:'Which env var customises the buildpack JVM version in the OCI image produced by spring-boot:build-image?',
 o:['BP_JVM_VERSION=21','JAVA_VERSION=21','SPRING_BOOT_VERSION=21','BOOT_JVM=21'],a:0,
 e:'BP_* variables are the Paketo buildpack contract. BP_JVM_TYPE=JDK is useful when you need a compiler in the image, for example to run GraalVM native builds inside a buildpack build.'},

{q:'What does a jlink custom runtime achieve?',
 o:['A faster JVM','A trimmed Java runtime image containing only the modules your application needs, typically 40–60 MB smaller than a full JDK','A cross-platform image','A GraalVM replacement'],a:1,
 e:'The spring-boot-maven-plugin can produce one with jarmode=tools plus a JRE layout. Buildpacks do this automatically, which is one of the reasons they produce compact images without a Dockerfile.'},

{q:'What is a CDS training run?',
 o:['A performance benchmark','Starting the application once with -XX:ArchiveClassesAtExit to record loaded classes, then reusing the archive with -XX:SharedArchiveFile on every later start','A native-image build','A logging configuration'],a:1,
 e:'CDS reduces startup time and memory by memory-mapping pre-parsed class metadata. It requires running the application in the same way each time, so the archive matches.'},

{q:'In a Kubernetes Deployment for a Spring Boot app with startup probes, what is the recommended property set?',
 o:['Only liveness','management.endpoint.health.probes.enabled=true plus liveness and readiness groups; use a startup probe to give slow boots time before liveness begins','server.probes.enabled=true','spring.kubernetes.probes=true'],a:1,
 e:'A startup probe delays liveness checks until the app is up, which avoids restart loops on slow boots. Readiness should depend on dependencies; liveness must not, or a dependency outage triggers restarts.'},

{q:'What is a Bindable bean in Spring Boot\'s service-binding support?',
 o:['A bean that binds to a database','A component that contributes connection details for a service so a test or platform binding can be applied uniformly','A Docker volume','A Kubernetes ConfigMap'],a:1,
 e:'Service bindings (Bindable, Bindings) let Testcontainers, Cloud Foundry and Kubernetes provide connection details through the same mechanism. @ServiceConnection is a shortcut for the common Testcontainers case.'},

{q:'Which file does Cloud Foundry use to describe how a Spring Boot app is pushed?',
 o:['application.yml','manifest.yml','Dockerfile','cf.properties'],a:1,
 e:'manifest.yml describes the application name, path, memory, instances, environment and services. The Java buildpack detects a Spring Boot jar automatically, so no custom build file is required.'},

{q:'How do you deploy a Spring Boot app with Helm?',
 o:['Use the built-in spring-boot helm chart','Package your Kubernetes manifests into a chart with templates and values.yaml, or use a generic chart such as the Bitnami Java chart, and deploy with helm install','Helm cannot deploy Spring Boot','Only docker compose is supported'],a:1,
 e:'There is no official Spring Boot chart, but the deployment shape (Deployment, Service, Ingress, ConfigMap, Secret, HPA, probes) is highly standardised, which is why generic charts and platform scaffolding work well.'},

{q:'Which Maven goal runs the application in test mode with a JUnit listener before the tests, so Testcontainers in main code are supported?',
 o:['spring-boot:run','spring-boot:test-run','spring-boot:start','spring-boot:integration-test'],a:1,
 e:'Test-run supports the Docker Compose module and Testcontainers @ServiceConnection in main code, so integration tests can rely on the same infrastructure as production without extra setup.'},

{q:'What does spring.main.register-shutdown-hook=false do, and when is it appropriate?',
 o:['Disables all cleanup','Stops Spring from installing its shutdown hook; appropriate when another mechanism, such as a Kubernetes preStop script, controls shutdown','Skips bean destroy methods','Disables the web server'],a:1,
 e:'If you disable it, you must call context.close() yourself. Otherwise beans with @PreDestroy are never called, which leaks connections, threads and file handles.'},

{q:'Which property enables the Reactor blockHound agent automatically, useful for catching blocking calls in a reactive pipeline?',
 o:['spring.reactor.blockhound.enabled=true (blockHound on the classpath)','spring.reactor.debug=true','reactor.blocking=true','spring.reactor.strict=true'],a:0,
 e:'BlockHound throws when a blocking call appears on an event-loop thread. It is a development-time tool, so it should never be enabled in production, where the exception would break legitimate work.'},

{q:'What is the layered jar\'s "application" layer?',
 o:['The base image','The snapshot dependencies','Your own classes and resources, typically the smallest and most frequently changing layer','The JVM'],a:2,
 e:'dependencies, spring-boot-loader and snapshot-dependencies change far less often. Copying the application layer last means a code-only change invalidates only that small layer, dramatically cutting rebuild and push time.'},

{q:'What does a startup failure produce by default when the application is packaged as a fat jar?',
 o:['Silent exit code 0','A FailureAnalysis report with a clear cause, and a non-zero exit code (1 by default)','A core dump','A hang'],a:1,
 e:'The exit code can be customised with ExitCodeGenerator. The report typically names the bean or configuration that failed and suggests an action, which is far more useful than the raw stack trace.'},

/* ---------- 76–90: Security depth ---------- */
{q:'How do you configure an OAuth2/OIDC login client in Spring Boot?',
 o:['spring.security.oauth2.client.registration.* and provider.* properties, plus http.oauth2Login() in the security chain','Only @EnableOAuth2Client','A custom filter','@OAuth2Client'],a:0,
 e:'Registration covers client id and secret, while provider covers the issuer or the explicit endpoints. Spring Boot builds the ClientRegistrationRepository from the properties automatically.'},

{q:'What is PKCE and why is it recommended for public clients?',
 o:['A caching strategy','Proof Key for Code Exchange: the client sends a hashed verifier with the code to prove it started the flow, mitigating code interception','A JWT encryption scheme','A password policy'],a:1,
 e:'Spring Security enables PKCE automatically for public clients, including those using the authorization_code grant without a secret. It is mandatory for mobile and single-page applications under the current OAuth 2.1 guidance.'},

{q:'Which annotation enforces method-level authorisation using a SpEL expression?',
 o:['@Secured','@PreAuthorize','@RolesAllowed','@Authorization'],a:1,
 e:'@PreAuthorize("hasRole(\'ADMIN\')") is evaluated before the method runs. Enable it with @EnableMethodSecurity, which is the modern replacement for the old @EnableGlobalMethodSecurity.'},

{q:'What is the difference between @Secured and @PreAuthorize?',
 o:['They are identical','@Secured accepts a simple list of role names; @PreAuthorize accepts a full SpEL expression referencing method parameters, beans and security context','@Secured is newer','@PreAuthorize only works on classes'],a:1,
 e:'@PreAuthorize can express rules such as hasPermission(#id, \'read\') using a PermissionEvaluator, which is exactly the sort of domain authorisation @Secured cannot express.'},

{q:'Which HTTP response header does Spring Security add by default to prevent clickjacking?',
 o:['Content-Security-Policy only','X-Content-Type-Options','X-Frame-Options: DENY','Strict-Transport-Security only'],a:2,
 e:'The default headers also include X-Content-Type-Options: nosniff and a basic Content-Security-Policy that disables script injection from other origins. All are configurable through http.headers().'},

{q:'What does Content-Security-Policy: script-src \'self\' achieve?',
 o:['Blocks all cookies','Allows scripts only from the same origin, mitigating XSS by blocking inline and third-party scripts','Encrypts the page','Blocks images'],a:1,
 e:'CSP is a strong defence in depth against XSS. Spring Security applies a restrictive default policy that you must relax for frameworks that require inline scripts or eval.'},

{q:'Which header enables Strict-Transport-Security, and what does it do?',
 o:['X-Frame-Options; blocks framing','Content-Security-Policy; blocks XSS','Strict-Transport-Security: max-age=..., which tells browsers to use HTTPS for all future requests to the domain','Set-Cookie; stores state'],a:2,
 e:'HSTS should only be enabled on sites that are fully HTTPS ready, because browsers will refuse HTTP for the max-age period even during development.'},

{q:'What does http.rememberMe() do?',
 o:['Stores the password','Issues a persistent cookie that lets the user remain logged in across browser sessions, with a configurable token validity','Enables CSRF','Disables logout'],a:1,
 e:'Remember-me tokens should be signed with a stable key and, ideally, stored server-side so they can be revoked. The default hash-based scheme cannot revoke a token once issued.'},

{q:'Which setting mitigates session fixation attacks?',
 o:['Disabling cookies','sessionManagement(s -> s.sessionFixation().migrateSession()) or changeSessionId, which issues a new session id on authentication','Increasing session timeout','Using stateless sessions'],a:1,
 e:'Spring Security enables session fixation protection by default. Disabling it is only reasonable for stateless APIs where session cookies are not used for authentication.'},

{q:'How do you declare two security rules — one for the API under /api and one for everything else — each with its own filter chain?',
 o:['Both rules go in the same chain','Declare two SecurityFilterChain beans with @Order, one matching the API path and one catching the rest','Use one chain with if/else','Not possible'],a:1,
 e:'Chain ordering is critical: the first bean with the lowest @Order whose matcher matches handles the request. A common pattern is stateless token auth for /api and form login for the rest.'},

{q:'Which PasswordEncoder should you use for new applications?',
 o:['NoOpPasswordEncoder','BCryptPasswordEncoder or Argon2PasswordEncoder, with a cost factor tuned to your hardware','MD5PasswordEncoder','Plaintext comparison'],a:1,
 e:'Spring Security 5+ defaults PasswordEncoderFactories.createDelegatingPasswordEncoder() to bcrypt with the {bcrypt} prefix so you can upgrade schemes without breaking stored hashes.'},

{q:'What does a UserDetailsService do?',
 o:['Encodes passwords','Loads user-specific data (username, password hash, authorities) used during authentication','Issues JWTs','Manages HTTP sessions'],a:1,
 e:'It is the extension point for loading users from your database or directory. Password validation and authentication decisions are handled by the AuthenticationProvider, not by the UserDetailsService itself.'},

{q:'How do you validate a JWT with a custom claim-to-authority mapping in a resource server?',
 o:['Parse the JWT in every controller','Provide an OAuth2TokenValidator<Jwt> and a JwtAuthenticationConverter bean to map claims to authorities','Disable JWT validation','Use a custom filter'],a:1,
 e:'The validator checks claims such as audience or a custom scope; the converter turns claims into GrantedAuthorities. Both are standard extension points on the auto-configured resource server.'},

{q:'What replaced WebSecurityConfigurerAdapter-style authorizeRequests() in Spring Security 6?',
 o:['Nothing','authorizeHttpRequests(auth -> auth.requestMatchers(...).permitAll().anyRequest().authenticated()), the lambda DSL with requestMatchers','@Authorize','xml configuration only'],a:1,
 e:'authorizeRequests() is deprecated in favour of authorizeHttpRequests(), and antMatchers is replaced by requestMatchers(). The lambda DSL is the only supported style in Spring Security 6.'},

{q:'Why does CORS need to be configured inside Spring Security when it is present?',
 o:['Security ignores CORS','Preflight OPTIONS requests must be permitted and the CORS filter must run before the security filter chain, which is what http.cors() ensures','CORS is only relevant for security','Without it, cookies leak'],a:1,
 e:'Without http.cors(), preflight requests are rejected by authentication before they reach the MVC layer, and the browser sees a CORS error even though the CORS configuration exists.'},

/* ---------- 91–100: Integrations & misc ---------- */
{q:'Which starter provides auto-configuration for Spring for GraphQL?',
 o:['spring-boot-starter-graphql','spring-boot-starter-gql','spring-boot-starter-api','spring-boot-starter-web only'],a:0,
 e:'It configures a GraphQlSource, the GraphQL HTTP endpoint and (optionally) the GraphiQL browser. @QueryMapping, @MutationMapping and @SchemaMapping handle resolution.'},

{q:'Which starter adds Spring HATEOAS support?',
 o:['spring-boot-starter-hypermedia','spring-boot-starter-hateoas','spring-boot-starter-hal','spring-boot-starter-rest'],a:1,
 e:'It configures the HAL/CollectionJSON message converters and provides EntityModel, CollectionModel and link builders. It is used with @RestController to expose discoverable APIs.'},

{q:'What does Spring Data REST do?',
 o:['Provides a REST client for Spring Data repositories','Exposes Spring Data repositories as REST resources automatically, with paging, sorting, filtering and HAL links','Replaces Spring MVC','Implements GraphQL'],a:1,
 e:'A single @RepositoryRestResource annotation exposes an entity. It is powerful for CRUD-heavy domains and risky for domains where the REST contract should be hand-crafted.'},

{q:'What is Spring Modulith?',
 o:['A Kubernetes operator','A toolkit for building well-structured modular monoliths with enforced package boundaries, event publication and module tests','A microservices framework','A database migration tool'],a:1,
 e:'It uses ArchUnit-style verification to keep modules decoupled, and its event publication registry provides reliable asynchronous communication between modules with at-least-once delivery.'},

{q:'What is Spring Integration?',
 o:['A batch framework','An enterprise integration framework implementing the EIP patterns (channels, routers, transformers, adapters) inside the Spring programming model','A reactive stack','A caching library'],a:1,
 e:'It is often used for file polling, SFTP, JMS, email and message-driven flows. It composes well with Spring Boot through the spring-boot-starter-integration starter.'},

{q:'Which Kotlin feature makes Spring Boot\'s declarative HTTP clients more idiomatic?',
 o:['Coroutines suspend functions combined with the Kotlin extensions on WebClient and RestClient, giving awaitBody() and similar helpers','Kotlin has no HTTP support','Only Java-style callbacks','DSL for JSON'],a:0,
 e:'Coroutine extensions on both clients remove the callback and blocking style. Combined with suspend controller methods, a fully non-blocking stack reads like synchronous code.'},

{q:'What is JBang primarily used for?',
 o:['A build tool for Maven','Running single-file Java programs with automatic dependency resolution, including a spring-boot extension for quick demos and scripts','A JVM profiling tool','A container runtime'],a:1,
 e:'The spring extension lets you write a Spring Boot application in one file and run it directly with jbang. It is excellent for reproducible bug reports and small internal tools.'},

{q:'How does a Spring Boot application communicate a specific exit code to the shell when startup fails?',
 o:['It always exits 0','Implement ExitCodeGenerator, or throw an exception, and Spring Boot exits with the returned code','Call System.exit in main','It is not possible'],a:1,
 e:'ExitCodeExceptionMapper lets you map exception types to codes, and ExitCodeGenerator lets a runner choose one. Kubernetes and CI pipelines use these codes to distinguish restart-worthy failures from fatal ones.'},

{q:'Which lifecycle phases does graceful shutdown follow in Spring Boot?',
 o:['Immediate stop of the web server only','Stop accepting new requests, drain in-flight requests within the timeout, then destroy the context and run @PreDestroy callbacks','Destroy the context first, then stop the server','Only JVM shutdown hooks'],a:1,
 e:'The web server graceful shutdown phase is a Lifecycle bean ordered before context closing. With server.shutdown=graceful and a sensible timeout, in-flight requests finish while background tasks are still allowed to complete.'},

{q:'What does spring.threads.virtual.enabled=true actually change?',
 o:['It replaces every thread with a virtual thread, including GC and JIT threads','It switches the auto-configured applicationTaskExecutor and Tomcat request handling to virtual threads, leaving platform threads for infrastructure','It disables threads','It sets the JVM flag at compile time'],a:1,
 e:'The JVM flag itself is -Djdk.virtualThreadScheduler.parallelism, but the Spring Boot property wires the application-facing executors. It is the standard switch for the Java 21 virtual-thread mode.'},

{q:'Which property preserves the ANSI colour codes in the banner.txt instead of stripping them?',
 o:['spring.output.ansi.enabled=always','banner.ansi=true','spring.banner.color=true','It cannot be preserved'],a:0,
 e:'The setting also controls console log colours. Setting it to never is the correct choice for CI logs, where escape sequences only add noise.'},

{q:'Which two files can be used to register non-auto-configuration Spring Boot SPI extensions such as EnvironmentPostProcessor or FailureAnalyzer in Spring Boot 3?',
 o:['META-INF/spring.factories (still supported for these SPIs) and the newer META-INF/spring/*.imports for auto-configuration only','Only application.properties','Only a Java annotation','Only spring.xml'],a:0,
 e:'Spring Boot 3 removed spring.factories for auto-configuration classes but kept it for the other extension points. This split trips up many migrations.'},

{q:'What is the purpose of the spring-configuration-metadata.json schema?',
 o:['Validating properties at runtime','Describing configuration keys, their type, default value, deprecation status and allowed values to IDEs and tooling','Encrypting properties','Publishing on Docker Hub'],a:1,
 e:'The metadata is generated by the spring-boot-configuration-processor and consumed by IDEs and by the properties migrator. It does not perform runtime validation; that is what @Validated and JSR-303 do.'},

{q:'How do you make a build fail early if an unexpected configuration key is used?',
 o:['You cannot','Enable the spring-boot-properties-migrator temporarily, and use @ConfigurationProperties with @Validated for typed checks; Spring Boot itself ignores unknown keys','Only @Value detects typos','Enable spring.fail-on-unknown=true'],a:1,
 e:'Spring Boot deliberately ignores unknown properties, because the same file is often shared across environments with different starters. Typed @ConfigurationProperties classes plus review are the practical safeguard.'},

{q:'What does spring.config.on-not-found=ignore do?',
 o:['Ignores missing config imports that are not marked optional','Ignores missing beans','Ignores validation errors','Ignores YAML syntax errors'],a:0,
 e:'It is a global switch for the config data loader. The recommended alternative is to mark each import optional individually, since that documents intent at the source.'},

{q:'Which Gradle plugin provides the AOT processing tasks used to build a native image?',
 o:['spring-boot plugin only','org.graalvm.buildtools.native (Native Build Tools), combined with the spring-boot plugin','The shadow plugin','A custom task'],a:1,
 e:'Native Build Tools adds processAot, nativeCompile and nativeTest. The spring-boot plugin provides processAot as well, but the GraalVM toolchain supplies the native compilation step.'},

{q:'Which of these is the correct way to make a test class load a different configuration than the main application?',
 o:['Delete the main class','Add @SpringBootTest(classes = TestApp.class) with a nested or separate @SpringBootApplication class, or use @ContextConfiguration','Use @Profile("test") alone','Disable auto-configuration'],a:1,
 e:'With @SpringBootTest(classes = ...), Spring Boot will not search for the main class and will use the declared configuration classes. @ContextConfiguration works for non-@SpringBootTest tests.'},

{q:'Which property allows the application to continue starting when the Kafka broker is unreachable, useful during development?',
 o:['spring.kafka.admin.fail-fast=false and a non-blocking producer','spring.kafka.optional=true','spring.kafka.brokers=none','Kafka always fails startup'],a:0,
 e:'KafkaAdmin.failFast defaults to false in most versions, but explicitly setting it makes the intent clear. Consumers may still log connection errors on their own schedule, so watch the listener container behaviour too.'},

{q:'What is the startup order of the following events?',
 o:['ApplicationReadyEvent, ApplicationStartedEvent, ApplicationPreparedEvent','ApplicationPreparedEvent, ApplicationStartedEvent, ApplicationReadyEvent','ApplicationStartedEvent, ApplicationPreparedEvent, ApplicationReadyEvent','They are published in arbitrary order'],a:1,
 e:'The full order is ApplicationStartingEvent → ApplicationEnvironmentPreparedEvent → ApplicationContextInitializedEvent → ApplicationPreparedEvent → ContextRefreshedEvent → ApplicationStartedEvent → runners → ApplicationReadyEvent.'}

<script>
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function updateTimer(){const t=$('timer');t.textContent=fmt(remaining);t.classList.toggle('low',remaining<=300);}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{remaining--;if(remaining<=0){remaining=0;updateTimer();clearInterval(timerId);submitExam(true);return;}updateTimer();},1000);}

function buildPalette(){const g=$('pgrid');g.innerHTML='';for(let i=0;i<QS.length;i++){const b=document.createElement('button');b.className='pbtn';b.textContent=i+1;b.dataset.i=i;b.addEventListener('click',()=>goTo(i));g.appendChild(b);}}
function refreshPalette(){document.querySelectorAll('.pbtn').forEach(b=>{const i=+b.dataset.i;b.className='pbtn';if(state.visited[i])b.classList.add('seen');if(state.marked[i])b.classList.add('marked');if(state.ans[i]!==null)b.classList.add('answered');if(i===state.cur)b.classList.add('current');});}
function refreshProgress(){const done=state.ans.filter(a=>a!==null).length;$('pbar').style.width=(done/QS.length*100)+'%';}

function renderQuestion(){
  const i=state.cur,q=QS[i];state.visited[i]=true;
  $('qnum').textContent='Question '+(i+1)+' of '+QS.length;
  $('qtext').textContent=q.q;
  $('markTag').hidden=!state.marked[i];
  const wrap=$('options');wrap.innerHTML='';
  q.o.forEach((opt,idx)=>{
    const btn=document.createElement('button');btn.className='option';btn.type='button';
    const key=document.createElement('span');key.className='key';key.textContent=LETTERS[idx];
    const txt=document.createElement('span');txt.className='otext';txt.textContent=opt;
    btn.appendChild(key);btn.appendChild(txt);
    if(state.ans[i]===idx)btn.classList.add('selected');
    if(state.revealed[i]){btn.classList.add('locked');if(idx===q.a)btn.classList.add('correct');else if(state.ans[i]===idx)btn.classList.add('wrong');}
    else{btn.addEventListener('click',()=>selectOption(idx));}
    wrap.appendChild(btn);
  });
  const box=$('explainBox');
  if(state.revealed[i]){box.hidden=false;$('explainTitle').textContent='✅ Correct answer: '+LETTERS[q.a]+' — '+q.o[q.a];$('explainText').textContent=q.e;$('btnShow').textContent='🙈 Hide Answer';}
  else{box.hidden=true;$('btnShow').textContent='👁 Show Answer';}
  $('btnPrev').disabled=(i===0);$('btnNext').disabled=(i===QS.length-1);
  $('btnMark').textContent=state.marked[i]?'★ Unmark':'★ Mark for Review';
  refreshPalette();refreshProgress();window.scrollTo({top:0,behavior:'smooth'});
}

function selectOption(idx){if(state.submitted)return;const i=state.cur;if(state.revealed[i])return;state.ans[i]=(state.ans[i]===idx)?null:idx;renderQuestion();}
function goTo(i){if(i<0||i>=QS.length)return;state.cur=i;renderQuestion();}
function toggleMark(){if(state.submitted)return;state.marked[state.cur]=!state.marked[state.cur];renderQuestion();}
function toggleReveal(){if(state.submitted)return;state.revealed[state.cur]=!state.revealed[state.cur];renderQuestion();}

function submitExam(auto){
  if(state.submitted)return;
  if(!auto){
    const unanswered=state.ans.filter(a=>a===null).length;
    const msg='Submit the test now?\n\nAnswered: '+(QS.length-unanswered)+'\nUnanswered: '+unanswered+'\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg))return;
  }
  state.submitted=true;clearInterval(timerId);
  $('quizView').hidden=true;$('resultView').hidden=false;
  renderResults(auto);window.scrollTo({top:0,behavior:'smooth'});
}

function renderResults(auto){
  let correct=0,wrong=0,skipped=0;
  QS.forEach((q,i)=>{if(state.ans[i]===null)skipped++;else if(state.ans[i]===q.a)correct++;else wrong++;});
  const pct=Math.round(correct/QS.length*100);const used=TOTAL_SECONDS-remaining;
  let grade,gradeColor;
  if(pct>=90){grade='Outstanding 🏆';gradeColor='#16a34a';}
  else if(pct>=75){grade='Strong 👍';gradeColor='#0d9488';}
  else if(pct>=60){grade='Pass ✅';gradeColor='#f59e0b';}
  else if(pct>=40){grade='Needs review 📖';gradeColor='#ea580c';}
  else{grade='Keep practising 🔁';gradeColor='#dc2626';}
  let html='';
  if(auto)html+='<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';
  html+='<div class="scorecard"><h2>Spring Boot Mock Test — Set 4 Complete</h2><div class="bignum">'+pct+'%</div><div style="color:'+gradeColor+';font-weight:700;font-size:1.05rem">'+grade+'</div><div class="stats"><div class="st-ok"><b>'+correct+'</b>Correct</div><div class="st-bad"><b>'+wrong+'</b>Incorrect</div><div class="st-skip"><b>'+skipped+'</b>Unanswered</div><div><b>'+fmt(used)+'</b>Time used</div></div><div style="margin-top:20px"><button class="btn primary" id="btnRetake">🔄 Retake Test</button> <button class="btn ghost" id="btnBackTop">↑ Back to top</button></div></div>';
  html+='<div class="filters"><button class="fbtn active" data-f="all">All ('+QS.length+')</button><button class="fbtn" data-f="wrong">Incorrect ('+wrong+')</button><button class="fbtn" data-f="skipped">Unanswered ('+skipped+')</button><button class="fbtn" data-f="correct">Correct ('+correct+')</button></div>';
  QS.forEach((q,i)=>{
    let status,cls;
    if(state.ans[i]===null){status='skipped';cls='skip';}
    else if(state.ans[i]===q.a){status='correct';cls='ok';}
    else{status='wrong';cls='bad';}
    html+='<div class="revitem '+cls+'" data-status="'+status+'"><p class="revq">Q'+(i+1)+'. '+q.q+'</p>';
    if(state.ans[i]===null){
      html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html+='<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">'+LETTERS[q.a]+') '+q.o[q.a]+'</span></div>';
    }else if(state.ans[i]===q.a){
      html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">'+LETTERS[state.ans[i]]+') '+q.o[state.ans[i]]+' ✓</span></div>';
    }else{
      html+='<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">'+LETTERS[state.ans[i]]+') '+q.o[state.ans[i]]+' ✗</span></div>';
      html+='<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">'+LETTERS[q.a]+') '+q.o[q.a]+'</span></div>';
    }
    html+='<div class="revexp"><b>Explanation:</b> '+q.e+'</div></div>';
  });
  $('resultView').innerHTML=html;
  $('btnRetake').addEventListener('click',retake);
  $('btnBackTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f=b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{it.style.display=(f==='all'||it.dataset.status===f)?'':'none';});
    });
  });
}

function retake(){
  state.ans.fill(null);state.revealed.fill(false);state.marked.fill(false);state.visited.fill(false);
  state.cur=0;state.submitted=false;
  remaining=TOTAL_SECONDS;updateTimer();startTimer();
  $('resultView').hidden=true;$('quizView').hidden=false;renderQuestion();
}

$('btnPrev').addEventListener('click',()=>goTo(state.cur-1));
$('btnNext').addEventListener('click',()=>goTo(state.cur+1));
$('btnMark').addEventListener('click',toggleMark);
$('btnShow').addEventListener('click',toggleReveal);
$('btnSubmit').addEventListener('click',()=>submitExam(false));

$('togglePalette').addEventListener('click',()=>{
  const g=$('pgrid'),l=$('legend');const hidden=g.style.display==='none';
  g.style.display=hidden?'':'none';l.style.display=hidden?'':'none';
  $('togglePalette').textContent=hidden?'Hide':'Show';
});

document.addEventListener('keydown',(e)=>{
  if(state.submitted)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const k=e.key;
  if(k==='ArrowRight'){e.preventDefault();goTo(state.cur+1);}
  else if(k==='ArrowLeft'){e.preventDefault();goTo(state.cur-1);}
  else if(['1','2','3','4'].includes(k)){e.preventDefault();selectOption(+k-1);}
  else if(k.toLowerCase()==='r'){e.preventDefault();toggleMark();}
  else if(k.toLowerCase()==='s'){e.preventDefault();toggleReveal();}
});

$('qcountPill').textContent=QS.length+' Questions';
buildPalette();updateTimer();startTimer();renderQuestion();
</script>
</body>
</html>
