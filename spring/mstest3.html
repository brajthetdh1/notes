<style>
  :root{--brand:#7c3aed;--brand-dark:#4c1d95;--accent:#a855f7;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}

  @media (max-width:900px){aside.palette{position:static}}

<body>

<header class="topbar">
  <div class="brand">🧩 Microservices Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>

          <div class="explain-title" id="explainTitle"></div>

        </div>

      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>

      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Distributed systems theory */
{q:'What does the CAP theorem actually state?',
 o:['You can have all three of consistency, availability and partition tolerance','In the presence of a network partition, a system must choose between consistency and availability','Any two are always achievable','Partition tolerance is optional'],a:1,
 e:'Partitions are unavoidable in a distributed system, so P is not a choice. During a partition, a system either refuses some requests to stay consistent (CP) or serves possibly stale responses to stay available (AP).'},

{q:'What does PACELC add to CAP?',
 o:['A fourth property called durability','Even without partitions (E), a system must trade latency (L) against consistency (C)','It replaces CAP','It applies only to databases'],a:1,
 e:'PACELC extends CAP: if there is a Partition, choose A or C; Else (no partition), choose Latency or Consistency. This reflects that distributed coordination has a cost even in normal operation.'},

{q:'What is the difference between strong and eventual consistency?',
 o:['They are identical','Strong consistency means every read sees the latest committed write; eventual consistency means reads converge to the latest value once updates stop','Strong consistency is always faster','Eventual consistency is guaranteed immediately'],a:1,
 e:'Strong consistency typically requires coordination (consensus or primary reads) and adds latency. Eventual consistency allows replicas to serve stale reads temporarily, trading freshness for availability and latency.'},

{q:'Why is the FLP impossibility result important for microservices?',
 o:['It prohibits microservices','It proves that no deterministic algorithm can guarantee consensus in an asynchronous system with even one faulty process, so real systems use timeouts and partial synchrony assumptions','It only applies to single machines','It guarantees consensus'],a:1,
 e:'FLP shows why every consensus implementation (Raft, Paxos, Zab) relies on timeouts and a leader with lease semantics to make progress. It explains why a network partition can make progress temporarily impossible.'},

{q:'What is a logical clock (Lamport clock) used for?',
 o:['Synchronising wall-clock time across machines','Establishing a partial ordering of events without relying on physical clocks, so causality can be inferred','Measuring CPU usage','Compressing messages'],a:1,
 e:'A Lamport clock increments on each local event and on receiving a message, giving a total order consistent with causality. It cannot tell whether two events are concurrent; vector clocks can.'},

{q:'What are vector clocks used for?',
 o:['Synchronising clocks','Detecting causality and conflicts between events by keeping a vector of logical counters per node','Compressing messages','Rate limiting'],a:1,
 e:'Vector clocks can determine whether one event happened before another or whether they are concurrent. Dynamo-style systems use them to detect write conflicts that the application must resolve.'},

{q:'What problem does clock skew create for distributed systems?',
 o:['It slows down the network','Timestamps can go backwards or disagree between nodes, which breaks last-write-wins, ordering and TTL-based logic','It prevents TLS','It increases cost'],a:1,
 e:'Physical clocks drift. Last-write-wins silently drops updates when clocks are skewed. Hybrid logical clocks and TrueTime-style bounded-uncertainty clocks exist specifically to handle this.'},

{q:'What does the Raft consensus algorithm guarantee?',
 o:['High throughput without a leader','A single leader per term, replicated logs with linearisable ordering, and safety under leader failure via majority quorum','Weaker consistency than Paxos','No leader election'],a:1,
 e:'Raft is designed for understandability. A leader accepts entries, replicates to a majority, then commits. Leader election and log matching rules guarantee safety across restarts and network partitions.'},

{q:'Why do consensus systems use an odd number of nodes?',
 o:['Odd numbers are faster','To form a majority quorum that tolerates (n-1)/2 failures without ties, for example 3 nodes tolerate 1 failure','Because even numbers cause errors','To reduce cost only'],a:1,
 e:'Raft, Paxos and Zab all require a majority. With 3 nodes you tolerate 1 failure; with 4 you still tolerate 1, so the extra node adds cost without improving fault tolerance.'},

{q:'What does linearisability mean?',
 o:['Operations can be reordered','Every operation appears to take effect atomically at a single point in time, consistent with real-time order, as if there were one copy of the data','Reads may return stale data','Only writes are ordered'],a:1,
 e:'Linearisability is the strongest single-object consistency model. It is what a client experiences when interacting with a single-node database, and it requires coordination to maintain across replicas.'},

/* 11–22: Event sourcing and CQRS deep dive */
{q:'In event sourcing, what must be replayed to rebuild an aggregate?',
 o:['Only the latest snapshot','All events for that aggregate, or the last snapshot plus subsequent events','Only the events of the last 24 hours','Nothing — state is stored directly'],a:1,
 e:'Rebuilding from the event stream is the canonical mechanism. Snapshotting every N events bounds the replay cost for long-lived aggregates without changing the model.'},

{q:'What is an event-sourcing snapshot used for?',
 o:['Backup and restore only','To avoid replaying an ever-growing event stream, by persisting aggregate state at a point in time and replaying only events after that point','To compress the log','To encrypt events'],a:1,
 e:'Snapshots are an optimisation, not the source of truth. The event log remains authoritative; a corrupted snapshot can be discarded and rebuilt by replaying the log.'},

{q:'What is a projection in event sourcing?',
 o:['A database backup','A read model built by consuming events, optimised for a specific query','A user interface','A schema version'],a:1,
 e:'Projections decouple the write model from query needs. Multiple projections can be built from the same event stream, each serving a different read pattern, and they can be rebuilt from history.'},

{q:'How does event sourcing typically handle schema evolution of events?',
 o:['By rewriting the event log in place','By versioning events and supporting upcasters or tolerant readers that translate old versions when replaying','By deleting old events','By using XML only'],a:1,
 e:'The log is append-only, so old events cannot be rewritten. Upcasters translate old versions to current shape during read, and consumers must tolerate unknown fields.'},

{q:'What is the difference between event sourcing and event-driven architecture?',
 o:['They are the same','Event sourcing persists state as a sequence of events; event-driven architecture is about communication between components via events, and does not require event sourcing','Event sourcing requires Kafka','Event-driven architecture requires CQRS'],a:1,
 e:'You can use events for communication without storing them as the source of truth, and you can use event sourcing without any inter-service messaging. They are often combined but are independent choices.'},

{q:'Why is CQRS often paired with event sourcing?',
 o:['CQRS requires event sourcing','Because the write side can persist events, and read models can be built asynchronously from those events, matching each side to its workload','Event sourcing requires CQRS','Because both use Kafka'],a:1,
 e:'CQRS does not require event sourcing, and event sourcing can be used with a single model. The combination is popular because events are a natural mechanism to feed multiple read projections.'},

{q:'What is a "read-your-own-writes" problem in CQRS?',
 o:['Writes are lost','A user writes to the write model, then immediately queries a lagging read model and does not see their own change','Reads are slower','The write model rejects reads'],a:1,
 e:'Common fixes include returning the written version to the client, reading from the write model for a short window after a write, or a version token that makes the read model wait until it has caught up.'},

{q:'What is an "upcaster" in event sourcing?',
 o:['A tool that scales read models','A function that transforms an older event version into the current version at read time','A message broker','A database migration script'],a:1,
 e:'Upcasters keep the log immutable while the code evolves. Each schema version has a translation to the next, and replay composes them. They must be fast because they run during every replay.'},

{q:'Why might an event-sourced system store a "correlation id" on every event?',
 o:['To compress events','To group events belonging to the same business operation or user request, enabling tracing and debugging across an aggregate\'s history','To encrypt events','To shard the log'],a:1,
 e:'Correlation ids support debugging and audit. Causation ids complement them, recording which command or event directly caused this event, which is essential for explaining unexpected state.'},

{q:'What is a "process manager" in event-driven systems?',
 o:['An operating system process','A component that listens for events and issues commands to drive a multi-step business process, closely related to a saga orchestrator','A load balancer','A schema registry'],a:1,
 e:'Process managers maintain state across events and decide what to do next. They are the explicit, testable alternative to implicit choreography when a workflow grows complex.'},

{q:'What does "temporal decoupling" require from an event store or broker?',
 o:['Synchronous delivery','Retention of events for a meaningful window, so consumers can be added later or catch up after downtime','No persistence','A single consumer'],a:1,
 e:'Retention is what allows replay and catch-up. Without it, a consumer that was down loses messages permanently. Retention policy is therefore part of the system\'s contract with its consumers.'},

{q:'What is the difference between an event and a command in event sourcing?',
 o:['They are interchangeable','An event is a fact about something that happened and is stored immutably; a command is a request that may be rejected and is not part of the log','Commands are always stored','Events are always rejected'],a:1,
 e:'Commands express intent and can fail. When accepted, the aggregate produces events, which are the immutable facts. Mixing commands into the event log corrupts its meaning.'},

/* 23–34: Messaging internals */
{q:'What is the outbox relay typically responsible for?',
 o:['Serving read queries','Reading uncommitted outbox rows and publishing them to the broker in order, marking them as published','Running the saga coordinator','Managing consumer offsets'],a:1,
 e:'The relay runs as a separate process or thread, often inside the same service. It must be crash-safe and idempotent with the broker, so a row is only marked published after the broker acknowledges.'},

{q:'Which technique avoids a polling outbox relay?',
 o:['Change data capture on the outbox table, publishing from the database transaction log','Increasing poll frequency','Switching to a message broker','Using a stronger database'],a:0,
 e:'CDC tools such as Debezium read the transaction log of the outbox table and emit changes in commit order. This is lower latency than polling and avoids adding load to the database.'},

{q:'What does "transactional messaging" mean in the context of a broker?',
 o:['Sending messages inside a database transaction','Producing and consuming messages with broker-managed atomicity, so either all sends and offset commits happen or none do','Encrypting messages','Batching messages'],a:1,
 e:'Kafka transactions are the canonical example. They guarantee atomicity inside Kafka, but they do not extend to external systems such as a relational database or a payment provider.'},

{q:'What is the difference between at-least-once and exactly-once semantics?',
 o:['They are the same','At-least-once may deliver duplicates; exactly-once means each event is processed once effectively, achieved in practice via at-least-once plus deduplication or transactional processing','Exactly-once is always faster','At-least-once drops messages'],a:1,
 e:'True exactly-once across arbitrary systems is not achievable end to end. It is emulated inside Kafka with transactions, and across systems with idempotent consumers and deduplication keys.'},

{q:'What is a "deduplication window"?',
 o:['A time window during which the system keeps enough state to recognise and drop repeated messages','A retry policy','A rate limiter','A broker config'],a:0,
 e:'Consumers must bound the memory used for dedup. Store recent message ids keyed by business id in a TTL store such as Redis, and choose the window based on the maximum plausible retry interval.'},

{q:'What does "consumer rebalancing" cause in a Kafka consumer group?',
 o:['Partition assignment changes, a brief pause in consumption, and potential duplicate processing if offsets were not committed','Permanent message loss','Broker restart','Schema changes'],a:0,
 e:'Rebalances are unavoidable when consumers join or leave. Reducing rebalance time (cooperative sticky assignor, tuned session timeout) and committing offsets promptly limits the impact.'},

{q:'What is a "compacted" topic useful for when restoring state?',
 o:['Reducing disk usage only','Replaying the compacted stream to rebuild a key-value state store, because only the latest record per key is retained','Encrypting messages','Ordering messages'],a:1,
 e:'Kafka Streams state stores are backed by compacted changelog topics. Restoring reads the compacted log, applying each key\'s latest value, which is much faster than replaying every event.'},

{q:'What problem does a "schema compatibility" rule prevent?',
 o:['Slow consumers','A producer deploying a schema change that breaks existing consumers, causing deserialization failures','Rebalances','Broker upgrades'],a:1,
 e:'Backward compatibility lets new consumers read old data; forward compatibility lets old consumers read new data; full combines both. The registry enforces the chosen rule at schema registration time.'},

{q:'Why is message ordering often lost when a service retries a failed message in-line?',
 o:['Brokers do not preserve order','A retry can be delivered after later messages were already processed, so the effective processing order differs from the production order','Ordering is not defined','Retries always succeed'],a:1,
 e:'Retries must be processed in order or serialised per key. Common approaches include partitioning by key with a single consumer per partition, or an ordered retry queue per entity.'},

{q:'What is the difference between a queue and a log in messaging?',
 o:['They are the same','A queue removes a message once consumed by one consumer; a log retains messages by policy and allows multiple independent readers at their own offsets','Logs lose data on read','Queues cannot be durable'],a:1,
 e:'Kafka, Pulsar and Kinesis are logs. RabbitMQ and SQS are primarily queues. The log model enables replay and fan-out but requires retention and partition management.'},

{q:'What is "fan-out on write" vs "fan-out on read"?',
 o:['They are identical','Fan-out on write pushes the message to every consumer\'s queue at publish time; fan-out on read lets each consumer read the shared log at its own pace','Fan-out on write is slower','Fan-out on read loses messages'],a:1,
 e:'A shared log is fan-out on read and keeps the producer simple. A queue per consumer is fan-out on write, which isolates consumers but multiplies storage and publish cost.'},

{q:'What does "poison pill" mean in a queue-based system?',
 o:['An empty message','A message that causes the consumer to crash repeatedly, which can block a queue or partition until handled','A message with an invalid key','An oversized message'],a:1,
 e:'The standard answer is bounded retries plus a dead-letter queue. Without a DLQ, the poison message can stall processing indefinitely, sometimes taking down the consumer each time it is redelivered.'},

{q:'Why is exactly-once harder with an external side effect such as sending an email?',
 o:['Email servers are slow','The side effect cannot be rolled back, so retries may send the email twice; the fix is idempotency keys and provider-level deduplication','Email is not a side effect','The broker cannot track it'],a:1,
 e:'External side effects are not transactional with the database or the broker. Design the effect to be idempotent, for example by passing a unique message id that the provider deduplicates.'},

{q:'What is a "saga timeout" and how should it be handled?',
 o:['A network timeout','A deadline after which the coordinator decides the saga cannot complete and triggers compensation','A broker setting','A retry policy'],a:1,
 e:'Without a timeout, a saga can hang forever. On expiry the coordinator typically compensates completed steps and records the failure, so the system returns to a consistent state.'},

/* 35–46: Synchronous communication in depth */
{q:'What is the difference between a timeout and a deadline?',
 o:['They are the same','A timeout is a per-call maximum; a deadline is an absolute time that propagates through the call chain, so downstream calls cannot exceed the caller\'s remaining budget','Deadlines do not propagate','Timeouts are for servers only'],a:1,
 e:'gRPC deadlines and HTTP timeout budgets are propagated so a slow downstream cannot outlive the top-level request. This bounds overall latency and prevents wasted work after the client gave up.'},

{q:'What does the "retry budget" pattern limit?',
 o:['The number of retries per request only','The total retries as a fraction of successful requests, so retries cannot amplify load beyond a configured share','The retry delay','The response size'],a:1,
 e:'Per-request retry limits still allow a storm when many requests fail at once. A retry budget caps retries system-wide, for example "retries may not exceed 10% of requests".'},

{q:'Why is a synchronous call chain of ten services risky?',
 o:['It is more expensive','Each hop adds latency and a failure probability; with 99.9% availability per hop, the chain\'s availability drops substantially','It cannot be traced','It cannot use TLS'],a:1,
 e:'Availability multiplies along the chain: ten hops at 99.9% give about 99% overall. Deep synchronous chains are the main reason architectures move to asynchronous integration or reduce depth.'},

{q:'What is the purpose of a circuit breaker\'s failure threshold?',
 o:['To count total requests','To decide when the breaker opens, based on a minimum number of calls and a failure percentage or count','To measure latency','To retry failed calls'],a:1,
 e:'A minimum call count avoids opening on a single failure, and the failure percentage distinguishes a systemic problem from occasional errors. Both thresholds are needed for sensible behaviour.'},

{q:'Why should retries only apply to idempotent or explicitly safe operations?',
 o:['Retries are always safe','A retry of a non-idempotent operation can duplicate side effects, such as charging a card twice or creating two orders','Retries violate the HTTP spec','Retries increase latency'],a:1,
 e:'Use naturally idempotent verbs, or carry an idempotency key that the server uses to deduplicate. Without one of these, retries must be avoided for writes.'},

{q:'What is a common symptom of an unbounded HTTP client connection pool?',
 o:['Excessive memory and file descriptors, and timeouts under load because the client opens more sockets than the network or server can handle','Faster response times','Reduced disk usage','Better security'],a:0,
 e:'Bounded pools with a queue and a rejection policy convert overload into fast, observable failures rather than resource exhaustion. Pool size should be tuned to downstream capacity.'},

{q:'What is connection pooling primarily for?',
 o:['Encrypting connections','Reusing established TCP/TLS connections to avoid handshake and setup cost per request, and bounding concurrency','Load balancing','Caching responses'],a:1,
 e:'TLS handshakes are expensive. A bounded pool reuses connections and caps in-flight requests per host, which also acts as a natural backpressure and bulkhead mechanism.'},

{q:'What does HTTP/2 multiplexing change for service-to-service calls?',
 o:['It removes the need for TLS','Multiple concurrent requests share one TCP connection, reducing connection count and head-of-line blocking at the application level','It increases latency','It requires gRPC'],a:1,
 e:'Multiplexing reduces the need for large connection pools but introduces its own backpressure and flow-control considerations. Head-of-line blocking at the TCP layer still exists for lost packets.'},

{q:'What is the purpose of a health check on a load balancer?',
 o:['To measure throughput','To decide whether an instance should receive traffic, based on a lightweight signal','To log errors','To rotate certificates'],a:1,
 e:'Load balancers route only to healthy instances. A health check that runs deep dependency tests can cause an entire fleet to be removed at once if a shared dependency fails.'},

{q:'What problem does the "bulkhead" pattern address when combined with connection pools?',
 o:['Encryption','A slow dependency exhausting the shared pool so that other dependencies become unavailable','Cost','Latency'],a:1,
 e:'A separate pool per dependency ensures that a slow payment provider does not consume all connections and starve calls to a healthy catalogue service.'},

{q:'What is "request coalescing" (single-flight)?',
 o:['Combining multiple requests for the same key into one upstream call, sharing the result among callers','Encrypting requests','Batching unrelated requests','Retrying requests'],a:0,
 e:'Coalescing reduces duplicate work for hot keys, especially when a cache misses. The first caller triggers the fetch, and concurrent callers wait for the same result.'},

{q:'What is the effect of a long timeout on a downstream service under load?',
 o:['It reduces resource usage','It lets slow calls hold threads and connections longer, reducing capacity for other requests and potentially causing cascading failure','It improves throughput','It eliminates failures'],a:1,
 e:'Timeouts must be short enough to free resources and long enough to cover normal latency. Setting them from measured p99 rather than intuition is the standard practice.'},

{q:'What does "fail-fast" mean for a service on startup?',
 o:['Crash on the first error','Validate configuration and required dependencies at startup and refuse to start if something essential is missing, instead of failing later under traffic','Restart automatically','Skip health checks'],a:1,
 e:'A service that starts with a broken configuration fails at the first request, which is harder to diagnose. Validating at startup surfaces the problem immediately during deployment.'},

/* 47–58: Data consistency deep dive */
{q:'What is the "outbox relay" ordering guarantee usually chosen for?',
 o:['Global ordering across all aggregates','Ordering per aggregate, so events for one entity are published in the order they were written','Random ordering','No ordering'],a:1,
 e:'Per-aggregate ordering satisfies most business requirements and allows parallelism across aggregates. Global ordering would require a single relay and severely limit throughput.'},

{q:'Why does a saga sometimes need to be idempotent at the coordinator level?',
 o:['To speed it up','If the coordinator crashes and restarts, it may reissue the same step; idempotent steps make recovery safe','To reduce cost','To avoid transactions'],a:1,
 e:'The coordinator must be able to resume from durable state and retry. Step handlers and compensations should recognise a repeated invocation and return the stored result.'},

{q:'What is a "conflict resolution" strategy in an AP system?',
 o:['Refusing conflicting writes','A deterministic rule, such as last-write-wins, vector-clock comparison, or application-specific merge, that decides the final value when replicas diverge','Encrypting the data','Using a single leader'],a:1,
 e:'Last-write-wins is simple but can silently lose data under clock skew. Vector clocks and CRDTs preserve more information, at the cost of complexity and larger payloads.'},

{q:'What does a CRDT provide?',
 o:['Strong consistency','A data type whose concurrent updates can be merged deterministically without coordination, guaranteeing convergence','Encryption','Sharding'],a:1,
 e:'CRDTs (counters, sets, maps) make replication easy because merge is commutative and associative. They are powerful for counters, presence and collaborative editing, but not for every model.'},

{q:'What is the "dual-write" problem in an event-driven system?',
 o:['Writing two events','Updating the local database and publishing to a broker as two separate actions, where either can fail and leave the system inconsistent','Writing to two partitions','Using two schemas'],a:1,
 e:'The outbox pattern or CDC solves it by making the event a consequence of the committed database state rather than a parallel action that can fail independently.'},

{q:'What does "read repair" mean in a replicated store?',
 o:['Repairing a corrupted disk','When a read detects replicas with different versions, it updates the stale replicas with the newest value','Rebuilding an index','Restoring a backup'],a:1,
 e:'Read repair is a Dynamo-style technique for eventual consistency. It is combined with hinted handoff and anti-entropy processes to converge replicas over time.'},

{q:'What is a "tombstone" in a distributed key-value store?',
 o:['A backup marker','A marker that a key has been deleted, kept for a period so the deletion propagates to replicas without being resurrected by an older write','A metrics label','An encryption key'],a:1,
 e:'Tombstones must outlive the maximum replication lag and the anti-entropy window. Purging them too early can resurrect deleted data, which is a subtle and dangerous bug.'},

{q:'Why do many systems prefer "lease-based" leadership to a heartbeat-only election?',
 o:['Leases are cheaper','A lease gives a bounded guarantee that no other leader can be elected during the term, which prevents split brain even with clock skew','Leases are faster','Heartbeats are deprecated'],a:1,
 e:'Leases define a time window during which the leader is authoritative. Other nodes must wait for the lease to expire before electing a new leader, trading availability for safety.'},

{q:'What is "fencing" in a distributed system?',
 o:['Encrypting traffic','Preventing an old leader or client from continuing to act after it has lost leadership, typically with a monotonically increasing token the resource rejects','Blocking network traffic','Rate limiting'],a:1,
 e:'Fencing tokens protect shared resources such as storage or a database. Without fencing, a paused old leader can resume and write conflicting data after a new leader has taken over.'},

{q:'What is a "two-generals" illustration used to explain?',
 o:['Load balancing','The impossibility of guaranteed agreement over an unreliable channel: acknowledgements can always be lost, so no protocol can make both parties certain','Encryption','Rate limiting'],a:1,
 e:'The two generals problem shows why exactly-once delivery is impossible without additional assumptions, and why practical systems use idempotency and deduplication rather than relying on perfect messaging.'},

{q:'What does "saga compensation" need to store in order to be correct?',
 o:['Only the final state','Enough information to reverse the original effect, such as the amount charged and the transaction id, plus a record of whether compensation already ran','The whole database','The user password'],a:1,
 e:'Compensation must reconstruct the counter-action from durable state. Recording completion makes the compensation idempotent under retries, which are inevitable in a distributed system.'},

{q:'Why is a "monotonic ID" useful for event ordering and deduplication?',
 o:['It looks nicer','Because it lets a consumer detect duplicates and establish a stable order without relying on wall-clock timestamps','It compresses better','It is shorter'],a:1,
 e:'A monotonic sequence per stream or aggregate gives a total order the application can rely on. Wall clocks drift and can go backwards, so they are unreliable for ordering.'},

/* 59–70: Deployment and infrastructure */
{q:'What does a "readiness gate" ensure in Kubernetes?',
 o:['That a Pod is scheduled','That traffic is only sent to a Pod once it is actually ready to serve requests','That a Pod restarts on failure','That a Pod has enough CPU'],a:1,
 e:'Readiness removes a Pod from Service endpoints while it is still warming up. During a rolling update, this prevents traffic from reaching instances that are not yet functional.'},

{q:'What is the difference between liveness and readiness?',
 o:['They are identical','Liveness restarts a hung container; readiness removes an instance from traffic','Liveness removes traffic; readiness restarts','Both restart the container'],a:1,
 e:'A failing liveness probe causes a restart. A failing readiness probe only stops traffic. Confusing them causes restart loops for services that are merely warming up.'},

{q:'What does a Kubernetes Service selector do?',
 o:['Selects a node','Chooses which Pods belong to the Service, based on labels; the endpoints controller keeps the routing set in sync with them','Chooses a namespace','Chooses a container'],a:1,
 e:'A Service without matching Pods has no endpoints, which is the usual reason "the Service is up but returns nothing". Checking the endpoints object is the fastest diagnosis.'},

{q:'What does a Kubernetes Ingress provide that a Service does not?',
 o:['Load balancing across Pods','HTTP-level routing based on host and path, often with TLS termination, implemented by an Ingress controller','Persistent storage','Network isolation'],a:1,
 e:'A Service is L4. Ingress is L7 and depends on a controller such as ingress-nginx or Traefik. For non-HTTP protocols, a Gateway API implementation or a dedicated load balancer is usually required.'},

{q:'What is the "Gateway API" in Kubernetes?',
 o:['A replacement for Ingress in the same L7 role','A newer, role-oriented set of resources (GatewayClass, Gateway, HTTPRoute) that generalises L4/L7 traffic management beyond Ingress','A message broker','A service mesh'],a:1,
 e:'Gateway API separates infrastructure ownership (GatewayClass), platform (Gateway) and application routing (HTTPRoute). It is designed to be portable across many implementations.'},

{q:'What is the purpose of a PodDisruptionBudget?',
 o:['To limit CPU','To ensure voluntary disruptions such as node drains preserve a minimum availability for a workload','To configure TLS','To trigger autoscaling'],a:1,
 e:'PDBs cause the eviction API to wait until the budget allows another eviction. Without them, a drain can remove every replica of a service simultaneously.'},

{q:'What is the difference between a Kubernetes Job and a Deployment?',
 o:['They are equivalent','A Job runs Pods to completion for batch work; a Deployment keeps a desired number of long-running replicas','A Deployment runs to completion','A Job restarts forever'],a:1,
 e:'Jobs have completions and parallelism semantics, and they track success. Deployments are for long-running services, and their Pods are expected to keep running.'},

{q:'What does a Kubernetes Operator provide that a Helm chart does not?',
 o:['Templating','A running controller that reconciles custom resources and performs operational tasks such as backups, failover and upgrades','Package management','Secret storage'],a:1,
 e:'Helm templates and installs resources once. An Operator keeps reconciling them, which is essential for stateful systems whose day-two operations require domain logic.'},

{q:'What is the difference between a ReplicaSet and a Deployment?',
 o:['They are equivalent','A ReplicaSet maintains a stable set of Pods; a Deployment manages ReplicaSets to provide rolling updates, rollback and history','A ReplicaSet provides rollouts','A Deployment cannot scale'],a:1,
 e:'You almost never create a ReplicaSet directly. The Deployment creates and rotates ReplicaSets so that a rollout can be paused, resumed or rolled back.'},

{q:'What does "immutable infrastructure" mean?',
 o:['Infrastructure that never changes','Servers and containers are replaced rather than modified in place, so the running state always matches a known, versioned build','Infrastructure with no configuration','A read-only filesystem'],a:1,
 e:'Immutability eliminates configuration drift. Rebuilding from a known image and rolling out new instances is safer than patching servers by hand, and it makes rollback a simple image change.'},

{q:'What is the purpose of a "canary analysis" step in a progressive delivery pipeline?',
 o:['To promote automatically','To compare error rate, latency and business metrics between the canary and the baseline, and promote or roll back based on defined thresholds','To restart the canary','To scale the canary'],a:1,
 e:'Automated analysis removes the temptation to "just watch it for a bit". The analysis needs a clear baseline, enough traffic to be statistically meaningful, and fast rollback.'},

{q:'Why is "configuration as code" important for microservices?',
 o:['It reduces compile time','It makes configuration reviewable, versioned, reproducible and diff-able, reducing drift and human error across many services','It avoids secrets','It increases performance'],a:1,
 e:'With many services and environments, manual configuration changes are unmanageable. Code review, history and automated validation are only possible when config lives in version control.'},

/* 71–82: Security in depth */
{q:'Which OAuth 2.0 flow is appropriate for a single-page application?',
 o:['Client credentials','Authorization Code with PKCE','Implicit','Resource owner password'],a:1,
 e:'Implicit is deprecated because tokens appear in URLs and the browser history. PKCE protects the code exchange without requiring a client secret, which an SPA cannot keep confidential.'},

{q:'Which OAuth 2.0 flow is appropriate for service-to-service calls with no user?',
 o:['Authorization Code','Implicit','Client Credentials','PKCE'],a:2,
 e:'Client Credentials issues a token directly to a confidential client using its client id and secret. It is the standard for machine-to-machine authentication.'},

{q:'What does the "scope" claim in an access token express?',
 o:['The user\'s role','The specific permissions the token grants, so a resource server can authorise actions without hard-coding roles','The token\'s expiry','The issuer'],a:1,
 e:'Scopes are coarse-grained permissions such as orders:read. Fine-grained decisions combine scopes with application-level policy and the resource owner\'s relationship to the resource.'},

{q:'Why is the "Resource Owner Password" grant discouraged?',
 o:['It is too slow','It requires the application to handle the user\'s password directly, teaching users to hand credentials to third parties and preventing flows such as MFA','It has no client secret','It cannot issue tokens'],a:1,
 e:'The grant is legacy, intended for first-party migrations. Modern flows keep the password in the identity provider\'s UI, where MFA, risk detection and policy can be enforced.'},

{q:'What does a JWT "kid" header identify?',
 o:['The token type','The key id, so the verifier can select the correct public key from the issuer\'s JWKS during rotation','The audience','The subject'],a:1,
 e:'Key rotation requires multiple keys in circulation. kid lets the verifier pick the right one without guessing, and it must match a key in the trusted JWKS endpoint.'},

{q:'What problem does "proof of possession" solve?',
 o:['Token theft','A stolen bearer token can be replayed by anyone; proof-of-possession tokens (such as DPoP or mTLS-bound tokens) can only be used by the legitimate holder','Token expiry','Rate limiting'],a:1,
 e:'Bearer tokens are simple but risky: possession is authorisation. Binding the token to a client key ensures interception alone is insufficient to impersonate the caller.'},

{q:'What is an "audience-restricted" access token?',
 o:['A token that only works in one country','A token whose aud claim limits it to specific services, so it cannot be replayed against a service it was not issued for','A token with a short TTL','A token with no scopes'],a:1,
 e:'Audience restriction is a basic defence against token replay across services. Combined with short lifetimes and mTLS, it makes lateral movement significantly harder.'},

{q:'What does "secrets management" typically require beyond encrypted storage?',
 o:['Only encryption','Access control, auditing, rotation and short-lived credentials, so a leak is detectable and quickly neutralised','Only a vault product','Only TLS'],a:1,
 e:'Encryption at rest is the minimum. Rotation and short lifetimes limit damage, access control and audit records show who read a secret, and dynamic credentials avoid long-lived shared passwords.'},

{q:'Why is "encryption in transit" not sufficient on its own for service-to-service security?',
 o:['It is sufficient','TLS protects the channel but does not decide whether a caller is authorised; you also need identity verification and authorisation policy per request','TLS is deprecated','It is too slow'],a:1,
 e:'TLS confidentiality and integrity do not imply access control. mTLS gives a service identity, and authorisation policy decides what that identity may do, which is the second half of the story.'},

{q:'What is the purpose of "policy as code"?',
 o:['Writing documentation','Expressing security and compliance policies in a machine-enforceable form (such as OPA/Rego or Kyverno), so violations are blocked automatically','Encrypting manifests','Publishing RFCs'],a:1,
 e:'Policy as code moves enforcement from review checklists to the admission path. It is versioned, testable and consistent across clusters and services.'},

{q:'What does a "supply chain attack" on a container image target?',
 o:['The network','Any step between writing source code and running the container: dependencies, build systems, registries and image signing','The database','The user'],a:1,
 e:'Mitigations include signed images, SBOMs, pinned digests, admission control that verifies signatures, and least privilege for build systems. Trust in an image must be earned, not assumed.'},

{q:'Why should a service reject tokens from an untrusted issuer, even if signed by a key it recognises?',
 o:['Signatures cannot be verified','Because a compromised or unrelated identity provider could issue a validly signed token with unexpected claims, granting unintended access','Because signatures expire','Because TLS is required'],a:1,
 e:'Issuer and audience are part of the trust decision, not just signature validity. The service must pin the set of accepted issuers and validate every claim it relies on.'},

{q:'What does "least privilege" mean for a service account?',
 o:['The account has no permissions','The account has only the permissions required for its specific function, scoped as narrowly as possible, with no shared broad credentials','The account has admin rights','The account is disabled'],a:1,
 e:'Broad shared credentials turn one compromised service into a compromise of everything. Scoped per-service identities with short-lived credentials limit blast radius.'},

/* 83–92: Observability in depth */
{q:'What does the OpenTelemetry Collector add over direct SDK export?',
 o:['Faster SDKs','A vendor-neutral pipeline for receiving, processing (sampling, redaction, batching) and exporting telemetry, so applications do not embed export logic','A database','A service mesh'],a:1,
 e:'The Collector decouples instrumentation from backends. Switching vendors becomes a Collector config change, and processing such as sampling and attribute redaction happens centrally.'},

{q:'What is a "tail-based sampler" in a Collector pipeline?',
 o:['A sampler that runs on the client','A sampler that buffers complete traces and decides whether to keep them based on outcome, such as errors or slow duration','A sampler that keeps only 1% of spans','A log sampler'],a:1,
 e:'Tail sampling requires all spans of a trace to reach the same Collector instance, which is usually achieved by load balancing on trace id. It is more expensive than head sampling but far more useful for debugging.'},

{q:'Why is the trace id the natural join key across logs and traces?',
 o:['It is a UUID','It uniquely identifies a request across services, so a log line with the trace id can be pivoted to the full trace in a tracing UI','It is shorter than a span id','It is required by W3C'],a:1,
 e:'Including trace_id and span_id in every log record lets log platforms link directly to traces. Without it, correlating logs and traces requires guesswork based on timestamps.'},

{q:'What is the risk of putting a request id or user id in a metric label?',
 o:['It is illegal','Unbounded cardinality explodes the number of time series, which can overwhelm the metrics backend and make queries unusably slow','It reduces accuracy','It breaks tracing'],a:1,
 e:'Metrics must stay bounded. High-cardinality identifiers belong in traces or logs. If you must group by something, choose a bounded dimension such as endpoint or status code.'},

{q:'What does an SLO of 99.9% over 30 days permit?',
 o:['Zero failures','About 43 minutes of full unavailability per 30 days, depending on how the SLI is defined','About 10 hours of downtime','1 day of downtime'],a:1,
 e:'30 days is 43,200 minutes; 0.1% is 43.2 minutes. The exact calculation depends on whether the SLI is availability, error ratio or latency-based.'},

{q:'What is the difference between an SLI and an SLO?',
 o:['They are the same','An SLI is the measured indicator (for example the success ratio); an SLO is the target value for that indicator over a window','An SLA is stricter than an SLO','An SLI is a contract'],a:1,
 e:'You choose SLIs, set SLOs on them, and an SLA is the external commercial commitment. SLOs are usually stricter than the SLA so there is headroom before breaching the contract.'},

{q:'Why does a multi-window, multi-burn-rate alert outperform a simple threshold alert?',
 o:['It is easier to configure','It catches both fast outages and slow degradation while reducing noise, by comparing short and long windows against the error budget consumption','It requires no metrics','It fires only on user complaints'],a:1,
 e:'A short window reacts quickly to a spike, while a longer window confirms the trend. Pairing them avoids paging on a brief blip and avoids waiting hours to notice a slow burn.'},

{q:'What should be paged on, versus what should be shown on a dashboard?',
 o:['Everything on a dashboard should page','Page on user-impacting symptoms that require action; dashboard everything else, including causes and secondary signals used for diagnosis','Only CPU should page','Only logs should page'],a:1,
 e:'Paging is an interruption with a cost. It should be reserved for issues that need human action now. Everything else belongs in dashboards, weekly reviews or automated remediation.'},

{q:'What is a "golden path" for service teams?',
 o:['The fastest deployment option','A well-supported, opinionated template for building and operating a service, with observability, security and deployment configured by default','A load-balancing strategy','A network topology'],a:1,
 e:'Golden paths reduce cognitive load and make the easy way the compliant way. Teams can still deviate, but the default should be correct without extra work.'},

{q:'What does "observability-driven development" mean?',
 o:['Writing only tests','Designing and evolving a service with its telemetry as a first-class deliverable, so the questions you will ask in production are answerable by design','Only using dashboards','Ignoring logs'],a:1,
 e:'The practical implication is that every new feature ships with the metrics, logs and spans needed to operate it. Adding telemetry after an incident is much more expensive than doing it up front.'},

{q:'What is the value of a "service catalogue"?',
 o:['A marketing website','A searchable record of services with owners, dependencies, SLOs and runbooks, which reduces mean time to recovery during incidents','A deployment tool','A database schema'],a:1,
 e:'In a large system, knowing who owns a service and what it depends on is often the bottleneck during an incident. A maintained catalogue turns that into a quick lookup.'},

/* 93–100: Operations, capacity & governance */
{q:'What is the main risk of a very long synchronous request chain?',
 o:['It is hard to test','Compounded latency and probability of failure, plus thread and connection occupancy for the full duration','It requires more code','It cannot be traced'],a:1,
 e:'Each hop adds latency and a failure chance. Chains of ten or more synchronous hops are a design smell; asynchronous integration or in-service aggregation usually reduces both latency and failure probability.'},

{q:'What does "capacity planning" usually start from?',
 o:['The number of services','Measured per-instance throughput and latency at a defined SLO, from which the number of instances needed for peak load is derived, with headroom','The number of teams','The size of the database'],a:1,
 e:'Load testing at the SLO, identifying the bottleneck, and adding headroom for failure and growth is the standard method. Guessing from CPU alone usually underestimates queueing effects.'},

{q:'Why is "utilisation near 100%" dangerous for a service?',
 o:['It is inefficient','Queueing delay grows non-linearly as utilisation approaches capacity, so latency explodes and small spikes cause timeouts and cascading failures','It is illegal','It wastes money'],a:1,
 e:'This is the classic utilisation curve. Services should run with meaningful headroom, and load shedding should kick in before the queue grows without bound.'},

{q:'What is the value of a game day?',
 o:['A marketing event','A planned exercise that injects realistic failures and tests the on-call response, runbooks and system behaviour','A deployment window','A code freeze'],a:1,
 e:'Game days reveal operational gaps that tests miss: slow alerts, unclear ownership, missing runbooks. They should start with clear hypotheses and a controlled blast radius.'},

{q:'What belongs in a good alert?',
 o:['Only the metric name','The symptom, the affected service and SLO, a link to a runbook or dashboard, and enough context to start investigating','The full stack trace','The commit hash only'],a:1,
 e:'Alerts are read under pressure. Actionability matters more than detail, and a runbook link converts a confusing signal into a defined first step.'},

{q:'Why is "toil" a concern in microservices operations?',
 o:['It is fun','Repetitive manual work scales linearly with the number of services and consumes the time needed for reliability improvements, so it should be automated','It is required','It is unavoidable'],a:1,
 e:'With ten services, manual tasks are tolerable; with hundreds they dominate. Automation and platform investment are the only way to keep operations sustainable.'},

{q:'What does "mean time to recovery" measure, and why does it matter?',
 o:['How often services fail','The average time from the start of an incident to restoration of service, which directly affects user impact and is often easier to improve than failure rate','The number of deploys','The cost of downtime'],a:1,
 e:'Reducing MTTD (detection) and MTTR (recovery) is often cheaper than eliminating failures entirely. Fast detection, good runbooks and safe rollback shorten outages significantly.'},

{q:'What is the purpose of a "kill switch" or feature flag in incident response?',
 o:['To terminate the process','To disable a problematic feature immediately without a deployment, stopping the user impact while the root cause is investigated','To restart services','To clear caches'],a:1,
 e:'A kill switch buys time. It is only useful if the flag is tested regularly and its effect is understood, otherwise it becomes another unknown under pressure.'},

{q:'Why is a blameless postmortem more effective than a blame-oriented one?',
 o:['It is faster','People share accurate information when they are not at risk of punishment, which produces better systemic fixes','It avoids accountability','It removes the need for action items'],a:1,
 e:'Blameless does not mean consequence-free. It means the focus is on the conditions that made the error likely, with concrete improvements to tooling, process and safeguards.'},

{q:'What is "error budget policy" in practice?',
 o:['A financial budget','An agreed rule for what happens when the error budget is exhausted or burning fast, such as freezing releases in favour of reliability work','A monitoring tool','A licensing agreement'],a:1,
 e:'Without a pre-agreed policy, reliability discussions become political under pressure. A written policy makes the trade-off explicit and predictable.'},

{q:'A service in one region degrades while the other region is healthy. What should the system do?',
 o:['Ignore it','Shift traffic away from the degraded region if the failover is automated and tested, and alert the owning team; otherwise follow the documented, rehearsed runbook','Restart every instance','Roll back all deployments'],a:1,
 e:'Regional failover is only safe if it has been rehearsed and its data consistency implications are understood. Untested failover is often worse than no failover because it creates a second incident.'},

{q:'What is the role of "chaos experiments" in steady-state operations?',
 o:['To randomly break production','To continuously validate that resilience mechanisms work as designed, ideally in staging or with a small production blast radius and abort conditions','To reduce cost','To replace monitoring'],a:1,
 e:'Continuous chaos finds drift: a circuit breaker that was never re-enabled, a retry policy that was removed. Experiments need hypotheses, controls and stop conditions to be safe and useful.'},

{q:'Which practice best reduces the risk of a single engineer holding unique knowledge of a service?',
 o:['Longer documentation','On-call rotation across the team, plus runbooks and pairing, so multiple people can operate and debug the service','Restricting access','Freezing deployments'],a:1,
 e:'Bus factor is an operational risk. Rotation, runbooks and recorded incident reviews spread knowledge and improve the quality of documentation because it is actually used.'}

/* ============================================================

   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Microservices Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
