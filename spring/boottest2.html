<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 Spring Boot MCQs (Set 2): external config data API, logging, Actuator & observability, test slices & Testcontainers, packaging/native, auto-config internals, events & scheduling, caching, messaging, security, validation, web clients.">
<style>
  :root{--brand:#6db33f;--brand-dark:#3f6b1f;--accent:#8ee36a;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#183a06;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#f0fdf4;border-color:#bbf7d0}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(109,179,63,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f7fee7}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ecfccb}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 Spring Boot Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* ---------- 1–10: External configuration (config data API) ---------- */
{q:'What does the property spring.config.import allow you to do?',
 o:['Rename the application main class','Import additional configuration data from files, directories, config trees or external systems into the Environment','Import a Maven dependency','Import a Spring bean'],
 a:1,
 e:'spring.config.import=optional:file:./config/ pulls in external data at startup. Adding optional: means the application still starts if the target does not exist, which is the recommended default for local overrides.'},

{q:'How do you separate multiple documents inside a single application.yml file?',
 o:['With a comma','With a semicolon','With a line containing three hyphens (---)','With an XML tag'],
 a:2,
 e:'Each document is separated by --- and can be activated with spring.config.activate.on-profile. This is the YAML equivalent of having several application-{profile}.yml files.'},

{q:'Which property changes the base file name that Spring Boot looks for instead of application?',
 o:['spring.config.name','spring.application.name','spring.config.file','spring.main.name'],
 a:0,
 e:'spring.config.name=myapp makes the loader look for myapp.properties or myapp.yml. It is useful when a single jar hosts several deployable contexts that each need their own configuration file.'},

{q:'What is the difference between spring.config.location and spring.config.additional-location?',
 o:['They are identical','location adds locations; additional-location replaces them','additional-location is deprecated','location replaces the default locations entirely; additional-location keeps the defaults and adds the specified ones on top'],
 a:3,
 e:'Use additional-location when you want the defaults plus an extra override path. Use location only when you deliberately want to ignore the default classpath and working-directory locations.'},

{q:'Why does @PropertySource not work with a YAML file by default?',
 o:['YAML files cannot be read by Java','@PropertySource uses a PropertySourceFactory that only understands .properties; YAML needs a custom factory','YAML keys must be quoted','YAML cannot contain nested keys'],
 a:1,
 e:'@PropertySource has no YAML support built in. You either write a PropertySourceFactory backed by YamlPropertySourceLoader, or rely on the config data API, which understands YAML natively.'},

{q:'Can @Value apply relaxed binding to a property name?',
 o:['Yes, for all supported forms','Yes, but only for kebab-case','No, @Value matches the exact property name and does not support relaxed binding','Only for numeric properties'],
 a:2,
 e:'@Value("${my.app-name}") requires the exact spelling. A property named MY_APP_NAME or my.appName would not resolve. This is one of the main reasons to prefer @ConfigurationProperties for grouped configuration.'},

{q:'Which optional dependency generates IDE metadata (autocomplete, descriptions) for @ConfigurationProperties?',
 o:['spring-boot-configuration-processor','spring-boot-metadata','spring-configuration-json','spring-boot-autocomplete'],
 a:0,
 e:'It generates META-INF/spring-configuration-metadata.json during compilation, which IDEs use for completion and which tools use for validation. The dependency is marked optional.'},

{q:'What is spring.profiles.group used for?',
 o:['Grouping beans by package','Grouping environment variables','Restricting which profiles can be used together','Defining a shortcut name that activates several profiles at once'],
 a:3,
 e:'With spring.profiles.group.production=proddb,prodmetrics, activating production activates both of those. It keeps long, error-prone profile lists out of launch scripts.'},

{q:'What does an import of type configtree: provide?',
 o:['A YAML tree','A directory where each file name is a property key and the file content is the value, commonly used for mounted Kubernetes secrets','A zip archive of configuration','A tree of beans'],
 a:1,
 e:'spring.config.import=configtree:/etc/config/ treats each file in the directory as a property, which maps cleanly onto Kubernetes secret and ConfigMap volume mounts.'},

{q:'Which of these config data sources has the highest precedence?',
 o:['application.properties on the classpath','Profile-specific files outside the jar','Command line arguments','OS environment variables'],
 a:2,
 e:'Command line arguments sit at the top. Below them are Java system properties, then OS environment variables, then profile-specific files outside the jar, then packaged files.'},

/* ---------- 11–20: Logging ---------- */
{q:'How do you enable structured JSON logging in Spring Boot 3.4+?',
 o:['Add a custom encoder bean only','Set logging.structured.format.console=ecs (or logstash, gelf)','Set logging.json.enabled=true','Add jackson to the classpath'],
 a:1,
 e:'Spring Boot 3.4 introduced built-in structured logging with ECS, Logstash and GELF formats. It produces machine-parseable output without a custom logback encoder.'},

{q:'How can you change a logger level at runtime in a running application?',
 o:['Restart the application','Edit application.properties and rebuild','Only via JMX','POST to /actuator/loggers/com.example with a JSON body containing configuredLevel'],
 a:3,
 e:'The /actuator/loggers endpoint allows live inspection and modification. It is invaluable for turning on DEBUG for a specific package while investigating a production issue.'},

{q:'Why is logback-spring.xml preferred over logback.xml in a Spring Boot application?',
 o:['It is processed by Spring Boot, so it supports <springProfile>, <springProperty> and property placeholders','It compresses logs better','It is the only supported format','It runs faster'],
 a:0,
 e:'logback.xml is read directly by Logback before Spring is initialised, so it cannot see the Environment. logback-spring.xml is deferred until the Environment is ready.'},

{q:'Which property customises the console log pattern?',
 o:['logging.format.console','logging.console.pattern','logging.pattern.console','spring.logging.pattern'],
 a:2,
 e:'Similarly logging.pattern.file and logging.pattern.level exist. Setting them keeps the customisation in configuration rather than in a logback file.'},

{q:'Which property writes logs to a file in addition to the console?',
 o:['logging.path','logging.file.name','logging.output','spring.logging.file'],
 a:1,
 e:'logging.file.name sets an exact path, while logging.file.path sets a directory and uses spring.log as the file name. Setting both is allowed, with name taking precedence.'},

{q:'How do you set the root log level to WARN?',
 o:['logging.level.root=WARN','logging.root=WARN','logging.level=WARN','root.level=WARN'],
 a:0,
 e:'Package-specific levels follow the same shape, for example logging.level.org.springframework.web=DEBUG. Unset packages inherit from the root level.'},

{q:'What does logging.register-shutdown-hook default to?',
 o:['false','Only when running from a jar','Only in tests','true, so the logging system flushes and shuts down cleanly when the JVM exits'],
 a:3,
 e:'Registering the shutdown hook ensures buffered log events are written before the JVM terminates. You only disable it if another component manages the logging lifecycle.'},

{q:'Which dependency brings Logback onto the classpath?',
 o:['spring-boot-starter-logback','spring-boot-starter-logging, pulled in transitively by every starter','logback-classic directly must be added','spring-boot-logging'],
 a:1,
 e:'spring-boot-starter-logging depends on logback-classic, log4j-to-slf4j and jul-to-slf4j, so all common logging APIs route through SLF4J to Logback.'},

{q:'How do you switch from Logback to Log4j2?',
 o:['Set logging.framework=log4j2','Exclude spring-boot-starter-logging and add spring-boot-starter-log4j2','Add log4j2 to the classpath alongside logback','Only a property change is needed'],
 a:1,
 e:'Having both backends present causes SLF4J to bind unpredictably. The exclusion plus the alternative starter is the documented approach.'},

{q:'Which mechanism lets you attach request-scoped context (such as a trace id) to every log line?',
 o:['MDC (Mapped Diagnostic Context), populated by a filter or interceptor','A custom logger factory','Logging groups','The logging.pattern.level property'],
 a:0,
 e:'MDC.put("traceId", id) makes %X{traceId} available in the pattern. Micrometer Tracing populates traceId and spanId automatically in Spring Boot 3.'},

/* ---------- 21–32: Actuator & observability ---------- */
{q:'Which property enables graceful shutdown so in-flight requests complete before the server stops?',
 o:['server.graceful=true','spring.shutdown=graceful','server.shutdown=graceful','management.shutdown=graceful'],
 a:2,
 e:'The default is immediate, which drops in-flight requests. graceful uses the configured spring.lifecycle.timeout-per-shutdown-phase (30s by default) to drain them.'},

{q:'Which property enables Kubernetes liveness and readiness probe endpoints?',
 o:['management.health.probes.enabled=true','management.endpoint.health.probes.enabled=true','kubernetes.probes.enabled=true','server.probes.enabled=true'],
 a:1,
 e:'It exposes /actuator/health/liveness and /actuator/health/readiness. Spring Boot auto-enables this when it detects a Kubernetes environment.'},

{q:'Which component does the liveness health group include by default?',
 o:['db','diskSpace','ping only','livenessState'],
 a:3,
 e:'Liveness reflects whether the application is alive and should not be restarted. A database outage must not make liveness fail, or Kubernetes will restart a perfectly healthy process.'},

{q:'Which Actuator endpoint returns a thread dump of the running JVM?',
 o:['/actuator/threaddump','/actuator/threads','/actuator/jvm','/actuator/stack'], a:0,
 e:'It returns a JSON representation of all threads with their state and stack. It is the quickest way to diagnose a stuck request in production without attaching a profiler.'},

{q:'Which endpoint produces a heap dump, and why is it sensitive?',
 o:['/actuator/memory','/actuator/jvm','/actuator/heapdump, because it can expose secrets in memory and is large','/actuator/dump'],
 a:2,
 e:'A heap dump contains every object, including passwords, tokens and customer data. It should be disabled or heavily restricted in production.'},

{q:'Which endpoint would you use to inspect and change log levels at runtime?',
 o:['/actuator/logs','/actuator/loggers','/actuator/logger','/actuator/logging'],
 a:1,
 e:'GET returns the configuration tree; a POST with a body such as {"configuredLevel":"DEBUG"} changes a logger. Changes are not persisted and reset on restart.'},

{q:'How do you add custom data to /actuator/info?',
 o:['Write a file named info.json','Add an info.* property','Annotate a controller with @Info','Register an InfoContributor bean'],
 a:3,
 e:'InfoContributor is the programmatic way to add build, git or environment data. Static values can also be set with info.app.version properties, but contributors can compute values at runtime.'},

{q:'What replaced Spring Cloud Sleuth in Spring Boot 3?',
 o:['Spring Cloud Config','Zipkin only','Micrometer Tracing, with bridges for Brave or OpenTelemetry','Logback MDC'],
 a:2,
 e:'Micrometer Tracing is the observability facade; Brave and OpenTelemetry are the underlying tracers. It provides traceId and spanId propagation across HTTP, messaging and JDBC.'},

{q:'What is the Micrometer Observation API for?',
 o:['A single instrumentation abstraction that produces metrics, traces and logs from one observation site','A replacement for SLF4J','A configuration format','A health indicator API'],
 a:0,
 e:'Instead of instrumenting metrics and tracing separately, you wrap an operation in an Observation and each registry decides what to record, which keeps instrumentation consistent and DRY.'},

{q:'Which property exports traces over OTLP?',
 o:['spring.tracing.endpoint','management.otlp.tracing.endpoint','micrometer.tracing.url','tracing.otlp.enabled'],
 a:1,
 e:'Adding micrometer-registry-otlp plus this endpoint ships spans to an OpenTelemetry collector. management.otlp.metrics.export.* covers metrics in the same way.'},

{q:'Which annotation records a method as a Micrometer timer?',
 o:['@Metered','@Counted','@Observed','@Timed'],
 a:3,
 e:'@Timed records count and total time for the method. It requires a TimedAspect bean (auto-configured when micrometer is present) to work on arbitrary beans.'},

{q:'What does running Actuator on a separate management port achieve?',
 o:['It lets you firewall management endpoints independently of application traffic','It reduces memory usage','It disables security','It speeds up endpoints'],
 a:0,
 e:'management.server.port moves endpoints onto their own port and, optionally, their own SSL settings and address. The public port can then stay clean while management stays internal.'},

/* ---------- 33–42: Testing ---------- */
{q:'Which annotation loads a slice test for a reactive web controller?',
 o:['@WebMvcTest','@SpringBootTest','@WebFluxTest','@ReactiveTest'],
 a:2,
 e:'@WebFluxTest configures the WebFlux infrastructure, controller advice and the WebTestClient, without loading the full application context.'},

{q:'Which client is the idiomatic choice for asserting on responses in a WebFlux slice test?',
 o:['MockMvc','WebTestClient','TestRestTemplate','RestTemplate'],
 a:1,
 e:'WebTestClient works both against a running server and against a mocked or bound controller, and it supports reactive assertions such as expectBody and consumeWith.'},

{q:'Which annotation configures a slice test for a client that uses RestTemplate?',
 o:['@RestTemplateTest','@ClientTest','@HttpTest','@RestClientTest'],
 a:3,
 e:'@RestClientTest auto-configures a MockRestServiceServer so you can stub outbound HTTP without a real server. It is the standard way to test HTTP clients.'},

{q:'What does @ServiceConnection (Spring Boot 3.1+) do in a Testcontainers test?',
 o:['Opens a JDBC connection for you','Registers the container as a bean','Derives connection properties from the container and registers them in the context automatically','Creates a service mesh connection'],
 a:2,
 e:'It removes the boilerplate @DynamicPropertySource block. With a Redis or PostgreSQL container declared as a @Container, the connection details are wired automatically.'},

{q:'Which annotation starts a Testcontainers-managed container in a JUnit 5 test class?',
 o:['@Testcontainers on the class plus @Container on a static field','@Container only','@DockerTest','@TestContainer'],
 a:0,
 e:'@Testcontainers enables the JUnit 5 extension that starts and stops containers around the class, while @Container marks each field to manage. Static containers are shared across all tests in the class.'},

{q:'What is @DynamicPropertySource used for in tests?',
 o:['Reading properties from a file','Registering properties at runtime from a static supplier, typically container connection details','Changing properties after the test','Replacing the Environment bean'],
 a:1,
 e:'It lets properties depend on values that only exist after a container or mock server starts. @ServiceConnection removes the need for it in the common Testcontainers case.'},

{q:'Which annotation replaces @SpyBean in Spring Boot 3.4?',
 o:['@Spy','@MockitoSpyBean','@TestSpy','@SpyBean is still current'],
 a:1,
 e:'@MockitoSpyBean, paired with @MockitoBean for mocks, decouples Spring Test from a specific mocking framework. Both older annotations are deprecated.'},

{q:'How do you pass a one-off property to a single @SpringBootTest?',
 o:['properties = "app.mode=test" on the annotation','@PropertySource only','A static block','You cannot; you must edit application.properties'],
 a:0,
 e:'The properties attribute is the most local option. Use @TestPropertySource for file locations, and application-test.properties with @ActiveProfiles for a full environment.'},

{q:'How does @TestPropertySource differ from the properties attribute on @SpringBootTest?',
 o:['They are identical','The properties attribute takes only file paths','@TestPropertySource can add inline properties or property file locations and participates in the full Environment precedence order','@TestPropertySource only works with YAML'],
 a:2,
 e:'@TestPropertySource is a Spring Test annotation with broader scope, while the @SpringBootTest attribute is a shortcut for inline properties. For most cases either is fine; use the one that matches the rest of your test style.'},

{q:'What is the main purpose of enabling Testcontainers reuse?',

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Spring Boot Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
