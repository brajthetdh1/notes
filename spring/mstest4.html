<style>
  :root{--brand:#0e7490;--brand-dark:#164e63;--accent:#22d3ee;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .setpill{background:var(--accent);color:#083344;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}

  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#cffafe;border-color:#a5f3fc}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(14,116,144,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#ecfeff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}

  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}

  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}

  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}

  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}

<body>

<header class="topbar">
  <div class="brand">🧩 Microservices Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Testing strategy */
{q:'What is the "test pyramid" for microservices?',
 o:['More end-to-end tests than unit tests','Many fast unit tests, fewer integration tests, and fewest end-to-end tests, with contract tests bridging the gaps','Only end-to-end tests','Only unit tests'],a:1,
 e:'The pyramid reflects cost and feedback speed. Unit tests are cheap and fast, integration tests slower, and end-to-end tests slowest and most brittle. Contract tests fill the gap between services without full environment testing.'},

{q:'What problem does consumer-driven contract testing solve?',
 o:['Load testing','Detecting when a provider changes its API in a way that breaks a specific consumer, before deployment, without needing the real services','Security testing','Performance testing'],a:1,
 e:'The consumer publishes its expectations, the provider\'s CI runs them against its build, and a violation fails fast. This replaces a large end-to-end suite with many small, targeted checks.'},

{q:'Which tool is most commonly used for consumer-driven contract testing in JVM ecosystems?',
 o:['JUnit','Pact','JMeter','Selenium'],a:1,
 e:'Pact records consumer expectations as pacts, verifies them against the provider, and can publish results to a Pact Broker. Spring Cloud Contract is an alternative with a producer-driven flavour.'},

{q:'What does Testcontainers provide?',
 o:['A test mocking library','Disposable, real Docker containers for dependencies such as databases, brokers and caches, started and torn down by the test framework','A load-testing tool','A CI pipeline'],a:1,
 e:'Testcontainers gives real dependency behaviour without shared test environments. Each test class gets a clean instance, which removes flakiness from state leakage between tests.'},

{q:'Why are end-to-end tests in microservices usually slow and flaky?',
 o:['Because they use no assertions','They require many services, real network calls, asynchronous timing and shared environments, all of which introduce non-determinism','Because they are written in a different language','Because they cannot use Docker'],a:1,
 e:'Each additional service multiplies failure modes. Keeping the E2E suite small, focused on critical user journeys, and replacing the rest with contract and integration tests is the standard response.'},

{q:'What is a "smoke test" typically used for in a deployment pipeline?',
 o:['Load testing','A small, fast check that the deployed system is basically functional, such as the health endpoint and a core happy path','Security scanning','Performance benchmarking'],a:1,
 e:'Smoke tests catch a broken deployment immediately, before progressive rollout to more traffic. They should be fast and stable; deeper checks belong later in the pipeline.'},

{q:'What is the difference between a stub and a mock?',
 o:['They are the same','A stub returns canned responses; a mock also verifies interactions, such as "this method was called once with these arguments"','A mock returns real data','A stub verifies calls'],a:1,
 e:'Overusing interaction assertions couples tests to implementation. Prefer stubs or fakes for collaborators and reserve mocks for verifying important side effects such as publishing an event.'},

{q:'What is property-based testing useful for in a distributed system?',
 o:['Testing the UI','Generating many inputs to verify invariants hold, such as "serialize then deserialize yields the same object", which catches edge cases example-based tests miss','Measuring performance','Testing infrastructure'],a:1,
 e:'Tools such as jqwik and Hypothesis generate inputs and shrink failures. It is especially good for serialization, event schemas, money maths and state machines.'},

{q:'What is mutation testing?',
 o:['Testing with mutated data','Deliberately introducing small changes to production code and checking that tests fail, to measure test effectiveness','Changing the database schema','Fuzzing APIs'],a:1,
 e:'If a mutation survives, the tests did not catch it. Mutation testing is slow but reveals weak assertions and untested branches, which coverage alone does not.'},

{q:'Why should tests for a microservice not depend on a shared staging environment?',
 o:['Staging is too fast','Shared state and other teams\' deployments make tests non-deterministic; tests should own their dependencies via containers or contract verification','Staging has no network','Staging is not encrypted'],a:1,
 e:'Isolated, deterministic tests can be run on every pull request. Shared environments remain useful for exploration and exploratory testing but not for gating builds.'},

/* 11–22: Integration and contract details */
{q:'What is the difference between a provider contract test and a consumer contract test?',
 o:['They are identical','A consumer test records what the consumer expects; a provider test verifies the provider satisfies those recorded expectations','Provider tests are for databases','Consumer tests are for UI'],a:1,
 e:'In Pact the consumer generates the pact, and the provider verifies it. In Spring Cloud Contract the provider publishes contracts, and consumers verify against them. Both close the same gap.'},

{q:'What does a Pact Broker provide?',
 o:['A message broker','A central store for published pacts and verification results, enabling can-i-deploy checks and version tagging','A container registry','A CI server'],a:1,
 e:'The broker tracks which consumer versions are compatible with which provider versions. The can-i-deploy CLI gate prevents deploying a provider version known to break a consumer.'},

{q:'When is contract testing NOT sufficient on its own?',
 o:['When services are in different languages','When the integration involves complex workflows across several services, non-HTTP protocols, or stateful multi-step interactions, which still need a few targeted integration tests','When using REST','When using Kafka'],a:1,
 e:'Contracts validate single request-response shapes. Multi-step flows, ordering and failure semantics need integration tests against a real broker or a service-level end-to-end test.'},

{q:'What does an integration test typically verify that a unit test cannot?',
 o:['Syntax','Behaviour of the service against real infrastructure such as a database, broker or HTTP server, including serialization, transactions and SQL','Code style','Type checking'],a:1,
 e:'Many production bugs live at the seams: wrong SQL, serialization mismatch, transaction boundaries. Integration tests with Testcontainers catch these without requiring the whole system.'},

{q:'What is "test-driven development" in a microservices context?',
 o:['Writing tests after deployment','Writing a failing test for the desired behaviour first, then the minimum code to make it pass, then refactoring','Only writing integration tests','Testing in production'],a:1,
 e:'TDD is a design technique as much as a testing one. It tends to produce small, well-factored units, which is especially valuable when services must remain independently testable.'},

{q:'Why is snapshot testing of serialized API responses risky?',
 o:['Snapshots are always wrong','Snapshots break on irrelevant formatting changes and can be blindly updated, giving false confidence; they are useful for detecting change but need careful review','Snapshots are illegal','Snapshots cannot be versioned'],a:1,
 e:'A snapshot diff should prompt a review: is this an intentional API change? Blindly running the update command turns snapshot tests into a rubber stamp.'},

{q:'What does "given-when-then" describe?',
 o:['A deployment pipeline','A test structure: given a context, when an action occurs, then expect an outcome, which keeps tests readable and focused','A load-balancing policy','A design pattern'],a:1,
 e:'Also known as arrange-act-assert. The structure forces a test to have a clear precondition, a single behaviour under test, and explicit expectations, which makes failures easy to understand.'},

{q:'What is a "fake" in testing?',
 o:['A stub with hard-coded returns','A working implementation with a shortcut, such as an in-memory repository, that behaves like the real thing but is faster and isolated','A mock','A test runner'],a:1,
 e:'Fakes often give the best balance: realistic behaviour without infrastructure. An in-memory implementation of a repository interface can be reused across many tests.'},

{q:'What problem does a "service virtualisation" tool address?',
 o:['Encrypting traffic','Simulating third-party or unavailable services with realistic behaviour, including latency and error modes, for integration testing','Load balancing','Service discovery'],a:1,
 e:'When you cannot spin up a real dependency — an external payment provider, for example — a virtualised double lets you test failure paths, timeouts and latencies that are otherwise untestable.'},

{q:'Why is chaos testing valuable even with a strong test suite?',
 o:['It replaces the test suite','Because some failures only appear under real conditions — partial network loss, pod restarts, clock skew — which are hard to reproduce in unit or integration tests','Because tests are slow','Because it increases coverage metrics'],a:1,
 e:'Chaos validates the system, not just the code. It exercises retry policies, circuit breakers, timeouts and fallbacks end to end, where most real incidents originate.'},

{q:'What is a "flaky test" and why is it dangerous?',
 o:['A test that always fails','A test that passes or fails non-deterministically; it erodes trust in the suite, so failures get ignored and real regressions slip through','A test that always passes','A test that runs slowly'],a:1,
 e:'Flakiness is a signal of hidden non-determinism: time dependence, shared state, network timing or ordering assumptions. Quarantine and fix them, or the suite becomes noise.'},

{q:'What is the purpose of a "canary test" in CI?',
 o:['To test UI colours','To verify a small but critical slice of functionality, such as a health check and a primary user action, immediately after deployment','To load-test the cluster','To run security scans'],a:1,
 e:'It is often the last stage before progressive rollout. It catches misconfiguration and missing migrations, which unit and integration tests cannot detect.'},

/* 23–34: Kafka and messaging advanced */
{q:'What does "min.insync.replicas" enforce on a Kafka topic?',
 o:['The number of partitions','The minimum number of replicas that must acknowledge a write before it is considered successful when the producer uses acks=all','The number of consumer groups','The retention time'],a:1,
 e:'If the ISR drops below min.insync.replicas, writes fail with NotEnoughReplicasException rather than silently reducing durability. It is the standard tuning for durable topics.'},

{q:'Why might a Kafka consumer group be stuck in continuous rebalancing?',
 o:['The broker is down','A consumer that exceeds max.poll.interval.ms is evicted, triggering rebalances that cascade; other causes include long GC pauses or a session timeout that is too short','The topic does not exist','The schema is incompatible'],a:1,
 e:'Diagnose with consumer group describe and the rebalance metrics. Reduce max.poll.records, move slow work off the poll thread, and tune session.timeout.ms and heartbeat.interval.ms.'},

{q:'What is the difference between Kafka log retention and log compaction?',
 o:['They are the same','Retention deletes segments by time or size; compaction keeps the latest record per key and eventually removes older ones, preserving current state','Compaction deletes everything','Retention is for keys'],a:1,
 e:'Compaction turns a topic into a changelog. It is used for state stores and configuration. Compaction is lazy, so a key may still have multiple records for a while.'},

{q:'How does Kafka achieve ordering with concurrent producers?',
 o:['Global ordering across all topics','Ordering is preserved only within a partition; the same key always hashes to the same partition, so per-key ordering holds if producers do not retry out of order','No ordering at all','Producers send synchronously only'],a:1,
 e:'With idempotent producers, retries no longer reorder records within a partition. Without it, max.in.flight > 1 with retries enabled can reorder records on the same key.'},

{q:'What is a "rebalance protocol" improvement in newer Kafka versions?',
 o:['Cooperative sticky assignment, which lets consumers keep their partitions and only revoke what must move, reducing the stop-the-world rebalance pause','Compressed records','Faster disk','Schema registry'],a:0,
 e:'Cooperative rebalancing is incremental. It avoids the classic eager protocol where every consumer revokes all partitions, and it dramatically reduces the pause during scaling events.'},

{q:'What is "consumer group rebalance" in the presence of a slow consumer?',
 o:['It speeds up the slow consumer','If one consumer exceeds max.poll.interval.ms, the group rebalances repeatedly, and partitions can bounce between consumers, causing duplicate processing and stalls','It ignores slow consumers','It pauses the broker'],a:1,
 e:'The fix is to reduce the per-poll workload or move processing to a worker pool with careful offset management. Simply raising the timeout hides the problem until traffic grows.'},

{q:'Why are "zombie" consumers a problem after a rebalance?',
 o:['They consume too much CPU','A consumer that does not notice it has lost its partition may still process and commit offsets for data another consumer now owns, causing duplicates or lost writes','They block the broker','They use too much memory'],a:1,
 e:'The fencing mechanism uses generation ids: a commit from a stale generation is rejected. Consumers must handle the rebalance callback and stop processing revoked partitions.'},

{q:'What is the purpose of a "dead letter queue" for a Kafka consumer?',
 o:['To increase throughput','To isolate messages that repeatedly fail processing so the main consumer can continue, while retaining the payload and error for inspection and replay','To order messages','To compress messages'],a:1,
 e:'Without a DLQ, one bad message blocks a partition indefinitely. The DLQ should preserve headers and error context so the message can be replayed after the bug is fixed.'},

{q:'Why is "at-least-once plus idempotency" usually preferred over strict exactly-once across services?',
 o:['Because it is simpler to implement nothing','Because exactly-once across independent services requires distributed transactions or a shared transactional log; at-least-once with idempotent consumers achieves the same observable effect with far less coupling','Because at-least-once is faster','Because exactly-once is not supported in any broker'],a:1,
 e:'Exactly-once inside Kafka is supported via transactions. Across services and external systems, you emulate the same effect with deduplication and idempotent writes, which is usually the more robust design.'},

{q:'What does a "compacted" topic need to preserve for state stores?',
 o:['All versions of each key','At least the latest value per key, so a state store can rebuild current state from the topic alone','Only deletes','Only headers'],a:1,
 e:'Tombstones (null values with a key) mark deletions. They must be retained long enough for all consumers to see them, otherwise deleted keys can reappear on restore.'},

{q:'What is the risk of a very small retention on a topic feeding a slow consumer?',
 o:['Slower brokers','Messages expire before the consumer can read them, causing permanent data loss and forcing the consumer to skip forward to the earliest available offset','Faster processing','Fewer partitions'],a:1,
 e:'Retention must exceed the worst-case consumer downtime plus processing backlog. Alert on consumer lag relative to retention, not just on lag in absolute terms.'},

{q:'How does a schema registry prevent a producer from breaking consumers?',
 o:['By encrypting records','By rejecting schema changes that violate the subject\'s compatibility rule, so a producer cannot register a breaking change in the first place','By compressing records','By routing records'],a:1,
 e:'The registry is a gatekeeper at build and deploy time. Combined with consumer-side tolerant deserialization, it is the main defence against event-schema breakage.'},

{q:'Why is "consumer-driven" ordering important when partitioning by key?',
 o:['Because consumers sort records','Because the consumer can rely on per-key ordering only if all records for that key go to the same partition and are processed sequentially by one consumer at a time','Because partitions are random','Because brokers reorder records'],a:1,
 e:'A single consumer per partition per group is what preserves order. If the consumer processes records from one partition concurrently, per-key ordering is lost even though Kafka maintained it.'},

/* 35–46: Service mesh & policy */
{q:'What does a service mesh "peer authentication" policy control?',
 o:['Which HTTP methods are allowed','Whether mTLS is required, permissive or disabled between services, and how identities are verified','Which consumers can read a topic','Which users can log in'],a:1,
 e:'Strict peer authentication requires mTLS for all traffic to a workload. Permissive mode allows plaintext and TLS during migration, and should be temporary.'},

{q:'What is an "authorization policy" in Istio?',
 o:['A user-facing login rule','A policy that specifies which service identities may call which paths and methods, enforced by the sidecar proxy','A rate limit','A DNS record'],a:1,
 e:'Policy is enforced at the proxy, so every language gets it for free. It complements, but does not replace, application-level authorisation for resource ownership decisions.'},

{q:'What is a "traffic split" used for in a mesh?',
 o:['Encrypting traffic','Sending a defined percentage of traffic to different service versions, enabling canary and A/B deployments without changing the application','Load-balancing across nodes','Rate limiting'],a:1,
 e:'A traffic split is the mechanism behind progressive delivery. It is usually combined with metrics analysis to promote or roll back automatically.'},

{q:'What is the purpose of a "fault injection" feature in a service mesh?',
 o:['To break production permanently','To deliberately delay or fail a percentage of requests in a controlled way, so you can verify client timeouts, retries and fallbacks','To encrypt traffic','To log errors'],a:1,
 e:'Fault injection lets you test resilience without modifying code. Start in staging with a narrow scope; a misconfigured injection in production is a real incident.'},

{q:'What does a "retry policy" in a mesh typically include?',
 o:['Only a retry count','Retry count, per-try timeout, overall timeout, retriable status codes and backoff, applied by the proxy rather than the application','A cache','A database connection'],a:1,
 e:'Mesh retries are convenient but dangerous without care: they can multiply load and interact with application-level retries. Pick one layer to own retries, not both.'},

{q:'What is an "outlier detection" feature in a mesh?',
 o:['Finding unusual log lines','Ejecting unhealthy endpoints from the load-balancing pool temporarily after consecutive failures, so traffic avoids them','Scanning images','Compressing traffic'],a:1,
 e:'Outlier detection is a per-endpoint circuit breaker. It is especially valuable in large deployments where individual instances can become unhealthy without being removed by health checks.'},

{q:'Why is "DNS" often a weak point in large-scale service discovery?',
 o:['DNS is encrypted','DNS caching, TTLs and resolver behaviour can pin clients to stale addresses, and DNS query load can spike, so many meshes proxy service discovery instead','DNS is deprecated','DNS is not scalable'],a:1,
 e:'A mesh typically intercepts traffic at the sidecar and routes by the current endpoint set, bypassing DNS caching issues for service-to-service traffic.'},

{q:'What does a "gateway" in a mesh differ from an ingress controller?',
 o:['They are the same','An ingress controller handles external-to-cluster traffic; a mesh gateway can also handle ingress/egress for mesh-managed traffic with mesh identity and policy','Ingress controllers are deprecated','Gateways only handle egress'],a:1,
 e:'Many organisations now use the mesh gateway for both north-south and east-west, consolidating policy. The trade-off is coupling external traffic to the mesh\'s operational model.'},

{q:'What is the "sidecar resource overhead" concern?',
 o:['Sidecars are free','Each sidecar consumes CPU and memory per pod and adds a network hop, which matters at high pod density and low per-request latency','Sidecars block TLS','Sidecars reduce observability'],a:1,
 e:'Sidecarless and node-level data planes exist specifically to reduce this overhead. Evaluate the cost per request against the operational benefit before adopting a mesh.'},

{q:'Why is "mTLS everywhere" not sufficient for authorisation?',
 o:['mTLS is deprecated','mTLS proves identity but does not decide what the identity may do; authorisation policy is a separate control','mTLS is unencrypted','mTLS cannot be automated'],a:1,
 e:'Identity and policy are separate concerns. mTLS gives you a trustworthy "who", and authorisation policy decides "what", typically with least privilege per service identity.'},

{q:'What does a "service mesh control plane outage" typically affect?',
 o:['All traffic immediately','Existing data-plane traffic continues with the last configuration; new configuration changes and certificate rotation are temporarily blocked','It deletes all pods','It disables mTLS'],a:1,
 e:'Well-designed control planes are not in the data path. This is why control-plane availability requirements are lower than data-plane requirements, though certificate rotation needs attention.'},

{q:'What does "locality-aware load balancing" optimise?',
 o:['Data compression','Prefers endpoints in the same zone or region to reduce latency and cross-zone data transfer costs, with failover to other zones','Disk usage','Encryption strength'],a:1,
 e:'Cross-AZ traffic has real cost and latency. Locality-aware routing is a common default in managed load balancers, with outlier detection to fall back when local endpoints fail.'},

/* 47–58: Multi-region & data residency */
{q:'What is the difference between active-passive and active-active multi-region?',
 o:['They are identical','Active-passive routes traffic to one region with a warm standby; active-active serves from multiple regions concurrently, requiring conflict resolution and careful data design','Active-passive is faster','Active-active has no data cost'],a:1,
 e:'Active-passive is simpler and often sufficient. Active-active is chosen for latency and regional failover, at the cost of much higher complexity in data consistency and conflict handling.'},

{q:'What makes "active-active with the same keys in both regions" difficult?',
 o:['Disk space','Concurrent writes to the same key in different regions require conflict resolution (last-write-wins loses data, vector clocks are complex) unless each key has a home region','TLS','Brokers'],a:1,
 e:'The usual approach is "regional ownership by key": each key is only written in its home region, and other regions read replicas. Cross-region writes are asynchronous and read-only.'},

{q:'What is a "read replica" strategy in a multi-region read-heavy system?',
 o:['Writing to all regions','Replicating data asynchronously to other regions so reads are served locally, accepting bounded staleness','Disabling replication','Using a single region'],a:1,
 e:'Local reads reduce latency dramatically. The trade-off is staleness: for read-your-writes, the client may need to be routed back to the home region or use a version token.'},

{q:'What does "data residency" require of a multi-region architecture?',
 o:['Only encryption','That data is stored and processed in approved jurisdictions, enforced by region-aware routing, per-region storage and audit of cross-border flows','Only backups','Only TLS'],a:1,
 e:'Data residency is a legal and product requirement, not just a technical one. It forces region-aware partitioning of data and often per-region services, with careful handling of shared metadata.'},

{q:'What is the RPO/RTO pair in disaster recovery?',
 o:['Read/write throughput','Recovery Point Objective (how much data loss is acceptable) and Recovery Time Objective (how long recovery may take), which together determine the required replication and failover strategy','Two test types','Rate limits'],a:1,
 e:'RPO determines replication frequency; RTO determines automation and warm-standby needs. Both must be agreed with the business, because achieving near-zero on both is very expensive.'},

{q:'Why is a "regional failover" often untested until an incident?',
 o:['Because failover is trivial','Because it requires a rehearsal with real traffic and data divergence, and teams are often afraid to break production; this is exactly why scheduled game days are essential','Because it is illegal','Because it is automatic'],a:1,
 e:'Untested failover is often worse than none: it can cause a second incident. Rehearsed, observable and reversible failover is the standard, with clear criteria for when to invoke it.'},

{q:'What does a "global load balancer" typically provide?',
 o:['Disk management','Health-aware traffic distribution across regions, with failover policies, latency-based or geo-based routing and TLS termination at the edge','Database sharding','Container orchestration'],a:1,
 e:'Global LBs are usually the outer layer in multi-region designs. They can shift traffic away from a degraded region, but only if the remaining region has the capacity and the data is consistent enough.'},

{q:'What is "cross-region replication" used for in event-driven systems?',
 o:['Only backup','Replicating topics to another region for disaster recovery or for local reads, typically with tools such as MirrorMaker 2 or a cloud-native replication service','Compressing data','Sharding'],a:1,
 e:'Offset translation is a key issue: consumers in the replica region must be able to resume from a translated offset. MirrorMaker 2 handles this, but conflict handling for writes remains a design choice.'},

{q:'What is "split-brain" in a multi-region system?',
 o:['A damaged disk','Two parts of the system each believing they are authoritative, usually after a partition, and both accepting writes that must later be reconciled or one of which is lost','A backup failure','A DNS problem'],a:1,
 e:'Fencing tokens, quorum requirements and region ownership are the standard defences. Split brain is why "just add a region" is not a simple scaling decision.'},

{q:'What does "regional ownership by key" mean in practice?',
 o:['Any region may write any key','Each key has a designated home region determined by hashing or a mapping, and only that region writes it; other regions read replicated data','Keys are stored globally','Keys are encrypted'],a:1,
 e:'It avoids write conflicts entirely. The trade-off is that a user whose home region is down may be unable to write, so the product must define acceptable behaviour during regional failure.'},

{q:'Why is clock synchronisation especially important in multi-region systems?',
 o:['For logging','Because cross-region latency and clock drift are larger, so ordering, TTL and last-write-wins decisions become more error-prone and require stronger mechanisms','To compress traffic','To reduce cost'],a:1,
 e:'Wide-area networks amplify clock issues. Vector clocks, hybrid logical clocks, or TrueTime-style bounded uncertainty are used precisely to make ordering decisions safe.'},

{q:'What does "data sovereignty" imply for shared services such as identity or billing?',
 o:['Nothing','That even shared services may need per-region data stores or per-region instances, or must store only the minimum metadata necessary cross-border, with clear audit','Only encryption','Only backups'],a:1,
 e:'Shared services are often the hardest part of residency compliance. The usual design is a global control plane with regional data planes that store the regulated data locally.'},

/* 59–70: Multi-tenancy */
{q:'What are the main multi-tenancy models?',
 o:['Only separate deployments','Shared everything with tenant ids, schema-per-tenant, database-per-tenant, and full deployment-per-tenant, each trading isolation against cost','Only encryption','Only sharding'],a:1,
 e:'The choice drives cost, isolation, blast radius and operational complexity. Most SaaS platforms start with shared data and tenant ids, then move the largest tenants to dedicated resources.'},

{q:'What is a "noisy neighbour" problem in multi-tenant systems?',
 o:['A slow network','One tenant consuming disproportionate CPU, memory, connections or broker throughput, degrading performance for other tenants','A security bug','A DNS issue'],a:1,
 e:'Mitigations include per-tenant quotas, rate limits, bulkheads, and dedicated infrastructure for the largest tenants. Observability per tenant is essential to detect the pattern early.'},

{q:'What is a "tenant context" and why must it be propagated?',
 o:['A UI theme','An identifier carried through requests and messages so every service applies the correct data scoping, quotas and authorisation for that tenant','A database schema','A container'],a:1,
 e:'Missing tenant context is a serious security bug: it can leak data across tenants. Propagation through HTTP headers and message attributes, with enforcement in each service, is essential.'},

{q:'Why is per-tenant rate limiting valuable beyond fairness?',
 o:['It is cheaper','It bounds the impact of a buggy or abusive client to that tenant, protecting the shared infrastructure from a single source of overload','It speeds up all tenants','It removes the need for quotas'],a:1,
 e:'Rate limiting is a form of blast-radius control. It is especially important when tenants are on shared infrastructure, where one runaway client can affect everyone.'},

{q:'What does "row-level security" provide in multi-tenant databases?',
 o:['Encryption at rest','Database-enforced filtering by tenant id, adding a defence in depth behind application code so a missing filter cannot leak data','Schema versioning','Connection pooling'],a:1,
 e:'Application bugs are the most common cause of cross-tenant leaks. RLS makes the database refuse to return rows the current tenant cannot see, independent of application logic.'},

{q:'When should you move a tenant to a dedicated database?',
 o:['Always, from day one','When isolation, performance, compliance or per-tenant backup and restore requirements make sharing unacceptable; the decision is usually driven by the largest or most regulated tenants','Never','Only for free-tier tenants'],a:1,
 e:'Dedicated resources dramatically simplify compliance and troubleshooting but multiply operational cost. A hybrid model, shared by default with dedicated for premium tenants, is common.'},

{q:'What is "tenant-aware" observability?',
 o:['Logging more','Including the tenant id in metrics, logs and traces so you can attribute latency, errors and cost to specific tenants and diagnose problems quickly','Encrypting logs','Compressing logs'],a:1,
 e:'Without tenant attribution, a noisy-neighbour issue is invisible until a support ticket arrives. Keep the tenant label bounded and controlled, and use trace attributes for high-cardinality detail.'},

{q:'What does "fair scheduling" mean in a multi-tenant system?',
 o:['Round-robin only','Allocating shared resources so no tenant starves others, for example weighted fair queuing where larger tenants get a bigger share without monopolising','Random scheduling','First-come-first-served'],a:1,
 e:'Fair queuing is well-suited to shared workers and message consumers. Weighted shares let premium tenants get more capacity without letting anyone block the queue.'},

{q:'What is a "per-tenant schema migration" challenge?',
 o:['Migrations are simple','Thousands of tenants may be in different states, so schema changes must be backward compatible and deployed in phases (expand, migrate, contract) and applied reliably to all tenants','Migrations are not needed','Migrations are automatic'],a:1,
 e:'Expand-and-contract is the standard approach. Automation, idempotent migrations and rollback plans are essential when a failed migration affects many tenants at once.'},

{q:'Why is "tenant isolation" not equivalent to "dedicated infrastructure"?',
 o:['They are the same','Logical isolation can be strong when enforced correctly, and dedicated infrastructure can still leak if the application forgets to scope queries, so isolation is a property of the whole system','Dedicated is always stronger','Isolation is not needed'],a:1,
 e:'Both are valid, but only when the application and database enforce scoping. A missing WHERE clause leaks data even on dedicated infrastructure; defence in depth matters in both models.'},

{q:'What is "tenant onboarding" often a bottleneck for?',
 o:['Marketing','The provisioning of isolated resources, credentials, quotas and configuration for a new tenant, which must be automated to scale','Compression','TLS'],a:1,
 e:'Manual onboarding caps growth and introduces configuration drift. Self-service, automated provisioning with templates and policy is the standard response as tenant count grows.'},

{q:'What is "per-tenant cost attribution" used for?',
 o:['Billing only','Attributing infrastructure and third-party costs to tenants, so you can price correctly, identify unprofitable tenants and drive optimisation','Encryption','Rate limiting'],a:1,
 e:'Without attribution, a small number of tenants can be silently expensive. Tagging resources and metrics by tenant, and modelling shared costs, is essential for healthy unit economics.'},

/* 71–82: Platform engineering & developer experience */
{q:'What is "platform engineering"?',
 o:['Building applications','Building and operating the self-service platform, tooling and golden paths that product teams use to deliver and run services safely','Writing tests','Managing databases'],a:1,
 e:'A platform team treats internal developers as customers. Good platforms reduce cognitive load and make the compliant way the easy way, rather than acting as a gatekeeper.'},

{q:'What is a "golden path" in platform engineering?',
 o:['The fastest network route','An opinionated, well-supported way to build, deploy and operate a service, with sensible defaults for observability, security and CI/CD','A CI tool','A deployment strategy'],a:1,
 e:'Golden paths reduce decision fatigue and drift. Teams can deviate, but the default path should be the one that needs the least work and yields the best operational outcome.'},

{q:'What does a "service template" typically include?',
 o:['Only a README','Scaffolding for code, CI pipeline, Dockerfile, Kubernetes manifests, observability wiring, security defaults and a runbook stub','Only a CI file','Only a Dockerfile'],a:1,
 e:'A template encodes platform best practices so every new service starts compliant. It should be maintained, versioned and easy to update across existing services.'},

{q:'What is the primary goal of an internal developer portal such as Backstage?',
 o:['A marketing website','To provide a single place to discover services, owners, docs, APIs, templates and operational info, reducing time to find context','A CI server','A registry'],a:1,
 e:'Discovery is a huge cost in large organisations. A portal with a service catalogue and templates makes onboarding and incident response significantly faster.'},

{q:'Why is "self-service" central to a good platform?',
 o:['Because developers are lazy','Because waiting on another team for environments, credentials or pipelines is a bottleneck; self-service with guardrails scales delivery without gatekeeping','Because it is cheaper','Because it removes security'],a:1,
 e:'Guardrails replace approvals: templates, policy as code and automated checks let teams move fast without breaking security or reliability standards.'},

{q:'What is "paved road" versus "mandatory platform"?',
 o:['They are identical','A paved road is the default, best-supported path with escape hatches; a mandatory platform forbids deviation, which can stifle teams whose needs genuinely differ','Paved roads are deprecated','Mandatory platforms are illegal'],a:1,
 e:'Paved roads encourage adoption through quality; mandatory platforms rely on authority. Most successful platforms combine a strong default with an explicit, reviewed exception process.'},

{q:'What is "cognitive load" and why does it matter for microservices?',
 o:['CPU usage','The amount of mental effort required to work on a service, including tooling, runbooks, dependencies and on-call; too many services per team multiplies it','Memory usage','Network usage'],a:1,
 e:'High cognitive load causes incidents and slows delivery. Team topology, service count, platform quality and documentation all directly affect it.'},

{q:'What does "you build it, you run it" imply for a team?',
 o:['Only coding','The team owns its service through production, including on-call, incident response and reliability improvements','Only deployments','Only monitoring'],a:1,
 e:'Ownership closes the feedback loop. It only works sustainably with platform investment, reasonable on-call load and the authority to prioritise reliability work.'},

{q:'What is the value of a "developer experience" metric?',
 o:['It measures code quality','It measures how quickly and safely developers can go from idea to production, including build times, review latency, deployment frequency and failure recovery','It measures marketing','It measures cost'],a:1,
 e:'DX metrics connect platform work to business outcomes. DORA metrics — lead time, deployment frequency, change failure rate and MTTR — are the common baseline.'},

{q:'What does "shift-right" complement "shift-left" with?',
 o:['Testing only in production','Production experimentation, canary analysis, observability and chaos testing, so real-world behaviour informs quality rather than relying on pre-production checks alone','Disabling tests','Slower deployment'],a:1,
 e:'Shift-left catches issues before release; shift-right catches what pre-production cannot model. Both are needed because distributed systems fail in ways that are hard to predict.'},

{q:'What is "documentation as code"?',
 o:['Writing docs in Word','Keeping documentation in the same repository and review workflow as code, versioned with the service so it does not drift','Publishing PDFs','Writing docs only after incidents'],a:1,
 e:'Docs near the code are more likely to be updated. Architecture decision records, runbooks and READMEs in the repo are the common pattern.'},

{q:'What does "inner source" mean in a microservices organisation?',
 o:['Open-sourcing everything','Applying open-source practices internally, such as shared repositories, code review across teams and contribution guidelines for common libraries','Outsourcing','Closed-source policies'],a:1,
 e:'Inner source reduces duplication of infrastructure libraries and improves quality through review. It is especially valuable for platform components used by many teams.'},

/* 83–92: Cost, performance, capacity */
{q:'What does "cost per request" measure, and why does it matter?',
 o:['The price of a load balancer','The infrastructure and third-party cost attributable to one request, which makes performance regressions and inefficiencies visible in business terms','Only server cost','Only storage cost'],a:1,
 e:'Cost per request is a unit-economics metric. Combined with latency and error rate, it turns a performance regression into a visible, prioritised problem.'},

{q:'Why is "rightsizing" of containers important?',
 o:['It looks tidy','Over-requested CPU and memory waste capacity and money, while under-requested resources cause throttling and OOM kills, so requests should match measured usage with headroom','It is required by Kubernetes','It speeds up builds'],a:1,
 e:'Rightsizing needs real usage data. Vertical Pod Autoscaler in recommendation mode, and per-service dashboards, are common ways to discover how far off the current values are.'},

{q:'What is the trade-off with a very short retention on logs?',
 o:['It breaks encryption','It saves cost but removes the historical context needed to investigate incidents discovered late or to satisfy compliance; tiered storage and sampling often balance the two','It speeds up the application','It removes metrics'],a:1,
 e:'Incidents are often noticed hours or days after they begin. Retention policy must consider investigation windows and audit obligations, not just storage cost.'},

{q:'What is "idle capacity" in a cluster and why does it matter?',
 o:['Reserved memory','Capacity allocated but not used, which is paid for without producing value; autoscaling and rightsizing reduce it at the cost of responsiveness to spikes','Unused disk','A monitoring gap'],a:1,
 e:'Some headroom is essential for failover and burst. The goal is purposeful headroom, not accidental waste, and autoscaling needs to be fast enough to make the trade-off acceptable.'},

{q:'What is a "cost allocation tag" used for?',
 o:['Compressing data','Attributing cloud spend to teams, services or tenants, which is required to make cost-conscious decisions and charge back internally','Encrypting data','Load balancing'],a:1,
 e:'Without tagging, cost data is unusable at service granularity. Enforcing tags through templates and policy as code prevents untagged resources from accumulating.'},

{q:'What is "caching" typically used for in a microservices architecture?',
 o:['Compressing data','Reducing latency and load on backend dependencies by serving repeated reads from a local or shared cache, at the cost of staleness and cache invalidation complexity','Encrypting traffic','Load balancing'],a:1,
 e:'Caching is a strong performance lever but introduces staleness. Eviction strategy, TTL, and the consequences of stale data must be designed for each use case.'},

{q:'What is the "cache stampede" problem?',
 o:['A cache with too much data','Many clients miss the same key simultaneously and all query the backend, causing a load spike; mitigations include request coalescing, locks and jittered TTLs','A cache with no data','A DDoS attack'],a:1,
 e:'Cache stampedes are common during cold start and after mass eviction. Coalescing and staggered expiry are the standard protections.'},

{q:'Why is "hot key" handling important in distributed caches?',
 o:['Hot keys are cheap','A single very hot key can overload the node holding it; mitigations include key splitting, local caching on clients and read replicas','Hot keys are not an issue','Hot keys compress well'],a:1,
 e:'Hot keys are especially visible during flash sales or breaking news. Designing for them requires both client-side caching and partitioning strategies.'},

{q:'What does the "utilisation curve" tell you about a service near capacity?',
 o:['Latency is linear','Latency grows non-linearly as utilisation approaches 100%, so small traffic increases cause large latency increases and timeouts','Utilisation does not matter','Capacity is unlimited'],a:1,
 e:'The queueing effect is why meaningful headroom and load shedding matter. Setting an SLO at high utilisation is fragile, because the margin for error is tiny.'},

{q:'What is the difference between vertical and horizontal scaling?',
 o:['They are identical','Vertical scales by making a single instance bigger; horizontal scales by adding more instances, which requires statelessness and distributed coordination for state','Vertical is always better','Horizontal is always cheaper'],a:1,
 e:'Horizontal scaling is the default for services but requires stateless design and shared state in backing services. Vertical scaling has a hard limit and a bigger blast radius on failure.'},

/* 93–100: SRE and operational governance */
{q:'What does "toil" mean in SRE terms?',
 o:['Hard engineering work','Repetitive, manual, automatable work that scales linearly with system size and provides no lasting value','Documentation','Incident response'],a:1,
 e:'SRE treats toil as a budget to minimise. With microservices, manual per-service tasks quickly become unsustainable without automation.'},

{q:'What is the purpose of an "operational readiness review" before launch?',
 o:['A marketing checklist','A structured review of observability, alerting, runbooks, capacity, SLOs, security and rollback, to ensure a service can be operated safely in production','A code review','A design document'],a:1,
 e:'Readiness reviews catch operational gaps before users are affected. They are most valuable when they are routine, lightweight and enforced by the platform rather than a one-off gate.'},

{q:'What is "change failure rate"?',
 o:['The number of deployments','The percentage of deployments that cause a degradation requiring remediation such as rollback, hotfix or incident','The time between deployments','The number of pull requests'],a:1,
 e:'It is one of the four DORA metrics. It complements deployment frequency: high frequency with low failure rate is the healthy combination.'},

{q:'What does "lead time for changes" measure?',
 o:['Time spent coding','The time from a change being committed to it running in production, capturing the whole pipeline including review, build, test and deploy','Time spent in review only','Time to write tests'],a:1,
 e:'Lead time exposes bottlenecks in the delivery process. Long lead times usually point at review queues, slow pipelines or manual approvals.'},

{q:'What is "mean time to detect" and why does it matter more than MTTR in some cases?',
 o:['They are the same','How long until an incident is noticed; if detection is slow, recovery cannot start, so improving detection is often the cheapest way to reduce total outage time','It measures CPU','It measures deployments'],a:1,
 e:'A fast MTTR is useless if detection takes an hour. SLO burn-rate alerts and synthetic monitoring directly reduce MTTD.'},

{q:'What is "error budget policy"?',
 o:['A tool','A pre-agreed rule describing what happens when the error budget is exhausted or burning too fast, such as pausing feature releases in favour of reliability work','A backup policy','A cost policy'],a:1,
 e:'A written policy makes reliability trade-offs predictable. Without it, these discussions become ad hoc and political during an incident or a deadline.'},

{q:'What is the value of "postmortem action items" being tracked like product work?',
 o:['They look organised','Because untracked action items are rarely completed, and recurring incidents usually trace back to unfinished follow-ups from earlier postmortems','They satisfy auditors','They reduce documentation'],a:1,
 e:'Without an owner and a ticket, action items are wishes. Treating them as part of the team\'s actual backlog is the single biggest predictor of whether postmortems reduce future incidents.'},

{q:'What is "capacity headroom" and why is it needed beyond normal peak?',
 o:['Extra cost','Capacity reserved to absorb failures, deployments and unexpected bursts, such as losing a region or an availability zone, so the remaining capacity can still serve traffic','A monitoring gap','A cache'],a:1,
 e:'Headroom must be sized for the worst realistic failure, not just for the average peak. This is why multi-AZ or multi-region designs need to consider the capacity of the surviving zone or region.'},

{q:'What is "production readiness" for a new service in a mature platform?',
 o:['It runs','A checklist of observability, alerts, SLOs, runbooks, ownership, security posture, rollback and capacity that is met before or immediately after launch','It compiles','It is deployed'],a:1,
 e:'Readiness is continuous, not a one-time gate. The most reliable organisations automate the checks so they apply to every service continuously, not just at launch.'},

{q:'What is the strongest signal that a microservices adoption is going well?',
 o:['The number of services','Teams can deploy independently, incidents are caught quickly and fixed, and the platform makes the safe path the easy path','The number of repositories','The number of languages used'],a:1,
 e:'Service count is an output, not an outcome. Deployment independence, incident response quality and developer experience are the metrics that reflect whether the architecture is delivering value.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Microservices Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
