<!DOCTYPE html>
<html lang="en">
<head>

<title>Microservices Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 all-new Microservices MCQs: saga, sidecar, ambassador, CQRS projections, idempotent consumer, rate limiting, load shedding, Kafka, gRPC streaming, service mesh, OAuth2/JWT, OpenTelemetry, SLOs.">
<style>
  :root{--brand:#b45309;--brand-dark:#7c2d12;--accent:#f59e0b;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#450a0a;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#fef3c7;border-color:#fde68a}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(180,83,9,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#fffbeb}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#fef3c7}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🧩 Microservices Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Saga deep dive */
{q:'In an orchestrated saga, what happens when a step fails?',
 o:['The whole database rolls back automatically','The orchestrator invokes compensating transactions for the completed steps in reverse order','The saga is restarted from the beginning','Nothing — failure is ignored'],a:1,
 e:'The orchestrator persists which steps succeeded, then triggers the corresponding compensations. Compensations must be idempotent because the orchestrator may retry them after a crash.'},

{q:'What is the pivot transaction in a saga?',
 o:['The first step of the saga','The step after which the saga cannot be rolled back and must run to completion or be compensated only by forward recovery','The compensation of the first step','The database transaction used by the coordinator'],a:1,
 e:'Sagas are often designed with retriable steps before the pivot and non-retriable steps after it. The pivot is the point of no return that determines recovery strategy.'},

{q:'What is a "semantic lock" in saga design?',
 o:['A database row lock','An application-level marker that reserves a resource (such as pending inventory) so no other saga can take it while this saga is in flight','An in-memory mutex','A JWT claim'],a:1,
 e:'Semantic locks compensate for missing distributed transactions. They must expire or be released by a compensating action, otherwise the resource is deadlocked forever.'},

{q:'Why must saga compensations be idempotent?',
 o:['They run only once','The coordinator may retry them after a crash or timeout, so a repeated compensation must not double-refund or double-release','Idempotency makes them faster','Because message brokers require it'],a:1,
 e:'Idempotent compensations are the only safe design under at-least-once retry. Store the compensation outcome keyed by saga id and step so a duplicate call is a no-op.'},

{q:'What is the main trade-off of choosing orchestration over choreography for a saga?',
 o:['Orchestration is always slower','Orchestration centralises state and visibility but adds a component that must be highly available and becomes a coupling point','Choreography cannot handle failures','Orchestration cannot compensate'],a:1,
 e:'Orchestration is easier to reason about, test and observe. Choreography is more decoupled but the flow becomes implicit across many services and is much harder to trace.'},

{q:'Which Kafka feature makes consume-transform-produce atomic?',
 o:['Consumer groups','Transactions (initTransactions, sendOffsetsToTransaction, commitTransaction)','Auto-commit','Log compaction'],a:1,
 e:'Kafka transactions write the produced records and the consumed offsets atomically, which is the foundation of exactly-once processing inside Kafka. They do not cover external systems.'},

{q:'A saga step times out but actually succeeded on the server. What should the saga do?',
 o:['Compensate immediately','Retry the step so the operation is checked idempotently, then decide based on the result','Abandon the saga','Ignore the timeout'],a:1,
 e:'A timeout is ambiguous: the call may or may not have happened. Retrying an idempotent step resolves the ambiguity. Compensating on a timeout can undo work that actually succeeded.'},

{q:'What is the difference between a compensating action and a rollback?',
 o:['They are identical','A rollback reverses uncommitted work inside a database transaction; a compensation is a new business action that counteracts an already-committed effect','Compensation is faster','Rollback works across services'],a:1,
 e:'Sagas cannot roll back, because each step commits independently. Refunding a payment is a new transaction that counteracts the original; the original payment record still exists.'},

{q:'Which failure mode is unique to choreographed sagas?',
 o:['Network latency','Cyclic event dependencies: a service reacting to an event in a loop and re-triggering the flow','Compensations','Timeouts'],a:1,
 e:'Without a central state machine, it is easy to create event loops or duplicate reactions. Idempotent handlers, event ids and a clear ownership map mitigate the risk.'},

{q:'How does the "saga log" typically differ from an application log?',
 o:['It is human-readable','It is a durable state store of saga steps and outcomes that the coordinator reads and writes as part of the business transaction','It is only used for metrics','It lives in the message broker'],a:1,
 e:'The saga log is business state, not diagnostic output. It is often a table in the coordinator\'s database or a compacted Kafka topic keyed by saga id.'},

/* 11–22: Structural patterns */
{q:'What does the sidecar pattern provide?',
 o:['A database replica','A helper process deployed alongside the main container, sharing its lifecycle and often its network, for cross-cutting concerns','A second service','A deployment strategy'],a:1,
 e:'Sidecars add capabilities without changing the application: a service mesh proxy, a log shipper, a TLS bootstrap agent. The cost is extra resource use per instance.'},

{q:'How does the ambassador pattern differ from the sidecar pattern?',
 o:['Ambassador is the same as sidecar','Ambassador is a sidecar that specifically proxies outgoing traffic on behalf of the application, hiding connection management, retries and routing','Ambassador runs on a different node','Ambassador is a gateway'],a:1,
 e:'Both are helper containers. A sidecar is generic; an ambassador is a specialised proxy for outbound calls, common for legacy services that cannot be modified.'},

{q:'What does the adapter pattern do in microservices?',
 o:['Adapts the database schema','Wraps a service with a different interface so legacy or heterogeneous services can conform to a uniform contract','Converts JSON to XML only','Balances load'],a:1,
 e:'Adapters let a client-facing layer stay consistent while the internal implementation varies. They are common when integrating a new service with a legacy monolith.'},

{q:'What is the backend-for-frontend (BFF) pattern\'s main purpose?',
 o:['To replace API gateways','To provide a purpose-built API for each client type (web, mobile, IoT), optimising payload shape and number of round trips','To share authentication','To store sessions'],a:1,
 e:'A BFF is owned by the client team and can evolve independently. It typically aggregates and reshapes data from many backend services for its specific client.'},

{q:'What problem does the API composition pattern solve?',
 o:['Compressing payloads','Aggregating responses from multiple services into one client response, avoiding many round trips from the client','Consistency between databases','Service discovery'],a:1,
 e:'Often implemented in a BFF or gateway. It is simple but risks becoming a chatty aggregation layer that scales poorly when many downstream calls are slow.'},

{q:'What is the difference between an API gateway and an aggregator service?',
 o:['They are identical','A gateway fronts the system and handles cross-cutting concerns; an aggregator combines calls to several services and may contain business logic','Aggregators cannot use HTTP','Gateways are only for WebSockets'],a:1,
 e:'Aggregation in a gateway is convenient for simple cases but eventually grows into business logic that should live in a dedicated service with its own tests and ownership.'},

{q:'What does the "strangler fig" façade typically do?',
 o:['Replace the database','Route traffic between the legacy system and new services, so functionality can migrate incrementally while the old system is still serving','Encrypt internal traffic','Host static assets'],a:1,
 e:'The façade is often an API gateway or a reverse proxy with feature flags. Routing rules move from legacy to new one capability at a time, with rollback available at each step.'},

{q:'What is the difference between a shared database and a database per service?',
 o:['They are the same','A shared database couples services at the schema level; database per service gives each service independent evolution and ownership of its data','Database per service is slower by definition','Shared database is required for transactions'],a:1,
 e:'Database per service is the more scalable, decoupled option, at the cost of managing consistency across services through events, sagas and API composition.'},

{q:'Which pattern addresses consistent reads across service-owned databases?',
 o:['Two-phase commit','Materialised view / read-model projection, built from events, that a client queries directly','Shared database','Database sharding'],a:1,
 e:'A projection is a read-optimised denormalised store kept up to date by consuming events. It gives fast, consistent-enough reads without synchronous fan-out at query time.'},

{q:'What is the "log aggregation" pattern and why is it needed?',
 o:['Aggregating business metrics','Collecting logs from all instances into a central searchable store so operators can debug across distributed services','Aggregating database rows','Aggregating API responses'],a:1,
 e:'Per-instance logs are useless at scale because instances are ephemeral. A central log pipeline with correlation ids and retention is a baseline operational requirement.'},

{q:'Which is NOT a common use of the sidecar pattern?',
 o:['Service mesh proxy','Log and metrics shipper','TLS certificate rotation agent','Primary database storage'],a:3,
 e:'Sidecars handle cross-cutting runtime concerns. Persistent state belongs in managed backing services, not in a sidecar container\'s local filesystem.'},

{q:'What is the "bulkhead" pattern named after?',
 o:['A monitoring dashboard','A ship\'s watertight compartments: isolating resources so a failure in one does not flood the others','A message broker','A deployment pipeline'],a:1,
 e:'In microservices, bulkheads usually mean separate thread pools, connection pools or even separate clusters per dependency or tenant, so one overloaded path cannot starve the rest.'},

/* 23–34: Resilience & traffic management */
{q:'What does a rate limiter protect against?',
 o:['Slow DNS resolution','A single client or caller consuming more than its fair share of capacity, and protecting a downstream from bursts it cannot handle','TLS handshake failures','Disk failures'],a:1,
 e:'Rate limiting is usually enforced per token, per user or per IP at the edge, returning 429 with a Retry-After header. Without it, one noisy tenant can starve everyone else.'},

{q:'What does load shedding mean?',
 o:['Scaling up horizontally','Deliberately rejecting some requests under overload so the system can continue to serve the rest within its capacity','Removing unhealthy instances','Reducing data retention'],a:1,
 e:'When demand exceeds capacity, serving everything slowly is worse than serving most requests quickly. Load shedding requires knowing which requests are droppable, such as low-priority traffic.'},

{q:'What does the "hedged request" technique do?',
 o:['Encrypts a request','Sends a duplicate request to another replica after a delay, and uses whichever response arrives first, reducing tail latency','Retries with the same instance','Batches multiple requests'],a:1,
 e:'Hedging improves p99 latency at the cost of extra load. It works best when the slow tail comes from a small number of stragglers rather than global overload.'},

{q:'What is a token bucket rate limiter?',
 o:['A fixed number of requests per day','A bucket that refills at a steady rate, allowing short bursts up to the bucket size while enforcing an average rate','A queue that never drops requests','A circuit breaker'],a:1,
 e:'Token bucket supports bursts, unlike a fixed window. Leaky bucket smooths output. Sliding window counters give more accurate long-term rates at the cost of more state.'},

{q:'Why is a per-tenant quota better than a single global rate limit?',
 o:['It is simpler','It isolates tenants so one abusive or buggy tenant cannot consume the whole capacity and degrade everyone else','It is faster to compute','It avoids TLS'],a:1,
 e:'Global limits let a single client starve the system. Per-tenant quotas with separate limits per tier (free, paid, enterprise) is the standard SaaS approach.'},

{q:'What is the "circuit breaker half-open" state for?',
 o:['Handling no traffic','Allowing a limited number of trial calls to test whether the dependency has recovered, before closing the circuit again','Compensating failures','Rerouting traffic'],a:1,
 e:'Half-open probes recovery without flooding a still-failing dependency. If the trial calls succeed, the breaker closes; if they fail, it reopens for another cooldown period.'},

{q:'Why is a synchronous retry often less safe than an asynchronous retry?',
 o:['Async is always faster','Synchronous retries multiply load on a struggling dependency within the caller\'s request, while an async queue decouples retries and lets the dependency recover','Sync retries lose messages','Async retries are not idempotent'],a:1,
 e:'In-line retries amplify load and lengthen response time. Moving retries to a queue with backoff and dead-lettering gives the dependency breathing room and makes retry behaviour observable.'},

{q:'What is a "backpressure" mechanism?',
 o:['A load balancer feature','A signal from a downstream system that it cannot keep up, letting the upstream slow down or buffer instead of overwhelming it','An encryption protocol','A caching strategy'],a:1,
 e:'Reactive streams, bounded queues and TCP flow control are backpressure mechanisms. Without them, buffers grow until memory is exhausted and the whole service fails.'},

{q:'How does a bulkhead usually differ from a circuit breaker?',
 o:['They are identical','A bulkhead limits how much capacity a dependency can consume; a circuit breaker stops calls entirely when the dependency is failing','Bulkheads apply only to databases','Circuit breakers apply only to HTTP'],a:1,
 e:'Bulkheads are about resource isolation and containment, circuit breakers about fast failure. They are complementary and usually deployed together per dependency.'},

{q:'What is a graceful shutdown in a microservice context?',
 o:['Killing the process abruptly','Stopping acceptance of new requests, finishing in-flight work, then exiting within the orchestrator\'s grace period','Restarting immediately','Scaling to zero'],a:1,
 e:'Kubernetes sends SIGTERM and waits terminationGracePeriodSeconds. Services should remove themselves from discovery, drain in-flight requests, close connections and then exit 0.'},

{q:'Why should a readiness probe fail during graceful shutdown?',
 o:['To speed up restart','To remove the instance from load balancing before it stops serving, so no client is routed to a shutting-down instance','To trigger a rollback','To clear the cache'],a:1,
 e:'The orchestrator stops sending traffic once readiness fails, but keeps the process alive during the grace period. This eliminates the classic 502s during rolling updates.'},

{q:'What is the "bulkhead + retry + timeout + circuit breaker" set often called?',
 o:['The microservices checklist','The resilience toolbox: complementary mechanisms that together prevent cascading failures','The CAP theorem','The twelve-factor app'],a:1,
 e:'These patterns are usually applied together per dependency: a timeout bounds latency, a retry handles transient errors with backoff, a circuit breaker prevents retry storms, and a bulkhead isolates resource usage.'},

/* 35–46: Messaging & Kafka */
{q:'What does a Kafka consumer group guarantee for a partition?',
 o:['A partition can be read by many consumers in the same group simultaneously','A partition is assigned to only one consumer in the group at a time, preserving per-partition ordering','Consumers in a group share offsets','Consumers cannot scale'],a:1,
 e:'A partition is owned by exactly one consumer per group. This is how Kafka preserves ordering per partition while distributing partitions across consumers for parallelism.'},

{q:'Why is the key important for a Kafka producer?',
 o:['It compresses the record','It determines the partition: records with the same key go to the same partition, preserving order per key','It sets retention','It enables transactions'],a:1,
 e:'All records for a key land in one partition and are therefore ordered. A poor key choice creates hot partitions; a null key distributes round-robin at the cost of ordering.'},

{q:'What does idempotent producer mode (enable.idempotence=true) prevent?',
 o:['Duplicate messages from consumer retries','Duplicate records caused by producer retries, by assigning a producer id and sequence number per partition','Message loss','Rebalances'],a:1,
 e:'The broker deduplicates within the producer session using sequence numbers. Combined with transactions it gives exactly-once semantics inside Kafka.'},

{q:'What is consumer lag?',
 o:['The time a consumer waits for a fetch','The difference between the latest offset in a partition and the consumer group\'s committed offset, showing how far behind it is','The number of partitions','The size of the batch'],a:1,
 e:'Lag growing steadily means consumers cannot keep up. It is one of the most important operational metrics for any Kafka-based pipeline.'},

{q:'What does "at-least-once" mean for a Kafka consumer?',
 o:['Every message is delivered exactly once','Every message is delivered, but some may be delivered more than once if the consumer fails before committing an offset','Messages may be lost','Messages are deduplicated by the broker'],a:1,
 e:'Consumers must be idempotent to make at-least-once safe. Committing after processing instead of before, and deduplicating on a business key, are standard techniques.'},

{q:'What is the purpose of a compacted Kafka topic?',
 o:['Compress records on disk','Retain only the latest record for each key, making the topic a changelog of current state','Store only the last day','Improve ordering'],a:1,
 e:'Compacted topics are used for state changelogs and configuration. Restoring a Kafka Streams state store, for example, reads the compacted changelog and replays only the latest value per key.'},

{q:'Why might a service use a message broker instead of direct HTTP for events?',
 o:['To reduce broker cost','To decouple in time and load, buffer bursts, replay for new consumers, and support multiple subscribers without the producer knowing them','To avoid schemas','To enforce synchronous contracts'],a:1,
 e:'Brokers provide durability, replay and fan-out that point-to-point HTTP cannot. The cost is eventual consistency, ordering caveats and additional operational complexity.'},

{q:'What does a schema registry enforce?',
 o:['Message ordering','Compatibility rules (backward, forward, full) for event schemas, rejecting producer changes that would break consumers','Broker authentication','Partition assignment'],a:1,
 e:'Producers register a schema and receive an id; consumers fetch by id. Compatibility enforcement at registration time is the main protection against breaking event contracts.'},

{q:'What is the outbox table usually keyed on?',
 o:['The consumer group','The aggregate id plus a sequence, or a generated event id, so the relay can publish in order and consumers can deduplicate','The broker partition','The user session'],a:1,
 e:'A deterministic event id lets consumers deduplicate. Ordering per aggregate is usually preserved by ordering the relay\'s reads by id or sequence.'},

{q:'What is the "transactional outbox" pattern\'s main benefit over publishing directly?',
 o:['It is faster','It guarantees that a committed business change eventually results in exactly one published event, eliminating the dual-write gap','It removes the need for a broker','It guarantees exactly-once delivery'],a:1,
 e:'The relay may publish duplicates, so the guarantee is at-least-once plus deduplication, not exactly-once. The important property is that no committed change is silently lost.'},

{q:'What is a poison message, and how is it usually handled?',
 o:['A message with a virus','A message that repeatedly fails processing because of a bug or bad data; it is retried a bounded number of times, then routed to a dead-letter topic','A message with a large payload','A message without a key'],a:1,
 e:'Without a DLQ, a poison message blocks the partition indefinitely. The DLQ preserves the payload and error context so it can be inspected, fixed and replayed.'},

{q:'What does a dead-letter topic preserve that simple logging often loses?',
 o:['The original headers, payload and error metadata, so the message can be replayed after a fix','Consumer group offsets','Broker metrics','Schema history'],a:1,
 e:'Headers and the original payload are essential for replay. Including the exception and the attempt count helps diagnose whether the failure was transient or systematic.'},

{q:'Why is ordering guaranteed only within a partition, not across the topic?',
 o:['Because partitions are physically on different brokers and consumed independently','Because Kafka does not support ordering','Because producers are asynchronous','Because consumers reorder records'],a:0,
 e:'Ordering is a per-partition property. Applications that need global ordering must either use one partition or encode ordering in the application using sequence numbers and buffers.'},

/* 47–58: gRPC & service mesh */
{q:'What are gRPC\'s four method types?',
 o:['GET, POST, PUT, DELETE','Unary, server-streaming, client-streaming and bidirectional streaming','Call, callback, event, query','Sync, async, batch, queue'],a:1,
 e:'Unary is a single request and response; the streaming variants push sequences of messages in one or both directions over the same HTTP/2 connection.'},

{q:'Why is HTTP/2 important for gRPC?',
 o:['It supports only GET','It provides multiplexed streams over one connection, header compression and flow control, which streaming RPCs rely on','It provides encryption','It replaces TLS'],a:1,
 e:'Multiplexing removes the need for connection pools per call, and flow control gives backpressure. gRPC requires HTTP/2; it cannot use HTTP/1.1 semantics for streaming.'},

{q:'What does gRPC metadata allow a client to send?',
 o:['Only the request body','Key-value headers alongside a call, such as an authorization token or a trace context','SQL queries','Binary attachments only'],a:1,
 e:'Metadata is the gRPC analogue of HTTP headers and is the standard transport for auth tokens, deadlines and trace propagation across services.'},

{q:'What is a gRPC deadline, and why is it important?',
 o:['A time-to-live on the TCP connection','A time bound on the whole RPC that propagates to the server and downstream calls, preventing requests from hanging indefinitely','A schema version','A retry counter'],a:1,
 e:'Deadlines are propagated as a header, so a slow top-level request automatically cancels work downstream. Without deadlines, a single slow call can exhaust a thread pool.'},

{q:'In a service mesh, what does the data plane do?',
 o:['Configure policies','Handle actual request traffic through sidecar or node proxies, including load balancing, retries and TLS','Store configuration','Run the control plane API'],a:1,
 e:'The data plane is the proxy fleet that touches each packet. The control plane pushes configuration and policy to the data plane but does not carry application traffic.'},

{q:'What is the role of a service mesh control plane such as Istiod?',
 o:['It proxies requests','It distributes configuration, certificates and policy to the sidecars and aggregates telemetry','It stores the application data','It replaces Kubernetes'],a:1,
 e:'The control plane is the brain: it watches Kubernetes and mesh CRDs and pushes configuration to every proxy. If it is briefly unavailable, the data plane keeps working with the last configuration.'},

{q:'What is an egress gateway in a service mesh used for?',
 o:['Routing traffic from external clients into the mesh','Routing traffic leaving the mesh to external systems, so egress policy, TLS origination and audit can be centralised','Load-balancing internal calls','Storing certificates'],a:1,
 e:'An egress gateway prevents arbitrary outbound traffic from sidecars and gives a single point to enforce external access policy and observe third-party dependencies.'},

{q:'What does a VirtualService in Istio define?',
 o:['A Kubernetes Service','Routing rules such as host, path, header matches, retries, timeouts and traffic splits between versions','A certificate','A Pod template'],a:1,
 e:'VirtualService is the routing API: it routes to a host, and a DestinationRule defines subsets and policies for those hosts, including load-balancing and connection-pool settings.'},

{q:'What is the main operational cost of adopting a service mesh?',
 o:['It removes the need for monitoring','An extra proxy hop per request, more moving parts, and a new configuration surface that teams must learn','It disables mTLS','It prevents canary deploys'],a:1,
 e:'The benefits are real — mTLS, retries, telemetry — but so are the costs. Smaller systems often do better with a library or a gateway until the mesh\'s standardisation pays off.'},

{q:'What does "sidecar-less mesh" (for example ambient mode or eBPF) try to solve?',
 o:['The lack of TLS','The per-pod resource and operational overhead of injecting a proxy into every pod, while still providing mesh features','The cost of certificates','DNS resolution'],a:1,
 e:'Ambient mode and eBPF data planes move the interception from each pod to a node-level component, cutting per-pod overhead at the cost of some per-pod granularity and maturity.'},

{q:'Why is mTLS usually implemented at the mesh rather than in each service\'s code?',
 o:['Because code cannot do TLS','Because it removes per-language implementation burden, automates certificate rotation, and gives a consistent identity and policy layer for every service','Because mTLS is insecure','Because TLS is optional'],a:1,
 e:'Centralising mTLS in the mesh means every service gets it, regardless of language or framework, and certificate lifecycle is automated rather than hand-managed.'},

{q:'What is a load-balancing policy such as "least request" used for in a mesh or client?',
 o:['Choosing which database to query','Selecting the endpoint with the fewest in-flight requests, which often behaves better than round-robin when instance load varies','Compressing responses','Encrypting traffic'],a:1,
 e:'Round-robin is simple but ignores load. Least-request, consistent hashing and locality-aware routing are common alternatives for improving latency and stability.'},

/* 59–70: Security */
{q:'What is OAuth 2.0 primarily for?',
 o:['Identity federation only','Delegated authorisation: allowing a client to access a protected resource on behalf of a user or another service','Encrypting payloads','Rate limiting'],a:1,
 e:'OAuth issues access tokens with scopes. OIDC builds on it for authentication. The distinction matters: OAuth is about authorising access, OIDC is about proving identity.'},

{q:'What is OpenID Connect (OIDC)?',
 o:['A replacement for OAuth','An identity layer on top of OAuth 2.0 that adds an ID token and a UserInfo endpoint for authentication','A message protocol','A caching layer'],a:1,
 e:'OIDC is what most "login with X" flows use. The ID token is a signed JWT asserting the user\'s identity, while the access token authorises API calls.'},

{q:'What is the recommended token type for calling internal APIs?',
 o:['The user\'s password','A short-lived access token (JWT or opaque) obtained from an identity provider, with an audience and scopes matching the target service','A long-lived API key shared between services','A database credential'],a:1,
 e:'Short-lived tokens limit the damage from leaks. The audience claim restricts a token to the intended service, and scopes narrow what it can do.'},

{q:'Why should a JWT not contain sensitive information?',
 o:['It is encrypted end to end','Its payload is base64-encoded and readable by anyone holding the token, so it must contain only non-sensitive claims','It is too small','It is compressed'],a:1,
 e:'JWT confidentiality requires JWE. A signed JWS is integrity-protected but not secret; anyone with the token can read the claims, so do not put PII or secrets there.'},

{q:'How should a service validate an incoming JWT?',
 o:['Decode the payload and trust it','Verify the signature against the issuer\'s JWKS, check exp/nbf, audience and issuer, and then apply authorisation on the claims','Trust any token with a valid header','Compare it to a hard-coded value'],a:1,
 e:'Signature verification alone is not enough. Audience and issuer checks prevent a token issued for one service being replayed against another.'},

{q:'What does the "aud" claim in a JWT prevent?',
 o:['Token expiry','Using a token issued for one service against a different service that would otherwise accept it','Token replay within the same service','Signature forgery'],a:1,
 e:'Audience is a security control. If service A issues tokens with aud=service-b, then service-c must reject them even if the signature is valid and the issuer is trusted.'},

{q:'What is a common mitigation for stolen refresh tokens?',
 o:['Longer lifetimes','Refresh token rotation with reuse detection, which invalidates a session if an already-used token is presented again','Storing them in localStorage','Sending them in URLs'],a:1,
 e:'Rotation issues a new refresh token on each use. If an attacker replays an old one, the server detects reuse and revokes the whole session, limiting the damage window.'},

{q:'What does SPIFFE provide in a microservices environment?',
 o:['A database schema','A standard verifiable identity for workloads, expressed as a URI, and used with mTLS for authentication between services','A message format','A load balancer'],a:1,
 e:'SPIFFE identities are X.509 or JWT SVIDs bound to a workload. They give every service a cryptographic identity independent of its network location, which is a foundation of zero trust.'},

{q:'What is the purpose of a token exchange (RFC 8693)?',
 o:['Converting JWT to base64','Swapping an inbound token for a new token with a narrower audience and scope for a downstream call, supporting least privilege','Compressing tokens','Rotating keys'],a:1,
 e:'Instead of forwarding a broad user token downstream, the service exchanges it for one scoped to the next service. This limits blast radius if the downstream is compromised.'},

{q:'Why is "trust the internal network" a risky security posture?',
 o:['Internal networks are slow','Lateral movement: once an attacker gains a foothold anywhere in the network, they can reach every service that trusts internal traffic','It increases latency','It disables TLS'],a:1,
 e:'Zero trust replaces implicit network trust with explicit authentication and authorisation per request, encrypted transport, and least privilege for every service identity.'},

{q:'What is a "confused deputy" problem in microservices?',
 o:['Two services with the same name','A service with legitimate privileges being tricked into using them on behalf of an attacker, often by trusting a caller-supplied identifier','A cache poisoning attack','A load-balancer misconfiguration'],a:1,
 e:'The classic case is a service that trusts a user id in the request body instead of the authenticated token. Always derive identity from a verified token, never from caller-supplied fields.'},

/* 71–82: Observability & SLOs */
{q:'What does OpenTelemetry standardise?',
 o:['A programming language','APIs, SDKs and wire protocols for traces, metrics and logs, so telemetry is vendor-neutral','A database','A container runtime'],a:1,
 e:'OTel provides a Collector for processing and exporting telemetry. Instrumentation and export can be decoupled, so switching vendors does not require re-instrumentation.'},

{q:'What is trace context propagation across asynchronous messaging?',
 o:['Sending the trace id in the message body','Copying the trace context (traceparent and tracestate) into message headers so the consumer continues the same trace','Logging the trace id only','Using the message id as the trace id'],a:1,
 e:'Without propagation into headers, producer and consumer appear as separate traces. Many broker client libraries expose a producer interceptor and consumer extractor for exactly this.'},

{q:'What is a span in distributed tracing?',
 o:['A time range shown in dashboards','A single unit of work with a start time, duration, attributes and parent-child relationship to other spans in the same trace','A log line','A metric'],a:1,
 e:'Spans model nested operations: an HTTP handler span contains database and outbound HTTP spans. The trace is the tree of all spans for one request.'},

{q:'What is head-based vs tail-based sampling for traces?',
 o:['Head-based samples at the start of a trace; tail-based buffers the whole trace and decides at the end, allowing all errors and slow traces to be kept','They are identical','Tail-based is always cheaper','Head-based keeps all errors'],a:0,
 e:'Head-based is cheap but can miss rare failures. Tail-based is more accurate for debugging at the cost of buffering and running a collector capable of trace-level decisions.'},

{q:'Why is cardinality a problem for metrics?',
 o:['High cardinality makes labels expensive to store and query, often overwhelming the metrics backend','Metrics cannot have labels','Cardinality only matters for logs','It slows down tracing only'],a:0,
 e:'Putting user ids, request ids or unbounded URLs in metric labels explodes the series count. High-cardinality data belongs in traces or logs, not metrics.'},

{q:'What is an error budget?',
 o:['The money spent on alerts','The amount of unreliability an SLO allows in a period (100% minus the SLO target), used to decide how aggressively to ship changes','A limit on error messages per hour','The number of failed deployments allowed'],a:1,
 e:'If a 99.9% SLO over 30 days is exhausted early, the team slows feature releases and focuses on reliability. This turns reliability into an explicit trade-off rather than an argument.'},

{q:'What is "burn rate" in SLO alerting?',
 o:['How fast the deployment pipeline runs','How quickly the error budget is being consumed relative to the steady-state rate, used to alert before the budget is fully spent','The rate of incoming requests','The rate of log growth'],a:1,
 e:'A burn rate of 14.4x exhausts a 30-day budget in about two days. Multi-window, multi-burn-rate alerts catch both fast outages and slow degradation while keeping noise low.'},

{q:'Why are symptom-based alerts usually preferred over cause-based alerts?',
 o:['They are easier to configure','They page on what users experience (errors, latency, availability) rather than on internal metrics that may not indicate user impact','They eliminate all incidents','They require no thresholds'],a:1,
 e:'Cause-based alerts generate noise for issues that do not affect users. Symptom-based alerts, backed by SLOs, page only when the service is actually degraded.'},

{q:'What does a "golden signals" dashboard typically show?',
 o:['Only CPU and memory','Latency, traffic, errors and saturation — the four signals that summarise user-facing health of a service','Database schema changes','Deployment history only'],a:1,
 e:'Google\'s SRE golden signals guide dashboards that answer "is the service healthy?" quickly. RED and USE metrics are alternative framings for request-driven and resource-oriented systems.'},

{q:'Why is structured logging with correlation ids more valuable than long plain-text logs?',
 o:['It uses less disk','It lets you filter, aggregate and join across services by request or trace id, turning log data into a queryable dataset','It is required by law','It encrypts data'],a:1,
 e:'Plain text has to be parsed with brittle regexes. Structured fields with consistent keys make queries like "all 5xx for tenant X with trace Y" straightforward in a log platform.'},

{q:'What is "log sampling" and when is it useful?',
 o:['Storing every log line','Keeping only a fraction of high-volume log events, often with full capture of errors, to control cost while retaining diagnostic value','Encrypting log lines','Compressing logs'],a:1,
 e:'High-volume debug or access logs can be sampled, while errors and slow requests are kept in full. The key is that sampling must not hide the events you need during an incident.'},

{q:'What is a runbook, and why does it matter for microservices?',
 o:['A deployment script','A documented procedure for handling common incidents and alerts, so on-call engineers can act quickly without original authors','A code review checklist','A performance test'],a:1,
 e:'Distributed systems fail in many ways, and on-call rotation means the responder often did not write the service. Runbooks turn institutional knowledge into actionable steps.'},

/* 83–92: Deployment & platform */
{q:'Why is a canary deployment safer than a big-bang rollout?',
 o:['It is faster','It exposes the new version to a small share of real traffic first, limiting blast radius and allowing rollback before full rollout','It requires no monitoring','It avoids testing'],a:1,
 e:'A canary needs a solid SLO dashboard and automated analysis to be useful. Releasing to 1% and watching error rate and latency for a defined window is the standard practice.'},

{q:'What is a feature flag primarily used for?',
 o:['Encrypting traffic','Decoupling deploy from release, so code can ship dark and be enabled gradually, per cohort, or rolled back without redeploying','Caching','Load balancing'],a:1,
 e:'Flags also let you test in production safely and target specific users. They add operational overhead and must be cleaned up, or flag debt becomes a real problem.'},

{q:'What is progressive delivery?',
 o:['Deploying everything at once','Combining techniques such as canary, feature flags, blue-green and automated analysis to release gradually and roll back quickly based on signals','Running deployments manually','Deploying at night only'],a:1,
 e:'Progressive delivery turns releases into measured experiments. The underlying prerequisite is strong observability — you cannot roll back based on signals you do not measure.'},

{q:'What does a Kubernetes Service provide that a Deployment alone does not?',
 o:['Persistent storage','A stable virtual IP and DNS name, with load balancing across the current set of ready Pods','A TLS certificate','A CI pipeline'],a:1,
 e:'Pods are ephemeral with changing IPs. The Service abstracts that away, and the endpoints controller keeps the endpoint set in sync with readiness.'},

{q:'Why is a PodDisruptionBudget important during node drains and upgrades?',
 o:['It limits CPU usage','It ensures that voluntary disruptions such as drains keep a minimum number of Pods available for a service','It triggers autoscaling','It configures TLS'],a:1,
 e:'Without a PDB, a drain can evict every replica of a service at once. The PDB makes the eviction API wait until the minimum availability is respected.'},

{q:'What is the difference between a HorizontalPodAutoscaler and a Cluster Autoscaler?',
 o:['They are the same','HPA adds or removes Pods based on metrics; Cluster Autoscaler adds or removes nodes when Pods cannot be scheduled or nodes are underutilised','HPA adds nodes','Cluster Autoscaler adds Pods'],a:1,
 e:'They work together: HPA scales the workload, and when the workload no longer fits on the existing nodes, Cluster Autoscaler provisions more capacity from the underlying cloud provider.'},

{q:'What does a Kubernetes Operator add over plain Deployments?',
 o:['Faster networking','A custom controller that encodes operational knowledge for a stateful application, such as backups, failover and upgrades, via custom resources','A registry mirror','A service mesh'],a:1,
 e:'Operators automate day-two operations. For stateful services such as databases or Kafka, they encode knowledge that a generic Deployment cannot express.'},

{q:'What is GitOps reconciliation?',
 o:['Merging pull requests automatically','An agent continuously comparing the live cluster state to the declared state in Git and applying differences, so drift is corrected','Running tests in CI','Rotating secrets'],a:1,
 e:'The desired state lives in Git; the cluster continuously converges to it. Manual changes are reverted unless they are also committed, which keeps the audit trail accurate.'},

{q:'Why is a mutable image tag such as "latest" dangerous in production?',
 o:['It is slower to pull','It does not identify a specific build, so deployments are not reproducible and rollbacks may pull a different image','It fails signature verification','It is deprecated'],a:1,
 e:'Immutable tags or digests are essential for reproducible deployments and reliable rollback. The same tag can point to different bytes tomorrow, which breaks incident forensics.'},

{q:'What is the purpose of a health endpoint separate from a metrics endpoint?',
 o:['They are the same','Health is a fast, coarse signal used by orchestrators to route traffic or restart; metrics are rich telemetry for dashboards and alerting','Metrics are more accurate','Health endpoints are deprecated'],a:1,
 e:'A health check must be cheap and must reflect ability to serve. Deep checks belong in the readiness probe only if they reflect true readiness, and never in liveness.'},

{q:'Why is "one service, one team, one repo" common but not mandatory?',
 o:['It is mandated by Kubernetes','It supports independent ownership and delivery, but monorepos with clear service boundaries can also work well if tooling supports per-service releases','Repositories are deprecated','Teams cannot share code'],a:1,
 e:'The organisational principle is clear ownership, not a specific repo layout. Monorepos with good tooling can preserve independence; polyrepos can still become coupled if contracts are shared carelessly.'},

{q:'What is the "two-pizza team" guideline?',
 o:['A team size that can be fed by two pizzas, roughly 5–8 people, small enough for low communication overhead and clear ownership','A deployment strategy','A testing framework','A load-balancing policy'],a:0,
 e:'Team size drives communication cost. Small, autonomous teams with clear ownership of a service or a set of services are the organisational unit microservices are built around.'},

{q:'What is "shift left" in a microservices context?',
 o:['Move services to the left region','Move quality, security and operational checks earlier in the delivery pipeline, so problems are caught before production','Shift traffic to older versions','Move data to edge nodes'],a:1,
 e:'Static analysis, contract tests, vulnerability scans and policy-as-code in CI catch many issues that would otherwise page someone at 3am. The cost is a longer pipeline that must stay fast.'},

/* 93–100: Operations & anti-patterns */
{q:'Why is a shared library containing business logic an antipattern?',
 o:['Libraries are too large','It forces multiple services to upgrade in lockstep, recreating monolith coupling while pretending to be independent','Libraries cannot be versioned','It prevents tests'],a:1,
 e:'Infrastructure libraries are fine. Business logic shared across services should live in one owner, either extracted into a service or deliberately duplicated with clear boundaries.'},

{q:'What is the "distributed monolith" symptom?',
 o:['Services deployed together','Services are physically separate but must be released in lockstep because of tight coupling in APIs, data or shared schemas','Two services share a Kafka topic','Services use the same language'],a:1,
 e:'The tell is coordination cost: if every change requires a meeting and a synchronised release across many services, the boundaries are wrong or the coupling is too high.'},

{q:'What is a common cause of "chatty" services?',
 o:['Too few services','Fine-grained decomposition that turns one user action into dozens of network calls, multiplying latency and failure probability','Too many replicas','Too much caching'],a:1,
 e:'Network hops are expensive compared with in-process calls. If a single page load fans out to 40 services, an aggregation layer or service consolidation is usually needed.'},

{q:'What does the "N+1 query problem" look like in microservices?',
 o:['One call to fetch a list, then one call per item to enrich it, which scales linearly with the number of items','A single slow database query','A retry storm','A circuit breaker'],a:0,
 e:'It is the network analogue of the ORM N+1. Batch endpoints, caching, or data composition in a BFF are the common fixes.'},

{q:'Why is "eventual consistency" often a product decision, not just a technical one?',
 o:['Because users never notice','Because the product must define what users see during the convergence window, such as pending states, optimistic UI, or read-your-writes guarantees','Because databases are unreliable','Because events are lost'],a:1,
 e:'A payment that shows "completed" before the ledger confirms can cause support tickets. The product must choose how the inconsistency is presented, and whether strong read-your-writes is needed.'},

{q:'What is a "read-your-writes" guarantee, and how is it usually implemented?',
 o:['A cache invalidation strategy','A consistency guarantee that a client immediately sees its own writes, usually implemented with sticky sessions, reading from the primary, or a version token','A retry policy','A rate limit'],a:1,
 e:'After a write, the client may be routed to a replica that has not caught up. Version tokens let the server wait until the replica has applied the client\'s version.'},

{q:'What does "idempotency key" allow a client to do?',
 o:['Retry a non-idempotent operation safely, because the server deduplicates requests carrying the same key','Skip authentication','Bypass rate limits','Cache responses'],a:0,
 e:'The server stores the outcome keyed by the idempotency key and replays the same response on retry. It is the standard way to make a POST such as "create payment" safe to retry.'},

{q:'Why is observability usually the top prerequisite for microservices adoption?',
 o:['Because it is required by Kubernetes','Because without logs, metrics and traces you cannot diagnose which of many services is failing, and every incident becomes guesswork','Because it reduces cost','Because it improves security'],a:1,
 e:'Distributed systems fail in ways that are invisible from a single service. Telemetry, correlation ids and dashboards must exist before the architecture becomes complex.'},

{q:'What is an "incident retro" or postmortem primarily for?',
 o:['Assigning blame','Understanding the contributing factors of an incident and identifying concrete improvements to prevent recurrence, in a blameless way','Satisfying auditors','Writing documentation'],a:1,
 e:'Blameless postmortems produce more honest information and better action items. The output should be a small number of concrete, assigned, and tracked follow-ups.'},

{q:'Which is the best first step when service A starts returning 500s after a deployment of service B?',
 o:['Roll back both services','Check SLO dashboards and recent deployments, then use traces and error logs to confirm which dependency changed before rolling back the culprit','Restart all pods','Scale up all services'],a:1,
 e:'Evidence first, then action. The trace and error logs usually point directly at the failing dependency. Rolling back the culprit is the quickest mitigation; rolling back everything hides the cause.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Microservices Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
