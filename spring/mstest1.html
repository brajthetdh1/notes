<style>
  :root{--brand:#0f766e;--brand-dark:#134e4a;--accent:#14b8a6;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#042f2b;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}

  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f0fdfa}

  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}

  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}

  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🧩 Microservices Mock Test <span class="setpill">FOUNDATIONS</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Fundamentals */
{q:'What is a microservice?',
 o:['A small monolith','A process that is independently deployable, owns a bounded business capability, and communicates over the network','A virtual machine','A database table'],a:1,
 e:'Microservices are small, independently deployable services organised around business capabilities. Each owns its own data and communicates over lightweight protocols such as HTTP or messaging.'},

{q:'Which principle best characterises microservice architecture?',
 o:['A shared relational database across all services','Loosely coupled, highly cohesive services organised around business capabilities','All services deployed as one unit','A single codebase with many packages'],a:1,
 e:'Microservices trade in-process calls for network calls in exchange for independent deployability, team autonomy and independent scaling. The architecture is organisational as much as technical.'},

{q:'What is a bounded context in Domain-Driven Design?',
 o:['A network boundary','A database schema','A team boundary only','An explicit boundary within which a domain model is defined and remains consistent'],a:3,
 e:'A bounded context is where a particular model applies. "Customer" in billing and "customer" in shipping are different models with different attributes, and each context owns its own definition.'},

{q:'How does a bounded context typically map to a microservice?',
 o:['One-to-one, though one context may contain multiple services','Always one context per database','Many contexts per method','A context must be split into at least three services'],a:0,
 e:'A common and healthy starting point is one service per bounded context. Larger contexts may be split, and very small contexts may share a service, but the boundary guides the service boundary.'},

{q:'What is the main drawback of a "distributed monolith"?',
 o:['It scales too easily','It has no shared database','It cannot be deployed','Services are physically separate but tightly coupled, so they must still change and deploy together'],a:3,
 e:'A distributed monolith has all the drawbacks of both architectures: network latency, partial failure and operational complexity, with none of the deployment independence. It is the classic anti-pattern to avoid.'},

{q:'Which type of coupling most damages service independence?',
 o:['Runtime coupling via synchronous calls only','Design-time coupling such as shared databases and shared domain models','Contract coupling via APIs','Dependency on DNS'],a:1,
 e:'Sharing a database or domain model means a schema change ripples into every consumer, forcing coordinated releases. Independent data ownership is the primary defence.'},

{q:'What does Conway\'s Law state?',
 o:['Systems will mirror the communication structure of the organisation that builds them','Every service needs its own database','Microservices must be written in different languages','Latency scales linearly with services'],a:0,
 e:'Conway\'s Law explains why architecture and org chart drift together. The inverse manoeuvre — designing teams around the desired architecture — is often called the Inverse Conway Maneuver.'},

{q:'Which is NOT a benefit commonly claimed for microservices?',
 o:['Independent deployability','Independent scaling of hot spots','Strong consistency across all services','Technology heterogeneity per service'],a:2,
 e:'Microservices typically trade strong cross-service consistency for eventual consistency. Providing strong consistency across independent databases is one of the hardest parts of the architecture.'},

{q:'When is a monolith usually the better choice?',
 o:['When the team is small, the domain is poorly understood, or speed of iteration matters more than independent scaling','Never','Only for batch jobs','Only for internal tools'],a:0,
 e:'A well-structured modular monolith is often the right starting point. Extracting services later, when boundaries are clear and scaling or team autonomy actually demands it, is far cheaper.'},

{q:'What is a "strangler fig" migration?',
 o:['Rewriting everything at once','Routing traffic incrementally to new services while the legacy system remains, so it shrinks over time','Running two databases forever','Deploying to two clouds'],a:1,
 e:'Inspired by the vine that gradually envelops a tree, the strangler pattern lets you introduce a façade or router and migrate capability by capability, keeping the system working throughout.'},

/* 11–22: Communication */
{q:'Which communication style gives the tightest runtime coupling?',
 o:['Asynchronous messaging via a broker','Synchronous request-response over HTTP','A shared database','An event log'],a:1,
 e:'With a synchronous call, the caller depends on the callee being up and fast at that instant. Broker-based messaging decouples availability but adds complexity in ordering and delivery semantics.'},

{q:'What is a key advantage of asynchronous messaging between services?',
 o:['Simpler debugging','Strong consistency','Temporal decoupling: the producer continues even if the consumer is temporarily down','No need for contracts'],a:2,
 e:'A broker buffers messages, so a consumer outage becomes delayed processing rather than a failed request. This is essential for resilience, at the cost of eventual consistency and harder tracing.'},

{q:'Which HTTP status code most strongly suggests the client should retry a request later?',
 o:['200','400','404','503'],a:3,
 e:'503 Service Unavailable indicates a transient overload or unavailability; with a Retry-After header it is an explicit instruction. 4xx codes should not be retried unless the request is corrected.'},

{q:'What does REST stand for?',
 o:['Remote Execution and State Transfer','REpresentational State Transfer','Reliable Event Stream Transport','Router Endpoint Standard Transfer'],a:1,
 e:'REST is an architectural style defined by Fielding. It relies on resources identified by URIs, uniform interface constraints, stateless interactions and a hypermedia-friendly representation of state.'},

{q:'Why is PUT considered idempotent?',
 o:['It returns the same response every time','Repeating the same request has the same effect as sending it once','It cannot fail','It uses a body'],a:1,
 e:'Idempotency is about effects, not responses. PUT replaces a resource with the supplied representation, so sending it twice leaves the resource in the same state. POST is not idempotent by default.'},

{q:'What is the purpose of an API gateway?',
 o:['To store the database','To hide service discovery and authentication, aggregate responses and apply rate limits as a single entry point for clients','To replace all service-to-service calls','To act as a message broker'],a:1,
 e:'The gateway is a client-facing concern: authentication, rate limiting, routing, response aggregation and protocol translation. Over time a careless gateway can become a new central monolith.'},

{q:'How does the BFF (Backend for Frontend) pattern differ from a single shared API gateway?',
 o:['It is the same thing','It provides one tailored backend per client type (web, mobile, partner), so each client gets a purpose-built API','It removes the gateway','It only works with GraphQL'],a:1,
 e:'A single API for every client forces awkward compromises. A BFF per client lets the mobile team optimise payloads and number of round trips without affecting the web client.'},

{q:'What is gRPC most useful for in a microservices architecture?',
 o:['Public browser-facing APIs','Streaming media','Low-latency, strongly typed internal service-to-service calls with HTTP/2 and Protocol Buffers','Batch ETL'],a:2,
 e:'gRPC\'s binary serialisation and multiplexed streams make it efficient for internal traffic, and the IDL gives strong contract guarantees. Browser support requires a proxy, so it is usually internal.'},

{q:'What does GraphQL offer as an inter-service API?',
 o:['Binary efficiency','A single endpoint where clients request exactly the fields they need, avoiding over- and under-fetching','Strong consistency','Automatic retries'],a:1,
 e:'GraphQL moves the aggregation decision to the client. It is powerful for BFFs and aggregation layers, but it complicates caching, rate limiting and query cost control.'},

{q:'Which is a reason to prefer events over RPC for cross-domain communication?',
 o:['Events guarantee immediate responses','Events avoid the need for schemas','Events let the producer remain unaware of the number and identity of consumers, reducing coupling','Events eliminate partial failure'],a:2,
 e:'Event-driven integration inverts the dependency: the publisher does not know who listens. Adding a new consumer requires no change to the producer, which is the main structural win.'},

{q:'What is a service contract?',
 o:['A legal SLA','An explicit, versioned description of a service\'s API (endpoints, messages, schemas) and behaviour that consumers can rely on','A Kubernetes manifest','A monitoring rule'],a:1,
 e:'Contracts are the boundary. They should be versioned and backward compatible, and they should be tested as part of CI with consumer-driven contract tests so a producer cannot break a consumer silently.'},

{q:'What is the difference between a command and an event in messaging?',
 o:['They are synonymous','A command is an instruction to one specific recipient and implies intent; an event states that something happened and is broadcast to any interested party','Commands are always synchronous','Events are only for logging'],a:1,
 e:'Commands have a target and may be rejected; events are facts. Mixing them in the same channel is a common source of confusion, so many teams use separate topics and naming conventions.'},

{q:'What does the request-reply pattern look like over a message broker?',
 o:['A synchronous HTTP call','Two one-way messages with a correlation id and a reply queue','A single fire-and-forget message','A database poll'],a:1,
 e:'The producer sends a command with a correlation id and a reply-to address, and the consumer publishes the response to that address. It works, but it is often a sign that a synchronous API is the better fit.'},

/* 23–32: Service discovery */
{q:'What problem does service discovery solve?',
 o:['Encrypting traffic','Finding the current network locations of service instances whose IPs and ports change dynamically','Storing configuration','Compressing payloads'],a:1,
 e:'In an elastic environment instances come and go. Discovery lets callers resolve a stable name to the current set of healthy instances without hard-coded addresses.'},

{q:'How does client-side discovery differ from server-side discovery?',
 o:['The client queries the registry and load-balances itself; with server-side discovery the client calls a stable endpoint and the infrastructure routes','They are the same','Client-side discovery uses DNS only','Server-side discovery requires a broker'],a:0,
 e:'Client-side discovery (Eureka, Consul with a client library) gives the caller full control over load-balancing strategy. Server-side discovery (Kubernetes Service, AWS ELB) hides the registry behind a VIP.'},

{q:'In Kubernetes, how do Pods typically discover a Service?',
 o:['By reading the registry API','By resolving the Service name through cluster DNS to a stable ClusterIP','By querying etcd directly','By IP address embedded in the image'],a:1,
 e:'kube-dns or CoreDNS resolves service.namespace.svc.cluster.local to the ClusterIP, and kube-proxy routes traffic to ready endpoints. This is server-side discovery from the application\'s perspective.'},

{q:'What is a service registry?',
 o:['A container image store','A database of services and their instances, including health state and metadata, that discovery clients query','A message broker','A load balancer'],a:1,
 e:'Consul, Eureka and etcd are common registries. Instances register on startup and send heartbeats, and stale entries are removed so callers only see healthy endpoints.'},

{q:'What is self-registration versus third-party registration?',
 o:['They are identical','In self-registration the instance registers itself; in third-party registration an external registrar watches instances and registers them','Third-party registration only works with Kubernetes','Self-registration needs no health checks'],a:1,
 e:'Kubernetes effectively does third-party registration: the Endpoints controller watches Pods and updates the endpoints object without the app knowing anything about discovery.'},

{q:'Why is a readiness probe important in a discovered environment?',
 o:['It speeds up startup','It ensures an instance is only added to the load-balancing pool once it can actually serve traffic','It encrypts traffic','It prevents DNS caching'],a:1,
 e:'Without readiness, traffic arrives before the app can respond, causing 502s during every rollout. Liveness covers a different concern: restarting a hung process.'},

{q:'What is the "thundering herd" problem in service discovery?',
 o:['Clients all query the registry or refresh their cache simultaneously after a change or outage, causing a load spike','A single instance failing','A DNS poisoning attack','A stale certificate'],a:0,
 e:'Mitigations include randomised TTLs, stale-while-revalidate caches, jittered retries, and pushing updates over watch streams rather than polling on a fixed interval.'},

{q:'Why do many teams rely on service mesh (Istio, Linkerd) rather than per-service client libraries?',
 o:['It replaces the application entirely','It moves discovery, mTLS, retries, timeouts and telemetry into a sidecar proxy so every language gets the same behaviour without libraries','It removes the need for Kubernetes','It compresses traffic'],a:1,
 e:'A mesh standardises cross-cutting network concerns at the platform level. The cost is an extra proxy hop, more moving parts, and a new operational surface.'},

{q:'What does an east-west gateway or internal load balancer handle that a public gateway does not?',
 o:['TLS termination for end users','Traffic between internal services, often with mTLS and per-service authorisation','Static asset hosting','Email delivery'],a:1,
 e:'North-south traffic is client-to-cluster; east-west is service-to-service. Many organisations use separate ingress and internal gateways because the security and policy requirements differ.'},

{q:'What is the main risk of caching DNS aggressively in a microservices client?',
 o:['Higher latency','Requests go to instances that have already been removed or restarted, causing errors','Increased cost','Packet loss'],a:1,
 e:'Long TTLs and JVM DNS caching can pin a client to a dead address. The usual answer is a short TTL, a refresh-aware resolver, or discovery through a registry or mesh instead of raw DNS.'},

/* 33–44: Resilience */
{q:'What does the circuit breaker pattern do?',
 o:['Encrypts calls','After a threshold of failures, it short-circuits calls to a failing dependency for a period, failing fast instead of overloading it','Retries every failure','Load-balances traffic'],a:1,
 e:'Circuit breakers have closed, open and half-open states. Failing fast protects both the caller (no thread pile-up) and the callee (no retry storm), giving the dependency time to recover.'},

{q:'Which problem does a timeout alone NOT solve?',
 o:['Hanging requests','Thread pool exhaustion from many slow calls','Retrying a failed call','Slow responses tying up resources'],a:2,
 e:'Timeouts bound each call but do not retry. Retries, with backoff and jitter, are a separate concern. Combining a timeout with an aggressive retry without a circuit breaker is how retry storms happen.'},

{q:'What is exponential backoff with jitter used for?',
 o:['Compressing payloads','Spreading out retries so clients do not synchronise and overwhelm a recovering dependency','Encrypting retries','Load-balancing retries'],a:1,
 e:'Jitter randomises the delay so that N clients do not all retry at the same instant. Without jitter, a recovering service can be knocked over again immediately.'},

{q:'What is the bulkhead pattern?',
 o:['Encrypting internal traffic','Isolating resources (thread pools, connection pools) per dependency so one slow dependency cannot exhaust capacity for all others','Splitting a database into shards','Routing traffic by geography'],a:1,
 e:'Named after ship compartments: if one floods, the others stay dry. Per-dependency pools mean a slow payment provider does not starve calls to the catalogue.'},

{q:'What is a "retry storm"?',
 o:['A network outage','Cascading retries from many callers that multiply load on an already struggling dependency, often making an outage worse','A sudden deployment','A broker rebalance'],a:1,
 e:'Retries amplify load precisely when the system is least able to handle it. Use bounded retries, backoff with jitter, idempotent operations and a circuit breaker.'},

{q:'Which operations are safe to retry without extra care?',
 o:['Non-idempotent POST requests','Any operation, as long as the timeout is long enough','Idempotent operations such as GET, PUT or a POST carrying an idempotency key','Only operations returning 500'],a:2,
 e:'Retrying a non-idempotent write can duplicate a payment or an order. Either use naturally idempotent verbs or carry an idempotency key the server can deduplicate on.'},

{q:'What does "fail fast" mean in a microservices context?',
 o:['Return errors instead of hanging: short timeouts, circuit breakers and immediate rejection when a dependency is known to be down','Crash the whole system on any error','Skip validation','Retry forever'],a:0,
 e:'A fast failure frees threads and returns control to the caller, which can then apply a fallback. A hanging request is often worse than an immediate error because it consumes resources.'},

{q:'What is a fallback in resilience design?',
 o:['A retry policy','A degraded but functional response when a dependency fails, such as cached data or a default value','A database replica','A backup cluster'],a:1,
 e:'Fallbacks must be designed for the business: showing cached recommendations is fine, but silently approving a payment is not. Fallbacks are not a substitute for fixing the root cause.'},

{q:'What problem does a queue-based load levelling pattern solve?',
 o:['Encryption','Smoothing bursts of traffic by buffering requests in a queue so a consumer can process them at its own sustainable rate','Strong consistency','Service discovery'],a:1,
 e:'Producers spike, consumers are steady. A queue absorbs the spike, at the cost of added latency and the need to handle queue depth, dead letters and ordering.'},

{q:'What is graceful degradation?',
 o:['Restarting everything when a dependency fails','Continuing to serve the core function at reduced quality when non-critical dependencies are unavailable','Disabling authentication','Dropping all traffic'],a:1,
 e:'A catalogue page can render without personalised recommendations. Deciding which features are essential and which can degrade is a product decision as much as a technical one.'},

{q:'What is a cascading failure?',
 o:['A planned rollout','One service failing and exhausting resources in its callers, which then fail their own callers, propagating the outage up the chain','A batch job','A DNS failover'],a:1,
 e:'Cascading failures are the primary motivation for timeouts, bulkheads, circuit breakers and bounded queues. Without them, one slow dependency can take down an entire request path.'},

{q:'Why is a bounded thread pool important for a synchronous client?',
 o:['To increase parallelism indefinitely','To cap resource usage so an unresponsive dependency cannot consume unbounded threads and memory','To encrypt traffic','To enable load balancing'],a:1,
 e:'An unbounded pool turns a slow dependency into a memory and context-switching problem. A bounded pool plus a queue with a rejection policy turns it into a clean, predictable failure.'},

{q:'What does chaos engineering aim to achieve?',
 o:['Randomly deleting production data','Deliberately injecting failures in a controlled way to validate that resilience mechanisms actually work','Replacing testing entirely','Improving deployment speed'],a:1,
 e:'Chaos experiments test hypotheses about failure behaviour. Starting in staging, with a clear blast radius and abort conditions, is essential; doing it ad hoc in production is not.'},

/* 45–56: Data consistency */
{q:'What is the dual-write problem?',
 o:['Writing to two databases in one transaction','Updating a database and publishing an event as two separate actions, where one can succeed and the other fail, leaving the system inconsistent','Writing to two replicas','Having two API versions'],a:1,
 e:'There is no shared transaction between the database and the broker. Solutions include the transactional outbox, change data capture, and idempotent consumers with reconciliation.'},

{q:'How does the transactional outbox pattern solve the dual-write problem?',
 o:['By using a distributed transaction','By writing the business change and an outbox record in the same local transaction, then relaying outbox records to the broker','By skipping the event','By writing only to Kafka'],a:1,
 e:'Because the business row and the outbox row commit atomically, the event cannot be lost. A separate relay (or CDC) publishes outbox rows, and consumers deduplicate on the event id.'},

{q:'What does change data capture (CDC) provide?',
 o:['A backup schedule','A stream of committed database changes read from the transaction log, so downstream services stay in sync without application-level publishing','A schema migration tool','A cache invalidation mechanism'],a:1,
 e:'Debezium reading the MySQL binlog or PostgreSQL WAL is the common implementation. It avoids touching application code but couples you to the database\'s log format and privileges.'},

{q:'In a saga, what is a compensating transaction?',
 o:['A retry of the failed step','An action that semantically undoes a previously completed local transaction when a later step fails','A database rollback','A broker rebalance'],a:1,
 e:'Sagas do not roll back; they compensate. For example, a reserved inventory is released, or a payment is refunded. Compensations must be idempotent because they can be retried.'},

{q:'How does saga choreography differ from orchestration?',
 o:['Choreography has a central coordinator','Choreography is decentralised event-driven reaction by each participant; orchestration has a central coordinator issuing commands and tracking state','They are identical','Orchestration cannot use Kafka'],a:1,
 e:'Choreography is simpler for short flows but hard to reason about as steps grow. Orchestration centralises state and visibility, at the cost of an extra component and a potential coupling point.'},

{q:'Why is exactly-once delivery across services fundamentally difficult?',
 o:['Brokers do not support it','Network partitions make acknowledgement ambiguous, so the sender cannot distinguish "not received" from "received but acknowledgement lost"','Because databases cannot transact','Because HTTP is stateless'],a:1,
 e:'In distributed systems, the classic result is that you can have at-most-once or at-least-once, and exactly-once is achieved in practice with at-least-once plus idempotent consumers and deduplication keys.'},

{q:'What does eventual consistency mean?',
 o:['All replicas are always identical','Given no new updates, all replicas will eventually converge to the same value','Reads are always served from the primary','Writes never fail'],a:1,
 e:'Eventual consistency accepts a temporary divergence window in exchange for availability and partition tolerance. The product must define how users experience that window, for example "order placed" versus "confirmed".' },

{q:'What is idempotency, and why is it essential for message consumers?',
 o:['The consumer processes faster','Repeated processing of the same message produces the same final state, which makes at-least-once delivery safe','The consumer never fails','Messages arrive in order'],a:1,
 e:'Duplicates are normal in distributed messaging, especially with retries. Consumers must deduplicate, for example by an event id table or a naturally idempotent upsert keyed on a business identifier.'},

{q:'What is a distributed transaction (2PC) and why is it often avoided in microservices?',
 o:['A client-side transaction','A protocol where a coordinator asks all participants to prepare, then commit or abort, which is blocking and fragile under coordinator failure','A message broker feature','A backup strategy'],a:1,
 e:'Two-phase commit is synchronous and locks resources, and a failed coordinator leaves participants stuck. Most microservice architectures prefer sagas, outbox and compensating actions instead.'},

{q:'What is the CQRS pattern?',
 o:['A single model for reads and writes','Separating the write model (commands) from one or more read models (queries), each optimised for its purpose','A caching pattern','A sharding strategy'],a:1,
 e:'CQRS is often paired with event sourcing. The write side enforces invariants; the read side is a projection tuned for query performance, and eventual consistency between the two is expected.'},

{q:'What is event sourcing?',
 o:['Storing only the current state','Persisting the sequence of events that produced the state, with current state derived by replaying or projecting those events','A backup strategy','A messaging protocol'],a:1,
 e:'The event log becomes the source of truth, enabling full audit history, temporal queries, and new projections built from history. The cost is event schema evolution, snapshotting and eventual consistency.'},

{q:'What is the difference between a saga and a long-running workflow engine?',
 o:['They are identical','A saga is a pattern for distributed transactions; a workflow engine (Temporal, Camunda) is a general-purpose platform that can implement sagas plus timers, human tasks and versioning','Workflow engines do not support compensation','Sagas require a database'],a:1,
 e:'A workflow engine centralises state, retries, timers and versioning of long-running processes. It overlaps heavily with orchestrated sagas, and many teams adopt one once flows become complex.'},

{q:'What is a "saga log" or saga state store for?',
 o:['Logging errors','Persisting the progress of a saga so the coordinator can resume or compensate after a crash','Storing user sessions','Storing API tokens'],a:1,
 e:'Without durable state, a coordinator crash loses the knowledge of which steps completed. On restart it must be able to either continue or compensate correctly, which requires persisted step outcomes.'},

/* 57–68: Observability */
{q:'What are the three pillars of observability?',
 o:['Logs, metrics, and traces','Backups, alerts, and dashboards','Deployments, rollbacks, and canaries','Users, services, and databases'],a:0,
 e:'Logs explain discrete events, metrics quantify aggregates over time, and traces reconstruct the path of a single request across services. They complement rather than replace each other.'},

{q:'What is distributed tracing?',
 o:['Reading logs across machines','A way to follow a single request through multiple services using a shared trace id and per-hop spans','A metrics aggregator','A database proxy'],a:1,
 e:'Each service propagates the trace context and records spans with timing and attributes. Tools such as Jaeger, Zipkin and OpenTelemetry visualise the resulting tree.'},

{q:'What is trace context propagation usually carried in?',
 o:['The request body','An HTTP header such as W3C traceparent, or a message header in asynchronous flows','A database column','DNS'],a:1,
 e:'The W3C Trace Context standard defines traceparent and tracestate headers. For messaging, the same context must be copied into message headers by the producer and read by the consumer.'},

{q:'What are the RED metrics for a service?',
 o:['Reachability, Efficiency, Durability','Rate, Errors, Duration','Reads, Edits, Deletes','Retries, Events, Data'],a:1,
 e:'RED is the standard for request-driven services: request rate, error rate and latency distribution. For resources such as queues, the USE method (Utilisation, Saturation, Errors) is often more appropriate.'},

{q:'Why are percentiles like p95 and p99 more useful than averages for latency?',
 o:['They are easier to compute','An average hides the slow tail that users actually experience, while percentiles expose tail latency','Averages are always wrong','Percentiles require no data'],a:1,
 e:'Averages are pulled down by fast requests and hide the slow experiences that drive complaints. SLOs are usually expressed in percentiles, for example p99 < 300ms.'},

{q:'What is an SLO?',
 o:['A legal contract with penalties','A service level objective: an internal target for a measurable reliability property, such as 99.9% of requests succeeding within 300ms over 30 days','A monitoring tool','A deployment strategy'],a:1,
 e:'SLOs are usually expressed as a target plus a measurement window. The error budget — the allowed shortfall — drives the trade-off between releasing features and investing in reliability.'},

{q:'What is the difference between an SLI and an SLO?',
 o:['They are identical','An SLI is the measured indicator (for example the success ratio); an SLO is the target for that indicator','An SLI is the contract; an SLO is the metric','An SLI is for infrastructure; an SLO is for applications'],a:1,
 e:'You choose SLIs, then set SLOs on them, and an SLA is the external commercial commitment. SLOs are typically stricter than SLAs so there is headroom before breaching the contract.'},

{q:'Why is correlation id logging important in microservices?',
 o:['It compresses logs','It lets you stitch together log lines from multiple services that handled the same request','It encrypts logs','It replaces tracing'],a:1,
 e:'The correlation id should be generated at the edge if absent, propagated in headers and message attributes, and included in every log line, so a single grep reconstructs the request path.'},

{q:'What is the difference between structured and unstructured logs?',
 o:['Structured logs are machine-parsable key-value records (often JSON), making filtering and aggregation possible; unstructured logs are free text','Structured logs are binary','Unstructured logs are always better','They are the same'],a:0,
 e:'Structured logs make queries like "all requests for tenant=acme with status=500 in the last hour" trivial in a log platform, whereas free-text logs need fragile parsing rules.'},

{q:'What does health checking contribute to observability?',
 o:['Deep diagnostics','A fast, coarse signal used by load balancers and orchestrators to route traffic and restart instances','Detailed tracing','Long-term metrics storage'],a:1,
 e:'Health checks should be cheap and reflect the ability to serve, not run deep dependency tests. Deep diagnostics belong in metrics and traces, not in a check called every few seconds.'},

{q:'Why might you sample traces in production?',
 o:['Because traces are illegal in production','To keep storage and processing cost bounded while retaining a statistically useful view, often with tail-based sampling to keep all error traces','Because traces are inaccurate','Because spans are encrypted'],a:1,
 e:'Head-based sampling decides at the start and is cheap but can miss rare errors. Tail-based sampling buffers the whole trace and keeps slow or failed ones, which is better for debugging at a cost.'},

/* 69–80: Deployment & infrastructure */
{q:'What is the difference between a blue-green and a canary deployment?',
 o:['They are the same','Blue-green switches all traffic between two complete environments; canary shifts a small percentage of traffic to the new version and gradually increases it','Blue-green requires Kubernetes','Canary requires a service mesh'],a:1,
 e:'Blue-green gives instant rollback at the cost of double infrastructure. Canary limits blast radius but exposes real users to the new version from the start, so strong observability is essential.'},

{q:'What problem does a service mesh such as Istio or Linkerd solve?',
 o:['It stores data','It provides mTLS, traffic management, retries, timeouts and telemetry consistently across all services, usually via sidecar proxies','It replaces Kubernetes','It provides a database'],a:1,
 e:'A mesh externalises network concerns so applications do not need language-specific libraries. The trade-off is an extra hop per request and a significant new operational surface.'},

{q:'Why is running one service per container the norm?',
 o:['Containers cannot run more than one process','It keeps the unit of deployment aligned with the service, enables independent scaling, and simplifies logging and lifecycle management','It reduces image size','It is required by Docker'],a:1,
 e:'A sidecar for cross-cutting concerns (proxy, log shipper) is a deliberate exception. Packing unrelated services into one container defeats independent deployability and scaling.'},

{q:'What is the twelve-factor app?',
 o:['A container runtime','A methodology for building portable, cloud-native apps covering config, logs, processes, disposability and dev/prod parity','A Kubernetes distribution','A CI tool'],a:1,
 e:'The twelve factors include configuration in the environment, stateless processes, treat logs as event streams and strict build/release/run separation. They map naturally onto containerised microservices.'},

{q:'Which twelve-factor principle best supports horizontal scaling?',
 o:['Store all state on local disk','Keep processes stateless and store state in backing services such as databases and caches','Log to files','Bake config into the image'],a:1,
 e:'Stateless processes can be killed and replaced anywhere. This is what allows rolling deployments, autoscaling and node failures to be handled without data loss.'},

{q:'How should configuration differ between environments?',
 o:['Different code builds per environment','The same build artifact, with configuration injected through environment variables or a config service','A separate repository per environment','Hard-coded values'],a:1,
 e:'One artifact promoted through environments removes "works in staging" surprises. Config lives in the environment, and secrets come from a dedicated secret manager.'},

{q:'What does the sidecar pattern add to a Pod or container group?',
 o:['A backup database','A helper process deployed alongside the main container sharing its network or volumes, for example a proxy, log shipper or cert refresher','A second scheduler','A second operating system'],a:1,
 e:'Sidecars let cross-cutting concerns be implemented once, in a language-independent way. The cost is extra resource consumption and another process to operate.'},

{q:'What is the main challenge of autonomous deployment across many services?',
 o:['Container images are too large','Coordinating API version compatibility and configuration across teams that deploy on their own schedule','DNS','TLS certificates'],a:1,
 e:'Independent deployability only works if contracts are backward compatible. Expand-and-contract versioning, consumer-driven contract tests and feature flags are the standard tools.'},

{q:'Why is a container image tag such as "latest" unsuitable for production?',
 o:['It is a reserved tag','It is mutable and does not identify a specific build, so deployments are not reproducible and rollbacks are unreliable','It is compressed','It is not allowed in Kubernetes'],a:1,
 e:'Immutable identifiers — a version tag or, ideally, an image digest — make it possible to say exactly what is running and roll back to the same artifact.'},

{q:'What is GitOps?',
 o:['Storing code in Git','Using Git as the single source of truth for declarative infrastructure and application state, with an in-cluster agent continuously reconciling the cluster to match','A branch strategy','A CI tool'],a:1,
 e:'Tools such as Argo CD and Flux watch a repository and apply changes. Benefits include an auditable history and drift detection, since any manual cluster change is reverted to the declared state.'},

{q:'What is a rollout strategy\'s main risk with a stateful service?',
 o:['It cannot be versioned','Schema and data compatibility between old and new versions running simultaneously, plus single-writer constraints such as leader election','It requires a service mesh','It cannot use containers'],a:1,
 e:'Stateful services need expand-and-contract schema changes, careful data migration and awareness that two versions may run at once. Leader election prevents two primaries but not schema incompatibility.'},

/* 81–90: Security */
{q:'How is authentication typically handled in a microservices architecture?',
 o:['Each service validates user passwords against a shared user table','An identity provider issues a signed token (such as JWT) at the edge, and downstream services verify its signature and claims','Users authenticate to every service separately','Passwords are forwarded in headers'],a:1,
 e:'Centralised identity avoids duplicated credential stores. Each service validates the token locally, then makes authorisation decisions on the claims rather than calling the identity provider on every request.'},

{q:'What is the difference between authentication and authorisation?',
 o:['They are the same','Authentication proves who the caller is; authorisation decides what that identity may do','Authorisation happens first','Authentication only applies to humans'],a:1,
 e:'A valid token authenticates the caller, but it does not mean the caller may read every order. Authorisation is usually enforced per service, at the resource and action level.'},

{q:'What does mTLS provide between services?',
 o:['Compression','Mutual authentication where both client and server present certificates, plus encryption in transit','Rate limiting','Load balancing'],a:1,
 e:'mTLS gives cryptographic service identity, which is the foundation of zero-trust networking. Service meshes typically rotate certificates automatically and use SPIFFE-style identities.'},

{q:'Why should a service not trust a user identity passed as a plain header?',
 o:['Headers are too slow','Because any client able to reach the service could forge it, unless the network is locked down and the header is injected by a trusted gateway','Because headers are limited in size','Because headers are encrypted'],a:1,
 e:'Internal networks are not automatically trusted. The edge should strip client-supplied identity headers and inject verified identity, and services should require mTLS or a signed token.'},

{q:'What is the principle of least privilege in service-to-service access?',
 o:['Every service can call every other service','Each service is granted only the specific permissions it needs, on specific resources and actions, and nothing more','Only admins can call services','Services need no permissions'],a:1,
 e:'With a mesh, least privilege can be enforced as per-service authorisation policy. With IAM, it means scoped roles per service rather than a shared broad credential.'},

{q:'How should secrets be managed for microservices?',
 o:['Baked into the image','Stored in a central secret manager and injected at runtime, with rotation and audit; never committed to source or baked into images','Plain environment variables committed to Git','Shared in a wiki'],a:1,
 e:'Hashicorp Vault, AWS Secrets Manager and Kubernetes Secrets with external providers are common. Environment variables are convenient but visible in process listings, so short-lived, injected credentials are preferred.'},

{q:'What is a common threat from an overly permissive API gateway?',
 o:['It encrypts too much','It becomes a single point of both entry and privilege escalation if any token that reaches it is trusted for every route','It cannot route','It slows down'],a:1,
 e:'The gateway must enforce route-level authorisation, not just authentication. A valid token should not grant access to endpoints outside the caller\'s scope, and per-route policy must be explicit.'},

{q:'What does "zero trust" mean for internal service calls?',
 o:['Trust everything inside the VPC','Never trust implicitly based on network location; authenticate and authorise every request, encrypt in transit, and apply least privilege','Disable firewalls','Trust only administrators'],a:1,
 e:'Zero trust assumes the internal network may be compromised. mTLS for identity, per-request authorisation and least privilege replace the old castle-and-moat model.'},

{q:'Why is input validation still required in each service, not just at the gateway?',
 o:['Because gateways are slow','Because services may be reachable by other internal callers, and defense in depth means each service must not assume its inputs are already sanitised','Because the gateway cannot read JSON','Because validation is free'],a:1,
 e:'A gateway protects one path in. Other services, batch jobs and admin tools may reach the service directly, so validating inputs at the service boundary is essential.'},

{q:'What is the risk of a shared signing key across all services?',
 o:['It slows down verification','A single leak compromises every service, and it prevents per-service rotation or revocation','It doubles CPU','It prevents JWT use'],a:1,
 e:'Per-service keys or a short-lived token exchange with an identity provider limit blast radius. Key rotation and revocation are much harder when everyone shares one secret.'},

/* 91–100: Operations & antipatterns */
{q:'What is the most reliable way to detect a partial outage in a microservices system?',
 o:['Waiting for user complaints','Synthetic checks plus SLO-based alerting on error rate and latency per endpoint, combined with dependency health','Reading logs manually','Restarting everything'],a:1,
 e:'SLO burn-rate alerts fire before the user-visible error budget is exhausted. Synthetic probes catch failures that internal health checks miss, especially at the edge.'},

{q:'Why is a shared database usually considered an anti-pattern?',
 o:['It is too expensive','It couples services at the schema level, so any change requires coordinated releases and breaks independent deployability','It is slower than per-service databases','It cannot be backed up'],a:1,
 e:'Sharing a schema also encourages bypassing the owning service\'s business rules. The usual answer is database-per-service with integration through APIs or events.'},

{q:'What is the "distributed transaction via 2PC across services" risk profile?',
 o:['It is strongly recommended','It requires a coordinator and locking across services, which is fragile and blocks under failures, so most architectures prefer sagas','It is faster than local transactions','It works only with Kafka'],a:1,
 e:'2PC is synchronous and can leave participants blocked if the coordinator fails. Sagas, outbox and idempotent compensation are the standard alternatives in microservices.'},

{q:'What is a "shared library" antipattern in microservices?',
 o:['Any library dependency','A library that contains business logic and forces many services to redeploy in lockstep, recreating monolith coupling','A logging library','An HTTP client'],a:1,
 e:'Infrastructure libraries are fine. Business logic in a shared library couples release cycles and is best extracted into a service or duplicated deliberately with clear ownership.'},

{q:'What does "team owns the full lifecycle" mean in microservices?',
 o:['Developers only write code','The team builds, deploys, operates and on-calls for its services, owning both features and reliability','Operations owns everything','The platform team owns everything'],a:1,
 e:'You build it, you run it. Ownership creates the feedback loop that drives reliability work and makes independent deployment meaningful, but it requires platform investment to be sustainable.'},

{q:'What is a platform team\'s role in a microservices organisation?',
 o:['To write all the services','To provide self-service infrastructure, deployment pipelines, observability and guardrails so product teams can operate independently','To approve every deploy','To own all databases'],a:1,
 e:'A good platform reduces cognitive load, for example with golden paths for service scaffolding, CI templates and built-in telemetry. Bad platforms become gatekeepers and slow everyone down.'},

{q:'What is the "service per team" guideline?',
 o:['Each team must own exactly one service','A service should be small enough for one team to own end to end, and a team should not be split across so many services it cannot operate them','Teams should own no services','Services should own teams'],a:1,
 e:'The number of services per team must stay operable. Too many and on-call load and cognitive overhead explode; too few and you have not gained much from the architecture.'},

{q:'What is a common sign that services should be merged back together?',
 o:['They share a database','They are so chatty and tightly coupled that every change requires coordinated deploys, and a single team owns both','They use different languages','They have separate CI pipelines'],a:1,
 e:'Merging is not a failure; it is a correction. Service boundaries are hypotheses, and the right number of services is the smallest number that satisfies the autonomy and scaling needs.'},

{q:'What is the "API versioning" strategy that avoids breaking consumers?',
 o:['Change the API in place and hope nobody notices','Expand and contract: add new fields or endpoints, support both versions, migrate consumers, then remove the old one','Rename the service','Use a new database'],a:1,
 e:'Tolerant readers on the consumer side, additive changes, feature flags and a deprecation window are the standard mechanics. Breaking changes should be rare and announced well in advance.'},

{q:'What is a consumer-driven contract test?',
 o:['A load test','A test where consumers publish their expectations of a provider, and the provider\'s build fails if it violates them','A security scan','A performance benchmark'],a:1,
 e:'Pact and Spring Cloud Contract are common tools. They catch breaking changes in the producer\'s CI before deployment, without needing a full end-to-end environment for every pair of services.'},

{q:'Which practice most directly improves the ability to debug a production incident across services?',
 o:['Longer log retention only','Consistent correlation ids, structured logs, trace context propagation and per-service dashboards linked by trace id','Running everything on one host','Disabling alerts'],a:1,
 e:'The goal is to move from symptom to cause in minutes. That requires the same identifiers across logs, metrics and traces, plus dashboards that let you pivot from an SLO breach to a specific failing dependency.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Microservices Mock Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
