<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apache Kafka Mock Test — Set 3 · 100 MCQs</title>
<style>
  :root{
    --brand:#7c2d12;
    --brand-dark:#431407;
    --accent:#f97316;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#2b0a00;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ffedd5;border-color:#fed7aa}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(124,45,18,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#fff7ed}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ffedd5}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">📨 Apache Kafka Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SET 3 · 100 Apache Kafka MCQs
   o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [

/* ---------- 1–15 : Event-driven design patterns ---------- */
{q:"What problem does the transactional outbox pattern solve?",
 o:["Atomically updating a database and publishing the corresponding Kafka event","Compressing large events","Encrypting producer traffic","Replicating topics across clusters"],a:0,
 e:"The service writes the business change and an outbox row in the same database transaction. A separate relay then reads the outbox and publishes to Kafka, eliminating the classic dual-write problem where the DB commit succeeds but the publish fails."},

{q:"How does change data capture (CDC) differ from the outbox pattern?",
 o:["CDC reads the database transaction log directly; the outbox pattern writes explicit outbox rows","CDC only works with Kafka Streams","CDC requires no database","They are identical"],a:0,
 e:"CDC tools such as Debezium consume the binlog/WAL and emit every committed change, so no application code changes are needed. The outbox pattern gives finer control over which events are published."},

{q:"In a saga implemented with choreography over Kafka, how is compensation triggered?",
 o:["Each service listens for failure events and publishes its own compensating event","A central orchestrator calls every service synchronously","The database rolls back all services automatically","Kafka's transaction coordinator rolls back business data"],a:0,
 e:"Choreography is decentralised: services react to events. On failure, each participant emits a compensating event (for example, release inventory, refund payment) to undo prior steps."},

{q:"What is the key difference between saga choreography and saga orchestration?",
 o:["Choreography is event-driven and decentralised; orchestration uses a central coordinator issuing commands","Orchestration requires no Kafka","Choreography cannot use Kafka topics","Orchestration only works with exactly-once"],a:0,
 e:"Choreography is simpler to start but harder to reason about at scale. Orchestration centralises the workflow state, making complex multi-step sagas easier to observe and debug."},

{q:"In event sourcing, what is the source of truth?",
 o:["The immutable stream of events, with current state derived by replaying them","The current row in a relational table","A nightly snapshot only","A Redis cache"],a:0,
 e:"State is a projection over the event log. You can rebuild any projection by replaying, add new read models later, and audit exactly how state evolved."},

{q:"How does CQRS typically use Kafka?",
 o:["Commands write to a store and events are published so separate read models can be projected","Kafka replaces all write databases","CQRS forbids event streaming","Kafka is used only for archiving"],a:0,
 e:"CQRS separates the write model from one or more read models. Kafka carries domain events from the write side so each read model can build its own optimised projection."},

{q:"Which pattern ensures a Kafka consumer can safely process the same record twice?",
 o:["Idempotent consumer — the effect of processing is the same on replay","Disabling offsets","Using acks=0","Randomising partition assignment"],a:0,
 e:"At-least-once delivery means duplicates are possible. Idempotency is usually implemented with a deduplication table keyed on the record's business id or offset, or by using naturally idempotent upserts."},

{q:"What is a dead letter topic in a Kafka consumer pipeline?",
 o:["A topic that receives records that repeatedly fail processing","A topic for expired records","A topic with zero partitions","A broker's internal error log"],a:0,
 e:"Routing poison records to a DLQ keeps the main consumer progressing. The DLQ preserves the original payload and error context so the record can be inspected, fixed and replayed later."},

{q:"Which is a sound strategy for handling a poison message that crashes the consumer?",
 o:["Retry a bounded number of times, then route to a DLQ with error metadata","Ignore the error and commit the offset","Disable the consumer group","Delete the whole partition"],a:0,
 e:"Bounded retries with backoff distinguish transient failures from permanent ones. Once the limit is hit, the DLQ captures the record so the pipeline is not blocked indefinitely."},

{q:"What is event-carried state transfer?",
 o:["Events include enough state that consumers do not need to call back to the producer's service","Events carry only an id reference","Events are deleted after one read","Events are stored in ZooKeeper"],a:0,
 e:"Embedding the relevant state in the event removes runtime coupling and reduces synchronous calls, at the cost of larger events and possible data duplication."},

{q:"How is request-reply commonly implemented over Kafka?",
 o:["A reply topic plus a correlation id and a return address in the message headers","By calling the broker's HTTP endpoint","Using ZooKeeper as a mailbox","By using consumer group offsets as reply channels"],a:0,
 e:"The requester sets a unique correlation id and a reply-to header, listens on its reply topic, and matches the response. It is asynchronous and scales well but is more complex than plain fire-and-forget."},

{q:"How does a Kafka log differ from a traditional message queue?",
 o:["Records persist after being read, and many independent consumers can read the same records at their own pace","Records are deleted as soon as one consumer reads them","Kafka has no concept of offsets","Kafka cannot guarantee ordering"],a:0,
 e:"Kafka is a distributed log: retention is time- or size-based, not read-based. This enables replay, multiple independent consumer groups and stream processing over the same data."},

{q:"Which design is generally better: one topic per event type, or one topic for everything?",
 o:["One topic per event type, so schema, retention and partitioning can be tuned per stream","A single global topic, to simplify configuration","One topic per consumer group","One topic per broker"],a:0,
 e:"Separate topics give independent retention, partitioning, ACLs and schema evolution. A giant shared topic makes those trade-offs impossible and couples unrelated consumers."},

{q:"What is a common convention for Kafka topic naming?",
 o:["Domain.aggregate.event with an environment prefix and a version suffix","Random UUIDs","Consumer group name plus timestamp","Broker id"],a:0,
 e:"Something like prod.orders.order-created.v2 makes ownership, environment and version explicit. Consistency across teams is more valuable than any specific scheme."},

{q:"Which is the main reason to use Kafka instead of synchronous REST calls between services?",
 o:["Decoupling in time and availability: producers are not blocked by consumer downtime","Kafka reduces data volume","Kafka guarantees responses in order","Kafka replaces the need for a database"],a:0,
 e:"Events buffer in Kafka while consumers are unavailable. Services become loosely coupled, but the trade-off is eventual consistency and greater operational complexity."},

/* ---------- 16–30 : Serialization & Schema Registry ---------- */
{q:"What does Schema Registry primarily provide?",
 o:["Centralised storage and versioning of schemas with compatibility enforcement","Message compression","Consumer offset storage","Broker configuration management"],a:0,
 e:"Producers register a schema and receive an id; consumers fetch the schema by id. The registry enforces compatibility rules on new versions so producers and consumers can evolve safely."},

{q:"Which compatibility mode allows new consumers to read old data but not the reverse?",
 o:["BACKWARD","FORWARD","FULL","NONE"],a:0,
 e:"BACKWARD compatibility means a new schema can read data written with the previous schema — the common choice when you upgrade consumers first. FORWARD is the mirror image; FULL requires both."},

{q:"Which compatibility mode allows rolling upgrades in either direction?",
 o:["FULL","BACKWARD","FORWARD","NONE"],a:0,
 e:"FULL requires the new schema to be able to read old data and old data to be readable by the new schema. FULL_TRANSITIVE extends this across all previous versions, not just the immediate predecessor."},

{q:"How is the schema id transmitted in a Schema Registry message?",
 o:["As a magic byte plus a 4-byte schema id prepended to the payload","In a Kafka header only","In the record key","It is not transmitted"],a:0,
 e:"The wire format is a magic byte (0), then 4 bytes of schema id, then the serialized payload. Consumers read the id, fetch the schema (usually cached) and deserialize."},

{q:"Which change is backward compatible for an Avro schema?",
 o:["Adding a new field with a default value","Removing a required field","Renaming a field without an alias","Changing a field type from int to string"],a:0,
 e:"Adding a field with a default is safe because old data simply uses the default. Removing a required field, renaming without an alias, or changing types breaks readers."},

{q:"Which serialization format embeds the schema in every message and is therefore verbose?",
 o:["JSON without a schema registry","Avro with Schema Registry","Protobuf with Schema Registry","None — all formats are equally compact"],a:0,
 e:"Raw JSON repeats field names in every record. Avro and Protobuf use compact binary encodings, and Schema Registry avoids sending the full schema with each message."},

{q:"What is a subject in Schema Registry?",
 o:["A namespace under which schema versions are tracked, usually topic-name or topic-name-key","A topic partition","A consumer group","A broker rack"],a:0,
 e:"The default subject strategy is TopicNameStrategy (topic-value and topic-key). RecordNameStrategy lets different record types share a topic, and TopicRecordNameStrategy combines both."},

{q:"What happens when a producer registers a schema that violates the subject's compatibility rule?",
 o:["Registration is rejected and the producer cannot publish","The registry silently accepts it","The topic is deleted","Existing consumers are killed"],a:0,
 e:"The registry returns a 409 error. This fail-fast behaviour is what protects consumers from data they cannot deserialize."},

{q:"Why is Avro often preferred with Schema Registry for Kafka?",
 o:["Compact binary encoding, strong schema evolution support and a well-defined default-value model","It is human-readable","It requires no schema","It compresses better than gzip"],a:0,
 e:"Avro is compact, has mature resolution rules for reader/writer schema mismatches, and integrates cleanly with the registry. Protobuf and JSON Schema are also supported."},

{q:"What does a Serde combine in Kafka Streams?",
 o:["A serializer and a deserializer for the same type","Two different topics","A producer and a consumer group","A stream and a table"],a:0,
 e:"Serdes are used throughout the Streams DSL — for keys, values, state stores and repartition topics. Configure them with StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG and the value equivalent."},

{q:"What is the recommended way to handle deserialization failures in a consumer?",
 o:["Configure an error-handling deserializer that routes bad records to a DLQ","Let the consumer crash repeatedly","Skip the record without logging","Disable the schema registry"],a:0,
 e:"An ErrorHandlingDeserializer wraps the real deserializer and, on failure, passes a record with the error details so the application can log it and send it to a dead letter topic."},

{q:"Which is a valid reason to use Protobuf over Avro?",
 o:["Strongly typed code generation across many languages and efficient field-presence semantics","Protobuf does not need a schema registry","Protobuf is text-based","Protobuf has no compatibility rules"],a:0,
 e:"Protobuf is widely used in gRPC ecosystems and has excellent multi-language tooling. Both formats work with Schema Registry and support compatibility enforcement."},

{q:"What does the schema id cache in a producer avoid?",
 o:["A network round trip to Schema Registry for every message","Recompressing each batch","Retrying failed sends","Fetching broker metadata"],a:0,
 e:"Producers and consumers cache schema id to schema mappings. The registry is consulted on cache misses or after a schema change."},

{q:"Why should the key and value schemas be registered separately?",
 o:["They evolve independently and use separate subjects such as topic-key and topic-value","Kafka requires exactly two schemas per topic","Keys are always Avro and values JSON","It halves storage cost"],a:0,
 e:"Separate subjects let the value schema evolve without touching the key's compatibility contract, and allow different formats for key and value if needed."},

/* ---------- 31–45 : ksqlDB & Streams patterns ---------- */
{q:"What is a persistent query in ksqlDB?",
 o:["A continuously running query that writes results to a new stream or table","A query that runs once and returns rows","A query that only reads from a table","A scheduled backup job"],a:0,
 e:"CREATE STREAM ... AS SELECT ... starts a persistent query that keeps processing new records and emitting results to the target topic, until explicitly terminated."},

{q:"In ksqlDB, how does a STREAM differ from a TABLE?",
 o:["A STREAM is an append-only sequence of events; a TABLE is a changelog of the latest value per key","A TABLE is append-only and a STREAM is mutable","They are identical","A STREAM cannot be queried"],a:0,
 e:"A STREAM is like a KStream — every record is a new event. A TABLE is like a KTable — a new record updates the current value for its key."},

{q:"What is the difference between push and pull queries in ksqlDB?",
 o:["Push queries stream continuous updates to the client; pull queries return the current value once","Push queries run only at startup","Pull queries require no server","They are the same thing"],a:0,
 e:"Push queries (EMIT CHANGES) stay open and deliver new results as they arrive. Pull queries look up the current state of a materialised table, like a key-value GET."},

{q:"What does EMIT CHANGES do in a ksqlDB push query?",
 o:["Keeps the query open and streams each new result to the client","Buffers results until the query ends","Emits only the final aggregation","Disables windowing"],a:0,
 e:"Without EMIT CHANGES, a SELECT on a stream returns current data and closes. With it, you get a live feed of updates."},

{q:"What is the main purpose of a windowed aggregation in ksqlDB or Streams?",
 o:["Computing aggregates over fixed or sliding time intervals and emitting per-window results","Reducing the number of partitions","Compressing the log","Avoiding rebalances"],a:0,
 e:"Windowing turns an unbounded stream into finite buckets — for example orders per minute — producing a result for each window as it closes."},

{q:"What is the difference between a tumbling and a hopping window?",
 o:["Tumbling windows do not overlap; hopping windows overlap and can start at regular intervals","Hopping windows do not overlap","Tumbling windows only work on tables","They are identical"],a:0,
 e:"A tumbling window of 5 minutes produces one non-overlapping bucket every 5 minutes. A hopping window of 5 minutes with a 1-minute advance produces overlapping buckets every minute."},

{q:"How does a session window decide where a window ends?",
 o:["It closes after a configurable period of inactivity for a key","It closes at midnight","It closes after exactly N records","It never closes"],a:0,
 e:"Session windows group events that occur close together in time. The gap duration defines how long the stream must be quiet before the session is considered complete."},

{q:"What is the grace period in a windowed operation?",
 o:["How long after a window ends late records are still accepted into it","The time allowed for a rebalance","The retry backoff for producers","The session timeout for consumers"],a:0,
 e:"Without a grace period, a window result could be emitted and then immediately invalidated by a late record. The grace period defines the cut-off after which results are final."},

{q:"What happens to a record that arrives after its window's grace period has expired?",
 o:["It is dropped from that window's aggregation","It creates a new window retroactively","It crashes the stream processor","It is written to ZooKeeper"],a:0,
 e:"Late records beyond the grace period are discarded for windowing purposes. Monitor a dropped-records metric if late data is expected to be significant."},

{q:"How does Kafka Streams advance stream time?",
 o:["It tracks the maximum timestamp observed per task","It uses the wall clock of the broker","It uses the consumer group coordinator's clock","It never advances"],a:0,
 e:"Stream time is a monotonic watermark derived from record timestamps. It drives window closure and suppression, and is independent of wall-clock time."},

{q:"Which state store type gives ordered range scans by key?",
 o:["KeyValueStore with a RocksDB backing, supporting range() and reverseRange()","A queue store","An in-memory set only","A windowed store without keys"],a:0,
 e:"RocksDB key-value stores support ordered iteration, which enables range queries, prefix scans and efficient lookups for joins."},

{q:"What is a window store used for in Kafka Streams?",
 o:["Keeping records indexed by key and time window for windowed aggregations and joins","Storing offsets only","Caching consumer group metadata","Storing broker configuration"],a:0,
 e:"Window stores retain records per key within a time range, enabling windowed joins and windowed aggregations with correct retention semantics."},

{q:"What does StreamsBuilder.topology.optimization=all enable?",
 o:["Topology optimisation, which removes redundant repartition topics and fuses processors","Faster network transfer","Automatic schema evolution","Cluster autoscaling"],a:0,
 e:"Topology optimisation can eliminate unnecessary repartitioning when the key is already correct, significantly reducing network and storage overhead."},

{q:"Why is exactly-once processing to an external system like a database difficult?",
 o:["Kafka transactions cover Kafka writes and offsets, not the external system's write","Kafka cannot do transactions at all","Databases do not support transactions","Exactly-once is impossible everywhere"],a:0,
 e:"Kafka's EOS guarantees apply inside Kafka. For external systems you need idempotent writes, a two-phase commit connector, or the consume-transform-produce pattern combined with a deduplication key."},

/* ---------- 46–60 : Performance tuning & capacity planning ---------- */
{q:"Which two producer settings have the biggest impact on throughput?",
 o:["batch.size and linger.ms","acks and retries","max.request.size and request.timeout.ms","client.id and partitioner.class"],a:0,
 e:"Larger batches amortise network and broker overhead. Pairing a bigger batch.size with a non-zero linger.ms is the classic throughput optimisation."},

{q:"On a broker, what is the most effective way to reduce disk read latency for consumers?",
 o:["Ensure the working set fits in the OS page cache","Increase the JVM heap","Reduce num.io.threads","Disable compression"],a:0,
 e:"Kafka serves reads from the page cache when data is hot. Sizing broker memory generously, and avoiding a huge heap that competes with the page cache, is critical."},

{q:"Why is a very large JVM heap usually counterproductive for a Kafka broker?",
 o:["It leaves less RAM for the page cache and increases GC pause times","Kafka cannot run with more than 4 GB","It disables zero-copy","It breaks replication"],a:0,
 e:"Kafka does not cache messages on the heap. A 6–8 GB heap is typical; the rest of RAM should back the page cache, with G1 or ZGC keeping pauses short."},

{q:"How many partitions should a topic generally have?",
 o:["Enough to saturate the required throughput per broker while leaving headroom and limiting per-partition overhead","Exactly one","Exactly the number of brokers","As many as possible"],a:0,
 e:"Partitions determine parallelism, but each one costs file handles, memory and controller work. Start from throughput per partition, then add headroom for growth."},

{q:"What is a practical rule of thumb for the upper bound on partitions per broker?",
 o:["A few thousand, depending on hardware, but always validated by benchmarking","Exactly 10","Exactly 100","Unlimited, with no cost"],a:0,
 e:"Modern brokers can handle several thousand partitions each, but controller failover, metadata size and rebalance time all scale with partition count. Benchmark your own workload."},

{q:"Which compression codec is generally the best balance of ratio and CPU for Kafka?",
 o:["zstd or lz4","gzip only","No compression","bzip2"],a:0,
 e:"lz4 is very fast with moderate compression, while zstd gives a better ratio for a small CPU cost. gzip compresses well but is CPU-heavy; bzip2 is not a supported Kafka codec."},

{q:"What does the kafka-producer-perf-test.sh measure?",
 o:["Throughput and latency of produced records against a real cluster","Broker disk usage","Schema compatibility","Consumer group state"],a:0,
 e:"It reports records/sec, MB/sec and latency percentiles, making it the standard first step when sizing a cluster or validating a change."},

{q:"Which OS-level setting commonly causes long GC-like stalls in Kafka?",
 o:["Swap activity caused by a too-high vm.swappiness","Too many open file descriptors","SELinux enforcing","IPv6 enabled"],a:0,
 e:"Swapping the page cache destroys read performance. Set vm.swappiness low, and consider vm.overcommit_memory and dirty-ratio tuning for write-heavy brokers."},

{q:"What does the dirty page ratio control on a Kafka host?",
 o:["How much dirty memory the kernel may accumulate before flushing to disk","The number of dirty log segments","The ratio of dirty to clean records","The compression dirty ratio"],a:0,
 e:"Very high dirty ratios cause long write stalls when the kernel flushes. Kafka deployments often tune vm.dirty_ratio and vm.dirty_background_ratio to keep flush pauses short."},

{q:"Why is XFS commonly recommended for Kafka log directories?",
 o:["It handles large files and concurrent appends well and has predictable performance","It compresses data automatically","It provides built-in replication","It is required by Kafka"],a:0,
 e:"XFS is generally the recommended filesystem for Kafka, with ext4 also acceptable. Avoid network filesystems for log.dirs — latency and locking behaviour break Kafka's I/O assumptions."},

{q:"What is the consequence of running Kafka log directories on NFS?",
 o:["Unpredictable latency and locking issues that can corrupt or stall the broker","Kafka automatically increases replication","Throughput improves","It is the recommended deployment"],a:0,
 e:"Kafka requires local block storage semantics for appends, index files and fsync. Network filesystems break those assumptions and can cause data loss."},

{q:"When sizing a cluster for retention, which calculation matters most?",
 o:["Incoming bytes/sec × retention seconds × replication factor ÷ per-broker usable disk","Number of topics × number of consumers","Number of partitions × broker count","Producer batch size × acks"],a:0,
 e:"That gives total raw storage; dividing by usable disk per broker gives the broker count for storage. Throughput per broker is a separate constraint, and you take the larger of the two."},

{q:"Which consumer-side change most directly increases parallelism?",
 o:["Increasing the number of partitions and running one consumer per partition","Increasing fetch.max.wait.ms","Increasing max.poll.interval.ms","Enabling compression"],a:0,
 e:"Consumers beyond the partition count sit idle. If you need more parallelism, add partitions first, then scale consumers, and remember that adding partitions reshuffles key mapping."},

{q:"What does max.connections.per.ip protect against?",
 o:["A single host exhausting broker connection resources","Exceeding the replication factor","Running out of disk","Schema incompatibility"],a:0,
 e:"Connection limits prevent one misbehaving client host from starving others. Related limits include max.connections and max.connections.per.ip.overrides."},

{q:"Which broker metric most directly indicates network thread saturation?",
 o:["NetworkProcessorAvgIdlePercent trending near zero","ActiveControllerCount","LogFlushRateAndTimeMs","UnderReplicatedPartitions"],a:0,
 e:"Low network thread idle time means the broker is network-I/O bound. Remedies include raising num.network.threads, enabling compression, or spreading load across more brokers."},

/* ---------- 61–75 : Troubleshooting ---------- */
{q:"A consumer group rebalances continuously with no apparent crash. What is the most likely cause?",
 o:["Processing regularly exceeds max.poll.interval.ms so consumers keep getting evicted","The producer is using acks=1","The topic has too few partitions","Compression is enabled"],a:0,
 e:"Each eviction triggers a rebalance, which resets the cycle. Reduce max.poll.records, move heavy work off the poll thread, or raise max.poll.interval.ms."},

{q:"Producers intermittently fail with TimeoutException but the broker looks healthy. What should you check first?",
 o:["Whether delivery.timeout.ms and request.timeout.ms are large enough relative to ISR catch-up","The consumer group offsets","The schema registry version","The number of partitions"],a:0,
 e:"With acks=all a slow follower can delay acknowledgement. Ensure request.timeout.ms exceeds replica.lag.time.max.ms and that delivery.timeout.ms accounts for retries."},

{q:"UnderReplicatedPartitions stays above zero. Which is NOT a plausible cause?",
 o:["A consumer group with too many members","A broker that is down","A follower that cannot keep up with the leader's write rate","Network problems between brokers"],a:0,
 e:"Consumer group size has no effect on replication. Replication is broker-to-broker, so look at broker health, disk throughput and inter-broker networking."},

{q:"A broker's disk is full and producers see NotEnoughReplicasException. What is the safest immediate action?",
 o:["Free space by applying retention or deleting old segments on that broker, then let replicas catch up","Delete the topic across the cluster","Restart every broker","Disable replication"],a:0,
 e:"Restoring disk space allows the broker to rejoin the ISR. Long-term fixes include retention tuning, tiered storage, and adding brokers before disks fill."},

{q:"A broker will not start after a hard crash. Which log should you read first?",
 o:["server.log, plus the broker's stdout for the exact startup exception","The consumer group offsets","The producer's client logs","The schema registry log"],a:0,
 e:"Common culprits are a corrupt log directory, a mismatched cluster.id in KRaft, a port conflict, or a bad configuration change. The startup stack trace identifies which."},

{q:"Consumers suddenly throw OffsetOutOfRangeException. What are the likely causes?",
 o:["The committed offset was deleted by retention, or the group is new and has no valid offset","The producer compressed the batch","The broker restarted twice","The partition count was increased"],a:0,
 e:"The offset is outside the retained range. auto.offset.reset decides whether to jump to earliest or latest; a manual seek or offset reset may be required."},

{q:"Producers fail with RecordTooLargeException. Which settings must all be raised?",
 o:["Producer max.request.size, broker message.max.bytes, and broker replica.fetch.max.bytes","Only the consumer fetch size","Only the schema registry limit","Only the producer batch.size"],a:0,
 e:"The producer must be allowed to send it, the broker must accept it, and followers must be able to replicate it. Missing any one of the three causes failures."},

{q:"Consumer lag is growing steadily while broker metrics look normal. What is the most likely cause?",
 o:["Consumers cannot process records fast enough","The brokers are out of disk","Replication is broken","The schema registry is down"],a:0,
 e:"Healthy brokers with growing lag points at the consumer side: slow processing, blocking calls in the poll loop, or too few consumer instances for the partition count."},

{q:"Events appear out of order even though they share a key. What is the most likely cause?",
 o:["The producer retried without idempotence, allowing a later batch to be written first","The consumer committed offsets early","The topic has one partition","Compression reordered the batches"],a:0,
 e:"Non-idempotent retries with multiple in-flight requests can reorder records. Enable idempotence (which caps in-flight at 5 safely) or set max.in.flight to 1."},

{q:"A cluster shows repeated controller failovers. Which is a plausible cause?",
 o:["Controller GC pauses, network instability, or session timeouts on the controller","Too many consumer groups","A large batch.size on producers","Schema evolution"],a:0,
 e:"Controller churn stalls metadata operations. Fix the underlying cause — GC tuning, network stability, or raising controller session timeouts — rather than restarting blindly."},

{q:"In a KRaft cluster, clients intermittently fail to fetch metadata. What should you check?",
 o:["Whether the controller quorum has a stable leader and all voters are reachable","The producer's linger.ms","The consumer's auto.offset.reset","The schema registry's compatibility mode"],a:0,
 e:"Metadata comes from the controllers. A degraded quorum — too few reachable voters — prevents metadata changes and can stall client operations."},

{q:"A consumer occasionally processes the same record twice after a deploy. Why?",
 o:["The instance was shut down after processing but before committing its offset","The producer used acks=all","Idempotence was enabled","The topic was compacted"],a:0,
 e:"This is the normal at-least-once contract. Use idempotent processing, commit more frequently, or configure a graceful shutdown that commits before exit."},

{q:"Clients fail with an SSL handshake error while the broker appears healthy. What is a common cause?",
 o:["A certificate hostname mismatch, an untrusted CA, or an expired certificate","Too many partitions","A missing consumer group","An incorrect auto.offset.reset"],a:0,
 e:"Verify the truststore contains the right CA, the certificate SANs include the advertised hostname, and validity dates are current. Also confirm the listener's security protocol matches the client's."},

{q:"A producer gets TopicAuthorizationException. What is the most likely cause?",
 o:["The principal lacks WRITE or DESCRIBE on the topic in its ACLs","The topic does not exist","The broker is out of disk","Compression is misconfigured"],a:0,
 e:"The authorizer rejected the request. Grant the specific operations rather than broad ALL, and confirm the principal name matches what the SASL or TLS mechanism produces."},

{q:"Consumer lag is high but the group shows no active members. What does that indicate?",
 o:["No consumer is running; records are accumulating and will be read once a consumer rejoins","Replication has failed","The topic is being deleted","The brokers are down"],a:0,
 e:"The group exists with committed offsets but no members. Lag is computed against the log end offset, so it grows while nothing consumes. Start the consumer and it resumes from the last commit."},

/* ---------- 76–90 : Operations, KRaft & cluster management ---------- */
{q:"What is the recommended migration path from ZooKeeper to KRaft?",
 o:["Upgrade to a KRaft-capable version, migrate metadata, then roll brokers to KRaft mode","Drop and recreate the cluster from scratch","Delete ZooKeeper and restart brokers immediately","Run both modes permanently"],a:0,
 e:"Kafka provides a ZooKeeper-to-KRaft migration bridge that lets you move metadata while the cluster keeps serving traffic, then complete the cutover and decommission ZooKeeper."},

{q:"How many controller nodes should a production KRaft cluster have?",
 o:["Three or five, on dedicated nodes, matching the fault-tolerance requirement","One, to avoid complexity","Two, for symmetry","As many as there are brokers"],a:0,
 e:"Raft requires a majority. Three tolerates one failure; five tolerates two. Dedicated controllers isolate metadata work from data-plane load and give more predictable latency."},

{q:"What does a dynamic broker config let you do?",
 o:["Change certain broker settings at runtime via kafka-configs.sh without restarting","Change the JVM heap size live","Add new brokers automatically","Upgrade Kafka versions live"],a:0,
 e:"Configs like log.retention.ms, max.connections and replica.fetch.max.bytes are dynamic. Others, such as broker.id and listeners, still require a restart."},

{q:"What is the correct order for a rolling restart of a Kafka cluster?",
 o:["Restart one broker at a time, waiting for it to fully rejoin the ISR before moving on","Restart all brokers simultaneously for speed","Restart the controller first, then all brokers","Restart consumers first"],a:0,
 e:"Sequential restarts keep the replication factor satisfied throughout. Simultaneous restarts cause under-replication and can make partitions unavailable."},

{q:"Before decommissioning a broker, what must you do first?",
 o:["Reassign its partitions to other brokers and confirm the ISR is healthy","Delete the broker's log directories","Stop its consumers","Remove its ACLs"],a:0,
 e:"Moving partitions with kafka-reassign-partitions.sh (or Cruise Control) before shutdown prevents under-replication and avoids triggering unclean elections."},

{q:"After adding new brokers to a cluster, why is a reassignment usually needed?",
 o:["New brokers do not automatically receive partitions, so data and load stay on the old nodes","Kafka rebalances automatically and immediately","New brokers only accept reads","The controller ignores them"],a:0,
 e:"Kafka does not move existing partitions on its own. Reassignment (or an automated tool such as Cruise Control) is required to use the new capacity."},

{q:"What does Cruise Control's 'goals' configuration control?",
 o:["The optimisation objectives used to propose balanced partition and replica assignments","The number of brokers to add","The retention policy","The compression codec"],a:0,
 e:"Goals such as RackAwareGoal and DiskCapacityGoal define what 'balanced' means. Cruise Control computes an assignment that satisfies them and can execute it incrementally."},

{q:"Why is auto.create.topics.enable=false recommended in production?",
 o:["It prevents typos from silently creating misconfigured topics with broker defaults","It speeds up producer startup","It disables replication","It removes the need for ACLs"],a:0,
 e:"Auto-created topics get default partition and replication settings, which are often wrong, and miss schema and ACL setup. Explicit creation keeps the cluster intentional."},

{q:"What should you verify before deleting a production topic?",
 o:["That no producers or consumers depend on it, and that it is not a compacted changelog required for state restoration","Only that the name is spelled correctly","That the topic has no partitions","That consumers use acks=all"],a:0,
 e:"Deleting a changelog topic breaks Streams state restoration; deleting a live input topic breaks downstream consumers. Review dependencies and take a backup if the data matters."},

{q:"What does MirrorMaker 2 preserve that a naive copy would lose?",
 o:["Consumer group offsets (translated between clusters) and topic configuration","Schema compatibility","ACLs across clusters automatically","Broker ids"],a:0,
 e:"MM2 translates offsets so a consumer group can fail over to the replica cluster and resume from the correct position. It also mirrors topic configs and can check for cycles."},

{q:"Which replication topology gives the fastest recovery with the least data loss?",
 o:["Active-passive, with consumers able to fail over to the replica cluster","Active-active with bidirectional writes to the same keys","A single cluster with no replication","Nightly batch copies"],a:0,
 e:"Active-passive avoids write conflicts and keeps the replica cluster warm. Active-active is possible but requires careful key partitioning to prevent conflicts and duplicates."},

{q:"What is the main challenge with active-active multi-region Kafka?",
 o:["Handling conflicting updates and consumer offset translation between regions","Compression across regions","Schema registry replication","Disk sizing"],a:0,
 e:"Bidirectional replication means a record may loop or overwrite. Designs usually partition keys by region so a key is only ever written in one region."},

{q:"How are client quotas applied in Kafka?",
 o:["Per user, per client-id or per IP, limiting byte rate and request rate","Per topic partition only","Per broker only","Per consumer group offset"],a:0,
 e:"Quotas throttle misbehaving clients so they cannot starve others. They are configured with kafka-configs.sh and can include short-term default quotas for unknown clients."},

{q:"What happens when a client exceeds its quota?",
 o:["The broker deliberately delays responses, throttling the client rather than rejecting it","The client is disconnected permanently","The client's records are dropped","The topic is set read-only"],a:0,
 e:"Throttling is applied to the response so the client's own flow control backs off. Watch the throttle-time metrics to see who is being limited."},

{q:"Which is the correct way to change a topic's retention at runtime?",
 o:["kafka-configs.sh --alter --entity-type topics --add-config retention.ms=<value>","Edit server.properties and restart all brokers","Delete and recreate the topic","Change the consumer's auto.offset.reset"],a:0,
 e:"Topic-level configs override broker defaults and apply without a restart. Use --describe to confirm and --delete-config to fall back to the broker default."},

{q:"What does kafka-reassign-partitions.sh's --verify mode do?",
 o:["Checks whether a reassignment has completed and shows remaining replication lag","Validates the JSON syntax only","Deletes the reassignment","Restarts the brokers"],a:0,
 e:"Run --generate, review the plan, --execute it, then --verify until the reassignment completes and the ISR is healthy everywhere."},

/* ---------- 91–100 : Modern Kafka, Kubernetes & ecosystem ---------- */
{q:"What major change did Kafka 4.0 bring?",
 o:["ZooKeeper support was removed; KRaft is the only metadata mode","Transactions were removed","Partitions were made optional","Schema Registry was merged into the broker"],a:0,
 e:"Kafka 4.0 completes the KRaft transition. New clusters must use KRaft, and ZooKeeper-based clusters must be migrated before upgrading."},

{q:"What is a KRaft controller-only node?",
 o:["A node with process.roles=controller that manages metadata but does not store data","A broker with no partitions","A node that only runs ZooKeeper","A client-side metadata cache"],a:0,
 e:"Dedicated controllers isolate metadata traffic from data-plane load. They must still be provisioned with adequate CPU, memory and low-latency disks."},

{q:"Why should Kafka not run on the same nodes as other memory-hungry workloads?",
 o:["It needs most of the machine's RAM for the OS page cache to sustain reads","Kafka requires exclusive JVM access","It conflicts with container networking","It requires a dedicated filesystem"],a:0,
 e:"Kafka depends on the page cache. Competing workloads evict cached log data, forcing disk reads and destroying consumer read latency."},

{q:"What does Strimzi provide?",
 o:["A Kubernetes operator that manages Kafka clusters, topics, users and connectors as custom resources","A Kafka client library","A schema registry","A monitoring dashboard"],a:0,
 e:"Strimzi declares Kafka clusters via CRDs, handling StatefulSets, persistent volumes, rolling upgrades and certificate management for you."},

{q:"Which is a key consideration when running Kafka on Kubernetes?",
 o:["Ensuring stable broker identity and local persistent storage so partitions survive rescheduling","Using only ephemeral storage","Running all brokers in one pod","Disabling replication"],a:0,
 e:"StatefulSets give stable network identities. Local persistent volumes keep the log directories on fast disks, though they tie a broker to a node and complicate scaling."},

{q:"What is the benefit of tiered storage for a cluster with long retention?",
 o:["Older segments move to object storage, so retention no longer requires local disk capacity","It removes the need for replication","It disables compaction","It increases the partition count"],a:0,
 e:"Tiered storage lets you keep months of data cheaply while keeping recent data on fast local disk, decoupling retention from broker hardware."},

{q:"How do share groups (KIP-932) differ from traditional consumer groups?",
 o:["Multiple consumers may cooperatively consume the same partition with per-record acknowledgement","They disable offsets entirely","They only work with compacted topics","They require ZooKeeper"],a:0,
 e:"Share groups enable queue-style consumption across many consumers on the same partition, useful for work-queue workloads where strict partition ownership is not required."},

{q:"What is the KIP process used for in the Kafka project?",
 o:["Proposing and reviewing significant changes before they are implemented","Managing broker configuration","Scheduling cluster upgrades","Storing consumer offsets"],a:0,
 e:"A Kafka Improvement Proposal documents the motivation, design and compatibility impact of a change so the community can review it before code lands."},

{q:"Which scenario is a poor fit for Kafka?",
 o:["Low-volume, request-response workflows with strict sub-millisecond latency requirements","High-throughput event ingestion","Stream processing with replay","Log aggregation"],a:0,
 e:"Kafka adds broker hops, batching and disk persistence. For tiny volumes or strict synchronous latency, a direct RPC call is usually simpler and faster."},

{q:"What does the 'log' abstraction in Kafka fundamentally provide?",
 o:["An ordered, durable, replayable sequence of records per partition that many consumers can read independently","A relational table with indexes","A distributed cache","A file share"],a:0,
 e:"That single abstraction — append, retain, replay — is what enables event sourcing, CDC pipelines, stream processing and multi-consumer fan-out on the same data."}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete — Set 3</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
