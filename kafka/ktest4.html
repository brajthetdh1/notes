<!DOCTYPE html>

<style>
  :root{
    --brand:#065f46;
    --brand-dark:#022c22;
    --accent:#10b981;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#022c22;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#d1fae5;border-color:#a7f3d0}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(6,95,70,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#ecfdf5}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#d1fae5}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<header class="topbar">
  <div class="brand">📨 Apache Kafka Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>

          <span class="qnum" id="qnum">Question 1 of 100</span>

<script>
/* ============================================================
   QUESTION BANK — SET 4 · 100 Apache Kafka MCQs
   ============================================================ */
const QS = [

/* ---------- 1–15 : Record format, headers, timestamps ---------- */
{q:"What are Kafka record headers used for?",
 o:["Metadata key-value pairs attached to a record for tracing, routing hints or application context — not used for partitioning or compaction","Fields used to compute the target partition","Encryption metadata for TLS","A replacement for the record key"],a:0,
 e:"Headers carry contextual data such as trace ids, source system, or a schema reference, and do not affect partitioning or log compaction. The key determines the partition and compaction; the value is the payload."},

{q:"Are header keys required to be unique within a single record?",
 o:["Yes — duplicate header keys are rejected by the broker","No — multiple headers with the same key are allowed and preserved in order","Only the last value wins, duplicates are overwritten","Headers must be alphabetically sorted"],a:1,
 e:"Kafka permits repeated header keys, and the client preserves them in order. Consumers that need a single value must decide which occurrence to use, so well-designed schemas keep keys unique."},

{q:"What is the default timestamp type set by a Kafka producer?",
 o:["LogAppendTime","CreateTime","BrokerTime","None — timestamps are optional"],a:1,
 e:"CreateTime means the producer's own timestamp is stored. The broker's message.timestamp.type can override this with LogAppendTime, but CreateTime is the default and is what Streams uses for event-time semantics."},

{q:"What does message.timestamp.type=LogAppendTime do?",
 o:["The broker replaces the producer-supplied timestamp with its own clock at append time","The producer uses the current system clock","The record is rejected if its timestamp is older than an hour","The timestamp is stored as a formatted date string"],a:0,
 e:"LogAppendTime makes the broker authoritative for timestamps, which prevents bad client clocks from corrupting retention and time-index lookups. The trade-off is that event-time semantics are lost."},

{q:"What is a significant downside of LogAppendTime?",
 o:["It breaks event-time semantics — windowing and time-based ordering no longer reflect the producer's actual event time","It reduces throughput dramatically","It requires ZooKeeper","It disables transactions"],a:0,
 e:"Once the broker overwrites the timestamp, Streams windows and time-based retention operate on broker arrival time rather than event time. This changes the meaning of temporal joins and aggregations."},

{q:"What does message.timestamp.difference.max.ms control?",
 o:["It rejects records whose timestamp differs from broker time by more than the configured amount (only applied to CreateTime records)","It delays records until their timestamp matches broker time","It sets retention based on timestamp distance","It limits header timestamp precision"],a:0,
 e:"This guard rejects records whose producer clock is wildly wrong. It applies only with CreateTime; with LogAppendTime the broker always supplies the timestamp, so this check is skipped."},

{q:"What does magic byte 2 in a record batch indicate?",
 o:["The v2 record format — supporting headers, varint encoding, and idempotence/transaction fields","The compression codec","The number of records in the batch","The broker's version"],a:0,
 e:"Format v2 (Kafka 0.11+) is the modern record batch format that enabled transactions and idempotence. Broker down-conversion to v0/v1 happens only for old consumers and has been removed in recent releases."},

{q:"What is a control record in Kafka?",
 o:["A special record used for transaction markers (commit/abort) that read_committed consumers filter out","A record with a null value","A record without a key","A schema registry record"],a:0,
 e:"Control records are written by the partition leader when a transaction ends. They are not delivered to read_committed consumers, but read_uncommitted consumers can observe aborted records."},

{q:"What is an abort marker?",
 o:["A control record indicating that a transaction was aborted","A retention policy marker","A consumer offset marker","A broker shutdown marker"],a:0,
 e:"The abort marker sits in the log so read_committed consumers can skip the preceding records from the aborted transaction. The records physically remain in the log until retention removes them."},

{q:"What is the role of the producer id in a record batch?",
 o:["It identifies an idempotent producer session and enables the broker to deduplicate retried batches","It identifies the target partition","It identifies the consumer group","It identifies the topic"],a:0,
 e:"The broker tracks (producer id, producer epoch, base sequence number) per partition, rejecting batches whose sequence was already written — this is how idempotence prevents duplicates from retries."},

{q:"What is the producer epoch?",
 o:["A monotonically increasing counter for a transactional.id, incremented on each new producer instance to fence out older ones","The number of records the producer has sent","The broker's uptime counter","The current timestamp in nanoseconds"],a:0,
 e:"When a new producer instance uses the same transactional.id, the coordinator bumps the epoch. The old instance's requests are rejected with ProducerFencedException, preventing split-brain writes."},

{q:"What is the base sequence number in a record batch?",
 o:["The sequence number of the first record in the batch, used for idempotent deduplication","The offset of the first record","The broker's request sequence number","The number of records in the batch"],a:0,
 e:"Sequence numbers are per producer, per partition. The broker tracks the last accepted sequence and rejects a batch whose sequence is not strictly greater, which is why retries cannot produce duplicates."},

{q:"What is the last offset delta in a record batch?",
 o:["The offset delta of the last record, used to compute the offsets of every record in the batch","The difference between the first and last timestamps","The number of records minus one","The byte size of the batch"],a:0,
 e:"The batch stores a base offset and per-record deltas. The last offset delta lets the broker and consumers derive the last offset without scanning every record."},

{q:"Do record headers affect log compaction?",
 o:["No — compaction is based solely on the record key","Yes — headers with the same key are compacted","Only headers with a specific attribute are compacted","Headers block compaction entirely"],a:0,
 e:"Compaction keeps the latest record per key and discards older versions. Headers travel with the surviving record but never influence which records are retained."},

/* ---------- 16–35 : Broker internals ---------- */
{q:"What are the three main thread pools involved in handling client requests on a Kafka broker?",
 o:["Acceptor, network (processor) and request handler (IO) threads","Producer, consumer and controller threads","Leader, follower and replica threads","Admin, client and broker threads"],a:0,
 e:"An acceptor thread accepts connections, one or more network threads read and write sockets, and IO threads do the actual request processing. Background threads handle replication, log cleaner and the controller."},

{q:"What does an acceptor thread do on a Kafka broker?",
 o:["Accepts incoming TCP connections and hands them to a processor thread","Processes write requests","Handles consumer group rebalances","Flushes the log to disk"],a:0,
 e:"Acceptors only own the accept() call. All per-connection work — reading, parsing, writing — is delegated to the network (processor) threads."},

{q:"What does a network (processor) thread do?",
 o:["Reads requests from sockets, puts them in the request queue, and writes responses back to the socket","Flushes the log to disk","Elects partition leaders","Compresses log segments"],a:0,
 e:"Processors form the network boundary. They do minimal work, moving bytes in and out and handing actual processing to the IO threads — this keeps the network path fast and non-blocking."},

{q:"What does an IO (request handler) thread do?",
 o:["Dequeues requests, processes them (reads, writes, metadata lookups), and produces responses","Accepts TCP connections","Sends heartbeats to the controller","Runs the log cleaner"],a:0,
 e:"IO threads perform the actual work behind every API. Configuring num.io.threads is the primary lever for scaling request processing on a broker."},

{q:"What is the request purgatory in Kafka?",
 o:["A holding area for requests that cannot complete immediately — for example acks=all waiting on ISR expansion, or a delayed fetch waiting for data","A disk buffer for log segments","A dead letter queue for failed requests","A cache for consumer offsets"],a:0,
 e:"Purgatory avoids blocking IO threads. Requests are parked, and a triggering event (e.g. ISR expand, data arriving, timeout) completes them and re-queues the response."},

{q:"What is a delayed operation in Kafka?",
 o:["An operation parked in purgatory that is completed by a timeout or by a triggering event such as an ISR update","A retried request","A request sent to a follower","A batch that failed validation"],a:0,
 e:"DelayedProduce, DelayedFetch, DelayedJoin and DelayedCreateTopics are common examples. They are all driven by a combination of timers and in-memory state changes."},

{q:"What does queued.max.requests control?",
 o:["How many requests may queue for IO threads before network threads pause reading from sockets — the broker's back-pressure threshold","The maximum number of brokers in a cluster","The maximum number of topics","The maximum size of a request"],a:0,
 e:"Once the queue fills, processors stop reading new requests from their sockets. Slow clients therefore feel natural back-pressure instead of overwhelming the broker."},

{q:"What is typical guidance for num.io.threads on a Kafka broker?",
 o:["At least 8; often sized relative to the number of disks, and increased when disk I/O is the bottleneck","Always exactly 1","Always equal to num.network.threads","Always 64"],a:0,
 e:"More IO threads help only if the underlying storage can keep up. If disks are saturated, adding threads makes things worse by increasing contention."},

{q:"What does socket.request.max.bytes limit?",
 o:["The maximum size of a single request the broker will accept","The maximum response size","The per-connection socket buffer","The replication fetch batch size"],a:0,
 e:"A request larger than this limit is rejected. It must be at least as large as the largest request any client is allowed to send — typically aligned with message.max.bytes."},

{q:"How does Kafka apply back-pressure when brokers are overloaded?",
 o:["Requests queue up to queued.max.requests and then network threads stop reading from sockets, throttling clients naturally","The broker rejects all requests with an error","The broker doubles its thread count","The broker refuses new TCP connections"],a:0,
 e:"Back-pressure through socket reading, plus client quotas, keeps the broker from being overwhelmed. Clients feel it as elevated latency rather than outright failures."},

{q:"What is the controller's role in a Kafka cluster?",
 o:["Managing partition leadership and ISR, handling broker joins and leaves, and processing topic creation and deletion","Storing messages on disk","Serving consumer fetch requests","Storing consumer group offsets"],a:0,
 e:"The controller is the metadata brain of the cluster. It does not store data; it makes decisions and publishes them to brokers. In KRaft the controller quorum elects a leader to do this work."},

{q:"In KRaft, how do brokers get metadata updates?",
 o:["Brokers fetch metadata from the controller quorum and receive incremental updates via the broker-to-controller channel","Brokers poll ZooKeeper","The controller writes directly to each broker's disk","Brokers never get updates — clients fetch them"],a:0,
 e:"Brokers maintain a local copy of the metadata log. They register with controllers, send heartbeats, and pull metadata changes so they can serve client metadata requests locally."},

{q:"What is a BrokerRegistration in KRaft?",
 o:["A record in __cluster_metadata that registers a broker with its listeners, rack and incarnation id","A consumer group member record","A topic configuration record","A schema registry entry"],a:0,
 e:"Registration is how controllers learn which brokers exist and how to reach them. It is written on startup and updated when a broker's listeners or metadata change."},

{q:"What is a broker incarnation id in KRaft?",
 o:["A unique id assigned per broker process start, used to detect stale registrations from a previous instance","The broker's permanent UUID","The broker's cluster id","The broker's IP address"],a:0,
 e:"A restarted broker gets a new incarnation id, so controllers can distinguish the current process from a stale registration left behind by a crash."},

{q:"What is a metadata snapshot in KRaft?",
 o:["The controller's persisted snapshot of the metadata log, used to speed up startup and recovery","A topic backup","A consumer offset file","A log segment"],a:0,
 e:"Controllers periodically snapshot the metadata state so they do not have to replay the entire metadata log on startup. Snapshots plus the tail of the log reconstruct the full cluster state."},

{q:"What does metadata.version determine in KRaft?",
 o:["Which features and API versions are enabled for the cluster (e.g. 3.6-IV0, 4.0-IV0)","The broker's uptime","The consumer group version","The compression codec in use"],a:0,
 e:"The metadata version gates feature availability and is set when the cluster is formatted. Downgrading is allowed only as far as the oldest supported version, and rollback requires care."},

{q:"What is the KRaft controller listener used for?",
 o:["Controller-to-controller and broker-to-controller communication, typically on port 9093","Client producer traffic","Client consumer traffic","Schema registry traffic"],a:0,
 e:"The controller listener is separate from client listeners so metadata traffic can be isolated, secured independently, and kept on a low-latency network."},

{q:"What happens if all controllers in a KRaft cluster are lost?",
 o:["The cluster becomes effectively read-only for metadata: existing partitions can keep serving but no leadership changes, topic creation or reconfigurations can happen","Everything continues fully normally","Brokers automatically elect a new controller","All topics are deleted"],a:0,
 e:"Without a controller quorum there is no authority for metadata changes. Data-plane traffic to existing leaders continues, but any change — including failover — is blocked until a majority of controllers is restored."},

{q:"What is the recommended number of KRaft controllers for a production cluster?",
 o:["Three or five dedicated controllers (odd, for majority quorum)","One, to keep things simple","Two, for symmetry","Equal to the number of brokers"],a:0,
 e:"Three tolerates one failure, five tolerates two. An even number provides no additional fault tolerance and increases commit latency without benefit."},

{q:"What does BrokerHeartbeat do in KRaft?",
 o:["It is a periodic signal from a broker to the controllers indicating the broker is alive and up to date with metadata","It is a consumer heartbeat","It is a producer retry signal","It is a schema registry poll"],a:0,
 e:"Heartbeats carry the broker's metadata version, so controllers know whether it has caught up. Brokers that fall too far behind may be fenced or asked to re-register."},

/* ---------- 36–55 : Admin API and transactions ---------- */
{q:"What does AdminClient.describeCluster() return?",
 o:["The cluster id, the current controller, and the list of brokers (nodes)","All topic configurations","All consumer groups","All schemas"],a:0,
 e:"describeCluster is the standard way to discover controller information and the node list from an application. It is a lightweight, safe call and useful for health checks."},

{q:"What does AdminClient.listOffsets() return?",
 o:["The earliest and latest offsets for requested partitions, and offsets for a requested timestamp","The list of consumers","Topic metadata","Broker configurations"],a:0,
 e:"listOffsets is what powers consumer lag checks and time-based seeks. Passing a timestamp returns the first offset whose timestamp is at or after that time."},

{q:"What does AdminClient.alterConsumerGroupOffsets() do?",
 o:["Resets the committed offsets for a consumer group","Deletes the consumer group","Creates a new consumer group","Lists the group's offsets"],a:0,
 e:"This is the programmatic equivalent of kafka-consumer-groups.sh --reset-offsets. The group must be empty (no active members) before the offsets can be changed."},

{q:"What is the difference between listOffsets and listConsumerGroupOffsets?",
 o:["listOffsets returns the log's offsets; listConsumerGroupOffsets returns the group's committed offsets","They are identical","listOffsets is for schemas, listConsumerGroupOffsets is for topics","listConsumerGroupOffsets is deprecated"],a:0,
 e:"Lag is the difference between the two. AdminClient provides both, plus describeConsumerGroups which returns members and assignment details."},

{q:"What does AdminClient.deleteRecords() do?",
 o:["Advances the log start offset of partitions, deleting records before the supplied offset","Deletes the whole topic","Deletes a consumer group","Deletes a schema version"],a:0,
 e:"This is a per-partition operation that lets you purge old data before retention would. The records are removed from disk and cannot be read afterwards."},

{q:"What does AdminClient.describeConfigs() return?",
 o:["Config values together with their source (default, static, dynamic-broker, dynamic-topic, etc.)","The full broker log files","Only topic-level configs","Only client-side configs"],a:0,
 e:"The source tells you whether a value comes from a broker default, a static server.properties entry, or a dynamic override. This is essential when debugging why a setting seems ignored."},

{q:"What does AdminClient.incrementalAlterConfigs() do?",
 o:["Changes configs incrementally using operations such as SET, DELETE, APPEND and SUBTRACT, without replacing all values","Replaces all configs at once","Only works on brokers, not topics","Is deprecated"],a:0,
 e:"The incremental form avoids the race conditions of the legacy full-replace API and is the recommended way to change topic and broker configs programmatically."},

{q:"What is the default isolation.level for a Kafka consumer?",
 o:["read_uncommitted","read_committed","exactly_once","snapshot"],a:0,
 e:"read_uncommitted returns everything written, including records from transactions that were later aborted. Set read_committed to see only committed transactional data, at the cost of higher latency."},

{q:"What is the Last Stable Offset (LSO)?",
 o:["The highest offset up to which all transactions are complete; read_committed consumers can only read data below it","The last offset in the log","The first offset in the log","The consumer's current position"],a:0,
 e:"The LSO is the boundary between safe and in-flight data. Records above the LSO might belong to an open or aborted transaction, so read_committed consumers never see them."},

{q:"What happens to records from an aborted transaction?",
 o:["They remain physically in the log but are filtered out by read_committed consumers using the abort marker","They are immediately deleted from disk","They are moved to a dead letter topic","They are overwritten by the next record"],a:0,
 e:"Aborted records stay in the log because rewriting them would be expensive. The abort marker lets read_committed consumers skip them; retention eventually removes the whole segment."},

{q:"What does transactional.id.expiration.ms control?",
 o:["How long an inactive transactional.id is retained by the producer id manager before being removed","The maximum transaction duration","The consumer session timeout","The broker's connection idle timeout"],a:0,
 e:"Once the transactional.id expires, the epoch information is lost. Long expiry is usually fine; too short can mean a paused producer loses its fencing state."},

{q:"What does the InitProducerId request do?",
 o:["Obtains a producer id and a new epoch, fencing out older instances using the same transactional.id","Initialises a brand-new topic","Creates a consumer group","Resets consumer offsets"],a:0,
 e:"The producer calls InitProducerId on startup (with a transactional.id for transactions, or with null for idempotence only). The coordinator returns the pid and epoch."},

{q:"How is the transaction coordinator for a transactional.id chosen?",
 o:["By hashing the transactional.id to a partition of __transaction_state","By the broker id","By the producer's IP address","By round-robin across brokers"],a:0,
 e:"Hashing pins each transactional.id to a stable coordinator. The coordinator keeps the transaction state in that partition of __transaction_state."},

{q:"What does AddPartitionsToTxn do?",
 o:["Registers the partitions a transaction will write to with the transaction coordinator","Adds a new partition to a topic","Adds a consumer to a group","Adds a broker to the cluster"],a:0,
 e:"Before writing, the producer registers every partition involved. The coordinator then tracks each one so commit or abort can be propagated correctly."},

{q:"What does EndTxn do?",
 o:["Requests a commit or abort for the current transaction","Ends the consumer session","Terminates a broker","Deletes a topic"],a:0,
 e:"The producer sends EndTxn to the coordinator after writing all records. The coordinator then drives the two-phase process of writing commit or abort markers to every registered partition."},

{q:"What happens during the PrepareCommit phase of a transaction?",
 o:["The coordinator writes a PREPARE_COMMIT marker to __transaction_state, then asks each partition leader to write the COMMIT marker","The producer writes the commit locally","The consumer commits offsets","The broker is restarted"],a:0,
 e:"Writing the prepare marker first means the coordinator can resume the commit after a crash. Each partition leader then writes the control record to its log and advances the LSO."},

{q:"What does a partition leader do during a transaction commit?",
 o:["It writes a COMMIT control record to the log and advances the LSO so read_committed consumers can see the previously written records","It deletes the transactional records","It moves records to another partition","It restarts the producer"],a:0,
 e:"Once the commit marker is in the log and replicated, read_committed consumers can read the transactional records. Until then they are hidden above the LSO."},

{q:"How does the coordinator handle a zombie producer?",
 o:["It rejects commits from any producer with an older epoch, raising ProducerFencedException","It accepts commits from any epoch","It deletes the records","It restarts the producer"],a:0,
 e:"Fencing is what makes transactions safe across restarts and retries: an old instance that wakes up cannot commit stale work, because its epoch no longer matches the coordinator's view."},

{q:"Which exception does a fenced producer receive?",
 o:["ProducerFencedException","OffsetOutOfRangeException","RecordTooLargeException","NotEnoughReplicasException"],a:0,
 e:"When a ProducerFencedException is thrown, the producer must abort its transaction and shut down — it can no longer participate because a newer instance owns the transactional.id."},

{q:"What does transaction.timeout.ms limit on the producer?",
 o:["How long a transaction may stay open before the coordinator aborts it","The producer's per-request network timeout","The consumer poll timeout","The broker's shutdown timeout"],a:0,
 e:"If the transaction is not committed within this window, the coordinator aborts it. The value must be less than or equal to the broker's transaction.max.timeout.ms."},

/* ---------- 56–80 : Kafka Streams deep dive ---------- */
{q:"What is the TopologyTestDriver used for?",
 o:["Running a Streams topology in-process for unit tests without a real broker","Testing broker performance","Testing network connectivity","Testing schema registry compatibility"],a:0,
 e:"TopologyTestDriver lets you pipe input records through a topology and assert on output, all in-process. It is far faster and more deterministic than starting an embedded cluster."},

{q:"What does StreamsBuilder.build() return?",
 o:["A Topology object that can be run with KafkaStreams or passed to a test driver","A producer instance","A consumer instance","A state store"],a:0,
 e:"The Topology is the compiled DAG of processors, sources and sinks. KafkaStreams turns it into running tasks, while TopologyTestDriver executes it in-process for tests."},

{q:"What is the default num.stream.threads in Kafka Streams?",
 o:["1","2","4","Equal to the number of input partitions"],a:0,
 e:"One thread by default. Raising it parallelises work within an instance; the effective ceiling is the number of input partitions across the topology."},

{q:"What is application.id in Kafka Streams used for?",
 o:["It becomes the consumer group id and the prefix for all internal topics (repartition and changelog)","It is the producer id","It is the broker id","It is the schema registry id"],a:0,
 e:"Because it drives both the group and the internal topic names, changing application.id fundamentally changes how the application behaves."},

{q:"What happens if you change application.id on an existing Streams application?",
 o:["It is treated as a brand-new application: internal topics are new, state is not restored, and consumer group offsets start fresh","Nothing changes","Only the consumer group changes","The state is migrated automatically"],a:0,
 e:"New internal topics mean no changelog to restore from, and a new consumer group means no committed offsets. In practice you reprocess from the beginning of the input topics."},

{q:"What is a repartition topic in Kafka Streams?",
 o:["An internal topic that redistributes records when the key changes (e.g. after selectKey, groupBy, or a join across different keys)","A topic used for broker replication","A topic used for consumer offsets","A topic used for schema storage"],a:0,
 e:"Repartition topics are how Streams ensures co-partitioning for stateful operations after a key change. They are internal, managed by Streams, and named after application.id."},

{q:"What is a changelog topic in Kafka Streams?",
 o:["An internal compacted topic that backs a state store, enabling fault tolerance and fast restoration","A topic used for application logs","A topic used for consumer offsets","A topic used for schema storage"],a:0,
 e:"Every state store update is mirrored to its changelog. When a task moves to another instance, it replays the changelog to rebuild the state before resuming."},

{q:"What is state.dir in Kafka Streams?",
 o:["The local directory where state stores (e.g. RocksDB files) are kept","The directory holding internal topics","The consumer group directory","The schema registry directory"],a:0,
 e:"state.dir must be on fast local disk. It is not shared between instances — each instance keeps its own local copy and rebuilds from the changelog when a task is reassigned."},

{q:"What is the default state store implementation in Kafka Streams?",
 o:["RocksDB (persistent)","In-memory only","A remote database","A plain file system store"],a:0,
 e:"RocksDB provides an embedded persistent store that survives restarts and can hold state larger than the JVM heap. InMemoryKeyValueStore is available for small state where restart cost is acceptable."},

{q:"What is the state store cache in Kafka Streams?",
 o:["An in-memory write-back cache in front of the persistent store, controlled by cache.max.bytes.buffering","A disk cache","A network cache","A schema cache"],a:0,
 e:"The cache reduces reads and writes to RocksDB and can suppress intermediate results (dirty records are flushed on commit or eviction). This is why caching interacts with emit semantics."},

{q:"What does cache.max.bytes.buffering control?",
 o:["The total memory allocated to record caches across all stores in a Streams instance","The size of the RocksDB block cache","The size of the changelog topic","The number of standby replicas"],a:0,
 e:"If caching hides intermediate results and you need every update downstream, either disable caching or use the suppress() operator with explicit emit semantics."},

{q:"What does commit.interval.ms control in Kafka Streams?",
 o:["How often Streams commits consumer offsets and flushes state stores","How often the broker commits its log to disk","How often the consumer polls","How often the schema registry refreshes"],a:0,
 e:"Shorter intervals reduce reprocessing after a crash at the cost of more overhead. In EOS mode the interval also dictates how frequently transactions commit."},

{q:"What is the default commit.interval.ms in exactly-once mode (exactly_once_v2)?",
 o:["100 ms","1000 ms","30000 ms","60000 ms"],a:0,
 e:"EOS uses a much shorter interval than the at-least-once default (30000 ms) so that transactional visibility is not delayed too long. The trade-off is more overhead per commit."},

{q:"What does processing.guarantee=exactly_once_v2 do?",
 o:["Enables idempotent producers, transactions, and atomic offset commits across the whole topology","Enables only the idempotent producer without transactions","Disables offset tracking","Enables only read_committed on consumers"],a:0,
 e:"exactly_once_v2 is the modern EOS setting and replaces the older exactly_once option. It guarantees that Kafka-to-Kafka processing has no duplicates or loss, even on failure."},

{q:"What is a standby task in Kafka Streams?",
 o:["A task that keeps its state up to date from the changelog but does not process records, ready for fast promotion","A task that processes records but never commits offsets","A task that exists only in tests","A task that runs on the broker"],a:0,
 e:"Standby tasks dramatically reduce failover time: when an active task dies, a standby can be promoted immediately because its state is already current."},

{q:"What does num.standby.replicas control?",
 o:["How many standby replicas exist for each active task, on different instances","The number of brokers in the cluster","The number of partitions in a topic","The number of consumer threads"],a:0,
 e:"Setting num.standby.replicas=1 is the most common production choice: it doubles state storage and changelog read load but makes failover nearly instant."},

{q:"What are warmup replicas in Kafka Streams?",
 o:["Replicas spawned before a rebalance completes so that state restore overlaps with the rebalance window","Replicas that are warmed up but never used","Replicas that only serve reads","Replicas that are deleted after the first commit"],a:0,
 e:"Warmup replicas are a newer optimisation that reduces total restore time on large rebalances by pre-loading state on the destination instances."},

{q:"What is the unit of parallelism in Kafka Streams?",
 o:["The task — one per input partition group across the topics in the topology","The topic","The broker","The stream thread"],a:0,
 e:"Partition count sets the ceiling on parallelism. Adding instances beyond the task count leaves the extra instances idle."},

{q:"What is the difference between a key-value store and a window store in Kafka Streams?",
 o:["Key-value stores are keyed by key only; window stores are keyed by (key, window start time)","They are identical","Window stores are read-only","Key-value stores are always windowed"],a:0,
 e:"Windowed aggregations need to keep per-key state for each window, so the store must be keyed by both. That also drives retention: window size plus grace period."},

{q:"What is the difference between reduce and aggregate in Kafka Streams?",
 o:["reduce combines values of the same type; aggregate allows a different result type via an initializer and an aggregator","They are identical","reduce is deprecated","aggregate only works with windows"],a:0,
 e:"Use reduce when the aggregated value has the same type as the input value. Use aggregate (or count/sum helpers) when the result type differs from the input type."},

{q:"What does the branch operator do?",
 o:["Splits a KStream into multiple KStreams using predicates","Merges multiple streams","Joins a stream with a table","Filters a stream in place"],a:0,
 e:"branch() evaluates an ordered list of predicates and produces one output stream per predicate. It is the DSL equivalent of a switch over record content."},

{q:"What does flatMapValues do?",
 o:["Maps each value to zero or more values (one-to-many) without changing the key","Changes the key of each record","Joins streams","Aggregates values"],a:0,
 e:"Because it leaves the key untouched, flatMapValues does not trigger a repartition. Use map or selectKey if you need to change the key."},

{q:"What does the merge operator do?",
 o:["Combines multiple streams into a single stream","Splits one stream into many","Joins a stream with a table","Aggregates a stream"],a:0,
 e:"merge() interleaves records from its inputs. It preserves per-source ordering but does not guarantee global ordering across sources."},

{q:"Why is the through() operator deprecated?",
 o:["It writes to a topic and reads it back, which can be replaced with to() plus a fresh stream(), or avoided entirely by better DSL usage","It never worked","It is slower than selectKey","It requires ZooKeeper"],a:0,
 e:"through() was a convenience that often encouraged unnecessary repartitioning. The explicit to() + stream() pattern, or choosing the right DSL operators, is clearer and often more efficient."},

/* ---------- 81–100 : Advanced Streams, testing, scenarios ---------- */
{q:"What is a GlobalKTable backed by?",
 o:["A global state store that replicates every partition of the source topic to every instance","A single broker","ZooKeeper","A dedicated consumer group per key"],a:0,
 e:"A GlobalKTable is fully replicated on every instance, which is why joins against it need no repartitioning. The cost is memory and restore time proportional to the table's size."},

{q:"Why does a stream–GlobalKTable join not require a repartition?",
 o:["Every instance holds a full copy of the global table, so any key can be looked up locally","It does require a repartition","It uses a different key","It uses a broker-side join"],a:0,
 e:"This is the trade-off: no repartition cost, but the whole table is stored on every instance. It is ideal for small reference data, not for large fact tables."},

{q:"What does a stream–stream join require?",
 o:["A join window because both sides are unbounded streams, plus co-partitioning on the join key","No window at all","A tumbling window only","A session window only"],a:0,
 e:"Without a window there is no bound on how long to wait for the matching record. Records that arrive outside the window are unmatched and dropped from the join."},

{q:"How does a stream–table join work?",
 o:["It looks up the table's current value for each stream record's key and emits a joined record","It emits only when the table updates","It requires a window","It always requires a repartition"],a:0,
 e:"Stream–table joins are used for enrichment: each event is enriched with the latest reference data. If no matching table entry exists, the behaviour depends on the join type (inner/left)."},

{q:"What does a table–table join produce?",
 o:["A KTable containing the joined result of both tables","A KStream","A GlobalKTable","A window store"],a:0,
 e:"Table–table joins produce a new changelog: updates on either side can produce an updated join result. This is common for combining two reference data sets."},

{q:"What is the difference between a KTable join and a stream–table join?",
 o:["A KTable join emits only when either side updates; a stream–table join looks up the table for every stream record","They are identical","A KTable join requires a window","A stream–table join requires a GlobalKTable"],a:0,
 e:"KTable–KTable joins are stateful on both sides and only emit when state changes. Stream–table joins are lookup-driven and emit once per input stream record."},

{q:"What does the suppress() operator do?",
 o:["Buffers results and emits them only when a window closes (or after a time interval), preventing intermediate updates","Deletes records","Drops late records","Compresses records"],a:0,
 e:"Without suppress, windowed aggregations emit updates as each new record arrives. suppress(untilWindowCloses) gives you one final result per window."},

{q:"What is the grace period on a windowed operation?",
 o:["How long after the window ends late records are still accepted into that window","The timeout for window creation","The consumer poll timeout","The producer retry backoff"],a:0,
 e:"The grace period is the cut-off for late data. Records arriving after it are dropped from the window's aggregation, even if they would have matched the time range."},

{q:"How long are windowed records typically retained in a window store?",
 o:["Window size plus the grace period","Forever","One hour","Until the next record arrives"],a:0,
 e:"Retention must cover the window and any late data that is still allowed. Anything older can be evicted safely because the window is already closed."},

{q:"What are interactive queries in Kafka Streams?",
 o:["Reading a local state store directly from the application instance handling the request","Queries sent to the broker's SQL engine","Queries sent to ZooKeeper","Queries sent to the schema registry"],a:0,
 e:"Interactive queries expose read-only access to Streams state, turning a Streams application into a low-latency queryable service for the keys it owns."},

{q:"What is the standard pattern for routing interactive queries to the right Streams instance?",
 o:["A metadata service that maps keys to instances, combined with inter-instance RPC when the request lands on the wrong instance","Broadcasting to every instance","Querying the broker only","Querying ZooKeeper"],a:0,
 e:"Because each instance only owns some partitions, a request for another key must be routed. Common designs are a sidecar RPC layer or a coordinated service discovery mechanism."},

{q:"Which JMX bean on a Streams instance would you check for task-level metrics?",
 o:["kafka.streams:type=stream-task-metrics","kafka.server:type=BrokerTopicMetrics","java.lang:type=Memory","kafka.consumer:type=consumer-metrics"],a:0,
 e:"Streams exposes thread, task, processor and state-store metrics under the kafka.streams domain. These are the primary signals for alerting on lag, task health and restore progress."},

{q:"What happens when a Streams instance dies?",
 o:["Its tasks are reassigned to other instances; state is restored from changelog topics (or from standby replicas)","The whole application stops permanently","The state is lost forever","The broker restarts"],a:0,
 e:"This is the fault-tolerance model of Streams: tasks are portable, and state is durable via changelogs. Standby replicas make this transition fast instead of painful."},

{q:"Which rebalance protocol does Kafka Streams use by default in newer versions?",
 o:["The cooperative sticky assignor (incremental rebalancing)","The eager range assignor","A custom Streams-only protocol","The round-robin assignor"],a:0,
 e:"Cooperative rebalancing keeps most partitions where they are, so only the partitions that must move are revoked. This dramatically reduces restore time on large deployments."},

{q:"What does probing.rebalance.interval.ms control in Kafka Streams?",
 o:["How often Streams evaluates whether it should trigger a rebalance to rebalance tasks across instances","How often brokers probe for dead controllers","How often consumers probe for new topics","How often the schema registry probes for new schemas"],a:0,
 e:"Streams periodically checks whether reassigning tasks would improve balance. The probe is cheap and prevents constant rebalancing while still allowing gradual correction."},

{q:"What does num.warmup.replicas control in Kafka Streams?",
 o:["How many warmup replicas are spawned during a rebalance to overlap state restore with the rebalance","The number of standby replicas","The number of active tasks","The number of consumer threads"],a:0,
 e:"Warmup replicas are a newer feature aimed at large topologies with long restore times. They trade extra load for shorter end-to-end recovery."},

{q:"What is EmbeddedKafka used for in tests?",
 o:["Running an in-process Kafka broker for integration tests without a real cluster","Embedding Kafka inside a web page","Running Kafka on the JVM without threads","Testing the schema registry only"],a:0,
 e:"EmbeddedKafka spins up a broker inside the test JVM, letting you exercise producers, consumers, Streams and Admin APIs end-to-end. It is slower than TopologyTestDriver but catches integration issues."},

{q:"A Streams application shows high restore time after each rebalance. What is the most likely fix?",
 o:["Increase num.standby.replicas (and/or num.warmup.replicas) so state is already warm on the destination instances","Disable state stores entirely","Increase the number of partitions","Switch to eager rebalancing"],a:0,
 e:"Standby replicas keep a copy of the state on other instances, so promotion after a rebalance is nearly instant. Warmup replicas reduce the cost of the initial restore."},

{q:"A Streams application's consumer group keeps rebalancing. What is a likely cause?",
 o:["Processing exceeds max.poll.interval.ms, or instances are restarting frequently","The broker is out of disk","The schema registry is down","The compression codec is set incorrectly"],a:0,
 e:"Any of these lead to members being evicted repeatedly. Check max.poll.interval.ms, max.poll.records, and whether instances are being killed by liveness probes or OOM."},

{q:"A Streams app using exactly_once_v2 still produces duplicates downstream in an external database. Why?",
 o:["Kafka's EOS only covers Kafka writes and offsets — the external database needs idempotent writes or its own transactions","EOS should prevent all duplicates automatically","The database must be restarted","You should switch back to exactly_once"],a:0,
 e:"Kafka can guarantee exactly-once between Kafka topics, but not across an unrelated system. For external sinks, use an upsert keyed on a business id, a transactional sink connector, or a deduplication step."}
];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete — Set 4</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
