<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apache Kafka Mock Test — Set 2 · 100 MCQs</title>
<style>
  :root{
    --brand:#1e293b;
    --brand-dark:#0f172a;
    --accent:#f59e0b;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#3b2600;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  /* ---------- palette ---------- */
  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e2e8f0;border-color:#cbd5e1}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(30,41,59,.3)}

  /* ---------- main ---------- */
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f1f5f9}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#e2e8f0}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  /* ---------- results ---------- */
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">📨 Apache Kafka Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — SET 2 · 100 Apache Kafka MCQs
   o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [

/* ---------- 1–20 : Storage internals & log format ---------- */
{q:"Which OS feature does Kafka exploit to move log data from the page cache to a network socket with minimal CPU overhead?",
 o:["Zero-copy via the sendfile() system call","Memory-mapped files only","Direct I/O (O_DIRECT)","Copy-on-write cloning"],a:0,
 e:"Kafka uses sendfile() so the kernel transfers bytes straight from the page cache to the socket, skipping the user-space copy. This is a major reason Kafka sustains high throughput on ordinary hardware. The path is bypassed when the broker must re-compress or re-encrypt."},

{q:"Kafka relies primarily on which layer to cache log data?",
 o:["The JVM heap","The operating system page cache","An off-heap ByteBuffer per partition","An embedded RocksDB instance"],a:1,
 e:"Kafka does not cache messages in the JVM heap — it writes to the filesystem and lets the OS page cache absorb reads. This is why a large heap is counterproductive and why the machine should have plenty of free RAM for the page cache."},

{q:"What is the purpose of the .index file in a partition directory?",
 o:["It stores the actual record bytes","It maps offsets to physical byte positions for fast lookups","It stores consumer group offsets","It records broker error messages"],a:1,
 e:"The offset index is a sparse map from offset to byte position inside the .log file, letting a consumer jump close to a target offset instead of scanning the whole segment."},

{q:"Which file allows Kafka to locate a record by its timestamp?",
 o:[".log",".index",".timeindex",".snapshot"],a:2,
 e:"The .timeindex is a sparse map from timestamp to offset. It powers time-based lookups such as offsetsForTimes() and time-bounded retention."},

{q:"What is the default value of log.segment.bytes?",
 o:["100 MB","512 MB","1 GB","4 GB"],a:2,
 e:"The default is 1073741824 bytes (1 GB). Because segments are the unit of retention, compaction and deletion, this value determines how much data can be reclaimed at a time."},

{q:"What does log.index.interval.bytes control?",
 o:["The maximum size of the index file","How many bytes of log are written before a new sparse index entry is added","How often the index is rebuilt","The compression ratio of the index"],a:1,
 e:"Default 4096 bytes. Smaller values produce finer-grained indexes — faster seeks but more memory and larger index files."},

{q:"Which statement about zero-copy is TRUE?",
 o:["It eliminates the need for replication","It avoids copying bytes through JVM user space, saving CPU and memory bandwidth","It compresses data inside the kernel","It only works when TLS is disabled on the producer"],a:1,
 e:"Zero-copy removes the user-space copy, which saves CPU and memory bandwidth. It is defeated when the broker must decompress, re-compress, down-convert or re-encrypt the batch."},

{q:"After running kafka-topics.sh --delete, when is the data actually removed from disk?",
 o:["Immediately when the command returns","Asynchronously, after the controller marks the topic for deletion and brokers remove their log directories","Only after the next broker restart","Never — deletion always requires manual cleanup"],a:1,
 e:"Deletion is asynchronous. delete.topic.enable must be true on the brokers; the controller marks the topic, brokers delete local directories, and the topic then disappears from metadata."},

{q:"What is a tombstone in a compacted topic?",
 o:["A record with a null value, marking the key for deletion","A record larger than 1 MB","A record with a null key","A record whose timestamp is zero"],a:0,
 e:"A null-value record marks its key for deletion. The log cleaner eventually removes the tombstone along with all older records for that key, after delete.retention.ms has elapsed."},

{q:"What does delete.retention.ms control?",
 o:["How long tombstones and their target records survive before the cleaner removes them","How long consumer offsets are retained","How long a deleted topic lingers in metadata","How long a broker keeps a failed request"],a:0,
 e:"Default 86400000 (24 hours). Consumers must be able to read the tombstone within this window, so set it longer than the maximum expected consumer downtime."},

{q:"Which parameter determines when the log cleaner begins cleaning a partition?",
 o:["min.cleanable.dirty.ratio","log.retention.ms","cleanup.policy.interval","compact.ratio.min"],a:0,
 e:"Default 0.5 — cleaning starts when at least half the log is dirty. Lower values clean more aggressively but cost more I/O."},

{q:"How many log cleaner threads run by default?",
 o:["1","2","4","8"],a:0,
 e:"log.cleaner.threads defaults to 1. Clusters with many compacted partitions usually raise it, together with log.cleaner.io.max.bytes.per.second to cap cleaning I/O."},

{q:"Which record batch format added headers, varint encoding and the transactional fields?",
 o:["v0","v1","v2","v3"],a:2,
 e:"Message format v2 (Kafka 0.11) introduced the record batch with headers, varint compression of keys and values, and the producer/sequence fields needed for idempotence and transactions."},

{q:"At what granularity does a producer apply compression?",
 o:["Per record","Per record batch","Per topic","Per partition segment"],a:1,
 e:"Compression applies to the whole record batch, which is why larger batches compress better. The broker stores the batch compressed and only decompresses when it must validate or convert the format."},

{q:"What does log.roll.ms do?",
 o:["Closes the active segment once the given time has elapsed, regardless of size","Rolls back an open transaction","Sets the retention period","Rotates the broker's log4j file"],a:0,
 e:"Time-based rolling works alongside log.segment.bytes — whichever limit is reached first closes the active segment and opens a new one."},

{q:"What problem does the leader epoch solve?",
 o:["It identifies each leadership term so a follower can detect divergence and truncate to the correct point","It encrypts the log","It numbers consumer groups","It replaces offsets entirely"],a:0,
 e:"Each new leader increments the epoch. On reconnect, a follower compares epochs and truncates to the last common point instead of relying on ambiguous offset arithmetic — this fixed the historical data-divergence bugs."},

{q:"What does the high watermark represent?",
 o:["The last offset replicated to all ISR members, up to which consumers may read","The largest record size ever seen","The number of partitions in the topic","The broker's remaining free disk"],a:0,
 e:"Consumers can only read up to the high watermark. Records beyond it may be uncommitted and could be lost during a leader change."},

{q:"What happens when the active log segment reaches log.segment.bytes?",
 o:["The broker deletes it","The active segment is closed and a new active segment is opened","The partition becomes read-only","Replication stops for that partition"],a:1,
 e:"The closed segment becomes immutable and eligible for retention or compaction, while the new active segment continues receiving appends."},

{q:"Where does a KRaft cluster store cluster metadata?",
 o:["In ZooKeeper znodes","In the __cluster_metadata topic, replicated by the controllers","In each broker's server.properties","On a shared NFS mount"],a:1,
 e:"Controllers replicate a metadata log to the internal __cluster_metadata topic. Brokers keep a local copy so they can answer metadata requests quickly."},

{q:"Which index does offsetsForTimes() consult?",
 o:[".index",".timeindex",".log",".txnindex"],a:1,
 e:"The time index maps timestamps to offsets, so the client can find the earliest offset at or after a requested time."},

/* ---------- 21–35 : Producer internals ---------- */
{q:"Which configuration best preserves ordering when retries are enabled and idempotence is disabled?",
 o:["max.in.flight.requests.per.connection=1","acks=0","retries=0","batch.size=1"],a:0,
 e:"Restricting in-flight requests to one prevents a retried batch from landing after a later one. The better modern answer is enabling idempotence, which stays ordered with up to 5 in-flight requests."},

{q:"What does buffer.memory control?",
 o:["The total bytes a producer may buffer for unsent records","The broker's page cache size","The consumer's fetch buffer","The size of the offset index"],a:0,
 e:"Default 33554432 (32 MB). When the buffer is full, send() blocks up to max.block.ms and then throws a TimeoutException."},

{q:"What happens when the producer buffer is full and max.block.ms elapses?",
 o:["Records are silently dropped","send() throws a TimeoutException","The broker allocates more memory","The producer switches to acks=0"],a:1,
 e:"Blocking is deliberate back-pressure. If the broker stays unreachable longer than max.block.ms, the producer surfaces the problem instead of growing memory without bound."},

{q:"What does max.block.ms bound?",
 o:["How long send() and partitionsFor() may block on metadata or buffer space","How long the broker takes to flush to disk","How long a consumer may spend in poll()","How long a transaction may remain open"],a:0,
 e:"Default 60000 ms. It covers metadata fetch and buffer allocation waits — not the actual network send after a record has been enqueued."},

{q:"Which exception indicates a record exceeded the maximum permitted size?",
 o:["RecordTooLargeException","OffsetOutOfRangeException","ProducerFencedException","RebalanceInProgressException"],a:0,
 e:"The producer's max.request.size and the broker's message.max.bytes must both accommodate the record, and replica.fetch.max.bytes must be large enough for followers to replicate it."},

{q:"What should a producer do when it has no metadata for a topic?",
 o:["Fail permanently","Fetch metadata from a bootstrap server, then retry","Write to partition 0","Fall back to the consumer API"],a:1,
 e:"The producer issues a Metadata request, learns the leaders and partitions, then routes the record. This is why bootstrap.servers only needs one reachable broker."},

{q:"What does transaction.timeout.ms limit?",
 o:["How long a transaction may stay open before the coordinator aborts it","How long the producer waits for an acknowledgement","How long a consumer may lag","How long offsets are retained"],a:0,
 e:"If the producer does not commit within this window, the transaction coordinator aborts the transaction and releases the associated partitions."},

{q:"Which component manages transaction state and coordinates commit/abort?",
 o:["The transaction coordinator on a broker","The controller","ZooKeeper","The consumer group coordinator"],a:0,
 e:"The transaction coordinator writes to __transaction_state and coordinates prepare/commit/abort with the partition leaders."},

{q:"Which producer setting bounds the wait for an acknowledgement of a single request?",
 o:["request.timeout.ms","delivery.timeout.ms","linger.ms","retry.backoff.ms"],a:0,
 e:"Default 30000 ms. It must be larger than the broker's replica.lag.time.max.ms, otherwise acks=all requests can time out while a follower is still legitimately catching up."},

{q:"What does delivery.timeout.ms cover?",
 o:["Only the first send attempt","The total time from send() to success or final failure, including batching and retries","Only the broker's disk flush","Only consumer fetch latency"],a:1,
 e:"Default 120000 ms. It caps the whole delivery attempt, so the sum of request timeouts and retry backoffs must fit inside it."},

{q:"Which producer extension point lets you observe sends and acknowledgements globally?",
 o:["ProducerInterceptor with onSend() and onAcknowledgement()","Serializer.serialize()","Partitioner.partition()","Callback.onCompletion()"],a:0,
 e:"Interceptors wrap the send path, can be chained, and are configured once — commonly used for metrics and tracing. A Callback is registered per record."},

{q:"Which hash function does the default partitioner use for keyed records?",
 o:["MD5","Murmur2","SHA-256","Java's hashCode()"],a:1,
 e:"Kafka uses murmur2(key) % numPartitions so partition assignment is stable across Java and non-Java clients. Increasing the partition count later reshuffles key-to-partition mapping."},

{q:"How does the default partitioner handle records with a null key?",
 o:["It throws an exception","It uses sticky partitioning, filling one partition's batch before switching","It hashes an empty string","It always writes to partition 0"],a:1,
 e:"Sticky partitioning (KIP-480) improves batching efficiency for unkeyed records. There is no ordering guarantee for null-key records."},

{q:"Which statement about acks=all and min.insync.replicas is correct?",
 o:["acks=all waits for every replica in the ISR, and min.insync.replicas defines the smallest ISR that may accept a write","min.insync.replicas only affects consumers","acks=all ignores min.insync.replicas","acks=all waits only for the leader"],a:0,
 e:"Together they define the durability contract. If ISR < min.insync.replicas the broker rejects the write with NotEnoughReplicasException rather than accept weak durability."},

{q:"What is the default value of the producer's retries setting in modern Kafka?",
 o:["0","3","Integer.MAX_VALUE, effectively bounded by delivery.timeout.ms","1"],a:2,
 e:"Since Kafka 2.1 retries defaults to Integer.MAX_VALUE, but delivery.timeout.ms still bounds the total time, so retries are not truly unbounded."},

/* ---------- 36–52 : Consumer internals ---------- */
{q:"Which consumer setting makes the broker wait until enough data accumulates before answering a fetch?",
 o:["fetch.min.bytes","max.poll.records","fetch.max.bytes","auto.commit.interval.ms"],a:0,
 e:"Combined with fetch.max.wait.ms, it lets a consumer trade a little latency for larger responses and fewer round trips."},

{q:"What does fetch.max.wait.ms do?",
 o:["Caps how long the broker waits for fetch.min.bytes to be satisfied","Caps the consumer's poll timeout","Sets the heartbeat interval","Sets the session timeout"],a:0,
 e:"Default 500 ms. The broker responds when either fetch.min.bytes is available or the wait expires — whichever comes first."},

{q:"Which setting caps the bytes returned per partition in a single fetch?",
 o:["max.partition.fetch.bytes","fetch.max.bytes","max.poll.records","receive.buffer.bytes"],a:0,
 e:"Default 1048576 (1 MB). If a record is larger than this, the consumer can stall — a classic symptom when producing large messages."},

{q:"What advantage does the cooperative sticky assignor have over eager rebalancing?",
 o:["It revokes only the partitions that actually move, avoiding a full stop-the-world rebalance","It removes the need for offsets","It eliminates heartbeats","It disables rebalances entirely"],a:0,
 e:"Cooperative rebalancing is incremental: consumers keep consuming their retained partitions while ownership of moved partitions is transferred in a second round."},

{q:"What does group.instance.id enable?",
 o:["Static membership, so a restarting consumer rejoins without triggering a rebalance","Transactional consumption","Read-only consumption","Automatic offset reset"],a:0,
 e:"With static membership the coordinator keeps the member's assignment for the duration of session.timeout.ms after a disconnect — ideal for rolling restarts of stateful services."},

{q:"Which listener callback lets you commit offsets before partitions are revoked?",
 o:["ConsumerRebalanceListener.onPartitionsRevoked()","ConsumerInterceptor.onConsume()","Deserializer.deserialize()","OffsetCommitCallback.onComplete()"],a:0,
 e:"Committing in onPartitionsRevoked avoids reprocessing records that were consumed but not yet committed when ownership moves to another consumer."},

{q:"In the classic consumer, which thread sends heartbeats?",
 o:["The application thread inside poll()","A dedicated background heartbeat thread","The broker","The group coordinator"],a:1,
 e:"A separate heartbeat thread keeps the session alive even during long processing, but exceeding max.poll.interval.ms still evicts the consumer from the group."},

{q:"What is the Last Stable Offset (LSO)?",
 o:["The offset below which all transactions are complete","The consumer's last committed offset","The leader's log end offset","The earliest offset in a compacted topic"],a:0,
 e:"A read_committed consumer can only see records below the LSO, because above it there may be open transactions whose outcome is not yet decided."},

{q:"Which exception indicates a consumer's position is outside the retained offset range?",
 o:["OffsetOutOfRangeException","RecordTooLargeException","ProducerFencedException","InvalidReplicationFactorException"],a:0,
 e:"It occurs when retention has deleted the target offset or when the group is brand new. auto.offset.reset or an explicit seek() handles it."},

{q:"What does consumer.seek() do?",
 o:["Sets the next position to fetch for a partition","Commits the current offset","Resets the whole group's offsets","Deletes records from the broker"],a:0,
 e:"seek() changes the in-memory fetch position; the next poll() reads from there. It is typically called in onPartitionsAssigned to rewind or jump forward."},

{q:"What does consumer.position() return?",
 o:["The offset of the next record that will be fetched","The last committed offset","The high watermark","The log end offset"],a:0,
 e:"It is the current fetch position. Compare it with committed() to see how far ahead of the last commit the consumer is reading."},

{q:"What is the fetch session cache (KIP-227) designed to reduce?",
 o:["Repeated partition metadata in every fetch request","Disk I/O on the broker","Consumer group rebalances","TLS handshake cost"],a:0,
 e:"It lets a consumer and broker maintain an incremental session so fetch requests only describe changes — a big saving for consumers with hundreds of partitions."},

{q:"What does consumer.committed(partition) return?",
 o:["The last offset committed by the group for that partition","The current fetch position","The log end offset","The timestamp of the last record"],a:0,
 e:"It reads from __consumer_offsets and is one half of the lag calculation, the other half being the partition's log end offset."},

{q:"Which scenario typically causes a consumer to process the same record twice?",
 o:["Processing succeeds but the offset is not committed before a crash or rebalance","Using acks=all on the producer","Enabling idempotence","Committing offsets after processing"],a:0,
 e:"At-least-once semantics means uncommitted work is replayed. Idempotent processing or transactions are required to avoid duplicate side effects."},

{q:"What happens when processing exceeds max.poll.interval.ms?",
 o:["The consumer is removed from the group and a rebalance occurs","The interval is increased automatically","Offsets are committed automatically","The consumer switches to manual partition assignment"],a:0,
 e:"The coordinator revokes the member. Fix it by lowering max.poll.records, moving long work off the poll thread, or raising max.poll.interval.ms."},

{q:"Which statement about consumer group offsets across rebalances is TRUE?",
 o:["Committed offsets persist in __consumer_offsets and are reused after the rebalance","Offsets are wiped on every rebalance","Offsets live only in consumer memory","Offsets are stored in ZooKeeper"],a:0,
 e:"A rebalance changes which consumer owns a partition, not where consumption resumes. The group's committed offsets survive membership changes."},

{q:"What does consumer.assignment() return?",
 o:["The set of partitions currently assigned to this consumer","Every partition in the cluster","The committed offsets","The members of the consumer group"],a:0,
 e:"Useful for observability and partition-aware logic. subscription() returns the set of topics the consumer asked for instead."},

/* ---------- 53–66 : Security ---------- */
{q:"Which broker setting publishes the addresses that clients will actually connect to?",
 o:["listeners","advertised.listeners","zookeeper.connect","broker.id"],a:1,
 e:"advertised.listeners is what brokers return in metadata responses. Misconfiguring it (for example with an internal hostname) is one of the most common reasons clients reach the bootstrap server but can never fetch metadata."},

{q:"What does the listeners setting control?",
 o:["The network interfaces and ports the broker binds to","The addresses returned to clients","Which compression codecs are allowed","Which ACLs are applied"],a:0,
 e:"listeners describes binding; advertised.listeners describes what is published. In Docker, NAT or load-balanced setups these intentionally differ."},

{q:"Which SASL mechanism performs a salted challenge-response instead of sending credentials in the clear?",
 o:["SASL/PLAIN","SASL/SCRAM","SASL/GSSAPI","SASL/OAUTHBEARER"],a:1,
 e:"SCRAM (SCRAM-SHA-256 or SCRAM-SHA-512) stores salted hashes and never transmits the password. SASL/PLAIN sends credentials directly and therefore requires TLS."},

{q:"What is the difference between a keystore and a truststore?",
 o:["The keystore holds this node's private key and certificate; the truststore holds CA certificates used to verify peers","The truststore holds the private key and the keystore holds the CA chain","They are the same file","Keystores are used only by clients"],a:0,
 e:"For TLS you configure the keystore on the server with its own certificate and the truststore on both sides to validate the other party's chain."},

{q:"Which of these is NOT a Kafka ACL resource type?",
 o:["Topic","Group","Cluster","Index"],a:3,
 e:"Kafka ACL resources are Topic, Group, Cluster, TransactionalId and DelegationToken. 'Index' is not a resource type."},

{q:"What is a Kafka principal?",
 o:["The authenticated identity on whose behalf requests are authorized","The leader of a partition","The active controller broker","The consumer group coordinator"],a:0,
 e:"With SASL the principal is normally the username; with mutual TLS it is derived from the certificate's distinguished name. ACLs are attached to principals."},

{q:"What does the super.users broker setting do?",
 o:["Lists principals that bypass ACL checks entirely","Lists users allowed to create topics only","Lists users allowed to read compacted topics","Disables TLS"],a:0,
 e:"Super users are effectively unrestricted, so the list should be minimal and audited. Never grant it to application service accounts."},

{q:"Which setting enables ACL-based authorization on a broker?",
 o:["authorizer.class.name","acl.enabled=true","security.protocol=SASL","listener.security.protocol.map"],a:0,
 e:"Set authorizer.class.name to AclAuthorizer (ZooKeeper mode) or StandardAuthorizer (KRaft). With no authorizer configured, every request is allowed."},

{q:"What happens when TLS hostname verification fails?",
 o:["The client refuses to connect because the certificate name does not match the broker hostname","The client silently falls back to plaintext","The broker disables authentication","The connection proceeds unencrypted"],a:0,
 e:"The correct fix is to issue certificates with the right subject alternative names. Disabling verification weakens security and should be avoided outside of test environments."},

{q:"Which SASL mechanism integrates with Kerberos?",
 o:["GSSAPI","PLAIN","SCRAM-SHA-256","OAUTHBEARER"],a:0,
 e:"SASL/GSSAPI authenticates against a Kerberos KDC, which is common in enterprise Hadoop deployments."},

{q:"What does ssl.client.auth=required configure on a broker?",
 o:["Mutual TLS, where clients must present a valid certificate","Password authentication over TLS","Optional client authentication","Server certificate verification only"],a:0,
 e:"required enforces mTLS, requested makes it optional, and none disables it. mTLS is often combined with ACLs based on the certificate's distinguished name."},

{q:"Which port does ZooKeeper traditionally listen on?",
 o:["9092","2181","9093","3306"],a:1,
 e:"9092 is the standard Kafka broker client port and 9093 is the common KRaft controller port. 2181 is ZooKeeper; 3306 is MySQL."},

{q:"What is listener.security.protocol.map used for?",
 o:["Mapping listener names to security protocols such as SASL_SSL or PLAINTEXT","Mapping principals to ACLs","Mapping topics to partitions","Mapping quotas to clients"],a:0,
 e:"For example INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL lets one broker expose a plaintext internal listener and an encrypted external one."},

{q:"Which command manages Kafka ACLs?",
 o:["kafka-acls.sh","kafka-configs.sh","kafka-topics.sh","kafka-consumer-groups.sh"],a:0,
 e:"kafka-acls.sh --add, --remove and --list manage ACLs. In KRaft mode ACLs live in cluster metadata rather than ZooKeeper."},

/* ---------- 67–76 : Kafka Connect ---------- */
{q:"What advantage does Kafka Connect distributed mode have over standalone mode?",
 o:["Multiple workers share the load and connectors and tasks fail over automatically","It removes the need for a converter","It stores all data in memory","It disables offset tracking"],a:0,
 e:"Distributed mode stores connector configs, offsets and status in Kafka topics, and workers rebalance tasks when a worker dies."},

{q:"Which topics does Kafka Connect use in distributed mode?",
 o:["config.storage.topic, offset.storage.topic and status.storage.topic","__consumer_offsets only","__transaction_state only","No topics at all"],a:0,
 e:"These three internal topics hold connector configuration, source offsets and connector/task status. They should be compacted and replicated for durability."},

{q:"What is a converter in Kafka Connect?",
 o:["A component that serialises and deserialises data between Kafka and a connector","A component that transforms a single record","A plugin that authenticates users","A tool that compacts topics"],a:0,
 e:"Common converters are AvroConverter, JsonConverter and ProtobufConverter. Choosing a mismatched converter is a frequent cause of unreadable records."},

{q:"What is a single message transform (SMT)?",
 o:["A lightweight transformation applied to each record inside Connect","A scheduled job that rewrites a whole topic","A compression codec","A custom partitioner"],a:0,
 e:"SMTs such as MaskField, ExtractField and InsertField cover simple cases without writing a custom connector. Complex logic usually belongs in Kafka Streams."},

{q:"What is the relationship between a connector and its tasks?",
 o:["The connector holds the configuration and splits the work into tasks that run in parallel","A task creates connectors","They are the same thing","Tasks only exist in standalone mode"],a:0,
 e:"The connector is the unit you configure; tasks do the copying, and their number comes from the connector type and its max.tasks setting."},

{q:"What happens to Connect tasks when a worker fails in distributed mode?",
 o:["Tasks are rebalanced onto the surviving workers and resume from committed offsets","All connectors stop permanently","Offsets are reset to zero","The internal topics are deleted"],a:0,
 e:"The Connect group protocol rebalances work to the remaining workers. Because offsets were committed, processing resumes without data loss."},

{q:"What does standalone mode lack?",
 o:["Fault tolerance and automatic rebalancing across workers","The ability to use converters","The ability to use SMTs","Offset storage"],a:0,
 e:"Standalone keeps offsets in a local file and runs a single process, which suits development and one-off jobs but not resilient production pipelines."},

{q:"What is a source connector?",
 o:["One that reads from an external system and writes into Kafka","One that reads from Kafka and writes to an external system","One that only transforms records","One that manages schemas"],a:0,
 e:"Source connectors bring data into Kafka; sink connectors take data out. A JDBC source pulls database rows, while a JDBC sink writes Kafka records into a database."},

{q:"How do you restart a failed connector task through Connect?",
 o:["Use the REST API, for example PUT /connectors/<name>/tasks/<id>/restart","Restart the whole cluster","Delete the internal topics","Run kafka-topics.sh --restart"],a:0,
 e:"The REST API also supports listing, pausing, resuming and updating connectors, which makes Connect straightforward to automate."},

{q:"What must a sink connector's write path guarantee to avoid duplicates?",
 o:["Idempotent writes or upserts keyed by a record identifier","That it writes to a compacted topic","That it uses acks=1","That it disables retries"],a:0,
 e:"Connect delivers at least once, so sinks must absorb replayed records — usually via a primary key, an upsert, or a deduplication step."},

/* ---------- 77–88 : Kafka Streams ---------- */
{q:"What does a KStream-KTable join require to be efficient?",
 o:["Both sides keyed and co-partitioned","Both sides having the same retention","A single partition","Global compaction enabled"],a:0,
 e:"Co-partitioning means matching partition counts and partitioning schemes so a stream record can be matched against the table's local state without a network shuffle."},

{q:"What is a GlobalKTable?",
 o:["A table replicated in full to every Streams instance","A table stored only on the leader broker","A table that cannot be joined","A table backed by ZooKeeper"],a:0,
 e:"GlobalKTable avoids the need for co-partitioning, at the cost of memory and restore time proportional to the table size on every instance."},

{q:"What makes a Kafka Streams state store fault tolerant?",
 o:["Its updates are written to a compacted changelog topic and can be replayed","It lives in the broker's page cache","It is written to ZooKeeper","It is backed up by the controller"],a:0,
 e:"On failure or rebalance, a task restores its store from the changelog before resuming. num.standby.replicas can shorten that restore time considerably."},

{q:"What does num.standby.replicas do in Kafka Streams?",
 o:["Maintains warm replicas of a task's state on other instances to speed failover","Replicates the input topic","Adds broker replicas","Sets the consumer group size"],a:0,
 e:"Standby tasks keep their state stores current without processing records, so promotion after a failure is nearly instantaneous."},

{q:"What does the suppress() operator do?",
 o:["Buffers aggregated results and emits them when the window closes","Drops all records","Filters duplicate keys","Compresses the output topic"],a:0,
 e:"Without suppression, windowed aggregations emit intermediate updates. suppress(untilWindowCloses) emits only the final result for each window."},

{q:"What is a punctuator in the Processor API?",
 o:["A callback invoked periodically or on stream time to run custom logic","A type of serializer","A rebalance listener","A state store implementation"],a:0,
 e:"Punctuators are used for heartbeats, buffer flushing and custom windowing logic in the low-level API."},

{q:"What are interactive queries in Kafka Streams?",
 o:["A way to read a local state store directly from the application handling the request","Queries sent to the broker's SQL engine","A replacement for ksqlDB","Consumer group monitoring"],a:0,
 e:"They expose key-value lookups from a Streams instance's state store, usually combined with a metadata service so requests are routed to the instance that owns the key."},

{q:"When does Kafka Streams create an internal repartition topic?",
 o:["When an operation changes the key, requiring records to be redistributed","On every restart","Whenever a topic has more than one partition","Only when using a GlobalKTable"],a:0,
 e:"Operations such as selectKey or groupBy with a new key insert a repartition topic so all records for a key land on the same task."},

{q:"What is the difference between groupByKey() and groupBy()?",
 o:["groupBy() may repartition because it can change the key; groupByKey() assumes the key is unchanged","They are identical","groupByKey() always repartitions","groupBy() cannot aggregate"],a:0,
 e:"groupByKey() avoids a repartition when the key is already correct, which is a significant performance win in most topologies."},

{q:"Which Kafka Streams setting enables exactly-once processing?",
 o:["processing.guarantee=exactly_once_v2","acks=all","enable.auto.commit=false","isolation.level=read_uncommitted"],a:0,
 e:"exactly_once_v2 replaces the older exactly_once option. It combines idempotent producers, transactions and atomic offset commits across the whole topology."},

{q:"What is a Streams topology?",
 o:["A directed acyclic graph of source, processor and sink nodes","The physical broker layout","The consumer group configuration","The schema evolution plan"],a:0,
 e:"You build the topology with the DSL or the Processor API, and Streams splits it into tasks assigned to the instances in the group."},

{q:"What determines the number of tasks in a Kafka Streams application?",
 o:["The number of input partitions across the topics in the topology","The number of brokers","The number of state stores","The JVM heap size"],a:0,
 e:"One task per input partition, so partition count caps parallelism. Adding instances beyond the task count leaves extra instances idle."},

/* ---------- 89–100 : Operations, monitoring, tooling ---------- */
{q:"What does the UnderReplicatedPartitions metric indicate?",
 o:["Partitions whose ISR is smaller than their replication factor","Partitions with no consumers","Topics with no retention configured","Brokers with no rack configured"],a:0,
 e:"A sustained non-zero value means durability is reduced — usually a dead broker, a slow disk, or a network problem."},

{q:"What is the expected value of ActiveControllerCount across a healthy classic cluster?",
 o:["0 on every broker","Exactly 1 across the whole cluster","1 on every broker","Equal to the number of brokers"],a:1,
 e:"Exactly one broker is the active controller. Zero means no controller exists; more than one suggests a split-brain or stale metadata."},

{q:"What does OfflinePartitionsCount measure?",
 o:["Partitions with no leader, which cannot be read or written","Partitions with no followers","Partitions with no consumers","Partitions pending deletion"],a:0,
 e:"It should always be 0. A non-zero value means a leader could not be elected, which typically needs manual intervention."},

{q:"Which command removes records before a given offset from a partition?",
 o:["kafka-delete-records.sh","kafka-topics.sh --purge","kafka-log-dirs.sh --clean","kafka-reassign-partitions.sh --delete"],a:0,
 e:"You supply a JSON file of partition offsets, and the broker advances the log start offset, freeing the segments below it."},

{q:"Which tool reports per-broker log directory sizes?",
 o:["kafka-log-dirs.sh","kafka-dump-log.sh","kafka-configs.sh","kafka-acls.sh"],a:0,
 e:"It is useful for capacity planning and for spotting the broker that will run out of disk before it stops accepting writes."},

{q:"What is kafka-dump-log.sh used for?",
 o:["Inspecting the contents of a segment, index or transaction log file","Dumping a topic to CSV","Printing broker configuration","Listing consumer groups"],a:0,
 e:"With --files and --print-data-log it shows the record batches, offsets and metadata inside a .log file — invaluable for debugging corrupt or unexpected data."},

{q:"Which tool generates load to measure producer throughput?",
 o:["kafka-verifiable-producer.sh","kafka-console-consumer.sh","kafka-topics.sh","kafka-acls.sh"],a:0,
 e:"kafka-verifiable-producer and kafka-verifiable-consumer are simple harnesses; kafka-producer-perf-test.sh and kafka-consumer-perf-test.sh give detailed throughput and latency figures."},

{q:"What do client quotas control in Kafka?",
 o:["Per-user or per-client byte-rate and request-rate limits","Disk usage per topic","The number of partitions per topic","The number of consumer groups"],a:0,
 e:"Quotas protect a cluster from noisy clients. They are set with kafka-configs.sh against user, client-id or ip entities."},

{q:"Which metric indicates that request handler threads are saturated?",
 o:["RequestHandlerAvgIdlePercent near zero","ActiveControllerCount equal to 1","LogFlushRateAndTimeMs","UnderReplicatedPartitions"],a:0,
 e:"A low idle percentage means request handlers are the bottleneck, usually because of slow disk I/O. Raising num.io.threads helps only if the storage can keep up."},

{q:"What does Burrow monitor?",
 o:["Consumer lag, with an evaluation of whether consumers are progressing normally","Broker disk usage","Schema compatibility","Topic retention settings"],a:0,
 e:"Burrow computes lag and assigns a status such as OK, WARNING or ERROR based on consumer behaviour rather than a raw lag number, which cuts false alarms."},

{q:"Which command inspects the KRaft controller quorum?",
 o:["kafka-metadata-quorum.sh --describe","kafka-topics.sh --describe","kafka-configs.sh --describe","kafka-acls.sh --list"],a:0,
 e:"It reports the leader, the voters and the replication lag of the metadata log — the KRaft equivalent of checking controller health."},

{q:"What does kafka-leader-election.sh do?",
 o:["Triggers a preferred or unclean leader election for specified partitions","Deletes partition leaders","Creates new partitions","Rebalances consumer groups"],a:0,
 e:"--election-type PREFERRED restores the preferred replica as leader to balance load; UNCLEAN promotes an out-of-sync replica, which risks data loss."}
];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  // explanation
  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  // button states
  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;  // click again to clear
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete — Set 2</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  // wire up results buttons
  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
