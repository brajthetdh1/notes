<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Mock Test — Set 3 · 100 MCQs</title>
<meta name="description" content="100 all-new Docker MCQs: container lifecycle and exit codes, runtime commands, networking internals, storage drivers, supply-chain security, Compose v2, BuildKit caching, registries and troubleshooting.">
<style>
  :root{
    --brand:#6d28d9;
    --brand-dark:#4c1d95;
    --accent:#a855f7;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#2e1065;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#f3e8ff;border-color:#e9d5ff}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(109,40,217,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#faf5ff}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#f3e8ff}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐳 Docker Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>

        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>

      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — DOCKER SET 3 · 100 MCQs
   q = question, o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [

/* ---------- 1–10 : Lifecycle & exit codes ---------- */
{q:"A container vanished and `docker ps -a` shows exit code 137. What does that usually mean?",
 o:["The process was killed by SIGKILL, commonly because the container exceeded its memory limit (OOMKilled)",
    "The command was not found inside the image",
    "The container never started",
    "The image pull was interrupted"],a:0,
 e:"137 is 128 + 9, i.e. terminated by SIGKILL. The usual causes are the kernel OOM killer after exceeding --memory, or an explicit `docker kill` / `docker rm -f`."},

{q:"What does exit code 143 indicate?",
 o:["A segmentation fault","The container was stopped with SIGTERM (128 + 15)","A missing entrypoint","A port conflict"],a:1,
 e:"143 is the conventional shell encoding for termination by signal 15. A graceful `docker stop` normally produces 143 because the JVM or app exits on SIGTERM."},

{q:"A container exits immediately with code 127. What is the cause?",
 o:["Out of memory","The executable in CMD or ENTRYPOINT was not found","The image is read-only","The network is unreachable"],a:1,
 e:"127 is the shell convention for 'command not found'. Typical causes are a wrong path, a missing shell in a distroless base, or a typo in CMD."},

{q:"Exit code 125 means what?",
 o:["The command inside the container failed","The container was killed by the OOM killer","Docker itself failed to run the container, e.g. a bad flag or daemon error","The healthcheck failed"],a:2,
 e:"125 is produced by the Docker CLI when the run request cannot be fulfilled at all — an unknown flag, an invalid mount spec, or a daemon-side rejection."},

{q:"What does exit code 126 tell you?",
 o:["A command was found but could not be executed, such as a missing execute permission","A network timeout occurred","The image does not exist","The container ran out of disk"],a:0,
 e:"126 means the file exists but is not executable or is a directory. A classic case is COPY of a script without `chmod +x` or without invoking it through sh."},

{q:"What happens by default when you run `docker stop mycontainer`?",
 o:["It sends SIGKILL immediately","It sends SIGTERM, then SIGKILL after a 10-second grace period","It pauses the container","It removes the container"],a:1,
 e:"The daemon sends SIGTERM to PID 1 and waits for the timeout (10s by default, set with -t or --time) before escalating to SIGKILL."},

{q:"What signal does `docker kill` send by default?",
 o:["SIGTERM","SIGINT","SIGHUP","SIGKILL"],a:3,
 e:"Unlike docker stop, kill is not graceful — it defaults to SIGKILL. Use `docker kill -s TERM` when you want a polite shutdown through the kill command."},

{q:"How does `docker pause` freeze a container?",
 o:["It sends SIGSTOP to every process","It uses the cgroup freezer controller","It unmounts the container filesystem","It disconnects the container from the network"],a:1,
 e:"The freezer cgroup controller halts all tasks atomically, and `docker unpause` thaws them. The container keeps its memory and PID state throughout."},

{q:"What does the restart policy `--restart on-failure:5` do?",
 o:["Restarts the container up to 5 times only when it exits with a non-zero code","Restarts exactly 5 times regardless of exit code","Restarts every 5 seconds","Never restarts the container"],a:0,
 e:"A clean exit (code 0) stops the retry loop. Use `always` or `unless-stopped` for services that should survive any exit."},

{q:"Why does `docker run --rm --restart always` fail?",
 o:["--rm requires a volume","--restart cannot be combined with --rm, since one removes the container and the other requires it to persist","--rm only works with detached containers","always is not a valid restart policy"],a:1,
 e:"Docker rejects the combination with 'Conflicting options: --restart and --rm'. Choose automatic cleanup for one-off jobs, or a restart policy for long-running services."},

/* ---------- 11–20 : Runtime control ---------- */
{q:"How do you change the memory limit of an already running container?",
 o:["docker update --memory 512m <container>","docker run --memory 512m <container>","docker commit --memory 512m <container>","It is impossible without recreating the container"],a:0,
 e:"docker update changes CPU, memory and restart policy on a live container. Many other settings, such as ports and mounts, still require a recreate."},

{q:"What does `docker wait <container>` do?",
 o:["Pauses the container until you resume it","Blocks until the container exits and then prints its exit code","Waits for the image to be pulled","Waits for the healthcheck to pass"],a:1,
 e:"It is useful in scripts that start a one-off container and need its result, for example a database migration job in CI."},

{q:"Which command shows the host-to-container port mappings of a container?",
 o:["docker inspect --ports","docker port <container>","docker ps --ports","docker network ls --ports"],a:1,
 e:"docker port prints the published mappings. docker inspect also exposes them under NetworkSettings.Ports if you need structured output."},

{q:"What does `docker top <container>` show?",
 o:["The container's image layers","The container's log stream","The host's process listing for the processes running inside the container","The container's CPU history"],a:2,
 e:"It runs the host's ps against the container's PID namespace. Inside a container there is no ps binary in many minimal images, so this is a convenient alternative."},

{q:"Which command renames a container?",
 o:["docker rename <old> <new>","docker mv <old> <new>","docker update --name <new> <old>","docker commit --name <new> <old>"],a:0,
 e:"Renaming is safe and keeps the container ID, but DNS on user-defined networks and any scripts referencing the old name must be updated."},

{q:"What is the difference between `docker attach` and `docker exec`?",
 o:["They are the same command","attach connects to PID 1's stdio; exec starts a brand-new process inside the container","exec only works on stopped containers","attach is only for Swarm services"],a:1,
 e:"Attaching shares the main process's terminal, so Ctrl+C can kill the container. exec spawns a separate process, which is why `exec -it sh` is the safe way to get a shell."},

{q:"What does `docker start -ai mycontainer` do?",
 o:["Starts the container and attaches to it interactively","Starts the container in the background","Restarts the container and prints logs","Starts all containers"],a:0,
 e:"-a attaches to the stdio and -i keeps stdin open. It is the standard way to resume a previously created container interactively."},

{q:"Why is `docker stats --no-stream` useful in scripts?",
 o:["It produces a single snapshot of resource usage and exits","It disables the network","It stops the containers","It only shows exited containers"],a:0,
 e:"Without --no-stream, docker stats keeps refreshing and never returns. The flag makes it a one-shot command suitable for cron jobs and monitoring agents."},

{q:"Which command prints only the exit code of a finished container?",
 o:["docker logs --exit <container>","docker inspect --format '{{.State.ExitCode}}' <container>","docker ps --exit","docker wait --code <container>"],a:1,
 e:"Go templates with docker inspect extract any field. This is the cleanest way to assert on an exit status in a shell script."},

{q:"Which command lists only the containers that have exited?",
 o:["docker ps --filter status=exited","docker ps -a --exited","docker container ls --stopped","docker ps --dead"],a:0,
 e:"Filters accept status=exited, status=created, status=running and so on. Combine with --format to get just names or IDs for cleanup scripts."},

/* ---------- 21–30 : Networking in depth ---------- */
{q:"What does `--network-alias db` give a container?",
 o:["An additional DNS name on that network, besides its container name","A static IP address","A hostname on the host machine","A new MAC address"],a:0,
 e:"Aliases let several containers answer to the same name, which enables simple client-side load balancing. Aliases are scoped to a network."},

{q:"What does creating a network with `--internal` achieve?",
 o:["It blocks outbound connectivity to external networks","It encrypts container traffic","It disables DNS","It exposes the network to the host only"],a:0,
 e:"An internal bridge has no default gateway and no NAT, so containers can talk to each other but not to the internet. This is common for back-end tiers such as databases."},

{q:"How do you make a container use a specific DNS resolver?",
 o:["docker run --dns 1.1.1.1 myimage","docker run --resolver 1.1.1.1 myimage","docker network create --dns 1.1.1.1","You cannot override DNS"],a:0,
 e:"--dns replaces the host's resolv.conf entries. --dns-search and --dns-option are the companions for search domains and resolver options."},

{q:"What is the difference between `--name` and `--hostname`?",
 o:["They are identical","--name sets the Docker container name; --hostname sets the hostname the container sees","--hostname only works in Swarm","--name sets the hostname"],a:1,
 e:"The container name is used for DNS on user-defined networks and for CLI commands. The hostname is what `hostname` prints inside the container and is a separate setting."},

{q:"What is the default gateway address of Docker's default bridge network, absent custom config?",
 o:["172.17.0.1","10.0.0.1","192.168.99.1","172.18.0.254"],a:0,
 e:"docker0 is typically 172.17.0.1/16, and containers receive addresses in that range. Custom networks get sequentially allocated subnets such as 172.18.0.0/16."},

{q:"How do you publish a range of host ports to a matching range in the container?",
 o:["docker run -p 8000-8010:8000-8010 myimage","docker run -p 8000..8010:8000..8010 myimage","docker run -p 8000/8010:8000/8010 myimage","Port ranges cannot be published"],a:0,
 e:"The dash form maps the ranges one-to-one, so host 8000 goes to container 8000 and so on. It is handy for services that open several consecutive ports."},

{q:"What is required before you can use `docker run --ip 10.10.0.50`?",
 o:["Nothing, static IPs always work","The container must be on a user-defined network that has an explicitly configured subnet","Host networking must be enabled","The image must be built with a static IP"],a:1,
 e:"Static addressing is only supported on user-defined networks with a declared --subnet. The default bridge does not support --ip."},

{q:"Applications hang on large HTTPS requests inside containers but small requests work. What is the most likely cause?",
 o:["The container has no DNS server","An MTU mismatch — commonly with VPNs or overlay networks — silently drops large packets","The image is missing CA certificates for all requests","The container is out of memory"],a:1,
 e:"Small handshakes succeed while large payloads stall at the path-MTU limit. Set a matching MTU on the Docker network or the container's interface."},

{q:"What does `docker network prune` remove?",
 o:["All networks, including ones in use","Only networks not used by any container","Only the default bridge","Only overlay networks"],a:1,
 e:"Unlike volumes, networks are usually safe to prune because they are configuration rather than data. The default bridge, host and none networks are never removed."},

{q:"How does ipvlan differ from macvlan?",
 o:["ipvlan assigns one shared MAC address to many containers; macvlan gives each container its own MAC","ipvlan is encrypted; macvlan is not","ipvlan only works on Windows","They are identical"],a:0,
 e:"Because ipvlan shares the host's MAC, it typically works where macvlan is blocked by switch port security, at the cost of L2 isolation between the containers."},

/* ---------- 31–40 : Storage & volumes in depth ---------- */
{q:"What does `docker run --volumes-from other` do?",
 o:["Copies files from the other container's filesystem","Mounts the same volumes that the other container has mounted","Shares the other container's network","Reuses the other container's image"],a:1,
 e:"It is convenient for backup and sidecar containers, because you do not need to enumerate volume names. The volumes are shared, not copied."},

{q:"What does the `nocopy` volume option do?",
 o:["Prevents the volume from being removed","Prevents data in the image at that path from being copied into a new empty volume","Makes the mount read-only","Disables caching"],a:1,
 e:"By default a new named volume is pre-populated from the image path. nocopy skips that, which speeds up volume creation and avoids surprising file duplication."},

{q:"What extra information does `docker system df -v` show compared with `docker system df`?",
 o:["It shows per-image, per-container and per-volume sizes plus the number of links","It only shows network usage","It shows registry bandwidth","It shows build timings"],a:0,
 e:"The verbose view pinpoints what is actually consuming disk — a specific image, a stopped container's writable layer, or an orphaned volume."},

{q:"What characterises the vfs storage driver?",
 o:["It performs full copies of each layer with no copy-on-write, so it is correct but slow and disk-hungry","It is the default on modern kernels","It compresses all layers","It deduplicates identical files across layers"],a:0,
 e:"vfs is a fallback for filesystems or kernels that cannot support overlay. Each layer is a complete copy, which is why it is used mainly for testing."},

{q:"What is required on the host before `docker run --storage-opt size=10G` works?",
 o:["A tmpfs-backed data root","The overlay2 driver on an XFS filesystem mounted with the pquota option","The vfs driver","A remote volume plugin"],a:1,
 e:"Per-container writable-layer quotas depend on project quotas. Without pquota on the backing XFS filesystem, Docker rejects the size option."},

{q:"What do the `:cached` and `:delegated` mount options control?",
 o:["Read-only versus read-write access","Filesystem sync hints that relax consistency for bind mounts, mainly on Docker Desktop for macOS","The SELinux label","The mount propagation mode"],a:1,
 e:"delegated gives the container's view priority; cached gives the host priority. They reduce latency on virtualised filesystems and have no effect on native Linux."},

{q:"How do you limit the size of a tmpfs mount at runtime?",
 o:["docker run --tmpfs /tmp:rw,size=64m myimage","docker run --tmpfs /tmp:limit=64m myimage","docker run -v /tmp:tmpfs64m myimage","tmpfs size cannot be limited"],a:0,
 e:"The option string is passed to the mount, so size, mode and nosuid are all valid. A sized tmpfs prevents a runaway cache from consuming host memory."},

{q:"A bind-mounted directory is readable by root inside the container but a non-root app gets permission denied. What is the usual fix?",
 o:["Run the container with `--user $(id -u):$(id -g)` so the UIDs match the host file owner","Disable SELinux","Use a named volume","Add --privileged"],a:0,
 e:"The container's UID must map to an owner of the host file. Running as the host user is the simplest fix; chown on the host is the alternative."},

{q:"What does `docker export` produce compared with `docker save`?",
 o:["A flattened tar of the container's filesystem, losing image history and metadata","A tar of all image layers with full metadata","A Compose file","A volume snapshot"],a:0,
 e:"export works on a container and produces a single-layer tar. save works on an image and preserves every layer and the config, which is what you want for a registry-free transfer."},

{q:"What does `docker import` create from a tarball?",
 o:["A container","A single-layer image from a filesystem tarball, without history","A volume","A network"],a:0,
 e:"import turns a root filesystem tar into an image. Because it has no Dockerfile history, it is used for base images built outside the normal build flow."},

/* ---------- 41–50 : Security & supply chain ---------- */
{q:"Why is mounting `/var/run/docker.sock` into a container dangerous?",
 o:["It slows the container down","Anyone with access to the socket can control the daemon and effectively gain root on the host","It breaks DNS resolution","It prevents the container from using volumes"],a:1,
 e:"The socket is the daemon's full API. A process that can reach it can start a privileged container with the host's root filesystem mounted, escaping isolation entirely."},

{q:"What is keyless signing with cosign/Sigstore?",
 o:["Signing images with a self-signed certificate stored in the image","Signing artefacts using an OIDC identity and a short-lived certificate recorded in a transparency log","Encrypting images without keys","Signing only the Dockerfile"],a:1,
 e:"Keyless signing removes long-lived private keys. The identity — a CI job or a developer account — is bound to the signature and verifiable through the transparency log."},

{q:"How do you generate an SBOM as part of a buildx build?",
 o:["docker buildx build --sbom=true --output type=image,push=true .","docker build --sbom .","docker sbom create .","SBOMs can only be generated after pulling"],a:0,
 e:"BuildKit attaches an SPDX or CycloneDX SBOM as an attestation alongside the image, so consumers can inspect dependencies without rebuilding."},

{q:"What is a provenance attestation in a container image?",
 o:["A record of how and where the image was built, including source and builder information","A list of CVEs","A runtime log","A signature over the Dockerfile"],a:0,
 e:"Provenance lets consumers verify the build pipeline. buildx can generate it with --provenance, and it travels with the image as an attestation manifest."},

{q:"How do you run a container with an immutable root filesystem but a writable /tmp?",
 o:["docker run --read-only --tmpfs /tmp myimage","docker run --read-only --volume /tmp myimage","docker run --immutable myimage","docker run --ro-root myimage"],a:0,
 e:"The read-only root stops writes to the image filesystem, while the tmpfs gives the application scratch space that never touches disk."},

{q:"What does `--security-opt seccomp=unconfined` do?",
 o:["Applies a stricter syscall filter","Disables syscall filtering entirely for the container","Removes all Linux capabilities","Encrypts the container's syscalls"],a:1,
 e:"It is a debugging tool: if a program works unconfined but fails with the default profile, the profile is blocking a syscall. Do not ship this to production."},

{q:"Which capability is enabled by default in Docker containers and is often considered risky?",
 o:["SYS_ADMIN","NET_RAW","SYS_PTRACE","SYS_MODULE"],a:1,
 e:"NET_RAW allows crafting raw packets, which enables ARP spoofing and similar attacks on a shared network. Drop it with --cap-drop=NET_RAW when not needed."},

{q:"In rootless Docker, what must be adjusted to bind privileged ports below 1024?",
 o:["Nothing, it always works","The unprivileged port start sysctl must be lowered, or the NET_BIND_SERVICE capability added","The container must run as root","Docker must be reinstalled"],a:1,
 e:"Without host root, the kernel refuses low ports by default. Setting net.ipv4.ip_unprivileged_port_start=0 or granting the capability restores the behaviour."},

{q:"What does `--userns=host` do?",
 o:["Disables user namespace remapping for that container, so the container's UIDs map directly to host UIDs","Enables remapping for the first time","Gives the container host root","Creates a new user namespace"],a:0,
 e:"It is an escape hatch for containers that need host UID semantics, such as some volume-permission scenarios. It removes the protection that userns-remap provides."},

{q:"Why can passing a secret through a build ARG leak it?",
 o:["ARG values are stored in the image and visible through docker history","ARG values are written to the registry log","ARGs are broadcast on the network","They cannot leak"],a:0,
 e:"Build arguments are recorded in image metadata even when they are not used at runtime. Use BuildKit secret mounts so the value never becomes part of a layer or the config."},

/* ---------- 51–60 : Compose v2 in depth ---------- */
{q:"Which command copies files between the host and a Compose service container?",
 o:["docker compose cp <service>:<path> <hostpath>","docker compose copy","docker compose scp","docker compose mv"],a:0,
 e:"compose cp mirrors docker cp and resolves the service name to the right container, which avoids looking up container IDs by hand."},

{q:"What does the top-level `include` key do in a Compose file?",
 o:["Includes other Compose files, so their services are merged into the project","Includes environment variables","Includes a Dockerfile","Includes volumes from another project"],a:0,
 e:"Added in Compose 2.20, include is a cleaner alternative to very long -f chains, and included files are resolved with their own relative paths."},

{q:"How do you set a Compose project name without renaming the directory?",
 o:["The top-level `name:` key, or the COMPOSE_PROJECT_NAME environment variable","Only the directory name can set it","--project-name cannot be changed","Set it in the Dockerfile"],a:0,
 e:"The project name prefixes container, network and volume names, so setting it explicitly keeps resources stable when the directory is renamed or in CI checkouts."},

{q:"What does `docker compose down --remove-orphans` do?",
 o:["Removes containers for services that no longer exist in the Compose file","Removes volumes","Removes images","Removes networks only"],a:0,
 e:"Orphans appear when you rename or delete a service. Without the flag they linger and keep holding ports and names, which produces confusing conflicts."},

{q:"If a variable is defined in both `env_file` and `environment`, which wins?",
 o:["env_file","environment","Whichever appears first in the file","Neither, Compose errors"],a:1,
 e:"Explicit `environment` entries override env_file values. This lets you keep a shared env file and override specific keys per service or per override file."},

{q:"How are Compose secrets delivered to a container?",
 o:["As environment variables","As files mounted under /run/secrets by default","As image layers","As network messages"],a:1,
 e:"The top-level secrets section references a file or an external secret, and each service lists the ones it needs. The app reads the file at startup."},

{q:"What does `start_period` in a Compose healthcheck control?",
 o:["How often the check runs","A grace window during which failing checks do not count toward the retry limit","The command's timeout","The restart delay"],a:1,
 e:"It is essential for slow starters. Without it, a service that takes 60 seconds to boot can be marked unhealthy and restart-looped by orchestrators."},

{q:"Which command creates the containers and networks for a project without starting them?",
 o:["docker compose create","docker compose build","docker compose up --no-start","docker compose config"],a:0,
 e:"create prepares the containers so you can inspect them or start a subset later with `docker compose start <service>`."},

{q:"How do you suppress the service-name prefix on every log line?",
 o:["docker compose logs --no-log-prefix","docker compose logs --raw","docker compose logs --quiet","Pipes cannot remove prefixes"],a:0,
 e:"Useful when piping to a log analyser that expects clean output. Without it, each line is prefixed with the service name and a pipe character."},

{q:"If a service declares `deploy.replicas: 3`, how do you temporarily run five?",
 o:["docker compose up --scale <service>=5","docker compose up --replicas 5","docker compose scale 5","Replicas cannot be overridden"],a:0,
 e:"--scale overrides the declared replica count for that run. If the service publishes a fixed host port, scaling fails with a port conflict."},

/* ---------- 61–70 : BuildKit & caching ---------- */
{q:"You ran `docker buildx build -t myapp .` and then `docker images` does not show myapp. Why?",
 o:["The build failed silently","With buildx, the result stays in the build cache unless you pass --load or --push","The tag is invalid","BuildKit cannot tag images"],a:1,
 e:"This is the most common buildx gotcha. Add --load to import the image into the local daemon, or --push to send it straight to a registry."},

{q:"How do you pass a secret to a build without baking it into a layer?",
 o:["docker buildx build --secret id=npmrc,src=.npmrc . and RUN --mount=type=secret,id=npmrc ...","docker build --arg SECRET=... .","docker build --env SECRET=... .","Secrets cannot be passed to builds"],a:0,
 e:"The secret is mounted only for the duration of the RUN step, at /run/secrets/<id>, and is never written to any layer or to the image config."},

{q:"What does `--output type=local,dest=./dist` do on a buildx build?",
 o:["Writes the build result files to a directory on the host","Pushes to a registry","Loads the image into the daemon","Exports the build cache"],a:0,
 e:"This is the idiomatic way to extract compiled binaries from a build stage without ever producing a runnable image."},

{q:"Which buildx cache backend stores the cache in GitHub Actions?",
 o:["--cache-to type=gha,mode=max","--cache-to type=registry","--cache-to type=local","--cache-to type=inline"],a:0,
 e:"The gha backend uses the Actions cache API. mode=max caches intermediate layers too, which speeds up multi-stage builds considerably."},

{q:"Which command frees disk space used by build cache?",
 o:["docker buildx prune","docker image prune","docker system prune","docker builder gc"],a:0,
 e:"BuildKit keeps its own content store, so image prune alone may not reclaim it. docker buildx du shows usage and buildx prune removes it."},

{q:"Since which Docker release is BuildKit the default builder?",
 o:["17.06","19.03","23.0","25.0"],a:2,
 e:"BuildKit became opt-in with DOCKER_BUILDKIT=1 around 18.09 and the default engine builder in Docker 23.0."},

{q:"What does `--no-cache-filter <stage>` allow?",
 o:["Skipping the cache for one named stage while keeping it for the rest","Disabling the cache entirely","Caching only the final stage","Ignoring the .dockerignore"],a:0,
 e:"Useful for stages that fetch fast-moving upstream data — you invalidate just that stage instead of throwing away the whole cache."},

{q:"Which command builds an image using a Dockerfile that is not in the build context root?",
 o:["docker build -f docker/Dockerfile.prod .","docker build --dockerfile docker/Dockerfile.prod .","docker build -d docker/Dockerfile.prod .","It is not possible"],a:0,
 e:"-f sets the Dockerfile path. It still must be inside the build context unless you use a URL or BuildKit features that support remote files."},

{q:"How do you build directly from a git repository?",
 o:["docker build https://github.com/user/repo.git#branch:path","docker build --git https://github.com/user/repo.git","docker build git@github.com:user/repo.git","Only local directories are supported"],a:0,
 e:"Docker clones the repository, and the fragment selects a branch, tag or commit plus an optional subdirectory. It is handy for quick builds without cloning."},

{q:"What does `docker build - < Dockerfile` do?",
 o:["Reads the Dockerfile from stdin and builds with an empty build context","Builds the current directory","Fails because a context is required","Pulls the Dockerfile from a registry"],a:0,
 e:"Because there is no context, COPY and ADD cannot reference local files. A .tar.gz sent on stdin is used as the context instead."},

/* ---------- 71–80 : Image size & registries ---------- */
{q:"What does `COPY --link` change?",
 o:["It copies files into a new layer that does not depend on the previous layer, improving cache reuse and parallelism","It creates a symlink instead of a copy","It copies from a URL","It makes the copy read-only"],a:0,
 e:"Because the layer is independent, changing earlier instructions does not invalidate it. The trade-off is that the resulting files cannot be modified by later RUN instructions."},

{q:"Why can a prebuilt binary fail on Alpine with a 'not found' error even though the file exists?",
 o:["Alpine uses musl libc and does not provide glibc, so dynamically linked binaries fail","Alpine does not support executables","The binary is too large for Alpine","Alpine lacks a filesystem"],a:0,
 e:"The dynamic linker path the binary expects (/lib64/ld-linux-x86-64.so.2) does not exist. Use gcompat, a static build, or a Debian slim base instead."},

{q:"How do you debug a distroless container that has no shell?",
 o:["Use an ephemeral debug container or a debug variant image that adds a busybox shell","Run docker exec with /bin/bash anyway","Mount the host filesystem","Distroless images cannot be debugged"],a:0,
 e:"Distroless images ship only the app and its runtime. Kubernetes ephemeral containers, or a parallel debug image with the same labels, give you tooling without bloating production."},

{q:"What is the `dive` tool used for?",
 o:["Scanning images for CVEs","Inspecting image layers to find wasted space and missed cache opportunities","Managing volumes","Running containers without a daemon"],a:1,
 e:"dive shows per-layer contents and an efficiency score, which makes it easy to spot a huge layer caused by installing and then removing packages in separate RUN steps."},

{q:"What does the SIZE column in `docker images` report?",
 o:["The compressed size in the registry","The uncompressed on-disk size of the image layers as stored locally","The size of the container's writable layer","The size of the build context"],a:1,
 e:"Registry and Docker Hub sizes are usually smaller because they are gzip-compressed per layer. Local size reflects uncompressed layers."},

{q:"What does HTTP 429 TOOMANYREQUESTS from Docker Hub mean?",
 o:["The image does not exist","You have hit a pull rate limit and must authenticate or wait","The registry is under maintenance","Your credentials are wrong"],a:1,
 e:"Anonymous pulls are rate limited per IP. Logging in, using a pull-through cache, or mirroring images internally avoids the limit in CI."},

{q:"What does `docker pull nginx@sha256:abc...` guarantee?",
 o:["That you get exactly that image content, regardless of tags","That you get the newest nginx","That the image is signed","Nothing more than a normal pull"],a:0,
 e:"A digest is a content address. Tags can be repointed, but the digest is immutable, which makes it the strongest pin for production deployments."},

{q:"What does tag immutability in a registry enforce?",
 o:["An existing tag cannot be overwritten by a new push","Tags can never be deleted","Images cannot be pulled by tag","Tags must include a date"],a:0,
 e:"It prevents the classic 'we shipped latest and got something else' problem. Combined with digest pinning, it makes deployments reproducible."},

{q:"What does registry garbage collection do?",
 o:["Removes blobs that are no longer referenced by any manifest","Deletes all images older than 30 days","Compresses the registry database","Rotates access logs"],a:0,
 e:"Deleting a tag only removes the manifest, not the layers. GC reclaims the orphaned blobs, and it typically requires the registry to run read-only or be stopped."},

{q:"What is `credsStore` in `~/.docker/config.json` for?",
 o:["Naming a credential helper binary that stores registry logins in the OS keychain","Setting the default registry","Enabling TLS","Defining a proxy"],a:0,
 e:"Instead of storing base64 credentials in config.json, Docker delegates to helpers such as osxkeychain, secretservice or wincred. This is much safer on shared machines."},

/* ---------- 81–90 : Troubleshooting error messages ---------- */
{q:"`docker run -p 8080:80` fails with 'port is already allocated'. What is the cause?",
 o:["The container's port 80 is not open","Another process or container already listens on host port 8080","The image does not expose port 80","The bridge network is down"],a:1,
 e:"The host port is exclusive to one binding. Run `docker ps` and `ss -lntp` to find the owner, then publish a different host port or stop the conflicting service."},

{q:"What does 'Conflict. The container name is already in use' mean?",
 o:["A stopped or running container already holds that name","The image tag is duplicated","The network name clashes","The volume is locked"],a:0,
 e:"Names must be unique. Remove the old container with `docker rm <name>`, use --rm for throwaway runs, or pick a different name."},

{q:"`docker run` fails with 'no space left on device'. What is the standard first response?",
 o:["Reinstall Docker","Check `docker system df` and prune unused images, containers, volumes and build cache, or move the data root to a bigger disk","Increase the container's memory limit","Restart the daemon"],a:1,
 e:"Container writable layers, images, volumes and the build cache all live under the Docker root. Freeing space or relocating /var/lib/docker fixes it; the root cause is usually untuned logging or unbounded retention."},

{q:"An image pulled on an ARM machine fails with 'exec format error'. Why?",
 o:["The image was built for a different CPU architecture","The image is corrupt","The container lacks execute permission","The kernel is too old"],a:0,
 e:"There is no emulation configured. Use a multi-arch image, build for the right platform with buildx, or enable binfmt/QEMU emulation on the host."},

{q:"What are the common causes of 'Cannot connect to the Docker daemon'?",
 o:["The daemon is not running, the context or DOCKER_HOST points elsewhere, or the socket permissions deny the user","The image does not exist","The network is down","The container is OOMKilled"],a:0,
 e:"Check `docker context ls`, `systemctl status docker`, and the permissions on /var/run/docker.sock. In CI it is often the daemon simply not being started."},

{q:"'permission denied while trying to connect to the Docker daemon socket' — what is the usual fix?",
 o:["Add the user to the docker group (or use sudo), while accepting that docker group membership is effectively root","Reinstall the CLI","Set DOCKER_TLS_VERIFY=0","Delete the socket"],a:0,
 e:"The socket is owned by root:docker. The alternative that avoids root-equivalent access is rootless Docker or a socket proxy that restricts the API."},

{q:"Which command shows the daemon endpoint the CLI will use?",
 o:["docker context ls, plus DOCKER_HOST if set","docker info --host","docker network ls","docker version --remote-only"],a:0,
 e:"The active context determines the endpoint and TLS settings. DOCKER_HOST overrides the context, which often explains why a command talks to the wrong engine."},

{q:"How do you securely connect the CLI to a remote daemon over TLS?",
 o:["docker --tlsverify --tlscacert ca.pem --tlscert cert.pem --tlskey key.pem -H tcp://host:2376 ps","docker -H tcp://host:2375 ps","docker remote connect host","Use SSH port forwarding only"],a:0,
 e:"Port 2376 is the TLS port; 2375 is plaintext and should never be exposed. The daemon must be started with the matching --tlsverify flags."},

{q:"Which `docker info` field tells you whether the host uses cgroup v1 or v2?",
 o:["Cgroup Version","Storage Driver","Kernel Version","Server Version"],a:0,
 e:"The value is 1 or 2. Many modern resource-limit behaviours and some --cpus semantics differ between cgroup versions, so it is worth checking when limits look odd."},

{q:"What does `--cgroup-parent` do?",
 o:["Places the container's cgroups under a specified parent cgroup, such as a systemd slice","Sets the container's parent image","Assigns a parent network","Creates a parent volume"],a:0,
 e:"This lets you apply host-wide resource policy to a group of containers. On systemd hosts the convention is to use a slice such as system.slice or a custom one."},

/* ---------- 91–100 : Host configuration & limits ---------- */
{q:"How do you raise the open-file limit for a single container?",
 o:["docker run --ulimit nofile=65536:65536 myimage","docker run --nofile 65536 myimage","docker run --open-files 65536 myimage","Only the host limit can be changed"],a:0,
 e:"--ulimit sets soft:hard limits per container. It is essential for servers that hold many sockets; without it you hit the default 1024 and see 'too many open files'."},

{q:"Why is `--oom-kill-disable` risky?",
 o:["It requires a memory limit and, without one, the host itself can be starved of memory","It disables all networking","It prevents the container from starting","It removes the volume"],a:0,
 e:"Disabling the OOM killer means memory pressure is absorbed by the host, potentially freezing the whole machine. It is only reasonable with a hard --memory limit and a clear reason."},

{q:"How do you give a container access to a host device such as a GPU or serial port?",
 o:["docker run --device /dev/ttyUSB0 myimage","docker run --privileged-only /dev/ttyUSB0 myimage","docker run -v /dev:/dev myimage","Devices cannot be passed through"],a:0,
 e:"--device grants access to a specific device node. Mounting all of /dev or using --privileged gives far more access than necessary."},

{q:"Why is `--ipc=host` a security concern?",
 o:["It shares the host's IPC namespace, so the container can see and interact with host shared memory and semaphores","It opens host ports","It disables DNS","It grants root in the container"],a:0,
 e:"Shared memory segments from other processes become visible, which can leak data or allow interference. Use a dedicated IPC namespace unless a workload genuinely needs host IPC."},

{q:"Which pattern in a .dockerignore matches files at any depth?",
 o:["**/*.log","*.log only","/log","log/*"],a:0,
 e:"Docker uses Go's filepath.Match patterns, where ** matches any number of directories. Patterns are evaluated in order, so a later !pattern can re-include something."},

{q:"How do you inspect an image's manifest list without pulling it?",
 o:["docker manifest inspect nginx","docker inspect nginx --remote","docker image --manifest nginx","You must pull first"],a:0,
 e:"It shows the per-platform manifests and their digests, which answers 'does this tag support arm64?' before spending bandwidth on a pull."},

{q:"What does `docker buildx imagetools inspect` add over `docker manifest inspect`?",
 o:["Readable output including per-platform layers, digests and attached attestations such as SBOMs","It can only inspect local images","It builds images","It signs images"],a:0,
 e:"imagetools is the modern, BuildKit-aware equivalent. Use create to build manifest lists manually and inspect to verify what was published."},

{q:"What is `docker buildx bake` for?",
 o:["Building several targets defined in a declarative file such as an HCL, JSON or Compose file","Baking the image filesystem","Compressing layers","Publishing to multiple registries"],a:0,
 e:"bake turns a set of build definitions into parallel builds with shared cache, which is far faster than a chain of separate docker build calls in CI."},

{q:"A Dockerfile declares `ARG VERSION=1.0` and you run `docker build --build-arg VERSION=2.0 .`. What is used?",
 o:["1.0, because the default always wins","2.0, because --build-arg overrides the default","The build fails","Both are applied sequentially"],a:1,
 e:"--build-arg overrides the declared default. If the ARG is declared before FROM, it is only in scope for FROM unless redeclared inside the stage."},

{q:"Which `docker info` field shows where images, containers and volumes are physically stored?",
 o:["Docker Root Dir","Storage Driver","Server Version","Registry Mirrors"],a:0,
 e:"The default is /var/lib/docker. Relocating it via the data-root setting in daemon.json is the standard fix when the root filesystem runs out of space."}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Docker Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
