<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 all-new Docker MCQ practice questions covering Podman, BuildKit, multi-stage builds, networking internals, Compose, Swarm, security and troubleshooting.">
<style>
  :root{
    --brand:#0f766e;
    --brand-dark:#134e4a;
    --accent:#14b8a6;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#042f2b;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(15,118,110,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdfa}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐳 Docker Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — DOCKER SET 2 · 100 MCQs
   q = question, o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [

/* ---------- 1–10 : Ecosystem & alternatives ---------- */
{q:"Which statement best describes Podman compared with Docker?",
 o:["Podman requires a long-running root daemon just like Docker",
    "Podman is a daemonless, OCI-compatible container engine that also supports rootless operation",
    "Podman can only run Windows containers",
    "Podman images use a proprietary format incompatible with OCI"],a:1,
 e:"Podman runs containers without a central daemon, so containers are ordinary child processes of the CLI. It also supports rootless mode out of the box and shares the OCI image format with Docker."},

{q:"What is nerdctl?",
 o:["A Docker-compatible CLI for containerd",
    "A container image registry",
    "A Kubernetes scheduler",
    "A Linux kernel module"],a:0,
 e:"nerdctl gives you Docker-like commands (run, build, compose) on top of containerd. It supports Compose and is popular in Kubernetes-focused environments."},

{q:"Which tool does `podman build` use under the hood?",
 o:["Buildah",
    "Kaniko",
    "Packer",
    "The Docker daemon"],a:0,
 e:"Podman delegates image building to Buildah, which can build OCI images without a daemon and without requiring root."},

{q:"Why does Docker Desktop run a Linux virtual machine on macOS and Windows?",
 o:["To run graphical applications",
    "Because containers share the host kernel, and macOS/Windows do not provide a Linux kernel",
    "To store images in a different format",
    "Because Docker Hub requires it"],a:1,
 e:"Containers are processes isolated by Linux kernel features. On a non-Linux host, Docker Desktop starts a lightweight Linux VM and runs the daemon and containers inside it."},

{q:"Which of the following is NOT a container runtime?",
 o:["runc","crun","containerd","systemd"],a:3,
 e:"runc and crun are low-level OCI runtimes, and containerd is a high-level runtime that manages the lifecycle. systemd is an init system and service manager, not a container runtime."},

{q:"What is the Container Runtime Interface (CRI)?",
 o:["A Kubernetes API that lets kubelet work with different container runtimes",
    "A Docker-specific image format",
    "A network plugin specification",
    "A volume driver protocol"],a:0,
 e:"CRI defines the gRPC API between kubelet and a runtime. containerd, CRI-O and others implement it, so Kubernetes can swap runtimes without changing kubelet."},

{q:"What does `docker context` let you do?",
 o:["Change the Dockerfile build context",
    "Switch between different Docker daemon endpoints",
    "Define network contexts",
    "Set the default image registry"],a:1,
 e:"A context bundles a daemon endpoint and TLS settings. `docker context use remote` points the CLI at a different host, which is handy for managing several engines from one machine."},

{q:"What is Docker Scout primarily used for?",
 o:["Analysing images for vulnerabilities and generating SBOMs",
    "Building multi-platform images",
    "Managing Swarm clusters",
    "Running containers without a daemon"],a:0,
 e:"Scout inspects image contents and reports CVEs, outdated base images and missing supply-chain metadata such as SBOMs and provenance attestations."},

{q:"What does `docker init` do?",
 o:["Initialises the Docker daemon",
    "Scaffolds a Dockerfile, a Compose file and .dockerignore for a project",
    "Pulls the latest base images",
    "Resets Docker to factory defaults"],a:1,
 e:"It inspects your project language and generates sensible starter files. It is a quick way to bootstrap containerisation for an existing application."},

{q:"What is the main purpose of `docker buildx`?",
 o:["Extended builds with BuildKit, multi-platform output and advanced cache features",
    "A GUI for building images",
    "A replacement for Docker Compose",
    "A registry proxy"],a:0,
 e:"buildx exposes BuildKit features such as multi-platform builds, cache export/import, and build secrets, and is the default path for modern image builds."},

/* ---------- 11–20 : Image internals ---------- */
{q:"Which storage driver does Docker use by default on most modern Linux hosts?",
 o:["overlay2","aufs","devicemapper","vfs"],a:0,
 e:"overlay2 stacks lower image layers with an upper writable layer using the kernel's overlay filesystem. It is fast and the recommended driver on supported kernels."},

{q:"What is copy-on-write in the context of containers?",
 o:["Files are copied into the writable layer the first time a container modifies them",
    "Images are copied to every host in the cluster",
    "Each container gets a full copy of the image on disk",
    "Writes are synchronously copied to all replicas"],a:0,
 e:"Unmodified files are shared read-only from the image layers. Only when a process writes is the file copied up into the container's writable layer, which is why containers start quickly and share disk."},

{q:"What is an image manifest list (or OCI image index)?",
 o:["A list of all layers in an image",
    "A file describing the history of a build",
    "A multi-platform index mapping OS and architecture to per-platform manifests",
    "A list of containers created from the image"],a:2,
 e:"A single tag such as nginx:latest resolves to an index. Docker picks the manifest matching the host's OS and architecture, which is how one tag works on both amd64 and arm64."},

{q:"Which command shows the instructions and layer sizes that produced an image?",
 o:["docker inspect","docker history","docker image ls -a","docker diff"],a:1,
 e:"docker history lists each Dockerfile instruction with the size it contributed, which makes it easy to spot the layer that bloated the image."},

{q:"What does `docker build --pull` do?",
 o:["Pulls all images referenced by RUN instructions",
    "Forces the builder to fetch the newest version of the base image instead of using a cached one",
    "Pushes the built image automatically",
    "Pulls the build context from a registry"],a:1,
 e:"By default the builder reuses a locally cached base image. --pull makes it check the registry for a newer version, which is important for picking up security patches."},

{q:"What does `FROM scratch` mean in a Dockerfile?",
 o:["Start from the empty base image that has no filesystem layers",
    "Start from the smallest Alpine image",
    "Start from a distroless image",
    "Start from the host's root filesystem"],a:0,
 e:"scratch is a special empty base. Static binaries and some minimal images build on it, giving a container with nothing but your application."},

{q:"Where can an ARG declared before FROM be used?",
 o:["Anywhere in the Dockerfile","Only inside the FROM instruction","Only inside RUN","Only inside CMD"],a:1,
 e:"Arguments declared before the first FROM are outside the build stage and are only in scope for FROM lines, which is how you parameterise the base image version."},

{q:"What must you do to use an ARG declared before FROM inside a later RUN instruction?",
 o:["Nothing, it is inherited","Redeclare it with ARG after FROM","Convert it to ENV","Declare it with LABEL"],a:1,
 e:"Each stage has its own ARG scope. Redeclaring the argument inside the stage brings it back into scope without leaking it into the image's environment."},

{q:"What does `HEALTHCHECK --start-period` control?",
 o:["How often the health check runs",
    "A grace period during which failures do not count toward the unhealthy state",
    "The timeout for each individual check",
    "The number of retries before marking the container unhealthy"],a:1,
 e:"start-period gives a slow-booting application time to come up. Failures during that window are ignored, so the container is not marked unhealthy before it has had a chance to start."},

{q:"If a Dockerfile contains multiple CMD instructions, what happens?",
 o:["All of them run in order","The last one wins","The first one wins","The build fails"],a:1,
 e:"Only the last CMD is stored in the image config. CMD is meant to define a single default command; use a script if you genuinely need multiple steps."},

/* ---------- 21–30 : Dockerfile advanced ---------- */
{q:"Given ENTRYPOINT [\"/app/server\"] and CMD [\"--port\",\"8080\"], what happens when you run `docker run myimg --port 9090`?",
 o:["Both --port 8080 and --port 9090 are passed",
    "The container fails because CMD cannot be overridden",
    "Runtime arguments replace CMD, so the process runs as /app/server --port 9090",
    "ENTRYPOINT is replaced instead"],a:2,
 e:"Arguments on docker run replace CMD entirely and are appended to ENTRYPOINT. Only --entrypoint replaces the executable itself."},

{q:"What does `COPY --chown=app:app . /app` do?",
 o:["Copies files and sets their ownership to the app user and group",
    "Only copies files already owned by app",
    "Runs the copy as the app user",
    "Changes the container's runtime user"],a:0,
 e:"--chown sets ownership during the copy, avoiding a separate RUN chown that would create an extra layer and duplicate the file size."},

{q:"What does `COPY --from=builder /out/app /app` allow?",
 o:["Copying an artifact from an earlier build stage or another image",
    "Copying from the host into the image",
    "Copying from a registry at container runtime",
    "Copying a volume into the image"],a:0,
 e:"--from names a previous stage (or any image) and copies from its filesystem. This is the core mechanism of multi-stage builds."},

{q:"What does `RUN --mount=type=cache,target=/root/.cache/go-build` provide?",
 o:["A persistent build-cache directory shared across builds without baking it into the image",
    "A read-only mount of the host cache",
    "A tmpfs that is discarded after each build",
    "A bind mount of the Docker daemon socket"],a:0,
 e:"Cache mounts are stored by the builder, survive between builds, and are excluded from the final image layer. They dramatically speed up dependency compilation."},

{q:"How is a heredoc used inside a Dockerfile?",
 o:["RUN <<EOF ... EOF","RUN (heredoc) ... END","HEREDOC <<EOF","Heredocs are not supported in Dockerfiles"],a:0,
 e:"BuildKit supports heredocs, so RUN <<EOF lets you write a multi-line script without escaping. The same syntax works for COPY <<EOF to create files."},

{q:"What does a line beginning with `!` in a .dockerignore file do?",
 o:["Comments out the line",
    "Negates an earlier exclusion and re-includes a matching path",
    "Excludes a directory recursively",
    "Makes the pattern case-sensitive"],a:1,
 e:"Patterns are evaluated in order, so a later !pattern re-includes something excluded earlier. This is commonly used to exclude everything except a few files."},

{q:"Which BuildKit mount type exposes a secret to a single RUN instruction without persisting it in layers?",
 o:["--mount=type=secret","--mount=type=cache","--mount=type=bind","--mount=type=tmpfs"],a:0,
 e:"Secrets are provided by the build invocation (--secret) and are mounted only for that step. They are never written to a layer, so they cannot be recovered from the image."},

{q:"What does `RUN --mount=type=ssh` enable during a build?",
 o:["Forwarding the host SSH agent so private git dependencies can be fetched",
    "Starting an SSH server inside the image",
    "Copying SSH keys into the image",
    "Allowing SSH access to the container at runtime"],a:0,
 e:"The SSH agent is forwarded for the duration of the step without the key ever entering the image, which keeps private keys out of the final artifact."},

{q:"What does `docker build --target builder .` do?",
 o:["Stops the build at the named stage and outputs that stage",
    "Builds only the final stage",
    "Skips the named stage",
    "Builds the image for all platforms"],a:0,
 e:"--target builds the requested stage and its dependencies only. It is useful for producing a debugging image or iterating on an intermediate stage."},

{q:"What does the build argument BUILDKIT_INLINE_CACHE=1 do?",
 o:["Embeds cache metadata in the pushed image so it can be reused via --cache-from",
    "Enables inline Dockerfile instructions",
    "Compresses the image layers",
    "Forces a full rebuild every time"],a:0,
 e:"Inline cache stores the build cache in the image itself. A later CI job can then pass --cache-from the previous image and reuse layers instead of rebuilding from scratch."},

/* ---------- 31–40 : Multi-platform & BuildKit ---------- */
{q:"Which command builds an image for both linux/amd64 and linux/arm64 in one invocation?",
 o:["docker buildx build --platform linux/amd64,linux/arm64 -t myimg .",
    "docker build --arch amd64,arm64 -t myimg .",
    "docker multiarch build -t myimg .",
    "docker build --target multi -t myimg ."],a:0,
 e:"buildx with --platform produces a manifest list containing one image per platform. Push it with --push (or output to a registry) so the index is published."},

{q:"What is QEMU/binfmt used for in multi-platform Docker builds?",
 o:["Emulating a foreign CPU architecture during the build",
    "Optimising layer compression",
    "Acting as a registry proxy",
    "Providing DNS resolution for containers"],a:0,
 e:"The builder registers binfmt handlers so arm64 binaries can execute on an amd64 host (and vice versa). This makes cross-platform builds possible without native hardware."},

{q:"What does `--progress=plain` change about `docker build` output?",
 o:["It prints plain line-by-line output instead of the interactive BuildKit TUI",
    "It disables the build cache",
    "It enables verbose daemon logging",
    "It shows only errors"],a:0,
 e:"Plain progress is much easier to read in CI logs, where the interactive TUI produces unhelpful control characters."},

{q:"Why is Docker's legacy `--link` flag deprecated?",
 o:["User-defined networks provide automatic DNS-based service discovery that is more reliable",
    "It was too slow for image pulls",
    "It conflicts with BuildKit",
    "It only works with Swarm"],a:0,
 e:"--link relies on /etc/hosts injection and was never designed for dynamic environments. User-defined networks with embedded DNS solve the same problem correctly."},

{q:"How do containers on a user-defined bridge network resolve each other's names?",
 o:["Through the registry's DNS",
    "Through the host's /etc/hosts file",
    "Through Docker's embedded DNS server at 127.0.0.11",
    "They cannot resolve names, only IP addresses"],a:2,
 e:"Docker runs an embedded DNS resolver inside each container's network namespace. Names and network aliases are registered there automatically as containers join and leave."},

{q:"What does `--network container:web` do?",
 o:["Attaches the container to the same network as web",
    "Shares the network namespace of the container named web",
    "Creates a new network called web",
    "Runs the container on the host network"],a:1,
 e:"The container literally uses web's network stack, so it sees the same interfaces, IP and open ports. Containers sharing a namespace must not try to bind the same port."},

{q:"What does the userland proxy (docker-proxy) do on Linux?",
 o:["Resolves container names to IPs",
    "Forwards published ports as a fallback when iptables rules are not used",
    "Acts as the embedded DNS server",
    "Provides IP address management"],a:1,
 e:"The kernel iptables DNAT rules handle most traffic. The userland proxy catches cases such as traffic originating on the host itself or when the iptables path is unavailable."},

{q:"How is a published port such as `-p 8080:80` actually implemented on Linux?",
 o:["Through iptables DNAT rules, optionally supplemented by a userland proxy",
    "Through a reverse proxy container",

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Docker Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
