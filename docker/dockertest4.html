<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Mock Test — Set 4 · 100 MCQs</title>

<style>
  :root{
    --brand:#b91c1c;
    --brand-dark:#7f1d1d;
    --accent:#f59e0b;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#450a0a;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#fee2e2;border-color:#fecaca}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(185,28,28,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#fef2f2}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#fee2e2}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<header class="topbar">
  <div class="brand">🐳 Docker Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>

  <main class="main">

      <div class="progressbar"><div id="pbar"></div></div>

          <span class="qnum" id="qnum">Question 1 of 100</span>

    <div id="resultView" hidden></div>

<script>
/* ============================================================
   QUESTION BANK — DOCKER SET 4 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : OCI runtimes & ecosystem ---------- */
{q:"What distinguishes Kata Containers from a standard runc container?",
 o:["Each Kata pod runs inside a lightweight virtual machine, giving hardware-level isolation while keeping an OCI-compatible interface","It runs on Windows only","It uses a different image format","It cannot run on Kubernetes"],a:0,
 e:"Kata combines VM-level security with container ergonomics. You get stronger isolation than namespaces alone, at the cost of slower startup and higher memory overhead."},

{q:"What is gVisor?",
 o:["A user-space kernel that intercepts and implements syscalls for containers, reducing host kernel exposure","A Go library for containers","A registry implementation","A Kubernetes scheduler"],a:0,
 e:"gVisor's runsc runtime intercepts the container's syscalls in user space. It adds defence in depth against kernel vulnerabilities at the cost of some syscall compatibility and performance."},

{q:"What is Firecracker?",
 o:["A microVM monitor that boots minimal virtual machines in milliseconds, used by AWS Lambda and Fargate","A container image format","A Docker plugin","A network plugin"],a:0,
 e:"Firecracker provides VM-grade isolation with container-like startup times. It is the substrate for several serverless platforms and is also used with Kata for stronger isolation."},

{q:"How does crun differ from runc?",
 o:["crun is written in C and starts containers faster; runc is written in Go","crun uses a different OCI image format","crun cannot run rootless containers","crun is a Docker-specific fork of runc"],a:0,
 e:"Both implement the OCI runtime spec. crun has a smaller footprint and faster startup, which is why Podman defaults to it on many distros."},

{q:"What is CRI-O?",
 o:["A lightweight OCI-compliant runtime that implements Kubernetes' CRI, used as an alternative to containerd on Kubernetes nodes","A Docker registry","A Compose implementation","A volume plugin"],a:0,
 e:"CRI-O exists only to serve Kubernetes. It uses runc or crun underneath and avoids a general-purpose daemon, giving a smaller attack surface on nodes."},

{q:"What happened to Docker's built-in integration in Kubernetes 1.24?",
 o:["The dockershim was removed; nodes must use a CRI-compliant runtime such as containerd or CRI-O","Docker was banned from all clusters","Images built with Docker stopped working","Kubernetes switched to Podman"],a:0,
 e:"Docker images are still perfectly valid OCI images. What changed is only the runtime interface — dockershim, which was Kubernetes' compatibility shim for the Docker daemon, was removed."},

{q:"What does a containerd shim process do?",
 o:["It keeps containers running independently of the containerd daemon, surviving daemon restarts and upgrades","It compresses images","It manages network namespaces","It provides the CLI"],a:0,
 e:"The shim sits between containerd and the container process. When containerd is restarted or upgraded, containers keep running because the shim holds their stdio and exit status."},

{q:"What does `nerdctl compose up` enable?",
 o:["Docker Compose-style workflows on top of containerd, without a Docker daemon","Compose files in Docker Swarm","Rootless Docker","BuildKit builds only"],a:0,
 e:"nerdctl implements many Docker CLI features — including Compose — on containerd, which makes it useful in Kubernetes-focused environments."},

{q:"What is a Podman pod?",
 o:["A group of containers sharing network, IPC and PID namespaces, mirroring the Kubernetes pod abstraction","A Compose project","A Swarm stack","A volume group"],a:0,
 e:"Podman pods can generate Kubernetes YAML with `podman generate kube`, giving a smooth path from local development to Kubernetes."},

{q:"What does `buildah bud` do?",
 o:["Builds an OCI image from a Dockerfile without requiring a Docker daemon","Pulls images from a registry","Runs containers without namespaces","Builds a Compose stack"],a:0,
 e:"Buildah and bud (`buildah build` in newer versions) build Dockerfile-compatible images daemonlessly and can also produce images from shell scripts for fine-grained control."},

/* ---------- 11–20 : Daemon configuration (daemon.json) ---------- */
{q:"Where is the Docker daemon configuration file located by default on Linux?",
 o:["/etc/docker/daemon.json","/etc/docker/docker.conf","/var/lib/docker/config.json","/usr/local/etc/docker.json"],a:0,
 e:"daemon.json is read at daemon startup. Changes take effect with `systemctl reload docker` for reloadable settings, or `systemctl restart docker` for everything else."},

{q:"What does the `data-root` setting in daemon.json control?",
 o:["The directory where images, containers and volumes are stored","The default registry","The user running the daemon","The network bridge name"],a:0,
 e:"Relocating data-root to a larger disk is the standard fix when /var/lib/docker runs out of space. Always stop the daemon and migrate existing data first."},

{q:"What does `live-restore: true` enable?",
 o:["Containers keep running when the Docker daemon is restarted or upgraded","Live migration of containers between hosts","Hot reload of the Dockerfile","Live registry mirroring"],a:0,
 e:"Without it, restarting dockerd stops all containers. live-restore keeps them alive, though networking and exec are unavailable until the daemon returns. It is incompatible with Swarm mode."},

{q:"What does `registry-mirrors` configure?",
 o:["A pull-through cache that the daemon consults before Docker Hub","A write-only backup registry","A local registry to push to by default","A blocklist of registries"],a:0,
 e:"Mirrors reduce latency and Docker Hub rate-limit exposure. On a miss, the daemon falls back to the upstream registry configured in the image reference."},

{q:"What is `insecure-registries` used for?",
 o:["Allowing the daemon to pull from registries served over plain HTTP or with untrusted TLS","Disabling TLS for all registries","Granting anonymous push access","Bypassing registry authentication"],a:0,
 e:"It is intended for local or air-gapped registries without valid certificates. Never use it against public registries; the traffic is unauthenticated and interceptable."},

{q:"What does `default-address-pools` control?",
 o:["The subnets Docker allocates when creating user-defined networks","The IPs assigned to containers on the bridge","The registry mirror addresses","The DNS resolvers used by containers"],a:0,
 e:"Setting it prevents clashes with corporate or VPN ranges. For example, `{\"base\":\"10.99.0.0/16\",\"size\":24}` keeps Docker networks inside a chosen supernet."},

{q:"Which signal reloads the daemon's config without restarting it?",
 o:["SIGHUP","SIGTERM","SIGUSR1","SIGINT"],a:0,
 e:"`systemctl reload docker` sends SIGHUP. Only a subset of options is reloadable — most (such as data-root) still require a full restart."},

{q:"What is the `userland-proxy` daemon setting for?",
 o:["Toggling the docker-proxy process that acts as a fallback for published ports; disabling it removes that process and relies purely on iptables","Disabling port publishing","Enabling a built-in reverse proxy","Routing traffic to Swarm services"],a:0,
 e:"Disabling userland-proxy removes a process per container at the cost of losing host-local connectivity in some setups. Test carefully before flipping it in production."},

{q:"What does `"no-new-privileges": true` in daemon.json do?",
 o:["Sets the no-new-privileges security option by default for all containers","Disables the root user","Removes all Linux capabilities","Blocks pull from public registries"],a:0,
 e:"It blocks setuid escalation paths across every container without needing to remember the flag on each run. It is a good baseline hardening default."},

{q:"What happens when you run the daemon with `--iptables=false`?",
 o:["Docker stops managing iptables rules, so port publishing and NAT stop working unless you configure routing yourself","It disables container networking entirely","It blocks only outbound traffic","It enables eBPF networking"],a:0,
 e:"You typically only do this when another tool — such as Kubernetes' kube-proxy or a CNI plugin — owns the host firewall. Otherwise published ports silently stop working."},

/* ---------- 21–30 : Advanced Dockerfile syntax ---------- */
{q:"What does a first line such as `# syntax=docker/dockerfile:1.7` do?",
 o:["Pins the BuildKit frontend version used to parse and execute the Dockerfile","Enables the legacy builder","Sets the image version","Disables caching"],a:0,
 e:"The syntax directive lets you use newer Dockerfile features (heredocs, named contexts and so on) independent of the daemon's version, and makes builds reproducible."},

{q:"What does hadolint check?",
 o:["Dockerfiles for best practices such as pinned base images, missing --no-install-recommends and shell pitfalls","Images for CVEs","Runtime container behaviour","Compose file validity"],a:0,
 e:"hadolint is a static linter. In CI it catches problems before the build, for example `apt-get install` without `rm -rf /var/lib/apt/lists/*` or a `latest` base tag."},

{q:"What does the `# escape=` directive do?",
 o:["Changes the escape character used in the Dockerfile, usually for Windows paths","Escapes the whole file","Enables shell escaping","Disables variable expansion"],a:0,
 e:"On Windows, `# escape=`` ` `` lets you write backslashes in paths without treating them as line continuations. It is also inherited by child builds from ONBUILD instructions."},

{q:"If an ARG is declared before FROM, how do you use it in a later RUN?",
 o:["Redeclare it with ARG inside the stage","Nothing, it is inherited","Wrap it in ENV","It cannot be used at all"],a:0,
 e:"Each stage has its own argument scope. A redeclaration inside the stage brings the value back into scope without leaking it into the runtime environment."},

{q:"Which Dockerfile syntax uses a heredoc for a multi-line script?",
 o:["RUN <<EOF ... EOF","RUN (heredoc) ... END","HEREDOC <<EOF","Heredocs are not supported"],a:0,
 e:"BuildKit supports heredocs for RUN and also for COPY, which lets you create a file inline without escaping or a temporary shell script."},

{q:"When does an ONBUILD instruction in a base image execute?",
 o:["At the start of the child build that uses that image as FROM","Immediately during the parent build","At container runtime","At image push"],a:0,
 e:"ONBUILD defers instructions to the child build. It is convenient for framework base images but surprising, so it is usually discouraged for application images."},

{q:"What does `ADD https://example.com/app.tar.gz /app/` do?",
 o:["Downloads the file into /app but does NOT auto-extract it, because remote URLs never trigger tar extraction","Downloads and extracts the tarball","Only checks the URL","Runs it as a script"],a:0,
 e:"Auto-extraction only happens for a local tar passed to ADD. For remote archives, use `ADD` plus an explicit `RUN tar -xzf`, which also gives you control over the target and layer size."},

{q:"Which of these does ADD auto-extract?",
 o:["A local .tar.gz file in the build context","A remote .tar.gz over HTTPS","A zip archive","A single binary"],a:0,
 e:"Only local tar archives (including .tar.gz, .tar.bz2, .tar.xz and .tar) are extracted. Zip files are not supported, and remote URLs are downloaded untouched."},

{q:"What does `COPY package*.json ./` copy?",
 o:["All files in the build context whose names start with \"package\" and end in .json, using filepath.Match semantics","All files in the package directory","Only package.json","All JSON files recursively"],a:0,
 e:"This is the canonical Node.js cache-friendly pattern: copy manifests first, run npm ci, then copy source. A change to source then never invalidates the dependency layer."},

{q:"In a .dockerignore file, what does a line beginning with `!` do?",
 o:["Re-includes a path that was excluded earlier","Comments out the line","Excludes a path recursively","Makes the pattern case-sensitive"],a:0,
 e:"Patterns are evaluated in order, so `*.log` followed by `!important.log` keeps important.log in the build context. This mirrors .gitignore semantics."},

/* ---------- 31–40 : Signals & PID 1 ---------- */
{q:"What does the STOPSIGNAL instruction change?",
 o:["The signal the runtime sends when stopping the container","The signal sent on OOM","The signal used to start the container","The healthcheck signal"],a:0,
 e:"The default is SIGTERM; some applications (such as nginx with certain configs) prefer SIGQUIT. STOPSIGNAL records the preference in the image metadata."},

{q:"What is tini?",
 o:["A minimal init that runs as PID 1, forwarding signals and reaping zombies","A tiny HTTP server","A volume plugin","A registry client"],a:0,
 e:"tini solves the two classic PID 1 responsibilities that many applications get wrong. Docker injects it with `docker run --init`, or you can install it in the image."},

{q:"What two responsibilities does a well-behaved PID 1 have in a container?",
 o:["Forwarding signals to child processes and reaping zombie processes","Mounting volumes and configuring DNS","Starting cron and sshd","Providing a login shell"],a:0,
 e:"If PID 1 is a shell that does not forward SIGTERM, `docker stop` waits the full grace period and then SIGKILLs. If PID 1 does not reap, orphaned children accumulate as zombies."},

{q:"What causes zombie processes in a container?",
 o:["Child processes that have exited but whose parent never calls wait(); they are reparented to PID 1 and must be reaped","Images without a shell","Containers without a healthcheck","Using the exec form of CMD"],a:0,
 e:"Zombies consume PIDs and eventually hit the container's PID limit. Running an init such as tini or dumb-init as PID 1 solves the problem."},

{q:"What does `docker stop -t 30 mycontainer` do?",
 o:["Waits up to 30 seconds for the container to exit after SIGTERM before sending SIGKILL","Stops the container after 30 seconds","Sends SIGTERM 30 times","Restarts the container after 30 seconds"],a:0,
 e:"The timeout is per stop operation, not a delay before stopping. A well-behaved application exits during the grace period, producing exit code 143 instead of 137."},

{q:"Why can a CMD in shell form swallow SIGTERM?",
 o:["The shell becomes PID 1 and may not forward the signal to the application process","The shell blocks all signals by default","Shells cannot receive signals","Only ENTRYPOINT receives signals"],a:0,
 e:"This is why the exec form (`CMD [\"node\",\"server.js\"]`) is preferred. If you must use a shell, `exec` it — `CMD exec node server.js` — so the app replaces the shell as PID 1."},

{q:"What does `docker run --init` actually do?",
 o:["Injects a tiny init (tini) as PID 1 that runs your command as a child","Runs systemd","Initialises a database","Pulls the image first"],a:0,
 e:"--init is a one-flag fix for signal forwarding and zombie reaping. It is not a full init system — it just does those two things correctly and cheaply."},

{q:"How does dumb-init differ from tini?",
 o:["Both are minimal init processes; dumb-init is written in C and adds a few behaviours such as session handling","dumb-init is a full init system","dumb-init only works on Windows","They are the same binary"],a:0,
 e:"In practice either works. dumb-init is often chosen when you need it installed in the image rather than injected by the runtime, and both are tiny static binaries."},

{q:"Which signal does Ctrl+C send to the foreground process?",
 o:["SIGINT","SIGTERM","SIGHUP","SIGQUIT"],a:0,
 e:"In `docker run -it`, Ctrl+C sends SIGINT to PID 1. In detached mode, the way to stop the container is `docker stop`, which sends SIGTERM then SIGKILL."},

{q:"What is the correct way to implement graceful shutdown in a containerised app?",
 o:["Trap SIGTERM, stop accepting new work, finish in-flight requests, then exit 0 within the grace period","Call exit() immediately","Ignore all signals","Rely on the OOM killer"],a:0,
 e:"This ensures `docker stop` and Kubernetes pod termination complete cleanly instead of escalating to SIGKILL, preventing truncated requests and corrupted writes."},

/* ---------- 41–50 : Logging drivers & observability ---------- */
{q:"What does the fluentd logging driver do?",
 o:["Sends container logs to a fluentd endpoint over the forward protocol","Writes logs to a fluentd binary file","Stores logs in the image","Aggregates logs in the broker"],a:0,
 e:"Options include fluentd-address, tag and fluentd-async. Many teams run fluent-bit as a lightweight alternative collector in the same position."},

{q:"Which options prevent json-file logs from filling the disk?",
 o:["max-size and max-file","max-lines and max-count","rotate-size and rotate-count","log-size and log-count"],a:0,
 e:"For example `--log-opt max-size=10m --log-opt max-file=3`. Without them, a noisy container can fill the host filesystem and take down the daemon."},

{q:"What does `docker logs --since 10m mycontainer` show?",
 o:["Only log lines from the last 10 minutes","Only the last 10 lines","Only the first 10 lines","Logs from 10 containers"],a:0,
 e:"--since accepts a duration or a timestamp. Pair it with --until to bracket an incident window, and with --tail to cap the volume."},

{q:"How do you show only the last 100 log lines and then exit?",
 o:["docker logs --tail 100 mycontainer","docker logs -n 100 --follow mycontainer","docker logs --last 100 mycontainer","docker logs --limit 100 mycontainer"],a:0,
 e:"--tail without --follow returns immediately. Add -t for timestamps and -f to continue streaming as new lines arrive."},

{q:"What is the format of a line written by the json-file driver?",
 o:["A JSON object per line with \"log\", \"stream\" and \"time\" fields","A CSV row","An XML element","A syslog line"],a:0,
 e:"Docker writes one JSON object per log line. That is why `docker logs` prints clean text — it parses and extracts the \"log\" field."},

{q:"What is the gelf logging driver for?",
 o:["Sending logs in Graylog Extended Log Format to a Graylog server","Writing logs to a local file","Formatting logs as HTML","Streaming logs to Kafka"],a:0,
 e:"gelf is commonly used with Graylog or a GELF-compatible endpoint such as Logstash's gelf input. It carries structured fields beyond the raw message."},

{q:"What does the awslogs driver do?",
 o:["Ships container logs to Amazon CloudWatch Logs","Writes logs to S3 only","Stores logs on the EBS volume","Uploads logs to Lambda"],a:0,
 e:"It requires awslogs-region and either awslogs-group with awslogs-stream or stream-prefix. Credentials come from the instance profile or the environment."},

{q:"What is the main advantage of fluent-bit over fluentd as a log collector?",
 o:["It is a smaller, faster C-based forwarder designed for edge and sidecar use","It supports more plugins than fluentd","It replaces Docker's logging entirely","It is written in Go"],a:0,
 e:"fluent-bit is deliberately lightweight and is often deployed as a DaemonSet. fluentd has a richer plugin ecosystem but a larger resource footprint."},

{q:"What does `--log-driver none` do?",
 o:["Disables log capture for the container; docker logs returns nothing","Writes logs to stdout of the daemon","Compresses logs","Rotates logs"],a:0,
 e:"Useful for high-volume throwaway jobs where logging is handled inside the app. You lose docker logs, so make sure the application persists its own output."},

{q:"What can `docker logs` NOT show?",
 o:["Lines the application wrote directly to a file inside the container, bypassing stdout and stderr","Lines written to stdout","Lines written to stderr","Lines with timestamps"],a:0,
 e:"Docker captures the container's stdout and stderr streams only. Applications that write to files need a sidecar tailer or should be reconfigured to log to stdout."},

/* ---------- 51–60 : Kubernetes integration ---------- */
{q:"What does kind provide?",
 o:["Kubernetes clusters running inside Docker containers, primarily for local testing","A Kubernetes registry","A Kubernetes ingress controller","A CNI plugin"],a:0,
 e:"kind is Kubernetes IN Docker. It spins up a full control plane as containers in seconds, making it ideal for CI and local experiments with real Kubernetes semantics."},

{q:"What is k3d?",
 o:["k3s (a lightweight Kubernetes distribution) running inside Docker containers","A Kubernetes dashboard","A container registry","A kubectl plugin"],a:0,
 e:"k3d gives you a very fast local cluster with minimal resource use, thanks to k3s. It is a popular alternative to kind when you need many clusters at once."},

{q:"When would you pick minikube over kind?",
 o:["When you need features like multiple drivers, addons or a persistent long-lived cluster rather than fast disposable ones","When you need Docker builds only","When you need a registry","When you need multi-node clusters only"],a:0,
 e:"minikube has richer driver and addon support. kind excels at ephemeral multi-node clusters in CI where startup speed matters most."},

{q:"Which container runtimes implement the Kubernetes CRI?",
 o:["containerd and CRI-O","Docker only","runc only","Podman only"],a:0,
 e:"CRI is the gRPC API between kubelet and the runtime. containerd and CRI-O are the mainstream implementations; Docker's dockershim was removed in 1.24."},

{q:"What is crictl?",
 o:["A CLI for interacting with CRI-compatible runtimes on Kubernetes nodes","A Docker Compose plugin","A registry client","A Helm plugin"],a:0,
 e:"crictl is the node-level equivalent of docker ps/exec. It works against containerd or CRI-O through the CRI socket, which is what you use when there is no Docker daemon."},

{q:"What is ctr?",
 o:["The low-level containerd CLI, useful for inspecting namespaces, images and snapshots","A Docker Compose replacement","A Kubernetes admission controller","A registry"],a:0,
 e:"ctr talks directly to containerd, bypassing CRI. Use crictl for Kubernetes work and ctr for debugging containerd itself, such as listing namespaces with `ctr namespace ls`."},

{q:"How do you open a shell in a distroless pod using kubectl?",
 o:["kubectl debug -it <pod> --image=busybox --target=<container> creates an ephemeral container sharing the target's namespaces","kubectl exec -it <pod> -- /bin/sh always works","kubectl attach -it <pod>","kubectl port-forward into the pod"],a:0,
 e:"Ephemeral containers appear in the pod spec without restarting it and share the target's process namespace when --target is supplied, so you can inspect the running app."},

{q:"What does `imagePullPolicy: Always` do?",
 o:["Forces a registry check on every pod start, regardless of whether the image exists locally","Pulls only on the first start","Pulls only for the latest tag","Disables image pulls"],a:0,
 e:"The default is IfNotPresent (or Always for the latest tag). Always is often used with mutable tags in development, at the cost of registry latency on every start."},

{q:"Where does containerd's default socket live on a typical Linux node?",
 o:["/run/containerd/containerd.sock","/var/run/docker.sock","/run/crio/crio.sock","/var/run/containerd/ctr.sock"],a:0,
 e:"kubelet's --container-runtime-endpoint points here by default. crictl and nerdctl are usually configured with the same path via their own config files."},

{q:"What Kubernetes feature do you enable to use the cluster bundled with Docker Desktop?",
 o:["The Kubernetes checkbox in Docker Desktop settings (or the kubernetesEnabled setting)","Install kubeadm inside a container","Enable Swarm mode","Install minikube"],a:0,
 e:"Docker Desktop can run a single-node cluster sharing the same virtualised Linux kernel as the containers. It is convenient for development but not intended for production."},

{q:"Why do many Kubernetes nodes still pull images built by Docker?",
 o:["Docker images are OCI images, so containerd and CRI-O can run them without change","Kubernetes converts them at pull time","Because Docker runs inside containerd","Because they use a special manifest"],a:0,
 e:"The image format is standardised by the OCI. What changed with dockershim removal is the runtime interface, not the image format."},

/* ---------- 61–70 : CI/CD pipelines ---------- */
{q:"What is `docker/build-push-action`?",
 o:["An official GitHub Action that builds with BuildKit and can push and load images with cache integration","A Docker CLI plugin","A registry mirror","A Dockerfile generator"],a:0,
 e:"It wraps buildx and integrates cache backends such as gha, so CI builds reuse layers between runs. Pair it with `docker/setup-buildx-action` and `docker/setup-qemu-action`."},

{q:"What does GitLab's Docker-in-Docker (dind) service provide?",
 o:["A Docker daemon running inside a container, letting jobs run docker build and docker push","A registry","A Kubernetes executor","A Dockerfile linter"],a:0,
 e:"It is often used with a privileged runner. Many teams now prefer rootless alternatives such as Kaniko or buildah because dind requires privileged mode."},

{q:"What makes Kaniko different from docker build?",
 o:["It builds images from a Dockerfile in userspace without a Docker daemon or privileged mode","It only builds Windows images","It requires a running Docker daemon","It cannot push to registries"],a:0,
 e:"Kaniko is designed for CI inside unprivileged containers. It is now in maintenance mode, with buildah and buildx as the actively developed alternatives."},

{q:"Why use buildah in CI instead of Docker?",
 o:["It runs daemonless and rootless, avoiding privileged runners","It is faster at pulling images","It supports a different image format","It builds only Compose files"],a:0,
 e:"buildah also produces OCI images and can build from a Dockerfile or from shell commands, which makes it a good fit for restrictive CI environments."},

{q:"What does `--cache-from` do with buildx?",
 o:["Imports cache from a previously built or pushed image so unchanged layers can be reused","Pulls the base image again","Deletes the build cache","Forces a clean build"],a:0,
 e:"Pair it with cache export such as `--cache-to type=registry` or inline cache (`BUILDKIT_INLINE_CACHE=1`) so the previous image carries the cache metadata."},

{q:"Why do cache mounts speed up CI builds dramatically?",
 o:["They persist package manager and compiler caches between builds without baking them into the final image","They disable the network","They skip the build entirely","They rebuild only changed lines"],a:0,
 e:"`RUN --mount=type=cache,target=/root/.cache` gives Go, npm or apt a persistent cache that survives across runs and is excluded from the final image."},

{q:"Why tag CI images with the git commit SHA?",
 o:["The SHA is immutable, so deployments are traceable and reproducible; branch tags like latest move","It shrinks the image","It speeds up pulls","Docker requires it"],a:0,
 e:"A SHA tag ties an artefact to an exact source revision, enabling safe rollbacks and precise audits. Branch tags are convenient labels on top of that."},

{q:"How does a CI job build a multi-architecture image without native hardware for every architecture?",
 o:["buildx with QEMU/binfmt emulation, using --platform linux/amd64,linux/arm64","By cross-compiling at the OS level","By running a VM for each platform","It is not possible in CI"],a:0,
 e:"`docker/setup-qemu-action` registers binfmt handlers so foreign binaries can execute. Building natively on each platform's runners is faster but often unnecessary for small images."},

{q:"When should you sign an image with cosign in a pipeline?",
 o:["Immediately after the push, using the CI job's OIDC identity for keyless signing","Before the build","Only manually after deploy","Signing is not needed in CI"],a:0,
 e:"Keyless signing binds the signature to the workflow identity and records it in the transparency log, so consumers can verify both the image digest and who built it."},

{q:"How should CI secrets be passed to a Docker build?",
 o:["Via BuildKit secret mounts (`--secret`) from the CI secret store, never as ARG or ENV","Via a Dockerfile ENV line","Via a public GitHub gist","Via an image label"],a:0,
 e:"ARG and ENV values end up in image metadata. BuildKit secrets are mounted only for the duration of a RUN step and never become part of a layer."},

/* ---------- 71–80 : Supply-chain & runtime security ---------- */
{q:"What does Falco do?",
 o:["Detects suspicious runtime behaviour by monitoring syscalls and matching rules, alerting on container escapes and policy violations","Scans images for CVEs","Signs images","Manages secrets"],a:0,
 e:"Falco is a runtime security engine. It answers 'what is happening right now', complementing scanners that answer 'what is in this image'."},

{q:"What are SLSA levels about?",
 o:["A supply-chain integrity framework describing how hardened and verifiable a build process is","A container image size rating","A Kubernetes versioning scheme","A registry access-control model"],a:0,
 e:"SLSA (Supply-chain Levels for Software Artifacts) defines build provenance requirements. Attestations and signed builds help you demonstrate a level to consumers."},

{q:"What does `cosign verify` check?",
 o:["That an image has a valid signature from a trusted identity or key and that the signed digest matches","That the image has no vulnerabilities","That the image was built with BuildKit","That the image is in the official registry"],a:0,
 e:"Verification is typically enforced by an admission controller so unsigned images are rejected before they can be scheduled."},

{q:"What is Kyverno used for?",
 o:["Kubernetes admission policies — for example requiring image signatures or trusted registries","Building images","Running containers without a daemon","Composing services"],a:0,
 e:"Kyverno expresses policies as Kubernetes resources. OPA/Gatekeeper is the common alternative, and both can enforce signature verification at admission time."},

{q:"What is an admission controller in Kubernetes?",
 o:["A component that intercepts requests to the API server and can mutate or reject them","A container that admits users","A CNI plugin","A storage class"],a:0,
 e:"Policies such as 'reject unsigned images' or 'require resource limits' are implemented here. Mutating webhooks can also add defaults like sidecar injection."},

{q:"What does Trivy scan for?",
 o:["OS package and application dependency vulnerabilities, misconfigurations and secrets","Kubernetes events","Docker daemon configuration only","Runtime syscalls"],a:0,
 e:"Trivy also scans IaC files, SBOMs and Kubernetes manifests. It is easy to add to CI and can fail a build on a configured severity threshold."},

{q:"How does Grype differ from Trivy?",
 o:["Both scan for vulnerabilities; Grype is Anchore's scanner and pairs with Syft for SBOM generation","Grype only scans Windows images","Grype is a runtime security tool","Grype is a signing tool"],a:0,
 e:"Syft produces an SBOM and Grype scans it (or an image directly). The split lets you generate the SBOM once and scan it many times without re-pulling the image."},

{q:"Which two SBOM formats are most common?",
 o:["SPDX and CycloneDX","JSON and XML","YAML and TOML","Protobuf and Avro"],a:0,
 e:"Both are open standards. BuildKit can attach either as an attestation, and scanners such as Trivy and Syft can emit either on demand."},

{q:"What does Notary v2 / Notation provide?",
 o:["An OCI-native way to sign and verify container images using standard tooling","A replacement for Docker Hub","A container runtime","A logging driver"],a:0,
 e:"Signatures are stored as referrer artefacts alongside the image in the registry, so you do not need a separate Notary server as in the original v1 design."},

{q:"Which is a genuine limitation of rootless Docker?",
 o:["Binding ports below 1024 and certain networking modes such as overlay need extra configuration","It cannot run any images","It requires a Windows host","It cannot pull from registries"],a:0,
 e:"Other limits include cgroup v1 quirks, some volume driver support, and lower network throughput with slirp4netns. Most ordinary workloads run fine."},

/* ---------- 81–90 : Storage performance ---------- */
{q:"Why is fuse-overlayfs used in rootless Docker?",
 o:["An unprivileged user cannot mount overlayfs directly, so a FUSE implementation is used instead","It provides encryption","It replaces volumes","It compresses layers"],a:0,
 e:"fuse-overlayfs gives copy-on-write semantics without root. It is slower than kernel overlay2, which is a trade-off for running rootless."},

{q:"Which cgroup file sets block-I/O limits on a container's disk?",
 o:["io.max (cgroup v2)","cpu.max","memory.max","pids.max"],a:0,
 e:"io.max takes a device and per-read/write limits. In cgroup v1 the equivalent is blkio.throttle.*. Docker exposes some of this through --device-read-bps and friends."},

{q:"What does `--blkio-weight` control?",
 o:["A relative share of block I/O bandwidth applied only under contention","A hard I/O limit","The disk queue depth","The filesystem type"],a:0,
 e:"It is a proportional weight (10–1000), like --cpu-shares for CPU. For guaranteed limits use --device-read-bps / --device-write-bps or io.max directly."},

{q:"Which tool is commonly used to benchmark disk I/O inside a container?",
 o:["fio","iperf3","ab","sysbench"],a:0,
 e:"fio can simulate realistic random and sequential workloads. iperf3 measures network throughput, ab is an HTTP load tool, and sysbench covers CPU/memory/DB benchmarks."},

{q:"What do third-party Docker volume plugins (such as Rex-Ray or NetApp Trident) enable?",
 o:["Backing volumes with external storage systems like NFS, EBS, Ceph or NetApp, managed through the Docker volume API","Faster bind mounts","Rootless builds","Image signing"],a:0,
 e:"Plugins let volumes be provisioned dynamically from storage systems. Kubernetes has largely replaced this with CSI, but Docker plugins still exist for Swarm and standalone setups."},

{q:"What is CSI in the context of containers?",
 o:["The Container Storage Interface, a standard API that lets storage systems plug into Kubernetes (and other orchestrators)","A container scanning tool","A CI framework","A container registry"],a:0,
 e:"CSI replaced the in-tree volume plugins in Kubernetes. Storage vendors implement a CSI driver once and it works across orchestrators that support the spec."},

{q:"Do containers share the host's page cache?",
 o:["Yes, they share the kernel's page cache, which is why a container reading a hot file can be very fast","No, each container has an isolated page cache","Only with privileged mode","Only for volumes"],a:0,
 e:"Sharing the page cache is a major performance advantage but also a security consideration, since one container's I/O can evict another's cached data."},

{q:"How isolated is disk I/O between containers by default?",
 o:["Fairly weakly — all containers compete for the same block device unless explicit blkio/io limits are set","Fully isolated per container","Isolated only for volumes","Isolated only on overlay2"],a:0,
 e:"One noisy container doing heavy writes can slow every other container on the host. Set blkio/io limits or use dedicated devices for latency-sensitive workloads."},

{q:"When is tmpfs preferable to a volume?",
 o:["When the data is scratch or sensitive and should never touch persistent disk","When data must survive the container","When data must be shared across hosts","When data must be backed up"],a:0,
 e:"tmpfs lives in RAM and disappears with the container. It is ideal for ephemeral caches, sockets or secrets, at the cost of memory and no persistence."},

{q:"What does direct I/O (O_DIRECT) mean for a container's writes?",
 o:["Writes bypass the page cache and go straight to the device, avoiding cache pollution at the cost of latency","Writes bypass the filesystem entirely","Writes are encrypted","Writes are synchronised across containers"],a:0,
 e:"Databases often use O_DIRECT to control their own caching. Inside a container it works as on the host, but it depends on the storage driver and backing filesystem supporting it."},

{q:"What does `docker stats --format '{{.Name}}: {{.CPUPerc}}'` produce?",

{q:"What does `docker compose images` show?",

{q:"What does `docker compose ps --format json` return?",

{q:"What does `docker plugin ls` list?",

{q:"Which command lists Swarm secrets?",
 o:["docker secret ls","docker config ls","docker secrets list","docker swarm secrets"],a:0,
 e:"`docker secret inspect` shows metadata only — never the value. Configs are the non-secret sibling and are managed with `docker config`."},

{q:"What does `docker buildx du` report?",

{q:"What does `docker compose --dry-run up` do?",
 o:["Shows the actions Compose would take without actually creating or starting anything","Builds without pushing","Runs without networking","Skips healthchecks"],a:0,
 e:"Dry-run is a safe way to preview a Compose file in CI or before running destructive commands such as `down -v`."},

{q:"What does `docker inspect --format '{{.NetworkSettings.IPAddress}}' <container>` print?",
 o:["The container's IP address on the default bridge network","The host's IP address","The gateway address","The DNS server address"],a:0,

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Docker Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
