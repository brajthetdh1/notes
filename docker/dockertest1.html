<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Mock Test — 100 MCQs</title>
<meta name="description" content="100-question Docker mock test with timer, question palette, explanations and detailed review. Covers containers, images, Dockerfile, networking, volumes, Compose, security and more.">
<style>
  :root{
    --brand:#1d4ed8;
    --brand-dark:#1e3a8a;
    --accent:#0ea5e9;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#04263a;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0f2fe;border-color:#bae6fd}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(29,78,216,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#eff6ff}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#dbeafe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🐳 Docker Mock Test <span class="setpill">DOCKER</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — 100 Docker MCQs
   q = question, o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [

/* ---------- 1–10 : Container fundamentals ---------- */
{q:"What is a Docker container?",
 o:["A lightweight, standalone executable package that includes the application and its dependencies and shares the host kernel","A full virtual machine with its own guest OS","A configuration file that describes a server","A type of hypervisor"],a:0,
 e:"A container packages an application with its libraries and configuration, and runs as an isolated process on the host kernel. It starts in milliseconds and uses far less memory than a VM."},

{q:"What is the primary difference between containers and virtual machines?",
 o:["VMs share the host kernel; containers each run a full guest OS","Containers share the host kernel; VMs each run a full guest OS","Containers always require more disk space than VMs","VMs cannot run Linux workloads"],a:1,
 e:"A VM virtualises hardware and boots a complete operating system, so it is heavy and slow to start. A container virtualises the operating system and shares the host kernel, making it fast and lightweight."},

{q:"Which Linux kernel features underpin container isolation?",
 o:["Hypervisors and hardware emulation","Namespaces and cgroups","SELinux and AppArmor","iptables and nftables"],a:1,
 e:"Namespaces isolate what a process can see (PIDs, network, mounts, IPC, hostname), while cgroups control and account for how much it can use (CPU, memory, I/O)."},

{q:"What do cgroups do in a container?",
 o:["Isolate the process ID tree","Provide image layering","Limit and account for resource usage such as CPU and memory","Route container traffic between hosts"],a:2,
 e:"Control groups enforce limits and provide accounting. They are how --memory and --cpus on docker run are implemented, and they also feed the metrics shown by docker stats."},

{q:"What do namespaces provide?",
 o:["CPU share limits","Isolation of resources such as PIDs, network interfaces and mount points","Persistent image layers","Registry authentication"],a:1,
 e:"A container's process sees its own PID 1, its own network stack and its own filesystem view because it lives in separate namespaces. This is the core of container isolation."},

{q:"What is the Docker daemon (dockerd)?",
 o:["The command-line client","The background service that manages containers, images, networks and volumes","The OCI runtime binary","A registry server"],a:1,
 e:"The daemon listens for API requests from the client and does the actual work: pulling images, creating containers, wiring networks and managing volumes."},

{q:"What is containerd?",
 o:["A high-level container runtime that manages the container lifecycle and image transfer","A graphical user interface for Docker","A Kubernetes scheduler","A Dockerfile linter"],a:0,
 e:"Docker delegates the heavy lifting to containerd, which pulls images, manages container execution and supervises the lower-level runtime. Kubernetes can use containerd directly."},

{q:"What is the role of runc?",
 o:["A registry client","A Compose plugin","A low-level OCI runtime that creates and runs containers","A build cache manager"],a:2,
 e:"runc is the reference implementation of the OCI runtime spec. It takes a prepared bundle and uses kernel features to spawn the actual isolated process, then exits once the container is running."},

{q:"What is the OCI?",
 o:["A cloud provider","The Open Container Initiative, which standardises image formats and runtimes","A Docker-only proprietary protocol","A logging driver"],a:1,
 e:"The OCI publishes the image-spec and runtime-spec. Because Docker images and runtimes follow them, images built with Docker run on containerd, Podman, Kubernetes and other OCI-compatible platforms."},

{q:"How does Docker's architecture work?",
 o:["Peer-to-peer between containers only","A single monolithic binary with no daemon","Serverless with no runtime","Client-server: the client talks to the daemon, which pulls images from a registry and manages containers"],a:3,
 e:"The docker CLI sends REST API calls to dockerd over a Unix socket or TCP. The daemon pulls from a registry, builds images and manages containers through containerd and runc."},

/* ---------- 11–20 : Images and layers ---------- */
{q:"What is a Docker image?",
 o:["A running process","A read-only template made of layered filesystem changes plus metadata","A network namespace","A persistent volume"],a:1,
 e:"An image is immutable and reusable. Containers are created from it by adding a thin writable layer on top, which is why the same image can back many containers."},

{q:"How are image layers created?",
 o:["Each instruction that changes the filesystem creates a new layer","Every instruction creates exactly one layer, including ENV","Layers are created only at container runtime","An image always has exactly one layer"],a:0,
 e:"FROM, RUN, COPY and ADD produce layers. Metadata-only instructions such as ENV, WORKDIR and LABEL do not create filesystem layers; they update image config."},

{q:"Are image layers shared between images?",
 o:["No, each image keeps a private copy of every layer","Yes, identical layers are stored once and shared across images","Only when using a paid registry","Only if the images have the same tag"],a:1,
 e:"Layers are content-addressed, so if two images share a base layer it is stored once on disk and pulled once. This is why using a common base image saves space and time."},

{q:"What is a container's writable layer?",
 o:["The last instruction in the Dockerfile","A volume mounted at /data","A copy-on-write layer added on top of the image layers for each container","A read-only layer shared by all containers"],a:2,
 e:"When a container writes to a file from the image, the file is copied up into the writable layer and modified there. The underlying image layers are never changed."},

{q:"What happens to data written to a container's writable layer when the container is removed?",
 o:["It is committed into the image automatically","It is lost","It is moved to a named volume automatically","It is pushed to the registry"],a:1,
 e:"The writable layer dies with the container. To keep data you must use a volume or a bind mount; this is the single most common source of surprise data loss for newcomers."},

{q:"What does docker image prune do by default?",
 o:["Removes dangling (untagged, unused) images","Removes all containers","Removes unused volumes","Removes unused networks"],a:0,
 e:"Without flags it targets dangling images. Add -a to remove all images not referenced by a container, and combine with -f to skip the confirmation prompt."},

{q:"What is a dangling image?",
 o:["An image with no tag and no container referencing it","An image built without using the cache","An image larger than 1 GB","An image pulled from Docker Hub"],a:0,
 e:"Dangling images usually appear when you rebuild with the same tag: the old image loses its tag and becomes <none>:<none>. They waste disk until pruned."},

{q:"What does the :latest tag actually mean?",
 o:["It is a reserved tag that cannot be overwritten","It always points to the newest image","It is the default tag applied when none is specified and is not necessarily the newest","It enables automatic updates"],a:2,
 e:"latest is just a convention, not a guarantee. Pinning an explicit version or digest is the reliable way to get reproducible deployments."},

{q:"What is an image digest?",
 o:["A human-friendly alias for the image","A content-addressable SHA256 identifier of the image manifest","A checksum of the Dockerfile","A registry access token"],a:1,
 e:"A digest uniquely identifies an exact image build, for example repo@sha256:abc.... Because a tag can be repointed, referencing by digest is the strongest pin."},

{q:"What does docker save do?",
 o:["Saves a container's writable layer to disk","Commits a running container into an image","Pushes an image to a registry","Exports an image with its layers to a tar archive"],a:3,
 e:"docker save writes the full image, layers and metadata to a tar file for offline transfer. docker export is different: it flattens a container's filesystem into a single tar."},

/* ---------- 21–35 : Dockerfile instructions ---------- */
{q:"Which Dockerfile instruction sets the base image?",
 o:["FROM","COPY","RUN","USER"],a:0,
 e:"Every Dockerfile must begin with FROM (or ARG followed by FROM). It determines the starting filesystem and can reference a local image, a registry image or a previous build stage."},

{q:"What is the difference between COPY and ADD?",
 o:["ADD only copies directories, never files","COPY is the preferred explicit copy; ADD additionally supports URLs and auto-extracting local tar archives","They are completely identical","COPY can extract tar archives while ADD cannot"],a:1,
 e:"Prefer COPY because its behaviour is obvious and predictable. ADD's implicit tar extraction and remote URL support can surprise reviewers and break caching."},

{q:"What does the RUN instruction do?",
 o:["Runs a command when the container starts","Sets an environment variable","Runs a command during the build and creates a new layer","Defines the container entrypoint"],a:2,
 e:"RUN executes in a temporary container during the build and commits the resulting filesystem changes as a new layer. Use it for installing packages and building artifacts."},

{q:"What is the difference between CMD and ENTRYPOINT?",
 o:["CMD sets the executable; ENTRYPOINT only sets default arguments","ENTRYPOINT sets the executable; CMD supplies default arguments or a default command","They are aliases for the same instruction","Only CMD can be overridden at runtime"],a:1,
 e:"If both are present, CMD becomes the default argument list appended to ENTRYPOINT. Arguments on docker run replace CMD but not ENTRYPOINT, unless --entrypoint is used."},

{q:"What is the benefit of the exec form, such as ENTRYPOINT [\"node\",\"server.js\"]?",
 o:["It runs the command through /bin/sh -c","It runs the binary directly without a shell wrapper","It requires a shell to be installed in the image","It is invalid for ENTRYPOINT"],a:1,
 e:"Without a shell in between, your process becomes PID 1 and receives SIGTERM directly, so it can shut down gracefully. The shell form often swallows signals."},

{q:"What does EXPOSE do?",
 o:["Publishes the port on the host","Opens a host firewall rule","Documents the intended listening port without publishing it","Maps a port to the host network"],a:2,
 e:"EXPOSE is documentation for humans and tooling. It does not make the port reachable; you must publish it with -p or --publish, or use host networking."},

{q:"What does WORKDIR do?",
 o:["Sets the working directory for subsequent instructions and creates it if missing","Copies files into a directory","Sets the home directory of the runtime user","Mounts a volume at a path"],a:0,
 e:"WORKDIR is preferred over RUN cd because it persists across instructions and clearly expresses intent. It is also honoured by ENTRYPOINT and CMD at runtime."},

{q:"What is the difference between ENV and ARG?",
 o:["ARG persists into the image at runtime; ENV is build-time only","ENV persists into the image at runtime; ARG is available only during the build","They are interchangeable","ENV can only hold numeric values"],a:1,
 e:"ARG values are visible in build history and are not present in the running container. ENV values become part of the image config and are visible to the process."},

{q:"What does the USER instruction do?",
 o:["Sets the owner of files copied with COPY","Sets the SSH user for the container","Sets the registry account used to pull the base image","Sets the user for subsequent instructions and for the running container"],a:3,
 e:"After USER app_user, later RUN instructions execute as that user and the container starts as that user. This is the standard way to avoid running as root."},

{q:"What does HEALTHCHECK define?",
 o:["A command the engine runs periodically to determine whether the container is healthy","A policy that restarts the container on failure","A CPU limit for the container","The signal used to stop the container"],a:0,
 e:"Health status is reported in docker ps and docker inspect. Compose can gate dependents on service_healthy, which is far more reliable than depends_on alone."},

{q:"What does the VOLUME instruction do?",
 o:["Deletes a volume when the container is removed","Copies a volume's contents into the image","Declares a mount point and creates an anonymous volume when the container runs","Mounts a host directory read-only"],a:2,
 e:"VOLUME marks a path as externally managed storage. If you do not supply a volume or bind mount, Docker creates an anonymous volume, which is easy to lose track of."},

{q:"What is ONBUILD used for?",
 o:["Registers a trigger instruction that runs when the image is later used as a base","Builds the image in the background","Delays the build until the network is available","Enables layer caching for the image"],a:0,
 e:"ONBUILD defers an instruction to the child build. It is powerful for base images but makes behaviour surprising, so it is generally discouraged for application images."},

{q:"What does the LABEL instruction do?",
 o:["Sets a runtime environment variable","Adds key-value metadata to the image","Assigns a name to the container","Sets the image tag"],a:1,
 e:"Labels are metadata for tooling and humans — for example org.opencontainers.image.source. They do not affect the container's environment or runtime behaviour."},

{q:"What does the SHELL instruction change?",
 o:["It installs a shell into the image","It sets the login shell of the USER","It overrides the default shell used by the shell form of RUN, CMD and ENTRYPOINT","It enables SSH access to the container"],a:2,
 e:"SHELL is useful on Windows (for example cmd or powershell) and for enforcing bash with pipefail on Linux builds. The exec form of instructions is unaffected."},

/* ---------- 36–45 : Build best practices and multi-stage ---------- */
{q:"What is the main benefit of a multi-stage build?",
 o:["It speeds up registry uploads only","It keeps build tools out of the final image, reducing size and attack surface","It removes the need for a Dockerfile","It lets one image run multiple containers"],a:1,
 e:"The build stage carries compilers, SDKs and caches. The final stage starts from a slim runtime base and copies only the built artifact, often shrinking the image by an order of magnitude."},

{q:"How should Dockerfile instructions be ordered for efficient caching?",
 o:["Put the least frequently changing instructions first, such as dependency installation before copying source code","Copy all source code first, then install dependencies","Alphabetically by instruction name","In random order, since caching is automatic"],a:0,
 e:"Each instruction invalidates its own layer and all subsequent ones. Copying package manifests and installing dependencies first means code edits do not re-run the install step."},

{q:"Why should a container avoid running as root?",
 o:["It slows down the container","It makes the image larger","Security: a compromised process would have root privileges in the container","It prevents the container from starting"],a:2,
 e:"Root in a container is not automatically root on the host, but combined with a kernel vulnerability or a careless mount it greatly increases blast radius. Use a non-root user."},

{q:"Why is the exec form of ENTRYPOINT preferred over the shell form?",
 o:["The process becomes PID 1 and receives signals directly, allowing clean shutdown","It compresses the image","It avoids the need for a base image","It enables layer caching"],a:0,
 e:"docker stop sends SIGTERM and then SIGKILL after a grace period. With the shell form, the shell is PID 1 and may not forward the signal, causing the app to be killed hard."},

{q:"What does a .dockerignore file do?",
 o:["Ignores runtime errors during the build","Excludes files and directories from the build context sent to the daemon","Skips layers that fail to build","Excludes files from the container at runtime"],a:1,
 e:"A smaller build context means faster builds and fewer accidental secrets. It also prevents a local node_modules or .git directory from invalidating the COPY cache."},

{q:"What is the effect of chaining commands with && inside a single RUN?",
 o:["Combines them into one layer and lets you clean up in the same layer","Runs the commands in parallel","Makes the resulting image read-only","Improves network throughput"],a:0,
 e:"Fewer layers keep the image small. Crucially, deleting files in the same RUN actually removes them; deleting in a later RUN only hides them while they still consume space."},

{q:"Why should you pin base image versions instead of using latest?",
 o:["It makes images smaller","It speeds up container startup","It guarantees automatic security patches","It gives reproducible builds, because a tag can be repointed to a different image"],a:3,
 e:"An unpinned base means the same Dockerfile can produce different results on different days. Pin a version or, for maximum determinism, a digest."},

{q:"What is the build context?",
 o:["The daemon's configuration file","The set of files in the directory sent to the daemon at build time","The container's runtime filesystem","The registry's layer cache"],a:1,
 e:"docker build . sends the entire directory (minus .dockerignore entries) to the daemon. A huge context slows builds even if the Dockerfile only needs a few files."},

{q:"Why are slim or alpine base images often preferred?",
 o:["They provide better GUI support","They are required for multi-stage builds","They are smaller, which means faster pulls and a smaller attack surface","They give faster container networking"],a:2,
 e:"A smaller base means fewer packages, fewer CVEs and less to download. The trade-off is that alpine uses musl libc, which can break prebuilt glibc binaries."},

{q:"Why must package caches be deleted in the same RUN that installed the packages?",
 o:["Cleanup happens automatically","Later layers overwrite earlier ones entirely","Files deleted in a later layer still exist in the earlier layer, so clean up in the same RUN","It makes no difference to the final size"],a:2,
 e:"Layers are additive. If you apt-get install in one layer and rm -rf /var/lib/apt/lists in the next, the cache is still baked into the lower layer and shipped in the image."},

/* ---------- 46–55 : Networking ---------- */
{q:"What characterises the default bridge network?",
 o:["Containers get private IPs and reach the outside via NAT, so port publishing is required","Containers share the host's IP address directly","Containers have no network connectivity by default","Containers get public IPs on the LAN"],a:0,
 e:"docker0 is a virtual bridge. Containers can talk to each other by IP on that bridge and reach the internet through NAT, but inbound traffic needs -p to be forwarded."},

{q:"What does host network mode do?",
 o:["Gives the container its own isolated network stack","Makes the container share the host's network namespace and use host ports directly","Removes all networking from the container","Assigns a MAC address on the LAN"],a:1,
 e:"With --network host there is no NAT and no port mapping — the app binds directly to host ports. It is fast but loses isolation and can cause port conflicts."},

{q:"What does --network none give you?",
 o:["Only outbound traffic is allowed","Only inbound traffic is allowed","The container has no network interfaces beyond loopback","The container shares the host network"],a:2,
 e:"This is useful for fully isolated batch jobs or for testing that an application behaves correctly without connectivity."},

{q:"How does DNS work on a user-defined bridge network?",
 o:["Containers on the same user-defined bridge resolve each other by container name or network alias","DNS only works with raw IP addresses","DNS requires the legacy --link flag","DNS is not supported on bridge networks"],a:0,
 e:"Docker runs an embedded DNS server for user-defined networks. That name resolution is exactly why Compose services can reach each other as http://db:5432."},

{q:"How does the default bridge network differ from a user-defined bridge for name resolution?",
 o:["The default bridge resolves container names automatically","Only numeric IPs are allowed on the default bridge","DNS on the default bridge is handled by the registry","The default bridge does not provide automatic name resolution; use user-defined networks instead"],a:3,
 e:"The legacy default bridge requires --link for name resolution, which is deprecated. Always create a user-defined network for multi-container applications."},

{q:"What does docker run -p 8080:80 do?",
 o:["Maps host port 8080 to container port 80","Maps container port 8080 to host port 80","Exposes port 8080 inside the container only","Blocks traffic to port 80"],a:0,
 e:"The syntax is host:container. Traffic to the host's 8080 is forwarded to port 80 inside the container, where the application must actually be listening."},

{q:"What is the difference between EXPOSE and -p?",
 o:["EXPOSE publishes the port; -p only documents it","EXPOSE documents the port; -p publishes it on the host","Both publish the port identically","Neither publishes anything"],a:1,
 e:"EXPOSE is metadata. Only -p (or host networking) makes the port reachable from outside the container's network."},

{q:"What does docker network ls show?",
 o:["The available networks","Containers together with their IP addresses","Published host ports","DNS records"],a:0,
 e:"It lists networks such as bridge, host and none plus any user-defined networks. Use docker network inspect to see which containers are attached and their IPs."},

{q:"What is a macvlan network used for?",
 o:["Creating a private overlay across hosts","Disabling networking for the container","Assigning a MAC address so the container appears as a physical device on the LAN","Sharing the host's network namespace"],a:2,
 e:"macvlan containers get their own MAC and IP on the physical network, which is useful for legacy workloads that expect to be directly addressable. It often requires promiscuous mode on the NIC."},

{q:"What is an overlay network for?",
 o:["Enabling multi-host container networking, typically with Swarm","Single-host communication only","Being the default network for docker run","Providing DNS-free networking"],a:0,
 e:"Overlay networks use VXLAN to span multiple hosts, so containers on different machines can communicate as if on one network. It is a Swarm feature and needs a key-value store or Swarm mode."},

/* ---------- 56–63 : Volumes and storage ---------- */
{q:"What is the difference between a named volume and a bind mount?",
 o:["Bind mounts are managed by Docker; named volumes map an arbitrary host path","Named volumes are managed by Docker; bind mounts map an arbitrary host path","They are functionally identical","Named volumes cannot persist data"],a:1,
 e:"Named volumes live in Docker's storage area and are portable across hosts. Bind mounts give you a specific host directory, which is handy in development but couples you to the host layout."},

{q:"Where are named volumes stored by default on Linux?",
 o:["/var/lib/docker/volumes","/tmp/docker","/etc/docker/volumes","/home/docker/volumes"],a:0,
 e:"Each volume is a directory under /var/lib/docker/volumes with a _data subdirectory. Backing up a volume usually means running a helper container that tars that path."},

{q:"What is a tmpfs mount?",
 o:["Storage on the host disk","Storage in the registry","Storage in memory that is not persisted to disk","Storage baked into the image"],a:2,
 e:"tmpfs mounts are fast and disappear when the container stops. They are ideal for scratch space or sensitive data you do not want written to disk."},

{q:"Which command lists Docker volumes?",
 o:["docker volume ls","docker ls volumes","docker mount ls","docker inspect --volumes"],a:0,
 e:"docker volume inspect <name> then shows the mountpoint, driver and labels, which is useful when you need to back up or debug a volume."},

{q:"What does docker volume prune do?",
 o:["Removes all volumes, including ones attached to running containers","Removes unused volumes","Removes images","Removes networks"],a:1,
 e:"Volumes attached to a container — running or stopped — are kept. Use --all to include anonymous volumes as well, and double-check before running it on production hosts."},

{q:"How can two containers share data?",
 o:["Mount the same named volume into both containers","Use docker cp between them repeatedly","Put them on the host network","Commit one container and run it twice"],a:0,
 e:"Sharing a named volume is the standard approach. Note that concurrent writes from multiple containers require the application to handle locking and consistency."},

{q:"Why are volumes preferred over writing to the container filesystem?",
 o:["The container filesystem persists after the container is removed","Volumes are always faster than the writable layer","Volumes cannot be shared between containers","Volumes persist beyond the container lifecycle and are the recommended way to store data"],a:3,
 e:"Data in the writable layer is destroyed with the container and is tied to that container's lifecycle. Volumes survive removal and upgrades and can be backed up and moved independently."},

{q:"What is the advantage of --mount over -v?",
 o:["-v is deprecated and no longer works","--mount only supports named volumes","--mount has a more explicit, readable syntax and produces clearer errors","-v only supports bind mounts"],a:2,
 e:"--mount uses key=value pairs such as type=bind,source=/data,target=/app/data. It fails loudly on a missing host path, whereas -v silently creates a directory."},

/* ---------- 64–72 : Docker Compose ---------- */
{q:"What is Docker Compose?",
 o:["A tool for defining and running multi-container applications with a YAML file","A container runtime","An image registry","A Kubernetes distribution"],a:0,
 e:"Compose lets you describe services, networks and volumes declaratively, then bring the whole stack up with one command — ideal for local development and simple deployments."},

{q:"What is the default Compose file name?",
 o:["Dockerfile","docker-compose.yml (or compose.yaml)","compose.json","containers.yaml"],a:1,
 e:"Both docker-compose.yml and compose.yaml are recognised. The modern command is docker compose (a plugin), which replaces the older standalone docker-compose binary."},

{q:"What does docker compose up -d do?",
 o:["Starts the services in detached mode","Deletes the services and their volumes","Builds images without starting anything","Streams the logs of all services"],a:0,
 e:"-d runs containers in the background. Without it, Compose attaches to the logs and Ctrl+C stops the stack. Use docker compose logs -f to follow logs afterwards."},

{q:"What does depends_on guarantee?",
 o:["That the dependency has passed its healthcheck","That the dependency is never started","That the dependency is scaled together","It controls start order but does not wait for the dependency to become ready"],a:3,
 e:"depends_on only orders container creation. To wait for readiness, combine it with a healthcheck and condition: service_healthy (Compose v2) or add retry logic in the app."},

{q:"How do you run three replicas of the web service with Compose?",
 o:["docker compose up --scale web=3","docker scale web 3","docker compose replicate web 3","docker run --replicas 3 web"],a:0,
 e:"--scale overrides the replica count at start time. If the service publishes a fixed host port, scaling fails with a port conflict — remove the host port or use a range."},

{q:"What network does Compose create by default?",
 o:["Services use the host network","Compose creates a project-specific bridge network and connects services to it","Services have no network","Services use a macvlan network"],a:1,
 e:"Each project gets its own network, so services resolve each other by service name and projects are isolated from one another without extra configuration."},

{q:"What does docker compose down -v remove?",
 o:["Only the containers","Only the images","Containers, networks and named volumes","Only the volumes"],a:2,
 e:"Without -v, named volumes are kept so data survives. With -v, volumes declared in the file are removed too — destructive, but useful for a clean slate."},

{q:"What does restart: always do in a Compose service?",
 o:["Restarts the container unless it is explicitly stopped","Restarts only when the container exits with an error","Never restarts the container","Restarts only when the host reboots"],a:0,
 e:"on-failure restarts only on a non-zero exit. unless-stopped is like always but respects an explicit docker stop across daemon restarts, which is usually the better production choice."},

{q:"What is env_file used for in Compose?",
 o:["Mounting a file into the container","Defining build arguments","Setting the container entrypoint","Loading environment variables from a file"],a:3,
 e:"env_file points to a file of KEY=VALUE lines whose contents are injected as environment variables. Keep such files out of version control if they contain secrets."},

/* ---------- 73–82 : CLI and day-to-day commands ---------- */
{q:"Which command lists running containers?",
 o:["docker ps","docker images","docker volume ls","docker network ls"],a:0,
 e:"docker ps shows running containers with their IDs, names, ports and status. Add -a to include containers that have stopped or exited."},

{q:"What does docker ps -a show?",
 o:["All images","All containers, including stopped ones","All networks","All volumes"],a:1,
 e:"The -a flag includes exited containers. This is how you find a container that crashed immediately so you can inspect its exit code and logs."},

{q:"Which command opens an interactive shell in a running container?",
 o:["docker run -it <container> sh","docker attach <container> sh","docker exec -it <container> sh","docker start <container> sh"],a:2,
 e:"exec starts a new process inside the existing container. attach instead connects your terminal to PID 1's stdio, which is a very different and often unhelpful thing."},

{q:"Which command streams a container's logs and follows new output?",
 o:["docker logs -f <container>","docker tail <container>","docker cat <container>","docker inspect -f logs <container>"],a:0,
 e:"-f follows the log stream. Add --tail 100 to start with the last 100 lines, and remember logs only exist for what the process wrote to stdout or stderr."},

{q:"Which command returns detailed JSON metadata about a container?",
 o:["docker info <container>","docker describe <container>","docker show <container>","docker inspect <container>"],a:3,
 e:"docker inspect returns configuration, network settings, mounts, state and more. Use -f or --format with a Go template to extract a single field."},

{q:"Which command removes a stopped container?",
 o:["docker delete <container>","docker rm <container>","docker rmi <container>","docker kill <container>"],a:1,
 e:"docker rm removes the container and its writable layer. Use -f to force removal of a running container, which sends SIGKILL first."},

{q:"Which command removes an image?",
 o:["docker rm <image>","docker delete image <image>","docker rmi <image>","docker image remove --force-only <image>"],a:2,
 e:"docker rmi fails if a container still references the image. Remove the containers first, or use -f, which untags rather than truly deleting shared layers."},

{q:"Which command builds an image tagged myapp:1.0 from the current directory?",
 o:["docker build -t myapp:1.0 .","docker build myapp:1.0","docker create -t myapp:1.0","docker image new myapp:1.0 ."],a:0,
 e:"-t names and tags the image; the trailing dot is the build context. Without a tag, the image ends up as <none>:<none> and is easy to lose track of."},

{q:"What does docker stats show?",
 o:["The sizes of all images","Live resource usage of containers","Registry download statistics","Build step timings"],a:1,
 e:"It shows CPU, memory, network and block I/O per container in real time. Use --no-stream for a single snapshot, which is convenient in scripts."},

{q:"What does docker system prune -a remove?",
 o:["Running containers","Volumes only","Unused containers, networks, images and build cache (all unused images with -a)","The Docker daemon itself"],a:2,
 e:"It is the big cleanup command. It does not remove volumes unless you add --volumes, which is deliberate because volumes often hold data you care about."},

/* ---------- 83–92 : Registries and security ---------- */
{q:"What is the default registry Docker uses?",
 o:["Quay.io","GitHub Container Registry","Amazon ECR","Docker Hub"],a:3,
 e:"An image name without a registry prefix, such as nginx or myorg/myapp, is resolved against Docker Hub. Other registries need an explicit hostname in the image name."},

{q:"How do you authenticate to a registry?",
 o:["docker login <registry>","docker auth <registry>","docker signin <registry>","docker credential <registry>"],a:0,
 e:"Credentials are stored in ~/.docker/config.json or in a credential helper. Always log out on shared machines with docker logout."},

{q:"How do you upload an image to a registry?",
 o:["docker publish <image>","docker push <registry>/<image>:<tag>","docker upload <image>","docker commit --push <image>"],a:1,
 e:"The local image must already be tagged with the full registry path. Docker pushes only the layers the registry does not already have."},

{q:"What is Docker Content Trust?",
 o:["A mechanism that uses signatures to verify image publisher integrity","A compression algorithm for layers","A logging driver","A network mode"],a:0,
 e:"With DOCKER_CONTENT_TRUST=1, Docker refuses to pull or push unsigned images, protecting against tampered or impersonated images. It is built on Notary and The Update Framework."},

{q:"What is the recommended way to run a container as a non-root user?",
 o:["Run with --privileged","Use host networking","Create a user in the Dockerfile and switch with USER","Disable the healthcheck"],a:2,
 e:"Create the user and group, chown the application files, then set USER. At runtime you can also override with docker run --user uid:gid."},

{q:"How do you run a container with a read-only root filesystem?",
 o:["docker run --no-write","docker run --read-only","docker run --immutable","docker run --filesystem=ro"],a:1,
 e:"--read-only makes the container's root filesystem immutable. Mount tmpfs or volumes at the paths the app needs to write, such as /tmp or a cache directory."},

{q:"How do you drop Linux capabilities from a container?",
 o:["docker run --cap-drop=ALL --cap-add=NET_BIND_SERVICE","docker run --no-caps","docker run --security=none","docker run --drop-all"],a:0,
 e:"Dropping all capabilities and adding back only what is needed follows least privilege. Many images need only a handful, or none at all."},

{q:"What is the correct way to handle secrets in containers?",
 o:["Put them in ARG because build args are secure","Store them in an image label","Commit them to the repository","Avoid baking secrets into images; pass them at runtime via secrets or a secret manager"],a:3,
 e:"ENV, ARG and image layers are all inspectable. Runtime injection from a secret manager, a mounted file, or a Swarm/Kubernetes secret keeps credentials out of the image."},

{q:"What does the --privileged flag do?",
 o:["Grants all capabilities and device access, greatly increasing risk","Only enables outbound networking","Is required to mount volumes","Is the default for all containers"],a:0,
 e:"A privileged container can access host devices and bypass most isolation. Prefer specific --cap-add, --device and --security-opt settings instead."},

{q:"What is rootless Docker?",
 o:["Running containers without a kernel","Running the daemon and containers as an unprivileged user to reduce host risk","Running containers with no runtime","Running containers without networking"],a:1,
 e:"Rootless mode removes the need for a root daemon, so a daemon compromise does not imply host root. Some networking and storage features have limitations."},

/* ---------- 93–100 : Troubleshooting and advanced ---------- */
{q:"A container exits immediately after docker run. What should you check first?",
 o:["Increase the host's disk space","Change the network mode","Check docker logs and verify whether the command or entrypoint exits or fails","Push the image to a registry again"],a:2,
 e:"Most instant exits are a wrong command, a missing file, or an application that needs a TTY. docker ps -a shows the exit code, and docker logs shows what it printed."},

{q:"What does docker system df show?",
 o:["Free disk space on the host filesystem only","Registry storage quotas","CPU used by containers","Disk usage broken down by images, containers, volumes and build cache"],a:3,
 e:"It is the quickest way to find out what is consuming Docker's disk. Add -v for a detailed per-item breakdown before running prune."},

{q:"What is the difference between RUN and CMD?",
 o:["RUN executes at runtime; CMD executes at build time","RUN executes at build time and creates a layer; CMD defines the default command at runtime","They are aliases for the same instruction","CMD executes only at build time"],a:1,
 e:"RUN is a build-time instruction whose results are committed to the image. CMD is stored in the image config and executed when a container starts from it."},

{q:"What is Docker Swarm?",
 o:["Docker's native clustering and orchestration solution","A container image format","A volume driver","A container registry"],a:0,
 e:"Swarm turns multiple Docker hosts into a single cluster with services, replicas, rolling updates and overlay networking. It is simpler than Kubernetes but far less widely adopted."},

{q:"What does docker cp do?",
 o:["Copies images between registries","Copies volumes between hosts","Copies networks between projects","Copies files between the host and a container"],a:3,
 e:"docker cp works on stopped containers too. It is handy for pulling out logs or config, but for ongoing data sharing use a volume instead."},

{q:"What is BuildKit?",
 o:["A modern build engine with parallel builds and better caching","A container runtime","A container registry","A logging driver"],a:0,
 e:"BuildKit is the default builder in modern Docker. It parallelises independent stages, supports secrets and SSH forwarding during builds, and produces more efficient cache reuse."},

{q:"What is a distroless image?",
 o:["An image that contains no operating system at all and cannot run","An image with no layers","A minimal image containing only the application and its runtime dependencies, without a shell or package manager","An image that only runs on Windows"],a:2,
 e:"Distroless images from Google and similar projects shrink the attack surface dramatically: no shell, no package manager, nothing to exploit. Debugging requires tools like ephemeral debug containers."},

{q:"What does docker run --rm do?",
 o:["Removes the container automatically when it exits","Removes the image after the run","Removes the volume when the container exits","Removes the network after the run"],a:0,
 e:"--rm is ideal for one-off commands and CI jobs because it cleans up the container automatically. Named volumes are not removed, so data can still persist."}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Docker Mock Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
