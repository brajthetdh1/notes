<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background: radial-gradient(circle at 20% 30%, #fff6e5 0%, #f0e7fc 40%, #dae6fa 80%, #e3f0f5 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
        }

        /* ---- header with rainbow accent ---- */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            padding: 0.8rem 2rem 0.8rem 2rem;
            border-radius: 80px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .header-left .rainbow-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe, #43e97b, #fa709a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2d1b4e, #4a2c7a, #1e4a8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.5);
            padding: 0.3rem 1.6rem 0.3rem 1.6rem;
            border-radius: 60px;
            font-weight: 500;
            color: #1e2f4a;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header-stats i {
            color: #7c3aed;
        }

        .badge-total {
            background: linear-gradient(145deg, #6d28d9, #4f46e5);
            color: white;
            padding: 0.1rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ----- grid : colorful cards ----- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
            margin-top: 0.5rem;
        }

        /* each card gets a unique gradient border / background */
        .card {
            border-radius: 32px;
            padding: 1.6rem 1.4rem 1.8rem;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* pseudo-element for colorful glow */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 34px;
            z-index: -1;
            background: linear-gradient(135deg, var(--card-accent1, #f093fb), var(--card-accent2, #4facfe), var(--card-accent3, #43e97b));
            opacity: 0.35;
            transition: opacity 0.3s;
        }

        .card:hover::before {
            opacity: 0.6;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.85);
        }

        /* individual card accent colors (set via js) */
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 650;
            font-size: 1.2rem;
            color: #0b1f3b;
            padding-bottom: 0.7rem;
            margin-bottom: 0.9rem;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
            letter-spacing: -0.01em;
        }

        .card-header i {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--icon1, #7c3aed), var(--icon2, #2563eb));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            width: 2rem;
            text-align: center;
        }

        .card-header .count-badge {
            background: rgba(0, 0, 0, 0.05);
            color: #1e3a6b;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            margin-left: auto;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.3rem 0.35rem 0.8rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(2px);
            transition: background 0.15s, transform 0.1s;
            border-left: 4px solid var(--link-border, #b7c9e8);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.7);
            border-left-color: var(--link-border-hover, #4f46e5);
            transform: translateX(2px);
        }

        .link-item a {
            flex: 1;
            text-decoration: none;
            color: #1f2e4a;
            font-weight: 460;
            font-size: 0.85rem;
            padding: 0.15rem 0;
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.1s;
        }

        .link-item a i {
            font-size: 0.6rem;
            color: #7f9bc7;
            opacity: 0.5;
        }

        .link-item a:hover {
            color: #4f46e5;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.7);
            border: none;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #3b5f8a;
            transition: 0.15s;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 1rem;
        }

        .copy-btn:hover {
            background: white;
            color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.88);
        }

        .copy-feedback {
            font-size: 0.7rem;
            font-weight: 700;
            color: #16a34a;
            opacity: 0;
            transition: 0.15s;
            pointer-events: none;
            min-width: 20px;
            margin-left: 0.1rem;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .footer-note {
            margin-top: 3.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: #2e4060;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 0.6rem 2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            font-weight: 450;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .footer-note i {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
                border-radius: 40px;
                padding: 1rem 1.5rem;
            }
            .header-stats {
                align-self: flex-start;
                padding: 0.2rem 1.2rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 1rem;
            }
        }

        /* small rainbow animation on header icon */
        .rainbow-icon {
            animation: hueShift 12s infinite linear;
        }
        @keyframes hueShift {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
    </style>
</head>

        const grid = document.getElementById('linkGrid');
        let totalLinks = 0;

        groups.forEach((group, idx) => {
            if (!group.items || group.items.length === 0) return;

            const card = document.createElement('div');
            card.className = 'card';

            // set custom properties for gradient
            const [a1, a2, a3] = group.accent || ['#f093fb', '#4facfe', '#43e97b'];
            card.style.setProperty('--card-accent1', a1);
            card.style.setProperty('--card-accent2', a2);
            card.style.setProperty('--card-accent3', a3);
            card.style.setProperty('--icon1', a1);
            card.style.setProperty('--icon2', a2);
            card.style.setProperty('--link-border', a1);
            card.style.setProperty('--link-border-hover', a2);

            // header
            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `
                <i class="fas ${group.icon || 'fa-link'}"></i>
                ${group.name}
                <span class="count-badge">${group.items.length}</span>
            `;
            card.appendChild(header);

            // list
            const list = document.createElement('div');
            list.className = 'link-list';

            group.items.forEach(link => {
                const item = document.createElement('div');
                item.className = 'link-item';

                const anchor = document.createElement('a');
                anchor.href = link;
                anchor.target = '_blank';
                anchor.innerHTML = `<i class="fas fa-chevron-right"></i> ${link}`;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.setAttribute('aria-label', 'copy link');
                copyBtn.innerHTML = '<i class="far fa-copy"></i>';

                const feedback = document.createElement('span');
                feedback.className = 'copy-feedback';
                feedback.textContent = '✓';

                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(link)
                        .then(() => {
                            feedback.classList.add('show');
                            setTimeout(() => feedback.classList.remove('show'), 1200);
                        })
                        .catch(() => {
                            // fallback
                            const ta = document.createElement('textarea');
                            ta.value = link;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                            feedback.classList.add('show');
                            setTimeout(() => feedback.classList.remove('show'), 1200);
                        });
                });

                item.appendChild(anchor);
                item.appendChild(copyBtn);
                item.appendChild(feedback);
                list.appendChild(item);
                totalLinks++;
            });

            card.appendChild(list);
            grid.appendChild(card);
        });

        document.getElementById('totalLinks').textContent = totalLinks;
    })();
