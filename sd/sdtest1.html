<style>
  :root{--brand:#7c3aed;--brand-dark:#4c1d95;--accent:#a78bfa;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}

<body>

<header class="topbar">
  <div class="brand">🏛️ System Design Mock Test <span class="setpill">SET 1</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Fundamentals */
{q:'What does horizontal scaling mean?',
 o:['Adding more CPU and RAM to a single machine','Adding more machines and distributing load across them','Compressing data to fit on one disk','Caching more aggressively'],a:1,
 e:'Horizontal scaling (scale-out) adds nodes. It is the foundation of most web-scale architectures because it has no practical ceiling, unlike vertical scaling (scale-up) which is limited by the largest available machine.'},

{q:'Why is statelessness such a strong enabler of horizontal scaling?',
 o:['It reduces memory usage','Any instance can serve any request, so load balancers can freely route traffic and instances can be added, removed or crash without losing session data','It removes the need for a database','It makes the code shorter'],a:1,
 e:'Stateless services push state to a shared store such as a database, cache or signed cookie. This is what makes autoscaling, rolling deploys and node failures survivable.'},

{q:'What does the CAP theorem actually state?',
 o:['You can have all three of consistency, availability and partition tolerance','A system can guarantee at most two of consistency, availability and partition tolerance, and since network partitions happen you must choose between consistency and availability during a partition','Only two of the three exist in any real system','Partition tolerance is optional'],a:1,
 e:'Partitions are a fact of distributed systems, so CAP is really a choice between consistency and availability when a partition occurs. The choice can be made per operation rather than per system.'},

{q:'Which system fits the AP side of the CAP theorem?',
 o:['A traditional single-node relational database','A distributed key-value store that keeps accepting writes on both sides of a partition, reconciling later','A system that refuses writes when a quorum is unavailable','A leader-election system'],a:1,
 e:'AP systems favour availability during partitions and converge later, typically with last-write-wins, vector clocks or CRDTs. Cassandra and DynamoDB are classic examples.'},

{q:'How does PACELC extend CAP?',
 o:['It replaces CAP entirely','It adds that even when there is no partition, a system still trades latency against consistency','It makes availability mandatory','It removes the partition case'],a:1,
 e:'PACELC says: if Partition, choose Availability or Consistency; Else, choose Latency or Consistency. It explains why always-consistent systems can still be slow, because coordination costs latency.'},

{q:'What is a "single point of failure"?',
 o:['A slow query','A component whose failure makes the entire system unavailable','A component with high latency','A feature flag'],a:1,
 e:'Load balancers, primary databases, DNS and coordination services are common SPOFs. The fix is redundancy plus automatic failover, which is why the health and election mechanisms elsewhere matter.'},

{q:'What is an SLA?',
 o:['A code review checklist','A service level agreement: an external commitment to a measurable level of service, often with consequences for missing it','A load-balancing algorithm','A database replica'],a:1,
 e:'SLOs are internal targets, usually stricter than the SLA, so there is headroom before breaching the contract. The error budget is the allowed shortfall against the SLO.'},

{q:'What does "availability" mean in practice?',
 o:['The system never fails','The fraction of time the system is able to serve requests successfully, often measured as uptime percentage','The speed of the system','The cost of the system'],a:1,
 e:'99.9% is about 43 minutes of downtime per month. Each nine roughly doubles the engineering cost, so availability targets should come from the product requirement, not aspiration.'},

{q:'What is the difference between reliability and availability?',
 o:['They are identical','Reliability is the probability of operating correctly for a period; availability is the fraction of time the system is usable, which can be high with fast recoveries even if failures are frequent','Availability means no failures','Reliability means no downtime'],a:1,
 e:'A system that fails often but recovers in milliseconds can be highly available yet unreliable. Both matter, and they are improved by different mechanisms.'},

{q:'What is the single most effective first step when designing any large system?',
 o:['Pick a database','Clarify requirements: functional requirements, scale estimates, latency targets and the consistency requirements of each feature','Choose a cloud provider','Write the schema'],a:1,
 e:'Most design disagreements come from unstated requirements. Estimates and consistency needs per feature drive every later decision, and they are exactly what interviewers probe.'},

/* 11–20: Estimation & scaling */
{q:'What does "back-of-the-envelope estimation" primarily use?',
 o:['Precise benchmarks','Approximate powers of ten and round numbers to decide whether a design can meet scale, before optimising','Load tests','Cost calculators'],a:1,
 e:'The goal is order of magnitude, not precision. Knowing whether you need 3 servers or 300 changes the architecture, and the exact number can come later from measurement.'},

{q:'How many seconds are in a day, approximately?',
 o:['1,000','8,640','86,400','864,000'],a:2,
 e:'86,400 seconds per day. The useful corollary is that 1 million requests per day is roughly 12 requests per second, which makes most daily-volume questions easy to reason about.'},

{q:'If a service receives 10 million writes per day, roughly how many writes per second is that?',
 o:['~1','~12','~116','~1,160'],a:2,
 e:'10,000,000 / 86,400 is about 116 per second average. Design for a peak multiple of the average, often 3-5x, which gives a few hundred writes per second at peak.'},

{q:'Which latency number is roughly correct for a same-datacenter round trip?',
 o:['Under 1 ms','Around 0.5 ms','Around 50 ms','Around 500 ms'],a:1,
 e:'Same-DC round trips are on the order of half a millisecond. Cross-region hops are tens of milliseconds, and disk I/O and cache misses are microseconds to milliseconds, so the numeric sense matters for choosing between designs.'},

{q:'What is the main reason to avoid synchronous calls in a long request chain?',
 o:['They are harder to code','Latency compounds and availability multiplies: if each hop is 99.9% available, ten hops in series give roughly 99% availability for the overall request','They cannot be load-balanced','They cannot be logged'],a:1,
 e:'Fan-out and deep chains amplify both tail latency and failure probability. Reducing chain depth or moving to asynchronous processing is often the single biggest reliability improvement.'},

{q:'What is tail latency and why does it matter?',
 o:['The fastest responses','The slowest responses, such as p99 or p99.9, which dominate user experience and can be amplified by fan-out','The average response time','The time to first byte'],a:1,
 e:'A page that fans out to 100 backends will wait on the slowest of them, so a p99 of 1 second becomes the typical user experience. Mitigations include hedged requests, timeouts and reducing fan-out.'},

{q:'What does an auto-scaling group primarily use to decide scale-out?',
 o:['Code changes','Metrics such as CPU, request rate or queue depth crossing a threshold, plus a cooldown to avoid thrashing','Deployment frequency','Disk space'],a:1,
 e:'Autoscaling needs a signal correlated with load, a warm-up period for new instances and a cooldown so it does not oscillate. It also needs a load balancer that can add instances without dropping traffic.'},

{q:'Why does a cache help a read-heavy system so much?',
 o:['It compresses data','It serves most reads from memory, which is orders of magnitude faster than a database disk read, and offloads the database','It encrypts traffic','It enforces consistency'],a:1,
 e:'The typical pattern is a small hot set dominating reads. Caching is the highest-leverage optimisation in almost every read-heavy design, at the cost of staleness and invalidation complexity.'},

{q:'What is the main trade-off when increasing replication factor in a database?',
 o:['Better durability and read capacity versus more storage, write amplification and coordination cost','Better durability and lower cost','No trade-off','Lower availability'],a:0,
 e:'More replicas improve read throughput and fault tolerance, but every write must reach more nodes, which increases latency and the chance of a slow quorum member holding up an acknowledgement.'},

{q:'What is the purpose of sharding in a database?',
 o:['To compress data','To partition data across multiple nodes so storage and write throughput can scale horizontally beyond one machine','To replicate data','To enforce ACID'],a:1,
 e:'Sharding is horizontal partitioning. It scales writes and storage, at the cost of cross-shard queries, distributed transactions and the difficult choice of shard key.'},

/* 21–30: Load balancing & networking */
{q:'Which load-balancing algorithm is best for handling requests of very different durations?',
 o:['Round robin','Least connections, which sends new requests to the instance with the fewest in-flight requests','Random','IP hash'],a:1,
 e:'Round robin assumes similar work per request. Least connections adapts naturally to slow or long-lived requests, which is why it is common for APIs with mixed workloads.'},

{q:'What is the difference between an L4 and an L7 load balancer?',
 o:['They are identical','An L4 balancer routes on IP and TCP/UDP information, while an L7 balancer understands HTTP and can route on path, headers and cookies','L4 is application-aware','L7 cannot terminate TLS'],a:1,
 e:'L7 is more flexible but more expensive per request. L4 is used where raw throughput matters or when the protocol is not HTTP, such as database or message-broker traffic.'},

{q:'What does "sticky sessions" mean, and why is it a compromise?',
 o:['Persisting cookies forever','Routing a user to the same backend instance so in-memory session state survives, which conflicts with statelessness and complicates failover and scaling','Caching sessions on the client','Storing sessions in the database'],a:1,
 e:'Sticky sessions mask statefulness rather than fixing it. If the instance dies the session is lost, and rebalancing is uneven. Externalising session state is the standard fix.'},

{q:'What problem does a CDN solve?',
 o:['Database replication','Serving static and cacheable content from edge locations close to users, reducing latency and origin load','Encrypting traffic','Load testing'],a:1,
 e:'CDNs also absorb attacks and reduce bandwidth cost. Cache-control headers, versioned URLs and purge APIs are the operational levers that make them effective.'},

{q:'What is the role of DNS in system design?',
 o:['Encrypting traffic','Mapping names to addresses and enabling traffic steering such as geo-routing, weighted records and failover between regions','Storing session state','Caching database queries'],a:1,
 e:'DNS is the first load-balancing layer. Its weaknesses are caching and TTL: clients and resolvers may hold stale answers, so DNS failover is not instantaneous.'},

{q:'What is anycast, and where is it commonly used?',
 o:['A routing method where the same IP is announced from many locations so users reach the nearest one, used by DNS and CDNs','A database replication method','A caching strategy','A message queue pattern'],a:0,
 e:'Anycast improves latency and absorbs DDoS by dispersing traffic. It is the default for public DNS resolvers and CDN edges, though it requires careful BGP and state handling.'},

{q:'Why do health checks on a load balancer need to distinguish liveness from readiness?',
 o:['They are the same thing','A slow-starting instance should not be removed permanently (liveness), but it also should not receive traffic until ready; the two signals drive restart versus routing decisions','Readiness is only for databases','Liveness only applies to stateless services'],a:1,
 e:'Conflating them causes restart loops during deploys or 502s from instances that are up but not ready. The orchestrator and load balancer consume different checks for different actions.'},

{q:'What is connection draining (or deregistration delay) and why does it matter?',
 o:['Closing all connections immediately','Waiting for in-flight requests to finish on an instance before removing it, so deploys and scaling do not produce errors','Increasing timeouts','Rotating certificates'],a:1,
 e:'Without draining, requests in flight during a deploy fail. It pairs with graceful shutdown and readiness probes, and it is the standard cause of "deploys cause 502s" incidents.'},

{q:'What does a reverse proxy do that a forward proxy does not?',
 o:['It is placed in front of servers to accept client requests on their behalf, often adding TLS termination, compression, caching and routing','It hides the client identity','It only handles HTTPS','It replaces DNS'],a:0,
 e:'Nginx, HAProxy and Envoy as reverse proxies are the workhorses of most architectures. A forward proxy acts on behalf of clients, for example for egress control.'},

{q:'Why is a single global load balancer a risk?',
 o:['It is too expensive','It becomes a single point of failure and a latency bottleneck for users far from it, so multi-region or anycast fronting is preferred','It cannot handle HTTP','It breaks TLS'],a:1,
 e:'Production designs usually combine DNS or anycast steering with regional load balancers, so a regional failure affects only that region and latency stays low for everyone else.'},

/* 31–40: Caching */
{q:'What is a cache hit ratio?',
 o:['The fraction of requests served from the cache rather than the origin','The size of the cache','The number of entries','The eviction rate'],a:0,
 e:'Hit ratio is the single most important cache metric. A small improvement from 90% to 95% halves the origin traffic, which is why sizing and key design deserve attention.'},

{q:'What is the difference between a cache-aside and a read-through cache?',
 o:['They are the same','Cache-aside means the application loads from the database on a miss and populates the cache; read-through means the cache library itself loads from the backing store on a miss','Cache-aside writes to the cache first','Read-through bypasses the cache on misses'],a:1,
 e:'Cache-aside is more flexible and the most common pattern. Read-through simplifies application code but couples you to the cache library and its loading strategy.'},

{q:'Which write strategy keeps the cache and database most consistent but costs the most?',
 o:['Write-behind','Write-through, where every write goes to the cache and the store synchronously','Write-around','No caching'],a:1,
 e:'Write-through keeps them in lockstep at the cost of extra latency per write. Write-behind is faster but risks data loss if the cache fails before flushing.'},

{q:'What is the "thundering herd" or cache stampede problem?',
 o:['Too many cache entries','When a popular key expires or a cold cache is hit by many clients at once, all of them miss and hammer the database simultaneously','A cache eviction policy','A distributed lock'],a:1,
 e:'Mitigations include request coalescing (single-flight), probabilistic early refresh, per-key locks, and jittered TTLs. It is one of the most common production outages caused by caching.'},

{q:'What does a TTL (time to live) on a cache entry control?',
 o:['The entry size','How long the entry is considered valid before it must be refreshed, trading staleness against origin load','The number of replicas','The encryption key'],a:1,
 e:'Short TTLs reduce staleness but increase misses. Long TTLs do the reverse. The right choice depends on how much staleness the product can tolerate.'},

{q:'What is the risk of caching personalised user data under a key that omits the user id?',
 o:['The cache will be slower','One user can receive data belonging to another user, which is both a correctness bug and a serious security incident','The cache will not start','No risk'],a:1,
 e:'Cache keys must include every dimension that affects the response: user, tenant, locale, permissions, API version. Missing key dimensions are the classic cause of cache poisoning and data leaks.'},

{q:'What does the LRU eviction policy do?',
 o:['Evicts the least recently used entries first','Evicts random entries','Evicts the largest entries','Never evicts'],a:0,
 e:'LRU approximates the working set well for many workloads but can be fooled by scans. Variants like segmented LRU, LFU and W-TinyLFU are used in practice to resist scan pollution.'},

{q:'Why is cache invalidation considered one of the hard problems in computing?',
 o:['Caches are slow','It requires knowing every place a value is read from and written to, and the cost of a missed invalidation is stale data that may persist indefinitely','It is a hardware limitation','It is illegal in some regions'],a:1,
 e:'TTL-based expiry, versioned keys, event-driven invalidation and pub/sub all trade one problem for another. Designing for short TTLs and immutable data where possible reduces the difficulty.'},

{q:'What is a distributed cache?',
 o:['A cache local to one process','A cache spread across multiple nodes, usually sharded by key, so capacity and throughput can exceed a single machine','A cache stored on disk','A write-behind cache'],a:1,
 e:'Redis Cluster and Memcached are typical. Adding cache nodes introduces consistency and hot-key concerns, and it means cache clients need topology awareness.'},

{q:'What is a "hot key" problem in a cache?',
 o:['A key that is never read','A single key receiving a disproportionate share of traffic, overloading the cache node that owns it','A key that is too large','A key with no TTL'],a:1,
 e:'Solutions include local client-side caches for the hot key, splitting the key into shards with a random suffix, read replicas, or a second-tier cache in front of Redis.'},

/* 41–55: Databases */
{q:'When is a relational database the better choice?',
 o:['When you need multi-row ACID transactions, strong consistency and flexible query patterns with joins','When you need infinite write throughput','When the schema is unknown','When data is always a simple key-value'],a:0,
 e:'Relational databases remain the best default for most business data. They are only a poor fit when the scale or access pattern genuinely exceeds a single primary, which is rarer than people assume.'},

{q:'What does ACID stand for?',
 o:['Atomicity, Consistency, Isolation, Durability','Availability, Consistency, Integrity, Durability','Atomicity, Concurrency, Isolation, Distributed','Accuracy, Consistency, Isolation, Durability'],a:0,
 e:'Atomicity means all-or-nothing; consistency means valid transitions; isolation means concurrent transactions do not see the partial work of each other; durability means committed data survives crashes.'},

{q:'Which isolation level prevents non-repeatable reads but still allows phantom reads?',
 o:['Read uncommitted','Repeatable read','Serializable','Snapshot isolation'],a:1,
 e:'Repeatable read guarantees a row read twice has the same value, but a range query may still see new rows (phantoms). Serializable prevents phantoms at significant cost in contention.'},

{q:'What is the difference between a clustered and a non-clustered index?',
 o:['They are the same','A clustered index determines the physical order of rows in the table, while a non-clustered index is a separate structure pointing to the rows','Clustered indexes are only for NoSQL','Non-clustered indexes cannot be unique'],a:1,
 e:'A table can have only one clustered index. In InnoDB the primary key is clustered, so secondary indexes store the primary key and require a second lookup.'},

{q:'What is the difference between replication and sharding?',
 o:['They are the same','Replication copies the same data to multiple nodes for durability and read scaling; sharding partitions different data across nodes for write and storage scaling','Replication splits data','Sharding duplicates data'],a:1,
 e:'The two are complementary. A common architecture shards by a key and replicates each shard as a replica set, which is exactly how MongoDB and most distributed databases work.'},

{q:'What is a "shard key" and why is it so important?',
 o:['A password for the database','The field used to decide which shard holds a document; a poor choice causes hot shards, un-splittable chunks and expensive cross-shard queries','An index','A backup key'],a:1,
 e:'Good shard keys have high cardinality, low frequency and non-monotonic distribution. Changing a shard key later is extremely painful, so it is the most consequential schema decision.'},

{q:'What is a "hot partition" in a sharded store?',
 o:['A partition with no data','A shard receiving a disproportionate share of traffic, often because the shard key is monotonically increasing such as a timestamp or auto-increment id','A partition that is read-only','A replicated partition'],a:1,
 e:'The standard fixes are hashing the key, composing the key with a high-cardinality prefix, or pre-splitting. Observability of per-shard traffic is essential to catch it early.'},

{q:'What is quorum in the context of replicated databases?',
 o:['A single leader','A majority of replicas that must acknowledge a read or write for it to be considered successful','All replicas','A backup schedule'],a:1,
 e:'With N replicas and a write quorum of W and read quorum of R, W + R > N gives read-your-writes style consistency. Tuning W and R trades latency against consistency.'},

{q:'What is the role of the write-ahead log (WAL) in a database?',
 o:['Compressing data','Durably recording changes before they are applied to the main data structures, so a crash can be recovered by replaying the log','Indexing rows','Replicating across regions'],a:1,
 e:'The WAL is also the source for change data capture, which is why CDC tools read the WAL or binlog rather than polling application tables.'},

{q:'What is a B-tree index best at?',
 o:['Full-text search','Equality and range queries on ordered data, which is why it is the default index type in relational databases','Storing blobs','Compression'],a:1,
 e:'B-trees keep data sorted and balanced, giving logarithmic lookups and efficient range scans. Hash indexes are faster for pure equality but cannot do ranges.'},

{q:'When would you choose a columnar store such as ClickHouse or Parquet?',
 o:['For OLTP transactions','For analytical queries that scan a few columns over many rows, where columnar storage gives better compression and much less I/O','For key-value lookups','For graph traversal'],a:1,
 e:'Row stores are optimised for fetching whole records by key; column stores are optimised for aggregations over large datasets. Using the wrong one is a common architectural mistake.'},

{q:'What is a materialised view?',
 o:['A temporary table','A precomputed query result stored physically, refreshed periodically or on change, trading write cost and staleness for read speed','An index','A backup'],a:1,
 e:'It is the database-level equivalent of the computed pattern. It is often implemented with a scheduled job, a trigger, or a streaming pipeline that maintains the result incrementally.'},

{q:'What does "eventual consistency" require from the application?',
 o:['Nothing, it is transparent','Handling reads that may return stale data, designing UI states such as "pending", and ensuring reconciliation and idempotency','Turning off replication','Using only a single node'],a:1,
 e:'Consistency is a product decision as much as a technical one. Showing "order received" versus "order confirmed" is a UX acknowledgement of the replication window.'},

{q:'Why is pagination with OFFSET slow at high page numbers?',
 o:['OFFSET is not supported','The database must still scan and discard all preceding rows, so cost grows with the offset; keyset pagination on an indexed column avoids it','It requires a transaction','It breaks indexes'],a:1,
 e:'Keyset pagination using "WHERE (created_at, id) < (?, ?)" jumps directly to the right place using the index. It also gives more stable results when data changes between pages.'},

{q:'What is the read-replica lag problem?',
 o:['Replicas are slower at writing','A read served from a lagging replica may not include a write that already committed on the primary, so users can see their own write disappear','Replicas do not have indexes','Replicas cannot be queried'],a:1,
 e:'The standard fix is read-your-writes routing: send the reads of a user who just wrote to the primary (or a caught-up replica) for a short window, then fall back to replicas.'},

/* 56–65: Distributed systems */
{q:'What does Raft provide that Paxos is known for being harder to implement?',
 o:['Higher throughput','Leader election and log replication with an easier-to-reason-about design, used in etcd, Consul and Kafka KRaft','Weaker consistency','Automatic sharding'],a:1,
 e:'Raft deliberately separates leader election, log replication and safety, and it is the consensus algorithm behind most modern coordination services.'},

{q:'In a leader-based replication system, what happens during a leader failover?',
 o:['Nothing changes','A new leader is elected among replicas, and writes are briefly paused or rejected until the election completes','All data is lost','Replicas become read-only forever'],a:1,
 e:'Failover needs a failure detector and a quorum-based election to avoid split-brain. The window of unavailability is the price of consistent writes.'},

{q:'What is split-brain in a distributed system?',
 o:['A network topology','A situation where two nodes both believe they are the leader, so clients may write to both and the state diverges','A database corruption','A caching failure'],a:1,
 e:'Quorum and fencing tokens prevent it. Without a strict majority requirement, a partition can create two leaders, which is why Raft and similar protocols require a majority to act.'},

{q:'What is a distributed lock used for, and what is its main risk?',
 o:['Caching, with no risk','Coordinating exclusive access to a resource across processes; the risk is that a paused lock holder loses the lock without knowing it and a second holder enters','Sharding data','Encrypting traffic'],a:1,
 e:'Mitigations include short lease TTLs with renewal, fencing tokens so the storage rejects stale holders, and designing for idempotency rather than relying on the lock for correctness.'},

{q:'What is the two-generals problem an illustration of?',
 o:['Two servers sharing a disk','The impossibility of guaranteed agreement over an unreliable channel, which motivates consensus protocols with explicit assumptions','Load balancing','Database indexing'],a:1,
 e:'It shows that you cannot have certainty of agreement with unreliable communication, which is why consensus algorithms use rounds, quorums and explicit failure detectors.'},

{q:'What is consistent hashing used for?',
 o:['Encrypting keys','Distributing keys across nodes so that adding or removing a node moves only a small fraction of keys rather than rehashing everything','Compressing data','Sorting data'],a:1,
 e:'Consistent hashing plus virtual nodes is how caches and sharded stores add capacity without a full reshuffle. It is also the basis of many CDN and load-balancing schemes.'},

{q:'What is the purpose of a heartbeat in a distributed system?',
 o:['Synchronising clocks','Allowing peers to detect liveness and failure by noticing the absence of periodic messages within a timeout','Encrypting messages','Compressing data'],a:1,
 e:'Heartbeat interval and timeout must be tuned together. Too short causes false failures under GC pauses; too long delays failover. Clock drift and network jitter complicate both.'},

{q:'Why are clock synchronisation and monotonic clocks important in distributed systems?',
 o:['They are not important','Wall clocks can jump backwards and differ between machines, so ordering by timestamp is unsafe; logical clocks or monotonic counters are needed for correct ordering','They only matter for logs','They only matter for databases'],a:1,
 e:'This is why distributed systems use logical clocks, Lamport timestamps and version vectors rather than relying on wall-clock time for ordering.'},

{q:'What does "idempotent" mean, and why is it critical in distributed systems?',
 o:['Repeating an operation produces the same final state, which makes retries safe after ambiguous failures','An operation is faster','An operation cannot fail','An operation uses no memory'],a:0,
 e:'Because a timeout tells you nothing about whether the request was processed, retries are unavoidable. Idempotency keys, natural keys and upserts are the standard mechanisms.'},

{q:'What is a fencing token?',
 o:['A password','A monotonically increasing token issued with a lock, which the resource verifies to reject operations from a stale lock holder','A TLS certificate','A shard key'],a:1,
 e:'Fencing solves the paused-lock-holder problem: even if the old holder wakes up, its token is lower than the current one, so the storage rejects its writes.'},

/* 66–75: Messaging & async */
{q:'What is the primary reason to introduce a message queue between services?',
 o:['To increase code complexity','To decouple producers from consumers in time and rate, absorbing spikes and allowing independent scaling','To replace the database','To enforce consistency'],a:1,
 e:'Queues buffer bursts and isolate failures, at the cost of eventual consistency, ordering concerns and an extra piece of infrastructure to operate.'},

{q:'What is the difference between at-most-once, at-least-once and exactly-once delivery?',
 o:['They are identical','At-most-once may lose messages; at-least-once may duplicate them; exactly-once is achieved in practice with at-least-once plus idempotent consumers and deduplication','Exactly-once is free','At-least-once never duplicates'],a:1,
 e:'Most production systems use at-least-once plus idempotent processing, because true end-to-end exactly-once across a network is impossible without cooperation from the destination.'},

{q:'What is a dead-letter queue?',
 o:['A queue for expired messages','A queue that receives messages that repeatedly failed processing, so the main consumer can continue and the failures can be investigated','A backup of the main queue','A queue with no consumers'],a:1,
 e:'A DLQ plus alerting is the operational safety net for a consumer pipeline. It must be monitored, because a growing DLQ is invisible failure.'},

{q:'What does "backpressure" mean?',
 o:['A network error','The mechanism by which a slow consumer signals the producer or broker to slow down, preventing unbounded memory growth','A database lock','A cache eviction'],a:1,
 e:'Backpressure can be explicit (credits, bounded queues) or implicit (queue depth throttling). Without it, a fast producer and a slow consumer ends in out-of-memory.'},

{q:'When does ordering matter in a message pipeline?',
 o:['Never','When events for the same entity must be processed in order, which usually requires partitioning by that entity key so they land on the same partition','Only for logging','Only for batch jobs'],a:1,
 e:'Ordering is per partition, not per topic. Consumers of different partitions have no ordering guarantee relative to each other, so the key choice defines the ordering scope.'},

{q:'What is a fan-out pattern?',
 o:['One consumer reading from all queues','Publishing one event so many independent consumers can each react to it, often with a pub/sub topic or a fan-out queue per consumer','Load balancing','Sharding'],a:1,
 e:'Fan-out decouples producers from the number of consumers. The trade-off is that each consumer must handle duplicates and out-of-order delivery independently.'},

{q:'Why is a delayed queue or scheduled message useful?',
 o:['To encrypt data','To postpone processing until a future time, such as retry backoff, reminders or order timeouts','To compress messages','To shard data'],a:1,
 e:'It avoids a polling scheduler for every feature. Many brokers support per-message delay, and workflows use it heavily for timeouts and retries.'},

{q:'What is the outbox pattern trying to avoid?',
 o:['Slow consumers','The dual-write problem, where a database commit succeeds but the event publish fails (or vice versa), leaving the system inconsistent','Message duplication','Ordering issues'],a:1,
 e:'The outbox writes the business row and the outbox row atomically, and a relay publishes from the outbox. It guarantees the event is eventually emitted exactly when the data is committed.'},

{q:'What is the difference between a queue and a topic in pub/sub?',
 o:['They are the same','A queue delivers each message to one consumer, distributing load; a topic delivers each message to every subscriber, distributing copies','A topic stores no data','A queue cannot be durable'],a:1,
 e:'Queues are for work distribution; topics are for event notification. Many brokers implement both with configuration, for example a consumer group versus fan-out subscriptions.'},

{q:'What does "consumer lag" tell you?',
 o:['The consumer code quality','How far behind the consumer is relative to the end of the stream, which reveals whether processing is keeping up with the input rate','The number of partitions','The broker version'],a:1,
 e:'Lag is the key operational metric for streaming consumers. Growing lag means the consumer cannot keep up, and the usual causes are slow processing, insufficient instances, or a hot partition.'},

/* 76–85: API design & security */
{q:'Why is idempotency important for payment APIs?',
 o:['It is faster','A client retry after a timeout could otherwise charge the customer twice; an idempotency key lets the server recognise and deduplicate the retry','It reduces storage','It enables caching'],a:1,
 e:'The key is usually generated by the client and stored with the response, so a retry returns the original result. This is the standard approach for any non-idempotent POST.'},

{q:'What does the statelessness constraint of a RESTful API require?',
 o:['No database','Each request must carry all the information needed to process it, with session state kept on the client, so any server can handle any request','No caching','No authentication'],a:1,
 e:'Statelessness is what makes horizontal scaling and load balancing trivial. Session state, if needed, lives in a token or in a shared store keyed by an identifier.'},

{q:'Which HTTP status code should an API return for a duplicate resource creation attempt?',
 o:['200','404','409 Conflict','503'],a:2,
 e:'409 indicates the request conflicts with the current state of the resource. 400 is for malformed input, and 401/403 are for authentication and authorization.'},

{q:'What is the difference between authentication and authorization in an API?',
 o:['They are the same','Authentication verifies identity; authorization decides whether that identity may perform the action on that resource','Authorization happens first','Authentication only applies to users'],a:1,
 e:'A valid token authenticates but does not authorise every action. Resource-level and tenant-level authorisation must be enforced server-side on every request.'},

{q:'What is JWT, and what is its main operational risk?',
 o:['A database format','A signed token carrying claims, which is stateless but hard to revoke before expiry, so short lifetimes plus refresh tokens are essential','A TLS certificate','A password hash'],a:1,
 e:'Because servers validate the signature locally without a lookup, revocation requires a denylist or short-lived tokens. Never put sensitive data in the payload, since it is only signed, not encrypted.'},

{q:'What does OAuth 2.0 authorise, and how does it differ from OpenID Connect?',
 o:['They are the same','OAuth 2.0 delegates authorisation and issues access tokens; OpenID Connect adds an identity layer with an ID token so clients can authenticate the user','OAuth handles authentication only','OpenID Connect replaces TLS'],a:1,
 e:'Confusing the two is a common interview trap. OAuth answers "can this app access this resource", and OIDC answers "who is this user".'},

{q:'What is API versioning, and why does it matter?',
 o:['Changing the base URL for no reason','An explicit scheme (URL, header or media type) for evolving an API without breaking existing clients, combined with a deprecation policy','Caching headers','Load balancing'],a:1,
 e:'The safe pattern is additive change and expand-and-contract, with version numbers only for genuinely breaking changes. Consumers should be tolerant readers of new fields.'},

{q:'Why is rate limiting necessary?',
 o:['To reduce server cost only','To protect the system from abuse and overload, provide fairness between tenants, and make capacity predictable; it is also a product feature for paid tiers','To encrypt traffic','To replace authentication'],a:1,
 e:'Token bucket and leaky bucket are common algorithms. Rate limits should be enforced per identity and per endpoint, and they must return a clear 429 with a Retry-After header.'},

{q:'What is the difference between a 429 and a 503?',
 o:['They are the same','429 means this client sent too many requests and should slow down; 503 means the service itself is unavailable or overloaded','429 means server error','503 means authentication failure'],a:1,
 e:'The distinction matters for client retry logic. 429 should be respected per client, whereas 503 may affect everyone and usually indicates a broader incident.'},

{q:'What is a common approach to securing service-to-service communication inside a cluster?',
 o:['Plain HTTP on a private network','Mutual TLS with per-service identities plus per-request authorisation, so identity is cryptographic rather than based on network location','Shared API keys','No authentication'],a:1,
 e:'Zero trust treats the internal network as potentially compromised. A service mesh typically automates certificate issuance and rotation for mTLS.'},

/* 86–95: Classic design problems */
{q:'What is the core data structure that makes a URL shortener work?',
 o:['A queue','A key-value mapping from short code to long URL, typically in a distributed store with a cache in front','A graph','A sorted list'],a:1,
 e:'The hard parts are code generation (base62 of a counter or hash), collision avoidance, and the read-heavy access pattern, which makes caching the primary optimisation.'},

{q:'For a news feed, what is the difference between fan-out on write and fan-out on read?',
 o:['They are the same','Fan-out on write precomputes each user feed at post time, giving fast reads but expensive writes; fan-out on read assembles the feed at request time, which is cheaper to write and slower to read','Fan-out on read is always better','Fan-out on write uses no storage'],a:1,
 e:'Real systems usually use a hybrid: fan-out on write for ordinary users and fan-out on read for celebrities, to avoid a single post triggering millions of writes.'},

{q:'What is the fundamental scaling challenge in a chat application?',
 o:['Storing messages','Maintaining millions of long-lived connections and routing messages to the right recipients in real time, usually with a presence-aware gateway','Encrypting messages','Paginating history'],a:1,
 e:'WebSockets with a routing layer and an offline queue are the core. Presence and delivery receipts add significant fan-out and state complexity.'},

{q:'In a ride-sharing design, why is geospatial indexing essential?',
 o:['To store driver names','To efficiently answer "which drivers are near this point" without scanning all drivers, using geohashes, quadtrees or database geospatial indexes','To calculate prices','To compress GPS traces'],a:1,
 e:'Proximity search at scale needs a spatial index. Geohash prefixes make it easy to shard, while a geospatial database offers richer query support.'},

{q:'In a distributed counter (like views or likes), what is the main trade-off?',
 o:['Encryption','Exactness versus throughput: precise counters require coordination, while approximate counters (sharded counters, CRDTs, probabilistic sketches) scale better','Colour accuracy','Sorting'],a:1,
 e:'Many systems shard the counter and sum on read, or accept approximate values. The product requirement decides whether exactness is worth the coordination cost.'},

{q:'For a video streaming platform, what does a transcoding pipeline need most?',
 o:['A relational database','A durable queue with idempotent workers that can retry and scale independently, plus object storage for the renditions','A cache','A load balancer'],a:1,
 e:'Transcoding is slow, expensive and failure-prone, which makes the work queue and idempotency the core design concerns. The CDN then serves the finished renditions.'},

{q:'In a web crawler design, what is the purpose of the URL frontier?',
 o:['To store page content','To hold the queue of URLs to crawl, applying politeness, prioritisation and de-duplication','To render pages','To store indexes'],a:1,
 e:'A crawler must respect robots.txt and per-host rate limits, avoid traps, and de-duplicate URLs. The frontier plus the seen-set is where most of that logic lives.'},

{q:'What is the key design problem in a rate limiter at scale?',
 o:['Choosing colours','Sharing the counter state across many gateway instances accurately and with low latency, which is why a fast shared store such as Redis is used','Encrypting requests','Sorting requests'],a:1,
 e:'A purely local limiter is fast but allows N times the configured rate with N instances. A shared store gives accuracy at the cost of a network hop and a possible hotspot.'},

{q:'In a distributed search system, why is an inverted index used?',
 o:['To store documents','To map terms to the documents containing them, which makes term lookup fast instead of scanning every document','To compress text','To rank results'],a:1,
 e:'The inverted index is the core of search engines such as Lucene. Ranking (TF-IDF, BM25), sharding and merging results from multiple shards are the additional hard problems.'},

{q:'For a payments system, which property most constrains the architecture?',
 o:['Storage cost','Exactly-once effects, strong consistency and an auditable ledger, because duplicated or lost money is unacceptable','Read latency','Cache size'],a:1,
 e:'Payments are the classic case where you accept lower throughput and higher latency for correctness. Idempotency keys, a ledger of immutable entries and reconciliation are standard.'},

/* 96–100: Reliability & observability */
{q:'What is the purpose of a circuit breaker in a service architecture?',
 o:['Encrypting traffic','To stop calling a failing dependency after a threshold, fail fast and allow it to recover, preventing cascading failure','Balancing load','Compressing data'],a:1,
 e:'It protects both caller and callee. Combined with timeouts, bulkheads and bounded retries, it is the main defence against cascading failure.'},

{q:'What is the difference between a metric, a log and a trace?',
 o:['They are interchangeable','Metrics are aggregated numeric time series, logs are discrete events, and traces follow one request across services','Traces are only for errors','Logs are only for audits'],a:1,
 e:'The three are complementary: metrics tell you something is wrong, traces localise where, and logs explain why. Structured logs with a correlation id connect all three.'},

{q:'What is a "canary release"?',
 o:['A database migration','Deploying the new version to a small fraction of traffic first, watching error and latency metrics, then gradually increasing exposure','A full rollout','A rollback'],a:1,
 e:'Canaries limit blast radius but expose real users, so they require strong observability and automated rollback on SLO breach. Blue-green is the alternative with instant switchover.'},

{q:'Why is a runbook useful in operations?',
 o:['To document the code','To give responders a step-by-step procedure for common incidents, reducing time to mitigate and dependence on individual memory','To replace monitoring','To satisfy compliance only'],a:1,
 e:'Runbooks pair with alerts: every page should link to a runbook. They should be written and tested before the incident, not during it.'},

{q:'What does "error budget" mean in SRE practice?',
 o:['The budget for servers','The allowed amount of unreliability implied by an SLO, which teams can spend on releases and experiments and which gates further change when exhausted','The cost of monitoring','The number of allowed bugs'],a:1,
 e:'Error budgets turn reliability into a shared, measurable trade-off between product velocity and stability, rather than an argument between teams.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>System Design Mock Test — Set 1 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
