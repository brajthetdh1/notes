<style>
  :root{--brand:#7c3aed;--brand-dark:#4c1d95;--accent:#a78bfa;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}

  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}

  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}

  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}

  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🏛️ System Design Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>

      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Multi-region & Disaster Recovery */
{q:'What does RTO (Recovery Time Objective) measure?',
 o:['The maximum acceptable data loss','The maximum acceptable time to restore service after an outage','The time to replicate data','The time to plan an incident'],a:1,
 e:'RTO is a time target: how long the business can tolerate the service being down. It drives the failover architecture - a 4-hour RTO permits cold standby, while a 5-minute RTO requires a hot or active-active design.'},

{q:'What does RPO (Recovery Point Objective) measure?',
 o:['The maximum acceptable data loss, usually expressed as time','The time to restore service','The time to plan a backup','The time between deploys'],a:0,
 e:'RPO is a data target: how much recent data can be lost. A 5-minute RPO requires replication lag below 5 minutes, which determines whether asynchronous replication is acceptable or synchronous replication is needed.'},

{q:'What distinguishes a warm standby from a cold standby in disaster recovery?',
 o:['Nothing, they are synonyms','Warm standby runs a scaled-down but functional copy that can take traffic quickly; cold standby is infrastructure that must be provisioned and started','Cold standby is always cheaper to run','Warm standby never receives data'],a:1,
 e:'Cold standby gives the lowest cost but the longest RTO. Warm standby trades ongoing cost for a much faster recovery. Hot standby runs at full scale and can take over almost immediately.'},

{q:'What is the main architectural difference between active-active and active-passive multi-region?',
 o:['They are the same','In active-active both regions serve traffic simultaneously; in active-passive one region serves and the other stays on standby','Active-passive has no replication','Active-active does not need a database'],a:1,
 e:'Active-active improves latency and capacity but introduces write conflicts and harder reconciliation. Active-passive is simpler and safer for data, at the cost of a cold or warm standby and a failover step.'},

{q:'What is the biggest data challenge in an active-active multi-region write architecture?',
 o:['Encryption','Resolving write conflicts when the same record is updated in both regions','Storage cost','User authentication'],a:1,
 e:'Two active regions accept concurrent writes to the same key. Designs either avoid this by partitioning keys by region, or accept and resolve conflicts with last-write-wins, vector clocks or CRDTs.'},

{q:'What does a global traffic manager (GTM) do?',
 o:['Load balance within a single datacenter','Route users to the closest or healthiest region using DNS, anycast or a global load balancer','Encrypt traffic between regions','Replicate the database'],a:1,
 e:'GTM decisions are based on geography, latency, health checks and weights. DNS-based routing has a TTL caveat, which is why failover is rarely instant with DNS alone.'},

{q:'Why is cross-region replication lag a problem for read-your-writes guarantees?',
 o:['It increases storage cost','A user who writes in one region and is routed to another may not see that write, breaking the read-your-writes expectation','It slows down writes only','It breaks encryption'],a:1,
 e:'Solutions include routing a user to the same region for a short window after a write, or carrying a version token so the read can wait for a replica that has caught up.'},

{q:'What is data sovereignty?',
 o:['A cloud pricing model','A legal requirement that data about citizens of a country stays within that country or region','A backup strategy','A replication protocol'],a:1,
 e:'Data residency laws force the architecture to store and process data per jurisdiction. This often means region-scoped data stores and careful handling of cross-region queries and analytics.'},

{q:'What must a regional failover runbook cover?',
 o:['Only the DNS change','Detection, the decision to fail over, traffic switch, data verification, and a plan for failback','Only the database failover','Only the application deploy'],a:1,
 e:'Failover is a process, not a single action. Without explicit decision criteria and verification steps, teams either fail over on false positives or fail to fail over when it matters.'},

{q:'Why is regular disaster recovery testing essential?',
 o:['It satisfies auditors only','Untested failover is usually broken in subtle ways, and drills expose them before a real outage forces a discovery','It reduces cloud cost','It improves encryption'],a:1,
 e:'Failover depends on credentials, DNS, quotas and replicas, all of which can silently drift. A scheduled game day or chaos experiment is the only way to know the plan works.'},

/* 11–20: Security & Threat Modeling */
{q:'What is the OAuth 2.0 authorization code flow designed to avoid?',
 o:['Token expiry','Exposing the access token to the browser or front-channel, by exchanging an authorization code on the back channel','Encrypting traffic','Refresh token rotation'],a:1,
 e:'The client receives a short-lived code, then exchanges it for a token directly with the authorization server. This keeps the token out of browser history, logs and the URL bar.'},

{q:'What does PKCE (Proof Key for Code Exchange) add to the authorization code flow?',
 o:['Longer tokens','A code challenge and verifier pair that prevents an intercepted authorization code from being exchanged by an attacker','Encryption of the payload','Automatic token rotation'],a:1,
 e:'PKCE is required for public clients such as mobile and single-page apps, where a client secret cannot be kept confidential. It makes code interception useless without the verifier.'},

{q:'Why is mutual TLS used for service-to-service communication?',
 o:['It compresses traffic','Both sides present certificates, so each service can cryptographically verify the identity of the other','It replaces authentication','It removes the need for authorization'],a:1,
 e:'mTLS establishes strong workload identity independent of network location. Combined with per-request authorization, it is the basis of zero trust between services.'},

{q:'What is the core principle of zero trust networking?',
 o:['Trust everything inside the corporate network','Never trust implicitly based on network location; authenticate and authorize every request and encrypt all traffic','Use only VPNs','Disable all internal firewalls'],a:1,
 e:'Zero trust assumes the internal network can be compromised. Identity, least privilege, mTLS and per-request authorization replace the old castle-and-moat perimeter model.'},

{q:'Why should secrets be rotated?',
 o:['To satisfy auditors','A leaked secret is useful only until rotation, so regular rotation bounds the window of exposure and forces good custody practices','To slow down applications','To reduce storage'],a:1,
 e:'Automated rotation with short-lived credentials from a secret manager is the standard. Static long-lived secrets are the single biggest credential risk in most organizations.'},

{q:'What does a Web Application Firewall (WAF) primarily protect against?',
 o:['DDoS at the network layer','Known web attack patterns such as SQL injection, XSS and bot traffic, plus custom rules for application-specific abuse','Insider threats','Physical attacks'],a:1,
 e:'A WAF is one layer of defense, not a substitute for secure code. It buys time and blocks commodity attacks, but determined adversaries adapt, so application-level validation remains essential.'},

{q:'What distinguishes a volumetric DDoS attack?',
 o:['It targets application logic','It floods the network with traffic to exhaust bandwidth and saturate links before requests even reach the application','It uses stolen credentials','It exploits a code vulnerability'],a:1,
 e:'Volumetric attacks are absorbed by upstream scrubbing, anycast dispersion and CDN capacity. Application-layer attacks (Layer 7) need different defenses such as rate limiting and behavioral analysis.'},

{q:'What is an SBOM (Software Bill of Materials)?',
 o:['A license file','A machine-readable inventory of the components, libraries and versions in a software artifact, used for supply chain security and vulnerability response','A backup of the source code','A deployment manifest'],a:1,
 e:'An SBOM lets you answer "are we affected by CVE-X" in seconds instead of days. It is increasingly required by customers and regulators, and tools such as Syft and Trivy can generate it.'},

{q:'What does the STRIDE threat model cover?',
 o:['Only injection and XSS','Spoofing, Tampering, Repudiation, Information disclosure, Denial of service and Elevation of privilege','Only authentication failures','Only encryption weaknesses'],a:1,
 e:'STRIDE is a structured checklist for thinking about threats per component. It is used early in design to spot missing controls before code is written.'},

{q:'What does the principle of least privilege mean for IAM?',
 o:['Every service gets admin to avoid permission issues','Each identity is granted only the specific permissions needed for its function, with scope as narrow as possible','Only humans get permissions','Permissions are granted per request'],a:1,
 e:'Least privilege limits blast radius. It is enforced with scoped roles, resource-level conditions, and short-lived credentials, and it needs periodic review as services evolve.'},

/* 21–30: Observability & SRE */
{q:'What is an SLI?',
 o:['A deployment strategy','A Service Level Indicator: a measured metric such as success rate or latency that represents service quality','A service catalog entry','A security control'],a:1,
 e:'SLIs are the raw measurements. An SLO is a target on an SLI, and an SLA is an external commercial commitment. Keeping them separate makes reliability decisions objective.'},

{q:'Why is a burn-rate alert better than a simple threshold alert on an SLO?',
 o:['It fires more often','It fires when the error budget is being consumed faster than sustainable, which catches problems before the SLO is breached','It requires no metrics','It only works for latency'],a:1,
 e:'A burn rate of 14x means the entire 30-day budget would be consumed in about two days. Alerting on burn rates catches both fast and slow burns without paging on every small blip.'},

{q:'Why is high cardinality a problem in a metrics system?',
 o:['It compresses badly','Each unique combination of label values creates a new time series, exploding storage and query cost, and can take down the metrics backend','It breaks encryption','It slows down the application'],a:1,
 e:'Putting user ids or request ids in metric labels is the classic cardinality bomb. High-cardinality data belongs in logs or traces, not in time series.'},

{q:'What is tail-based sampling in distributed tracing?',
 o:['Sampling requests at the start','Buffering complete traces and deciding whether to keep them based on outcome, such as keeping all errors and slow requests','Sampling every nth trace','Sampling only the first span'],a:1,
 e:'Head-based sampling is cheap but misses rare errors. Tail-based sampling is more expensive but keeps precisely the traces you need for debugging, which is why it is popular in production.'},

{q:'Why are structured logs preferred over free-text logs at scale?',
 o:['They are shorter','They are machine parsable, so you can filter and aggregate by fields such as tenant, status or trace id without fragile regex','They compress better','They encrypt automatically'],a:1,
 e:'Structured JSON logs make queries trivial and dashboards reliable. They also pair naturally with a correlation id so a request can be reconstructed across services.'},

{q:'What does a log aggregation pipeline typically do?',
 o:['Encrypts logs','Collects logs from many hosts, ships them to a central store, indexes them, and makes them queryable with retention policies','Replaces metrics','Backs up the database'],a:1,
 e:'The pipeline is usually a local agent plus a central ingest and search tier. Cost control comes from sampling, dropping noisy logs, and short retention for debug-level data.'},

{q:'Which four signals are commonly called the golden signals?',
 o:['CPU, memory, disk and network','Latency, traffic, errors and saturation','Logs, metrics, traces and events','Requests, retries, timeouts and failures'],a:1,
 e:'The golden signals are the minimum dashboard for any service. They tell you whether users are affected and where the pressure is, without needing service-specific metrics.'},

{q:'Why should dashboards and alerts focus on symptoms rather than causes?',
 o:['Causes are too hard to measure','Symptoms reflect what users experience, so they remain valid even when the underlying architecture changes and they avoid paging on harmless internal noise','Symptoms are cheaper','Causes cannot be logged'],a:1,
 e:'An alert on CPU above 80% fires often without user impact, while an alert on error rate or latency SLO breach fires only when it matters. Causes belong in the drill-down, not the pager.'},

{q:'What causes alert fatigue?',
 o:['Too few alerts','Too many low-signal alerts train responders to ignore the pager, so the real incident is missed','Slow dashboards','Encrypted logs'],a:1,
 e:'The fix is to alert only on actionable, user-impacting symptoms, tune thresholds, delete noisy alerts, and route non-urgent items to a ticket queue instead of the pager.'},

{q:'What is the primary purpose of an SLO in engineering practice?',
 o:['To satisfy customers','To express reliability as a measurable target so teams can make explicit trade-offs between feature velocity and stability','To reduce infrastructure cost','To replace monitoring'],a:1,
 e:'An SLO with an error budget turns reliability into a shared, quantified decision. It also gives you a defensible answer to "should we ship this risky change today".'},

/* 31–40: Deployment & Operations */
{q:'What is blue/green deployment?',
 o:['A/B testing two user groups','Maintaining two identical environments, deploying to the idle one and switching traffic when it is verified, allowing instant rollback','Deploying to half the servers','Running two databases'],a:1,
 e:'Blue/green gives near-zero-downtime deploys and instant rollback by flipping traffic. The cost is double infrastructure and the need to handle schema changes that must be compatible with both versions.'},

{q:'What is a canary deployment?',
 o:['A full rollout to all users','Routing a small percentage of traffic to the new version first, watching metrics, then gradually increasing exposure','A rollback strategy','A database migration'],a:1,
 e:'Canaries limit blast radius but expose real users, so they require strong observability and automated rollback on SLO breach. They are the default in many mature continuous-delivery setups.'},

{q:'What is the key difference between a feature flag and a deployment?',
 o:['They are the same','A deployment ships code to production; a feature flag controls whether that code is active, letting you deploy dormant code and enable it separately','Feature flags require a restart','Deployment is for databases'],a:1,
 e:'Separating deploy from release decouples risk: code can be in production for days before users see it, and a bad feature can be turned off without a redeploy.'},

{q:'What is an expand-contract (parallel change) schema migration?',
 o:['A full table rewrite','A multi-step process: add the new schema alongside the old, write to both, backfill, switch reads, then remove the old schema, allowing zero-downtime rollout','A backup strategy','A sharding scheme'],a:1,
 e:'Each step is backward compatible with the versions running at that moment. Skipping a step is how a rolling deploy causes production errors and lost writes.'},

{q:'What is a data backfill?',
 o:['Restoring from backup','Populating a new field, table or index with historical data so it matches the current state before readers start using it','Deleting old rows','Replicating across regions'],a:1,
 e:'Backfills must be rate-limited to avoid overwhelming the database, and they must be idempotent so they can be resumed after a failure. They are usually run as a background job before the read switch.'},

{q:'What is the hardest part of a rolling deployment for a stateful service?',
 o:['Choosing the instance type','Ensuring data and schema compatibility between old and new versions running simultaneously, and respecting single-writer constraints such as leader election','Writing the config','Encrypting traffic'],a:1,
 e:'Stateless services roll freely. Stateful services need expand-contract schema changes, careful data migration, and awareness that two versions may serve traffic at once.'},

{q:'What makes rollback genuinely hard?',
 o:['Redeploying the old image','Schema changes, side effects on external systems, and data written by the new version that the old version cannot interpret','Adding a load balancer','Adding monitoring'],a:1,
 e:'Rollback is easy only if the change is backward compatible. This is why feature flags, expand-contract migrations and idempotent side effects are prerequisites for confident rollback.'},

{q:'What is the main benefit of configuration as code?',
 o:['It is faster','Configuration lives in version control, so changes are reviewable, auditable and reproducible, and drift is detectable','It encrypts configs','It removes the need for environments'],a:1,
 e:'Configuration in a wiki or on servers drifts and becomes undocumented. Keeping it in Git makes the desired state explicit and lets tools reconcile the actual state.'},

{q:'What does infrastructure as code provide that manual provisioning does not?',
 o:['Lower cost','Reproducibility, reviewability and versioning of infrastructure, so environments can be recreated exactly and changes are traceable','Faster networking','Encryption at rest'],a:1,
 e:'Terraform, Pulumi and CloudFormation turn infrastructure into a reviewable artifact. The biggest win is being able to stand up an identical disaster recovery environment without relying on memory.'},

{q:'What is GitOps?',
 o:['Using Git for application code only','Using Git as the single source of truth for both application and infrastructure state, with an in-cluster agent continuously reconciling the live state to the declared state','A branch protection policy','A CI tool'],a:1,
 e:'Argo CD and Flux watch the repository and apply changes. Benefits include an auditable history, drift detection, and rollback by reverting a commit.'},

/* 41–50: Data pipelines & architecture */
{q:'What are the three layers of the lambda architecture?',
 o:['Ingest, transform, serve','Batch layer for accuracy, speed layer for low latency, and a serving layer that merges both views','Bronze, silver, gold','Raw, staged, curated'],a:1,
 e:'Lambda solves accuracy plus latency by running two pipelines. The cost is maintaining two code paths and reconciling results, which is why many teams prefer kappa once streaming is mature.'},

{q:'What is the kappa architecture?',
 o:['Two pipelines, batch and stream','A single streaming pipeline, where reprocessing is done by replaying the event log rather than maintaining a separate batch layer','A data warehouse pattern','A caching architecture'],a:1,
 e:'Kappa relies on the log being durable and replayable. It simplifies operations, at the cost of requiring streaming infrastructure that can handle large historical replays.'},

{q:'What is the main difference between a data lake and a data warehouse?',
 o:['They are the same','A lake stores raw data in its native format with schema on read, while a warehouse stores structured, modelled data with schema on write optimized for query','A lake is transactional','A warehouse stores only JSON'],a:1,
 e:'Lakes are flexible and cheap but can become data swamps without governance. Warehouses are disciplined and fast for analytics but require upfront modelling.'},

{q:'What does CDC (change data capture) avoid that polling does not?',
 o:['Encryption','Repeatedly querying source tables for changes, which adds load and often misses deletes or intermediate states','Schema changes','Backups'],a:1,
 e:'CDC reads the transaction log and emits each committed change in order, including deletes. It is lower load and more complete, at the cost of coupling to the log format and requiring elevated database permissions.'},

{q:'Why is exactly-once hard to guarantee end-to-end in a data pipeline?',
 o:['Brokers cannot do it','The processing engine can make its own state and offsets atomic, but the sink must also be idempotent or transactional for the effect to be exactly once','It is not hard','Exactly-once is impossible in any system'],a:1,
 e:'A database write or a call to a third party needs an idempotency key or a transactional connector. Many teams settle for at-least-once plus deduplication at the sink.'},

{q:'When is batch processing a better choice than streaming?',
 o:['Never','When reprocessing large historical datasets, when results are needed periodically rather than in real time, or when cost and simplicity matter more than latency','When data must be fresh','When events are small'],a:1,
 e:'Batch is cheaper per record and simpler to operate. Streaming is justified when the business value of low latency outweighs the added complexity.'},

{q:'What are data quality checks in a pipeline?',
 o:['Backups','Validation rules such as null checks, range checks, referential integrity and volume anomalies, applied to data as it flows so bad data is caught early','Encryption checks','Access control reviews'],a:1,
 e:'Checks typically run between pipeline stages and can quarantine bad records rather than failing the whole job. Alerting on data anomalies is as important as alerting on infrastructure.'},

{q:'What is a lakehouse?',
 o:['A physical datacenter','An architecture that combines cheap object storage with warehouse-like ACID transactions, schema enforcement and query capabilities, often via an open table format','A backup strategy','A cache tier'],a:1,
 e:'Table formats such as Iceberg, Delta Lake and Hudi add transactions, time travel and schema evolution on top of object storage, blurring the lake and warehouse distinction.'},

{q:'What does a typical real-time analytics stack look like?',
 o:['A relational database only','Ingest via a log such as Kafka, process with a stream engine such as Flink, store in an OLAP store such as ClickHouse or Druid, and serve dashboards','A data warehouse only','A cache only'],a:1,
 e:'Each layer has a distinct job: durable ingest, stateful processing, fast columnar queries, and low-latency visualization. The OLAP store is where pre-aggregation and indexing usually pay off.'},

{q:'Why do teams keep a raw, immutable event log alongside derived tables?',
 o:['To save money','So that derived tables can be rebuilt by replaying the log when logic changes, a bug is fixed, or a new feature needs historical data','To satisfy auditors only','To reduce storage'],a:1,
 e:'Keeping the raw log turns data modeling into a reversible operation. It is the same reasoning behind event sourcing: the log is the source of truth, and the derived state is disposable.'},

/* 51–60: Classic System Designs (new problems) */
{q:'Why is a URL shortener dominated by reads rather than writes?',
 o:['It is not','Every redirect is a read, while a short code is written only once, so read throughput dwarfs write throughput and caching is the main optimization','Writes are more common','Reads must be consistent'],a:1,
 e:'The scale math follows from the ratio: a service handling billions of redirects per day needs a read-optimized cache tier, while writes are comparatively rare and can tolerate more latency.'},

{q:'What data structure is the natural fit for a leaderboard?',
 o:['A relational table with ORDER BY','A sorted set such as the Redis ZSET, which gives O(log N) insert and rank queries, or an indexed score column in a database','A stack','A Bloom filter'],a:1,
 e:'A sorted set gives both leaderboard order and per-user rank in logarithmic time. For very large boards, shard by range and merge, or use a purpose-built ranking service.'},

{q:'What does a well-designed notification service need beyond a simple queue?',
 o:['Nothing','Per-channel queues, deduplication, per-provider rate limiting, retries with backoff, delivery tracking and user preferences','A relational database only','A cache only'],a:1,
 e:'Notifications are a reliability problem disguised as a feature. Each provider has its own limits, failures and receipts, and each user has preferences and quiet hours that must be enforced.'},

{q:'Why does a web crawler need politeness controls?',
 o:['To slow itself down','To respect robots.txt and per-host rate limits so it does not overwhelm target servers, and to avoid crawler traps that waste capacity','To save storage','To improve SEO'],a:1,
 e:'Politeness is enforced by a per-host frontier with delays and concurrency caps. Trap detection (infinite calendars, session ids) prevents the crawler from spending its budget on useless pages.'},

{q:'What is the core syncing challenge in a file-sync product like Dropbox?',
 o:['Encrypting files','Efficiently propagating changes to all devices and resolving conflicts when two devices edit the same file concurrently','Storing file names','Billing users'],a:1,
 e:'The design centers on a change log per user, content-addressed chunks for deduplication, and a conflict-resolution policy (often keeping both versions). Bandwidth efficiency depends on chunking and delta sync.'},

{q:'What makes real-time collaborative editing genuinely hard?',
 o:['Storing the document','Merging concurrent edits without losing intent, which requires Operational Transformation or CRDTs plus a coordination layer','Encrypting the document','Choosing a database'],a:1,
 e:'Two users editing the same paragraph produce operations that must be transformed or merged. OT uses a central server for ordering; CRDTs merge without one, at the cost of larger metadata.'},

{q:'What is the fundamental concurrency problem in ticket booking?',
 o:['Encrypting seat numbers','Preventing two users from reserving the same seat, which requires locking, optimistic concurrency with version checks, or a single-writer queue per seat','Choosing a database','Designing the UI'],a:1,
 e:'The seat is a scarce resource with a short-lived hold. The design usually combines a reservation with a TTL, a conditional update, and a compensating release on timeout.'},

{q:'What does a payment system require that a typical CRUD service does not?',
 o:['A web UI','Exactly-once effects, strong consistency on balances, idempotency keys for retries, and an auditable ledger','A cache','A mobile app'],a:1,
 e:'Duplicated or lost money is unacceptable, so payments trade throughput and latency for correctness. Reconciliation against the provider is a permanent, not a temporary, part of the system.'},

{q:'What data structure typically powers search autocomplete?',
 o:['A relational table','A trie or prefix index with popularity ranking, usually served from memory or a specialized store for very low latency','A graph database','A Bloom filter'],a:1,
 e:'Autocomplete needs prefix lookup plus ranking in a few milliseconds. The index is rebuilt offline from query logs and served from a low-latency store with aggressive caching.'},

{q:'What does an ETA computation service need beyond a map graph?',
 o:['Only a database','Live and historical traffic data, a routing engine over the graph, and a model that combines segment speeds with current conditions','Only a cache','Only user location'],a:1,
 e:'ETA is a prediction problem on top of a routing problem. The routing engine finds candidate paths; the model estimates travel time per segment; the result is refreshed continuously as conditions change.'},

/* 61–70: Concurrency & Coordination */
{q:'When is optimistic locking preferable to pessimistic locking?',
 o:['When contention is high','When contention is low, conflicts are rare, and retries are cheap, so avoiding locks improves throughput','When the operation is expensive','When data must never conflict'],a:1,
 e:'Optimistic locking reads a version, then updates only if the version still matches. It fails fast under contention, so it shines for low-conflict updates and struggles when many writers touch the same row.'},

{q:'When is pessimistic locking the safer choice?',
 o:['When contention is high or the operation is expensive to retry, so holding a lock avoids repeated failed attempts','When there is no contention','When the data is read-only','When using a cache'],a:0,
 e:'Pessimistic locking serializes access and can reduce overall throughput, but it avoids wasted work and complex retry logic for expensive operations such as payment authorization.'},

{q:'What is an idempotency key?',
 o:['A password','A client-generated unique identifier sent with a request so the server can detect and safely ignore duplicates','A cache key','A shard key'],a:1,
 e:'The server stores the key with the original result. A retry with the same key returns the stored result instead of repeating the side effect, which is the standard approach for payment and order APIs.'},

{q:'What does the Try-Confirm-Cancel (TCC) pattern do in a distributed transaction?',
 o:['Runs the transaction twice','Reserves resources in the Try phase, then either confirms them all or cancels them, giving a two-phase-like flow at the application level','Replaces the database','Encrypts the request'],a:1,
 e:'TCC is a saga variant where each participant exposes try, confirm and cancel operations. It requires careful design of reservations and timeouts, but it avoids holding database locks across services.'},

{q:'How does optimistic concurrency control detect a lost update?',
 o:['By locking the row','By comparing a version number or ETag and rejecting the write if the stored version has changed','By retrying blindly','By using a database index'],a:1,
 e:'The client sends the version it read. If the version has moved on, the update is rejected and the client re-reads and retries. It is the standard pattern for REST APIs and document stores.'},

{q:'What is the read-modify-write race?',
 o:['A caching problem','Two clients read the same value, both modify it, and one update silently overwrites the other','A database configuration','A network failure'],a:1,
 e:'The fix is a conditional update based on a version, an atomic database operation such as increment, or a distributed lock when the logic cannot be expressed atomically.'},

{q:'How do you prevent double-spending in a wallet or ledger?',
 o:['By trusting the client','By making the balance check and debit atomic with a conditional update or row lock, and by using idempotency keys to deduplicate retries','By caching the balance','By increasing timeouts'],a:1,
 e:'A common design is an append-only ledger with a constraint that the sum cannot go negative, so the invariant is enforced by the database rather than by application code.'},

{q:'What does leader election guarantee in a distributed system?',
 o:['Every node can write','Only one node acts as leader at a time, preventing conflicting writes and enabling ordered processing','All nodes write simultaneously','No node can fail'],a:1,
 e:'Leader election uses a quorum-based protocol such as Raft or a lease in a coordination service. It is the foundation of consistent writes in systems from databases to schedulers.'},

{q:'Why does a lease need a timeout?',
 o:['To save electricity','So a crashed or paused holder does not keep the lock forever, which would permanently block progress','To reduce latency','To compress data'],a:1,
 e:'A lease with a timeout lets another process take over. Combined with a fencing token, the resource can reject writes from a holder whose lease has already expired.'},

{q:'What does saga orchestration provide over choreography?',
 o:['Lower latency','A central coordinator that drives each step, tracks state, and triggers compensations on failure, giving clearer visibility into complex flows','Fewer services','No need for compensation'],a:1,
 e:'Orchestration is easier to reason about and to observe, at the cost of an extra component and a potential coupling point. Choreography is simpler for short flows but harder to debug as steps grow.'},

/* 71–80: Cloud & Infrastructure */
{q:'What causes serverless cold start latency?',
 o:['Network latency','A new execution environment must be provisioned, its runtime loaded, and the code initialized before the request can be served','Storage latency','DNS resolution'],a:1,
 e:'Cold starts are worst for large bundles and heavy frameworks. Mitigations include smaller packages, provisioned concurrency, keeping functions warm, and moving cold-path work to background tasks.'},

{q:'What does a container orchestrator such as Kubernetes provide?',
 o:['Only container packaging','Scheduling, restarts on failure, scaling, service discovery, and rolling deployments of containerized workloads','Only image storage','Only networking'],a:1,
 e:'The orchestrator maintains the declared desired state, which is what makes fleets of containers operable. It does not replace the container format, the registry, or the application design.'},

{q:'What is a VPC?',
 o:['A physical datacenter','A logically isolated virtual network in the cloud with subnets, route tables, gateways, security groups and network ACLs','A virtual machine type','A container registry'],a:1,
 e:'A VPC is the fundamental network boundary in AWS and similar clouds. Subnet design, route tables and security groups are the main levers for both security and availability.'},

{q:'What is multi-tenancy, and why is it hard?',
 o:['Serving one customer per instance','Serving multiple customers from shared infrastructure with isolation of data, performance and permissions, while preventing noisy neighbors and cross-tenant access','Running multiple regions','Using multiple clouds'],a:1,
 e:'The design decision is where to draw the isolation boundary: shared everything with row-level tenant ids, shared schema with separate tables, or a database per tenant. Cost and blast radius trade off directly.'},

{q:'When is a managed service worth the premium over self-hosting?',
 o:['Never','When it removes operational toil for a non-differentiating capability, offers features that are hard to replicate, and the team lacks the depth to run it well','Always','Only for small teams'],a:1,
 e:'The calculus changes with scale. At small scale managed is almost always cheaper; at very large scale self-hosting can win on cost and control, but only with real platform expertise.'},

{q:'What does an autoscaler need in order to work well?',
 o:['Only a CPU metric','A load signal correlated with demand, a warm-up period, a cooldown to avoid thrashing, and a load balancer that can spread new instances','Only a large instance','Only spot instances'],a:1,
 e:'Autoscaling without a good signal oscillates. For request-driven services, concurrency or requests per second is often a better signal than CPU; for queue workers, queue depth is the right one.'},

{q:'What is the main risk of using spot or preemptible instances?',
 o:['They are slower','They can be reclaimed with little notice, so workloads need graceful shutdown, checkpointing and fallback capacity','They cost more','They cannot run containers'],a:1,
 e:'Spot is excellent for stateless or checkpointed batch work. It is risky for stateful services unless the workload can drain quickly and reschedule elsewhere without data loss.'},

{q:'What is the main difference between object storage and block storage?',
 o:['There is none','Object storage is durable, cheap and accessed over HTTP with higher latency; block storage is low-latency and attached to a single VM','Block storage is cheaper','Object storage cannot be backed up'],a:1,
 e:'The access pattern dictates the choice: databases need block devices, while media, backups and data lakes use object storage. Mixing them up produces either terrible performance or terrible cost.'},

{q:'What are the biggest levers for cloud cost optimization?',
 o:['Picking a different cloud','Right-sizing instances, using reserved or spot capacity for stable or interruptible workloads, and deleting idle resources and unused storage','Adding more monitoring','Adding more regions'],a:1,
 e:'Most cloud bills are dominated by a few workloads. Tagging by owner and team, then reviewing regularly, is usually the highest-leverage action before any architecture change.'},

{q:'How do you mitigate serverless cold starts?',
 o:['Use more regions','Shrink the deployment bundle, choose a runtime with fast startup, use provisioned concurrency for latency-critical paths, and keep functions warm','Increase memory','Add a cache'],a:1,
 e:'The right mitigation depends on the path: user-facing APIs justify provisioned concurrency, while background jobs can tolerate cold starts. Measure before optimizing.'},

/* 81–90: Reliability Engineering */
{q:'What is chaos engineering?',
 o:['Randomly deleting data','Deliberately injecting controlled failures to validate that resilience mechanisms and runbooks actually work','Replacing testing','Reducing cost'],a:1,
 e:'Experiments are hypotheses about failure behavior, run with a defined blast radius and abort conditions. Untested failover is usually broken, and chaos finds the gaps before users do.'},

{q:'What is a game day?',
 o:['A release celebration','A planned exercise where a team simulates an incident and practices detection, response, communication and recovery','A load test','A code review'],a:1,
 e:'Game days test people and process, not just systems. They reveal missing runbooks, unclear ownership and communication gaps that no amount of monitoring can fix.'},

{q:'What makes a postmortem blameless?',
 o:['Omitting names','Focusing on systemic causes and preventive actions rather than individuals, so people report honestly and the fixes address root causes','Avoiding documentation','Excluding management'],a:1,
 e:'Blameless postmortems produce better information and better fixes. The output should be concrete action items with owners and deadlines, not just a narrative of what happened.'},

{q:'Why is dependency management a reliability concern at scale?',
 o:['Dependencies add license cost','Every dependency adds latency, a failure mode and a version coupling, so a deep chain of dependencies multiplies overall unreliability','Dependencies are slower','Dependencies cannot be monitored'],a:1,
 e:'The practical implication is to reduce chain depth, add timeouts and circuit breakers at every hop, and treat third-party APIs as potential failures with defined fallbacks.'},

{q:'What is a retry budget?',
 o:['The money spent on retries','A cap on total retries across the system, so retries cannot multiply load indefinitely during an incident','The number of retry libraries','The timeout for a retry'],a:1,
 e:'A retry budget forces teams to think about retries as load, not just as resilience. It pairs with jittered exponential backoff and a circuit breaker to keep recovery traffic bounded.'},

{q:'What does capacity planning require beyond current traffic?',
 o:['Only CPU usage','Peak QPS, payload sizes, growth forecasts, failover headroom and per-instance capacity validated by load tests','Only disk space','Only network bandwidth'],a:1,
 e:'Headroom is the key word: a cluster must survive losing a node or an entire region while still meeting the SLO, which means designing for peak plus failure, not peak alone.'},

{q:'What is a load test designed to reveal?',
 o:['Code style issues','How the system behaves under realistic traffic at scale, including throughput limits, latency percentiles and where it breaks first','Database schema issues','Encryption weaknesses'],a:1,
 e:'Load tests are most useful when the traffic mix resembles production, including hot keys and expensive endpoints. A flat uniform test will happily hide the real bottleneck.'},

{q:'What is a soak test?',
 o:['A short burst of traffic','Running sustained load over hours or days to find memory leaks, connection leaks, disk growth and gradual degradation','A failover test','A security scan'],a:1,
 e:'Many production incidents appear only after hours of running, not at peak load. Soak testing is the tool that catches them before users do.'},

{q:'What is failure injection in production-like environments?',
 o:['A code review technique','Deliberately breaking a component such as a network link, a dependency or a disk to observe how the system and responders react','A backup restore','A database migration'],a:1,
 e:'Failure injection validates that timeouts, retries, circuit breakers and runbooks work as intended. Starting in staging with a small blast radius is the safe path.'},

{q:'What is the difference between load testing and stress testing?',
 o:['They are the same','Load testing validates behavior at expected levels; stress testing pushes beyond expected limits to find the breaking point and observe failure mode','Stress testing uses no data','Load testing only tests databases'],a:1,
 e:'Both are necessary. Load testing confirms the system meets the SLO; stress testing tells you what happens when it does not, and whether it fails gracefully or catastrophically.'},

/* 91–100: Cost & Trade-offs */
{q:'When is it better to build rather than buy a capability?',
 o:['Always build','Build when the capability is a core differentiator and existing products do not fit; buy when it is commodity and the team has no special advantage','Always buy','Only for small teams'],a:1,
 e:'The default should be to buy commodity capabilities and build only where you have a real edge. Building an identity system or a message broker rarely pays off unless it is central to the product.'},

{q:'When is a monolith a better choice than microservices?',
 o:['Never','When the team is small, the domain is poorly understood, or deployment autonomy is not the actual bottleneck','Only for legacy systems','Only for internal tools'],a:1,
 e:'A modular monolith is often the fastest path to product-market fit and can be split later when the domain and the pressure are clear. Premature decomposition produces distributed monoliths.'},

{q:'How does multi-tenancy affect cost and isolation?',
 o:['Multi-tenancy reduces cost but raises isolation and noisy-neighbor concerns, so the design must trade blast radius against efficiency','It has no effect','It always increases cost','It removes the need for security'],a:0,
 e:'The right level of tenancy depends on the product: sharing everything lowers cost and raises the impact of any bug or spike, while isolation costs more but bounds blast radius.'},

{q:'What is the practical cost of strong consistency?',
 o:['Higher storage cost','Coordination latency and reduced availability during partitions, because writes must reach a quorum before acknowledging','Lower throughput only','No cost'],a:1,
 e:'Strong consistency is not free. Choosing it per feature rather than globally lets you keep it where it matters and use cheaper eventual consistency elsewhere.'},

{q:'What is the cost of observability?',
 o:['Only storage cost','Ingestion, storage, query and engineering effort for metrics, logs and traces, which grows with cardinality, retention and sample rate','Zero, since it is open source','Only compute cost'],a:1,
 e:'Observability is a budget, not a free good. Sampling, retention policies, cardinality discipline and log levels are the main levers for keeping it both useful and affordable.'},

{q:'What is over-engineering in a system design context?',
 o:['Writing too few tests','Adding complexity such as extra services, layers or abstractions that current requirements do not justify, which increases failure modes and operational cost','Using open source','Writing documentation'],a:1,
 e:'Every component is a liability as well as an asset. The simplest design that meets the stated requirements is usually the best, and unnecessary complexity is hard to remove later.'},

{q:'What does YAGNI mean for system design?',
 o:['You Are Going to Need It','You Are Not Going to Need It: build for current needs rather than speculative future requirements','Yet Another Generic Interface','Your Architecture Needs Improvement'],a:1,
 e:'YAGNI is a guardrail against premature sharding, premature microservices and speculative multi-region. When the requirement does arrive, the redesign is informed by real usage instead of guesses.'},

{q:'What is technical debt in an architecture sense?',
 o:['A financial liability','Short-term design or implementation choices that slow future work and raise risk if they are not paid down','A type of loan','A cloud billing term'],a:1,
 e:'Debt is not inherently bad: shipping a simpler design to learn faster can be the right call. The danger is taking on debt silently and letting it compound without a repayment plan.'},

{q:'What does "design for failure" mean in practice?',
 o:['Expect components to fail, and build timeouts, retries, circuit breakers, redundancy and graceful degradation so the system continues to serve users','Build a system that never fails','Disable error logging','Remove all retries'],a:0,
 e:'Everything fails eventually: disks, networks, processes, dependencies. Designing for failure means the system is expected to be partially broken at all times and still meets its SLO.'},

{q:'What is the single most important question to ask before adding a component to a design?',
 o:['Which vendor makes it','What problem it solves that the current design cannot, and what new failure modes and operational cost it introduces','How new it is','How popular it is'],a:1,
 e:'Every component adds a failure domain, a deployment surface and an on-call burden. The best designs are the simplest ones that meet the stated requirements, which is why requirement clarification comes first.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>System Design Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
