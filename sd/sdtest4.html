<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Mock Test — Set 4 · 100 MCQs</title>
<meta name="description" content="100 advanced System Design MCQs: search ranking, social feeds, geospatial, ad tech, time-series, log aggregation, HDFS and object storage, video delivery, identity, multi-tenant SaaS and e-commerce.">
<style>
  :root{--brand:#7c3aed;--brand-dark:#4c1d95;--accent:#a78bfa;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#2e1065;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ede9fe;border-color:#ddd6fe}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(124,58,237,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#faf5ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ede9fe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🏛️ System Design Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Search & relevance */
{q:'What does TF-IDF measure?',
 o:['The number of times a term appears in a document','The total size of the corpus','How important a term is to a document within a corpus, combining term frequency and inverse document frequency','The number of documents per shard'],a:2,
 e:'TF-IDF weights a term by how often it appears in a document and penalizes terms that appear in many documents, so rare but meaningful terms score higher. BM25 improves on it with length normalization and saturation.'},

{q:'What is BM25?',
 o:['A distributed key-value store','A ranking function that improves on TF-IDF by normalizing for document length and term saturation','A cache eviction policy','A message broker'],a:1,
 e:'BM25 is the default ranking function in Elasticsearch and Lucene. It adds length normalization and a saturation curve for term frequency, which behaves better than raw TF-IDF on real documents.'},

{q:'In Elasticsearch, what is a shard?',
 o:['A Lucene index that holds a subset of the documents and enables horizontal scaling of search','A replica of the entire cluster','A query planner component','A cache tier in front of the index'],a:0,
 e:'A shard is the unit of parallelism and storage. The number of primary shards is fixed at index creation, so it must be chosen with expected data growth in mind.'},

{q:'What is the main trade-off of increasing the number of primary shards in Elasticsearch?',
 o:['No trade-off; more is always better','Lower storage cost','Fewer cluster states to manage','More parallelism and throughput per node, but more per-shard overhead and harder cluster management'],a:3,
 e:'Each shard has fixed overhead in memory, file handles and cluster state. Over-sharding is a common production mistake, and shard count cannot be changed after index creation without reindexing.'},

{q:'What does a replica shard in Elasticsearch provide?',
 o:['Write scaling','Encryption at rest','Read scaling and fault tolerance','Schema validation'],a:2,
 e:'Replicas serve reads and take over if the primary fails. They increase storage and indexing cost, but they are the main lever for read throughput and availability.'},

{q:'What is the difference between filter and query context in Elasticsearch?',
 o:['They are identical','Filters are cacheable and do not score, while queries compute relevance scores','Filters score and queries do not','Filters only work on numeric fields'],a:1,
 e:'Filters answer yes-or-no questions and can be cached by Lucene, so they are cheaper. Use filter context for structured constraints such as status or date range, and query context only when relevance matters.'},

{q:'What problem does deep pagination cause in a search system?',
 o:['Each shard must gather and sort from the start, so cost grows with page depth; search_after or scroll avoid it','It breaks the inverted index','It disables replicas','It causes schema conflicts'],a:0,
 e:'From and size pagination in Elasticsearch requires each shard to collect and sort all preceding hits. search_after uses a sort cursor and is the standard fix for deep paging.'},

{q:'What is a percolator used for in Elasticsearch?',
 o:['Sharding documents','Schema migration','Encrypting fields','Storing queries so incoming documents can be matched against them, useful for alerts and saved searches'],a:3,
 e:'The percolator indexes queries instead of documents. When a new document arrives, it is run against stored queries, which is the basis of saved-search and alerting features.'},

{q:'What is a common way to handle typos in search?',
 o:['Full table scans','Disabling search','Fuzzy matching or n-gram tokenization at index time','Increasing the shard count'],a:2,
 e:'Fuzzy queries use edit distance on terms, which is flexible but costly. N-gram tokenization at index time makes partial matches cheap to query, at the cost of a larger index.'},

{q:'Why is real-time indexing a challenge in search systems?',
 o:['Indexes update instantly','Index segments must be refreshed, and the near-real-time refresh interval trades indexing throughput against how quickly new documents become visible','Encryption adds latency','Query planning is slow'],a:1,
 e:'A refresh makes a new segment searchable but costs I/O. The default 1-second refresh is a compromise: shorter intervals improve freshness but reduce indexing throughput.'},

/* 11–20: Social feeds & graph */
{q:'What is the celebrity problem in feed generation?',
 o:['Fan-out on write becomes extremely expensive for users with millions of followers, so hybrid approaches are used','Celebrity accounts cannot post','Celebrities have no followers','Encryption is harder for celebrities'],a:0,
 e:'Writing one post into millions of feeds is impractical. The standard fix is fan-out on read for high-follower accounts, combined with fan-out on write for ordinary users.'},

{q:'What is a social graph used for in a feed system?',
 o:['Encryption','Sharding','Backups','Determining which posts a user should see based on follow relationships and ranking signals'],a:3,
 e:'The graph gives candidate posts from accounts the user follows. Ranking then reorders those candidates by affinity, recency and engagement to produce the final feed.'},

{q:'Why is fan-out on read sometimes preferred over fan-out on write?',
 o:['It uses no storage','It is simpler','It avoids write amplification for users with huge follower counts and handles inactive users cheaply','It is always faster for readers'],a:2,
 e:'With fan-out on read, the feed is assembled at request time from the posts of followed accounts. Writes are cheap and inactive users cost nothing, but reads are more expensive and need caching.'},

{q:'What is a hybrid feed approach?',
 o:['Only reads','Fan-out on write for most users and fan-out on read for celebrities or accounts with many followers','Only writes','No caching'],a:1,
 e:'Hybrid merges a precomputed timeline with a pull of celebrity posts at read time, then ranks. It gets most of the write efficiency and read latency of both approaches.'},

{q:'In a graph database, what does index-free adjacency mean?',
 o:['Each node stores direct pointers to its neighbors, making traversal cheap','No indexes exist at all','Encryption of edges','Sharding by node id'],a:0,
 e:'Index-free adjacency means a hop is a pointer dereference rather than an index lookup, which is why multi-hop traversal stays fast as the graph grows.'},

{q:'What is the main limitation of storing a social graph in a relational database?',
 o:['No SQL support','No transactions','No indexes','Multi-hop traversal becomes expensive because each hop needs a join'],a:3,
 e:'Relational databases can model the graph, but a query that traverses five hops becomes five joins, and performance degrades quickly with depth and graph size.'},

{q:'What is a typical consistency requirement for a timeline?',
 o:['Strong consistency for every read','Linearizability','Eventual consistency is often acceptable, with the user seeing their own posts immediately','No consistency guarantees'],a:2,
 e:'Timelines are read-heavy and tolerate small delays. Read-your-writes for the author is the common exception, handled by inserting the new post locally or routing that user to a fresh read.'},

{q:'What does ranking in a feed usually combine?',
 o:['Only recency','Recency, affinity, engagement signals and sometimes paid promotion','Only engagement','Only randomness'],a:1,
 e:'Ranking is a product decision encoded in a model. Keeping signals explicit and measurable matters more than the specific algorithm, because the ranking policy will change over time.'},

{q:'How do you handle deleting a post from millions of feeds?',
 o:['Use a tombstone or soft delete and filter at read time','Rewrite every feed','Ignore deletes','Rebuild the entire feed'],a:0,
 e:'Rewriting millions of feeds on delete is impractical. A tombstone or soft-delete flag, filtered at read time and cleaned up lazily, is the standard approach.'},

{q:'What is a fan-out queue used for?',
 o:['Encryption','Sharding','Backups','Distributing feed write tasks to workers that push posts into follower feeds asynchronously'],a:3,
 e:'The queue decouples the post write from the fan-out work, lets workers scale independently, and provides retries if a feed write fails for some followers.'},

/* 21–30: Geospatial */
{q:'What is a geohash?',
 o:['An encryption scheme','A shard key','A string encoding of a location that shares a prefix for nearby points, enabling proximity queries','A cache'],a:2,
 e:'Geohashes interleave latitude and longitude bits and encode them in base32. Nearby points usually share a prefix, so a range query on the prefix finds neighbors.'},

{q:'What is a quadtree?',
 o:['A 4-way hash','A tree where each node recursively subdivides space into 4 quadrants, used for spatial indexing','A queue','A cache'],a:1,
 e:'Quadtrees adapt to data density: dense regions subdivide more deeply, which keeps queries efficient in cities without wasting detail in sparse areas.'},

{q:'What is the main problem with geohash prefix length?',
 o:['Longer is always better','Shorter is always better','No problem','Shorter prefixes cover larger areas with less precision, and longer prefixes are more precise but generate more cells to scan'],a:3,
 e:'Choosing prefix length is a trade-off between false positives and query cost. A common pattern queries the target cell and its eight neighbors to handle boundary cases.'},

{q:'How does a ride-sharing system match nearby drivers to riders?',
 o:['Index drivers by geospatial cell, query the cells around the rider, then rank by distance and ETA','Scan all drivers on every request','Use a Bloom filter','Sort drivers by name'],a:0,
 e:'A geospatial index narrows the candidate set to a small number of drivers, and ranking then chooses the best by ETA, which is more accurate than straight-line distance.'},

{q:'What is the primary challenge in a real-time location tracking system?',
 o:['Encryption','Sharding','Ingesting high-frequency location updates and querying current positions with low latency at scale','Storing history only'],a:2,
 e:'Drivers and couriers emit updates every few seconds. The write rate and the need for fresh position data dominate the design, which usually means an in-memory or specialized geo store.'},

{q:'What does an R-tree index?',
 o:['Points only','Bounding boxes so spatial objects such as lines and polygons can be queried efficiently','Text','Graphs'],a:1,
 e:'R-trees generalize the idea of an index to rectangles, which is why they are used for polygon and route queries rather than only points.'},

{q:'What is the difference between distance-based and travel-time-based proximity?',
 o:['Distance uses straight-line or geodesic distance, while travel time accounts for road networks and traffic, which is more accurate for matching','They are identical','Distance is always better','Travel time only applies to airplanes'],a:0,
 e:'A driver two hundred meters away across a river may be far in travel time. For matching, travel time is the right metric, which requires a routing engine rather than a simple radius query.'},

{q:'What is spatial sharding?',
 o:['Encrypting space','Compressing geo data','Using a cache','Partitioning data by geographic region so queries in a region hit a single shard'],a:3,
 e:'Spatial sharding keeps nearby data together, which speeds up regional queries. The downside is that dense areas can create hot shards, so the shard key must balance geography and load.'},

{q:'What is the main risk of sharding by geohash prefix?',
 o:['No risk','Encryption','Dense regions such as cities create hot shards, so prefixes must be balanced with a secondary key','Sharding is not possible for geo data'],a:2,
 e:'A short prefix covering a city concentrates all traffic on one shard. Adding a second dimension such as driver id or a random suffix spreads the load.'},

{q:'What is a heatmap used for in geo analytics?',
 o:['Encryption','Visualizing the density of events across an area, often computed by binning coordinates into cells','Sharding','Backups'],a:1,
 e:'Heatmaps bin events into grid cells and color by count, which makes hotspots visible. The underlying aggregation is a standard group-by on a spatial cell key.'},

/* 31–40: Ad tech & RTB */
{q:'What is real-time bidding (RTB)?',
 o:['An auction where demand-side platforms bid on an ad impression in milliseconds before the page renders','A batch auction run once per day','A type of encryption','A sharding strategy'],a:0,
 e:'RTB is the programmatic auction behind most display advertising. Each impression triggers a bid request, and the winning ad must be returned fast enough that the page still renders.'},

{q:'What is the typical latency budget for a bid request in RTB?',
 o:['Several seconds','One hour','One day','Around 50-100 milliseconds end-to-end, because the ad must render before the page'],a:3,
 e:'The budget forces aggressive caching, precomputed models and strict timeouts. A bidder that is too slow is simply skipped, which is why latency is a revenue problem.'},

{q:'What is a demand-side platform (DSP)?',
 o:['A supply-side platform','A CDN','A company that buys ad inventory programmatically on behalf of advertisers','A cache tier'],a:2,
 e:'The DSP represents the advertiser and bids in auctions. The SSP represents the publisher and runs the auction, and the ad exchange connects the two.'},

{q:'What is a supply-side platform (SSP)?',
 o:['A demand-side platform','A company that sells ad inventory programmatically on behalf of publishers','A CDN','A cache tier'],a:1,
 e:'The SSP packages the publisher inventory, runs or connects to the auction, and manages yield optimization for the publisher.'},

{q:'What is a second-price auction, and why is it common in ad tech?',
 o:['The highest bidder pays the second-highest bid, which incentivizes truthful bidding','The highest bidder pays the highest bid','The lowest bid wins','There is no auction'],a:0,
 e:'In second-price auctions, bidding your true value is the dominant strategy, which simplifies bidding and reduces instability from strategic underbidding.'},

{q:'Why does ad serving rely so heavily on caching and precomputation?',
 o:['Encryption','Sharding','Auctions happen in milliseconds, so every millisecond of latency reduces fill rate and revenue','Backups'],a:2,
 e:'Feature lookups, model inference and budget checks all must finish within the latency budget. Precomputing features and caching frequently requested data is what makes that possible.'},

{q:'What is frequency capping?',
 o:['Limiting the shard count','Limiting how many times the same user sees the same ad in a period','Encryption','Capping query results'],a:1,
 e:'Frequency capping protects user experience and spreads budget. It requires fast per-user counters, which is a classic high-throughput counting problem.'},

{q:'What data is typically used for ad targeting?',
 o:['Only the current page','No data','Only device type','User attributes, context, historical behavior, lookalike models and consent status'],a:3,
 e:'Modern targeting combines first-party signals, contextual signals and model scores. Consent and data minimization are hard constraints, not optional features.'},

{q:'Why is attribution hard in ad tech?',
 o:['A user may see multiple ads and be influenced by them, so determining which touchpoint gets credit requires multi-touch models and identity resolution','It is not hard','Encryption','Sharding'],a:0,
 e:'A purchase rarely follows a single ad. Multi-touch attribution assigns fractional credit, and identity resolution (matching users across devices and channels) is the hard underlying problem.'},

{q:'What is a key privacy constraint affecting modern ad tech?',
 o:['No constraints','Encryption only','Consent and data minimization regulations such as GDPR and restrictions on third-party cookies, which drive first-party and contextual approaches','Sharding'],a:2,
 e:'Third-party cookie deprecation and stricter consent rules are reshaping the industry. First-party data, contextual targeting and privacy-preserving APIs are the new building blocks.'},

/* 41–50: Time-series & monitoring */
{q:'What is a time-series database optimized for?',
 o:['OLTP transactions','Append-heavy time-ordered writes with fast range queries and aggregation over time','Graph traversal','Full-text search'],a:1,
 e:'Time-series stores use time-based partitioning, columnar compression and downsampling. General-purpose databases struggle with the same write rate and retention requirements.'},

{q:'What is downsampling in a monitoring system?',
 o:['Aggregating older data to lower resolution to save storage while keeping long-term trends','Increasing resolution','Encryption','Sharding'],a:0,
 e:'Keeping raw data at full resolution for months is expensive. Downsampling to five-minute or one-hour rollups preserves trends and anomaly detection at a fraction of the cost.'},

{q:'What is the cardinality problem in Prometheus?',
 o:['Too many samples per second','Encryption','Too many shards','The number of unique label combinations creates one series per combination, and unbounded cardinality can overwhelm storage and memory'],a:3,
 e:'Putting user id, request id or other high-cardinality values in labels explodes the series count. High-cardinality data belongs in logs or traces, not metric labels.'},

{q:'What does a Prometheus pull model do?',
 o:['Pushes metrics to the server','Encrypts metrics','Scrapes configured targets periodically at the metrics endpoint, making target discovery and failure detection explicit','Shards metrics'],a:2,
 e:'The pull model makes the target list a configuration concern, and a failed scrape is itself a health signal. It works well with service discovery in dynamic environments.'},

{q:'What is PromQL primarily used for?',
 o:['Encryption','Querying and aggregating time series with functions and label matchers','Sharding','Backups'],a:1,
 e:'PromQL supports rate, aggregation, histogram quantiles and vector matching. Understanding these functions is essential for building meaningful dashboards and alerts.'},

{q:'Why is Prometheus considered local-storage-only by design?',
 o:['It favors a single-node local TSDB for reliability and simplicity, scaling via federation or remote write to a clustered store','It cannot store metrics','Encryption','Sharding'],a:0,
 e:'A single binary with a local TSDB is operationally simple and horizontally scalable by running more instances. Long-term retention is delegated to remote storage such as Thanos or Mimir.'},

{q:'What do recording rules do in Prometheus?',
 o:['Query live data','Encrypt metrics','Shard data','Precompute expensive queries into new series so dashboards and alerts are faster'],a:3,
 e:'Recording rules evaluate a PromQL expression periodically and store the result. They reduce dashboard latency and let alerts reference consistent precomputed values.'},

{q:'What is the purpose of Alertmanager?',
 o:['To scrape metrics','To store metrics','To deduplicate, group, silence and route alerts to receivers','To shard metrics'],a:2,
 e:'Alertmanager sits between Prometheus and notification channels. Grouping prevents alert storms, and silences support maintenance windows without editing rules.'},

{q:'What does a staleness marker indicate in Prometheus?',
 o:['The target is healthy','The series stopped being scraped and should not be treated as a continuing value','Encryption','Sharding'],a:1,
 e:'Without staleness markers, a down target would leave its last value looking current. Alerts that use them avoid false positives during restarts and decommissions.'},

{q:'Why is long-term storage of metrics often separated from the local TSDB?',
 o:['Local TSDBs are not designed for long retention at high cardinality, so remote write to object-backed systems such as Thanos or Mimir is used','Encryption','Sharding','There is no reason'],a:0,
 e:'Long retention at scale needs object storage, query federation and cheap compaction. Systems such as Thanos, Mimir and VictoriaMetrics provide these on top of the Prometheus ecosystem.'},

/* 51–60: Log aggregation */
{q:'What are the three typical stages of a log pipeline?',
 o:['Encrypt, shard, backup','Deploy, test, release','Read, write, delete','Collect, process or parse, store and query'],a:3,
 e:'Agents collect logs, a processor parses and enriches them, and a store indexes them for query. Each stage can fail or drop data, so monitoring the pipeline itself matters.'},

{q:'Why is log sampling useful?',
 o:['Encryption','It reduces noise and cost, keeping a representative subset while preserving all error logs','Sharding','Backups'],a:1,
 e:'High-volume debug logs are usually not worth storing in full. Sampling keeps enough for trend analysis while errors and slow requests are retained at full fidelity.'},

{q:'What is the role of an indexer such as Elasticsearch in a log pipeline?',
 o:['To index and make logs searchable with structured queries','To collect logs','To encrypt logs','To shard logs'],a:0,
 e:'The indexer builds inverted indexes over log fields so queries by service, trace id or error type return in milliseconds. It is the most expensive component to operate.'},

{q:'What is structured logging?',
 o:['Free text only','Encrypting logs','Emitting logs as key-value or JSON records so fields can be filtered and aggregated without regex','Sharding logs'],a:2,
 e:'Structured logs make dashboards, alerts and trace correlation reliable. Free-text logs require fragile parsing and break when a message format changes.'},

{q:'What is log rotation?',
 o:['Deleting all logs','Rolling files by size or time and deleting old ones to bound disk usage','Encrypting logs','Sharding logs'],a:1,
 e:'Without rotation, a single noisy service can fill the disk and take down the host. Rotation with retention limits is a baseline operational requirement.'},

{q:'Why is correlation id propagation essential for debugging across services?',
 o:['It is not essential','Encryption','Sharding','It lets you reconstruct one request across many services by matching a shared id in every log line'],a:3,
 e:'The id is generated at the edge if absent and propagated in headers and message attributes. A single grep then reconstructs the full request path.'},

{q:'What is the difference between push and pull log collection?',
 o:['Push has agents sending logs to a collector; pull has the collector fetching from the agent endpoint','They are identical','Pull is always faster','Push is always cheaper'],a:0,
 e:'Push is simpler to operate at scale because the collector does not need to know every agent. Pull is useful when agents cannot make outbound connections.'},

{q:'What is the main cost driver in log storage?',
 o:['The number of shards','Encryption','Volume times retention times indexing, so sampling and tiered storage are key levers','The number of services'],a:2,
 e:'Storage cost scales with ingested bytes, how long they are kept, and how many fields are indexed. Each of those is a tuning knob with a direct effect on the bill.'},

{q:'What is a hot, warm, cold log tier for?',
 o:['To slow down queries','Keeping recent logs on fast storage for search and older logs on cheap storage for compliance','Encryption','Sharding'],a:1,
 e:'Most queries look at the last few hours or days. Tiering puts that data on fast storage and moves the rest to object storage, which can cut cost dramatically.'},

{q:'Why is over-indexing every field in logs a bad practice?',
 o:['It is not bad','Encryption','Sharding','It inflates storage and indexing cost dramatically while many fields are rarely queried'],a:3,
 e:'Index only the fields you query regularly. Everything else can live in the stored source, which is far cheaper, and be parsed on demand if needed.'},

/* 61–70: Distributed file systems & object storage */
{q:'In HDFS, what does a NameNode do?',
 o:['Stores the filesystem metadata mapping blocks to DataNodes','Stores the actual file data','Encrypts data','Shards data'],a:0,
 e:'The NameNode holds the namespace and block map; the DataNodes store the blocks. This separation keeps metadata fast and data distributed, but makes the NameNode a critical component.'},

{q:'What is the default replication factor in HDFS?',
 o:['1','2','3','10'],a:2,
 e:'Three replicas tolerate two simultaneous DataNode failures. The factor is configurable per file, and lower factors trade durability for storage cost.'},

{q:'What does an object storage system such as S3 provide?',
 o:['A POSIX filesystem','A flat key-value abstraction with high durability and availability, accessed over HTTP','A relational database','A message queue'],a:1,
 e:'Objects are addressed by key and accessed over HTTP, which scales to enormous size but has higher latency than block storage and no in-place partial updates.'},

{q:'What is eventual consistency in object storage?',
 o:['All writes are immediately visible','No writes are possible','Encryption','After an overwrite or delete, a subsequent read may briefly return the old or new version, though modern stores have largely eliminated this'],a:3,
 e:'Historically S3 was eventually consistent for overwrites and deletes. Today it is strongly consistent for new objects, but the mental model still matters for other object stores and caches in front of them.'},

{q:'What is multipart upload used for in object storage?',
 o:['Uploading small files faster','Encryption','Uploading large objects in parallel parts that can be retried independently','Sharding'],a:2,
 e:'Multipart upload parallelizes large transfers and lets a failed part be retried without restarting the whole upload, which is essential for multi-gigabyte objects.'},

{q:'What is an object storage lifecycle policy?',
 o:['Rules that transition objects to cheaper tiers or delete them after a time','Encryption','Sharding','Replication across regions'],a:0,
 e:'Lifecycle rules automate tiering and deletion, which is where most object storage savings come from. They must be designed with retention and compliance requirements in mind.'},

{q:'What is the main difference between a block device and object storage for a database?',
 o:['They are identical','Block devices provide low-latency random I/O suitable for databases; object storage is far cheaper but higher latency','Object storage is faster','Block devices are only for backups'],a:1,
 e:'Databases depend on predictable random I/O. Newer systems such as Aurora push the log to object storage but still rely on a purpose-built storage layer, not generic object storage.'},

{q:'What is erasure coding used for in storage systems?',
 o:['Encryption','Sharding','Caching','Splitting data into fragments with parity so the original can be reconstructed from a subset, reducing storage overhead versus full replication'],a:3,
 e:'Erasure coding can achieve durability comparable to triple replication at much lower storage cost, at the expense of higher CPU and repair complexity.'},

{q:'What is the small-object problem in object storage?',
 o:['Many small objects incur per-object overhead and request costs, so packing them into larger objects is often cheaper','Small objects do not exist','Encryption','Sharding'],a:0,
 e:'Per-object metadata and request pricing dominate when objects are tiny. Archiving many small files into larger bundles with an index is a common cost optimization.'},

{q:'What does a content-addressable storage system use as the key?',
 o:['A random UUID','The file name','A hash of the content, which gives deduplication and integrity verification for free','A timestamp'],a:2,
 e:'Hashing content means identical bytes produce the same key, so deduplication is automatic. Any mismatch on read signals corruption, which is why CAS is common for backups and container images.'},

/* 71–80: Video delivery & CDN */
{q:'What is adaptive bitrate streaming?',
 o:['Streaming one fixed bitrate','Encoding multiple bitrate renditions so the player can switch based on network conditions','Encrypting video','Sharding video'],a:1,
 e:'Multiple renditions let the player drop to a lower bitrate when bandwidth falls instead of stalling. The trade-off is more storage and more encoding CPU.'},

{q:'What is HLS?',
 o:['HTTP Live Streaming, a protocol that segments video into small chunks described by a manifest','A database','A cache','A message queue'],a:0,
 e:'HLS uses standard HTTP, which lets it pass through CDNs and firewalls easily. DASH is a similar standard with a different manifest format.'},

{q:'What is the difference between live streaming and VOD delivery?',
 o:['They are identical','VOD is always lower latency','Live does not use a CDN','Live must handle real-time ingest and low-latency delivery, while VOD can be fully transcoded and CDN-cached in advance'],a:3,
 e:'VOD is a batch problem: transcode once, cache everywhere. Live adds an ingest tier, low-latency packaging and real-time monitoring of encoder health.'},

{q:'What is a manifest in HLS or DASH?',
 o:['Encryption key','A shard key','An index file listing available renditions and segment URLs so the player can choose what to fetch','A cache'],a:2,
 e:'The manifest is the entry point for the player. For live, it is refreshed periodically so the player sees newly produced segments.'},

{q:'Why is video transcoding usually done asynchronously?',
 o:['It is fast','Transcoding is CPU-intensive and slow, so a durable queue with idempotent workers is used and the CDN serves the result','Encryption','Sharding'],a:1,
 e:'A single upload produces many renditions, each taking minutes. The queue decouples upload from processing, gives retries, and lets workers scale independently.'},

{q:'What is a typical CDN cache key for video segments?',
 o:['The segment path and version, since segments are immutable','The user id','The session id','The timestamp'],a:0,
 e:'Immutable segment URLs can be cached indefinitely, so cache hit ratio is very high. Per-user cache keys would destroy the benefit of the CDN.'},

{q:'Why do CDNs use versioned or hashed segment URLs?',
 o:['For encryption','To shard','So segments are immutable and can be cached forever without purge','To slow requests'],a:2,
 e:'Immutability removes the need to invalidate caches. A new version gets a new URL, and old segments expire naturally, which is far more reliable than purging.'},

{q:'What is a prefetch or warm for a CDN?',
 o:['Deleting cache','Encrypting the cache','Sharding the cache','Populating edge caches before user demand so the first viewer does not pay the origin latency'],a:3,
 e:'Warming is used for predictable spikes such as a product launch or a live event. It trades extra origin load for a better first-viewer experience.'},

{q:'What does a DVR window mean in live streaming?',
 o:['Unlimited rewind','A bounded time window of past segments available for replay, with older segments discarded','Encryption','Sharding'],a:1,
 e:'The DVR window defines how far back a viewer can rewind. A larger window costs more storage and cache footprint, so it is sized to the product requirement.'},

{q:'Why is low-latency HLS more complex than standard HLS?',
 o:['It uses smaller segments and partial segment delivery to reduce latency, at the cost of more requests and more cache churn','It is simpler','Encryption','It does not use a CDN'],a:0,
 e:'Standard HLS latency is dominated by segment length. Low-latency HLS uses partial segments and chunked transfer encoding, which requires coordination across encoder, packager and CDN.'},

/* 81–90: Identity, auth & multi-tenant SaaS */
{q:'What does SSO provide?',
 o:['Separate credentials per app','Encryption','A single authentication across many applications via a central identity provider','Sharding'],a:2,
 e:'SSO centralizes authentication so users sign in once and applications trust assertions from the identity provider. It also centralizes deprovisioning and policy.'},

{q:'What is the difference between a session cookie and a bearer token?',
 o:['They are identical','Cookies are encrypted and tokens are not','Tokens only work in browsers','A session cookie is tied to server-side state and scoped to a domain, while a bearer token is self-contained and sent explicitly in an authorization header'],a:3,
 e:'Session cookies rely on a store keyed by the cookie value. Bearer tokens carry claims directly, which suits APIs and cross-domain clients, but revocation needs care.'},

{q:'What is refresh token rotation?',
 o:['Reusing the same refresh token forever','Issuing a new refresh token on every use and invalidating the old one, which detects token theft','Encryption','Sharding'],a:1,
 e:'If a stolen refresh token is used, the legitimate client will also try to use the now-invalid old token, which signals the compromise and lets the provider revoke the session family.'},

{q:'What is a multi-tenant row-level isolation model?',
 o:['Every row carries a tenant id and queries are always scoped by it, which is cheap but demands strict enforcement','One database per tenant','Encryption','Sharding'],a:0,
 e:'Row-level tenancy is the most cost-efficient model, but a single missing tenant filter becomes a cross-tenant data leak, so enforcement usually lives in a shared data access layer.'},

{q:'When is a database-per-tenant model preferred?',
 o:['Never','Always','When isolation, compliance or noisy-neighbor concerns outweigh the operational cost, often in enterprise SaaS','For small free tiers'],a:2,
 e:'Per-tenant databases bound blast radius and simplify data residency, at the cost of many databases to operate and migrate. Many SaaS products offer this as a premium tier.'},

{q:'What is an identity provider responsible for?',
 o:['Hosting the application','Authenticating users and issuing tokens or assertions to relying applications','Encrypting all traffic','Sharding users'],a:1,
 e:'The identity provider is the authority for credentials and session state. Applications delegate authentication to it and focus on authorization for their own resources.'},

{q:'What is SCIM used for?',
 o:['Encrypting tokens','Sharding users','Caching','Standardizing user provisioning and deprovisioning across identity providers and applications'],a:3,
 e:'SCIM gives a standard REST API for creating, updating and deactivating users. It is what makes onboarding and offboarding automatable across SaaS tools.'},

{q:'What is a tenant context, and why is it dangerous to omit?',
 o:['The tenant id that scopes every data access; omitting it can leak data across tenants','A UI theme','Encryption','Sharding'],a:0,
 e:'The tenant id must flow through every query, cache key, log line and background job. Omitting it in even one path creates a cross-tenant data exposure.'},

{q:'What is a JWT claim?',
 o:['A signature','A shard key','A key-value assertion in the token payload such as subject, issuer, roles or tenant id','A cache key'],a:2,
 e:'Claims carry the facts the relying party needs. Because the payload is only signed and not encrypted, sensitive values should never be placed in claims.'},

{q:'Why is a short-lived access token plus a refresh token the recommended pattern?',
 o:['It is not recommended','It limits exposure if a token leaks while keeping user sessions usable without constant re-login','Encryption','Sharding'],a:1,
 e:'A short lifetime bounds the damage from a stolen access token. The refresh token, stored more securely, obtains new access tokens, and rotation detects theft.'},

/* 91–100: E-commerce, inventory & flash sales */
{q:'What is the overselling problem in e-commerce?',
 o:['Too much stock','Encryption','Sharding','Accepting more orders than available stock due to concurrent reads and writes, solved by atomic decrement, reservations or queues'],a:3,
 e:'Two users can both read stock as one and both place an order. Atomic conditional updates, reservations with TTLs, or serializing through a queue prevent it.'},

{q:'What is a reservation or hold pattern?',
 o:['Temporarily reserving stock for a user for a short window so concurrent purchases do not oversell, with expiration and release','Permanently allocating stock','Encryption','Sharding'],a:0,
 e:'The reservation reduces contention to a single atomic step and gives the user time to complete checkout. Expiration releases abandoned holds, and idempotency prevents duplicate reservations.'},

{q:'What is the main challenge of a flash sale?',
 o:['No challenge','An enormous traffic spike in seconds with limited inventory, requiring caching, queueing, rate limiting and graceful degradation','Encryption','Sharding'],a:1,
 e:'The spike is unpredictable and short, so static capacity is wasteful. Prewarming, queues and admission control turn the spike into a controlled flow of successful purchases.'},

{q:'What is a virtual waiting room?',
 o:['A physical queue','Encryption','An admission control layer that issues tokens to users so only a bounded number reach checkout at once','Sharding'],a:2,
 e:'The waiting room protects the checkout and database from being overwhelmed. Users get an honest position and an estimated wait, which is far better than errors or timeouts.'},

{q:'Why is a single database row for inventory often a bottleneck in a flash sale?',
 o:['All concurrent decrements contend on the same row lock, so throughput collapses; sharding inventory into buckets or using atomic counters helps','No bottleneck','Encryption','Sharding is not possible'],a:0,
 e:'A hot row serializes writes and becomes the throughput ceiling. Bucketed counters and a separate reservation service with its own store are common mitigations.'},

{q:'What is the saga pattern in order placement?',
 o:['A single transaction','Encryption','Sharding','A series of local transactions with compensating actions across services such as inventory, payment and shipping'],a:3,
 e:'Order placement spans services that cannot share a transaction. A saga tracks progress and runs compensating actions on failure, such as releasing inventory or refunding payment.'},

{q:'Why must order placement be idempotent?',
 o:['It does not need to be','Encryption','A client retry after a timeout could otherwise create duplicate orders, so an idempotency key is needed','Sharding'],a:2,
 e:'The client cannot tell whether a timed-out request was processed, so retries happen. An idempotency key lets the server return the original result rather than creating a second order.'},

{q:'What is cart price recalculation at checkout for?',
 o:['Nothing','To revalidate price, promotions and inventory that may have changed since the item was added to the cart','Encryption','Sharding'],a:1,
 e:'Carts can be hours or days old. Recalculating at checkout prevents selling at stale prices and surfaces out-of-stock items before payment, which is far cheaper than refunding later.'},

{q:'What is the purpose of a product catalog cache?',
 o:['Serving read-heavy catalog pages from a fast store while writes go to the source of truth, with TTL and invalidation on update','Encryption','Sharding','Backups'],a:0,
 e:'Catalog reads dwarf writes, so caching is the highest-leverage optimization. Invalidation must be explicit for price and stock, which change frequently and matter for correctness.'},

{q:'Why is a ledger of immutable entries used in payments and orders?',
 o:['It is not needed','Encryption','Sharding','It gives an auditable, append-only record of money and state changes that can be replayed to reconcile with providers'],a:3,
 e:'An append-only ledger preserves every state change and makes reconciliation possible when a provider reports a different balance. It is the foundation of a trustworthy payment system.'}

];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>System Design Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
