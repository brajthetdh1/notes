<style>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>

  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>

<script>
const QS = [

/* 1–10: Consistency models */
{q:'What does linearizability guarantee?',
 o:['Eventual convergence','Causal ordering only','Operations appear to execute atomically in real-time order, as if on a single machine','Reads always return the latest value eventually'],a:2,
 e:'Linearizability is the strongest single-object consistency model: once a write completes, every subsequent read from anywhere sees it. It requires coordination (quorums, consensus), which is why it costs latency in multi-region systems.'},

{q:'What does read-your-writes consistency guarantee?',
 o:['A client always sees its own completed writes on subsequent reads','All clients see writes at the same instant','Reads never return stale data','Writes are ordered globally'],a:0,
 e:'Read-your-writes is weaker than linearizability and much cheaper: it only requires that a user\'s reads reflect their own writes, often by routing their reads to the primary for a short window after a write.'},

{q:'What does monotonic reads consistency prevent?',
 o:['Any stale read','Concurrent writes','Lost updates','A client seeing older data after it has already seen newer data, which happens when successive reads hit replicas with different lag'],a:3,
 e:'Without monotonic reads a user could refresh a page and see time go backwards. Pinning a user to a replica with a stable lag estimate, or tracking a read watermark, prevents this.'},

{q:'What does causal consistency preserve that eventual consistency does not?',
 o:['Wall-clock ordering','Causal ordering: if A happens-before B, every node observes A before B','Serializable isolation','Strong durability'],a:1,
 e:'Causal consistency is often enough for collaboration UIs: you do not need global ordering, but a reply must never appear before the message it replies to. It is achievable with lower latency than linearizability.'},

{q:'Which consistency model do most read-replica setups provide by default?',
 o:['Linearizability','Serializable','Eventual consistency, with replica lag causing reads to be temporarily stale','Causal consistency'],a:2,
 e:'Async replication to read replicas gives eventual consistency. Applications cope by routing critical reads to the primary, using read-your-writes tokens, or accepting the staleness window in the UI.'},

{q:'What is the main weakness of leader-follower replication?',
 o:['It cannot scale reads','Write throughput is limited to what a single leader can handle, and failover is not instantaneous','It lacks durability','It cannot survive a node failure'],a:1,
 e:'Leader-follower (single-leader) is simple and gives strong consistency on the leader, but all writes funnel through one node. It scales reads via replicas but not writes, and leader failure costs an election window.'},

{q:'When is multi-leader replication most appropriate?',
 o:['When you need a single source of truth','When two regions must both accept writes and tolerate WAN latency, accepting conflict resolution','When you have no network partitions','When strong consistency is required'],a:1,
 e:'Multi-leader shows up in multi-region active-active setups, offline-first apps and collaborative editors. The price is conflict detection and resolution, which is often under-estimated.'},

{q:'How does leaderless (Dynamo-style) replication achieve consistency?',
 o:['Through a single leader','By requiring all replicas to acknowledge','By using quorums: a write must reach W replicas and a read must query R replicas, with W + R > N guaranteeing overlap','Through a global lock'],a:2,
 e:'The quorum overlap is what makes the read see the latest write with high probability. The system still needs read repair or anti-entropy to fix replicas that missed writes during failures.'},

{q:'What does a sloppy quorum with hinted handoff provide?',
 o:['Strong consistency during partitions','Availability during partitions: writes go to any reachable node, which forwards them to the correct home replica when it recovers','Faster reads','Automatic sharding'],a:1,
 e:'Sloppy quorum sacrifices the strict W + R > N overlap guarantee during failures in exchange for staying writable. Hinted handoff repairs the state once the home replica comes back.'},

{q:'What is the difference between read repair and anti-entropy?',
 o:['They are the same','Read repair fixes stale replicas encountered during a read; anti-entropy is a background process that compares and syncs replicas independently of traffic','Read repair only works on writes','Anti-entropy requires a leader'],a:1,
 e:'Read repair is cheap but only fixes what is read. Anti-entropy (Merkle-tree comparison in Cassandra, for example) catches divergence that no client ever touches, at the cost of background I/O.'},

/* 11–20: Partitioning & replication */
{q:'What is the main advantage of range partitioning?',
 o:['Perfectly even distribution','Efficient range scans because adjacent keys live together, which suits time-series and ordered data','No hot spots','Automatic balancing'],a:1,
 e:'Range partitioning is excellent for queries like "all orders in March", but if the key is a timestamp the newest range becomes a hot shard, so a compound key or pre-splitting is often needed.'},

{q:'What is the main risk of hash partitioning a monotonically increasing key such as a timestamp?',
 o:['Hot spots','Data loss','Loss of range scan ability and a reshuffle of nearly all keys when the number of buckets changes, unless consistent hashing is used','Higher storage cost'],a:2,
 e:'Hashing fixes hot spots but destroys ordering, so range queries must fan out. Modulo hashing also reshuffles almost everything on rebalancing, which is why consistent hashing or a fixed large bucket count is preferred.'},

{q:'What does directory-based partitioning use to route requests?',
 o:['A consistent hash ring','A lookup service that stores the mapping from key or range to shard, allowing arbitrary placement','A Bloom filter','A gossip protocol'],a:1,
 e:'A directory gives maximum flexibility — you can move any key anywhere — but the lookup service becomes a critical dependency and a potential hot spot, so it is usually cached aggressively.'},

{q:'Why do consistent hashing implementations use virtual nodes?',
 o:['To encrypt the ring','To reduce key movement on rebalance','To give each physical node many positions on the ring, smoothing the distribution and reducing variance when nodes join or leave','To eliminate the need for replication'],a:2,
 e:'Without virtual nodes, random placement gives high variance and some nodes take far more of the ring. Many virtual nodes per physical node approximate an even split and let you weight more capable machines higher.'},

{q:'What does a replication factor of 3 with a write quorum of 2 and a read quorum of 2 guarantee?',
 o:['Nothing about consistency','Strong consistency in all cases','That reads and writes always overlap on at least one replica, so a read sees the latest acknowledged write','That writes never fail'],a:2,
 e:'W + R > N is the quorum overlap condition. It does not guarantee linearizability, because concurrent writes can still conflict; it guarantees a read sees the most recent acknowledged write in the absence of concurrent updates.'},

{q:'What is the write amplification problem in replicated stores?',
 o:['One logical write becomes multiple physical writes across replicas and internal structures, consuming bandwidth and disk','Writes are encrypted','Writes are larger than reads','Writes are lost'],a:0,
 e:'A higher replication factor, LSM compaction, and secondary indexes all amplify writes. Understanding this is why some systems choose quorum sizes or index structures based on write-heavy or read-heavy workloads.'},

{q:'Why is a "read from any replica" strategy risky for a user who just updated their profile?',
 o:['It is always correct','A lagging replica may not yet have the update, so the user sees the old value and assumes the save failed','It is slower','It breaks encryption'],a:1,
 e:'This is the read-your-writes problem in practice. Routing that user to the primary, or attaching a version token so the replica can wait for the needed offset, fixes it.'},

{q:'What does a "follower reads with a staleness bound" configuration provide?',
 o:['Strong consistency','Reads from replicas that are guaranteed to be no more than a configured time behind, giving bounded staleness','No consistency','Write scaling'],a:1,
 e:'Bounded staleness is a practical middle ground: reads offload from the primary, but the product can promise "at most 5 seconds stale", which is easy to reason about in the UI.'},

{q:'What happens to partitions during a rebalance in a sharded store?',
 o:['Nothing changes','Shards are moved between nodes, which consumes network and I/O and can temporarily raise latency; the system should remain readable and writable throughout','The store goes read-only','Data is lost'],a:1,
 e:'Online rebalancing needs care: throttling, prioritisation, and avoiding moving the same shard twice. A poor rebalance strategy is a common cause of production incidents.'},

{q:'What is the key difference between failover and failback?',
 o:['They are the same','Failover moves traffic to a standby when the primary fails; failback returns traffic to the original primary once it is healthy again, which is a separate and often riskier operation','Failback happens automatically','Failover is for reads only'],a:1,
 e:'Failback is often done manually and carefully because the standby has accumulated writes that must be reconciled. Automating failback without validation risks losing those writes.'},

/* 21–30: Distributed consensus & time */
{q:'What is the core requirement for any consensus protocol?',
 o:['All nodes must respond','A majority quorum must agree, so the system can tolerate a minority of failures without diverging','A single node must decide','All clocks must be synchronised'],a:1,
 e:'Majority quorum is what prevents split-brain: any two majorities overlap, so two leaders cannot both commit. Five nodes tolerate two failures, three tolerate one.'},

{q:'What distinguishes Paxos from Raft in practice?',
 o:['Paxos cannot achieve consensus','Raft has a leader-driven design with clearly separated election, replication and safety, which is why it is easier to implement and reason about','Raft is not used in production','Paxos has no quorum requirement'],a:1,
 e:'Both achieve the same safety guarantees. Raft\'s explicit leader term and log index make it easier to implement and debug, which is why etcd, Consul and Kafka KRaft use it.'},

{q:'What does ZAB (ZooKeeper Atomic Broadcast) primarily provide?',
 o:['Eventually consistent reads','Total ordering of state changes with a leader-based protocol, giving ZooKeeper its consistency guarantees','Cross-datacenter replication','Encryption'],a:1,
 e:'ZAB is similar in spirit to Raft and Paxos: a leader orders transactions and a quorum must acknowledge before the write is visible. ZooKeeper\'s znode updates are linearizable within its guarantees.'},

{q:'What is a Lamport timestamp used for?',
 o:['Encrypting messages','Capturing a partial ordering of events where A happens-before B is represented by a smaller counter, though it cannot detect concurrency','Measuring real time','Load balancing'],a:1,
 e:'Lamport clocks give a consistent ordering but cannot tell you whether two events were concurrent. That requires vector clocks, which are heavier.'},

{q:'What do vector clocks add over Lamport timestamps?',
 o:['Faster writes','Real wall-clock time','Encryption','Detection of concurrency: two events are concurrent if neither clock dominates the other, which enables conflict detection'],a:3,
 e:'Vector clocks grow with the number of nodes, which limits their practical use at large scale. Many systems use a smaller structure plus a merge strategy, or switch to HLCs.'},

{q:'What is a hybrid logical clock (HLC)?',
 o:['A wall clock only','A combination of physical time and a logical counter, giving bounded size while keeping ordering close to real time, used by CockroachDB and others','A cache eviction policy','A hashing scheme'],a:1,
 e:'HLCs give you ordering that respects causality without unbounded vector sizes. They are bounded even with clock skew, which makes them practical for distributed databases.'},

{q:'Why is wall-clock time unreliable for ordering distributed events?',
 o:['It is too precise','Clocks drift, can jump backwards due to NTP adjustments, and differ between machines, so timestamps alone cannot establish happens-before','It uses too much memory','It is not supported by databases'],a:1,
 e:'Systems either use logical clocks for ordering or make explicit assumptions about bounded skew (as Spanner does with TrueTime, at the cost of waiting out uncertainty before commit).'},

{q:'What does Spanner\'s TrueTime provide?',
 o:['Perfect clock synchronisation','A bounded time interval from GPS and atomic clocks, so Spanner can wait out the uncertainty before committing and provide external consistency','Eventually consistent reads','Encryption'],a:1,
 e:'TrueTime trades availability for consistency by waiting for the uncertainty window to elapse. That is the hardware cost of a globally consistent database, and it is why Spanner needs special infrastructure.'},

{q:'What is the practical consequence of clock skew on a lease-based lock?',
 o:['No consequence','A paused holder may believe its lease is still valid after expiry, so a second holder can enter unless a fencing token protects the resource','Leases become faster','Leases become permanent'],a:1,
 e:'Leases plus fencing tokens are the standard defence. The resource rejects any write carrying an older token, which protects against a holder whose clock or process was paused.'},

{q:'What does "bounded staleness" require the system to know?',
 o:['Nothing','An upper bound on replication lag, which lets callers decide whether a read is safe or must go to the primary','The exact wall clock','The number of nodes'],a:1,
 e:'Bounded staleness is a product-facing guarantee, and it needs measurement, alerting and a fallback path when the bound is exceeded. It is more useful than "eventual" and much cheaper than linearizable.'},

/* 31–40: Probabilistic data structures */
{q:'What guarantee does a Bloom filter provide?',
 o:['Exact membership','No false negatives, but possible false positives, so it can rule out membership cheaply','Exact counts','Sorted keys'],a:1,
 e:'A Bloom filter is used to skip an expensive lookup when a key is definitely absent. The false positive rate depends on the number of hash functions and the bits per element.'},

{q:'What is the main use case for a Bloom filter in a database?',
 o:['Compressing rows','Avoiding disk reads for keys that definitely do not exist, such as in LSM-tree reads before checking SSTables','Encrypting indexes','Sorting rows'],a:1,
 e:'RocksDB, Cassandra and HBase use Bloom filters per SSTable so a point lookup can skip files that cannot contain the key, which drastically reduces read amplification.'},

{q:'What does a count-min sketch provide?',
 o:['Exact frequency counts','Approximate frequency estimation that can overestimate but never underestimate','Cardinality estimation','Set membership'],a:1,
 e:'Count-min sketch is used for heavy-hitter detection and approximate frequency queries in streaming systems, where exact counts would require too much memory.'},

{q:'What does HyperLogLog estimate?',
 o:['Frequency of a single item','The number of distinct items (cardinality) with a small, fixed amount of memory and a few percent error','Membership','Median'],a:1,
 e:'HyperLogLog is the standard for unique-visitor counts at scale. It cannot answer "is this item present", only "how many distinct items are there", with a controllable error.'},

{q:'When would you choose a Bloom filter over an exact set?',
 o:['When false positives are unacceptable','When memory is the constraint and a small false-positive rate is acceptable in exchange for large savings in memory and time','When you need to enumerate the set','When you need exact counts'],a:1,
 e:'The classic trade is memory: a Bloom filter for a million keys can fit in about a megabyte at a 1% false-positive rate, which an exact hash set cannot match.'},

{q:'What does a cuckoo filter improve over a Bloom filter?',
 o:['False negatives','Deletion support and generally better space efficiency at low false-positive rates','Exact counting','Sorting'],a:1,
 e:'Bloom filters cannot delete without a counting variant. Cuckoo filters support deletion and lookups, at the cost of insert failures when full and a slightly higher false-positive rate at very low memory.'},

{q:'What is a t-digest used for?',
 o:['Hashing','Estimating quantiles and percentiles over a stream in bounded memory with high accuracy at the tails','Encryption','Membership testing'],a:1,
 e:'t-digest and HdrHistogram are the two standard ways to compute p99 in production without storing every sample, which is why they show up in metrics systems.'},

{q:'What is the main limitation of a count-min sketch?',
 o:['It overestimates and cannot enumerate the items it tracks','It underestimates','It cannot be used in streaming','It requires unbounded memory'],a:0,
 e:'You can mitigate overestimation with conservative update, and combine with a heap of candidates for heavy hitters, but the sketch itself cannot tell you what the tracked items are.'},

{q:'What does a Merkle tree enable in a distributed store?',
 o:['Encryption','Efficient comparison of two datasets to find differing ranges, which is why it powers anti-entropy repair','Faster writes','Compression'],a:1,
 e:'Comparing whole trees is cheap; differing hashes localise the range that needs repair. Dynamo and Cassandra both use Merkle trees for anti-entropy.'},

{q:'Why is a probabilistic data structure acceptable in a user-facing feature?',
 o:['It is always acceptable','When the error is bounded and does not change the product decision, such as an approximate view count or "people also viewed"','When accuracy does not matter at all','It is never acceptable'],a:1,
 e:'The right question is whether the error crosses a product threshold. An approximate view count is fine; an approximate payment amount is not.'},

/* 41–50: Rate limiting & resilience */
{q:'What does a token bucket rate limiter allow that a fixed-window limiter does not?',
 o:['Lower cost','Bursts up to the bucket size, while still enforcing an average rate over time','Strictly no bursts','Per-user limits'],a:1,
 e:'Token bucket is the standard choice for APIs because it matches how real clients behave: bursts followed by sustained traffic. The bucket size controls burst tolerance.'},

{q:'How does a leaky bucket differ from a token bucket?',
 o:['They are identical','Leaky bucket smooths traffic into a constant output rate, while token bucket allows bursts; leaky bucket is for shaping, token bucket for policing','Leaky bucket is faster','Leaky bucket allows unlimited bursts'],a:1,
 e:'Leaky bucket is common in network shaping where steady output matters. APIs usually prefer token bucket because rejecting a bursty but within-budget client feels punitive.'},

{q:'Why is a fixed-window counter imprecise at window boundaries?',
 o:['It is not','A client can send the full quota at the end of one window and again at the start of the next, briefly doubling the effective rate','It uses too much memory','It cannot be distributed'],a:1,
 e:'Sliding-window or sliding-window-log limiters avoid the boundary burst at the cost of more state. Approximate sliding windows use weighted counts from the previous window.'},

{q:'What is the main challenge with a distributed rate limiter?',
 o:['Choosing a colour','Keeping counter state consistent and low-latency across many gateway instances, usually with a fast shared store','Encrypting counters','Compressing counters'],a:1,
 e:'A purely local limiter allows N times the configured rate with N instances. A shared store such as Redis fixes it but introduces a network hop and a potential hot key, so per-shard or approximate schemes are often used.'},

{q:'What is "retry amplification"?',
 o:['A single retry','When many clients retry at once and multiply the load on a failing dependency, making the outage worse','Faster retries','A retry without a timeout'],a:1,
 e:'Retries must be bounded, use exponential backoff with jitter, be restricted to idempotent operations, and be paired with a circuit breaker, otherwise they become a denial-of-service on your own system.'},

{q:'Why add jitter to exponential backoff?',
 o:['To slow retries','To spread retries over time so clients do not synchronise into spikes that re-overload a recovering service','To encrypt retries','To reduce memory'],a:1,
 e:'Full jitter (random in [0, backoff]) is the usual recommendation. Without it, all clients retry at the same instants and the dependency never gets breathing room.'},

{q:'How does a circuit breaker's half-open state work?',
 o:['It allows all traffic','It allows a limited number of trial requests; success returns the breaker to closed and failure returns it to open','It blocks all traffic permanently','It resets the service'],a:1,
 e:'The half-open state is how the breaker probes recovery without flooding a fragile dependency. Thresholds and trial counts need tuning per dependency.'},

{q:'What does the bulkhead pattern isolate?',
 o:['Databases','Resource pools such as thread pools or connection pools per dependency, so one slow dependency cannot exhaust capacity for all callers','Network segments','Certificates'],a:1,
 e:'Named after ship compartments: a flooded section does not sink the ship. Without bulkheads, one slow dependency can consume the entire shared pool and take down unrelated endpoints.'},

{q:'What is the purpose of load shedding?',
 o:['Rejecting work to protect the system when it is over capacity, ideally with a cheap, priority-aware decision so critical traffic survives','Adding more servers','Encrypting requests','Reordering requests'],a:0,
 e:'Overload makes latency climb until the system effectively fails for everyone. Shedding low-priority work early — by queue depth, request class or cost — keeps the system in a good state.'},

{q:'What does backpressure require from the producer?',
 o:['Nothing','It must be able to slow down or pause when the consumer signals it is saturated, which requires a bounded buffer and an explicit signal path','More memory','A faster network'],a:1,
 e:'Without a bounded buffer and a signal, the only alternative is unbounded memory growth and eventual OOM. Reactive streams, credit-based systems and queue depth throttling all implement this.'},

/* 51–60: Communication protocols */
{q:'When is gRPC a better choice than REST+JSON for internal service traffic?',
 o:['For public browser APIs','When you need a strongly typed contract, efficient binary serialization and streaming, and can tolerate a stricter toolchain','When you need human-readable responses','When you need to cache in a CDN'],a:1,
 e:'gRPC\'s protobuf schema, HTTP/2 multiplexing and streaming make it efficient for high-volume internal calls. Browsers need a proxy, so it is rarely the public edge protocol.'},

{q:'What is the main operational risk of GraphQL in a microservices architecture?',
 o:['It cannot cache','Expensive or abusive queries can cause N+1 fetches, deep recursion and overload; cost analysis, depth limits and persisted queries are needed','It cannot use HTTPS','It does not support auth'],a:1,
 e:'GraphQL moves the aggregation decision to the client. Without query cost controls and a DataLoader-style batching layer, a single query can fan out into thousands of backend calls.'},

{q:'Which protocol gives true bidirectional, low-latency messaging from a browser?',
 o:['Server-Sent Events','Long polling','WebSocket, which provides a persistent full-duplex connection','Plain HTTP polling'],a:2,
 e:'WebSocket is the default for chat and real-time collaboration. It needs careful handling of proxies, reconnection, backpressure and horizontal scaling with a pub/sub layer.'},

{q:'What is Server-Sent Events (SSE) best suited for?',
 o:['Bidirectional chat','File uploads','Real-time collaboration','Server-to-client streams such as live scores or progress updates, over plain HTTP with automatic reconnection'],a:3,
 e:'SSE is simpler than WebSocket when you only need server push. It works over HTTP/1.1 and HTTP/2, reconnects automatically, and passes through most proxies without special configuration.'},

{q:'Why do webhooks need retries, signatures and idempotency?',
 o:['They are unreliable by nature: the receiver can be down, requests can be duplicated, and the sender must be able to verify authenticity and safely retry','They are always reliable','They are encrypted by default','They do not need authentication'],a:0,
 e:'A webhook is an outbound HTTP request to someone else\'s system. Signing payloads, retrying with backoff, and including an event id for deduplication are the minimum for a production-grade webhook.'},

{q:'What is the main advantage of long polling over short polling?',
 o:['It reduces the number of empty responses by holding the request open until data is available or a timeout expires, lowering latency and server load','It is always cheaper','It uses WebSockets','It removes the need for a server'],a:0,
 e:'Long polling is a fallback when WebSocket or SSE is unavailable. It still consumes a connection per client, so it does not scale as well as a persistent push channel with a pub/sub backend.'},

{q:'Why do push notifications require a gateway service (APNs, FCM) rather than direct device connections?',
 o:['They are faster','Mobile OSes do not allow arbitrary background connections, so a single vendor-managed connection per device is used to save battery and route notifications reliably','They provide encryption','They reduce app size'],a:1,
 e:'The push service keeps one persistent connection per device and multiplexes all apps over it. This is why notification systems are a queue plus a provider integration, not a direct socket per user.'},

{q:'What is the key trade-off between pushing and pulling configuration or data?',
 o:['No trade-off','Push gives lower latency but requires the server to track clients; pull is more scalable and simpler to operate but adds latency and polling overhead','Pull is always better','Push cannot be secured'],a:1,
 e:'The choice depends on how fresh the data must be and how many consumers exist. Long-lived server connections with a pub/sub fan-out are how most systems combine the benefits.'},

{q:'What does HTTP/2 multiplexing improve over HTTP/1.1?',
 o:['Compression only','Many concurrent requests over a single TCP connection without head-of-line blocking at the HTTP layer, which reduces latency for chatty clients','Encryption','Server push only'],a:1,
 e:'HTTP/2 still has TCP-level head-of-line blocking when a packet is lost, which is one of the motivations for HTTP/3 over QUIC. gRPC is built on HTTP/2 for this reason.'},

{q:'What does a service mesh sidecar typically NOT do?',
 o:['Mutual TLS','Retries and timeouts','Application business logic, which stays in the service and is deliberately outside the proxy','Traffic metrics'],a:2,
 e:'The sidecar handles network concerns so they are consistent across languages. Business logic in the proxy would couple the platform to every service, which is exactly what a mesh avoids.'},

/* 61–70: Caching & CDN deep dive */
{q:'What does the Cache-Control directive `stale-while-revalidate` enable?',
 o:['Serving stale content while refreshing in the background, improving latency at the cost of bounded staleness','Blocking until fresh','Disabling cache','Encrypting the cache'],a:0,
 e:'It is one of the most useful CDN directives: users get an immediate response from cache while the edge fetches an updated copy for the next request.'},

{q:'What is the difference between `no-cache` and `no-store`?',
 o:['They are the same','no-cache allows storage but requires revalidation before reuse; no-store forbids storing the response at all','no-cache is stronger','no-store only applies to CDNs'],a:1,
 e:'no-store is for genuinely sensitive data. Many APIs misuse no-store for everything, which destroys CDN and browser caching and increases origin load unnecessarily.'},

{q:'What is a cache key, and what usually goes wrong with it?',
 o:['A password','The set of request attributes that determine a cached response; omitting a dimension such as user, tenant, or Accept-Encoding returns the wrong content to someone','A hash of the URL only','A random id'],a:1,
 e:'Cache keys must include every header and path dimension that changes the response. `Vary: Accept-Encoding` exists precisely because compression changes the body for the same URL.'},

{q:'What does a CDN purge do, and why is it a risky operation?',
 o:['It encrypts content','It removes cached content at edge locations so the next request fetches fresh data; a purge bug or a purge of a broad pattern can cause a stampede to the origin','It slows down delivery','It clears DNS'],a:1,
 e:'Prefer versioned or hashed URLs so content is immutable and never needs purging. When a purge is necessary, coordinate it with origin capacity, because every edge will miss at once.'},

{q:'What does an origin shield add to a CDN architecture?',
 o:['A firewall','An additional caching layer between edge PoPs and the origin, so misses from many edges coalesce into a single request to the origin','Encryption','Compression'],a:1,
 e:'Origin shield dramatically reduces origin load during cache misses and cache churn, and it gives you a single place to apply origin-facing policies.'},

{q:'Why is serving static assets from a CDN generally cheaper than from your own servers?',
 o:['CDNs are free','The CDN terminates TLS and serves from caches close to users, so your origin handles far fewer requests and less bandwidth','CDNs compress better','CDNs do not use bandwidth'],a:1,
 e:'Offloading bandwidth and TLS handshakes is the main cost win, along with latency. The CDN becomes part of your security posture as well, absorbing floods at the edge.'},

{q:'When is edge computing (running logic at the CDN) appropriate?',
 o:['For all business logic','For latency-sensitive, stateless work such as personalisation, A/B routing, auth token validation and request shaping close to the user','For database writes','For batch jobs'],a:1,
 e:'Edge compute has tight limits on CPU, memory and state, and debugging is harder. It is best used for small, stateless transformations, not for the core domain logic.'},

{q:'What is a cache avalanche?',
 o:['A caching bug','A situation where a large portion of the cache becomes invalid simultaneously, sending a flood of traffic to the origin; TTL jitter and multi-tier caching mitigate it','A CDN failure','A DDoS attack'],a:1,
 e:'It is the large-scale version of a stampede. Randomising TTLs, warming caches after deploys, and using a shield or local tier are standard mitigations.'},

{q:'What does a write-through cache guarantee that a write-behind cache does not?',
 o:['Higher write throughput','That the cache and the backing store agree at the moment the write is acknowledged, at the cost of write latency','Lower latency','Better compression'],a:1,
 e:'Write-behind is faster but can lose writes if the cache node fails before flushing. The right choice depends on whether the cache is the source of truth or just an accelerator.'},

{q:'Why can caching make a consistency bug worse rather than better?',
 o:['It cannot','It hides staleness behind multiple layers with different TTLs, so fixing a value at the source does not clear it from every tier until each TTL expires','Caching always improves consistency','Caching is transactional'],a:1,
 e:'Layered caches multiply invalidation complexity. The fix is deliberate design: versioned keys, short TTLs for mutable data, and event-driven invalidation where correctness matters.'},

/* 71–80: Storage engines & NoSQL */
{q:'What is the fundamental difference between an LSM tree and a B-tree?',
 o:['They are the same','LSM buffers writes in memory and flushes immutable sorted runs to disk, optimising writes; B-trees update pages in place, optimising reads','LSM is read-optimised','B-trees cannot persist'],a:1,
 e:'LSM trees favour write-heavy workloads with sequential writes; B-trees favour read latency and predictable performance. The choice shows up in databases such as Cassandra versus PostgreSQL.'},

{q:'What is compaction in an LSM tree, and why does it matter?',
 o:['Compressing rows','Merging sorted runs into fewer, larger ones, removing overwritten and deleted entries; it is essential for read performance but costs significant write I/O','Encrypting data','Rebuilding indexes'],a:1,
 e:'Without compaction, reads must check more and more SSTables and space is never reclaimed. Compaction is the background work that makes LSM stores viable, and it is a frequent tuning point.'},

{q:'What does write amplification mean in an LSM store?',
 o:['One logical write causes multiple physical writes as data is flushed and repeatedly rewritten during compaction','Writes are encrypted','Writes are larger than reads','Writes are lost'],a:0,
 e:'A write-heavy store on SSDs must account for compaction I/O, because endurance and throughput are dominated by amplification, not by the logical write rate.'},

{q:'What is a column-family store such as HBase or Cassandra optimised for?',
 o:['Complex joins','Wide, sparse rows with fast access by row key, and efficient scans within a row\'s column families','Document search','Graph traversal'],a:1,
 e:'Row-key access and range scans are the sweet spot. Queries that do not include the row key usually require a secondary index or a full scan, which is expensive.'},

{q:'When is a document store such as MongoDB a good fit?',
 o:['When you need multi-row ACID across many tables','When an aggregate is naturally a document, read and written together, with a flexible or evolving schema','When you need heavy joins','When you need strong cross-document transactions at high volume'],a:1,
 e:'The document boundary is the atomic unit. Getting that boundary right — embedding what is read together — avoids the distributed-join problems that make document stores feel awkward.'},

{q:'What is a graph database primarily optimised for?',
 o:['Aggregations over billions of rows','Traversing relationships efficiently, such as multi-hop queries in social or fraud-detection graphs that would need many joins in a relational store','Full-text search','Key-value lookups'],a:1,
 e:'Index-free adjacency makes each hop cheap. Relational databases can model graphs, but multi-hop traversal performance degrades quickly with depth.'},

{q:'What is a time-series database optimised for?',
 o:['Transactional workloads','Append-heavy, time-ordered writes with range queries over time, and fast aggregation and retention policies for old data','Graph traversal','Document search'],a:1,
 e:'Time-series stores use columnar or chunked storage, time-based partitioning and downsampling, which is why generic databases struggle with the same write and retention patterns.'},

{q:'Why is the primary key choice so important in a key-value store?',
 o:['It is not important','It determines the partition placement; a poor key causes hot partitions, un-splittable chunks and costly cross-partition access','It encrypts the data','It compresses the data'],a:1,
 e:'A good key has high cardinality, matches the dominant access pattern, and spreads writes evenly. In DynamoDB, for example, the partition key is the single most consequential schema decision.'},

{q:'What does "read amplification" mean in a storage engine?',
 o:['More reads than writes','One logical read causes multiple physical reads, such as checking several SSTables or index levels before finding the data','Encrypted reads','Cached reads'],a:1,
 e:'Bloom filters, index blocks and caching reduce read amplification. It is the read-side counterpart to write amplification and is a key tuning dimension for LSM-based stores.'},

{q:'Why do many large systems keep the "source of truth" in an OLTP database and push analytics to a separate store?',
 o:['It is cheaper to run one database','OLTP and OLAP have opposite access patterns: OLTP needs many small indexed reads and writes, OLAP needs large scans and aggregations, so mixing them degrades both','Analytics databases cannot store data','OLTP databases cannot aggregate'],a:1,
 e:'This is the operational data store versus data warehouse split. CDC or streaming replication moves data to the analytical store without impacting transactional latency.'},

/* 81–90: Streaming & Kafka internals */
{q:'What does Kafka\'s partitioned log design provide that a traditional queue does not?',
 o:['Message encryption','Durable, ordered, replayable retention of messages per partition, with many independent consumer groups reading at their own offsets','Lower storage cost','Simpler routing'],a:1,
 e:'Retention is time- or size-based, not read-based, so replay and multiple independent consumers are possible. This is what enables both event sourcing and stream processing on the same data.'},

{q:'How does a Kafka consumer group enable parallel consumption while preserving per-key ordering?',
 o:['It assigns every partition to every consumer','It assigns each partition to exactly one consumer in the group, so per-partition order is preserved while the group processes partitions in parallel','It uses a single consumer','It disables offsets'],a:1,
 e:'The partition is the unit of parallelism and ordering. If you need 10 consumers to make progress, you need at least 10 partitions; consumers beyond that sit idle.'},

{q:'What does the Kafka ISR (in-sync replicas) set determine?',
 o:['The number of partitions','Which replicas are fully caught up with the leader and therefore eligible to be acknowledged (with acks=all) or elected leader','The topic retention','The consumer group'],a:1,
 e:'With acks=all and min.insync.replicas, Kafka refuses writes when too few ISR members remain. This is what turns replication into a durability guarantee.'},

{q:'What is the main architectural difference between Kafka and RabbitMQ?',
 o:['Kafka is a dumb log optimised for high-throughput retention and replay; RabbitMQ is a smart broker with rich routing, acknowledgements and per-message TTL','They are identical','RabbitMQ has no persistence','Kafka cannot guarantee ordering'],a:0,
 e:'Kafka favours throughput and replay; RabbitMQ favours flexible routing and classic queue semantics. Choosing between them is about the consumption model, not just performance.'},

{q:'What does change data capture (CDC) usually read from?',
 o:['Application logs','The database transaction log (binlog, WAL), emitting committed changes as a stream so downstream systems stay in sync without polling','The database indexes','The database cache'],a:1,
 e:'Debezium reading MySQL binlog or PostgreSQL logical replication is the common setup. CDC avoids touching application code, but it couples you to the database\'s log format and permissions.'},

{q:'What is a watermark in stream processing?',
 o:['A metric','A heuristic for tracking event-time progress, so the processor knows when a window is unlikely to receive more late events and can emit a result','A cache eviction rule','A replication setting'],a:1,
 e:'Watermarks trade latency against completeness. A later watermark waits longer for late data; an earlier one emits results sooner but may need to correct them.'},

{q:'What is the difference between tumbling, sliding and session windows?',
 o:['They are the same','Tumbling windows are non-overlapping fixed intervals; sliding windows overlap and advance by a step; session windows group events separated by an inactivity gap','Session windows are fixed-length','Tumbling windows overlap'],a:1,
 e:'The right choice follows the question being asked: "per minute" is tumbling, "last 5 minutes every minute" is sliding, and "user activity session" is a session window.'},

{q:'Why is exactly-once processing harder to achieve end-to-end than within the stream processor?',
 o:['It is not harder','The processor can make its own state and offsets transactional, but the external sink must also be idempotent or transactional for the effect to be exactly once','Exactly-once is impossible','Only Kafka supports it'],a:1,
 e:'Kafka Streams and Flink can make internal state and offsets atomic, but a database write or an HTTP call to a third party needs idempotency keys or a transactional connector to complete the guarantee.'},

{q:'What does a consumer offset represent?',
 o:['The number of consumers','The position of the next record to consume in a partition, committed so the consumer can resume there after a restart','The partition size','The broker id'],a:1,
 e:'Offsets are per consumer group per partition. Committing after processing gives at-least-once; committing before processing risks losing messages on failure.'},

{q:'What happens when a Kafka consumer processes a message slowly and exceeds max.poll.interval.ms?',
 o:['Nothing','The broker considers the consumer dead and triggers a rebalance, which pauses consumption and reassigns partitions','It is throttled','It is disconnected permanently'],a:1,
 e:'This is a common production incident. The fix is to reduce max.poll.records, move heavy work off the poll thread, or increase the interval, combined with idempotent processing to handle the resulting duplicates.'},

{q:'Why do many streaming architectures separate a "raw" topic from processed topics?',
 o:['To save storage','The raw topic is the durable, replayable source of truth; processed topics can be rebuilt by replaying it when logic changes or a downstream bug is fixed','To reduce cost','To enable encryption'],a:1,
 e:'Keeping raw events makes reprocessing possible, which is a superpower during incident recovery and for building new features over historical data.'},

/* 91–100: System-specific & multi-region */
{q:'For a global notification system, what is the main fan-out challenge?',
 o:['Encryption','A single event may need to reach millions of devices across providers, so you need per-channel queues, batching, deduplication, retries and provider-specific rate limits','Storing messages','Sorting messages'],a:1,
 e:'Notifications are a throughput and reliability problem: queue per channel or per region, deduplicate by event id, respect provider rate limits, and track delivery status per recipient.'},

{q:'For a chat application, why is a pub/sub layer behind the WebSocket gateway necessary?',
 o:['To encrypt messages','Users connected to different gateway instances need to receive the same message, so gateways publish and subscribe on a shared channel keyed by conversation','To compress messages','To store messages'],a:1,
 e:'The gateway holds connections; the pub/sub layer handles fan-out across nodes. Without it, only users on the same instance could talk, and scaling would be impossible.'},

{q:'What is the core difference between Operational Transformation (OT) and CRDTs for collaborative editing?',
 o:['They are the same','OT transforms concurrent operations against each other and needs a central server for ordering; CRDTs are mathematically commutative data types that can merge without coordination','CRDTs require a central server','OT cannot handle concurrency'],a:1,
 e:'OT is simpler to reason about with a central server, which is why Google Docs uses it. CRDTs shine for offline-first and peer-to-peer scenarios, at the cost of larger metadata and more complex data types.'},

{q:'For a system-wide counter (likes, views) at very high write rates, what is the most common approach?',
 o:['A single row with an atomic increment','Shard the counter across N rows or nodes and sum on read, accepting some coordination or approximation to gain throughput','Use a global lock','Use a queue'],a:1,
 e:'A single hot row becomes a write bottleneck. Sharded counters, CRDT counters, or approximate sketches are the standard alternatives; exactness versus throughput is the trade-off to make explicit.'},

{q:'How does a Snowflake-style ID generator produce sortable, unique IDs at scale?',
 o:['Random UUIDs','A structured 64-bit value composed of a timestamp, a machine or shard id and a per-millisecond sequence, so IDs are roughly time-ordered and unique per generator','A database auto-increment','A hash of the payload'],a:1,
 e:'Time-ordered IDs are friendlier to B-tree indexes than random UUIDs, which cause page splits. The cost is that clock skew and machine-id assignment must be handled carefully.'},

{q:'Why do random UUIDs hurt write performance in a B-tree-indexed table?',
 o:['They are longer','Their randomness scatters inserts across the index, causing page splits and cache misses; time-ordered ids like ULID or Snowflake keep writes concentrated at the end','They cannot be indexed','They collide'],a:1,
 e:'If you must use UUIDs, UUIDv7 or a time-prefixed variant recovers much of the locality benefit while keeping global uniqueness.'},

{q:'What does capacity planning for a new service primarily require?',
 o:['Picking a cloud provider','Estimating peak QPS, payload sizes, storage growth and retention, then adding headroom for bursts, failover and future growth','Choosing a language','Writing load tests only'],a:1,
 e:'Load tests validate the estimate, but the estimate comes first. Headroom is essential because a degraded cluster must survive losing a node without cascading.'},

{q:'What is the main goal of observability in a large system?',
 o:['Collecting every log line','Answering arbitrary questions about system behaviour without shipping new code, using metrics, structured logs, traces and SLOs tied together by correlation ids','Reducing storage cost','Replacing monitoring'],a:1,
 e:'The distinction from monitoring is that observability should let you debug a novel failure you have never seen before, not just alert on known thresholds.'},

{q:'Which of these is the most serious architectural anti-pattern in a distributed system?',
 o:['Using caching','A shared database across many services, because it couples their schemas, release cycles and failure domains','Using queues','Using load balancers'],a:1,
 e:'The shared database recreates monolith coupling with all the complexity of a distributed system and none of the autonomy. Independent data ownership is what makes the rest of the architecture work.'},

{q:'When is the right time to split a monolith into services?',
 o:['On day one','When team scaling, independent deployment cadence or a genuine scaling bottleneck demands it, and the domain boundaries are well understood','When the codebase exceeds 10,000 lines','When a new language is available'],a:1,
 e:'Premature decomposition produces distributed monoliths. Most successful splits happen after the domain is understood and a specific pressure (team size, deploy frequency, hot spot) is identified.'},

{q:'What does "consistency is a product decision" mean in practice?',
 o:['Consistency does not matter','Different features can tolerate different consistency models: a "likes" count can be eventually consistent while a payment balance cannot, so the model is chosen per feature','All features must be linearizable','Consistency is only a technical concern'],a:1,
 e:'Designing per-feature consistency lets you use cheaper, faster paths where the product allows it, while paying for strong consistency only where the business requires it.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>System Design Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
