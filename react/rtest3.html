<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Mock Test — Set 3 · 100 MCQs</title>
<meta name="description" content="100 advanced React MCQs: React Router 6.4+ data APIs, accessibility, animation, i18n, Web Workers, React Native, Suspense, context, testing, bundlers, XState, signals, refs, Fiber internals and SSR.">
<style>
  :root{--brand:#e11d48;--brand-dark:#9f1239;--accent:#fb7185;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#4c0519;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ffe4e6;border-color:#fecdd3}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(225,29,72,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#fff1f2}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ffe4e6}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⚛️ React Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–12: React Router 6.4+ data APIs */
{q:'In React Router v6, which component renders the matched child route of a parent layout route?',
 o:['<Outlet>','<Children>','<Switch>','<Slot>'],a:0,
 e:"<Outlet> is a placeholder in a layout route that renders whichever child route matched. Wrap a layout element around it to share headers, sidebars and error boundaries across nested routes."},

{q:'What does useLoaderData return in React Router 6.4+?',
 o:['The router configuration','The data resolved by the matched route\'s loader function before the component rendered','The navigation state','The parsed search params'],a:1,
 e:"The loader runs before the route renders and the resolved value is what useLoaderData returns. This is a framework-agnostic replacement for useEffect-based fetching on a per-route basis."},

{q:'What does useNavigation() return in React Router 6.4+?',
 o:['The current URL','The router instance','An object describing the in-flight navigation state such as "idle", "loading" or "submitting"','A function to navigate'],a:2,
 e:"Use it to build pending UI: show a spinner when navigation.state is 'loading', or disable a submit button when it is 'submitting'. It replaces the older useTransition from React Router."},

{q:'What does useSearchParams() return?',
 o:['Only the query string','A URL object','An array of key/value pairs','A tuple of the current URLSearchParams and a setter that updates the URL'],a:3,
 e:"It is modelled on useState: the first element is a read-only URLSearchParams and the second pushes a new search string. Use { replace: true } to avoid a history entry."},

{q:'How is a layout route defined in React Router v6?',
 o:['With a layout prop on the route','A route with an element that renders <Outlet> for its children','A special <Layout> component','A wildcard route with path="/*"'],a:1,
 e:"There is no separate layout concept: a parent route's element wraps its children, and <Outlet> is the slot. Pathless layout routes (no path prop) are common for shared chrome."},

{q:'In React Router 6.4+, what is a route action?',
 o:['A click handler on a link','A CSS class','A middleware','A function that runs on a non-GET navigation such as form submission, and can return data or a redirect'],a:3,
 e:"Actions handle mutations in the same routing model as loaders handle reads. Use <Form method=\"post\"> and the action runs, giving you progressive enhancement and no manual onSubmit wiring."},

{q:'Which two approaches are standard for lazily loading a route component in React Router?',
 o:['The route\'s lazy property (v6.4+) or React.lazy wrapped in <Suspense>','cache: false on the route','An <AsyncRoute> component','Dynamic route names'],a:0,
 e:"Route.lazy is the newer and simpler option: it takes a function returning the route module and integrates with the router's pending UI. React.lazy still works and is useful for library-agnostic code splitting."},

{q:'What does useLocation() return?',
 o:['A history function','The DOM location object','An object containing pathname, search, hash, state and key','The matched route element'],a:2,
 e:"The object changes on every navigation, so an effect with [location] as a dependency runs on each route change. Use it for analytics, scroll restoration or resetting local state on navigation."},

{q:'Which component automatically applies an "active" class or style to the link matching the current route?',
 o:['Link','a','RouteLink','NavLink'],a:3,
 e:"NavLink accepts a className or style prop that can be a function of isActive. By default it also sets aria-current='page' on the active link, which is what screen readers expect."},

{q:'What is the purpose of <ScrollRestoration /> in React Router 6.4+?',
 o:['It restores the scroll position on navigation, matching browser behaviour, using the ScrollRestoration component placed in a root layout','It restores form state','It resets the router','It persists the search params'],a:0,
 e:"Place it once in the root layout. React Router then restores scroll on back/forward and scrolls to top on new navigations, unless the location carries a scroll position in state."},

{q:'What is the recommended pattern for prefetching route data in React Router 6.4+?',
 o:['Setting prefetch="true" on <Link>','Calling router.prefetch(path) on hover or focus, or relying on route loaders that are reused across navigations','Using useEffect inside the route component','It is not supported'],a:1,
 e:"Loaders are cache-backed, so triggering router.prefetch on hover warms that cache and makes the click feel instant. Data-router frameworks often expose a prefetch prop on Link for this reason."},

{q:'When does a React component suspend?',
 o:['When it unmounts','When it throws an error','When it uses hooks conditionally','When it reads a promise (via use()) or renders a lazy component whose chunk is still loading'],a:3,
 e:"Suspension is React's way of pausing work until a resource is ready. React unwinds to the nearest Suspense boundary, shows its fallback, and resumes when the promise resolves."},

/* 13–20: Suspense advanced + Accessibility */
{q:'What does a <Suspense fallback={...}> boundary do?',
 o:['Renders the fallback while any descendant suspends, and swaps to the real UI once all descendants resolve','Renders the fallback on error','Blocks rendering forever','Shows the fallback only on the first render'],a:0,
 e:"The fallback is a loading placeholder, not an error state. Combine with an error boundary above it to handle thrown errors, since Suspense only deals with promises."},

{q:'What is the difference between one outer <Suspense> and several nested ones?',
 o:['They are identical','With several boundaries, each subtree streams in independently so one slow section does not block the rest','The outer one is faster','Nested Suspense is not supported'],a:1,
 e:"Per-section boundaries are how you get progressive rendering. Wrap the app shell in one boundary and each data-dependent region in its own, so the layout can appear immediately."},

{q:'Why can wrapping a state update in startTransition avoid showing a Suspense fallback?',
 o:['It skips the update','It disables Suspense','React keeps showing the previous UI for a non-urgent transition instead of suspending the whole tree','It runs the update in a worker'],a:2,
 e:"Transition updates do not replace the committed UI with a fallback. React keeps the old screen visible until the new one is ready, which is exactly the behaviour you want for tab switches and filter changes."},

{q:'What is aria-live="polite" used for?',
 o:['Announcing dynamic content changes to screen readers when the user is idle, without interrupting current speech','Setting the text direction','Marking a form field required','Disabling animations'],a:0,
 e:"Use it for status updates like toast messages or form results. role='status' is the implicit-live alternative. 'assertive' interrupts and should be reserved for urgent messages such as errors."},

{q:'What is the correct way to manage focus when a modal opens?',
 o:['Do nothing; the browser handles it','Move focus into the modal when it opens, trap Tab within it, and restore focus to the trigger when it closes','Scroll to the top of the page','Reload the page'],a:1,
 e:"Without this, keyboard users are lost in the page behind the modal. The <dialog> element with showModal() and libraries like Radix Dialog handle this for you; a hand-rolled modal almost always gets it wrong."},

{q:'What is a "skip to main content" link for?',
 o:['Navigation between routes','Lazy loading','Letting keyboard and screen-reader users bypass repeated navigation and jump straight to the main content','Tracking user actions'],a:2,
 e:"It is usually the first focusable element on the page and is visually hidden until focused. It saves keyboard users dozens of Tab presses on every page load."},

{q:'What is a keyboard trap?',
 o:['A CSS bug','A testing library','A router feature','A situation where focus cannot leave a component using the keyboard, which is an accessibility violation unless it is a deliberate modal focus trap'],a:3,
 e:"Accidental traps break keyboard navigation entirely. Deliberate traps are correct inside modals, but Escape must always close the modal and return focus to the trigger."},

{q:'What does aria-hidden="true" do?',
 o:['Hides visually with display: none','Removes an element and its subtree from the accessibility tree while leaving it visually rendered','Disables the element','Removes it from the DOM'],a:1,
 e:"Use it to hide decorative or duplicate content from screen readers. Never put it on focusable elements: a keyboard user can still reach something the screen reader cannot announce."},

/* 21–24: a11y continued + animation start */
{q:'When would you use role="alert" on a message?',
 o:['For decorative content','For every error','For urgent, assertive messages that should be announced to screen readers immediately, typically on error','For navigation'],a:2,
 e:"role='alert' is assertive by default, so it interrupts. Reserve it for important things the user needs to know now, and use role='status' for non-urgent notifications."},

{q:'Why is semantic HTML preferred over divs with ARIA roles?',
 o:['It is faster','It is required by React','It compiles to native code','It provides correct keyboard and screen-reader behaviour for free, and ARIA on a div does not replicate that behaviour'],a:3,
 e:"A <button role='button' on a div> still does not handle Space/Enter, focus management or disabled semantics. The first rule of ARIA is to use semantic HTML unless you absolutely cannot."},

{q:'What should the alt attribute contain for a decorative image?',
 o:['An empty string alt="" so the screen reader skips it','The filename','The word "image"','A long description'],a:0,
 e:"An empty alt tells the screen reader the image is decorative and can be skipped. Omitting alt entirely makes some screen readers read the filename, which is worse."},

{q:'What is Framer Motion primarily used for?',
 o:['State management','Routing','Declarative animations and gestures for React, with motion components, AnimatePresence and layout animations','Testing'],a:2,
 e:"It is the de facto animation library for React. The motion component wraps the element with animatable props, and AnimatePresence handles the exit-animation problem that CSS alone cannot solve."},

/* 25–31: Animation + i18n start */
{q:'What is the simplest way to add a fade-in to a component using only CSS?',
 o:['Use useState','Use a portal','Use useEffect and setTimeout','Toggle a class (or mount state) that adds a transition or @keyframes animation'],a:3,
 e:"Mount a class and let CSS handle the timing. Libraries like Framer Motion and react-spring are for coordination, gestures and orchestration, not for a single opacity transition."},

{q:'What does AnimatePresence from Framer Motion do?',
 o:['Keeps a component mounted long enough to play its exit animation when it is removed from the tree','Animates every render','Prevents unmounting forever','Disables animations'],a:0,
 e:"Without it, a component disappears the instant React unmounts it. AnimatePresence defers the actual removal until the exit animation completes, which is essential for modals, toasts and route transitions."},

{q:'Which CSS properties are safest to animate for smooth 60fps animation?',
 o:['width, height, top, left','transform and opacity, which can be handled on the compositor without layout or paint','box-shadow','filter'],a:1,
 e:"Transform and opacity skip layout and paint. Width/height/top/left trigger reflow on every frame, which is why layout-driven animations jank on slower devices."},

{q:'What is react-transition-group for?',
 o:['State management','Routing','Testing','Low-level transition state management for enter/exit classes, without doing the CSS itself'],a:3,
 e:"It gives you the class names (enter, enter-active, exit, exit-active) at the right moments, and you supply the CSS. It is smaller and less opinionated than Framer Motion."},

{q:'How should you respect a user\'s prefers-reduced-motion preference?',
 o:['Wrap animations in a @media (prefers-reduced-motion: reduce) query or check window.matchMedia and disable or reduce animation','Ignore it','Disable all JavaScript','Use only JavaScript animations'],a:0,
 e:"Some users experience vestibular disorders and need motion reduced. A common approach is to replace slides and parallax with a simple fade, and to disable auto-playing animation entirely."},

{q:'What do layout animations in Framer Motion do?',
 o:['Animate CSS variables','Smoothly transition a component\'s position and size when the layout changes, using FLIP under the hood','Animate the DOM directly','Prevent reflows'],a:1,
 e:"The layout prop measures before and after and interpolates the difference. FLIP (First, Last, Invert, Play) achieves this without triggering layout on every frame."},

{q:'What does react-i18next provide?',
 o:['A CSS framework','A router','Internationalisation with useTranslation, translation files, interpolation and pluralisation','A state manager'],a:2,
 e:"The useTranslation hook returns t, which looks up keys in namespace files. It also handles interpolation, pluralisation, context and lazy-loading of translation bundles per locale."},

/* 32–36: i18n + Web Workers */
{q:'What is the Intl API used for in a React app?',
 o:['Formatting dates, numbers, currency and relative times according to the user\'s locale, without any extra library','Sending HTTP requests','Routing','Styling'],a:0,
 e:"Intl.DateTimeFormat, Intl.NumberFormat and Intl.RelativeTimeFormat are built into every modern browser. They cover most formatting needs without adding date-fns, dayjs or Luxon."},

{q:'What CSS approach best supports both LTR and RTL layouts?',
 o:['Hard-coded margin-left','Logical properties such as margin-inline-start and padding-inline-end','Separate stylesheets per language','JavaScript positioning'],a:1,
 e:"Logical properties follow the writing direction automatically, so setting dir='rtl' on the html element flips the layout without touching the CSS. Tailwind exposes them as ms-* and me-*."},

{q:'How do you sort a list of names according to a specific locale?',
 o:['names.sort()','names.sort((a, b) => a.localeCompare(b)) without locale','names.sort((a, b) => a.localeCompare(b, \'de\')) passing the locale','Sorting by length'],a:2,
 e:"Without a locale, localeCompare uses the runtime's default, which may differ between the server and the user's browser. Passing the user's locale makes sorting predictable."},

{q:'Why is it better to use translation keys rather than English strings as keys?',
 o:['It is faster','It is required by react-i18next','It allows type safety','It decouples the source from the wording, so changing copy does not orphan translations or break the lookup'],a:3,
 e:"With English-as-key, renaming 'Save' to 'Save changes' breaks every translation. With a stable key like actions.save, you only change the values."},

{q:'When should you move work into a Web Worker in a React app?',
 o:['For every calculation','For CPU-heavy work that would otherwise block the main thread and freeze the UI','For all network requests','For all state updates'],a:1,
 e:"Rendering, parsing large JSON, image processing, crypto and large sorts are the classic candidates. Network I/O is already async and does not need a worker."},

/* 37–40: Workers + React Native */
{q:'How do you communicate with a Web Worker?',
 o:['By sharing React state','By calling a function directly','Via postMessage and the message/messageerror event handlers, or a MessageChannel','Via a Redux store'],a:2,
 e:"postMessage takes a structured-clone-serialisable value. Transferable objects such as ArrayBuffer can be moved instead of copied for zero-copy performance."},

{q:'What is the typical hook pattern for using a Web Worker in React?',
 o:['There is no standard pattern','Call new Worker() inside the render','Store the worker in useState','Create the worker once in a useRef or useEffect, listen for messages, and terminate it in the cleanup'],a:3,
 e:"The cleanup is critical. Without terminate() in the effect cleanup, Strict Mode remounts in development will spin up duplicate workers, and every hot reload will leak another one."},

{q:'What React feature can help keep the UI responsive without moving work to a Worker?',
 o:['Marking the update as non-urgent with startTransition, or splitting the work into chunks that yield to the browser','Using useState instead of useReducer','Disabling Strict Mode','Using useLayoutEffect'],a:0,
 e:"startTransition lets React interrupt the work if something urgent comes in. It does not reduce total compute, so truly heavy work still belongs in a worker."},

{q:'How does React Native render UI differently from React DOM?',
 o:['It targets native platform components (UIView on iOS, android.View on Android) through a bridge or the new architecture, rather than browser DOM nodes','It renders to WebGL','It renders only to WebView','It does not support React'],a:0,

/* 41–48: React Native */
{q:'In React Native, how are styles applied?',
 o:['With CSS files','With a JavaScript style prop and StyleSheet.create, since there is no CSS cascade','With Tailwind','With SCSS'],a:1,

{q:'Which library is commonly used for performant gesture handling in React Native?',
 o:['React Router','Redux','react-native-gesture-handler and react-native-reanimated','Jest'],a:2,
 e:"The two are designed to work together: gesture-handler processes gestures on the native thread, and reanimated runs animations on the UI thread, so the JavaScript thread being busy does not drop frames."},

{q:'What does Expo add to React Native?',

{q:'What does React Native\'s FlatList provide?',

{q:'How do you write platform-specific code in React Native?',
 o:['With if (browser)','By duplicating the app','Using Platform.OS or platform-specific files like Button.ios.js and Button.android.js','It is impossible'],a:2,

{q:'What is Hermes?',
 o:['A CSS framework','A router','A UI library','A JavaScript engine optimised for React Native, improving startup time and memory use'],a:3,

{q:'What is the React Native "New Architecture"?',
 o:['The combination of Fabric (renderer), TurboModules (native modules) and JSI, replacing the older async bridge with more direct, synchronous native calls','A new UI kit','A new bundler','A test framework'],a:0,

{q:'What is a common performance problem with Context?',

/* 49–56: Context advanced + component patterns */
{q:'How do you reduce unnecessary re-renders from Context?',
 o:['Use useRef','Wrap everything in React.memo','Pass the same object every render','Split context by concern, memoize the value, or select with a store'],a:3,

{q:'Why might you compose several providers into a single AppProviders component?',
 o:['It centralises provider nesting, improves readability, and lets you reorder or add providers in one place','It makes the app faster by default','It is required by React','It prevents re-renders'],a:0,

{q:'When is the default value passed to createContext used?',
 o:['Always','Only when a component reads the context with no matching Provider above it','Only in production','Only in class components'],a:1,
 e:"The default is a fallback for the 'no Provider' case. Common practice is to pass a sentinel object and throw when read, so missing Providers fail loudly during development."},

{q:'Why is the Context + useReducer pattern usually preferred over Context + useState for app state?',
 o:['It is faster','It uses less memory','It avoids the provider','It centralises transitions in a reducer, keeps updates predictable, and lets you pass dispatch (which is stable) instead of many setters'],a:3,

{q:'What is a headless component?',
 o:['A component that provides logic and state but delegates all rendering to the consumer, usually via props, render props or hooks','A component with no props','A component with no state','A component that renders nothing'],a:0,
 e:"Downshift, Radix primitives and React Aria are headless or primitives-based libraries. They ship accessibility and behaviour, and you supply the markup and styles."},

{q:'What is a polymorphic component with an as prop used for?',

{q:'What is the "slots" pattern in React?',
 o:['Using CSS grid','A router feature','Passing React elements as named props, such as header and footer, so a layout can place them in specific regions','A Redux pattern'],a:2,

{q:'Why might a reusable input support both controlled and uncontrolled use?',
 o:['It lets callers choose: pass value and onChange for controlled, or defaultValue for uncontrolled, matching the conventions of native form elements','It is required by React','It improves performance','It enables SSR'],a:0,
 e:"This is exactly how native <input> works, so a wrapper should behave the same way. The trick is to track internal state as a fallback only when value is not supplied."},

/* 57–64: Hybrid inputs + GraphQL */
{q:'How do you type a forwardRef component that is also generic?',
 o:['It cannot be generic','You cast it or use a small helper that applies the generic signature to the returned component','Use any','Use a class component'],a:1,

{q:'What is the risk of spreading all props onto a DOM element in a wrapper component?',

{q:'Why have custom hooks largely replaced render props for logic reuse?',
 o:['Render props are deprecated','Hooks are faster','Render props do not work with TypeScript','Hooks share logic without adding a component to the tree or forcing a specific render shape'],a:3,

{q:'What does Apollo Client provide for a React app?',
 o:['Only React components','A GraphQL client with a normalised cache, hooks such as useQuery and useMutation, and cache updates after mutations','A CSS framework','A router'],a:1,
 e:"The normalised cache stores entities by id and type, so updating a User after a mutation automatically re-renders every component that reads that User, wherever they are on the page."},

{q:'What distinguishes Relay from Apollo?',
 o:['Relay does not support React','Relay is not for GraphQL','Relay is more opinionated, requires compile-time GraphQL artefacts and enforces pagination and mutation conventions, giving stronger guarantees','Relay is a Redux library'],a:2,

{q:'Why is cursor-based pagination usually preferred over offset pagination for feeds?',
 o:['Offsets are not supported in GraphQL','Cursors are shorter','Cursors are easier to cache','Cursor pagination is stable when items are inserted or removed, whereas offsets can skip or duplicate rows'],a:3,

{q:'How can you prefetch data for a route that the user has not yet navigated to?',
 o:['On link hover or focus, trigger the route\'s loader or fetch the query, warming the cache so the navigation feels instant','Only on click','Using useEffect in the destination route','It is not possible'],a:0,

{q:'What is Mock Service Worker (MSW) used for?',
 o:['Rendering components','Managing server state','Intercepting network requests at the network level in tests and development, so your code uses real fetch while receiving mock responses','Generating type definitions'],a:2,
 e:"MSW uses a service worker in the browser and an interceptor in Node. Because it sits below fetch, your data layer, error handling and loading states are all exercised as written."},

/* 65–72: Testing advanced */
{q:'Why is MSW often preferred over mocking a data-fetching module directly?',
 o:['MSW is faster','Module mocks are deprecated','MSW does not require setup','MSW exercises the real fetch path, so your app code and request handling are tested as written'],a:3,

{q:'When would you reach for Playwright or Cypress instead of React Testing Library?',

{q:'What is visual regression testing?',

{q:'What does consumer-driven contract testing verify?',
 o:['The CSS','The database schema','The build pipeline','That a provider\'s actual responses still satisfy the exact expectations of its consumers, without a full end-to-end environment'],a:3,

{q:'Why is jest.mock hoisted to the top of the file?',

{q:'What does test.each do?',

{q:'When would you use jest.useFakeTimers()?',

{q:'Which of these is a primary responsibility of Webpack in a React project?',

{q:'In Vite, how are environment variables exposed to client code?',

{q:'What are the precedence rules for .env files in Vite?',

{q:'What is the public folder in a Vite project for?',

{q:'What is XState for?',

/* 81–88: XState, signals, monitoring */
{q:'When is a finite state machine a better fit than useState?',

{q:'What is the XState visualiser?',
 o:['A tool that renders the state machine diagram and lets you simulate events to explore transitions','A CSS tool','A test runner','A bundler'],a:0,

{q:'What are signals (as in Preact Signals or the React RFC) meant to solve?',
 o:['Routing','Fine-grained reactivity, so only the parts of the UI that read a value re-render when it changes','Type safety','SSR'],a:1,
 e:"Signals track their own readers. When a signal changes, the framework can update just those DOM nodes or components instead of re-rendering the component that owns the state."},

{q:'How do signals differ from React state hooks in terms of re-rendering?',
 o:['They are identical','Signals re-render more','Signals do not trigger renders','Signals can update just the DOM nodes or components that read them, instead of re-rendering the whole component that owns the state'],a:3,

{q:'How does MobX trigger re-renders?',
 o:['By making observable state and re-rendering only the observer components that read it, with automatic dependency tracking','By diffing props','By context','By polling'],a:0,

{q:'What does the web-vitals library measure?',
 o:['Bundle size','Core Web Vitals such as LCP, INP and CLS, and lets you report them to an analytics endpoint','Memory usage','Type coverage'],a:1,

{q:'What is Real User Monitoring (RUM)?',
 o:['Testing on a real device in CI','Watching server logs','Collecting performance and error data from real users in production to understand actual experience','A type of unit test'],a:2,

{q:'When would you use a callback ref instead of an object ref?',
 o:['When you need to run logic at the moment the element mounts or unmounts, such as measuring or registering listeners','When you need a ref to a DOM node','To store a mutable value','To pass to forwardRef'],a:0,
 e:"A callback ref is a function that receives the node (or null on unmount). It is the correct choice when you need a hook into the mount lifecycle rather than a stable object."},

/* 89–96: Refs, Fiber, SSR */
{q:'What changed about refs in React 19?',
 o:['Refs are removed','A callback ref can return a cleanup function that runs when the element unmounts or the ref changes','Refs can now hold state','Refs are async'],a:1,
 e:"The cleanup function is symmetric with useEffect, so you can undo work done in the callback ref without tracking it separately. It also removes the need to check for null in the callback."},

{q:'Why does forwardRef exist (before React 19)?',
 o:['To give refs to hooks','To create refs','So a function component could accept and pass a ref to an inner element or node, since refs are special props','To prevent prop drilling'],a:2,
 e:"Before React 19, ref was not a normal prop: React stripped it. forwardRef gave components a way to receive it. React 19 makes ref a normal prop, and forwardRef remains for compatibility."},

{q:'Is a useRef object stable across renders?',
 o:['No, it is recreated every render','Only with useMemo','Only in Strict Mode','Yes, the same object (and .current) persists across renders for the component\'s lifetime'],a:3,

{q:'What are "lanes" in React\'s Fiber architecture?',
 o:['Worker threads','A priority encoding mechanism that lets React group and schedule updates by urgency','CSS layers','Test categories'],a:1,
 e:"A lane is a bit in a bitmask. Updates are assigned to lanes based on their priority, and React processes the highest-priority lanes first, interrupting lower-priority work as needed."},

{q:'What are the current and workInProgress trees in React\'s Fiber architecture?',
 o:['Server and client trees','Two different components','The committed tree and the tree being built during the next render, with React swapping them on commit','Shadow DOM trees'],a:2,
 e:"This is double buffering. React never mutates the current tree during render, so a render can be abandoned without corrupting the committed UI. The swap happens atomically in the commit phase."},

{q:'Why does React do a render pass and then a commit pass?',
 o:['Because JavaScript is single-threaded','Because of React Native','Because of SSR','So the render pass can be pure, interruptible and restartable, and the commit pass applies DOM changes synchronously and atomically'],a:3,

{q:'Which server renderer should you choose for an app with Suspense and streaming data?',

{q:'When is renderToStaticMarkup appropriate?',
 o:['For interactive apps','For client-side rendering','For generating static HTML without React\'s client-side hydration attributes, such as email templates or non-interactive pages','For SSR with hydration'],a:2,

/* 97–100: SSR, Strict Mode */
{q:'What is selective hydration in React 18?',
 o:['Hydrating the whole tree at once','Hydrating only on user interaction','Disabling hydration','React hydrating Suspense boundaries independently so user interactions can prioritise parts of the page that need to be interactive first'],a:3,

{q:'In React 18+ Strict Mode, what is double-invoked in development?',
 o:['Render functions, updater functions, initialisers passed to useState and useMemo, and effect setup plus cleanup (mount, unmount, remount)','Only render','Only effects','Nothing'],a:0,
 e:"The goal is to surface impure render logic and missing cleanup. If something breaks under Strict Mode but not in production, that is almost always a real bug, not a Strict Mode problem."},

{q:'Why does Strict Mode deliberately mount, unmount and remount effects in development?',
 o:['To slow down development','To surface missing cleanup functions, which would otherwise leak subscriptions or duplicate requests after a real remount','To test SSR','It does not'],a:1,

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + esc(q.q) + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + esc(q.e) + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
