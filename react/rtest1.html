<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Mock Test — 100 MCQs</title>
<meta name="description" content="100 React MCQs: JSX, components, props vs state, hooks, rendering, reconciliation, context, memo, Suspense, routing, testing and modern React 18/19 patterns.">
<style>
  :root{--brand:#087ea4;--brand-dark:#043b4f;--accent:#61dafb;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#043b4f;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0f2fe;border-color:#bae6fd}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(8,126,164,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#e0f2fe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⚛️ React Mock Test <span class="setpill">FUNDAMENTALS</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Foundations */
{q:'What is React primarily used for?',
 o:['Server-side databases','Building user interfaces with a component-based model','Container orchestration','Machine learning'],a:1,
 e:'React is a library for building UIs. It describes what the interface should look like for a given state, and React efficiently updates the DOM to match.'},

{q:'What is JSX?',
 o:['A browser API','A syntax extension that looks like HTML but compiles to JavaScript function calls','A CSS preprocessor','A build tool'],a:1,
 e:'JSX is syntactic sugar for React.createElement (or the modern jsx runtime). Babel or a bundler plugin compiles it into JavaScript at build time.'},

{q:'What does `const el = <h1>Hello</h1>` compile to with the automatic runtime?',
 o:['document.createElement("h1")','React.createElement("h1", null, "Hello")','_jsx("h1", {children:"Hello"})','innerHTML = "Hello"'],a:2,
 e:'The automatic JSX runtime (React 17+) imports a jsx function from react/jsx-runtime. The classic runtime used React.createElement.'},

{q:'What is a React component?',
 o:['An HTML tag','A reusable piece of UI described by a JavaScript function that returns elements','A CSS class','A database table'],a:1,
 e:'A function component takes props and returns JSX. Components compose into a tree, and React renders that tree into the DOM.'},

{q:'Which of these is NOT a valid way to define a React component in modern React?',
 o:['A function returning JSX','An arrow function returning JSX','A class extending React.Component','A plain JavaScript object with a render key'],a:3,
 e:'Class components are still supported but legacy. A plain object is not a component; React requires a function or class. Function components are the recommended approach.'},

{q:'What is a pure function in the React sense?',
 o:['A function that mutates its arguments','A function that returns the same output for the same input and has no side effects','A function that only returns null','A function that fetches data'],a:1,
 e:'React components must be pure with respect to their props and state, because React may call them multiple times or discard their result during concurrent rendering.'},

{q:'Why must React component names start with a capital letter?',
 o:['It is a JavaScript requirement','Lowercase tags are treated as host elements (strings); uppercase signals a component reference','It makes them faster','It enables TypeScript'],a:1,
 e:'JSX distinguishes <div /> (a string tag) from <MyComponent /> (a variable reference). Lowercasing a component makes React try to render an unknown HTML tag.'},

{q:'What is ReactDOM.createRoot used for?',
 o:['Creating an HTML element','Creating the React 18 root for concurrent rendering and rendering the app into a DOM node','Starting a dev server','Creating a context'],a:1,
 e:'createRoot replaces ReactDOM.render in React 18. It enables concurrent features such as automatic batching, transitions and Suspense.'},

{q:'What does React.StrictMode do?',
 o:['Disables development warnings','Enables additional development checks, such as double-invoking effects and detecting unsafe lifecycles','Blocks network requests','Enforces TypeScript'],a:1,
 e:'StrictMode surfaces potential problems early. The double invocation of effects in development is intentional, to reveal missing cleanup logic. It has no effect in production.'},

{q:'Is JSX required to use React?',
 o:['Yes, always','No, JSX is optional; you can call createElement directly or use alternative templating','Only in TypeScript','Only with class components'],a:1,
 e:'JSX is a convenience. React works without it, and libraries such as htm or hyperscript offer alternatives. JSX is the de facto standard because it reads well.'},

/* 11–22: Props, state and rendering */
{q:'What is the difference between props and state?',
 o:['They are the same','Props are read-only inputs passed from the parent; state is internal, mutable data managed by the component itself','Props are mutable; state is immutable','State is passed from the parent; props are internal'],a:1,
 e:'Props flow down and must not be mutated by the child. State is owned by the component and changed via setState or the setter from useState, which triggers a re-render.'},

{q:'What happens when you call a state setter with the same value as the current state?',
 o:['React always re-renders','React may bail out of re-rendering, depending on Object.is comparison','React throws an error','React resets the component'],a:1,
 e:'React uses Object.is to compare the new value with the current one. If they are equal, it typically skips the re-render, which is why new object literals always trigger one.'},

{q:'Why can batching cause `count` to appear stale inside an event handler?',
 o:['Because state updates are async in the sense that the value is captured in the closure for that render','Because React mutates state directly','Because state is stored in a database','Because setState is synchronous'],a:0,
 e:'Each render captures its own state value. Calling setCount(count + 1) twice in the same handler uses the same captured count, so use the updater form: setCount(c => c + 1).'},

{q:'What does the updater form of a state setter guarantee?',
 o:['That the update is skipped','That the update is applied to the latest queued state, so multiple updates compose correctly','That the render is synchronous','That the state is persisted'],a:1,
 e:'React processes queued updater functions in order, each receiving the previous result. This is why setCount(c => c + 1) twice increments by two.'},

{q:'Is state shared between two instances of the same component?',
 o:['Yes, state is global to the component type','No, each instance has its own independent state','Only with useState','Only in class components'],a:1,
 e:'Each rendered component instance owns its state. Sharing state requires lifting it to a common ancestor or using context or an external store.'},

{q:'What is "lifting state up"?',
 o:['Moving state to a global store','Moving state to the closest common ancestor of the components that need it, passing it down via props','Moving state to the server','Storing state in localStorage'],a:1,
 e:'Lifting state is the standard React answer to sibling communication: the parent holds the state and passes the value and a callback down to both children.'},

{q:'What is a controlled component?',
 o:['A component with an internal ref','A component whose form value is driven by React state and updated via onChange','A component that cannot re-render','A component with no props'],a:1,
 e:'With a controlled input, value comes from state and onChange updates it, so React is the single source of truth. An uncontrolled input keeps its state in the DOM and is read with a ref.'},

{q:'When is an uncontrolled component with useRef appropriate?',
 o:['When you need to validate on every keystroke','When you need a simple form or integration with a non-React library and do not need React to drive the value','When you need to render on server','When you need state to persist across renders'],a:1,
 e:'Uncontrolled inputs reduce re-renders for large forms and simplify file inputs, which are always uncontrolled. Controlled inputs are better when the value affects other UI.'},

{q:'What does `{condition && <Component />}` do?',
 o:['Renders Component only when condition is truthy; if condition is 0 it renders the number 0','Always renders Component','Throws an error','Renders nothing, ever'],a:0,
 e:'A falsy left operand is returned as-is, so 0 renders visibly. Use `condition ? <Component /> : null` or coerce to boolean when the value can be 0.'},

{q:'Why do lists need a `key` prop?',
 o:['For styling purposes','Keys let React identify which items moved, were added or were removed, so it can reconcile efficiently and preserve state','Keys are required by JSX','Keys enable server rendering'],a:1,
 e:'Using array index as a key is a common bug: inserting at the front shifts every index, causing React to reuse the wrong DOM nodes and component state.'},

{q:'What is the difference between `null` and `undefined` as a JSX return value?',
 o:['Both render nothing; neither is an error','null renders nothing; undefined throws an error','undefined renders nothing; null throws','Both throw'],a:0,
 e:'As a return value, both render nothing. But undefined as a prop or child inside an object can cause issues. Returning null is the clearer, conventional way to render nothing.'},

{q:'What does an empty fragment `<>...</>` do?',
 o:['Renders an empty div','Groups children without adding a wrapper element to the DOM','Creates a portal','Creates a context'],a:1,
 e:'Fragments solve the "one root element" requirement without polluting the DOM. `<React.Fragment key={...}>` is the keyed variant when you need a key on a fragment.'},

/* 23–40: Hooks */
{q:'What is the rule about where hooks may be called?',
 o:['Anywhere in the component, including inside conditions and loops','Only at the top level of a function component or a custom hook, never inside conditions, loops or nested functions','Only inside event handlers','Only inside class methods'],a:1,
 e:'React relies on call order to match hooks to their state slots. Conditional or looped calls break that mapping, which is why the Rules of Hooks exist and the linter enforces them.'},

{q:'What does useEffect run after?',
 o:['The component renders and the DOM is committed','The component is scheduled','State is initialised','The browser paints the first frame only'],a:0,
 e:'Effects run after commit, which means the DOM is updated. Effects are asynchronous relative to paint; use useLayoutEffect if you must measure or mutate the DOM before paint.'},

{q:'What does the dependency array of useEffect control?',
 o:['The effect\'s return value','Which values the effect "depends" on: the effect re-runs only when one of those values changes between renders','How often React renders','The effect\'s cleanup timing'],a:1,
 e:'An empty array means run once on mount. Omitting the array runs after every render. React compares entries with Object.is, so unstable object or function values re-run the effect.'},

{q:'What is the cleanup function in useEffect for?',
 o:['To reset state','To undo subscriptions, timers, listeners or in-flight requests when the effect re-runs or the component unmounts','To force a re-render','To memoise a value'],a:1,
 e:'Returning a function from the effect registers cleanup. Missing cleanup is the most common source of memory leaks and "set state on unmounted component" warnings.'},

{q:'What does useLayoutEffect differ from useEffect in?',
 o:['useLayoutEffect runs synchronously after DOM mutations but before the browser paints','useLayoutEffect runs on the server only','useEffect is faster in all cases','They are identical'],a:0,
 e:'useLayoutEffect blocks paint, so it is right for measuring layout or synchronously adjusting the DOM. Overusing it hurts performance, and it warns during server rendering.'},

{q:'What is useRef useful for?',
 o:['Triggering re-renders','Holding a mutable value that persists across renders without causing re-renders, or referencing a DOM node','Replacing useState entirely','Caching fetch responses'],a:1,
 e:'The ref object is stable, and changing ref.current does not re-render. This makes it ideal for timer IDs, previous values, and DOM handles.'},

{q:'What does useMemo do?',
 o:['Memoises the component itself','Caches the result of a computation between renders, recomputing only when dependencies change','Caches a DOM node','Replaces useEffect'],a:1,
 e:'useMemo is a performance optimisation for expensive calculations. It is not a semantic guarantee, and React may discard memoised values, so never rely on it for correctness.'},

{q:'What does useCallback do?',
 o:['Caches the result of a function call','Returns a memoised version of a function that stays stable between renders unless dependencies change','Calls a function after render','Replaces useMemo'],a:1,
 e:'useCallback(fn, deps) is equivalent to useMemo(() => fn, deps). It matters when passing callbacks to memoised children or as effect dependencies.'},

{q:'What does useReducer offer over useState?',
 o:['Faster updates in all cases','Centralised state transitions through a reducer function, better for complex state logic with multiple related fields','Server-side rendering','Direct DOM access'],a:1,
 e:'useReducer makes updates explicit and testable, and it pairs naturally with context for passing dispatch down without prop drilling. It also avoids stale closures on state updates.'},

{q:'What does useContext do?',
 o:['Creates a new context','Reads the current value from the nearest matching Provider above the component and re-renders when that value changes','Updates the context value','Deletes a context'],a:1,
 e:'Context solves prop drilling. Any change to the provider value re-renders every consumer, so split contexts by update frequency and memoise values.'},

{q:'What is a custom hook?',
 o:['A hook built into React','A JavaScript function whose name starts with "use" and that calls other hooks, letting you extract and reuse stateful logic','A class component','A Redux reducer'],a:1,
 e:'Custom hooks share logic, not state: each call site gets its own isolated state. They are the primary mechanism for reuse in function components.'},

{q:'Can a custom hook share state between two components?',
 o:['Yes, by definition','No, each call to a hook gets its own state; to share state you must lift it, use context or use an external store','Only if the hook is exported','Only with useReducer'],a:1,
 e:'This is a frequent misunderstanding. Custom hooks are about logic reuse. State sharing requires a common provider or an external store.'},

{q:'What does the dependency array of useCallback/useMemo need to contain?',
 o:['Only primitive values','Every reactive value read inside the callback or computation, including props, state and functions','Only state values','Nothing, the array is optional'],a:1,
 e:'Missing dependencies cause stale closures. The exhaustive-deps ESLint rule catches this. Adding an unstable function or object to the array defeats the memoisation, which usually means the value should itself be memoised or moved.'},

{q:'What is an "effect loop"?',
 o:['A loop inside useEffect','An effect that updates state it depends on, causing the effect to re-run and update again indefinitely','A recursive component','A rendering error'],a:1,
 e:'The usual cause is an unstable dependency (a new object or array every render) or setting state unconditionally in an effect. Fix the dependency or move the computation out of the effect.'},

{q:'What is the difference between useId and a random id?',
 o:['They are the same','useId produces a stable, SSR-safe id that matches between server and client, avoiding hydration mismatches','useId is deprecated','useId only works in class components'],a:1,
 e:'useId is designed for accessibility attributes. Generating a random id on the server and again on the client produces a mismatch and broken aria references.'},

{q:'What does useSyncExternalStore provide?',
 o:['A way to subscribe to an external store and read a consistent snapshot, designed for React 18 concurrent rendering','A replacement for useState','A caching primitive','A scheduling primitive'],a:0,
 e:'Libraries such as Redux and Zustand use it internally so external state is consistent with concurrent rendering and tearing is avoided.'},

{q:'What is useTransition for?',
 o:['Animating a component','Marking a state update as non-urgent so React can keep the interface responsive and interrupt the update if needed','Deferring a fetch','Batching effects'],a:1,
 e:'useTransition returns [isPending, startTransition]. Urgent updates such as typing stay synchronous, while the expensive result can render concurrently.'},

{q:'What does useDeferredValue do?',
 o:['Delays a fetch','Returns a deferred version of a value that trails the latest value, so an expensive subtree can re-render with the older value first','Caches a value','Suspends a component'],a:1,
 e:'It is useful for expensive lists that depend on a search input. The input updates immediately, while the list lags slightly behind, keeping typing responsive.'},

/* 41–50: Rendering & reconciliation */
{q:'What is reconciliation?',
 o:['The process of merging CSS','The algorithm React uses to compare the new element tree with the previous one and compute the minimal DOM updates','The bundling step','The server rendering step'],a:1,
 e:'React diffs by position and key. Matching types and keys are preserved and updated; mismatches unmount the old subtree and mount a new one, discarding state.'},

{q:'Why does using an index as a list key cause bugs?',
 o:['Indexes are always invalid keys','When items are inserted or removed, indices shift, so React reuses elements and state for the wrong items','Indexes are not unique','Indexes slow down rendering'],a:1,
 e:'This is especially visible with inputs: typing into the third row and then deleting the first row makes the typed value appear in the wrong row, because component state was attached by position.'},

{q:'What happens when the element type at a position changes, such as from <div> to <span>?',
 o:['React patches the attributes','React unmounts the old subtree and mounts a new one, discarding any state below it','React throws an error','React merges the elements'],a:1,
 e:'Changing type invalidates the subtree. The same effect explains why conditionally rendering different components at the same position resets their state unless keys are used.'},

{q:'What is the virtual DOM?',
 o:['A browser feature','An in-memory description of the UI that React compares to compute DOM updates','A separate rendering engine in the browser','A CSS framework'],a:1,
 e:'The virtual DOM is a lightweight tree of plain objects. Diffing it against the previous tree gives React the minimal set of real DOM operations to perform.'},

{q:'What is React Fiber?',
 o:['A CSS framework','The internal reconciliation engine introduced in React 16 that supports incremental rendering and prioritisation','A React router','A testing library'],a:1,
 e:'Fiber represents work as units that can be paused, resumed and prioritised, which is what makes concurrent rendering, Suspense and transitions possible.'},

{q:'What does React 18 automatic batching change?',
 o:['It batches state updates in promises, timeouts and native event handlers, not only in React event handlers','It disables batching entirely','It only batches in class components','It batches across separate renders'],a:0,
 e:'Before React 18, updates inside promises and timeouts were not batched, causing extra renders. With createRoot, they are batched everywhere by default.'},

{q:'How do you force an immediate DOM read after a state update in a layout-sensitive case?',
 o:['Use setTimeout','Use flushSync from react-dom, or restructure so the measurement happens in useLayoutEffect after the commit','Use requestAnimationFrame only','Read from state directly'],a:1,
 e:'flushSync opts out of batching and forces a synchronous render, but it hurts performance and is a last resort. Usually useLayoutEffect is the right tool.'},

{q:'What is the "children as props" pattern used for?',
 o:['Passing data to a parent','Composing components by passing elements as children, which decouples the wrapper from the content and avoids unnecessary re-renders','Memoising children','Styling components'],a:1,
 e:'It is the foundation of flexible components such as layout and modal wrappers. Elements created by the parent keep their identity, so they do not re-render when the wrapper does.'},

{q:'What does React do with a boolean prop set to false?',
 o:['Renders the string "false"','Omits the attribute in the DOM for most attributes, while still making it available in props','Throws a warning','Treats it as true'],a:1,
 e:'This differs from a value like aria-* where false must still be rendered. React knows about these boolean-attribute edge cases; the general rule is that most DOM attributes are omitted when false or null.'},

{q:'What is a portal?',
 o:['A network request','A way to render a child into a different DOM node outside the parent hierarchy while preserving React tree and event semantics','A server-rendered route','A React context'],a:1,
 e:'ReactDOM.createPortal is used for modals, tooltips and dropdowns that must escape overflow or z-index contexts. Events bubble through the React tree, not the DOM tree.'},

/* 51–60: Effects & data fetching */
{q:'Why is fetching in useEffect without a cleanup flag risky?',
 o:['It is illegal','A stale response from an earlier render can resolve after a newer one and overwrite fresh data','It causes a memory leak in every case','It cannot be cancelled'],a:1,
 e:'This is a race condition. Use an AbortController or a cancelled flag in cleanup, or use a data-fetching library that handles cancellation and caching.'},

{q:'What is the recommended way to handle async work directly inside useEffect?',
 o:['Pass an async function to useEffect','Define an async function inside the effect and call it, then handle cleanup in the returned function','Use await at the top level of the effect','Use a class lifecycle'],a:1,
 e:'useEffect must not return a Promise, because the return value is treated as cleanup. Defining and invoking an inner async function keeps the effect synchronous.'},

{q:'What is a good reason to prefer a data-fetching library over useEffect plus useState?',
 o:['It removes the need for React','It handles caching, deduplication, retries, cancellation and stale-while-revalidate, which are hard to get right by hand','It makes the bundle smaller','It is required by React 18'],a:1,
 e:'Libraries such as TanStack Query, SWR or RTK Query handle the hard parts of server state. useEffect fetching is fine for simple cases but tends to grow into a bespoke, buggy cache.'},

{q:'What is server state versus client state?',
 o:['They are the same','Server state lives remotely and can become stale; client state is local UI state such as form input and toggles','Server state is always fresh','Client state must be fetched'],a:1,
 e:'Treating them differently is the key insight. Server state benefits from caching and revalidation, while client state is better kept local or in a small store.'},

{q:'What is Suspense for data fetching?',
 o:['A way to catch runtime errors','A mechanism where a component throws a promise and React shows a fallback until it resolves','A caching library','A routing primitive'],a:1,
 e:'Suspense simplifies loading states in the tree. It is now the recommended pattern with frameworks and React 19 features, rather than manual isLoading booleans everywhere.'},

{q:'Why should an effect not be used to derive state from props?',
 o:['It is slower','Deriving state in an effect causes an extra render with stale values first; compute it during render or use the key prop to reset state instead','It is forbidden by the linter','It breaks hydration'],a:1,
 e:'The "you might not need an effect" guidance covers this. Derived values should be computed inline, and a changed identity should be handled with key rather than a syncing effect.'},

{q:'What is the correct way to run an effect on mount only?',
 o:['Pass an empty dependency array []','Pass no dependency array','Pass [true]','Use componentDidMount'],a:0,
 e:'An empty array means no dependencies, so the effect runs once after the first commit and cleans up on unmount. It is a common interview question because omitting the array is a common bug.'},

{q:'What does the exhaustive-deps lint rule help prevent?',
 o:['Unused imports','Stale closures caused by missing dependencies in effects, callbacks and memo hooks','Memory leaks from refs','Infinite renders from useState'],a:1,
 e:'The rule is a strong default. When it complains, the fix is usually to restructure the effect or stabilise the dependency, not to silence the rule.'},

{q:'What is the risk of an async callback capturing state from an old render?',
 o:['None, closures always see current state','The callback sees the state value from the render that created it, which may be outdated by the time it runs','React re-binds the closure automatically','State is passed by reference'],a:1,
 e:'This is the classic stale closure problem. Solutions include the updater form of the setter, refs for latest values, or restructuring the effect to depend on the value.'},

{q:'What is a common pattern for syncing an external subscription, such as WebSocket or a store, with React?',
 o:['Set up the subscription in a useEffect with cleanup, or use useSyncExternalStore for store subscriptions','Set it up during render','Set it up in a module-level variable and ignore cleanup','Reconnect on every render'],a:0,
 e:'Effects with cleanup handle connection setup and teardown correctly. For stores, useSyncExternalStore is the concurrent-safe primitive.'},

/* 61–70: Context & state management */
{q:'What problem does context solve?',
 o:['It makes state global and persistent','It avoids prop drilling by passing values through the tree without explicit intermediate props','It caches API responses','It replaces all state management'],a:1,
 e:'Context is a dependency-injection mechanism for the component tree, not a general state manager. It is often paired with useReducer for shared application state.'},

{q:'What is the main performance pitfall of context?',
 o:['Context cannot be used with hooks','Every consumer re-renders when the provider value changes, even if only part of the value changed','Context is synchronous only','Context cannot hold functions'],a:1,
 e:'Split contexts by update frequency, memoise the value with useMemo, and pass the dispatch function separately from the state so components that only dispatch do not re-render on state changes.'},

{q:'When should you NOT use context?',
 o:['For theming','For a value consumed by only one or two levels of a component tree, where explicit props are clearer','For the current user','For localisation'],a:1,
 e:'Context adds indirection. Passing props explicitly is simpler and more readable when the depth is small, and the compiler can often optimise it.'},

{q:'What does a Redux store primarily enforce?',
 o:['Automatic caching','A single source of truth with state updated only through pure reducers, enabling predictable, traceable changes','Component-level state','Server-side rendering'],a:1,
 e:'Redux's value is discipline: pure reducers, actions as events, and devtools time travel. Modern Redux Toolkit reduces the boilerplate substantially.'},

{q:'What is the difference between Redux and Zustand at a high level?',
 o:['They are identical','Redux is more structured and heavier with a larger ecosystem; Zustand is a smaller, hook-based store with less ceremony','Zustand is not usable in React','Redux cannot be used with TypeScript'],a:1,
 e:'Both are valid. Redux is a strong fit for large teams and complex flows; Zustand and Jotai are often enough for smaller apps and have smaller bundles.'},

{q:'What is a selector in state management?',
 o:['A DOM query','A function that extracts a specific piece of state, which lets a component subscribe only to what it needs','A CSS rule','A router pattern'],a:1,
 e:'Selectors reduce re-renders, especially when combined with equality checks. In Redux, reselect is commonly used for memoised derived data.'},

{q:'What does a "server state" library such as TanStack Query give you that a client store does not?',
 o:['Better TypeScript','Cache keys, background refetching, deduplication, mutation lifecycle and cache invalidation tailored to remote data','Server-side rendering','Routing'],a:1,
 e:'Trying to model server data in a client store means re-implementing caching and invalidation. Keeping the two categories separate simplifies both.'},

{q:'What does "single source of truth" mean in practice?',
 o:['All data lives in one global store','Each piece of state has exactly one owner, and everything else derives from it','One file per component','One database'],a:1,
 e:'Duplicated state is the main cause of inconsistency. Deriving values from the canonical owner, rather than copying them, prevents them from drifting out of sync.'},

{q:'When is useReducer plus context a good choice over a state library?',
 o:['Never','When the shared state is small and the app does not need devtools, middleware or advanced features yet','When you need persistence','When you need optimistic updates'],a:1,
 e:'Starting with the platform primitives and adopting a library when you feel the pain avoids adding dependencies you do not need. It is also easy to migrate later.'},

{q:'What is the risk of storing derived data in state?',
 o:['It is faster','It can go out of sync with the source, producing bugs that are hard to reproduce','It cannot be rendered','It breaks memoisation'],a:1,
 e:'Compute derived values during render, or memoise them with useMemo. Only store them separately when profiling proves the computation is genuinely too expensive.'},

/* 71–80: Performance */
{q:'What does React.memo do?',
 o:['Caches the rendered output of any component','Skips re-rendering a component when its props are shallowly equal to the previous render','Replaces useMemo','Prevents effects from running'],a:1,
 e:'React.memo only helps if the props are stable and the component is expensive. Wrapping everything in memo adds comparison cost and usually does not help.'},

{q:'Why does React.memo often fail to help?',
 o:['It is broken','Parents pass new object, array or function literals on every render, so the shallow comparison always fails','It only works with class components','It only works in production'],a:1,
 e:'The fix is to stabilise the props with useMemo/useCallback, or to restructure the component so the expensive part takes primitives.'},

{q:'What is "state colocation"?',
 o:['Moving all state to Redux','Keeping state as close as possible to where it is used, so unrelated parts of the tree do not re-render','Storing state on the server','Sharing state between tabs'],a:1,
 e:'Colocation is the cheapest performance optimisation. A modal's open state belongs in the component that renders the modal, not in a global store.'},

{q:'Why is the index a risky list key for performance as well as correctness?',
 o:['Indexes are slow to compare','Reordering or inserting shifts every key, so React cannot match elements efficiently and must patch many nodes','Indexes cause extra renders','Indexes break CSS'],a:1,
 e:'Stable ids let React move existing nodes rather than rewriting attributes across the list, which is both faster and preserves component state.'},

{q:'What does React.lazy do?',
 o:['Defers rendering','Lets you code-split a component by loading it on demand via a dynamic import, paired with Suspense for the fallback','Caches props','Memoises state'],a:1,
 e:'Lazy plus Suspense reduces the initial bundle. Route-level splitting is the usual starting point, followed by heavy components such as editors or charts.'},

{q:'What is the benefit of the React 19 compiler (formerly React Forget)?',
 o:['It compiles JSX to HTML','It automatically inserts memoisation where it is safe, reducing the need for manual useMemo and useCallback','It replaces the virtual DOM','It handles routing'],a:1,
 e:'The compiler analyses components and memoises values and callbacks automatically. It is opt-in and adopted incrementally, and it does not remove the need to understand why re-renders happen.'},

{q:'What does the Profiler API do?',
 o:['Logs network requests','Measures how often components render and how expensive those renders are, so you can find hotspots','Profiles CSS','Profiles the server'],a:1,
 e:'The <Profiler> component and the React DevTools Profiler show commit durations and the reason each component rendered, which is far more reliable than guessing.'},

{q:'Which of these is usually the biggest performance win in a slow React app?',
 o:['Wrapping every component in React.memo','Reducing the amount of state and the scope of components that update when it changes','Adding more useEffect hooks','Using class components'],a:1,
 e:'Reducing unnecessary renders at the source beats memoisation. Move state down, split components, and derive instead of storing.'},

{q:'What does the `key` prop do when it changes?',
 o:['Nothing','It forces React to unmount the old component and mount a new one, resetting its state','It reorders siblings','It re-runs effects only'],a:1,
 e:'Changing the key is the idiomatic way to reset a component's state, for example when switching between different user profiles in a form.'},

{q:'What is virtualisation in a React list?',
 o:['Rendering into a portal','Rendering only the rows currently visible in the viewport, so huge lists stay fast','Memoising every row','Using Web Workers'],a:1,
 e:'Libraries such as react-window and react-virtualised implement this. The trade-off is that off-screen rows do not exist in the DOM, which affects find-in-page and accessibility if not handled.'},

/* 81–90: Routing & forms */
{q:'What is React Router primarily responsible for?',
 o:['Server rendering','Mapping URLs to components and managing navigation history in a single-page app','State management','Form validation'],a:1,
 e:'React Router provides declarative routing, nested layouts, dynamic segments and navigation. In framework mode it can also handle data loading and mutations.'},

{q:'What is the difference between client-side and server-side routing?',
 o:['They are identical','Client-side routing changes the URL and view without a full page reload; server-side routing returns a new document per URL','Client-side routing is slower','Server-side routing cannot use React'],a:1,
 e:'Client-side routing is fast for in-app navigation but requires the server to serve the app for any URL (history fallback). Server routing is more robust for deep links and SEO without extra work.'},

{q:'Why must a single-page app's server be configured to return index.html for unknown paths?',
 o:['To improve performance','So that deep links and refreshes on client routes do not 404, because the route only exists in the browser','To enable HTTPS','To cache assets'],a:1,
 e:'This is the history fallback. Framework routers and static hosts often handle it with a rewrite rule, but a misconfigured server produces a broken refresh experience.'},

{q:'What does a nested route layout provide?',
 o:['A CSS grid','A shared shell (such as a sidebar or header) that persists across child routes, with an outlet where the child renders','A separate server','A global store'],a:1,
 e:'Layout routes avoid remounting shared UI on every navigation, which preserves scroll position and component state and reduces work.'},

{q:'What is the difference between controlled and uncontrolled forms in practice?',
 o:['Controlled forms keep values in React state; uncontrolled forms keep values in the DOM and read them on submit','Uncontrolled forms cannot be validated','Controlled forms cannot use refs','They are the same'],a:0,
 e:'Controlled forms give you instant validation and dynamic UI at the cost of re-renders. Uncontrolled forms are simpler for large forms, especially when combined with a form library.'},

{q:'What problem does a form library such as React Hook Form solve?',
 o:['It replaces React state','It reduces re-renders by using uncontrolled inputs and refs, while providing validation, error state and submission handling','It handles routing','It performs server rendering'],a:1,
 e:'For large forms, per-keystroke re-renders of the whole form become expensive. Library-level refs and subscriptions keep the form fast while preserving a good developer experience.'},

{q:'What is optimistic UI?',
 o:['Showing a spinner','Updating the interface immediately as if the request succeeded, then rolling back if it fails','Fetching data before render','Caching responses'],a:1,
 e:'Optimistic updates make apps feel instant. They require a rollback path and careful handling of concurrent mutations, which is where server state libraries help.'},

{q:'What does a route guard do?',
 o:['It compiles routes','It prevents navigation or rendering when a condition such as authentication is not met, usually by redirecting','It caches routes','It lazy-loads components'],a:1,
 e:'Guards are a UX convenience, not a security boundary. Authorisation must always be enforced on the server, because client code can be bypassed.'},

{q:'What is the benefit of route-level code splitting?',
 o:['Faster server rendering','Smaller initial bundle, because each route's code loads only when the user navigates there','Better SEO','Fewer components'],a:1,
 e:'Users pay only for the routes they visit. The trade-off is a brief loading state per route, which Suspense boundaries and prefetching can hide.'},

{q:'What does the HTML form element's onSubmit handler need in a React SPA?',
 o:['Nothing special','A call to event.preventDefault() to stop the browser's default full-page submission','A ref to the form','An async function only'],a:1,
 e:'Without preventDefault, the browser navigates and the SPA state is lost. This is the single most common form bug for developers new to React.'},

/* 91–100: Testing, SSR, and modern React */
{q:'Which library is the de facto standard for testing React components?',
 o:['Enzyme','React Testing Library','Jest DOM only','Mocha'],a:1,
 e:'React Testing Library encourages testing through the user-facing DOM: queries by role and label rather than implementation details such as component state or instance methods.'},

{q:'What is the guiding principle of React Testing Library?',
 o:['Test implementation details','Test the way users interact with the app, asserting on what is rendered and what happens on interaction','Test only snapshots','Test only utility functions'],a:1,
 e:'Tests that assert on accessible roles and visible text survive refactors. Tests that reach into component state or internal methods break on every implementation change.'},

{q:'What does `fireEvent` or `userEvent` simulate?',
 o:['Network requests','User interactions such as clicks, typing and focus, dispatching the corresponding DOM events','Server rendering','Route changes'],a:1,
 e:'userEvent is preferred for realistic behaviour: it dispatches the full sequence of events a real user would generate, including focus, keydown and input, whereas fireEvent dispatches one event.'},

{q:'What is a snapshot test good for, and what is its main weakness?',
 o:['It proves correctness; it has no weaknesses','It detects unexpected changes in rendered output quickly, but large snapshots are hard to review and are often blindly updated, so they provide false confidence','It tests performance','It tests accessibility'],a:1,
 e:'Snapshots are useful for small, stable structures. For UI behaviour, explicit assertions are clearer and less brittle.'},

{q:'What does server-side rendering (SSR) improve compared with a pure client-side app?',
 o:['Runtime performance of every interaction','Initial content paint and SEO, because the server returns fully rendered HTML that the browser can display before JavaScript loads','Bundle size','State management'],a:1,
 e:'SSR improves time to first meaningful paint and crawlability. It requires care around browser-only APIs, hydration mismatches, and data fetching on the server.'},

{q:'What is hydration?',
 o:['Compressing HTML','Attaching React event handlers and state to server-rendered HTML so it becomes interactive','Caching data on the server','Streaming assets'],a:1,
 e:'During hydration React expects the client render to match the server HTML. A mismatch, often caused by Date.now(), Math.random() or localStorage reads during render, produces warnings and can discard the server DOM.'},

{q:'How is React Server Components (RSC) different from SSR?',
 o:['They are the same','SSR renders components to HTML on the server; RSC components execute on the server and send a serialised component tree, never shipping their code to the client','RSC only works with Next.js','RSC is client-only'],a:1,
 e:'RSC lets server-only code, such as database access, live next to the UI it renders, and it removes that code from the client bundle entirely. The two techniques are complementary.'},

{q:'What is the purpose of the `"use client"` directive?',
 o:['It enables client-side rendering only','It marks a module boundary where client components begin, so hooks and browser APIs can be used below it','It disables SSR','It enables TypeScript'],a:1,
 e:'In an RSC architecture, components are server components by default. Adding "use client" marks the module and its imports as client code, which is a deliberate bundle-size trade-off.'},

{q:'What are React Actions (React 19)?',
 o:['Server endpoints','A convention for handling form submissions and mutations with async functions, integrated with transitions and optimistic updates','A build tool','A testing helper'],a:1,
 e:'Actions unify the mutation lifecycle: pending state, error handling and optimistic updates. They work with <form action={fn}> and can run on the server in framework setups.'},

{q:'What does the `use` hook (React 19) enable?',
 o:['A replacement for useState','Reading a promise or context inside render, letting components suspend on data with the help of Suspense and a cache-aware source','A router primitive','A memoisation primitive'],a:1,
 e:'use(promise) suspends until it resolves. It requires a promise that is stable across renders, typically produced by a framework or cache, otherwise every render creates a new promise.'},

{q:'Which statement best describes how React decides to re-render a component?',
 o:['It re-renders when a parent re-renders or when its own state changes, unless memoisation allows it to be skipped','It re-renders on every browser frame','It only re-renders on navigation','It re-renders only when props are primitives'],a:0,
 e:'By default a parent re-render re-renders children. React.memo can short-circuit this when props are shallowly equal, and context changes can also trigger a re-render regardless of memo.'},

{q:'What is the correct mental model for React?',
 o:['You imperatively mutate the DOM to match state','You describe the UI as a function of state, and React computes the DOM updates needed to match that description','You write HTML templates and hydrate them manually','You must manage the virtual DOM yourself'],a:1,
 e:'Declarative rendering is the core idea. Thinking in terms of what the UI should look like for a given state, rather than a sequence of DOM mutations, avoids most bugs.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
