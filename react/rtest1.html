<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Mock Test — 100 MCQs</title>
<meta name="description" content="100 React MCQs with explanations: JSX, components, props, state, hooks, context, memoization, lists and keys, forms, error boundaries, reconciliation, routing, and React 18 features.">
<style>
  :root{--brand:#0ea5e9;--brand-dark:#075985;--accent:#38bdf8;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#052e44;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0f2fe;border-color:#bae6fd}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(14,165,233,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#e0f2fe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⚛️ React Mock Test <span class="setpill">100 MCQs</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: JSX & Elements */
{q:'What does JSX stand for?',
 o:['JavaScript Extension','JavaScript XML','JSON XML','Java Syntax eXtension'],a:1,
 e:'JSX is a syntax extension that looks like XML. It compiles to JavaScript function calls and is processed by Babel or the TypeScript compiler.'},

{q:'What does JSX compile to?',
 o:['HTML strings','DOM nodes directly','React.createElement calls (or jsx runtime calls)','Web Components'],a:2,
 e:'Both the classic runtime (React.createElement) and the automatic runtime (jsx/jsxs) produce plain objects that React turns into DOM updates.'},

{q:'Is JSX required to use React?',
 o:['Yes, always','Only for class components','Only for hooks','No, it is optional syntactic sugar; you can call React.createElement directly'],a:3,
 e:'JSX improves readability but is not required. Every JSX expression can be rewritten as a createElement call by hand.'},

{q:'What is a React element?',
 o:['A DOM node','A class instance','A lightweight, immutable description of what to render, essentially a plain object','A CSS selector'],a:2,
 e:'Elements are the smallest building blocks. They are cheap descriptions; React reconciles them and updates the DOM when the tree changes.'},

{q:'What does ReactDOM.createRoot do in React 18?',
 o:['Creates a concurrent root so React can use concurrent rendering features','Renders an HTML string','Creates a React class','Registers a hook'],a:0,
 e:'createRoot is the React 18 replacement for ReactDOM.render. It enables concurrent features such as transitions and Suspense on the client.'},

{q:'Why must a component return a single root element (or null)?',
 o:['Because browsers require it','Because JSX compiles to a single function call, so you need to wrap siblings in a Fragment or container','Because React forbids multiple children','Because the DOM has only one node'],a:1,
 e:'A Fragment (React.Fragment or the shorthand) satisfies this without adding an extra DOM node.'},

{q:'How do you return multiple sibling elements without adding an extra DOM node?',
 o:['Return an array of elements','Use a Portal','Use React.Fragment or its shorthand','Return a string'],a:2,
 e:'Fragments group elements without producing a wrapper element in the DOM. Arrays also work but require keys.'},

{q:'How do you embed a JavaScript expression in JSX?',
 o:['Wrap it in curly braces {expression}','Wrap it in square brackets [expression]','Prefix with a percent sign','Use HTML entities'],a:0,
 e:'Any valid JavaScript expression can be placed inside curly braces in JSX, including function calls, ternaries and property access.'},

{q:'Which attribute should you use for CSS classes in JSX?',
 o:['class','className','style','css'],a:1,
 e:'JSX uses className because class is a reserved word in JavaScript. The class attribute is set by React when the element is rendered.'},

{q:'How do you write a comment inside JSX?',
 o:['// comment','Wrap it in {/* comment */}','Use HTML-style <!-- comment -->','Use # comment'],a:1,
 e:'Inside JSX, comments must be JavaScript expressions, so they go inside curly braces. Outside JSX, normal // and /* */ comments work.'},

/* 11–20: Components & Props */
{q:'What is a function component?',
 o:['A class extending React.Component','A JavaScript function that accepts props and returns React elements','A hook that returns a component','A component defined only in a file'],a:1,
 e:'Function components are the modern default. They receive props as an argument, can use hooks, and return JSX (or null).'},

{q:'What is the primary difference between props and state?',
 o:['There is no difference','Props are read-only inputs from the parent; state is internal mutable data managed by the component itself','State is read-only','Props are internal'],a:1,
 e:'Props flow down and are read-only. State is owned by the component and can be changed with its setter, which triggers a re-render.'},

{q:'Can a component mutate its own props?',
 o:['Yes, with setProps','Only in class components','Only inside useEffect','No, props are read-only'],a:3,
 e:'Props are owned by the parent. Mutating them breaks React\'s data flow and makes the UI unpredictable. Use state or callbacks instead.'},

{q:'What does props.children contain?',
 o:['An array of all child components','The content passed between the opening and closing tags of a component','A required prop','A DOM node'],a:1,
 e:'children is a special prop that lets components wrap arbitrary content, which is the basis of composition patterns such as layouts and modals.'},

{q:'How do you pass a prop to a component?',
 o:['call comp.setProp()','Use JSX attributes: <Comp name="value" />','Pass it via useState','Pass it via useRef'],a:1,
 e:'Any JSX attribute becomes a prop. For non-string values, use curly braces: <Comp count={5} />. Strings can be quoted directly.'},

{q:'What is passed to a prop if you do not supply it?',
 o:['A build error','A runtime error','undefined, unless the component has a default','null'],a:2,
 e:'React does not validate props at runtime by default. Default parameters or defaultProps supply fallbacks, and PropTypes adds optional warnings.'},

{q:'Which mechanism lets you validate prop types at runtime?',
 o:['TypeScript, which is compile-time only','JSDoc comments','Runtime propTypes, or a TypeScript interface for compile-time checking','Prop validation is impossible'],a:2,
 e:'propTypes emit development-time warnings for wrong types. TypeScript interfaces are the compile-time equivalent and are stripped at build.'},

{q:'What were defaultProps traditionally used for?',
 o:['Supplying default values for undefined props','Marking props as required','Type checking','Preventing re-renders'],a:0,
 e:'defaultProps are deprecated for function components. Default parameter values are the modern equivalent and work cleanly with destructuring.'},

{q:'Can a component modify its own props?',
 o:['Yes, using this.props = ...','Only with setState','Only with useState','No, props are immutable from the component\'s perspective'],a:3,
 e:'Assigning to this.props does not work reliably and is discouraged. Parent state is the single source of truth for props.'},

{q:'How do you spread an object into a component as props?',
 o:['props.spread','Use {...obj} in JSX','Use spread(obj)','Use obj.spread()'],a:1,
 e:'Spread syntax passes each key of the object as a separate prop. It is convenient for wrappers but can hide which props a component actually needs.'},

/* 21–30: State & useState */
{q:'Which hook manages local state in a function component?',
 o:['useEffect','useRef','useState','useMemo'],a:2,
 e:'useState is the primary state hook. useReducer is the alternative when the state logic is complex or has multiple sub-values.'},

{q:'What does useState return?',
 o:['The current value only','A setter only','An array with the value and a setter, destructured as [value, setValue]','A Promise'],a:2,
 e:'Destructuring is the idiom: const [count, setCount] = useState(0). The setter triggers a re-render when the value changes.'},

{q:'Is a state update from useState applied synchronously?',
 o:['Yes, always','Only inside event handlers','No, updates are batched and applied asynchronously, so the new value is not visible immediately after setState','Only in class components'],a:2,
 e:'React batches updates and schedules a re-render. To read the new value immediately, compute it yourself or use a local variable before setting state.'},

{q:'What does passing a function to useState do?',
 o:['It runs on every render','It sets the function itself as the state','It throws an error','It acts as a lazy initializer, running only on the first render'],a:3,
 e:'Lazy initialization avoids expensive computation when the initial value is derived, for example useState(() => loadFromStorage()).'},

{q:'When updating state based on the previous value, what should you pass to the setter?',
 o:['The new absolute value','An updater function: setCount(prev => prev + 1)','A second useState','A useRef'],a:1,
 e:'The updater form guarantees you are working from the latest state, which is critical when multiple updates are queued before a single re-render.'},

{q:'What happens if you call the setter with a value equal to the current state?',
 o:['React always re-renders','React may bail out and skip the re-render for that update','React throws an error','State is reset'],a:1,
 e:'React uses Object.is to compare. For primitives this means no re-render for the same value; for objects, a new reference always counts as different.'},

{q:'Can you call hooks conditionally inside an if block?',
 o:['Yes, any hook','Yes, but only useEffect','Only in class components','No, this violates the Rules of Hooks'],a:3,
 e:'Hooks must be called in the same order every render. Conditional calls shift the order and corrupt the hook state, which is why the rules exist.'},

{q:'Where must hooks be called from?',
 o:['The top level of a function component or a custom hook','Any JavaScript function','Inside conditionals','Class component methods'],a:0,
 e:'This is the first of the Rules of Hooks. Hooks cannot be called from loops, conditions, or nested functions inside a component.'},

{q:'Why might you use lazy initialization with useState?',
 o:['To defer an expensive initial computation until the first render only','To make setState async','To avoid re-renders','To access the DOM'],a:0,
 e:'The function passed to useState runs only on the initial render, so heavy work such as parsing localStorage or reading a large config is done once.'},

{q:'Can a component contain multiple useState calls?',
 o:['No, only one','Only if the types differ','Yes, as many as needed, each managing a separate piece of state','Only in classes'],a:2,
 e:'Each call creates its own state slot in order. Splitting state by concern is common; combining it into one object is also valid when the fields change together.'},

/* 31–40: Effects & useEffect */
{q:'Which hook is used to run side effects after render?',
 o:['useState','useRef','useMemo','useEffect'],a:3,
 e:'useEffect handles subscriptions, data fetching, timers, DOM mutations and anything else that is not pure rendering logic.'},

{q:'When does useEffect run by default?',
 o:['Only on mount','Only on unmount','After every render','Before every render'],a:2,
 e:'Without a dependency array, the effect runs after every commit. That is often too frequent, which is why the dependency array exists.'},

{q:'How do you make useEffect run only once (on mount)?',
 o:['Pass null as the second argument','Pass an empty dependency array []','Pass a boolean','Use a cleanup function only'],a:1,
 e:'An empty array tells React the effect has no reactive dependencies. This is the classic "run once on mount" pattern, and its cleanup runs on unmount.'},

{q:'What does the cleanup function returned from useEffect do?',
 o:['Runs before the next effect runs and again on unmount, clearing subscriptions and timers','Runs before the first render only','Runs only on unmount','Runs only in StrictMode'],a:0,
 e:'The cleanup is how you avoid memory leaks. Timers, event listeners, subscriptions and in-flight requests should all be cleared or aborted there.'},

{q:'When does the cleanup function run?',
 o:['Immediately after the effect\'s first run','Only on unmount','Never','Before the next execution of the effect and on unmount'],a:3,
 e:'This "clean up before re-running" behaviour is essential: without it, every dependency change would stack another listener or timer on top of the previous one.'},

{q:'How do you restrict an effect to run only when a specific value changes?',
 o:['Include that value in the dependency array','Use useRef','Use useEffect without dependencies','Use useCallback'],a:0,
 e:'The dependency array is React\'s way of declaring which values the effect depends on. If any listed value changes (by Object.is), the effect re-runs.'},

{q:'What is the second argument to useEffect?',
 o:['A cleanup function','An options object','A dependency array','A boolean flag'],a:2,
 e:'The dependency array tells React when to re-run the effect. Omitting it means "after every render"; an empty array means "never re-run".'},

{q:'What problem can occur if you use an empty dependency array but reference changing state inside the effect?',
 o:['Stale closures, because the effect captures the values from the first render','Infinite loops','Memory leaks only','Race conditions only'],a:0,
 e:'The effect closes over the initial values and never sees later updates. Either include the dependency or read the latest value through a ref if you intentionally want a stable effect.'},

{q:'Which hook runs code synchronously after DOM mutations but before the browser paints?',
 o:['useEffect','useLayoutEffect','useInsertionEffect','useImperativeHandle'],a:1,
 e:'useLayoutEffect blocks the paint. Use it for measurements or layout adjustments that must be applied before the user sees the frame.'},

{q:'What is the main difference between useEffect and useLayoutEffect?',
 o:['They are identical','useEffect runs after the browser paints; useLayoutEffect runs before it','useLayoutEffect only runs on mount','useEffect is deprecated'],a:1,
 e:'Prefer useEffect in almost every case. useLayoutEffect is for synchronous DOM reads and writes that must happen before the next paint.'},

/* 41–45: Refs */
{q:'Which hook provides a mutable ref object whose .current property persists across renders?',
 o:['useState','useMemo','useRef','useCallback'],a:2,
 e:'useRef returns an object with a .current property. Mutating .current does not trigger a re-render, making it ideal for storing values that should not cause renders.'},

{q:'Does changing a ref\'s .current value trigger a re-render?',
 o:['Yes, always','Only if declared with useState','No, ref changes do not trigger re-renders','Only in class components'],a:2,
 e:'That is exactly why refs are used for timers, previous values, DOM nodes and other state that should not affect rendering.'},

{q:'What are refs commonly used for?',
 o:['Managing component state','Accessing DOM nodes and storing mutable values across renders','Memoizing expensive values','Replacing context'],a:1,
 e:'Refs bridge React to the imperative world: focusing inputs, scrolling, measuring elements, holding intervals, or tracking a previous value.'},

{q:'How do you get a reference to a DOM node inside a function component?',
 o:['use useRef with the ref attribute on the element','Use document.querySelector','Use document.getElementById','Use window.ref'],a:0,
 e:'Attach the ref object to the element via the ref attribute, and after mount ref.current points at the DOM node. Using direct DOM APIs bypasses React and is discouraged.'},

{q:'What is React.forwardRef used for?',
 o:['Forwarding event handlers','Preventing re-renders','Passing a ref from a parent through a function component to an inner DOM node','Creating a ref'] ,a:2,
 e:'Function components do not receive refs as a prop by default. forwardRef lets them accept and forward a ref, which is essential for reusable inputs and focus management.'},

/* 46–50: Context */
{q:'What problem does the Context API primarily solve?',
 o:['Prop drilling through many intermediate components','Rendering performance','Async data fetching','Global event handling'],a:0,
 e:'Context lets a value be available to a subtree without passing it explicitly through every level. It is not a state manager; you still need state somewhere.'},

{q:'How do you read a context value in a function component?',
 o:['Use useContext(MyContext)','Use this.context','Use MyContext.read()','Use useConsumer()'],a:0,
 e:'useContext returns the nearest Provider value above the component. If there is no Provider, it returns the default passed to createContext.'},

{q:'What does a Provider component do?',
 o:['Creates a new context','Provides a value to all consumers below it in the tree','Replaces useContext','Validates context values'],a:1,
 e:'Consumers subscribe to the nearest Provider above them. Nesting Providers is allowed, and the innermost one wins for that subtree.'},

{q:'What does createContext(initialValue) return?',
 o:['A Provider component','A hook','The default value itself','A context object whose default is the argument you passed'],a:3,
 e:'The default is used only when no Provider is present. It is a useful fallback during development, but production code usually wraps with a Provider.'},

{q:'When should you avoid using Context?',
 o:['When there is a lot of prop drilling','When the value never changes','When the tree is very deep','When the value changes very frequently and would re-render all consumers'],a:3,
 e:'Every consumer re-renders when the Provider value changes. For high-frequency updates, use a state library with selectors, or split contexts so only interested parts re-render.'},

/* 51–55: Memoization */
{q:'What does React.memo do?',
 o:['Memoizes a component so it skips re-rendering when its props are unchanged','Memoizes state','Caches API calls','Prevents hooks from running'],a:0,
 e:'React.memo wraps a component and does a shallow comparison of props. If they are equal, React reuses the previous render output.'},

{q:'When does React.memo skip a re-render?',
 o:['Always','When all props are shallow-equal to the previous props (or the custom comparator returns true)','Only when the component returns null','Never'],a:1,
 e:'Shallow comparison means primitive equality plus reference equality for objects and functions. That is why unstable object or function props defeat memoization.'},

{q:'What is the main difference between useMemo and useCallback?',
 o:['useMemo returns a memoized value; useCallback returns a memoized function','useCallback returns a value; useMemo returns a function','They are identical','useMemo is deprecated'],a:0,
 e:'useCallback(fn, deps) is effectively useMemo(() => fn, deps). Both take a dependency array and re-create only when dependencies change.'},

{q:'When should you use useMemo?',
 o:['For expensive calculations that should not run on every render','For every value in the component','For side effects','To replace useState'],a:0,
 e:'useMemo is a performance tool, not a default. Sorting or filtering a large list, or building a derived structure, are good candidates; trivial arithmetic is not.'},

{q:'What is the main downside of premature memoization?',
 o:['It makes the app slower in every case','It adds complexity and code noise for little benefit in most components','It violates the Rules of Hooks','It breaks React.memo'],a:1,
 e:'Measure first. Memoization adds deps arrays that can go stale and makes the code harder to read. Optimise the slow paths identified by profiling.'},

/* 56–62: Lists & Keys */
{q:'What two properties must a React key have?',
 o:['Numeric and sequential','Unique among siblings and stable across renders','Random and long','Identical for all items'],a:1,
 e:'Uniqueness lets React match elements; stability lets it preserve component state and DOM nodes across renders. Changing keys forces a remount.'},

{q:'Why does React need keys on list items?',
 o:['To pass props','To help reconciliation match items across renders so state and DOM nodes are preserved correctly','For styling','To trigger effects'],a:1,
 e:'Without stable keys React reuses items by position, which scrambles state and animations when the list is reordered or filtered.'},

{q:'What problem can using the array index as a key cause?',
 o:['Nothing; it is always correct','Problems when items are reordered, inserted or removed, because state sticks to the wrong item','An error in the console','Slower rendering only'],a:1,
 e:'Index keys are acceptable for static lists that never change order. For dynamic lists, use an id that belongs to the item itself.'},

{q:'Are keys passed to the component as a prop?',
 o:['Yes, as props.key','Only in class components','Only when the key is a string','No, keys are internal to React and are not accessible as a prop'],a:3,
 e:'React strips the key before calling your component. If the child needs the value, pass it under a different prop name such as id.'},

{q:'Where do you place the key attribute?',
 o:['On the outermost element returned by the map callback','On any descendant','On the parent container','On the array itself'],a:0,
 e:'The key must be on the element that React sees directly in the array. Putting it on a nested element does not help reconciliation.'},

{q:'Why should you avoid random values as keys?',
 o:['They are too long','They force remounts on every render because the key changes, destroying component state','They cause syntax errors','They use too much memory'],a:1,
 e:'A new key on every render tells React the element is brand new, so it unmounts and remounts the component each time. This is especially visible with inputs and animations.'},

{q:'Can a component return an array of elements?',
 o:['No, only a single element','Only inside a Fragment','Yes, and React will render each item, but each needs a key','Only in class components'],a:2,
 e:'Returning arrays is supported, but React warns without keys because reconciliation cannot match items reliably across renders.'},

/* 63–67: Forms & Events */
{q:'What is a controlled component?',
 o:['A component whose value is driven by React state, with an onChange handler to update it','A component whose value is managed by the DOM','A component with no state','A component that cannot change'],a:0,
 e:'Controlled inputs give you the value in React state at all times, which makes validation, formatting and conditional logic straightforward.'},

{q:'What is an uncontrolled component?',
 o:['A component whose value lives in React state','A component whose value is managed by the DOM and read via a ref or form submission','A component that ignores events','A component without props'],a:1,
 e:'Uncontrolled inputs are simpler for one-off forms and file inputs. In practice you usually reach for a ref to read the value when the form submits.'},

{q:'What is a SyntheticEvent in React?',
 o:['A cross-browser wrapper around the native DOM event','A custom event not in the DOM','A keyboard-only event','A global event bus'],a:0,
 e:'Synthetic events normalise browser differences and provide a consistent API. Under the hood React listens at the root and dispatches to your handlers.'},

{q:'Why does React use synthetic events rather than wiring native listeners directly?',
 o:['For better performance in every case','To remove event bubbling','For cross-browser consistency and a single delegated listener at the root','To support debouncing'],a:2,
 e:'Event delegation also means React can clean up listeners automatically and normalise behaviour such as preventDefault across browsers.'},

{q:'What naming convention do event handler props use in JSX?',
 o:['lowercase, e.g. onclick','UPPERCASE, e.g. ONCLICK','camelCase, e.g. onClick','kebab-case, e.g. on-click'],a:2,
 e:'JSX uses camelCase for event names and passes a function, not a string. So you write onClick={handleClick}, not onClick="handleClick()".'},

/* 68–72: Conditional rendering & composition */
{q:'Which mechanisms can conditionally render in JSX?',
 o:['if/else outside JSX, ternaries, and the && operator','Only if/else inside JSX','Only the ternary operator','Only CSS display:none'],a:0,
 e:'Use if/else or early returns for large branches, ternaries for two-way choices, and && for "render or nothing". Each has a readable place.'},

{q:'What does condition && <X /> render when condition is false?',
 o:['The string "false"','Nothing: false is ignored by React, so nothing is rendered','An error','The component, always'],a:1,
 e:'false, null, undefined and true are all ignored in the output. This is exactly why the && idiom is safe for booleans.'},

{q:'What does 0 && <X /> render?',
 o:['Nothing','An error','The number 0, as visible text, which is a common bug','The component'],a:2,
 e:'JavaScript evaluates 0 && X to 0, and React renders numbers as text. Use count > 0 && <X /> or a ternary to avoid the stray zero.'},

{q:'What is composition in React?',
 o:['Combining smaller components to build a UI, typically via props.children and passing components as props','Extending React.Component','Inheriting from another component','Copying props into state'],a:0,
 e:'React favours composition over inheritance. Wrapper components, layouts and render-prop style patterns all build on this idea.'},

{q:'Why is passing children (or components as props) useful?',
 o:['It reduces the number of files','It lets a component stay agnostic about its content, enabling reusable layout and wrapper patterns','It improves performance automatically','It replaces state'],a:1,
 e:'A Modal or Card does not need to know whether it contains text, a form or a chart. The caller supplies the content, and the component handles the chrome.'},

/* 73–78: Hooks rules & custom hooks */
{q:'Which of these is a Rule of Hooks?',
 o:['Only call hooks at the top level, never inside conditions, loops or nested functions','Only call useState once per component','Only call hooks in class components','Hooks can be called anywhere'],a:0,
 e:'The rules guarantee that hooks are called in the same order on every render, which is what lets React associate each call with the right state slot.'},

{q:'Why must hooks be called in the same order on every render?',
 o:['Because of alphabetical ordering','Because React stores hook state by call order in a per-component list','Because it is faster','Because JavaScript requires it'],a:1,
 e:'Each hook call consumes the next slot in the component\'s hook list. If the order changes, state gets associated with the wrong hook, causing subtle bugs.'},

{q:'What is a custom hook?',
 o:['A function whose name starts with "use" and which calls other hooks','A class method','A React component','A built-in React API'],a:0,
 e:'Custom hooks extract reusable stateful logic. They are just functions that follow the rules and can call other hooks, including other custom hooks.'},

{q:'Must a custom hook start with the word "use"?',
 o:['Only in TypeScript','No, it is purely cosmetic','Only if it uses useState','Yes, by convention, and required for the linter and React tooling to detect it correctly'],a:3,
 e:'The use prefix is not magic, but it signals intent and enables ESLint rules and React DevTools to treat the function as a hook and enforce the rules.'},

{q:'Can a custom hook return anything?',
 o:['Only state values','Yes: any value, including objects, arrays, functions or a tuple','Only functions','Only primitives'],a:1,
 e:'The return value is entirely up to you. Common patterns include returning a tuple like [value, setter] or an object with multiple operations.'},

{q:'Can two components share state simply by calling the same custom hook?',
 o:['Yes, always','Only if the hook uses useState','Only with context','No, not by default: each call gets its own independent state'],a:3,
 e:'A custom hook is a way to share logic, not state. To share state, put the state in a Context, a store, or pass it down from a common parent.'},

/* 79–83: Error boundaries & Suspense */
{q:'What is an error boundary?',
 o:['A component that catches JavaScript errors in its subtree during rendering and displays a fallback UI','A try/catch inside JSX','A hook that returns errors','An event handler wrapper'],a:0,
 e:'Error boundaries are class components implementing static getDerivedStateFromError and/or componentDidCatch. There is currently no hook equivalent.'},

{q:'Which errors does an error boundary catch?',
 o:['All errors including event handlers','Errors during rendering, in lifecycle methods, and in constructors of the tree below','Only async errors','Only errors from hooks'],a:1,
 e:'The boundary sits in the component tree and catches errors thrown during the render phase of its children. Errors thrown in event handlers are not caught.'},

{q:'Which of these is NOT caught by an error boundary?',
 o:['Errors in render','Errors in lifecycle methods','Errors in event handlers or async code such as setTimeout and promises','Errors in constructors'],a:2,
 e:'Event handler and async errors escape the render phase. Catch them with try/catch and surface them through state or an error reporting library.'},

{q:'What does React.lazy do?',
 o:['Splits a component into a separate bundle that is loaded on demand','Caches a component after first render','Memoizes a component','Defers state updates'],a:0,
 e:'lazy takes a function returning a dynamic import. The code for the component is fetched only when it is first needed, reducing the initial bundle size.'},

{q:'What must wrap a lazy-loaded component while it is loading?',
 o:['An ErrorBoundary','A Fragment','Suspense, with a fallback UI','A Context Provider'],a:2,
 e:'Suspense shows the fallback while the lazy chunk downloads. An ErrorBoundary is commonly placed around it too, to handle failed loads.'},

/* 84–88: Reconciliation */
{q:'What is reconciliation in React?',
 o:['React\'s algorithm for comparing the previous and next element trees to compute the minimal set of DOM updates','The process of server rendering','A compilation step','A state management pattern'],a:0,
 e:'React builds a new element tree on every render and diffs it against the previous one. Keys and element types drive how the diff is computed.'},

{q:'Why does React use a virtual DOM?',
 o:['To replace the browser DOM','To minimise expensive real DOM operations by computing changes in memory first','To make CSS faster','To enable server rendering only'],a:1,
 e:'DOM mutations are the bottleneck. React diffs in memory and applies batched updates, which is much cheaper than touching the DOM repeatedly.'},

{q:'During reconciliation, what does a key help React do?',
 o:['Identify which elements are the same across renders, so state and DOM nodes are preserved correctly','Identify which props changed','Trigger effects','Load code'],a:0,
 e:'Without keys, React falls back to position-based matching. With keys, it can match an item that moved, keeping its state and DOM node intact.'},

{q:'What is batching in React?',
 o:['Grouping many small components into one','Combining multiple state updates into a single re-render','Loading multiple bundles at once','Merging styles'],a:1,
 e:'React batches updates inside the same tick. React 18 extends automatic batching to promises, timeouts and native event handlers, which were not batched before.'},

{q:'What does a "re-render" mean in React?',
 o:['The browser reloads the page','React calls the component function again to compute the new element tree, then reconciles it with the previous one','The DOM is destroyed and rebuilt','A new component instance is created'],a:1,
 e:'Re-rendering is cheap compared with DOM updates; React only touches the DOM where the diff shows a change. Memoization prevents unnecessary re-renders in expensive subtrees.'},

/* 89–92: StrictMode & Portals */
{q:'What does StrictMode do?',
 o:['Enables production behaviour','Disables hooks','Removes warnings','In development, double-invokes certain functions and warns about unsafe lifecycles to surface bugs'],a:3,
 e:'Double-invoking render and effects in development helps expose accidental side effects. It has no effect in the production build.'},

{q:'Does StrictMode double-invoke components in production?',
 o:['Yes','No, the extra checks only run in development','Only for class components','Only when Suspense is used'],a:1,
 e:'The production build strips the extra invocations. If something breaks under StrictMode but not in production, that is usually a real bug in your effects or render logic.'},

{q:'What is a Portal in React?',
 o:['Renders children into a different DOM subtree, outside the parent\'s DOM hierarchy','A route','A state container','A hook'],a:0,
 e:'ReactDOM.createPortal preserves React tree semantics while placing the DOM node elsewhere. Events still bubble through the React tree, not the DOM tree.'},

{q:'When is a Portal the right choice?',
 o:['For every component','For modals, tooltips, dropdowns and toasts that need to escape overflow or stacking-context issues','For routing','For fetching data'],a:1,
 e:'A modal rendered inside a deeply nested, overflow-hidden container can be clipped. A portal moves it to a higher-level DOM node while keeping its React parentage.'},

/* 93–96: Router */
{q:'Which library is the standard routing solution for React apps?',
 o:['react-router-dom','react-router (the package itself is split; dom is for web)','react-navigation','next/link'],a:0,
 e:'react-router-dom is the web binding of React Router. It provides BrowserRouter, Routes, Route, Link and the navigation hooks.'},

{q:'In React Router v6, which component wraps the route definitions?',
 o:['Switch','Router','Routes','Route'],a:2,
 e:'v6 replaced Switch with Routes. Each child is a Route with a path and an element prop, and the most specific match wins.'},

{q:'How do you read URL parameters in React Router v6?',
 o:['useParams','useQuery','usePath','useSearch'],a:0,
 e:'useParams returns an object of the dynamic segments declared in the path, such as id from /users/:id. It re-renders when the URL changes.'},

{q:'How do you navigate programmatically in React Router v6?',
 o:['useHistory().push()','useNavigate()','window.location.assign()','useRedirect()'],a:1,
 e:'useNavigate returns a function you can call with a path or a delta. For example navigate(-1) goes back, and navigate(\'/dashboard\') pushes a new entry.'},

/* 97–100: Modern React */
{q:'What is concurrent rendering in React 18?',
 o:['Rendering in a Web Worker','React can interrupt, pause and resume rendering to keep the UI responsive','Server-side rendering','Parallel DOM updates'],a:1,
 e:'Concurrent rendering lets urgent updates (like typing) preempt non-urgent work (like filtering a large list), improving perceived responsiveness.'},

{q:'What is useTransition for?',
 o:['Animating transitions between routes','Marking some state updates as non-urgent so urgent updates can preempt them','Fetching data','Managing CSS transitions'],a:1,
 e:'The hook returns [isPending, startTransition]. Wrapping a heavy update in startTransition lets React keep typing responsive while the list re-renders in the background.'},

{q:'What does useDeferredValue do?',
 o:['Returns a deferred version of a value so non-urgent UI can lag behind the latest input','Defers a fetch','Debounces events','Creates a ref'],a:0,
 e:'You pass a value and get a version that React updates at lower priority. A live input reflects the latest keystrokes while a heavy filtered list catches up.'},

{q:'Which React 18 API replaces ReactDOM.render for client apps?',
 o:['createRoot from react-dom/client','hydrate','mount','renderClient'],a:0,
 e:'createRoot(container).render(element) is the React 18 entry point on the client. For SSR, hydrateRoot is the corresponding API for server-rendered markup.'},

{q:'What does automatic batching in React 18 change?',
 o:['It disables batching','It batches fewer updates','It batches state updates in more situations, including promises, timeouts and native event handlers','It only batches in StrictMode'],a:2,
 e:'React 17 only batched inside React event handlers. React 18 batches almost everywhere, reducing the number of re-renders and improving performance.'},

{q:'Which hook gives a mutable, stable callback reference across renders?',
 o:['useMemo','useCallback','useRef','useState'],a:1,
 e:'useCallback(fn, deps) returns the same function reference as long as deps do not change. It is most useful when passing callbacks to memoized children.'},

{q:'What does useReducer provide over useState?',
 o:['Nothing; they are identical','A dispatch-based state update that centralises logic in a reducer function, useful for complex or multi-field state','Faster rendering','Server state'],a:1,
 e:'useReducer(state, action) => newState keeps transition logic testable and lets you pass dispatch down instead of many setters. It is essentially Redux\'s reducer without the store.'},

{q:'What is the purpose of the key prop warning that React shows?',
 o:['To annoy developers','To prompt you to supply stable keys so reconciliation preserves state correctly','To force re-renders','To validate props'],a:1,
 e:'The warning appears when you map over a list without keys. Fixing it prevents state from sticking to the wrong item when the list changes order.'},

{q:'Which of the following is a legitimate reason to use useState over useReducer?',
 o:['The state is simple and independent','The state has many related fields updated by complex actions','The update logic needs to be shared with Redux','The reducer is required for testing'],a:0,
 e:'useState is perfectly fine for a single counter or boolean. Reach for useReducer when transitions are complex, when multiple fields change together, or when the logic should be unit-tested.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + esc(q.q) + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + esc(q.e) + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
