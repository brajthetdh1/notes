<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 brand-new React MCQs: advanced hooks, concurrent rendering, Suspense, error boundaries, RSC, React Router data APIs, forms, TypeScript, testing, performance and security.">
<style>
  :root{--brand:#087ea4;--brand-dark:#043b4f;--accent:#61dafb;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#043b4f;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0f2fe;border-color:#bae6fd}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(8,126,164,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#e0f2fe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⚛️ React Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Concurrent rendering & scheduling */
{q:'What does "concurrent rendering" mean in React 18+?',
 o:['Rendering in a Web Worker','React can prepare multiple versions of the UI at once, interrupt and abandon work, and prioritise urgent updates','Rendering multiple components in parallel threads','Rendering on the server'],a:1,
 e:'Concurrency is about scheduling, not threads. React can pause a low-priority render, let an urgent update through, then resume or discard the work in progress.'},

{q:'What is a "tear" in concurrent rendering?',
 o:['A CSS layout bug','A visual inconsistency where different components in the same render read different values of the same external store','A memory leak','A hydration mismatch'],a:1,
 e:'Tearing happens when a non-React store changes while React is mid-render. useSyncExternalStore exists precisely to guarantee a consistent snapshot across the tree.'},

{q:'Which hook is designed to read an external store safely under concurrent rendering?',
 o:['useEffect','useSyncExternalStore','useState','useRef'],a:1,
 e:'It accepts subscribe and getSnapshot functions, and React re-reads the snapshot when the store notifies, ensuring every component sees the same value during a render pass.'},

{q:'What is the difference between a transition and a normal state update?',
 o:['Transitions are slower','A transition is marked non-urgent, so React can interrupt it to handle urgent updates such as typing','Transitions only apply to routing','Transitions skip rendering entirely'],a:1,
 e:'startTransition and useTransition tell React the update can be deferred. The UI stays responsive because the urgent update wins and the transition is re-run afterwards.'},

{q:'What does isPending from useTransition indicate?',
 o:['That the component unmounted','That a transition is in flight and the interface should probably show a subtle loading indicator rather than blocking','That an error occurred','That data is cached'],a:1,
 e:'isPending lets you show a non-blocking indicator, such as dimming a list, instead of a full-screen spinner. It is the intended UX for transitions.'},

{q:'When is useDeferredValue preferable to useTransition?',
 o:['When you do not control the state update, such as receiving a prop from a parent or a third-party input','When you control the update and can wrap it in startTransition','They are identical','When the value is a number'],a:0,
 e:'useDeferredValue works on values you receive. useTransition wraps a state update you make. Both give the same "let the urgent render win" behaviour.'},

{q:'What does React do with a render that is interrupted by an urgent update?',
 o:['Commits it anyway','Discards it and starts again from the latest state, so no partial or inconsistent UI is shown','Freezes the browser','Throws an error'],a:1,
 e:'Renders before commit are not visible to the user. React throws away the interrupted work, which is why render-phase code must be pure and side-effect free.'},

{q:'Why must a component not mutate props or external variables during render?',
 o:['For performance only','Because render may run multiple times or be discarded, so mutations leak across attempts and produce inconsistent UI','Because the linter forbids it','Because it breaks SSR'],a:1,
 e:'Purity is the contract that makes concurrent rendering safe. Side effects belong in event handlers or effects, where React can control when they run.'},

{q:'What does the React 19 compiler do about concurrency?',
 o:['It disables concurrency','It memoises components automatically so fewer renders are needed and transitions are cheaper','It replaces Suspense','It moves rendering to the server'],a:1,
 e:'Automatic memoisation reduces wasted work, which complements concurrent features. It does not change the declarative model; it just removes manual memoisation ceremony.'},

{q:'What is a subtle cost of starting a transition for a very cheap update?',
 o:['None','The update is deferred, so it may feel slower than a synchronous update for trivial work','It causes memory leaks','It disables batching'],a:1,
 e:'Transitions are a tool for expensive updates. Wrapping a simple toggle in a transition can introduce a perceptible delay, which is worse UX than a synchronous render.'},

/* 11–20: Suspense, error boundaries, streaming */
{q:'What does a Suspense boundary do when a child suspends?',
 o:['Unmounts the child','Shows the fallback until the suspended work is ready, then swaps in the real content','Retries the render immediately','Fails the whole app'],a:1,
 e:'Suspense lets you declare loading states declaratively. Multiple suspended children under one boundary share the same fallback, which is why boundary placement matters for UX.'},

{q:'How do you catch render errors in React?',
 o:['With a try/catch around the JSX','With an error boundary, a class component implementing getDerivedStateFromError or componentDidCatch','With window.onerror only','With a Suspense boundary'],a:1,
 e:'Error boundaries are still class-only, though libraries wrap them. In React 19, onUncaughtError and onCaughtError options on createRoot provide an additional hook for logging.'},

{q:'Which errors does an error boundary NOT catch?',
 o:['Errors in child render','Errors in event handlers, asynchronous callbacks, and the boundary\'s own render','Errors in lifecycle methods','Errors in getDerivedStateFromError'],a:1,
 e:'Error boundaries catch errors during render, lifecycle and constructors of descendants. Event handler and async errors must be handled with try/catch or by setting state that triggers a fallback render.'},

{q:'What does React 19\'s use() hook change about Suspense usage?',
 o:['It removes Suspense','It lets you read a promise or context in render, so a component suspends on data instead of needing an isLoading branch','It makes error boundaries unnecessary','It forces SSR'],a:1,
 e:'use(promise) suspends until the promise resolves. For this to be safe, the promise must be stable across renders, which is why frameworks or a cache supply it.'},

{q:'What is streaming SSR?',
 o:['Compressing HTML','Sending the initial HTML shell immediately and streaming the rest as Suspense boundaries resolve on the server','Streaming video','Client-side routing'],a:1,
 e:'Streaming improves perceived performance: the header and layout paint early, and slow sections arrive later in the same response without blocking the whole page.'},

{q:'What is a common cause of a hydration mismatch?',
 o:['Using CSS modules','Rendering non-deterministic values such as Date.now(), Math.random() or browser-only data during render','Using TypeScript','Using context'],a:1,
 e:'The client render must match the server HTML. Nondeterministic values differ, so React warns and may discard the server-rendered DOM for that subtree.'},

{q:'What is selective hydration?',
 o:['Hydrating only the footer','React prioritises hydrating the parts of the page the user interacts with first, while other Suspense boundaries hydrate later','Hydrating only on mobile','Skipping hydration entirely'],a:1,
 e:'Clicking a not-yet-hydrated region triggers React to hydrate that boundary and replay the interaction. This is what makes streaming SSR feel interactive sooner.'},

{q:'Why is a Suspense boundary often placed around a route rather than the whole app?',
 o:['For aesthetics','So a slow route shows its own fallback without hiding already-rendered content such as the shell and navigation','Because React requires it','To reduce bundle size'],a:1,
 e:'Placement controls blast radius. A single top-level boundary makes the whole page flash on any slow route, while per-route boundaries keep navigation feel instant.'},

{q:'What is the React 19 `useOptimistic` hook for?',
 o:['Caching data','Showing an optimistic UI state while an async action is in flight, reverting automatically if the action fails','Debouncing inputs','Scheduling transitions'],a:1,
 e:'It pairs naturally with Actions. The optimistic value renders immediately, and React reconciles it when the real result arrives or reverts on error.'},

{q:'What does the React 19 form `action` prop enable?',
 o:['Only client validation','Passing an async function to a form, with React managing pending state, error handling and resetting the form on success','Server-side rendering only','Automatic routing'],a:1,
 e:'Using <form action={save}> with useActionState removes the boilerplate of manual isSubmitting flags and try/catch around submissions, and it integrates with transitions.'},

/* 21–30: Advanced hooks & patterns */
{q:'What does useImperativeHandle let a component do?',
 o:['Read another component\'s state','Customise the value exposed through a ref, so a parent gets a specific imperative API instead of the raw DOM node','Replace forwardRef','Prevent re-renders'],a:1,
 e:'Paired with forwardRef, it lets a component expose focus, scrollIntoView or a custom play method while keeping internals private.'},

{q:'Why is forwardRef needed before React 19?',
 o:['To pass refs through to a DOM node','Because ref is not a normal prop and is stripped by React before reaching the component','To create refs','To memoise refs'],a:1,
 e:'In React 19, ref is a regular prop, so forwardRef is no longer required for function components, though it still works for compatibility.'},

{q:'What does useDebugValue do?',
 o:['Logs to the console','Labels a custom hook in the React DevTools, helping you inspect its current state','Adds a breakpoint','Disables hooks'],a:1,
 e:'It has no effect on behaviour and only surfaces information in DevTools. It is typically used in libraries rather than application code.'},

{q:'What is a render prop?',
 o:['A prop that returns a number','A prop whose value is a function that the component calls to render part of the UI, sharing logic without hooks','A CSS class name','A ref callback'],a:1,
 e:'Render props predate hooks and still appear in libraries, such as a data fetcher that receives a render function. Hooks have largely replaced them for application code.'},

{q:'What is a higher-order component (HOC)?',
 o:['A component with a higher z-index','A function that takes a component and returns a new component, adding behaviour such as authentication or logging','A component that renders above others','A context provider'],a:1,
 e:'HOCs were the pre-hooks way to share cross-cutting behaviour. They remain common in older codebases and in some libraries, but hooks are simpler and avoid wrapper hell.'},

{q:'What is the compound component pattern?',
 o:['A component with many props','A parent component plus related children (for example Tabs and Tab) that share implicit state through context while exposing a declarative API','A component that renders twice','A component with no state'],a:1,
 e:'Compound components give flexibility without prop soup. The parent owns state and provides context, while children are written by the consumer in a readable structure.'},

{q:'What is the container/presentational split?',
 o:['A CSS layout pattern','Separating data-fetching and logic (container) from purely visual rendering (presentational), which makes the visual part easy to test and reuse','A routing pattern','A server pattern'],a:1,
 e:'Hooks made this less formal, but the underlying idea remains: keep components focused, and separate "how to get data" from "how to display it".'},

{q:'What does `useReducer` dispatch identity guarantee?',
 o:['It changes on every render','It is stable across renders, which is why it can be omitted from effect dependency arrays','It is undefined until first dispatch','It is unique per action'],a:1,
 e:'A stable dispatch is convenient for passing down through context: components that only dispatch do not re-render on state changes.'},

{q:'When should a ref be used instead of state?',
 o:['When the value should trigger a re-render','When you need a mutable value that persists across renders but does not affect rendering, such as a timer id or an imperative handle','When the value comes from props','When the value is an array'],a:1,
 e:'Using state for things that do not affect rendering causes unnecessary renders. Using refs for things that do affect rendering causes the UI to go stale.'},

{q:'What is the "latest ref" pattern?',
 o:['A ref that always holds the newest value, so a stable callback or effect can read current props or state without re-subscribing','A ref to the most recently mounted component','A ref created with useMemo','A ref that updates only once'],a:0,
 e:'It is useful for event listeners and interval callbacks that need fresh values without being recreated. In React 19, the experimental useEffectEvent addresses the same problem more directly.'},

/* 31–40: Server components, frameworks & data */
{q:'Which statement correctly describes React Server Components?',
 o:['They are client components with SSR enabled','They render only on the server, never ship their code to the client, and can access server-only resources directly','They are the same as SSR','They require a CDN'],a:1,
 e:'RSC is a distinct runtime model. The server sends a serialised description of the rendered tree, and the client never downloads the server component code, which can reduce bundle size significantly.'},

{q:'Can a server component use useState or useEffect?',
 o:['Yes, freely','No — hooks that involve client interactivity are not available in server components; interactivity lives in client components','Only useEffect','Only in development'],a:1,
 e:'Server components run once per request (or are cached) and have no client lifecycle. Any interactive UI must be extracted into a client component marked with "use client".'},

{q:'What does a `"use client"` directive actually mark?',
 o:['A file that only runs in the browser','A module boundary: this module and its imports are part of the client graph, and the bundler ensures their code reaches the browser','A component that cannot use hooks','A component that is not server-rendered'],a:1,
 e:'Client components are still server-rendered to HTML in frameworks like Next.js. "use client" marks where client JavaScript begins, not where rendering happens.'},

{q:'What is the main risk of importing a heavy library inside a client component used by a small piece of UI?',
 o:['It breaks SSR','It pulls the library into the client bundle for every route that references it','It disables hydration','It removes Suspense'],a:1,
 e:'Bundle cost is per client boundary. Keeping interactive islands small, or using dynamic import, keeps the client bundle proportionate to actual interactivity.'},

{q:'In React Router 6.4+ data routers, what does a loader do?',
 o:['Loads the component bundle','Runs before the route renders to fetch data, so the component receives it without a useEffect fetch','Renders a fallback','Handles form submission'],a:1,
 e:'Loaders move data fetching out of the component, which avoids request waterfalls and loading flicker. The router can also prefetch on hover and keep data across navigations.'},

{q:'What is the purpose of an action in React Router data APIs?',
 o:['It replaces loaders','It handles mutations tied to a route, typically a form submission, and revalidates loaders afterwards','It defines a redirect','It sets a title'],a:1,
 e:'Progressive enhancement is the point: a plain <form method="post"> works without JavaScript and the router upgrades it to a fetch-based submission when JS is available.'},

{q:'What does a React 19 Action\'s pending state replace in a typical form?',
 o:['Form validation','Manual isSubmitting state and disabled-button logic','Routing','State management'],a:1,
 e:'useActionState (or useFormStatus inside a child) exposes pending state so the submit button can be disabled while the action runs, without bespoke flags.'},

{q:'What is a request waterfall, and why is it a problem?',
 o:['A caching strategy','Sequential data requests where each waits for the previous one, multiplying latency compared with fetching in parallel','A server error','A rendering mode'],a:1,
 e:'React 18 and router loaders help by parallelising fetches before render. In client-only code, parallelising independent requests with Promise.all is the standard fix.'},

{q:'What does `cache()` from React provide (React 19 / frameworks)?',
 o:['A browser cache API','Memoisation of a function\'s result within a single server request, so repeated calls with the same arguments hit once','A persistent disk cache','A route cache'],a:1,
 e:'Request-scoped memoisation prevents duplicate database or API calls in a server render tree. It is not a long-lived cache; it lives and dies with the request.'},

{q:'Why do frameworks like Next.js and Remix matter for React in production?',
 o:['React cannot be used without them','They provide routing, data loading, server rendering, bundling and deployment conventions that React itself intentionally leaves out','They replace React','They are required for hooks'],a:1,
 e:'React is a UI library. Production apps need a full stack around it, and frameworks package the decisions: routing model, data fetching, streaming, bundling and hosting.'},

/* 41–50: Performance in practice */
{q:'What does the React DevTools "Why did this render?" panel help with?',
 o:['Checking CSS','Showing whether a render was caused by props, state, context or parent, which pinpoints the actual cause rather than guessing','Measuring bundle size','Finding memory leaks'],a:1,
 e:'The panel tells you which dependency changed. Without it, developers often memoise the wrong components and see no improvement.'},

{q:'What is the cost of Context.Provider value not being memoised?',
 o:['None','A new object on every render causes every consumer to re-render even when the underlying data has not changed','It throws a warning','It breaks SSR'],a:1,
 e:'Wrapping the value in useMemo is the standard fix. Splitting the context so state and dispatch are separate providers usually helps more.'},

{q:'What is the main trade-off of React.lazy + Suspense for a below-the-fold component?',
 o:['There is no trade-off','An extra network round trip for the chunk, which can cause a visible fallback if the component is needed immediately','It increases the main bundle','It disables hydration'],a:1,
 e:'Code splitting helps the initial load but introduces a loading state later. Prefetching on idle or on hover usually removes the perceived cost.'},

{q:'What does the `inert` attribute help with in modals?',
 o:['Styling the modal','Making background content non-interactive and invisible to assistive technology while a modal is open','Animating the modal','Compressing the modal'],a:1,
 e:'React 19 supports inert as a boolean attribute. It is the correct accessibility primitive for focus containment, alongside a focus trap for keyboard users.'},

{q:'Why is `dangerouslySetInnerHTML` risky?',
 o:['It is slow','It bypasses React\'s escaping and can introduce XSS if the HTML is not sanitised','It is deprecated','It breaks SSR'],a:1,
 e:'Sanitise on the server with a library like DOMPurify and treat any user-controlled value as untrusted. The name is deliberately alarming.'},

{q:'What is the recommended way to render a very large table?',
 o:['Render every row and hide the extras with CSS','Virtualise the rows so only the visible window is mounted, and paginate or stream data if the backend cannot return everything','Use snapshots','Use refs'],a:1,
 e:'Mounting tens of thousands of DOM nodes kills performance regardless of memoisation. Virtualisation plus server-side pagination is the scalable answer.'},

{q:'What is a common cause of an infinite render loop when setting state in render?',
 o:['State cannot be set in render','Calling a setter unconditionally during render, which schedules another render immediately','Using context','Using keys'],a:1,
 e:'React 19 warns about this. The pattern is only valid in the rare "derive state from previous render" case, guarded by a condition that becomes false.'},

{q:'What does `startTransition` guarantee about the update?',
 o:['That it completes quickly','Nothing about timing, only that it is deprioritised; the update still happens','That it is skipped if slow','That it is batched with the urgent update'],a:1,
 e:'There is no timing guarantee. React can interrupt it, and if the user never needs the result, it may never finish visibly. It is a priority hint, not a promise.'},

{q:'Why can a large `useEffect` dependency object cause performance problems?',
 o:['It throws','A new object identity each render re-runs the effect every render, which may trigger fetches, timers or subscriptions repeatedly','It disables memo','It creates a memory leak in React'],a:1,
 e:'This is why dependencies should be primitives or memoised. The exhaustive-deps linter will also flag the unstable value, which is usually a sign the object should be created inside the effect.'},

{q:'What is the practical benefit of colocating CSS with components (CSS modules, styled-components, Tailwind)?',
 o:['Faster React rendering','Scoping and colocation reduce accidental global styles and dead CSS, making refactors safer','Better SSR','Smaller components'],a:1,
 e:'The rendering cost is similar. The real benefit is maintainability: a component and its styles move together, and removing the component removes its styles.'},

/* 51–60: Forms, validation & accessibility */
{q:'What is the accessibility benefit of using label with htmlFor?',
 o:['It styles the input','It programmatically associates the label with the input, so screen readers announce it and clicking the label focuses the input','It validates input','It prevents submission'],a:1,
 e:'A placeholder is not a label: it disappears on input and is not reliably announced. Explicit label association is the baseline for accessible forms.'},

{q:'Which ARIA attribute communicates that a field has failed validation?',
 o:['aria-invalid','aria-error','aria-required','aria-disabled'],a:0,
 e:'aria-invalid="true" plus aria-describedby pointing at the error text gives screen reader users the same information sighted users get from the red outline.'},

{q:'What should happen to focus when a modal opens?',
 o:['It should stay where it was','It should move into the modal, usually to the first focusable element or the dialog container, and return to the trigger on close','It should move to the address bar','It should be removed'],a:1,
 e:'Focus management is the difference between an accessible dialog and a keyboard trap. The native <dialog> element and libraries like Radix handle this correctly.'},

{q:'Why is `aria-live="polite"` useful for form errors or toasts?',
 o:['It styles the message','It makes screen readers announce content changes at a non-interrupting moment','It focuses the element','It validates input'],a:1,
 e:'Without a live region, dynamically inserted errors are silent for screen reader users. polite waits for a pause; assertive interrupts, which is usually too aggressive.'},

{q:'What is the correct way to build a button that triggers an action and is also accessible?',
 o:['A div with onClick','A real <button type="button"> so keyboard, focus and screen reader semantics work by default','An anchor without href','A span with tabindex'],a:1,
 e:'Native elements come with keyboard handling and semantics for free. Recreating them with divs is the most common accessibility failure in React apps.'},

{q:'What does a debounced validation strategy protect against?',
 o:['Server outages','Firing a validation request on every keystroke, which wastes bandwidth and can race out-of-order responses','Large bundles','Hydration errors'],a:1,
 e:'Debounce or validate on blur, and guard against races with an AbortController or a request id. Instant feedback on blur is usually better UX than per-keystroke validation.'},

{q:'What is a controlled-input pitfall with `value` and no `onChange`?',
 o:['It works fine','React makes the input read-only and logs a warning, because the value can never change','It throws immediately','It resets the form'],a:1,
 e:'The fix is to supply onChange or use readOnly explicitly. Providing defaultValue instead of value is the uncontrolled alternative.'},

{q:'How should you handle a file input in React?',
 o:['With a controlled value','With an uncontrolled input read through a ref, because browsers do not allow programmatically setting a file input\'s value','With a hook','With a hidden field'],a:1,
 e:'Use ref.current.files or the onChange event. Validate type and size on the client for UX, and always re-validate on the server, since client checks can be bypassed.'},

{q:'What is progressive enhancement in a React form?',
 o:['Adding animations','Making the form work without JavaScript and then enhancing it with client-side behaviour when JS is available','Using CSS only','Server rendering only'],a:1,
 e:'React Router actions and React 19 form actions support this: the markup is a normal form, and JavaScript upgrades it to an asynchronous, no-reload submission.'},

{q:'Why is client-side validation alone insufficient?',
 o:['Because it is slow','Because anyone can bypass it by calling the API directly, so the server must enforce the same rules','Because it breaks SSR','Because it is not accessible'],a:1,
 e:'Client validation is UX, server validation is security and data integrity. Both should implement the same constraints, ideally from a shared schema.'},

/* 61–70: TypeScript & API design */
{q:'How do you type a component that accepts children?',
 o:['React.FC only','Using PropsWithChildren<P> or an explicit children?: React.ReactNode prop','Using any','Using a generic'],a:1,
 e:'children is typed as ReactNode, which includes elements, strings, numbers, fragments, null and arrays. React.FC historically added implicit children, which is one reason it fell out of favour.'},

{q:'Why is `React.FC` no longer recommended?',
 o:['It is deprecated','It adds implicit children typing and limits generic components, so a plain function with an explicit props type is clearer','It breaks hooks','It is slower'],a:1,
 e:'An explicit props type is more precise, composes better with generics, and avoids surprising behaviour when children is not actually supported.'},

{q:'What does a discriminated union model well in React?',
 o:['CSS states','Mutually exclusive component states, such as a loading variant, an error variant and a success variant with different props','Refs','Effects'],a:1,
 e:'A discriminated union makes impossible states unrepresentable and gives exhaustive narrowing in a switch. It is the idiomatic way to type complex component APIs.'},

{q:'What is the benefit of typing events with ChangeEvent<HTMLInputElement>?',
 o:['Nothing','It gives correct typing for event.target.value and prevents passing the wrong element type','It improves performance','It enables SSR'],a:0,
 e:'Typing events narrowly catches real bugs, such as reading value from a form element that does not have one, at compile time.'},

{q:'How do you type a ref to a DOM element?',
 o:['useRef<any>()','useRef<HTMLInputElement>(null)','useRef<HTMLElement>()','useRef<Element | null>()'],a:1,
 e:'Initialise with null and type the element precisely. The ref is then readonly in React 19 types, and current is null until the element mounts.'},

{q:'What is the difference between `ReactNode` and `ReactElement`?',
 o:['They are identical','ReactElement is a JSX object with a type and props; ReactNode is the wider union including strings, numbers, null, booleans and arrays','ReactNode is deprecated','ReactElement includes null'],a:1,
 e:'Prop types that accept "anything renderable" should use ReactNode. ReactElement is only appropriate when you specifically need a single JSX element.'},

{q:'Why might a component typed with `any` props be a liability?',
 o:['It renders slower','It silently accepts wrong props, so mistakes surface at runtime instead of compile time, defeating the purpose of TypeScript','It breaks hooks','It cannot be memoised'],a:1,
 e:'any disables checking along the whole chain. unknown forces narrowing, and precise types let the compiler catch misuse and drive autocompletion.'},

{q:'What does a generic component allow?',
 o:['Faster rendering','Reusing the same component with different value types while preserving type inference, such as a typed list or select','Avoiding props','Server rendering'],a:1,
 e:'<List<T> items={T[]} renderItem={(t:T)=>ReactNode}> keeps the relationship between items and renderItem type-safe, which any or unknown would lose.'},

{q:'What is the value of a shared validation schema (Zod, Yup) across client and server?',
 o:['Smaller bundle','One definition of the rules, so client UX validation and server enforcement cannot drift apart','Better SSR','Automatic routing'],a:1,
 e:'Drift between client and server rules is a common bug source. Sharing the schema, and even the TypeScript type via z.infer, keeps both sides aligned.'},

{q:'How should you type an async event handler that updates state?',
 o:['As a void function','As returning Promise<void>, while noting that React does not await it, so errors must be handled inside','As a generator','As a callback ref'],a:1,
 e:'React ignores the returned promise, so an unhandled rejection can escape. Wrap the body in try/catch or feed the promise into a transition or action.'},

/* 71–80: Testing in depth */
{q:'What does `screen.getByRole("button", { name: /save/i })` assert implicitly?',
 o:['Only that a button element exists','That an accessible button with the accessible name matching "save" exists, which validates accessibility as well as presence','That the CSS class exists','That the event handler is correct'],a:1,
 e:'Role queries double as accessibility checks. If getByRole cannot find the control, assistive technology likely cannot either.'},

{q:'What does `findBy*` do differently from `getBy*`?',
 o:['Nothing','findBy waits for the element to appear, returning a promise, which is essential for asynchronous UI','findBy is deprecated','findBy only works with forms'],a:1,
 e:'findBy is the async query. Using getBy for content that appears after a fetch produces flaky tests, and manual waitFor wrappers are usually unnecessary.'},

{q:'Why should tests avoid asserting on component internal state?',
 o:['It is not possible','Internal state is an implementation detail; asserting on rendered output keeps tests valid across refactors','It is slower','It breaks TypeScript'],a:1,
 e:'Tests coupled to implementation break on every refactor and give false confidence. The RTL philosophy is to assert what the user can see and do.'},

{q:'What is `userEvent.type(input, "hello")` better at than `fireEvent.change(input, ...)`?',
 o:['Speed','Simulating realistic typing, including focus, keydown, input and keyup for each character, which catches handlers that fireEvent misses','Server rendering','Snapshot testing'],a:1,
 e:'Realistic event sequences surface bugs where a handler listens for keydown rather than change. It is slower but far more faithful.'},

{q:'What is `jest.fn()` typically used for in React tests?',
 o:['Rendering components','Creating a mock function to pass as a prop and assert it was called, for example an onSubmit callback','Mocking CSS','Mocking the router only'],a:1,
 e:'Spy assertions like expect(handleClick).toHaveBeenCalledWith(expected) verify interaction without reaching into component internals.'},

{q:'How do you test a component that fetches data on mount?',
 o:['Assert on fetch implementation details','Mock the network layer (MSW or a mocked module), render the component, and assert on the loading state and the final UI with findBy queries','Use snapshots only','Test the API separately and skip the component'],a:1,
 e:'Mock Service Worker is the recommended approach: it intercepts real fetch/XHR at the network boundary, so the component exercises its real code path.'},

{q:'What is the difference between `mockImplementation` and `mockReturnValue`?',
 o:['They are identical','mockImplementation supplies a function run on each call; mockReturnValue supplies a fixed return value','mockReturnValue is async','mockImplementation only works once'],a:1,
 e:'Use mockReturnValueOnce for sequences and mockImplementation when the behaviour depends on arguments, such as different responses per URL.'},

{q:'Why can act() warnings appear in tests?',
 o:['Because React is broken','Because state was updated outside React\'s control (for example in a resolved promise) and the test asserted before the update was flushed','Because of CSS','Because of TypeScript'],a:1,
 e:'RTL queries like findBy and userEvent already wrap in act. Manual act is a code smell that usually indicates a missing await or an unhandled async update.'},

{q:'What is a good test pyramid for a React app?',
 o:['Mostly end-to-end','Many fast component and hook tests, fewer integration tests, and a small set of critical end-to-end flows','Only snapshot tests','Only unit tests for utilities'],a:1,
 e:'The pyramid balances confidence and speed. A small number of E2E tests cover the critical user journeys, while component and integration tests catch most regressions quickly.'},

{q:'What does `renderHook` enable?',
 o:['Rendering a full app','Testing a custom hook in isolation by rendering a tiny host component and exposing its result and rerender function','Testing CSS','Testing the router'],a:1,
 e:'It is the standard way to verify a custom hook\'s state transitions, cleanup and dependency behaviour without building UI around it.'},

/* 81–90: State management patterns at scale */
{q:'What is cache invalidation in a server-state library?',
 o:['Clearing the browser cache','Marking a query key stale so it refetches on next use or immediately, which keeps the UI in sync after a mutation','Deleting the service worker','Restarting the app'],a:1,
 e:'After a successful mutation you invalidate the affected keys. This declarative link between mutations and reads is what makes server-state libraries reliable.'},

{q:'What does `staleTime` control in TanStack Query?',
 o:['How long data stays in memory','How long data is considered fresh, so no background refetch happens during that window','How often the component re-renders','The retry delay'],a:1,
 e:'staleTime is freshness; gcTime (formerly cacheTime) is how long an unused query stays in memory. Confusing the two is a very common source of unexpected refetches.'},

{q:'What is optimistic update with rollback?',
 o:['A database transaction','Applying a mutation to the local cache immediately, then rolling back to the previous cache snapshot if the request fails','A retry strategy','A caching policy'],a:1,
 e:'Server-state libraries expose onMutate, onError and onSettled hooks for exactly this. The rollback keeps the UI consistent when the server rejects the change.'},

{q:'When should a global client-state store be introduced?',
 o:['Immediately in every project','When state is genuinely shared across distant parts of the tree and context becomes awkward or causes too many re-renders','When you need a database','When you use TypeScript'],a:1,
 e:'Most state is local or server state. Adding a store early makes every change a cross-cutting concern, and it is harder to remove than to add later.'},

{q:'What is the risk of putting server data into a client store manually?',
 o:['It is faster','You re-implement caching, invalidation and deduplication by hand, and the store drifts from the server','It breaks SSR','It cannot be typed'],a:1,
 e:'Keep categories separate: local UI state in React, shared client state in a store, and remote data in a server-state library. Mixing them is where most state bugs come from.'},

{q:'What does `useSyncExternalStore` require from getSnapshot?',
 o:['It may return a new object every call','It must return a cached, stable value for unchanged state; returning a fresh object every call causes infinite re-renders','It must be async','It must throw'],a:1,
 e:'React calls getSnapshot during render and after notifications. An unstable snapshot fails the equality check, so it must return the same reference until the store actually changes.'},

{q:'What is the benefit of splitting a Redux store into slices?',
 o:['Smaller bundles','Each slice owns a domain area with its own reducers and actions, which keeps logic modular and lets it be lazily injected','Faster rendering','Better SSR'],a:1,
 e:'Redux Toolkit slices also generate action creators and types. Lazy-loaded slices let feature code bring its own reducer when the route loads.'},

{q:'What does `useSelector` with an unstable selector return cause?',
 o:['Nothing','Unnecessary re-renders, because the selector returns a new object each time; memoise or select primitives instead','A crash','A memory leak'],a:1,
 e:'Using shallowEqual, or returning already-memoised derived data via reselect, is the standard fix. Selecting the smallest possible slice is even simpler.'},

{q:'What problem does an event bus or pub/sub pattern introduce?',
 o:['Too much typing','Implicit, hard-to-trace data flow: a component reacts to events it never subscribed to visibly, making dependencies invisible in the component tree','Slow rendering','Bundle size'],a:1,
 e:'Explicit props, context or a typed store keep dependencies visible. Event buses are usually a smell in React codebases, except at genuine cross-app boundaries.'},

{q:'What is the "single source of truth" rule for URL state?',
 o:['URLs should be ignored','Search filters, pagination and tabs should live in the URL, so refresh, sharing, back-button and deep links all work','State should never be in the URL','Only React Router can use URLs'],a:1,
 e:'URL state is shareable and survives reloads for free. Duplicating it in a store causes the two to disagree, which is a common and confusing bug.'},

/* 91–100: Tooling, ecosystem & security */
{q:'What is Fast Refresh?',
 o:['A production optimisation','A development feature that hot-replaces a component while preserving its state, falling back to a full reload when necessary','A CDN','A bundle analyser'],a:1,
 e:'Fast Refresh makes iterating on UI extremely fast. It preserves state for components with stable identity, and resets it when the component\'s signature changes.'},

{q:'What is tree shaking, and what does React need for it to work?',
 o:['Removing unused CSS','Dead-code elimination by the bundler, which requires ES modules and side-effect-free packages, so unused exports are dropped','Compressing images','Caching modules'],a:1,
 e:'Importing named exports from ESM libraries keeps bundles small. CommonJS and side-effectful modules defeat tree shaking, which is one reason ESM-first packages are preferred.'},

{q:'What is a common cause of a large React bundle?',
 o:['Using hooks','Importing whole libraries when only a small part is used, such as all of lodash or a heavy date library, without code splitting','Using TypeScript','Using fragments'],a:1,
 e:'Named imports from ESM builds, smaller alternatives (date-fns instead of moment), and dynamic import for heavy components usually deliver the biggest savings.'},

{q:'What does React StrictMode's double-invocation of effects reveal?',
 o:['A React bug','Missing cleanup logic or effects that are not resilient to being set up and torn down twice','A CSS issue','A routing issue'],a:1,
 e:'It simulates remounting so that subscriptions, timers and listeners must be idempotent and properly cleaned up. Production does not double-invoke.'},

{q:'Why is it important to sanitise any user-generated HTML before rendering it?',
 o:['It renders faster','To prevent cross-site scripting, where injected scripts can steal credentials or perform actions as the user','To improve SEO','To enable SSR'],a:1,
 e:'Sanitise on the server, allowlist safe tags, and avoid dangerouslySetInnerHTML for user content. A Content Security Policy is a valuable additional layer.'},

{q:'What does a Content Security Policy protect against?',
 o:['Database injection','Injected scripts and malicious origins by restricting which sources can load scripts, styles and connections','Slow rendering','Bundle size'],a:1,
 e:'CSP limits the impact of XSS by disallowing inline and untrusted scripts. It requires care with React apps that use inline styles or third-party scripts.'},

{q:'Why should secrets never be placed in client-side React environment variables?',
 o:['They are too long','Variables prefixed for client exposure (such as VITE_ or NEXT_PUBLIC_) are embedded in the bundle and visible to anyone, so secrets must stay on the server','They are encrypted','They are removed in production'],a:1,
 e:'Anything in the client bundle is public. Server-only secrets belong in server code, environment configuration on the host, or a secret manager accessed through your own API.'},

{q:'What is the security concern with `eval`, `new Function` and similar constructs in a React app?',
 o:['They are slow','They execute arbitrary strings as code, which becomes an injection vector if the input is user-controlled','They break SSR','They are deprecated'],a:1,
 e:'Avoid dynamic code execution entirely where possible. If you need plugins or expressions, use a constrained parser or a sandbox rather than raw eval.'},

{q:'What does React 19's `useFormStatus` hook read?',
 o:['Form validation state','The submission status of the nearest parent form, such as pending, so a child submit button can disable itself without prop drilling','The current URL','The router state'],a:1,
 e:'It must be called from a component rendered inside the form, not from the component that renders the form. That placement is the most common mistake with it.'},

{q:'What is the best summary of when to use React state versus external tools?',
 o:['Always use a global store','Use local state by default, lift it when siblings need it, use context for widely shared stable values, a store for genuinely global client state, and a server-state library for remote data','Always use Redux','Always use context'],a:1,
 e:'Choosing the smallest tool that solves the problem keeps the app simpler. Most "state management problems" are actually server-state or URL-state problems in disguise.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
