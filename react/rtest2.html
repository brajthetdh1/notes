<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Mock Test — Set 2 · 100 MCQs</title>
<meta name="description" content="100 advanced React MCQs: class components, Redux Toolkit, Zustand, React Query, React 19 features, Server Components, TypeScript, testing, performance and SSR.">
<style>
  :root{--brand:#7c3aed;--brand-dark:#4c1d95;--accent:#a78bfa;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-text-size-adjust:100%;}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#1e1b4b;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px;}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#f3e8ff;border-color:#e9d5ff}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(124,58,237,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){.card{padding:16px}}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){.qtext{font-size:.98rem}}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s;}
  .option:hover{border-color:var(--brand);background:#faf5ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;}
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#f3e8ff}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){.btn.danger{margin-left:0;width:100%}}
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){.hint{display:none}}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)}.st-bad b{color:var(--bad)}.st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⚛️ React Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
const QS = [

/* 1–10: Class components & legacy */
{q:"Which lifecycle method was replaced by getDerivedStateFromProps?",
 o:["componentDidMount","componentWillMount","componentWillReceiveProps","componentWillUpdate"],a:2,
 e:"componentWillReceiveProps was removed in favour of the static getDerivedStateFromProps, which is safer under async rendering because it cannot cause side effects."},

{q:"What is the purpose of shouldComponentUpdate?",
 o:["To update state","To let you return false to skip re-rendering when nothing relevant changed","To force a re-render","To reset state"],a:1,
 e:"Returning false skips the render for the current change. React.PureComponent implements a shallow comparison automatically; function components use React.memo instead."},

{q:"What does componentDidMount run after?",
 o:["Before the first render","During state initialization","Only when props change","The component has been mounted to the DOM"],a:3,
 e:"componentDidMount runs once after the initial commit. It is the place for subscriptions, DOM measurements and initial fetches; its counterpart is componentWillUnmount."},

{q:"What does getDerivedStateFromProps return?",
 o:["An object to merge into state, or null to update nothing","A Promise","A boolean","Nothing, it is a no-op"],a:0,
 e:"It is a static method (no access to this) called before every render. Use it sparingly: most derived values are better computed during render than stored in state."},

{q:"What is getSnapshotBeforeUpdate used for?",
 o:["Taking screenshots","Memoizing props","Capturing DOM info (like scroll position) before the DOM is updated","Reading state after update"],a:2,
 e:"Its return value is passed as the third argument to componentDidUpdate. It is the correct tool for maintaining scroll position when new content is added above."},

{q:"What is a higher-order component (HOC)?",
 o:["A component that extends React.Component","A function that takes a component and returns a new component with additional props or behavior","A component that renders children","A component with two parents"],a:1,
 e:"connect() from React-Redux is the classic HOC. Custom hooks have largely replaced HOCs for logic reuse because they compose without extra tree depth."},

{q:"What is the render prop pattern?",
 o:["A prop that contains CSS","A prop that must be a React element","A deprecated pattern","A prop that is a function returning JSX to share logic"],a:3,
 e:"The consumer passes a function that the component calls with its internal state, so the consumer controls rendering. Downshift and React Router's older APIs popularised it."},

{q:"How does React.PureComponent differ from React.Component?",
 o:["It performs a shallow comparison of props and state to decide whether to re-render","It has more lifecycle methods","It cannot use state","It is faster to type"],a:0,
 e:"A shallow comparison means objects and arrays with new references always count as changed, so unstable props defeat the optimisation. React.memo is the function-component equivalent."},

{q:"Why is the legacy context API considered error-prone?",
 o:["It cannot store values","It only works in class components","An intermediate component returning false from shouldComponentUpdate can block context updates, leaving consumers stale","It is slower at runtime"],a:2,
 e:"This was the main motivation for the new context API, which consumers subscribe to directly so blocking re-renders cannot starve them of updates."},

{q:"Why do some modern codebases still contain class components?",
 o:["They are faster than function components","They are the only way to use hooks","They have better TypeScript support","Error boundaries and some third-party libraries still require them"],a:3,
 e:"There is still no hook equivalent for error boundaries (getDerivedStateFromError/componentDidCatch), and legacy libraries wrap class-based APIs, so classes persist in maintenance code."},

/* 11–20: Modern state management */
{q:"What is Redux primarily used for?",
 o:["Routing","Centralized, predictable global state management with a single store and pure reducers","Data fetching","Styling"],a:1,
 e:"Actions describe what happened, reducers compute the next state purely, and the store notifies subscribers. The strict unidirectional flow is what makes state changes traceable."},

{q:"What is Redux Toolkit (RTK)?",
 o:["The official recommended way to write Redux with less boilerplate, using createSlice and configureStore","A React router","A form library","A styling library"],a:0,
 e:"RTK wraps Immer so reducers can mutate the draft safely, and configureStore turns on sensible defaults including thunk and Redux DevTools integration."},

{q:"What is a Redux slice?",
 o:["A reducer only","A store only","A middleware","A collection of reducers and actions for one feature, generated together with createSlice"],a:3,
 e:"createSlice generates action creators and a reducer from a name, initial state and reducer map. Slices are combined in configureStore's reducer object."},

{q:"What is Zustand?",
 o:["A CSS library","A testing tool","A small, fast state management library with a hook-based API and no boilerplate","A router"],a:2,
 e:"A store is created with create((set, get) => ...), and components call useStore(selector). Selectors mean a component only re-renders when its slice of state changes."},

{q:"What is Jotai's primary primitive?",
 o:["An atom — a small, composable piece of state that components can subscribe to independently","A store","A reducer","A middleware"],a:0,
 e:"Atoms are created with atom(initialValue) and read with useAtom. Derived atoms compose, so fine-grained reactivity comes naturally without a central store."},

{q:"What is Recoil known for?",
 o:["CSS-in-JS","Atoms and selectors that form a graph of derived state with fine-grained subscriptions","Replacing React Router","Server rendering only"],a:1,
 e:"Recoil was an early attempt at fine-grained state in React. It has been in maintenance mode for some time, and Jotai or Zustand are the more commonly adopted alternatives today."},

{q:"What is the selector pattern in state management?",
 o:["A CSS selector","A query selector","A function that derives a value from the store so components re-render only when that derived value changes","A test utility"],a:2,
 e:"Selectors decouple components from the shape of the store and enable reference-stable derived values, which is what makes memoization and shallow comparison effective."},

{q:"When should you NOT introduce a global state library?",
 o:["When state is shared across many components","When the app is large","When debugging needs time-travel","When state is local to one component or a small subtree"],a:3,
 e:"Lift state to the nearest common ancestor first, then try Context. A global store adds indirection, boilerplate and a second source of truth for things that only one screen needs."},

{q:"What is the Context plus useReducer pattern?",
 o:["A light-weight store: state in useReducer, shared via Context, with dispatch for updates","A form library","A routing pattern","A styling approach"],a:0,
 e:"This is the built-in Redux-like pattern. It works well for medium apps, but every consumer re-renders on any state change, so split contexts when that becomes a problem."},

{q:"What problem do atomic state libraries (Jotai, Recoil) solve compared with a single Context store?",
 o:["Better TypeScript","Fine-grained subscriptions, so components re-render only when their atom changes, not when the whole store changes","Smaller bundle","Simpler API"],a:1,
 e:"Splitting context by concern also works, but atoms make it implicit: subscribing to one atom is what determines your re-render surface, with no Provider nesting."},

/* 21–30: Data fetching */
{q:"What is TanStack Query (React Query) primarily for?",
 o:["Global state","Routing","Server-state management: fetching, caching, synchronizing and updating server data","Styling"],a:2,
 e:"It treats server data as a cache with a lifecycle rather than as local state. Client state still belongs in useState, Context or a store."},

{q:"What does staleTime control in React Query?",
 o:["How long the cache lives","How many retries","Whether mutations are allowed","How long data is considered fresh before it becomes eligible for refetch"],a:3,
 e:"Fresh data is served from cache without refetching. Once data is stale, a refetch may still not happen immediately; that is controlled by refetchOnWindowFocus and related options."},

{q:"What is SWR?",
 o:["A data fetching library by Vercel built on the stale-while-revalidate strategy","A testing tool","A CSS framework","A router"],a:0,
 e:"useSWR(key, fetcher) returns data, error and isLoading, revalidating in the background. It is intentionally lighter than React Query and is a natural fit for Next.js apps."},

{q:"What is the difference between isLoading and isFetching in React Query?",
 o:["They are identical","isLoading is true only when there is no cached data and a fetch is in progress; isFetching is true whenever a fetch is happening, including background refetches","isLoading is for mutations only","isFetching is deprecated"],a:1,
 e:"Use isLoading for the full skeleton, and isFetching for a subtle spinner while stale data is being refreshed in the background. Showing a skeleton during a background refetch is a common UX mistake."},

{q:"How does React Query deduplicate concurrent requests to the same key?",
 o:["It does not, you have to debounce","It uses a mutex per key","It dedupes by query key and shares the in-flight promise so multiple components trigger only one request","It allows only one query per app"],a:2,
 e:"If ten components mount useQuery(['user', id]) at the same moment, React Query makes one network call and fans the result out to all observers."},

{q:"What is an optimistic update?",
 o:["A delayed update","An update that is rolled back after success","A type of query","Updating the UI immediately as if the mutation succeeded, then reconciling with the server response or rolling back on error"],a:3,
 e:"Optimistic UI makes actions feel instant, but the rollback path must be correct, and idempotent server handling is important when a client retries."},

{q:"What is useMutation for in React Query?",
 o:["Performing server-side writes (POST, PUT, DELETE) with callbacks for onSuccess, onError and cache invalidation","A GET query","A cache-only operation","A subscription"],a:0,
 e:"The typical onSuccess invalidates the affected query keys so dependent views refetch. Setting query data directly is the other option when you know the resulting shape."},

{q:"What is useInfiniteQuery used for?",
 o:["A query that runs forever","Paginated or infinite-scroll data fetching where each page is fetched on demand and appended to the cache","A query with no cache","A mutation"],a:1,
 e:"getNextPageParam decides whether another page exists and what cursor to use. fetchNextPage appends, and the cached pages array gives smooth back navigation."},

{q:"What is the waterfall problem in data fetching?",
 o:["A CSS bug","A memory leak","Sequential fetches where each request waits for the previous one, unnecessarily increasing total load time","A type of race condition"],a:2,
 e:"Fetching a user, then their posts, then each post's comments is three sequential round trips. Parallelising independent requests or fetching on the server reduces the number of hops."},

{q:"What causes the classic useEffect fetch race condition?",
 o:["Caching","A missing key","A missing dependency","An older, slower request resolving after a newer one and overwriting the newer data"],a:3,
 e:"The fix is to abort the request or ignore its result when the effect has been cleaned up, typically with an AbortController or an isCancelled flag closed over by the effect."},

/* 31–40: React 19 features */
{q:"What is useActionState in React 19?",
 o:["A hook that wraps an async action and returns the resulting state and a pending flag","A replacement for useState","A form library","A data fetching library"],a:0,
 e:"The signature is roughly const [state, formAction, isPending] = useActionState(fn, initialState). It pairs naturally with the form action prop."},

{q:"What does the use() hook in React 19 let you do?",
 o:["Run effects conditionally","Read a promise or context value inside a component, suspending until it resolves, as a departure from the usual hook rules","Replace useState","Memoize a function"],a:1,
 e:"Unlike other hooks, use() may be called conditionally. Reading a promise suspends the component until it resolves, and it must be paired with a Suspense boundary."},

{q:"What are React Server Components (RSC)?",
 o:["Components that run on the client","Components that only run on the server","Components that render on the server and ship no JavaScript for the component itself to the client","A testing tool"],a:2,
 e:"Server Components can access the database or filesystem directly and never enter the client bundle. They cannot use state or effects; interactive pieces must be Client Components."},

{q:"What does useOptimistic do?",
 o:["Makes the app faster","Caches data","Replaces useState","Lets you show an optimistic UI while an async action is pending, rolling back on failure"],a:3,
 e:"You call useOptimistic(currentState, reducer) to derive a temporary state. When the action settles, the real state takes over, discarding the optimistic overlay."},

{q:"What is the new way to handle form actions in React 19?",
 o:["Passing a function directly to the action prop of form","Using onSubmit only","Using a Redux action","Using a custom event"],a:0,
 e:"The action prop accepts a function (or a URL). React resets the form on submit automatically and integrates with useActionState and useFormStatus for pending UI."},

{q:"What is the use client directive for?",
 o:["A CSS selector","Marking a module boundary where the component and its imports run on the client","Enabling TypeScript","Importing CSS"],a:1,
 e:"It is a boundary marker at the top of a file in an RSC-enabled framework. Client Components can use hooks, browser APIs and event handlers; Server Components cannot."},

{q:"What does useFormStatus give you?",
 o:["A form validation library","A form submission handler","The pending state of the parent form submission, so you can disable the submit button or show a spinner","The form's HTML"],a:2,
 e:"It must be used in a component rendered inside the form element, not in the same component that renders the form, because it reads the nearest form's status from context."},

{q:"What is the React Compiler?",
 o:["A bundler","A type checker","A testing tool","A build-time tool that automatically memoizes components and values, reducing the need for manual useMemo and useCallback"],a:3,
 e:"It analyses components for correctness and inserts memoization automatically. Manual memoization is still valid and coexists with the compiler's output."},

{q:"In React 19, how can function components accept a ref without forwardRef?",
 o:["ref is now a regular prop","Refs are not supported","You must use a class","You must use useImperativeHandle"],a:0,
 e:"ref is passed as a normal prop, so forwardRef is no longer required. forwardRef still works for backwards compatibility and continues to be supported."},

{q:"What is the React Profiler component used for?",
 o:["A CSS tool","Measuring how often a subtree renders and how long it takes, via onRender callbacks","Profiling servers","Recording user sessions"],a:1,
 e:"Wrap a subtree in Profiler to collect per-render timings in the Profiler tab of React DevTools. It is the fastest way to find which components dominate a slow interaction."},

/* 41–50: Performance */
{q:"What is list virtualization?",
 o:["Compressing list data","Caching list items","Rendering only the visible rows (plus a small overscan) for long lists to keep the DOM small","A CSS trick"],a:2,
 e:"A 10,000-row table becomes a few dozen DOM nodes. Virtualisation trades instant scrollbar fidelity and some complexity for a dramatically smaller render cost."},

{q:"Which libraries are commonly used for list virtualization?",
 o:["Redux","styled-components","react-router","react-window and react-virtualized (and TanStack Virtual)"],a:3,
 e:"react-window is the lightweight successor to react-virtualized. TanStack Virtual is a newer, headless option with framework-agnostic core and React adapter."},

{q:"What is code splitting with React.lazy for?",
 o:["Shipping a separate chunk for a component so the initial bundle is smaller","Splitting CSS","Splitting state","Splitting tests"],a:0,
 e:"The chunk is only downloaded when the lazy component first renders. Route-level splitting is the most common use, since it aligns chunks with user navigation."},

{q:"What is tree shaking?",
 o:["A performance metric","A bundler technique that removes unused exports so they do not ship in the bundle","A React hook","A form pattern"],a:1,
 e:"Tree shaking relies on ES module static structure. Side-effect-free packages shake cleanly; CJS modules and packages with side effects often do not."},

{q:"Which of these commonly causes unnecessary re-renders?",
 o:["Using memo","Defining callbacks and object props inline on every render, so memoized children see new references","Using keys correctly","Using useCallback"],a:2,
 e:"Inline object and function props defeat React.memo. Use useCallback/useMemo (or the React Compiler) for values that cross a memo boundary."},

{q:"When is forcing a remount with the key prop useful?",
 o:["Never","To speed up rendering","To reset state of a subtree when the identity of the data it represents changes","To call useMemo"],a:3,
 e:"Changing the key tells React "this is a different component". It is the cleanest way to reset form state when switching between records."},

{q:"What is React Fiber?",
 o:["React's internal reconciliation engine that enables interruptible, prioritized rendering","A CSS framework","A state library","A router"],a:0,
 e:"Fiber breaks work into units that can be paused, resumed and abandoned. This is what makes concurrent features like transitions and Suspense possible."},

{q:"What is the difference between a transition and a regular state update?",
 o:["Transitions are faster","Transitions are non-urgent, so they can be interrupted by urgent updates like typing; regular updates block until the render completes","Transitions are synchronous","Transitions require Suspense"],a:1,
 e:"startTransition marks a state update as non-urgent. React can keep the input responsive by rendering the transition in the background and swapping when it is ready."},

{q:"How does React decide whether to commit a render?",
 o:["It commits every render","It commits only when state changes","It builds the new tree, diffs it against the previous one, and commits the resulting DOM changes in the commit phase","It commits only in StrictMode"],a:2,
 e:"The render phase is pure and can be interrupted; the commit phase is synchronous and applies the computed DOM mutations. React never commits a partial tree."},

{q:"What is the render phase vs commit phase in React?",
 o:["The same thing","Only for class components","Only for Suspense","The render phase computes the new tree (pure, interruptible); the commit phase applies changes to the DOM (synchronous)"],a:3,
 e:"Side effects belong outside the render phase. That is why React discourages mutating external state during render and points to useEffect or event handlers instead."},

/* 51–60: Testing */
{q:"What is React Testing Library?",
 o:["A testing library that encourages testing components through the user-visible DOM rather than implementation details","A component library","A CSS framework","A build tool"],a:0,
 e:"By querying by role, label or text, tests survive refactors that preserve behaviour. Implementation-detail tests break on cosmetic changes and encourage brittle assertions."},

{q:"What is the difference between getBy, queryBy and findBy in Testing Library?",
 o:["They are identical","getBy throws if not found, queryBy returns null, findBy returns a promise that resolves when the element appears","getBy is for async queries","queryBy is only for styling assertions"],a:1,
 e:"Use findBy for anything async (data loading, appearance after an interaction), getBy for assertions that must fail loudly, and queryBy when asserting absence."},

{q:"What does userEvent simulate?",
 o:["Only clicks","Only typing","Realistic user interactions (click, type, hover, tab) that fire the full event sequence a browser would","Network requests"],a:2,
 e:"userEvent wraps act() and fires pointer events, focus changes and input events in the right order. fireEvent is a lower-level escape hatch."},

{q:"What is act() and why is it needed?",
 o:["A routing primitive","A CSS rule","A testing helper for Redux","A wrapper that flushes pending React updates so tests assert on a settled UI"],a:3,
 e:"Testing Library's utilities call act() for you. If a warning appears, an update usually happened outside act — often from an effect or a promise not awaited in the test."},

{q:"What is the difference between shallow and full rendering in tests?",
 o:["Shallow renders only the component without child components; full renders the whole tree including children","Shallow is deprecated","Full is only for class components","They are the same"],a:0,
 e:"Shallow rendering (Enzyme) was once common but encouraged implementation testing. Modern practice favours full rendering with mocked network boundaries."},

{q:"What does jest.fn() create?",
 o:["A reducer","A mock function that records calls and lets you control return values","A CSS class","A component"],a:1,
 e:"You can assert on call arguments, return values and invocation count, which makes it easy to test that callbacks or spies were used correctly."},

{q:"What is snapshot testing best used for?",
 o:["Performance tests","Security tests","Detecting unintended changes in serialisable output; snapshots must be reviewed, not blindly updated","Testing network calls"],a:2,
 e:"Snapshots are a change detector, not a correctness test. If you update them without reading the diff, you have effectively disabled the test."},

{q:"What is the difference between a unit and an integration test in React?",
 o:["Unit tests use Jest, integration tests use Vitest","Unit tests are always faster","Unit tests isolate a single component or function; integration tests exercise multiple components together, often with real user interactions","They are the same thing"],a:2,
 e:"Testing Library is designed for the integration style. Mock at the network boundary (MSW) rather than mocking your own modules, so tests exercise real composition."},

{q:"What does @testing-library/jest-dom add?",
 o:["Custom matchers like toBeInTheDocument and toHaveTextContent that make assertions more readable","A new test runner","A CSS-in-JS library","A build plugin"],a:0,
 e:"You import it once in setup. The matchers are semantic and produce much better failure messages than generic equality assertions on DOM nodes."},

{q:"Why does Testing Library discourage testing by className or component internals?",
 o:["It is slower","Because tests should assert on what a user sees and does, so refactors that preserve behaviour do not break tests","Class names are not accessible","It only works with class components"],a:1,
 e:"Querying by role, label and text encodes the accessible contract. That contract is what users and assistive technologies actually depend on."},

/* 61–70: TypeScript */
{q:"What does React.FC do in TypeScript?",
 o:["A React element type","A hook","Annotates a function component, implicitly including children and return type, though many teams now prefer explicit prop types","A testing helper"],a:2,
 e:"React.FC is still valid, but explicit props with an optional children property are more precise and avoid the implicit children of React 17's typing."},

{q:"What is the recommended way to type props with children?",
 o:["any","React.FC automatically","Use a children prop of any type","Declare an explicit children?: React.ReactNode in the props type"],a:3,
 e:"ReactNode covers strings, numbers, elements, arrays, fragments, null and undefined, which is exactly what JSX accepts as children."},

{q:"How do you type a useRef that holds a DOM element?",
 o:["useRef<HTMLDivElement>(null)","useRef<HTMLElement>()","useRef(null)","useRef(undefined)"],a:0,
 e:"Passing null as the initial value with an element type gives a RefObject whose .current is that element or null. Assigning to a readonly RefObject is a type error."},

{q:"How do you type an event handler for an input change?",
 o:["(e: any)","(e: React.ChangeEvent<HTMLInputElement>)","(e: Event)","(e: object)"],a:1,
 e:"Each event type is generic over the element. Click events use MouseEvent, form submits use FormEvent, and keyboard events use KeyboardEvent."},

{q:"What is the type of a useState setter?",
 o:["(v: T) => void only","No type is needed","(v: T | ((prev: T) => T)) => void","void"],a:2,
 e:"The setter accepts either a new value or an updater function. That union is why passing an updater is type-safe and is the correct pattern for computing from previous state."},

{q:"When using useReducer, how do you type the reducer?",
 o:["(s: any, a: any) => any","(s: State, a: Action) => Action","(s: unknown, a: unknown) => unknown","(state: State, action: Action) => State"],a:3,
 e:"A discriminated-union Action type plus a reducer returning State gives exhaustive switch checking, which is the main reason to prefer useReducer in TypeScript."},

{q:"What is the type of children in a props interface?",
 o:["React.ReactNode","string","JSX.Element","React.FC"],a:0,
 e:"ReactNode is the widest valid type. JSX.Element is narrower and rejects strings, arrays and null, which causes avoidable friction."},

{q:"What is the return type of useRef<number>(0)?",
 o:["number","React.MutableRefObject<number>","React.RefObject<number>","Ref"],a:1,
 e:"An initial value produces a MutableRefObject, so .current can be assigned. Passing null instead produces a RefObject whose .current is readonly."},

{q:"When typing forwardRef in TypeScript, what are its two type parameters?",
 o:["Props, State","State, Props","RefElement, Props","Props, RefElement"],a:2,
 e:"The pattern is forwardRef<HTMLInputElement, Props>((props, ref) => ...). The first parameter is the type ref.current will be; the second is the component's props."},

{q:"What does useImperativeHandle accept as its second argument?",
 o:["A ref object","A string name","A DOM node","A factory function returning the imperative handle object"],a:3,
 e:"The factory's return value is exposed as ref.current to the parent. The third argument is a dependency array that controls when the handle is recreated."},

/* 71–80: Styling & patterns */
{q:"What is CSS Modules?",
 o:["A CSS file whose class names are locally scoped to prevent collisions, shipped with the component","A CSS-in-JS library","A Tailwind plugin","A preprocessor"],a:0,

{q:"What is styled-components?",
 o:["A CSS reset","A CSS-in-JS library that lets you write component-scoped styles with tagged template literals","A CSS framework","A test library"],a:1,
 e:"Styles are attached to a generated component, and props can drive dynamic CSS. The trade-off is a runtime cost for style injection and a larger bundle."},

{q:"What is a key trade-off between CSS-in-JS (styled-components) and CSS Modules?",
 o:["CSS-in-JS is always faster","CSS Modules cannot do dynamic styles","CSS-in-JS gives full JavaScript dynamism at the cost of runtime overhead and larger bundles; CSS Modules are static and cheaper at runtime","They are identical"],a:2,
 e:"Modern build-time CSS-in-JS tools (vanilla-extract, StyleX, compiled mode) blur this, but the general trade-off between dynamism and runtime cost still holds."},

{q:"What is the compound component pattern?",
 o:["A HOC pattern","A render prop pattern","A Redux pattern","A set of components that share implicit state via context, so users compose them like Tabs and Tab"],a:3,
 e:"The parent holds state in context and each child pulls it out. It gives a clean, declarative API while hiding the coordination logic inside the library."},

{q:"What is the provider pattern?",
 o:["A pattern where a wrapper component uses context to supply shared state and behaviour to its subtree","A CSS pattern","A router pattern","A test pattern"],a:0,
 e:"Providers compose and can be nested. Splitting providers by concern limits re-render fan-out when one part of the state changes."},

{q:"What is the main advantage of custom hooks over HOCs?",
 o:["They are faster","They compose cleanly with no wrapper nesting and keep TypeScript types simple","They work with class components","They do not need dependencies"],a:1,
 e:"Each HOC adds a level to the component tree, complicates typing and can hide prop name collisions. Custom hooks share logic without touching the tree."},

{q:"What is the state reducer pattern?",
 o:["A Redux-only pattern","A form pattern","A pattern where the component calls a user-supplied reducer with each internal state change, letting the user override behaviour","A test pattern"],a:2,
 e:"Downshift popularised it: the user receives changes and returns the state to apply, which lets them intercept, extend or block transitions without patching the library."},

{q:"What is a prop getter?",
 o:["A CSS rule","A Redux action","A test helper","A function that returns a set of props (id, aria-, event handlers) to spread onto an element, keeping accessible wiring reusable"],a:3,
 e:"Prop getters centralise accessibility plumbing. The library knows the IDs and handlers required for aria-describedby and keyboard interaction, and hands them to you."},

{q:"When do you need useImperativeHandle?",
 o:["To expose an imperative API (such as focus()) from a child to a parent via ref","To memoize a value","To run effects","To memoize callbacks"],a:0,
 e:"It customises what the forwarded ref exposes. Use it sparingly: imperative APIs are an escape hatch and can break the declarative data flow."},

{q:"What is the difference between forwardRef and useImperativeHandle?",
 o:["They are the same","forwardRef forwards a ref to a DOM node or through the component; useImperativeHandle customises what that handle exposes","forwardRef is only for class components","useImperativeHandle is deprecated"],a:1,
 e:"forwardRef passes the ref through; useImperativeHandle changes what ref.current actually is. Most components need only forwardRef."},

/* 81–90: Advanced hooks */
{q:"What is useId for?",
 o:["A unique user id","A database id","Generating stable unique IDs for accessibility attributes like aria-describedby, consistent across server and client","A random id"],a:2,

{q:"What is useSyncExternalStore for?",
 o:["A form of Redux","An effect hook","A ref hook","Subscribing to an external store with a getSnapshot function, ensuring consistency in concurrent rendering"],a:3,
 e:"It is the primitive behind state libraries such as Zustand and Redux's useSelector. It guarantees the component never tears, even when the store updates during a concurrent render."},

{q:"What is useInsertionEffect for?",
 o:["Injecting styles before layout effects, so CSS-in-JS libraries can insert styles without affecting measurements","Fetching data","Managing state","Subscribing to events"],a:0,

{q:"What is the difference between useTransition and useDeferredValue?",
 o:["They are identical","useTransition lets you wrap an update and gives you isPending; useDeferredValue lets you derive a lagging copy of a value","They both only work in StrictMode","useDeferredValue is deprecated"],a:1,
 e:"useTransition is for "I control the setState"; useDeferredValue is for "I receive a value from above and want to render a lagging version of it"."},

{q:"How do you avoid a stale closure in a useEffect that needs the latest state?",
 o:["Use useMemo","Use useRef only","Include the state in the dependency array, or read it through a ref if the effect should stay stable","Ignore it, it does not matter"],a:2,
 e:"If the effect must re-run when the value changes, add it as a dependency. If it must stay stable and read the latest value, keep that value in a ref updated on every render."},

{q:"What is a common dependency array mistake that causes infinite loops?",
 o:["Using an empty array","Using primitive dependencies","Using no dependencies","Including an object or function that is recreated every render"],a:3,
 e:"A new reference on every render means the effect re-runs every time. Stabilise the value with useMemo/useCallback, or move the object creation inside the effect."},

{q:"What is the "useCallback is not always faster" argument?",
 o:["useCallback adds a comparison cost and dependency bookkeeping, so using it unnecessarily hurts more than it helps","useCallback is always faster","useCallback is deprecated","useCallback only works with useMemo"],a:0,
 e:"Memoization pays off when it prevents an expensive render or a reference-dependent effect. Measured profiling should drive the decision, not a blanket rule."},

{q:"How can you reliably read the latest state in a callback?",
 o:["Use setState with a function","Keep the latest value in a ref that is updated on each render, and read it inside the callback","Use useMemo","Store it in a module variable"],a:1,
 e:"The ref always points at the newest committed value, so a stable callback can read it without becoming stale. Use it only where a stable callback is genuinely required."},

{q:"What is the closure trap with setInterval inside useEffect?",
 o:["Intervals are deprecated","setInterval does not work in React","The callback captures the state from the render where it was created, so it keeps reading the original value unless you use a ref or a state updater","Intervals only leak in class components"],a:2,
 e:"This is the classic stale-closure bug. The fix is either a state updater (setCount(c => c + 1)) or storing the value in a ref the interval reads."},

{q:"What is the correct dependency when using a function from props inside useEffect?",
 o:["Never include functions","Always use an empty array","Only include strings","The function itself, or wrap it in useCallback in the parent so its reference is stable"],a:3,
 e:"Leaving it out causes a stale closure; including an unstable function causes re-runs every render. Stabilising the function upstream fixes both problems at once."},

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + esc(q.q) + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + esc(q.e) + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
