<style>

<div class="layout">

<script>
const QS = [

/* ---------- RSC, Next.js App Router, PPR ---------- */
{q:`What is the primary constraint of React Server Components?`,
 o:[`They render only on the server and cannot use state, effects, or browser APIs`,`They can only run in development`,`They must be written in TypeScript`,`They cannot accept props`],a:0,
 e:`RSC run on the server, so there is no useState, useEffect, or window. Their appeal is exactly this: they can hit the database or filesystem directly and ship zero JavaScript for that component to the client.`},

{q:`What does Next.js Partial Prerendering (PPR) do?`,
 o:[`It renders the whole route on the client`,`It combines a static shell with dynamic streamed holes in the same route, so the shell is instant and slow data streams in`,`It only runs on the edge`,`It replaces Server Components`],a:1,
 e:`PPR serves a cached static shell immediately and streams dynamic Suspense boundaries as they resolve. It gets the speed of static generation for the parts that do not depend on request data.`},

{q:`What is the primary purpose of react-hook-form?`,
 o:[`Global state management`,`Data fetching`,`Form state with uncontrolled inputs to minimise re-renders`,`Routing`],a:2,
 e:`RHF registers inputs by ref instead of re-rendering on every keystroke, which makes it dramatically faster than controlled-form approaches on large forms. Validation happens on submit or on blur by default.`},

{q:`What is Zod?`,
 o:[`A React component library`,`A CSS-in-JS library`,`A form UI library`,`A TypeScript-first schema validation library`],a:3,
 e:`Zod schemas give you runtime validation and inferred TypeScript types from the same declaration, which makes them a natural fit for form validation and for parsing API responses.`},

{q:`How does react-hook-form integrate with Zod?`,
 o:[`Via @hookform/resolvers, which adapts a Zod schema as a resolver`,`Zod schemas are passed as props to useForm natively`,`You have to manually call validate() in onChange`,`They cannot be integrated`],a:0,
 e:`zodResolver(mySchema) plugs straight into useForm({ resolver: zodResolver(schema) }). Errors come back typed, so fieldError.message is known to TypeScript.`},

/* ---------- Tables, Virtual, Charts ---------- */
{q:`What does TanStack Table provide?`,
 o:[`A fully styled table component`,`A headless table library for sorting, filtering and pagination logic, leaving rendering to you`,`A virtualization library only`,`A chart library`],a:1,
 e:`It gives you row models and updater functions; you write the table markup yourself. That headless design means it works with any styling approach, from plain HTML tables to Tailwind to a design system.`},

{q:`What does TanStack Virtual primarily do?`,
 o:[`Sorts data`,`Fetches data`,`Virtualizes long lists and grids so only visible items render`,`Handles routing`],a:2,
 e:`A 50,000-row list becomes a few dozen DOM nodes. The cost is complexity around dynamic row heights, scrollbar fidelity and accessibility landmarks, so it is worth it only for genuinely long lists.`},

{q:`Which library is commonly used to build charts in a React application?`,
 o:[`React Router`,`Redux Toolkit`,`React Hook Form`,`Recharts, which wraps D3 primitives in React components`],a:3,
 e:`Recharts is the most popular declarative chart library. It composes Line, Bar and Pie components with data props, and it renders SVG, so the output is accessible and CSS-styleable.`},

{q:`What distinguishes visx from Recharts?`,
 o:[`visx is low-level primitives from Airbnb giving more control with more code; Recharts is higher-level`,`visx is a chart UI component library`,`Recharts uses WebGL exclusively`,`They are the same`],a:0,
 e:`visx gives you the D3 scales, shapes and axes as React components, and you write the chart. That control is invaluable for unusual visualisations; for standard charts, Recharts is faster to ship.`},

/* ---------- Drag-drop, Rich text, Uploads ---------- */
{q:`What is dnd-kit?`,
 o:[`A Kanban board UI`,`A modular, accessible toolkit for building drag-and-drop interfaces`,`A data fetching hook`,`A form validation library`],a:1,
 e:`dnd-kit was designed to fix the accessibility and performance problems of react-beautiful-dnd and react-dnd. It supports keyboard sensors and screen-reader announcements out of the box.`},

{q:`What is Tiptap?`,
 o:[`A chart library`,`A routing library`,`A headless rich text editor built on ProseMirror`,`A CSS framework`],a:2,
 e:`Tiptap gives you the editor state, commands and collaboration primitives; you supply the toolbar and styling. The ProseMirror foundation is what gives it a solid, extensible document model.`},

{q:`What does react-dropzone provide?`,
 o:[`A drag-drop Kanban board`,`An image cropper`,`A form library`,`A hook and component for file uploads with drag-and-drop and keyboard accessibility`],a:3,
 e:`useDropzone returns getRootProps and getInputProps plus state like isDragActive and acceptedFiles. It handles the quirks of the file input element, so you do not reimplement them.`},

/* ---------- Images, fonts, metadata, actions ---------- */
{q:`What does next/image provide over a plain img tag?`,
 o:[`Automatic optimization (sizing, modern formats, lazy loading) with layout shift prevention`,`Only client-side resizing`,`It is identical to an img tag`,`It only works with SVGs`],a:0,
 e:`next/image generates srcset and sizes for you, converts to AVIF or WebP, and reserves layout space via width and height so cumulative layout shift stays at zero.`},

{q:`What does next/font do?`,
 o:[`Injects fonts from a CDN at runtime`,`Self-hosts fonts at build time, removing render-blocking requests and layout shift`,`Requires an internet connection`,`Only supports Google Fonts`],a:1,
 e:`next/font downloads the font at build time, serves it from your own origin and generates a size-adjust fallback so text does not jump when the real font loads.`},

{q:`What is the Next.js Metadata API for?`,
 o:[`A CSS framework`,`A component library`,`Per-route SEO tags via the metadata export and generateMetadata function`,`A state manager`],a:2,
 e:`Static routes use the metadata object; dynamic routes use generateMetadata to fetch data and return tags. The result is server-rendered head content with no client-side tag injection.`},

{q:`What are Next.js Server Actions?`,
 o:[`Functions that run in the browser`,`GraphQL queries`,`REST endpoints`,`Async functions executed on the server, invokable directly from Client Components for mutations`],a:3,
 e:`You mark a function with "use server" and call it from a form action or event handler. Next.js handles the network round trip, and you can revalidatePath or revalidateTag inside the action.`},

/* ---------- Auth ---------- */
{q:`Which OAuth flow is recommended for single-page React apps?`,
 o:[`Authorization code flow with PKCE, ideally behind a Backend-for-Frontend or through Auth0, Okta or NextAuth`,`Implicit flow`,`Client credentials with the secret in the browser`,`Basic auth`],a:0,
 e:`PKCE replaces the client secret with a per-request verifier, which is safe in a public client. A BFF keeps tokens off the browser entirely and is the strongest option for sensitive apps.`},

{q:`Where should auth tokens be stored in the browser?`,
 o:[`localStorage, because it is convenient`,`HttpOnly, Secure, SameSite cookies, so JavaScript cannot read the token`,`sessionStorage`,`A global JavaScript variable`],a:1,
 e:`localStorage is readable by any script on the page, so an XSS becomes session theft. HttpOnly cookies are invisible to JavaScript, and SameSite mitigates CSRF.`},

{q:`What is the standard pattern for JWT refresh in a React app?`,
 o:[`Never expire the token`,`Store the refresh token in localStorage`,`Short-lived access token with silent refresh via a secure HttpOnly refresh cookie`,`Prompt the user to log in every five minutes`],a:2,
 e:`Short-lived access tokens limit the damage if one leaks. A long-lived refresh token in an HttpOnly cookie silently issues new access tokens, and revocation is a single server-side action.`},

{q:`What does NextAuth / Auth.js handle for you?`,
 o:[`Redux Toolkit state`,`React Router navigation`,`Zod validation`,`OAuth providers, session management and CSRF protection for Next.js and other React frameworks`],a:3,
 e:`It is the de facto authentication layer for Next.js. You add providers in config, and the session is available via the useSession hook or on the server via auth().`},

/* ---------- WebSockets, SSE, polling ---------- */
{q:`How should you manage a WebSocket in a React component?`,
 o:[`Create it in an effect, listen for messages, and close it in the effect cleanup`,`Call new WebSocket() in the render body`,`Store the socket in useState`,`Use XMLHttpRequest`],a:0,
 e:`Creating the socket during render leaks one on every render. Putting it in useEffect with a cleanup that calls socket.close() survives Strict Mode double mounting and route changes cleanly.`},

{q:`What are Server-Sent Events (SSE)?`,
 o:[`Bidirectional UDP communication`,`Unidirectional server-to-client streaming over HTTP, easier than WebSockets for live feeds`,`The same as WebSockets`,`A browser plugin`],a:1,
 e:`An EventSource receives text/event-stream updates over a long-lived HTTP connection. Reconnection is automatic, and it works through most proxies that block WebSocket upgrades.`},

{q:`When should you choose SSE over WebSockets?`,
 o:[`Always choose WebSockets`,`Always choose SSE`,`SSE when only the server pushes data; WebSockets when the client also needs to send`,`Neither works in React`],a:2,
 e:`Notifications, stock tickers and progress updates are SSE territory. Chat, multiplayer cursors and collaborative editing need bidirectional WebSockets.`},

{q:`What is long polling?`,
 o:[`A more efficient alternative to WebSockets`,`A type of server-side rendering`,`Only for authentication`,`A fallback where the client repeats requests, each held open by the server until data is available or a timeout fires`],a:3,
 e:`Long polling keeps compatibility with restrictive proxies and firewalls. It has higher latency than SSE or WebSockets and wastes connections at scale, which is why it is a fallback rather than a first choice.`},

/* ---------- Storage and PWA ---------- */
{q:`What does Dexie provide?`,
 o:[`A small wrapper around IndexedDB with a nicer query API and schema versioning`,`A WebSocket library`,`A CSS framework`,`A Node.js-only database`],a:0,
 e:`Dexie gives you db.table.where(...).equals(...) style queries, transactions and migrations without the IndexedDB callback boilerplate. `idb` is the lighter alternative.`},

{q:`What are the key limits of localStorage?`,
 o:[`Unlimited storage`,`Around 5-10 MB per origin, synchronous, string-only, and shared across tabs`,`100 MB per origin`,`1 KB per origin`],a:1,
 e:`The synchronous API blocks the main thread, so writing large JSON on every keystroke will tank INP. It is also readable by any script, so it is unsuitable for tokens.`},

{q:`What is the difference between sessionStorage and localStorage?`,
 o:[`They are identical`,`sessionStorage persists across browser restarts`,`sessionStorage is cleared when the tab closes; localStorage survives restarts`,`localStorage is per-tab`],a:2,
 e:`Both are per-origin and synchronous and share the same 5-10 MB budget. Use sessionStorage for flow state that should not survive a new tab, and localStorage for long-lived preferences.`},

{q:`What does a service worker do in a PWA?`,
 o:[`Runs on the server`,`Only works on iOS`,`Replaces React`,`A background script that intercepts fetches for caching, offline support and push notifications`],a:3,
 e:`A service worker runs in its own thread, outside the page. That is what lets it serve cached assets when the network is down, and what makes install-to-home-screen and push notifications possible.`},

/* ---------- Browser APIs ---------- */
{q:`What is Intersection Observer used for?`,
 o:[`Detecting when an element enters or leaves the viewport, useful for lazy loading and infinite scroll`,`Changing an element size`,`Handling keyboard events`,`Replacing media queries`],a:0,
 e:`It is asynchronous and fires on crossings rather than on every scroll event, which makes it far cheaper than scroll listeners. `react-intersection-observer` wraps it as a hook.`},

{q:`What is Resize Observer used for?`,
 o:[`Detecting viewport changes only`,`Firing when an element's box size changes, useful for responsive components`,`Handling scroll direction`,`Resizing images`],a:1,
 e:`A component that needs its own rendered size, not the viewport's, uses Resize Observer. It is the JS counterpart of container queries and is the basis of many chart libraries' responsive behaviour.`},

{q:`How do you react to a media query in JavaScript?`,
 o:[`There is no API for this`,`You must poll on a timer`,`window.matchMedia(query) returns a MediaQueryList you can subscribe to via addEventListener('change', ...)`,`Only via CSS`],a:2,
 e:`A useMediaQuery hook wraps this. Initialise the state from matches to avoid a flash of the wrong layout, and remove the listener in the effect cleanup.`},

{q:`How does the Clipboard API work?`,
 o:[`Only works with a plugin`,`Requires jQuery`,`Is synchronous only`,`navigator.clipboard.writeText returns a Promise, requires a user gesture and a secure context`],a:3,
 e:`The document.execCommand fallback is deprecated. Browsers require a user gesture for security, so calling writeText from a timeout or effect cleanup will usually be rejected.`},

/* ---------- Debounce, throttle, abort, race ---------- */
{q:`What is the difference between debounce and throttle?`,
 o:[`Debounce waits for quiet before firing; throttle fires at most once per interval`,`They are identical`,`Debounce fires on every event; throttle waits for quiet`,`Both only work on scroll`],a:0,
 e:`A search box wants debounce: fire only when the user pauses typing. A scroll handler wants throttle: fire regularly while scrolling, at a controlled rate.`},

{q:`What does a useDebounce hook typically do?`,
 o:[`Updates state on every keystroke`,`Returns a value that only changes after the delay has passed without further changes`,`Cancels the request`,`Only works with strings`],a:1,
 e:`Each new value resets a timer in the effect, and the timer writes the latest value into state. The returned value lags the input and is safe to use as a query key.`},

{q:`How do you cancel a fetch request?`,
 o:[`Only axios supports cancellation`,`You cannot cancel fetch`,`Pass signal from an AbortController to fetch, and call controller.abort() in the effect cleanup`,`Reload the page`],a:2,
 e:`fetch(url, { signal }) rejects with an AbortError when aborted. Combine with a try/catch that ignores AbortError, and cleanup runs automatically on unmount and Strict Mode remount.`},

{q:`What causes the classic fetch race condition in useEffect?`,
 o:[`It cannot happen in React`,`Only axios is affected`,`React reuses the response`,`An older, slower request can resolve after a newer one and overwrite the newer data`],a:3,
 e:`Typing fast in a search box fires several requests. Without a guard, whichever response arrives last wins. Fix it by aborting stale requests or ignoring responses whose id does not match the current one.`},

/* ---------- Bundle and network ---------- */
{q:`Which of these is a bundle analysis tool?`,
 o:[`webpack-bundle-analyzer, rollup-plugin-visualizer, or vite-bundle-visualizer, which visualise what is in the bundle`,`Chrome DevTools Performance tab only`,`jest.config.js`,`ESLint`],a:0,
 e:`A treemap of the bundle is the fastest way to find the accidental 800 KB dependency. Compare before and after, and watch the entry chunk grow with every feature.`},

{q:`Where should you place code-splitting boundaries first?`,
 o:[`Around every component`,`At route boundaries, then at heavy feature boundaries such as a rich text editor or chart library`,`Only on CSS files`,`Never split`],a:1,
 e:`Route-level splitting is the highest leverage: each navigation loads only what it needs. Feature-level splitting helps when a heavy library is only used behind a button or a tab.`},

{q:`What is the difference between preload and prefetch hints?`,
 o:[`They are identical`,`preload defers a resource; prefetch loads immediately`,`preload fetches a critical resource early; prefetch fetches for future navigation at lower priority`,`Only used in email templates`],a:2,
 e:`Use preload for the hero image and critical font of the current page; use prefetch for the next page's resources or the next route's JS chunk. Misusing them both wastes bandwidth.`},

{q:`What distinguishes HTTP/3 from HTTP/2?`,
 o:[`HTTP/2 multiplexes; HTTP/3 does not`,`HTTP/3 runs over TCP`,`They are the same`,`HTTP/2 multiplexes over TCP; HTTP/3 multiplexes over QUIC (UDP) and reduces head-of-line blocking`],a:3,
 e:`With HTTP/2, one lost packet blocks all streams on the TCP connection. QUIC solves that per-stream, which matters most on flaky mobile networks. HTTP/3 also integrates TLS 1.3.`},

/* ---------- Design systems & styling ---------- */
{q:`What is Tailwind CSS's core model?`,
 o:[`Utility classes in HTML, tree-shaken at build time so only the used classes ship`,`A React component library`,`A runtime CSS-in-JS engine`,`A state manager`],a:0,
 e:`Tailwind compiles your content files into a single small CSS file with only the utilities you referenced. There is no runtime cost, and the constraint of utility classes is what keeps styles consistent.`},

{q:`What is the shadcn/ui model?`,
 o:[`An npm package you install and import`,`Copy-pasteable component source built on Radix primitives, living in your codebase`,`A CSS framework`,`A design tool`],a:1,
 e:`You "own" the code. That gives you full control to modify components, but you also inherit maintenance. The primitives underneath (Radix) handle accessibility and focus management.`},

{q:`What are Radix primitives?`,
 o:[`Fully styled components`,`A state manager`,`Headless, accessible building blocks (Dialog, Popover, Tooltip) that you style yourself`,`A test library`],a:2,
 e:`Radix handles the hard parts: focus trapping, escape handling, aria attributes, positioning and disabled states. You supply the visuals, so you are not locked into one design language.`},

{q:`What is the main runtime cost of CSS-in-JS like styled-components or Emotion?`,
 o:[`There is no cost`,`It is faster than static CSS`,`It eliminates styles from the bundle`,`Styles are injected by JS at runtime, adding main-thread work and larger bundles compared with static alternatives`],a:3,
 e:`This is why many teams moved to zero-runtime approaches: vanilla-extract, StyleX, Tailwind, CSS Modules. React Server Components raised the stakes further, since runtime CSS-in-JS does not run on the server.`},

{q:`What is Storybook?`,
 o:[`A development environment for building and testing UI components in isolation, with a catalogue of stories`,`A production bundler`,`A test runner`,`A CSS framework`],a:0,
 e:`Stories double as documentation, visual test fixtures and interaction test cases. That makes Storybook a natural home for design-system work, separate from any one application.`},

{q:`What are design tokens?`,
 o:[`A CSS reset`,`Named values for colour, spacing, typography and similar primitives, shared between design and code`,`A component library`,`A test library`],a:1,
 e:`Tokens are the contract between Figma and code. Changing a token updates every theme that references it, which is what makes dark mode and rebranding tractable.`},

{q:`How is dark mode typically implemented in React?`,
 o:[`Recompile the app for dark mode`,`Run a second server for dark mode`,`Toggle a class on the html element and read prefers-color-scheme for the default`,`It only works in Electron`],a:2,
 e:`A blocking inline script in the head reads the stored preference before paint to avoid a flash. Tailwind's dark: variant keys off the class; CSS variables give you more control.`},

{q:`What do container queries enable that media queries cannot?`,
 o:[`Only work in Chrome`,`Are deprecated`,`Are identical to media queries`,`An element can restyle based on its container's size rather than the viewport, so the same component adapts wherever it is placed`],a:3,
 e:`A card in a sidebar and the same card in a main column should look different even at the same viewport. Container queries make that a property of the component, not of the page layout.`},

/* ---------- Micro-frontends ---------- */
{q:`What is a micro-frontend architecture?`,
 o:[`Composing a frontend from independently deployable pieces owned by different teams`,`A build optimization`,`A Redux feature`,`A React hook`],a:0,
 e:`It mirrors microservices on the frontend. The win is team autonomy and independent deploys; the cost is duplicated dependencies, consistent UX across teams and a shared shell to orchestrate them.`},

{q:`What is Webpack's Module Federation?`,
 o:[`A CSS-in-JS library`,`A Webpack 5 feature where separate builds share modules at runtime, loading each other's remotes over HTTP`,`A test framework`,`A state manager`],a:1,
 e:`It is the classic enabler of micro-frontends: one host app loads remotes at runtime, and shared dependencies like React can be loaded once. Rspack and Vite have partial equivalents.`},

{q:`How do React and Web Components interoperate today?`,
 o:[`React cannot render Web Components`,`Web Components cannot contain React`,`React can render custom elements; React 19 handles property vs attribute assignment and event binding correctly for them`,`They only work with Angular`],a:2,
 e:`Before React 19, you had to use refs to set non-string properties on custom elements. React 19 detects custom elements and passes properties and event handlers correctly.`},

{q:`Why might you render a micro-frontend or third-party widget inside an iframe?`,
 o:[`iframes cannot run React`,`iframes are always slower`,`iframes block CSP`,`An iframe isolates DOM, CSS and JS, which is the strongest boundary against style and global leakage`],a:3,
 e:`The cost is a separate document: no shared React context, extra memory, and communication only through postMessage. That trade-off is usually worth it for untrusted third parties.`},

/* ---------- Security ---------- */
{q:`What is the security risk of dangerouslySetInnerHTML?`,
 o:[`It renders raw HTML and is an XSS vector if the content is not sanitized`,`It is safe because React escapes HTML`,`It compiles to CSS`,`It is deprecated`],a:0,
 e:`The name is the warning. Use it only with content you control, or pass it through a sanitizer such as DOMPurify first. User-supplied HTML rendered this way is a live XSS.`},

{q:`What does DOMPurify do?`,
 o:[`A CSS framework`,`A library that sanitizes HTML, removing scripts and dangerous attributes`,`A routing library`,`A state manager`],a:1,
 e:`DOMPurify parses HTML against an allowlist. Configure it to allow the tags and attributes you need, and keep it updated: sanitizer bypasses are a recurring CVE category.`},

{q:`What is CSRF and how is it mitigated in a React app?`,
 o:[`It is not a concern in React`,`It only affects GraphQL`,`Cross-site requests abusing cookies to trigger unwanted actions; mitigate with SameSite cookies and CSRF tokens`,`It is fixed by localStorage`],a:2,
 e:`SameSite=Lax or Strict is the primary defence. Sensitive endpoints additionally check an anti-CSRF token that the attacker cannot read, or use a custom header that cross-site forms cannot set.`},

{q:`What is a Content Security Policy (CSP)?`,
 o:[`A CSS framework`,`A React feature`,`A test framework`,`HTTP headers restricting which scripts, styles and connections the page may load, reducing XSS impact`],a:3,
 e:`A strict CSP with nonces is the strongest browser-side XSS mitigation. React's inline event handlers and inline styles must be accounted for, which is why nonces and hashes exist.`},

/* ---------- Testing advanced ---------- */
{q:`What is property-based testing with fast-check?`,
 o:[`Generating random inputs and checking that invariants hold for all of them`,`Testing a single example`,`A Java-only technique`,`A replacement for unit tests`],a:0,
 e:`You describe the property, and fast-check searches for a counter-example. When it finds one, it shrinks it to a minimal failing case, which is far more useful than a random failure.`},

{q:`What does jest-axe do?`,
 o:[`Runs performance tests`,`Runs automated accessibility checks that flag common WCAG violations`,`Tests network calls`,`Tests CSS`],a:1,
 e:`It is a valuable CI gate but not a replacement for manual screen-reader testing. Automated tools typically catch around 30-50% of accessibility issues; the rest needs a human.`},

{q:`What are Storybook Play functions?`,
 o:[`Type-checking stories`,`Visual regression only`,`Scripted user interactions that run in the browser, with assertions, giving component-level integration tests`,`Unit tests for state`],a:2,
 e:`A play function runs after the story renders and can use userEvent and expect. Storybook then shows pass/fail in the UI, and the same tests run in CI.`},

{q:`What is Chromatic?`,
 o:[`A CSS linter`,`A bundler`,`A Jest test runner`,`A cloud service for visual regression testing of Storybook`],a:3,
 e:`Every commit uploads the stories and Chromatic renders them in multiple browsers. Diffs are reviewed and either approved (new baseline) or rejected (a bug to fix).`},

/* ---------- React Native ecosystem ---------- */
{q:`What does React Native Web do?`,
 o:[`Compiles React Native components to run in the browser`,`Runs React DOM components on mobile`,`A CSS framework`,`A router`],a:0,
 e:`It maps View, Text and StyleSheet to DOM equivalents, which is how libraries like Tamagui ship one component set for web and native. Some APIs and gestures still need platform branches.`},

{q:`What is Expo Router?`,
 o:[`A CSS framework`,`File-based routing for React Native apps, mirroring the Next.js App Router conventions`,`A state manager`,`A test framework`],a:1,
 e:`The same routes/ directory pattern that Next.js uses, with typed routes and deep linking built in. It is a strong default for new Expo apps because it unifies web and native routing.`},

{q:`What is Detox?`,
 o:[`A CSS library`,`A chart library`,`An end-to-end testing framework for React Native apps`,`A state manager`],a:2,
 e:`Detox runs the app on a real simulator or device and synchronises with its idle state, which is what eliminates the flakiness of naive sleep-based tests.`},

{q:`What is Tamagui?`,
 o:[`A CSS reset`,`A test framework`,`A router`,`A UI library and optimizing compiler for React Native and web`],a:3,
 e:`Tamagui's compiler flattens styled components into platform-native primitives, so you get one styling API and near-native performance on each platform.`},

/* ---------- Frameworks and meta-frameworks ---------- */
{q:`What is Astro's "islands" architecture?`,
 o:[`Ship static HTML by default and hydrate only the interactive islands`,`Ship the whole React tree to the client`,`Only works with Vue`,`Uses only Web Components`],a:0,
 e:`Astro is content-first. You mark a component client:load or client:visible, and only that island ships JavaScript. For blogs, docs and marketing sites this is a dramatic win.`},

{q:`What characterises Remix and React Router 7's framework mode?`,
 o:[`A CSS framework`,`Loaders, actions and progressive enhancement, with server-rendered HTML and forms that work without JavaScript`,`A state manager`,`A bundler`],a:1,
 e:`The same data APIs from React Router (loader, action) become full-stack when paired with a server. HTML forms post to actions, so the app works before hydration finishes.`},

{q:`What distinguishes HTMX from React?`,
 o:[`HTMX is a React wrapper`,`HTMX requires a build step`,`HTMX drives server-rendered HTML via attributes, avoiding client-side state and hydration`,`They are identical`],a:2,
 e:`For many CRUD apps, HTMX plus a server is simpler and faster than a React SPA. It is a genuine alternative, not a successor: rich client interactions still favour React.`},

{q:`What is Qwik's resumability?`,
 o:[`Ships all JavaScript upfront`,`Only works in Angular`,`Requires server-side rendering`,`The app pauses on the server and resumes in the browser without re-running the app`],a:3,
 e:`Qwik serialises the app state into HTML, so the client can resume without a replay of the component tree. It trades a heavier HTML payload and a smaller ecosystem for near-instant interactivity.`},

/* ---------- Desktop, WASM, extensions ---------- */
{q:`What does Electron provide?`,
 o:[`Bundles Chromium and Node.js so a React app runs as a desktop app`,`A browser extension`,`A Linux-only runtime`,`A server`],a:0,
 e:`Electron gives you everything Chrome and Node provide, at the cost of a large app size and a shared memory footprint per window. It is the standard choice for cross-platform desktop.`},

{q:`What distinguishes Tauri from Electron?`,
 o:[`A React UI library`,`Uses the OS webview with a Rust backend, producing much smaller desktop apps`,`A state manager`,`A testing tool`],a:1,
 e:`Tauri apps are typically 3-10 MB instead of 100+ MB. The cost is webview inconsistency across platforms, which means testing on each target OS is essential.`},

{q:`How is WebAssembly (WASM) typically used in a React app?`,
 o:[`It cannot be used with React`,`It replaces React`,`Rust or C++ modules compiled to WASM and called from React for compute-heavy work`,`Only for Node.js`],a:2,
 e:`Image codecs, cryptography, game engines, PDF generation and parsers are the classic cases. The interface is a JavaScript module you await and call, so it composes naturally with React.`},

{q:`Which parts of a Chrome extension can be built with React?`,
 o:[`None`,`Only the popup`,`Only the background worker`,`The popup, content scripts and background service worker can each be built as separate React apps`],a:3,
 e:`Each runs in a different environment with different API access, so they need separate bundles. That architecture mirrors a micro-frontend with stricter boundaries.`},

/* ---------- Performance deep dive ---------- */
{q:`What is layout thrashing and how do you avoid it?`,
 o:[`Reading layout (for example offsetHeight) then writing styles in a loop forces reflows on every iteration; batch all reads, then all writes`,`A CSS feature`,`Only affects CSS-in-JS`,`A test utility`],a:0,
 e:`The fix is to read every measurement first, then apply every write, often inside requestAnimationFrame. Doing it per element forces synchronous layout per iteration and dominates the frame budget.`},

{q:`What does INP measure?`,
 o:[`A CSS metric`,`Interaction to Next Paint, measuring responsiveness for every user interaction across the page`,`A Redux action type`,`A test library`],a:1,
 e:`INP replaced FID as a Core Web Vital in 2024. It is the 98th percentile of interaction latencies, so slow long tasks and heavy re-renders directly hurt it.`},

{q:`What are common causes of memory leaks in React apps?`,
 o:[`They cannot happen in React`,`Only class components leak`,`Missing cleanup: timers, event listeners, subscriptions and un-aborted fetches that outlive the component`,`Using React.memo`],a:2,
 e:`The effect cleanup is the place to release these. Chrome's Memory panel with a heap snapshot and comparison after GC is the standard way to confirm a leak.`},

{q:`Why should scroll and touch listeners be marked passive?`,
 o:[`They block scrolling`,`They are deprecated`,`They are React-only`,`The browser knows the handler will not call preventDefault, so it can scroll without waiting for JavaScript`],a:3,
 e:`React adds passive listeners for onScroll and onTouchStart automatically. For listeners you attach yourself with addEventListener, pass { passive: true } explicitly.`},

/* ---------- Accessibility ---------- */
{q:`After a client-side route change, what should happen to focus for accessibility?`,
 o:[`Move focus to a top-level heading or skip target so screen-reader users know the page changed`,`Focus the address bar`,`Do nothing`,`Reload the page`],a:0,
 e:`SPAs do not fire a page load, so assistive tech does not announce anything. A route-change focus handler and an aria-live announcement together solve most of it.`},

{q:`Which tools are commonly used for manual screen-reader testing?`,
 o:[`Only on Linux`,`NVDA on Windows, VoiceOver on macOS and iOS, TalkBack on Android are the main tools`,`Only automated tools count`,`No manual testing is needed`],a:1,
 e:`Automated tests catch structural issues; real screen readers catch flow and announcement problems. Testing one desktop and one mobile screen reader per release is a practical baseline.`},

{q:`What contrast ratio does WCAG 2.2 AA require?`,
 o:[`1:1`,`No requirement`,`4.5:1 for normal text and 3:1 for large text or graphical objects`,`10:1`],a:2,
 e:`AAA raises this to 7:1 and 4.5:1. Contrast is measurable, so automated tools (axe, Lighthouse) flag it reliably and should be part of every PR.`},

{q:`What is the minimum touch target size under WCAG 2.2 AA?`,
 o:[`As small as possible`,`1x1 pixel`,`Only for desktop`,`24x24 CSS pixels, with 44x44 or 48x48 recommended for comfort`],a:3,
 e:`The 24x24 minimum is the AA threshold. Material Design recommends 48x48 and Apple HIG 44x44. Small targets are a top source of mis-taps on mobile.`},

/* ---------- Lazy, boundaries ---------- */
{q:`How do React.lazy and Suspense work together?`,
 o:[`React.lazy defines the split point; Suspense provides the fallback UI while the chunk loads`,`They are the same`,`Suspense replaces React.lazy`,`React.lazy provides the fallback`],a:0,
 e:`lazy returns a component that suspends until its dynamic import resolves. Any Suspense boundary above it shows the fallback, so place the boundary where the loading UI belongs.`},

{q:`Why does React.lazy fail with a named export?`,
 o:[`Named exports are not supported anywhere`,`React.lazy expects a default export; wrap it: lazy(() => import('./mod').then(m => ({ default: m.Named })))`,`It is a TypeScript issue`,`It works fine`],a:1,
 e:`The then shim adapts a named export into the { default } shape that lazy requires. It is a small boilerplate that trips up most developers once.`},

{q:`Why should you place an error boundary per route?`,
 o:[`React only allows one per app`,`It is required by Suspense`,`So a failed chunk or a render error in one route does not blank the whole app`,`Try/catch in render works instead`],a:2,
 e:`Per-route boundaries contain the blast radius. Users can navigate away from a broken route to a working one, instead of staring at a white screen until a redeploy.`},

{q:`How does use() interact with Suspense in React 19?`,
 o:[`use() disables Suspense`,`use() can only be used for state`,`use() is a class component API`,`use() lets you read a promise inside a component and unwinds to the nearest Suspense boundary while it is pending`],a:3,
 e:`Unlike other hooks, use() may be called conditionally. The promise must be stable across renders, and the result is the resolved value. Rejections propagate to the nearest error boundary.`},

/* ---------- Testing advanced (cont.) ---------- */
{q:`What do jest-dom matchers add?`,
 o:[`Semantic assertions such as toHaveTextContent, toBeInTheDocument and toHaveAttribute, with clearer failure messages`,`A new test runner`,`A mocking library`,`A CSS framework`],a:0,

{q:`Which Testing Library queries are recommended first?`,
 o:[`Only getByTestId`,`getByRole, getByLabelText and getByText query the accessible tree, matching what users actually see`,`getByClassName`,`document.querySelector`],a:1,

{q:`What is the difference between userEvent and fireEvent?`,
 o:[`They are identical`,`fireEvent is higher level`,`userEvent fires a realistic sequence (focus, keydown, input) and wraps interactions in act`,`userEvent only supports clicks`],a:2,
 e:`Use userEvent as the default. Drop to fireEvent only when you need to test a specific low-level event that userEvent does not emit, such as a page visibility change.`},

{q:`How is MSW set up?`,
 o:[`Only works with GraphQL`,`Only runs in the browser`,`It deprecates fetch`,`Create handlers per endpoint, start the server in Node tests or the worker in the browser, and reset handlers between tests`],a:3,
 e:`The resetHandlers in afterEach prevents one test's mock from leaking into another, which is the single most common cause of flaky tests when adopting MSW.`},

/* ---------- tRPC, GraphQL, cache ---------- */
{q:`What is tRPC?`,
 o:[`End-to-end typesafe APIs between a TypeScript server and client, with no schema or codegen`,`A CSS framework`,`A router`,`A state manager`],a:0,
 e:`tRPC is the TypeScript-native alternative to GraphQL and REST for monorepos. The trade-off is TypeScript-only clients and a coupled server and client version.`},

{q:`What are GraphQL fragments for?`,
 o:[`GraphQL has no fragments`,`Reusable sets of fields that compose into a query, keeping components self-contained`,`Server-only queries`,`Deprecated syntax`],a:1,
 e:`A fragment colocates a component with the data it needs, and the fragment can be spread into any parent query. Relay and Apollo both build caching and codegen on top of them.`},

{q:`How do you choose between cache-first and network-first?`,
 o:[`They are identical`,`Cache-first is always wrong`,`Cache-first is fast but can serve stale data; network-first is fresh but slower, so pick per data type`,`Network-first is always wrong`],a:2,
 e:`User preferences and rarely-changing config like cache-first. Prices, inventory and anything that must be accurate choose network-first or stale-while-revalidate with a short TTL.`},

{q:`How does an optimistic mutation work in React Query?`,
 o:[`It is not supported`,`Only works with GraphQL`,`The mutation rolls back automatically`,`onMutate updates the cache immediately, onError rolls back the snapshot, onSettled refetches to reconcile`],a:3,
 e:`onMutate cancels outgoing refetches for the key, takes a snapshot and writes the optimistic value. If the server rejects the change, onError restores the snapshot.`},

/* ---------- Concurrency ---------- */
{q:`What makes a transition different from a regular setState?`,
 o:[`The render is interruptible and low priority, so urgent updates like typing can preempt it`,`All updates have the same priority`,`It blocks the UI`,`It runs in a Web Worker`],a:0,
 e:`startTransition marks the update as non-urgent. React renders it in the background and, if something urgent arrives, abandons the in-progress render to handle that first.`},

{q:`When should you use useTransition vs useDeferredValue?`,
 o:[`They are identical`,`useTransition when you own the state update; useDeferredValue when you receive a value and want a lagging copy`,`useDeferredValue blocks rendering`,`useTransition is deprecated`],a:1,
 e:`A search box that calls setQuery inside startTransition wants useTransition. A table that receives a filter prop from a parent and wants to render it slowly wants useDeferredValue.`},

{q:`How does Suspense integrate with data fetching?`,
 o:[`It is built into React core`,`It requires Redux`,`It works best with frameworks and libraries (React Query, Relay, Next.js) that cache promises and integrate with Suspense`,`It is not supported`],a:2,
 e:`React does not fetch data for you. Suspense is the UI contract; the data library is responsible for throwing the right promise and caching the result so the tree can retry.`},

{q:`What is true about the RSC / Client Component boundary?`,
 o:[`Server Components cannot render JSX`,`Server Components replace Client Components`,`Client Components can import Server Components directly`,`Server Components can render Client Components, but a Client Component cannot import a Server Component; it can only receive one as children or props`],a:3,

{q:`What does the TypeScript satisfies operator do?`,

 e:`satisfies gives you both: the compiler checks the value against the type, and the value's inferred type stays narrow. It is the safe alternative to `as const` when you also want a contract.`},

{q:`How do you write a generic React component?`,
 o:[`Not supported`,`Declare it as function List<T,>(props: { items: T[]; render: (item: T) => ReactNode }) { ... }`,`You must use any`,`Only in class components`],a:1,

 o:[`They are identical`,`as const is a runtime assertion`,`as const widens to literal types and nothing else; satisfies checks against a type while preserving the literal`,`satisfies requires a runtime check`],a:2,

{q:`How do you get type-safe routing?`,

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>React Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + esc(q.q) + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + esc(q.o[state.ans[i]]) + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + esc(q.o[q.a]) + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + esc(q.e) + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
