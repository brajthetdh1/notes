<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Mock Test — Set 4 · 100 MCQs</title>
<meta name="description" content="100 MongoDB MCQs: version features, Atlas tiers and features, drivers and sessions, geospatial and text search, GridFS, collation, migrations, backup and recovery, encryption, auditing and sharding choices.">
<style>
  :root{
    --brand:#00684a;
    --brand-dark:#023430;
    --accent:#00ed64;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#023430;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,104,74,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdf4}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 MongoDB Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — MONGODB SET 4 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Version features ---------- */
{q:'Which major feature became generally available in MongoDB 7.0?',
 o:['Queryable Encryption','Change streams','Multi-document transactions','Queryable Encryption alongside sharded cluster support for many features'],a:0,
 e:'Queryable Encryption reached GA in 7.0, allowing equality and, later, range queries on encrypted fields processed by the server without decryption.'},

{q:'Which query language feature became generally available in MongoDB 8.0?',
 o:['$merge','Queryable range queries on encrypted fields, plus significant performance improvements','Change streams','Aggregation pipelines'],a:1,
 e:'MongoDB 8.0 extended Queryable Encryption to range queries in GA and shipped substantial performance gains, along with better sharding and time-series capabilities.'},

{q:'What does setFeatureCompatibilityVersion actually control?',
 o:['The server binary version','The MongoDB driver version','Which on-disk and wire-protocol features are enabled, gating newer features after an upgrade','The replica-set name'],a:2,
 e:'FCV lets a new binary operate in the previous version\'s compatibility mode, so you can upgrade binaries first and flip the FCV later once the rollback window has passed.'},

{q:'Why must you setFeatureCompatibilityVersion only after every member is running the new binary?',
 o:['The FCV change is irreversible','Older binaries do not understand newer on-disk formats and may refuse to start or corrupt data','It disables replication','It deletes the oplog'],a:1,
 e:'Raising the FCV enables new on-disk formats. If a downgraded binary later starts against that data, it may not understand it. Rollback requires lowering the FCV first, before downgrading binaries.'},

{q:'Which MongoDB release introduced the clustered collection type?',
 o:['4.4','5.0','6.0','7.0'],a:1,
 e:'Clustered collections arrived in 5.0 and store documents in _id order, avoiding the separate _id index and speeding up _id range scans and TTL cleanup.'},

{q:'Which release added time-series collections?',
 o:['4.4','5.0','6.0','3.6'],a:1,
 e:'Time-series collections were introduced in 5.0 with bucket-based storage, followed by measured improvements in later versions such as columnar compression and better query support.'},

{q:'Which release added $setWindowFields for window functions?',
 o:['4.2','4.4','5.0','6.0'],a:2,
 e:'$setWindowFields came in 5.0 and brought running totals, moving averages, ranks, lag and lead to the aggregation pipeline.'},

{q:'What is the recommended sequence for upgrading a replica set?',
 o:['Upgrade all secondaries first, then step down the primary and upgrade it, then raise the FCV','Upgrade the primary first','Upgrade all members simultaneously','Drop and recreate the replica set'],a:0,
 e:'Rolling upgrades keep a majority of members on the old version while secondaries are updated, then the primary steps down and is upgraded last. Only afterwards is the FCV raised.'},

{q:'What is the correct order for upgrading a sharded cluster?',
 o:['Shards first, then config servers, then mongos','Mongos first, then config servers, then shards','All components at once','Config servers first, then mongos, then shards'],a:1,
 e:'Mongos routers are stateless, so they upgrade first, then the config server replica set, then the shards. Each step is rolled one member at a time.'},

{q:'Which file does the server use to pin a cluster to a specific FCV after startup?',
 o:['mongod.conf','featureCompatibilityVersion is stored in the admin database','.fcv','version.lock'],a:1,
 e:'The FCV is a document in admin.system.version. setFeatureCompatibilityVersion reads and writes it, and it survives restarts because it is persisted with the data.'},

/* ---------- 11–20 : Atlas tiers & features ---------- */
{q:'Which Atlas tier offers shared infrastructure suitable for learning but not production?',
 o:['M0, M2 and M5','M10','M30','M60'],a:0,
 e:'M0 is free; M2 and M5 are cheap shared tiers. They have limited IOPS, connections and storage, and no dedicated resources, so production should start at M10.'},

{q:'What is the Atlas Flex tier designed for?',
 o:['Mission-critical production workloads','Workloads that need dedicated IOPS','Entry-level workloads that need more flexibility than shared tiers but less than dedicated clusters','Multi-region sharding'],a:2,
 e:'Flex is positioned between free and dedicated: it scales independently for storage and compute, and is a step up from shared tiers without the cost and commitment of M10.'},

{q:'What does Atlas Serverless primarily optimise for?',
 o:['Predictable sustained throughput','Pay-per-use on spiky or intermittent workloads, scaling with usage rather than a fixed cluster size','Multi-region sharding','On-premises deployments'],a:1,
 e:'Serverless bills by operations and storage, and suits dev/test or bursty traffic. Sustained high load is usually cheaper and more predictable on dedicated clusters.'},

{q:'What does an Atlas global cluster (Global Writes) provide?',
 o:['A single replica set in one region','A sharded cluster with zones in multiple regions, letting you keep data near users and write locally','An extra mongos','A backup region only'],a:1,
 e:'Global clusters use zone sharding and location-aware shard keys so reads and writes are served from the nearest region, with a configurable number of zones.'},

{q:'Which Atlas feature allows deployment of one cluster across AWS, Azure and GCP simultaneously?',
 o:['Atlas Data Federation','Atlas Search','Atlas Triggers','Atlas multi-cloud clusters'],a:3,
 e:'Multi-cloud clusters distribute replica-set members across providers, which reduces provider-specific risk. Cross-provider latency must be considered when placing the electable members.'},

{q:'What is Atlas Online Archive designed to do?',
 o:['Move aged documents to cheaper object storage while keeping them queryable through the same connection','Speed up indexes','Replace backups','Provide cross-region reads'],a:0,
 e:'A rule on a collection sends matching documents to an archive store, and queries transparently include archived data, reducing operational storage cost.'},

{q:'Which Atlas feature provides approximate nearest-neighbour search for embeddings?',
 o:['Atlas Search','Atlas Charts','Atlas Data Federation','Atlas Vector Search'],a:3,
 e:'Vector Search indexes embeddings and exposes them through $vectorSearch, which is the building block for semantic search and retrieval-augmented generation.'},

{q:'Which Atlas tool lets you manage deployments from a terminal?',
 o:['mongosh','Atlas CLI','compass','mongocli-shell'],a:1,
 e:'Atlas CLI (formerly part of mongocli) manages clusters, users, network access and backups, which makes infrastructure automation and CI setup reproducible.'},

{q:'What does a database user in Atlas require to connect from a new IP?',
 o:['A new API key','A database user with the right role plus the client IP added to the project IP access list','A new cluster','A new region'],a:1,
 e:'Atlas enforces both authentication (database users) and network-level access (IP access list or VPC peering or PrivateLink). Missing either produces a connection failure.'},

{q:'Which Atlas feature delivers database events to a function without running your own consumer?',
 o:['Atlas Triggers','Atlas Search','Atlas Data Federation','Atlas Charts'],a:0,
 e:'Database triggers run a function on insert, update, delete or replace events, using change streams underneath. Scheduled and authentication triggers are also available.'},

/* ---------- 21–30 : Drivers, sessions & causal consistency ---------- */
{q:'What is a client session in MongoDB?',
 o:['A replica-set election','A server-side connection','A logical context that groups operations for causal consistency, retryable writes and transactions','A sharding zone'],a:2,
 e:'Sessions carry a cluster time and operation numbers, which is how retryable writes detect duplicates and how causal consistency tracks ordering across reads and writes.'},

{q:'Which session feature guarantees that a read sees writes the same session has already acknowledged?',
 o:['Retryable writes','Read preference primary','Causal consistency','Write concern majority'],a:2,
 e:'Causal consistency tracks the session\'s operation time and includes it in subsequent reads, so they observe the session\'s prior writes even when served by a secondary.'},

{q:'How do retryable writes handle a duplicate retry?',
 o:['The driver checks the oplog','The application deduplicates in memory','The server compares the client-supplied transaction number and operation number, and ignores a duplicate','The server rolls back the first write'],a:2,
 e:'Each retryable write carries a session id plus a transaction number in its writeConcern and statement id. The server recognises a resend of the same operation and does not apply it twice.'},

{q:'What is retryable reads primarily for?',
 o:['Retrying a whole application workflow','Retrying a single read once automatically on a network error or failover, without dedup concerns','Caching reads','Reading from secondaries'],a:1,
 e:'Reads have no side effects, so a single retry is safe. Drivers enable it by default and it covers transient network blips and stepdowns.'},

{q:'Which pool behaviour does maxIdleTimeMS control?',
 o:['How long an idle connection stays in the pool before being closed','How long a query may wait for a connection','The server-side connection limit','The socket timeout'],a:0,
 e:'maxIdleTimeMS recycles idle connections, which is useful behind a load balancer or firewall that silently drops idle TCP sessions.'},

{q:'Why should maxPoolSize be chosen carefully when running many application instances?',
 o:['The pool size is multiplied by the instance count, which can exhaust server connections','Pool size only affects latency','Pool size is capped by the driver','Pool size is fixed per host'],a:0,
 e:'Fifty pods with a pool of 100 request up to 5,000 connections. Aggregate connection count, not per-process pool size, is what the server must accommodate.'},

{q:'What is the purpose of a connection proxy such as mongos for a sharded cluster or a dedicated connection proxy for a replica set?',
 o:['To encrypt traffic','To cache queries','To multiplex many client connections onto fewer server connections and to provide a stable endpoint','To store the oplog'],a:2,
 e:'Proxies reduce connection churn and shield clients from topology changes. They are especially useful in serverless and autoscaling environments.'},

{q:'What does a driver do when it receives a NotWritablePrimary error from a replica-set member?',
 o:['It fails the operation and surfaces the error','It retries the operation once and re-discovers the topology','It connects to the config servers','It drops the connection permanently'],a:1,
 e:'NotWritablePrimary is transient. The driver refreshes its view of the topology and, with retryable writes, resends once against the new primary.'},

{q:'Which option must a driver set for transactions to work?',
 o:['A session, since transactions are bound to a session','A hinted index','A capped collection','A specific read preference'],a:0,
 e:'startTransaction, commitTransaction and abortTransaction all take a session. Drivers expose a withTransaction helper that manages the session and retries transient errors for you.'},

{q:'What does the driver\'s topology monitoring do in the background?',
 o:['It runs queries to warm the cache','It pings members to keep an up-to-date view of primary, secondaries and their latency','It compresses documents','It rotates credentials'],a:1,
 e:'Heartbeats (heartbeatFrequencyMS, 10 seconds by default) keep the topology current. Without accurate monitoring, read preference and failover cannot work correctly.'},

/* ---------- 31–40 : Geospatial & text search ---------- */
{q:'Which index is required for GeoJSON queries using $near, $geoWithin or $geoIntersects?',
 o:['Text index','2d index','Hashed index','2dsphere index'],a:3,
 e:'2dsphere indexes GeoJSON on a sphere. A legacy 2d index handles flat coordinate pairs with planar math and does not support GeoJSON shapes properly.'},

{q:'Which query operator finds documents within a specified distance of a point, sorted by distance?',
 o:['$geoWithin','$near','$geoIntersects','$box'],a:1,
 e:'$near returns documents sorted by distance, nearest first, and requires a geospatial index. $geoWithin is unsorted and is the faster choice when ordering is not needed.'},

{q:'What is the correct GeoJSON representation of a point?',
 o:['{type: "Point", coordinates: [longitude, latitude]}','{type: "Point", coordinates: [latitude, longitude]}','{type: "Location", lng: 0, lat: 0}','[longitude, latitude]'],a:0,
 e:'GeoJSON requires longitude first, then latitude. Getting the order backwards is the most common geospatial bug, because it produces valid-looking but wrong results.'},

{q:'Which operator checks whether a stored geometry intersects a query geometry?',
 o:['$near','$geoWithin','$geoIntersects','$maxDistance'],a:2,
 e:'$geoIntersects is the intersection test; $geoWithin is containment. For polygon and line geometries the distinction matters a great deal.'},

{q:'Which is true about geospatial indexes and $near in a sharded cluster?',
 o:['$near is fully supported on sharded collections','Geospatial operators cannot be used on sharded collections','Only $geoWithin is supported on sharded collections','Geospatial queries must go to the primary'],a:2,
 e:'$near is not supported on sharded collections because it needs a global sort. $geoWithin works and is the usual approach when sharding is required.'},

{q:'What does a text index enable in community MongoDB?',
 o:['$search with Lucene analyzers','$text search with stemming, stop words and relevance scoring','Fuzzy matching','Vector search'],a:1,
 e:'$text supports word stemming, case-insensitive matching, stop-word removal and a textScore for ranking. Lucene-powered $search is available only in Atlas Search.'},

{q:'How many text indexes may a collection have?',
 o:['Unlimited','One','Two','One per collection per shard'],a:1,
 e:'Only one text index per collection, although that index can cover multiple fields with weights. To index different fields with different analyzers, use Atlas Search.'},

{q:'Which operator returns the relevance score of a $text match?',
 o:['$meta: "textScore"','$score','$relevance','$rank'],a:0,
 e:'Project {score: {$meta: "textScore"}} to get the score, and sort by that field. Scores are not comparable across different queries, only within one.'},

{q:'What does an Atlas Search index run on?',
 o:['WiredTiger B-tree','Apache Lucene','MongoDB text index','Elasticsearch'],a:1,
 e:'Atlas Search maintains Lucene indexes synchronised with the collection, giving analyzers, fuzzy matching, autocomplete and compound queries through the $search stage.'},

{q:'Which aggregation stage must be the first stage of an Atlas Search query?',
 o:['$match','$search','$text','$lookup'],a:1,
 e:'$search must be the first stage. Later stages can further filter and shape the results, and $searchMeta retrieves metadata such as facet counts.'},

/* ---------- 41–50 : GridFS & collation ---------- */
{q:'What is the default chunk size used by GridFS?',
 o:['16 MB','1 MB','255 KB','64 KB'],a:2,
 e:'GridFS defaults to 255 KB chunks, chosen so the chunks fit comfortably under the 16 MB document limit with room for metadata. The driver can override it per bucket.'},

{q:'Which two collections does GridFS use by default?',
 o:['fs.files and fs.chunks','gridfs.data and gridfs.meta','files and blocks','fs.meta and fs.data'],a:0,
 e:'fs.files stores one document per file with metadata, length and chunk size, while fs.chunks stores the binary chunk data indexed by files_id and n.'},

{q:'Why does GridFS use a separate chunks collection rather than one large document?',
 o:['To encrypt chunks','Because a single BSON document cannot exceed 16 MB, so files must be split into chunks','To compress the data','To replicate faster'],a:1,
 e:'Splitting into chunks sidesteps the 16 MB document limit and allows streaming reads and range access without loading the whole file.'},

{q:'What does collation strength 1 mean?',
 o:['Base characters only, ignoring case and accents','Case-sensitive, accent-sensitive comparison','Binary comparison','Numeric ordering'],a:0,
 e:'Strength 1 compares only base characters, so "resume" and "Résumé" are considered equal. Strength 2 adds accents, strength 3 adds case, and higher strengths add variant detail.'},

{q:'For a query to use an index created with a collation, what must be true?',
 o:['The query must use the same collation as the index, or the index must have the simple binary collation','The query must not specify a collation','The index must be unique','The query must use a hint'],a:0,
 e:'A collation-aware index only serves queries with the matching collation. Mismatched collations silently force a collection scan, which is easy to miss without explain.'},

{q:'What does the "simple" collation do?',
 o:['Case-insensitive comparison','Accent-insensitive comparison','Binary comparison of the raw bytes, the default when no collation is specified','Locale-aware sorting'],a:2,
 e:'The simple collation compares bytes directly. It is faster but not locale-aware, and it is the default for collections and indexes unless overridden.'},

{q:'Which driver option sets a default collation for all operations on a collection handle?',
 o:['collection(name, {collation: {...}})','db.setCollation()','find({}, {collation: true})','createCollection with a validator'],a:0,
 e:'Setting collation on the collection handle applies it to queries and writes from that handle. It must match the index collation for the index to be used.'},

{q:'Why can numeric strings sort incorrectly without a collation or numeric field?',
 o:['Strings compare lexicographically, so "10" sorts before "9"','MongoDB cannot sort strings','Numeric strings are rejected','The index is corrupt'],a:0,
 e:'Store numbers as numbers for numeric ordering, or use collation with numericOrdering: true if you must keep them as strings, and create the index with the same collation.'},

{q:'What does a unique index with a case-insensitive collation enforce?',
 o:['Uniqueness only for identical byte sequences','Uniqueness across values that compare equal under that collation, so "Alice" and "alice" collide','Uniqueness per shard','No uniqueness at all'],a:1,
 e:'A case-insensitive unique index prevents case variants from both existing. This is a common way to enforce case-insensitive usernames, but it changes equality semantics for every query using that collation.'},

{q:'What is the maximum length of an index key in MongoDB?',
 o:['1024 bytes','8 KB','16 MB','Unlimited'],a:0,
 e:'Index keys are limited to 1024 bytes, which matters for large strings and long compound keys. Very long field values can fail to index and cause the write to fail.'},

/* ---------- 51–60 : Migrations & upgrades ---------- */
{q:'Which tool does Atlas provide for migrating from a self-managed replica set to Atlas?',
 o:['mongosync','mongorestore only','mongoimport','mongodump'],a:0,
 e:'mongosync performs a live, continuous migration from a self-managed deployment or another Atlas cluster, keeping source and target in sync until cutover.'},

{q:'Why is the config server replica set (CSRS) required in modern sharded clusters?',
 o:['It stores the oplog for shards','It stores the cluster metadata durably and consistently, protecting routing information from a single-node failure','It caches queries','It holds chunk data'],a:1,
 e:'Cluster metadata must be highly available because every mongos depends on it. A CSRS of three members tolerates a failure and uses majority write concern internally.'},

{q:'Before downgrading a MongoDB binary, what must you do first?',
 o:['Delete the oplog','Raise the FCV','Lower setFeatureCompatibilityVersion to the target version and wait for it to complete','Recreate the replica set'],a:2,
 e:'Lowering the FCV converts on-disk features back to the older format where possible. Only then can older binaries read the data.'},

{q:'What is the recommended downtime for a rolling replica-set upgrade?',
 o:['Zero to seconds, because members are upgraded one at a time with a majority remaining available','Several hours','A full day','Downtime is not avoidable'],a:0,
 e:'A rolling upgrade keeps a majority of voting members available throughout. Application impact is usually limited to a brief primary election when the old primary steps down.'},

{q:'What is a practical complication of upgrading a sharded cluster with a large number of chunks?',
 o:['Mongos restarts corrupt chunk metadata','The balancer must be stopped during the upgrade, and rebalancing afterwards can be heavy','Chunks are deleted automatically','Shard keys must be rebuilt'],a:1,
 e:'Balancing during an upgrade can interfere with the process. The procedure usually stops the balancer, upgrades every component, then restarts balancing.'},

{q:'Which backup method produces a consistent snapshot with the least load on a replica set?',
 o:['mongodump against the primary','A filesystem snapshot of a secondary\'s data files taken while journaling is enabled','mongodump against every member','mongoexport'],a:1,
 e:'Filesystem snapshots of a secondary capture the data files atomically, and journal replay makes them consistent. mongodump is logical and slow on large data sets.'},

{q:'What does mongodump --oplog capture that a plain dump does not?',
 o:['Only the oplog collection','Index definitions','The changes that occurred while the dump was running, so the dump can be restored to a point in time','The config database'],a:2,
 e:'--oplog records oplog entries during the dump, and mongorestore --oplogReplay applies them so the restored data reflects a single consistent moment.'},

{q:'What does mongorestore --oplogReplay require?',
 o:['A dump created with --oplog','A replica set','A sharded cluster','A standalone server'],a:0,
 e:'oplogReplay applies the oplog.bson file written by mongodump --oplog. Restoring without that file makes the flag meaningless.'},

{q:'What is Percona Backup for MongoDB (PBM)?',
 o:['A driver','A GUI','A registry','An open-source, cluster-wide backup tool that coordinates consistent backups and point-in-time recovery across replica sets and shards'],a:3,
 e:'PBM coordinates backups across all members, stores them in object storage or a filesystem, and supports point-in-time recovery using the oplog.'},

{q:'What does point-in-time recovery restore to?',
 o:['A snapshot taken at midnight','The moment of the last backup only','A specific timestamp within the oplog window, allowing you to recover to just before an accident','The server start time'],a:2,
 e:'PITR combines a base snapshot with oplog replay up to a chosen time. The oplog window bounds how far back you can go, which is why its size matters.'},

/* ---------- 61–70 : Encryption & security ---------- */
{q:'What is the difference between CSFLE and Queryable Encryption?',
 o:['They are identical','CSFLE encrypts on the client but only supports equality queries with deterministic encryption; Queryable Encryption supports equality and range queries with cryptographically protected indexes','CSFLE is server-side','Queryable Encryption is deprecated'],a:1,
 e:'Both encrypt on the client. Queryable Encryption adds searchable encryption with structured indexes and avoids the frequency leak that deterministic CSFLE has.'},

{q:'What is the role of a KMS in client-side field level encryption?',
 o:['It stores the data','It manages the data encryption keys\' master key and controls access to them','It proxies queries','It indexes encrypted fields'],a:1,
 e:'The master key never leaves the KMS (AWS KMS, Azure Key Vault, GCP KMS or a local key provider). Data encryption keys are encrypted with it and stored in the key vault collection.'},

{q:'What is the key vault collection in CSFLE?',
 o:['A collection in the admin database holding encrypted data keys','A special collection, often keyvault.dataKeys, holding the encrypted data encryption keys','A backup collection','An index'],a:1,
 e:'The key vault stores DEKs encrypted with the KMS master key. Access to it should be tightly restricted, since anyone with the DEKs and the KMS access can decrypt data.'},

{q:'Why is deterministic encryption unsuitable for low-cardinality fields?',
 o:['It is slower','It prevents indexing','It produces the same ciphertext for the same input, so frequency analysis can reveal the underlying values','It cannot be decrypted'],a:2,
 e:'If a field has only a few possible values, the ciphertext distribution reveals them. Use random encryption for fields that do not need equality queries.'},

{q:'What does Atlas Encryption at Rest use by default?',
 o:['Volume encryption provided by the cloud provider, managed by Atlas','No encryption','Deterministic encryption','TLS certificates'],a:0,
 e:'Cloud provider volume encryption protects the physical disks. CSFLE and Queryable Encryption add application-level protection for specific fields, defending even against database administrators.'},

{q:'What is the minimum TLS version recommended for MongoDB connections?',
 o:['TLS 1.0','TLS 1.1','TLS 1.2','SSL 3.0'],a:2,
 e:'TLS 1.2 is the minimum, and TLS 1.3 is preferred where supported. Older versions have known weaknesses and are usually rejected by modern drivers and by Atlas.'},

{q:'What does the MongoDB audit log record?',
 o:['All query results','Document contents','Auditable events such as authentication, authorization, DDL, user management and role changes','Backups'],a:2,
 e:'Auditing is available in Enterprise and Atlas. Events are written to file, syslog or BSON, and the filter can be narrowed to reduce overhead and volume.'},

{q:'Which deployment type is required for auditing?',
 o:['Standalone','Replica set or sharded cluster on Enterprise or Atlas','Sharded cluster only on community','Any deployment'],a:1,
 e:'Auditing is an Enterprise and Atlas feature. It works on replica sets and sharded clusters, including their internal member authentication events.'},

{q:'What is field-level redaction via $redact commonly used for?',
 o:['Encrypting documents','Removing fields the current user is not allowed to see at query time, based on $$DESCEND, $$PRUNE and $$KEEP','Compressing documents','Sharding by field'],a:1,
 e:'$redact applies an expression at each document level, which supports row-level and field-level access control when combined with role checks. It is not encryption.'},

{q:'Why is using the root role for an application connection a problem?',
 o:['It slows queries','It prevents replication','It grants cluster-wide administrative privileges, so a compromise or a bug can destroy or reconfigure the whole cluster','It disables indexes'],a:2,
 e:'Applications should have a custom or narrowly scoped built-in role limited to the collections they need, with write privileges only where required.'},

/* ---------- 71–80 : Replica set vs sharding choices ---------- */
{q:'When is a sharded cluster justified over a replica set?',
 o:['Whenever the data exceeds a few GB','When a single replica set cannot deliver the required write throughput, storage capacity or working set in memory','When you need high availability','When you need backups'],a:1,
 e:'Sharding adds real operational cost: mongos routers, config servers, shard-key choices, scatter-gather queries. A replica set should handle high availability alone.'},

{q:'What is the main operational risk of a poorly chosen shard key?',
 o:['Faster queries','Loss of replication','Hot shards, jumbo chunks and scatter-gather queries that make performance worse than an unsharded deployment','Loss of encryption'],a:2,
 e:'The shard key determines distribution and query routing. Getting it wrong is painful and often requires resharding or a new collection layout.'},

{q:'Which operation adds a field to an existing shard key without a full reshard in MongoDB 4.4 and later?',
 o:['sh.reshardCollection()','sh.shardCollection()','sh.splitAt()','sh.refineCollectionShardKey()'],a:3,
 e:'refineCollectionShardKey appends fields to the existing key, which is useful when the original key is too coarse. A full reshard is available from 5.0 with reshardCollection().'},

{q:'Why does a monotonically increasing shard key cause write hot spots?',
 o:['It creates too many chunks','All new documents land in the last chunk on one shard, overloading it','It breaks replication','It disables the balancer'],a:1,
 e:'ObjectIds and timestamps always increase, so new inserts concentrate on a single chunk. Hashed keys or compound keys with a distributed prefix spread the writes.'},

{q:'What is the recommended way to add a shard to a running cluster without impacting clients?',
 o:['Restart every mongos','Stop the balancer permanently','Use sh.addShard() with a replica-set connection string; the balancer then distributes chunks onto it','Drop and recreate the cluster'],a:2,
 e:'addShard registers the shard, and the balancer moves chunks when the imbalance threshold is exceeded. No client changes are needed because mongos learns the new topology.'},

{q:'How do you make reads in a sharded cluster prefer the shard that owns the data?',
 o:['Include the shard key in the query so mongos can target a specific shard','Use read preference nearest','Read from the primary only','Add a hint'],a:0,
 e:'Targeted queries are the biggest performance win in a sharded cluster. A query without the shard key is broadcast to every shard and merged by mongos.'},

{q:'Why does the config server need majority write concern internally?',
 o:['To compress metadata','To ensure cluster metadata survives a config server failure and is not rolled back','To encrypt chunks','To balance chunks'],a:1,
 e:'Routing metadata is critical. Majority write concern prevents a failover from losing a recent chunk migration record, which would otherwise cause inconsistent routing.'},

{q:'How many mongos routers should a production sharded cluster run?',
 o:['One','Two','At least two, ideally more, behind a load balancer or with client-side host lists for availability','One per shard'],a:2,
 e:'A single mongos is a single point of failure. Running several behind a load balancer, or listing several in the connection string, removes that risk.'},

{q:'What does a $lookup with the pipeline form allow that localField/foreignField does not?',
 o:['Nothing; they are equivalent','Joining only within the same database','Nothing; pipeline form is deprecated','More complex join conditions, additional filtering and reshaping of the joined documents using $expr and let'],a:3,
 e:'The pipeline form supports arbitrary matching logic through let and $expr, plus sub-pipeline stages. It is more flexible but usually slower than the simple form.'},

{q:'Why is $lookup often a performance risk in production?',
 o:['It duplicates data','It does not use indexes','It runs per input document and can multiply work dramatically without a supporting index on the foreign field','It cannot run on sharded clusters'],a:2,
 e:'Each input document triggers a lookup. Without an index on the foreignField, the server scans the foreign collection once per document, which is usually disastrous at scale.'},

/* ---------- 81–90 : Time-series, aggregation and performance ---------- */
{q:'Which two options are strongly recommended for a time-series collection besides timeField?',
 o:['metaField and granularity','readPreference and writeConcern','collation and validator','indexes and views'],a:0,
 e:'metaField groups measurements by series and granularity tunes bucketing and compression. Choosing both correctly has a large impact on storage and query speed.'},

{q:'What does $densify do in a time-series pipeline?',
 o:['Compresses documents','Fills in missing time intervals so aggregates produce a value for every bucket','Deduplicates documents','Sorts documents'],a:1,
 e:'$densify inserts documents for missing ranges or time steps; usually paired with $fill to populate values using a method such as locf or a constant.'},

{q:'What limits the amount of memory a single aggregation stage may use?',
 o:['16 MB','32 MB','64 MB','100 MB, with allowDiskUse enabling spill to disk'],a:3,
 e:'Each stage is limited to 100 MB by default. Sorts and groups that exceed it fail unless allowDiskUse: true is set, and spilling is significantly slower.'},

{q:'Why place $project late in a pipeline?',
 o:['$project is expensive','It is required to be last','Reducing the document shape early can help if later stages need fewer fields, but projecting away fields early can prevent later stages from using them; ordering depends on the pipeline','$project must be first'],a:2,
 e:'Projection is cheap and the right position depends on the pipeline. Dropping fields too early is a common mistake when a later stage still needs them; keep what you need and trim at the end if the result is large.'},

{q:'How does $merge differ from $out when the target collection already exists?',
 o:['$merge replaces it entirely, $out merges','$out replaces the collection atomically; $merge can insert, update or replace per-document according to whenMatched and whenNotMatched','They are identical','$merge cannot target an existing collection'],a:1,
 e:'$merge is the tool for incremental materialised views because it preserves unmatched target documents and lets you define exactly how matches are handled.'},

{q:'Why does an index on a low-cardinality boolean field often not help?',
 o:['Booleans cannot be indexed','The index is too large','The index would need to be multikey','The planner may still scan a large fraction of the collection, so a collection scan is often cheaper'],a:3,
 e:'When half the documents match, an index still reads half the collection with extra overhead. Compound indexes with a high-cardinality prefix are usually more useful.'},

{q:'What is the purpose of a covered index projection with _id: 0?',
 o:['Exclude _id so the query can be answered entirely from the index','Speed up writes','Enable sharding','Hide the _id from clients'],a:0,
 e:'If _id is not in the index and is included in the projection, the server must fetch the document. Excluding it makes the query covered and avoids those fetches.'},

{q:'Which explain field tells you how many index keys were scanned versus how many documents were returned?',
 o:['executionStats.totalKeysExamined versus executionStats.nReturned','serverInfo.version','queryPlanner.namespace','millis'],a:0,
 e:'A large ratio of keys examined to documents returned means the index scan is not selective. Adding or reordering fields in a compound index usually fixes it.'},

{q:'What does the storage engine\'s prefix compression apply to?',
 o:['Document data','The journal','Index keys, where shared prefixes of adjacent keys are stored once','The oplog'],a:2,
 e:'Index prefix compression is on by default and reduces index size substantially for keys with common prefixes. It is separate from the collection-level snappy or zstd compression.'},

{q:'Which WiredTiger collection compression option gives the best ratio at moderate CPU cost?',
 o:['snappy','none','zlib','zstd'],a:3,
 e:'zstd typically beats snappy and zlib on ratio for a modest CPU increase. snappy is the default because it is the fastest, not because it compresses best.'},

/* ---------- 91–100 : Monitoring, tooling & incident response ---------- */
{q:'Which MongoDB tool reports per-namespace read and write time, showing which collections dominate I/O?',
 o:['mongostat','mongotop','mongodump','mongorestore'],a:1,
 e:'mongotop shows time spent per namespace on reads and writes. mongostat complements it with server-wide operation counters and connection counts.'},

{q:'Which command would you use to find slow queries when the profiler is at level 1?',
 o:['db.system.profile.find({millis: {$gt: 100}}).sort({ts: -1})','db.slowQueries.find()','db.currentOp({slow: true})','db.getSlowQueries()'],a:0,
 e:'At level 1 the profiler writes operations slower than slowms to system.profile. Query that collection for a time window, and remember to turn the profiler off again.'},

{q:'Why does Atlas recommend enabling the profiler only temporarily?',
 o:['It encrypts data','It can overwrite system.profile repeatedly and adds write and storage overhead','It disables indexes','It breaks replication'],a:1,
 e:'A capped system.profile collection means old entries are lost, and profiling adds overhead. Use Performance Advisor and the slow query log for ongoing analysis.'},

{q:'What does the Atlas Performance Advisor do?',
 o:['Scales the cluster automatically','Backs up the cluster','Analyses slow queries from the logs and suggests indexes, with one-click creation','Encrypts fields'],a:2,
 e:'It works from the query log rather than the profiler, so it has no runtime overhead, and it suggests indexes in the context of existing ones.'},

{q:'Which alert threshold is most useful for the oplog window?',
 o:['Alert when the oplog size exceeds 50 GB','Alert when it stays empty','Alert when the oplog window drops below your longest expected outage or maintenance window','Alert on every secondary restart'],a:2,
 e:'If a secondary is offline longer than the oplog window, it cannot catch up and needs a full resync. Keeping the window comfortably above your maintenance window avoids that.'},

{q:'What does a sudden spike in the number of connections usually indicate?',
 o:['A slow query','A connection leak, an autoscaling event, or a client without pooling','A disk failure','A schema change'],a:1,
 e:'Applications that open a connection per request, or new pods without a capped pool, exhaust server connections. A proxy or smaller pool per instance is the usual remedy.'},

{q:'What is the correct first action when mongod refuses to start after a power loss?',
 o:['Run mongod --repair immediately','Delete the journal','Read the log for the failure reason, verify disk space and permissions, and only then decide on recovery','Restore from a backup'],a:2,
 e:'The log usually names the problem: a missing data directory, permission errors, a port conflict or an unclean shutdown that needs a normal recovery. --repair discards data and should be a last resort.'},

{q:'What is the safest way to take a secondary offline for maintenance?',
 o:['Kill the process','Stop it cleanly with mongod --shutdown or the service manager, so it does not need crash recovery','Delete its data directory','Disable its voting'],a:1,
 e:'A clean shutdown flushes the journal and avoids recovery time on restart. If the member is also being decommissioned, reassign its data or let the primary and secondaries cover the replication factor.'},

{q:'What is the standard way to validate a collection after suspected corruption?',
 o:['db.collection.validate({full: true})','db.repairCollection()','mongod --repair','db.collection.stats()'],a:0,
 e:'validate checks the collection and its indexes for consistency. A full validation checks the underlying data in more depth and is more expensive, so plan it for a maintenance window.'},

{q:'Which practice most reduces the risk of an accidental drop() in production?',
 o:['Disabling drop()','Granting narrow custom roles without the dropCollection privilege, plus backups and a change-review process','Using capped collections','Enabling the profiler'],a:1,
 e:'Least privilege, reviewed changes and tested restores address the real risk. A drop is instantaneous and there is no undo, so the recovery path has to exist before the mistake happens.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>MongoDB Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
