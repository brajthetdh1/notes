<html lang="en">
<head>

<title>MongoDB Mock Test — Set 2 · 100 MCQs</title>

<style>
  :root{
    --brand:#00684a;
    --brand-dark:#023430;
    --accent:#00ed64;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#023430;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,104,74,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdf4}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🍃 MongoDB Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>

          <div class="explain-title" id="explainTitle"></div>

      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — MONGODB SET 2 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : WiredTiger & storage engines ---------- */
{q:'Which storage engine has been the default in MongoDB since version 3.2?',
 o:['MMAPv1','In-Memory','WiredTiger','RocksDB'],a:2,
 e:'WiredTiger replaced MMAPv1 as the default in 3.2. It provides document-level concurrency, compression and checkpoints, and it is the only storage engine supported in current versions.'},

{q:'What level of concurrency control does WiredTiger provide for writes?',
 o:['Database-level locking','Collection-level locking','Document-level locking using optimistic concurrency','Global locking'],a:2,
 e:'WiredTiger uses document-level concurrency control, so writes to different documents in the same collection proceed in parallel. Writers do not block readers, thanks to MVCC.'},

{q:'Which compression algorithm does WiredTiger use by default for collection data?',
 o:['zlib','snappy','zstd','No compression'],a:1,
 e:'snappy is the default because it is fast. zlib compresses better but is slower, and zstd gives a strong ratio at moderate CPU cost. The index prefix compression is separate.'},

{q:'What does the WiredTiger cache size default to?',
 o:['25% of RAM','50% of (RAM minus 1 GB), with a 256 MB minimum','75% of RAM','100% of RAM'],a:1,
 e:'The default is 50% of (RAM - 1 GB), floored at 256 MB. The remaining memory is left for the OS file cache, connections and per-operation overhead. Override with storage.wiredTiger.engineConfig.cacheSizeGB.'},

{q:'How often does WiredTiger take a checkpoint by default?',
 o:['Every 10 seconds','Every 60 seconds','Every 5 minutes','Only on clean shutdown'],a:1,
 e:'Checkpoints occur roughly every 60 seconds and write a consistent snapshot of data and metadata to disk. They are the recovery starting point after a crash.'},

{q:'What is the default journal commit interval in WiredTiger?',
 o:['1 ms','10 ms','50 ms','100 ms'],a:3,
 e:'WiredTiger fsyncs the journal every 100 ms by default (storage.journal.commitIntervalMs). A write with j:true forces a journal flush before acknowledging, independent of that interval.'},

{q:'What happens when the WiredTiger cache fills with dirty pages?',
 o:['Application threads participate in eviction and writes may stall','MongoDB crashes immediately','Data is silently dropped','The cache grows without limit'],a:0,
 e:'WiredTiger runs background eviction, but under sustained pressure application threads are recruited to evict, which increases latency. Persistent cache pressure is a sign of insufficient RAM or of writes outpacing disk.'},

{q:'What characterises the In-Memory storage engine?',
 o:['It writes data to disk but not the oplog','It keeps data in RAM without persisting it, though it still writes an oplog for replication','It persists data to a memory-mapped file','It cannot be used with replication'],a:1,
 e:'The In-Memory engine keeps documents and indexes in memory (conceptually), so it is fast but loses data on restart. The oplog is still written, so replicas can replicate.'},

{q:'What happened to MMAPv1?',
 o:['It was deprecated and removed in MongoDB 4.2','It became the default in 4.0','It is still the default for sharded clusters','It was renamed to WiredTiger'],a:0,
 e:'MMAPv1 was deprecated in 4.0 and removed in 4.2. Any cluster still on it must migrate to WiredTiger, which cannot be done in place on the same data files.'},

{q:'How do time-series collections store data internally in modern MongoDB?',
 o:['One document per measurement with no compression','A bucketed columnar layout that groups measurements from the same series and time window','A single BSON document per collection','A relational table'],a:1,
 e:'Time-series collections group measurements into buckets and store them in a columnar format optimised for compression and sequential scans, reducing storage and query cost substantially.'},

/* ---------- 11–20 : Journaling & write path ---------- */
{q:'Which write concern guarantees that a single write survives a mongod crash?',
 o:['w:0','w:1','{w:1, j:true}','w:"majority"'],a:2,
 e:'{w:1, j:true} waits for the journal to be flushed before acknowledging, so the write survives a process crash. w:"majority" adds replica-set durability, which is different from local crash safety.'},

{q:'What isolation level do WiredTiger reads provide by default?',
 o:['Read uncommitted','Snapshot isolation — a consistent view of the data as of the start of the operation','Serialisable','Read committed'],a:1,
 e:'WiredTiger uses MVCC to give each read or transaction a consistent snapshot. Readers never block writers and never see partially applied updates.'},

{q:'What exactly does a WiredTiger checkpoint capture?',
 o:['A consistent on-disk snapshot of data files plus the metadata needed to recover from it','Only the oplog','Only indexes','A logical dump of documents'],a:0,
 e:'A checkpoint gives a clean, consistent starting point for recovery. After a crash, mongod loads the last checkpoint and replays the journal from that point forward.'},

{q:'What happens during crash recovery in WiredTiger?',
 o:['The whole data directory is rebuilt from the oplog','All data files are replaced from backup','Only the last checkpoint is restored','mongod loads the last checkpoint and replays journal records written since it'],a:3,
 e:'Recovery replays the journal from the last checkpoint to bring the data files up to date. The journal is what makes uncheckpointed writes durable.'},

{q:'Which directory holds WiredTiger journal files?',
 o:['dbPath/WiredTiger','dbPath/journal','dbPath/log','dbPath/journal/','dbPath/wtjournal'],a:1,
 e:'Journal files live in journal/ inside dbPath. In modern versions the journal is compressed with snappy by default, which is configured by storage.wiredTiger.engineConfig.journalCompressor.'},

{q:'Do secondaries write to their own journal?',
 o:['Yes, each member maintains its own journal for crash recovery','No, only the primary journals','Only if j:true is requested by the client','Only in sharded clusters'],a:0,
 e:'Every mongod member writes and flushes its own journal. Journaling is local durability; replication is a separate mechanism that ships operations via the oplog.'},

{q:'What is the practical difference between write concern {j:true} and {w:"majority"}?',
 o:['They are identical','{j:true} is faster','{j:true} protects against local crash; {w:"majority"} protects against the loss of the primary and against rollback, because a majority has applied the write','{w:"majority"} does not survive restarts'],a:2,
 e:'Use {w:"majority", j:true} when you need both: the write is journaled locally and acknowledged by a majority, so it survives a failover and is not rolled back.'},

{q:'What does the WiredTiger "dirty cache" percentage measure?',
 o:['Disk space used by indexes','The number of unindexed queries','The percentage of cache pages that are uncommitted','The proportion of the cache holding modified pages not yet written to disk'],a:3,
 e:'A high dirty ratio triggers aggressive eviction. A sustained dirty ratio above roughly 20% is a warning sign that the disk cannot keep up with the write rate.'},

{q:'What is the default journal compressor in WiredTiger?',
 o:['zlib','snappy','zstd','None'],a:1,
 e:'snappy compresses journal records quickly. zlib and zstd are options if you prefer a better ratio and can accept more CPU.'},

{q:'Why must you avoid killing mongod with SIGKILL in production?',
 o:['It corrupts the oplog permanently','It prevents a clean shutdown, forcing crash recovery on the next start; unsynced writes are only recoverable if journaled','It deletes the data directory','It disables replication'],a:1,
 e:'A SIGKILL leaves the data files at an arbitrary point, so the next start performs recovery from the last checkpoint plus the journal. Journaled writes survive; writes not yet journaled are lost.'},

/* ---------- 21–30 : Query planner & explain ---------- */
{q:'Which explain verbosity shows nReturned, executionTimeMillis, totalKeysExamined and totalDocsExamined?',
 o:['executionStats','queryPlanner','allPlansExecution','serverInfo'],a:0,
 e:'executionStats runs the winning plan and reports the executed statistics. Compare totalDocsExamined with nReturned: a large gap means the index is not selective enough.'},

{q:'Which explain verbosity shows the winning plan plus the rejected candidate plans?',
 o:['executionStats','queryPlanner','allPlansExecution','verbose'],a:2,
 e:'allPlansExecution includes per-plan execution statistics during the trial period, which is how you see why the planner chose one index over another.'},

{q:'If a query examines 10,000 documents to return 5, what does that suggest?',
 o:['The query is perfectly indexed','The index is not selective for this predicate, or no suitable index exists','The collection is corrupt','The write concern is wrong'],a:1,
 e:'A high docsExamined-to-nReturned ratio means the engine reads far more than it returns. Add or refine a compound index that matches the query and sort.'},

{q:'What is the query plan cache?',
 o:['A per-collection cache of the plans chosen for each query shape','A disk cache of result documents','A cache of index builds','A cache of connections'],a:0,
 e:'MongoDB caches a winning plan per query shape. Plan cache entries can become stale after large data changes, which is when planCacheClear and index filters help.'},

{q:'Which command clears the query plan cache for a collection?',
 o:['db.coll.drop()','db.coll.reIndex()','db.coll.clearCache()','db.coll.getPlanCache().clear()'],a:3,
 e:'getPlanCache().clear() removes cached plans so the planner re-evaluates. Inspect with getPlanCache().getPlansByQuery() and use plan cache query settings to pin a plan when needed.'},

{q:'What is a blocking sort?',
 o:['A sort that blocks writes on the collection','A sort the index cannot satisfy, forcing an in-memory sort that is limited to 32 MB by default','A sort that blocks replication','A sort with a collation'],a:1,
 e:'Blocking sorts can fail with "Sort exceeded memory limit" once they pass 32 MB, unless allowDiskUse is set or the sort is supported by an index prefix.'},

{q:'When can MongoDB use index intersection?',
 o:['Whenever two indexes exist','Only with text indexes','Rarely: when two indexes can each satisfy part of the predicate, and the planner estimates it is cheaper than a single compound index','Only in sharded clusters'],a:2,
 e:'Index intersection exists, but a well-designed compound index is almost always faster and simpler. Do not rely on intersection as a design strategy.'},

{q:'What does hint() do in a MongoDB query?',
 o:['Forces the planner to use a specific index','Adds a comment to the query','Logs the query plan','Rejects the query if no index is used'],a:0,
 e:'hint() is a diagnostic and tuning tool. If you find yourself needing it in production, consider pinning the plan with plan cache query settings or fixing the index design.'},

{q:'Why can a plan chosen at trial time later perform badly?',
 o:['Indexes are deleted automatically','The collection has changed size and data distribution since the plan was cached','The planner never re-evaluates','explain is always inaccurate'],a:1,
 e:'Plan cache entries are per query shape and can become stale as data skews. Large data changes, or adding a better index, are reasons to clear the cache or pin a plan.'},

{q:'Which metric in explain best indicates sort cost when the index cannot support the sort?',
 o:['nReturned','executionTimeMillisEstimate for the SORT stage plus the presence of a SORT stage in the plan','totalKeysExamined','serverInfo.version'],a:1,
 e:'A SORT stage means an in-memory sort. If the index provides the sort order, the plan shows no SORT stage and the index scan returns documents in order.'},

/* ---------- 31–40 : Index optimisation ---------- */
{q:'What does the ESR rule recommend for compound index field order?',
 o:['Equality, Sort, Range','Equality, Sort, Range — equality fields first, then the sort field, then range predicates','Range, Equality, Sort','Sort, Range, Equality'],a:1,
 e:'Equality predicates come first to narrow the scan, then sort fields to avoid a blocking sort, then range fields. Following ESR avoids many blocking sorts and reduces docsExamined.'},

{q:'What is the cardinality of an index field?',
 o:['The number of distinct values in that field','The number of documents in the collection','The number of indexes on the collection','The index size in bytes'],a:0,
 e:'High cardinality means many distinct values and therefore good selectivity. Indexing a low-cardinality boolean field, for example, rarely helps on its own.'},

{q:'What restriction applies to compound multikey indexes?',
 o:['They cannot contain more than two fields','They cannot be unique','They cannot index more than one array field in the same compound index','They cannot be used for sorting'],a:2,
 e:'MongoDB rejects a compound index that would create parallel arrays, because the cartesian product would explode the number of index entries. Use separate indexes or restructure the document.'},

{q:'What is the maximum number of fields in a compound index?',
 o:['8','16','31','32'],a:3,
 e:'A compound index can have at most 32 fields. In practice, indexes with more than four or five fields are usually a sign the queries need rethinking.'},

{q:'If you have an index on {a:1, b:1}, which query can it serve?',
 o:['Only queries on b','Queries on a, or on a and b together, because a is the index prefix','Queries on b alone','No queries without a hint'],a:1,
 e:'The prefix rule: a compound index supports queries on any leading subset of its fields. A query only on b cannot use {a:1,b:1} efficiently and needs its own index.'},

{q:'What does an index collation control?',
 o:['Language-specific comparison rules such as case and accent sensitivity','The compression algorithm','The index storage engine','The shard key distribution'],a:0,
 e:'A query must use the same collation as the index to use it. Indexing with collation {locale:"en", strength:2} enables case-insensitive matching without a regex.'},

{q:'Why is a partial index often better than a sparse index?',
 o:['Sparse indexes are deprecated','Partial indexes can express a filter such as status:"open", which is more precise than "field exists" and matches the query predicate','Partial indexes cannot be unique','Sparse indexes are always larger'],a:1,
 e:'A partial index with partialFilterExpression:{status:"open"} is used only when the query includes that same filter, giving a smaller index and predictable planner behaviour.'},

{q:'How does a unique index treat documents where the indexed field is missing?',
 o:['It ignores them','It treats missing as null, so only one document may have the field missing unless the index is sparse or partial','It rejects the insert','It creates a default value'],a:1,
 e:'Multiple missing values collide as null under a unique index. Use a partial or sparse unique index if you need uniqueness only among documents that actually have the field.'},

{q:'What is the safest order for building an index on a large production collection?',
 o:['Build on all members at the same time','Build on the primary first','Build during peak traffic to spread the load','Build on secondaries first, one at a time, then step down the primary so it can build the index on the former primary'],a:3,
 e:'A rolling index build keeps the primary serving traffic and lets you verify health between steps. Modern builds do not block reads and writes, but they still consume I/O.'},

/* ---------- 41–50 : Aggregation advanced ---------- */
{q:'In a $lookup with a pipeline, what is required to reference the outer document inside the sub-pipeline?',
 o:['A let clause combined with $expr','A $match with a literal value','A $facet stage','A $hint'],a:0,
 e:'let defines variables from the outer document, and the sub-pipeline references them via $expr. Without let, the pipeline cannot see the parent document fields.'},

{q:'What is the main advantage of $merge over $out?',
 o:['$merge is faster','$merge can write to another database','$merge can insert, update or replace documents in an existing collection instead of replacing it entirely','$merge works without indexes'],a:2,
 e:'$merge supports whenMatched and whenNotMatched behaviours, which makes incremental materialised views possible. $out atomically replaces the target collection.'},

{q:'Which stage enables window functions such as running totals and rank?',
 o:['$group','$setWindowFields','$project','$bucket'],a:1,
 e:'$setWindowFields provides partitionBy, sortBy and window bounds with accumulators, which covers running totals, moving averages, ranks and lag/lead calculations.'},

{q:'Which stage is designed to fill gaps in time-series data?',
 o:['$densify combined with $fill','$out','$lookup','$unwind'],a:0,
 e:'$densify inserts missing values in a range or date sequence, and $fill populates the resulting documents using a method such as locf or a fixed value.'},

{q:'Which stage is only available in Atlas Search, not community MongoDB?',
 o:['$search','$match','$text','$regex'],a:0,
 e:'$search uses an Atlas Search index built on Apache Lucene. Community MongoDB uses the $text operator with a text index instead.'},

{q:'What does the $function stage or operator allow?',
 o:['Calling a stored procedure','Executing a server-side JavaScript function defined inline as a custom expression','Invoking a shell command','Creating a new collection'],a:1,
 e:'$function lets you define a JavaScript body with args. It is much slower than native operators and should be used sparingly, mainly for logic that has no native equivalent.'},

{q:'What is $accumulator used for in a $group stage?',
 o:['Counting documents','Defining a custom accumulator with JavaScript init, accumulate and merge functions','Sorting the group output','Joining collections'],a:1,
 e:'$accumulator is for custom aggregations that have no built-in accumulator. Like $function it is JavaScript-based and therefore slower than native operators.'},

{q:'What does the $redact stage do?',
 o:['Redacts sensitive fields with asterisks','Deletes documents','Restricts document contents based on an expression that evaluates to $$DESCEND, $$PRUNE or $$KEEP','Encrypts documents'],a:2,
 e:'$redact walks the document and applies the expression at each level, which is useful for field-level access control in a shared collection.'},

{q:'What does the $sample stage do?',
 o:['Returns a random subset of N documents using a random cursor or a sort-based selection','Sorts documents','Samples every Nth document','Returns the first N documents'],a:0,
 e:'$sample is efficient for large collections because it uses a pseudo-random cursor. For small collections it may fall back to a sort by a random value.'},

{q:'What does the $unionWith stage allow?',
 o:['Unions two databases','Combines the results of the current pipeline with the results of a pipeline on another collection','Merges two indexes','Combines two shard keys'],a:1,
 e:'$unionWith is the aggregation equivalent of a UNION ALL. It takes a collection name and an optional pipeline, and appends the results to the current stream.'},

/* ---------- 51–60 : Transactions deeper ---------- */
{q:'What is a prerequisite for starting a multi-document transaction in a driver?',
 o:['A replica set or sharded cluster and a session','A standalone mongod','A unique index','A capped collection'],a:0,
 e:'Transactions require a session and a topology that supports them. Standalone servers do not support multi-document transactions at all.'},

{q:'Which read concern must a transaction use?',
 o:['local','available','snapshot','majority only'],a:2,
 e:'Transactions read from a snapshot. If you specify a read concern, it must be snapshot (or local/ majority depending on version and topology), and the transaction maintains that single consistent view.'},

{q:'What should a client do when it receives a TransientTransactionError?',
 o:['Abort and give up','Retry the entire transaction from the start','Commit the transaction','Ignore the error'],a:1,
 e:'Transient errors such as write conflicts and network blips mean the transaction did not commit, so the whole transaction should be retried. Drivers\' withTransaction helper does this automatically.'},

{q:'What should a client do when it receives an UnknownTransactionCommitResult?',
 o:['Retry the whole transaction','Abort the session','Assume failure','Retry the commit operation only'],a:3,
 e:'The transaction may already have committed, so retrying the whole transaction risks duplicate effects. Retry only the commit; it is idempotent on the server.'},

{q:'What does MongoDB 4.4 allow inside a transaction that earlier versions did not?',
 o:['Reading from a secondary','Writing to multiple shards','Creating collections and indexes','Using $out'],a:2,
 e:'4.4 added DDL operations to transactions, such as creating collections and indexes, provided the transaction is not already reading or writing across shards in an incompatible way.'},

{q:'What is the maximum size of a single oplog entry produced by a transaction?',
 o:['16 MB','100 MB','1 MB','4 MB'],a:0,
 e:'The commit record for a transaction must fit in the 16 MB BSON limit. Very large transactions therefore fail at commit, which is another reason to keep transactions small.'},

{q:'Can another session read uncommitted writes from an in-progress transaction?',
 o:['Yes, with read concern local','Yes, if it uses w:0','Only in sharded clusters','No, uncommitted writes are invisible to other sessions'],a:3,
 e:'Snapshot isolation hides uncommitted changes. Another session sees the document as it was before the transaction began, or blocks only on a write conflict.'},

{q:'What does a WriteConflict inside a transaction typically cause?',
 o:['Data corruption','A deadlock that stops the server','A transient error that aborts the transaction and should be retried','A permanent lock'],a:2,
 e:'Two concurrent transactions writing the same document conflict; one aborts with WriteConflict, a TransientTransactionError. Design documents so concurrent transactions do not collide.'},

{q:'Which stage is NOT allowed inside a transaction?',
 o:['$merge and $out','$match','$project','$group'],a:0,
 e:'$merge and $out are disallowed in transactions because they would write outside the transactional context in ways that cannot be rolled back cleanly.'},

{q:'Why is it a design smell to need a transaction on a very high-throughput write path?',
 o:['Transactions are deprecated','Transactions add overhead and have a 60-second lifetime and 16 MB commit limit, so frequent multi-document transactions usually signal that the document model should be redesigned','Transactions cannot use indexes','Transactions disable replication'],a:1,
 e:'Single-document writes are atomic and cheap. Embedding related data in one document removes the need for most transactions. Reserve transactions for genuinely multi-document invariants.'},

/* ---------- 61–70 : Replication deeper ---------- */
{q:'Where is the oplog stored?',
 o:['In the admin database','In a capped collection called oplog.rs in the local database','In the config database','In a file outside dbPath'],a:1,
 e:'The oplog lives in local.oplog.rs and is a capped collection. It is not replicated to secondaries as a collection; each member maintains its own copy by applying the operations it receives.'},

{q:'What determines the default oplog size on a new replica-set member?',
 o:['A fixed 1 GB','5% of free disk space, bounded by a minimum of 990 MB and a maximum of 50 GB','Always 10 GB','Always 100 GB'],a:1,
 e:'The default is 5% of free disk, clamped between 990 MB and 50 GB. Size it from your write rate multiplied by the longest expected maintenance window, not from the default.'},

{q:'What does priority 0 mean for a replica-set member?',
 o:['It can never become primary','It has the highest priority','It cannot vote','It is hidden from clients'],a:0,
 e:'Priority 0 members never seek election, which makes them good for analytics, backups or cross-region disaster recovery. Set hidden:true too if you also want to exclude them from read preference targeting.'},

{q:'What does rs.stepDown() do?',
 o:['Deletes the member from the replica set','Promotes a secondary','Restarts the member','Makes the current primary step down so an election can choose a new primary'],a:3,
 e:'It is used during maintenance so the primary can be taken offline cleanly. The stepdown may be rejected if no electable secondary is up to date.'},

{q:'What is chained replication?',
 o:['Replicating the oplog twice to the same member','A secondary syncing from another secondary rather than directly from the primary','Encrypting the oplog','Splitting the oplog across members'],a:1,
 e:'Chaining is enabled by default and reduces load on the primary. Disable it with chainingAllowed:false in replSetGetConfig when every secondary must sync from the primary.'},

{q:'How does a secondary choose its sync source?',
 o:['The driver assigns one','You must specify one manually','MongoDB selects it automatically based on freshness, latency and network distance, unless replSetSyncFrom overrides it','It always syncs from the primary'],a:2,
 e:'Automatic source selection picks the best member to follow. replSetSyncFrom is a temporary override, mainly for debugging replication issues.'},

{q:'What is required to apply rs.reconfig()?',
 o:['A single member vote','A majority of the voting members must be reachable','All members must be running','No requirements'],a:1,
 e:'Reconfig uses a majority of voters. Use force:true only in a disaster scenario, since it can create divergent configurations.'},

{q:'What does wtimeout do in a write concern?',
 o:['Limits how long the server waits for the requested write concern before returning an error','Timeout for connecting to the server','Timeout for the transaction to commit','Timeout for the oplog to grow'],a:0,
 e:'wtimeout causes the write to return an error if the requested w is not satisfied within the time limit. Critically, the write may still be applied later; the error does not mean it failed.'},

{q:'What does a member\'s priority value control?',
 o:['The likelihood it becomes primary in an election, with higher values preferred if the member is up to date','Its network bandwidth','Its oplog size','Its read preference'],a:0,
 e:'Priority influences elections only among eligible, sufficiently up-to-date members. Priority 0 disables election eligibility entirely.'},

{q:'What is the purpose of the majority write concern in a cross-region deployment?',
 o:['It guarantees the lowest latency','It ensures the write is durable on a majority of voting members, which usually spans regions so a regional outage does not roll back acknowledged writes','It writes only to the nearest region','It bypasses replication'],a:1,
 e:'Put the majority inside the regions you can survive losing. A write acknowledged by a majority that spans regions survives a single-region failure without rollback.'},

/* ---------- 71–80 : Sharding operations ---------- */
{q:'What is the correct configuration for config servers in modern MongoDB?',
 o:['A single standalone server','Two servers for redundancy','A replica set (CSRS), typically of three members','One per shard'],a:2,
 e:'Since 3.4, config servers must run as a replica set. They store the cluster metadata and use majority write concern internally to protect it.'},

{q:'What is true about a mongos router?',
 o:['It stores a copy of the data','It is stateless and can be scaled horizontally, since metadata comes from the config servers','It must run on the same host as a config server','Only one mongos is allowed per cluster'],a:1,
 e:'mongos keeps a cached copy of routing metadata but is not authoritative. You can run many mongos instances behind a load balancer for availability and throughput.'},

{q:'What does the balancer do in a sharded cluster?',
 o:['Moves chunks between shards to even out data distribution, respecting zones and balancing windows','Balances client connections','Balances indexes','Balances read preference'],a:0,
 e:'The balancer migrates chunks when the difference between the shard with the most and fewest chunks exceeds the migration threshold. It can be scheduled with balancing windows.'},

{q:'What is a jumbo chunk?',
 o:['A chunk larger than the configured chunk size that cannot be split because no split point exists for the shard key values, so the balancer cannot move it','A chunk on the primary shard','A chunk with too many indexes','A chunk with no documents'],a:0,
 e:'Jumbo chunks pin data to one shard. A shard key with low cardinality or heavy duplication creates them. Resharding with a better key, or refining the key, is the usual fix.'},

{q:'What is the default chunk size?',
 o:['16 MB','64 MB','128 MB','1 GB'],a:2,
 e:'The default max chunk size is 128 MB. Smaller chunks balance better but cause more migrations; larger chunks migrate less often but are coarser.'},

{q:'Which command adds a shard to a running cluster?',
 o:['sh.addShard("replicaSetName/host:port")','sh.enableSharding("host")','db.addShard()','sh.newShard()'],a:0,
 e:'addShard registers a shard, which must be a replica set in modern deployments. The cluster begins rebalancing chunks onto it automatically.'},

{q:'Which command reports the sharding status of databases and collections?',
 o:['sh.status()','db.stats()','rs.status()','db.shards()'],a:0,
 e:'sh.status() shows sharded databases, collections, chunk distribution, balancer state and any jumbo chunks, which makes it the first stop for sharding diagnostics.'},

{q:'How can you change the shard key of an existing collection in MongoDB 5.0 and later?',
 o:['Drop and recreate the collection','Use sh.reshardCollection()','Use refineCollectionShardKey only','Change the chunk size'],a:1,
 e:'reshardCollection rewrites the collection into a new shard key online, with a temporary doubled storage footprint. refineCollectionShardKey adds a suffix field to an existing key without a full reshard.'},

{q:'Why is a hashed shard key poor for range queries?',
 o:['Hashed keys cannot be indexed','Hashing destroys the ordering, so a range on the underlying field matches documents scattered across all shards and requires a scatter-gather','Hashed keys are not supported in indexes','Hashed keys prevent replication'],a:1,
 e:'Hashing gives even write distribution at the cost of locality. If range queries on that field matter, use a compound key with a coarse prefix, or a ranged key with careful attention to hot spots.'},

{q:'What does sh.enableSharding("appdb") do?',
 o:['Shards every collection in the database','Enables sharding for the database, but each collection must still be sharded explicitly with shardCollection','Creates a new shard','Moves all chunks'],a:1,
 e:'Enabling sharding on a database only allows its collections to be sharded. Each collection then needs sh.shardCollection("appdb.coll", {key:1}).'},

/* ---------- 81–90 : Security ---------- */
{q:'What does Queryable Encryption allow that Field Level Encryption does not?',
 o:['Equality and range queries on encrypted fields, processed by the server without decrypting them','Faster inserts','Automatic key rotation','Encryption of indexes only'],a:0,
 e:'Queryable Encryption (GA in 7.0) supports equality and, in later versions, range queries on encrypted fields, so sensitive data stays encrypted while still being queryable.'},

{q:'In client-side Field Level Encryption, what is the difference between deterministic and random algorithms?',
 o:['They are identical','Random is faster','Deterministic produces the same ciphertext for the same input, enabling equality queries but leaking frequency; random hides patterns but cannot be queried','Deterministic cannot be decrypted'],a:2,
 e:'Choose deterministic only for fields you must query by equality, and random for fields you only read back. The frequency leak in deterministic encryption is a real privacy risk.'},

{q:'What are the valid values for net.tls.mode in modern MongoDB?',
 o:['off, preferTLS, requireTLS','on and off only','disabled, optional, mandatory','tls and ssl'],a:0,
 e:'preferTLS accepts both TLS and plaintext connections, which helps during migration. requireTLS rejects plaintext. Net sslMode names are the deprecated predecessors of these values.'},

{q:'What is required for x.509 authentication?',
 o:['A username and password','An API key','A shared keyfile','A client certificate signed by a CA the server trusts, with a subject matching the MongoDB user'],a:3,
 e:'The certificate subject is mapped to the user. This is common for application authentication and is also used for internal member authentication in place of a keyfile.'},

{q:'Which mechanisms can secure internal authentication between replica-set members?',
 o:['A keyfile shared by all members, or x.509 certificates','LDAP only','SCRAM-SHA-1 only','No authentication is possible between members'],a:0,
 e:'A keyfile is simple and works for a single cluster. x.509 is preferred in larger or multi-cluster deployments because it avoids sharing a secret and supports rotation.'},

{q:'Which built-in role grants the widest privileges?',
 o:['dbAdmin','readWriteAnyDatabase','root','clusterAdmin'],a:2,
 e:'root combines readWriteAnyDatabase, dbAdminAnyDatabase, userAdminAnyDatabase, clusterAdmin and the restore role. Grant it only where genuinely required, and prefer custom roles in production.'},

{q:'How do you create a custom role with specific privileges?',
 o:['db.createRole({role,privileges,roles})','db.addRole()','db.grantPrivilege()','roles.insert()'],a:0,
 e:'createRole takes a list of resource/actions privileges plus inherited roles. This is how you enforce least privilege beyond the built-in roles.'},

{q:'Which deployment offers a native MongoDB audit log?',
 o:['MongoDB Enterprise and Atlas','Every community deployment','Only sharded clusters','Only standalone servers'],a:0,
 e:'Auditing is an Enterprise and Atlas feature. It records authentication, authorization, DDL and other auditable events to file, syslog or a BSON destination.'},

{q:'What does security.authenticationRestrictions let you do?',
 o:['Restrict a user to specific client IP addresses or CIDR ranges','Restrict a user to specific databases','Restrict a user to specific collections','Restrict a user to a replica set'],a:0,
 e:'authenticationRestrictions on a user limits where the user can authenticate from, which is a useful extra control alongside strong passwords or certificates.'},

{q:'Which command shows the authenticated user and their roles on the current connection?',
 o:['db.whoami()','db.runCommand({connectionStatus:1})','db.currentUser()','db.auth()'],a:1,
 e:'connectionStatus returns authenticatedUsers with their roles and authentication mechanisms, which is the quickest way to confirm what the current session can do.'},

/* ---------- 91–100 : Monitoring, ops & Atlas ---------- */
{q:'Which command shows operations currently running on the server?',
 o:['db.currentOp() or the $currentOp aggregation stage','db.stats()','db.serverStatus()','db.locks()'],a:0,
 e:'currentOp lists in-progress operations with opid, namespace, duration and plan summary. Use it to find long-running queries and to obtain the opid for killOp.'},

{q:'Which command terminates a running operation?',
 o:['db.killOperation()','db.terminate()','db.killOp(opid)','db.stopOp(opid)'],a:2,
 e:'db.killOp(opid) stops the operation with that opid. Only operations that support interruption can be killed; some may take a moment to stop.'},

{q:'What does profiler level 1 mean?',
 o:['Profile every operation','Profile operations slower than slowms','Disable profiling','Profile only writes'],a:1,
 e:'Level 0 is off, 1 logs slow operations above slowms, and 2 logs all operations. Level 2 is expensive and should not be left on in production.'},

{q:'Which command returns a large set of server-wide metrics such as opcounters, connections, and WiredTiger cache statistics?',
 o:['db.stats()','db.hostInfo()','db.collection.stats()','db.serverStatus()'],a:3,
 e:'serverStatus is the main metrics source for monitoring agents. It includes opcounters, connections, WiredTiger cache and eviction stats, globalLock and more.'},

{q:'What does db.collection.stats() report?',
 o:['Storage size, index size, document count and average object size for a collection','Only the document count','Only the index list','Replication lag'],a:0,
 e:'collStats is used to track collection and index growth, and to spot collections whose index size exceeds their data size, which often indicates over-indexing.'},

{q:'What does mongotop show?',
 o:['Per-database memory usage','Connection counts','Time spent reading and writing per collection','Replication lag'],a:2,
 e:'mongotop reports read and write time per namespace, which quickly reveals which collection dominates I/O. mongostat complements it with server-level operation rates.'},

{q:'On MongoDB Atlas, what is an M0 cluster?',
 o:['A dedicated cluster with a single node','A free-tier shared cluster suitable for learning and small workloads','A serverless cluster','A multi-region cluster'],a:1,
 e:'M0 is the free shared tier with limits on storage, connections and IOPS. Production workloads should use dedicated tiers such as M10 and above.'},

{q:'When is Atlas serverless a better fit than a dedicated cluster?',
 o:['When you need predictable, sustained high throughput','When you need a fixed number of connections','When the workload is spiky or intermittent and you prefer pay-per-use over provisioned capacity','When you need multi-region sharding with custom topology'],a:2,
 e:'Serverless scales to zero-ish and bills per operation, which suits dev/test and bursty traffic. Sustained high load is usually cheaper and more predictable on a dedicated cluster.'},

{q:'What does the compact command do?',
 o:['Rewrites and defragments a collection and its indexes to reclaim disk space','Deletes old documents','Compresses backups','Rebuilds the oplog'],a:0,
 e:'compact reclaims space freed by deletes and can be run per collection. It requires free disk space for the rewrite and should be scheduled carefully, since it holds locks on the collection.'},

{q:'What is Atlas Search built on?',
 o:['MongoDB text indexes','Elasticsearch','Apache Lucene, exposed through the $search aggregation stage','PostgreSQL full-text search'],a:2,
 e:'Atlas Search runs Lucene indexes that are synchronised with your collection, giving relevance scoring, fuzzy matching, autocomplete and analyzers through the $search stage.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>MongoDB Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
