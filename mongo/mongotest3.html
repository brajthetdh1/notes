<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Mock Test — Set 3 · 100 MCQs</title>
<meta name="description" content="100 MongoDB MCQs: data modelling patterns, schema validation, capped/clustered/time-series collections, mongosh and database tools, connection strings, update operators, aggregation expressions, views, TTL, change streams, error codes and Atlas.">
<style>
  :root{
    --brand:#00684a;
    --brand-dark:#023430;
    --accent:#00ed64;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#023430;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,104,74,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdf4}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🍃 MongoDB Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — MONGODB SET 3 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Data modelling patterns ---------- */
{q:'Which pattern splits a large document into a frequently accessed subset stored in the main collection and a rarely used remainder stored separately?',
 o:['Subset pattern','Extended reference pattern','Bucket pattern','Outlier pattern'],a:0,
 e:'The subset pattern keeps the hot fields in the main collection so common reads stay small, and moves bulky, rarely used fields such as long review histories into a second collection.'},

{q:'A few documents have thousands of comments while the rest have a handful, and some approach the 16 MB limit. Which pattern addresses this?',
 o:['Extended reference pattern','Bucket pattern','Outlier pattern','Computed pattern'],a:2,
 e:'The outlier pattern stores the typical case inline and moves exceptional documents to a separate collection, usually flagged with an extra field, so the common shape stays simple.'},

{q:'Documents have dozens of similar-but-differently-named fields such as size_s, size_m and size_l. Which pattern reorganises them into an array of key/value pairs so they can be indexed?',
 o:['Bucket pattern','Attribute pattern','Tree pattern','Versioning pattern'],a:1,
 e:'The attribute pattern converts many loosely related fields into an array of {k, v} subdocuments. One index on the array then serves queries across all the original field names.'},

{q:'You need to change a document structure but cannot migrate every existing document at once. Which pattern adds a version field so readers can handle both shapes?',
 o:['Polymorphic pattern','Archive pattern','Outlier pattern','Schema versioning pattern'],a:3,
 e:'The schema versioning pattern lets old and new documents coexist. Readers branch on the version field, and documents migrate lazily as they are touched.'},

{q:'A single products collection holds books, clothing and electronics, each with different fields. Which pattern describes this?',
 o:['Polymorphic pattern','Extended reference pattern','Subset pattern','Archive pattern'],a:0,
 e:'The polymorphic pattern stores different shapes in one collection when they are queried together. Shared fields stay at the top level and type-specific fields nest under a subdocument.'},

{q:'Old orders must be retained for compliance but must not slow down the hot collection. Which pattern moves them to separate storage?',
 o:['TTL index','Capped collection','Archive pattern','Subset pattern'],a:2,
 e:'The archive pattern moves aged documents to an archive collection, or to Atlas Online Archive for cheap queryable object storage, keeping the operational collection lean.'},

{q:'Which tree-modelling approach stores a reference to the parent in each node, requiring multiple queries or $graphLookup to read a whole subtree?',
 o:['Materialized paths','Parent references','Nested sets','Child references'],a:1,
 e:'Parent references are simple to write but expensive to read recursively. $graphLookup can traverse them in one aggregation, at some cost on large trees.'},

{q:'Which tree-modelling approach stores the full path from root to node as a string, making subtree queries a prefix match?',
 o:['Parent references','Nested sets','Child references','Materialized paths'],a:3,
 e:'Materialized paths let you find a subtree with an anchored regex or a range query on the path prefix. The cost is that moving a node rewrites every descendant path.'},

{q:'Which tree-modelling approach stores left and right numeric bounds per node, making subtree reads a range query but writes expensive?',
 o:['Nested sets','Materialized paths','Parent references','Adjacency list'],a:0,
 e:'Nested sets give very fast subtree and ancestor queries with a single range predicate, but inserting or moving a node requires renumbering many other nodes.'},

{q:'Why is an ever-growing array of events embedded in a single document a problem?',
 o:['It breaks replication','It grows toward the 16 MB document limit and every append rewrites the whole document','It disables indexes','It prevents sharding'],a:1,
 e:'Unbounded arrays cause document growth, rewrite the entire document on each append, and eventually hit the 16 MB limit. Use a bucket pattern, a separate collection, or a time-series collection instead.'},

/* ---------- 11–20 : Schema validation & collection types ---------- */
{q:'Which collection option enforces field types and required fields on insert and update?',
 o:['$jsonSchema validator','createIndex','collMod','reIndex'],a:0,
 e:'A validator with $jsonSchema rejects documents that do not match the schema. Validation is not retroactive, so existing documents are unaffected until they are updated.'},

{q:'Which validator option makes MongoDB record a violation but still apply the write?',
 o:["validationLevel: 'off'","validationAction: 'error'","validationAction: 'warn'","validationLevel: 'loose'"],a:2,
 e:'With warn, the write succeeds and a warning is logged, which is useful when rolling out validation on an existing collection before switching to error.'},

{q:'Which validationLevel applies validation to inserts and updates of already-valid documents but leaves existing invalid documents untouched?',
 o:['strict','moderate','lenient','off'],a:1,
 e:'moderate lets existing invalid documents stay invalid until they are modified, which avoids breaking writes during a schema migration. strict validates every insert and update.'},

{q:'How do you change the validator on an existing collection?',
 o:['db.coll.modifyValidator()','db.setValidator()','db.runCommand({validate: ...})','db.runCommand({collMod: "coll", validator: {...}})'],a:3,
 e:'collMod updates collection options including the validator, validationLevel and validationAction without recreating the collection.'},

{q:'Which collection type stores documents physically ordered by _id, improving range scans on _id and avoiding a separate _id index?',
 o:['Clustered collection','Capped collection','Time-series collection','View'],a:0,
 e:'A clustered collection stores documents in _id order, so _id range scans read sequentially and no separate index is needed. Create it with clusteredIndex: {key: {_id: 1}, unique: true}.'},

{q:'Which collection type has a fixed size and automatically overwrites the oldest documents when full?',
 o:['Clustered collection','View','Capped collection','Time-series collection'],a:2,
 e:'Capped collections preserve insertion order and discard the oldest documents once full. They are used for logs and circular buffers, and they cannot be sharded.'},

{q:'Which operation is NOT supported on a capped collection?',
 o:['Creating a unique index','Sharding it','Creating a compound index','Reading with find()'],a:1,
 e:'Capped collections cannot be sharded. Updates also cannot make a document larger than its original size, which is why they work best for append-only data.'},

{q:'Which characters are disallowed in MongoDB collection names?',
 o:['Only uppercase letters','Only letters and numbers','Any UTF-8 character including $','Names cannot contain $ or the null character, and cannot start with system.'],a:3,
 e:'Collection names must be non-empty, cannot contain $ or \0, and cannot begin with the system. prefix except for genuine system collections.'},

{q:'Which option must every time-series collection specify?',
 o:['timeField','granularity','expireAfterSeconds','metaField'],a:0,
 e:'timeField names the field holding the measurement timestamp and is required. metaField and granularity are optional but strongly recommended, since they drive bucketing and compression.'},

{q:'How do you create a read-only view over a collection?',
 o:['db.coll.view()','db.createMaterializedView()','db.createView()','db.collection.newView()'],a:2,
 e:'db.createView(name, source, pipeline, options) creates a view defined by an aggregation pipeline. It is computed on read and cannot be written to.'},

/* ---------- 21–30 : Shell, tools & drivers ---------- */
{q:'Which shell replaced the legacy mongo shell in MongoDB 5.0 and later?',
 o:['mongo','mongosh','mongocli','mongod-cli'],a:1,
 e:'mongosh is the modern Node.js-based shell with better autocompletion, syntax highlighting and scripting. The legacy mongo shell was removed in 6.0.'},

{q:'Which mongodump options produce a single compressed archive suitable for streaming to object storage?',
 o:['--single-file --compress','--bundle --zip','--tar --gzip','--archive --gzip'],a:3,
 e:'--archive writes one stream instead of a directory tree, and --gzip compresses it. The result is easy to upload, and mongorestore --archive --gzip reads it back.'},

{q:'Which mongorestore option restores only selected namespaces?',
 o:['--nsInclude','--filter-namespace','--only','--namespace'],a:0,
 e:'--nsInclude takes a glob such as "app.users". Combine it with --nsFrom and --nsTo to rename namespaces during the restore.'},

{q:'Which tool imports JSON, CSV or TSV data into a collection?',
 o:['mongorestore','mongodump','mongoimport','mongofiles'],a:2,
 e:'mongoimport reads a file and creates documents. It is meant for loading external data, not for backups, because it does not preserve BSON types faithfully.'},

{q:'Which tool uploads and downloads GridFS files?',
 o:['bsondump','mongofiles','mongotop','mongostat'],a:1,
 e:'mongofiles works with the GridFS collections fs.files and fs.chunks, providing put, get, list and delete operations from the command line.'},

{q:'Which tool converts a BSON dump file into human-readable JSON?',
 o:['mongorestore','bson2json','mongoconvert','bsondump'],a:3,
 e:'bsondump reads the .bson files produced by mongodump and prints them as JSON, which is handy for inspecting a backup without restoring it.'},

{q:'How are database tools such as mongodump and mongoimport distributed relative to the server?',
 o:['As a separate package that modern server installs do not bundle','Bundled with every mongod install','Only available on Atlas','Downloaded automatically by mongosh'],a:0,
 e:'The MongoDB Database Tools are a separate download. Installing only the server no longer gives you mongodump, so CI images and containers must install the tools package explicitly.'},

{q:'How do you run a script and exit mongosh without an interactive session?',
 o:['mongosh --run','mongosh --batch --file','mongosh --eval "..."','mongosh --exec'],a:2,
 e:'--eval executes an expression and exits, which is ideal for health checks and cron jobs. You can also pass a .js file path as a positional argument.'},

{q:'Which shell helper runs a privileged administrative command such as {currentOp: 1}?',
 o:['db.runAdmin()','db.adminCommand()','db.systemCommand()','db.rootCommand()'],a:1,
 e:'db.adminCommand sends the command to the admin database with the current credentials. Many administrative commands are also wrapped by helpers such as db.currentOp().'},

{q:'What is MongoDB Compass?',
 o:['A command-line shell','A backup tool','A sharding router','The official GUI for querying data and building aggregation pipelines'],a:3,
 e:'Compass provides schema analysis, a visual query builder and an aggregation pipeline builder, which makes it useful for exploration and for explaining slow queries.'},

/* ---------- 31–40 : Connection strings & client behaviour ---------- */
{q:'What does the mongodb+srv:// scheme do?',
 o:['It resolves SRV DNS records to discover hosts and default options','It encrypts the connection','It selects a replica set name','It enables sharding'],a:0,
 e:'SRV records give the driver the host list and default options such as TLS, so the connection string does not have to list every member and stays stable as members change.'},

{q:'Why should a production connection string include replicaSet=myrs?',
 o:['It compresses the traffic','It forces all reads to the primary','It tells the driver the hosts belong to one replica set so it can discover members and fail over correctly','It sets the write concern'],a:2,
 e:'Without the replicaSet parameter the driver may treat the hosts as independent servers, which breaks primary discovery and automatic failover.'},

{q:'Which connection-string option specifies the database that holds the user\'s credentials?',
 o:['authMechanism','authSource','authDatabase','credentialsDb'],a:1,
 e:'authSource matters when users live in the admin database but the connection targets an application database. LDAP and x.509 deployments also use it to point at $external.'},

{q:'Which connection-string option controls the maximum number of connections the driver keeps per server?',
 o:['poolSize','maxConnections','connectionLimit','maxPoolSize'],a:3,
 e:'maxPoolSize defaults to 100 in most drivers. A large pool multiplied across many application instances is a common cause of exhausting server connections.'},

{q:'Which option enables automatic retry of a failed write once on a transient network error?',
 o:['retryWrites=true, which is the default in modern drivers','retryWrites=false','w=0','journal=false'],a:0,
 e:'Retryable writes are on by default and require a replica set. They handle transient failovers safely without the application implementing its own retry loop.'},

{q:'What does serverSelectionTimeoutMS control?',
 o:['How long a query may run','The socket timeout','How long the driver waits to find a suitable server before failing','The connection pool idle timeout'],a:2,
 e:'The default is 30 seconds. If no member matching the read preference is reachable, operations fail with a server selection error, which is often a TLS or host-list problem rather than a slow query.'},

{q:'Which read preference picks the member with the lowest network latency, whether primary or secondary?',
 o:['primaryPreferred','nearest','secondary','secondaryPreferred'],a:1,
 e:'nearest is about latency, not geography or freshness. It may route reads to the primary on a low-latency network, which surprises people expecting it to prefer secondaries.'},

{q:'Which read preference option prevents reading from a secondary that is too far behind?',
 o:['readConcernLevel','heartbeatFrequencyMS','wtimeoutMS','maxStalenessSeconds'],a:3,
 e:'maxStalenessSeconds excludes secondaries whose estimated lag exceeds the threshold, with a minimum of 90 seconds. It is ignored for primary read preferences.'},

{q:'Which connection-string option enables TLS?',
 o:['tls=true','secure=true','sslMode=required','encrypt=true'],a:0,
 e:'tls=true is the modern spelling; ssl=true is the legacy alias. Related options include tlsCAFile, tlsCertificateKeyFile and tlsAllowInvalidCertificates, which should stay false in production.'},

{q:'Which connection-string option sets the default write concern?',
 o:['readConcernLevel','writeConcernLevel','w=majority','journal=true'],a:2,
 e:'w can also be a number, and j=true adds journal acknowledgement. Setting it in the URI keeps every operation consistent unless a call overrides it.'},

/* ---------- 41–50 : Query & update operators ---------- */
{q:'Which operator lets a find query compare two fields in the same document?',
 o:['$where','$expr','$function','$cmp'],a:1,
 e:'$expr allows aggregation expressions inside a query, for example {$expr: {$gt: ["$spent", "$budget"]}}. It can use indexes in some cases, unlike $where.'},

{q:'Which option makes a find case-insensitive without a regex or a lowercased field?',
 o:['$options','$caseInsensitive','$text','collation'],a:3,
 e:'A collation such as {locale: "en", strength: 2} gives case-insensitive comparison. An index must be created with the same collation for the query to use it.'},

{q:'Which method returns the unique values of a field across matching documents?',
 o:['db.coll.distinct("field", filter)','db.coll.unique("field")','db.coll.values("field")','db.coll.group("field")'],a:0,
 e:'distinct returns an array of unique values. On large collections it can be slow and can exceed the 16 MB result limit, in which case an aggregation with $group is safer.'},

{q:'Which option makes the server abort an operation that runs longer than a limit?',
 o:['timeoutMS','$timeout','maxTimeMS','killAfter'],a:2,
 e:'maxTimeMS bounds a single operation and returns MaxTimeMSExpired when exceeded. It is a per-operation guard, not a substitute for proper indexing.'},

{q:'Which sort returns documents in their on-disk order?',
 o:['{_id: 1}','{$natural: 1}','{$order: "disk"}','{"$diskOrder": 1}'],a:1,
 e:'$natural sorts by storage order, which is fast but not stable across moves or compactions. It is mainly useful for capped collections and diagnostics.'},

{q:'Which update operator modifies the first array element that matched the query predicate?',
 o:['The positional $ operator','$elemMatch','$first','$index'],a:0,
 e:'The positional $ operator works when the query itself contains a condition on the array element, so the server knows which element matched. It only ever targets the first match.'},

{q:'Which option updates specific array elements matching a condition, using $[<identifier>]?',
 o:['$positional','elemMatch','$slice','arrayFilters'],a:3,
 e:'arrayFilters lets you update all elements satisfying a condition, not just the first. The filter identifiers must match the ones used in the update document.'},

{q:'Which operator adds a value to an array only if it is not already present?',
 o:['$push','$concat','$addToSet','$union'],a:2,
 e:'$addToSet deduplicates while $push always appends. Neither is a substitute for a unique index when concurrent writers may race.'},

{q:'How do you keep only the 10 most recent entries in an array using a single update?',
 o:['$push with $each only','$push with $each, $sort and $slice','$set with $slice','$addToSet with $limit'],a:1,
 e:'Combining $each, $sort and $slice in one $push trims the array atomically, for example {$push: {recent: {$each: [x], $sort: {ts: -1}, $slice: 10}}}.'},

{q:'Which operator atomically increments a numeric field?',
 o:['$inc','$add','$increase','$sum'],a:0,
 e:'$inc is atomic at the document level, which makes it safe for counters under concurrency. It fails if the field holds a non-numeric value.'},

/* ---------- 51–60 : Aggregation expressions ---------- */
{q:'Which expression returns one of two values depending on a boolean?',
 o:['$if','$case','$cond','$ternary'],a:2,
 e:'$cond takes {if, then, else} or the positional [if, then, else] form. It is the standard way to branch inside a pipeline stage.'},

{q:'Which expression evaluates a series of branches, like a switch statement?',
 o:['$switch','$branch','$cases','$choose'],a:0,
 e:'$switch takes a branches array of {case, then} plus an optional default. It is much more readable than nesting several $cond expressions.'},

{q:'Which expression applies an expression to each element of an array and returns a new array?',
 o:['$each','$apply','$transform','$map'],a:3,
 e:'$map takes an input array, an as variable name and an in expression. It is the standard way to transform array elements without unwinding the document.'},

{q:'Which expression returns only the array elements that satisfy a condition?',
 o:['$match','$filter','$select','$where'],a:1,
 e:'$filter uses input, cond and an optional as variable. It is different from $match, which filters whole documents at the pipeline stage level.'},

{q:'Which expression folds an array into a single value using an accumulator?',
 o:['$fold','$accumulate','$reduce','$merge'],a:2,
 e:'$reduce takes input, initialValue and in, exposing $$value and $$this. It is how you compute sums, concatenations and similar reductions inside a projection.'},

{q:'Which expression defines variables scoped to a subexpression?',
 o:['$let','$var','$def','$with'],a:0,
 e:'$let takes a vars object and an in expression. It avoids recomputing the same expression several times inside a complex projection.'},

{q:'Which expression converts a document to an array of {k, v} pairs, enabling $unwind over field names?',
 o:['$toArray','$docToArray','$arrayFromObject','$objectToArray'],a:3,
 e:'$objectToArray plus $unwind turns dynamic field names into documents, which is the standard way to query or index keys that vary per document.'},

{q:'Which expression merges multiple documents into one, with later fields winning?',
 o:['$merge','$mergeObjects','$concatObjects','$combine'],a:1,
 e:'$mergeObjects is often used with $group to collapse several subdocuments into a single object per group, or to apply defaults over a base document.'},

{q:'Which stage promotes a nested document to the top level of the result?',
 o:['$unwind','$project','$replaceRoot','$flatten'],a:2,
 e:'$replaceRoot with newRoot replaces the output document entirely. $replaceWith is the modern shorthand for the same operation.'},

{q:'Which stage groups by an expression and sorts by descending count in one step?',
 o:['$sortByCount','$countBy','$groupCount','$tally'],a:0,
 e:'$sortByCount is shorthand for $group by the expression plus a descending $sort on the count, and it is the fastest way to build a frequency table.'},

/* ---------- 61–70 : Views, capped collections & TTL ---------- */
{q:'What happens if you try to insert into a view?',
 o:['The insert succeeds and writes to the underlying collection','The insert fails because views are read-only','The insert is queued','The view is converted to a collection'],a:1,
 e:'Views are computed from their pipeline and cannot be written to. Attempting a write returns an error, which also rules out updating or deleting through a view.'},

{q:'Can you create an index directly on a view?',
 o:['Yes, with createIndex on the view','Yes, but only a unique index','Only on Atlas','No; create the index on the underlying collection instead'],a:3,
 e:'Indexes belong to the underlying collection. A view benefits from those indexes only when its pipeline can push predicates down to the source.'},

{q:'How do you implement an on-demand materialized view in MongoDB?',
 o:['Run an aggregation with $merge or $out that writes results to a collection, on a schedule or trigger','Create a view with a cache option','Enable the materializedViews option','Use a TTL index'],a:0,
 e:'MongoDB has no built-in materialized views. The idiom is a scheduled aggregation that merges results into a real collection, which readers then query like a table.'},

{q:'Are TTL indexes supported on capped collections?',
 o:['Yes, with expireAfterSeconds','Yes, but only on the _id field','No, TTL indexes are not supported on capped collections','Only on sharded clusters'],a:2,
 e:'Capped collections already expire data by size, so TTL indexes are rejected. Use one mechanism or the other, not both.'},

{q:'How often does the TTL monitor run by default?',
 o:['Every 10 seconds','About every 60 seconds','Every 5 minutes','Only on restart'],a:1,
 e:'The background task runs roughly once a minute, so documents can outlive their expiry by up to that interval. TTL is for cleanup, not for precise scheduling.'},

{q:'Which field types can a TTL index be built on?',
 o:['A string date','Any numeric timestamp','Only ObjectId','A date field, or an array of dates where the earliest is used'],a:3,
 e:'TTL indexes require a BSON date or an array of dates. A string or a numeric epoch does not trigger expiry, which is a very common misconfiguration.'},

{q:'Can you build a TTL index on the _id field?',
 o:['No; a TTL index cannot be built on _id','Yes, and it is the most common choice','Only if the collection is capped','Only with a partial filter'],a:0,
 e:'_id cannot carry a TTL index. Store an explicit createdAt or expiresAt date field and index that instead.'},

{q:'How do you change the expireAfterSeconds of an existing TTL index without dropping it?',
 o:['Drop and rebuild the index','db.coll.setTTL()','db.runCommand({collMod: "coll", index: {keyPattern: {...}, expireAfterSeconds: N}})','db.adminCommand({ttl: N})'],a:2,
 e:'collMod with an index key pattern and the new expireAfterSeconds updates the index in place, avoiding a rebuild on a large collection.'},

{q:'Which internal collection is a capped collection?',
 o:['config.chunks','local.oplog.rs','admin.system.users','config.settings'],a:1,
 e:'The oplog is capped so it naturally rolls off old entries. That roll-off is exactly why a long-offline secondary may need a full resync.'},

{q:'How do you delete data from a time-series collection?',
 o:['Drop and recreate the collection','db.collection.empty()','You cannot delete from a time-series collection','Use deleteMany with a filter on the timeField and metaField'],a:3,
 e:'Time-series collections support delete operations filtered by the time field and metadata. The server removes the matching measurements from their buckets.'},

/* ---------- 71–80 : Change streams ---------- */
{q:'Which topology is required to use change streams?',
 o:['A replica set or sharded cluster','Any standalone mongod','Only a sharded cluster','Only Atlas'],a:0,
 e:'Change streams are built on the oplog, so they need replication. A standalone mongod has no oplog and cannot serve them.'},

{q:'What lets a change stream resume exactly where it left off after a restart?',
 o:['The oplog timestamp only','The change stream name','A resume token, taken from the change event _id or the postBatchResumeToken','The collection UUID'],a:2,
 e:'Store the resume token with your processed state and pass it as resumeAfter on reconnect. Using postBatchResumeToken avoids re-delivering already seen events.'},

{q:'At which levels can watch() be opened?',
 o:['Only the cluster level','Collection, database and deployment (cluster) level','Only the database level','Only inside a transaction'],a:1,
 e:'Watching the database or cluster level lets a single stream observe many collections, which is convenient for audit pipelines but requires filtering to stay manageable.'},

{q:'What does fullDocument: "updateLookup" do on an update event?',
 o:['It returns only the changed fields','It returns the previous version','It rejects update events','It fetches and includes the current version of the full document'],a:3,
 e:'updateLookup adds a fetch of the current document, so consumers see the post-update state. It is not a strict snapshot at the event time, since later updates may already be applied.'},

{q:'How do you receive only inserts in a change stream?',
 o:["Pass a pipeline such as [{$match: {operationType: 'insert'}}] to watch()","Use a read preference","Set fullDocument to insert","Enable retryWrites"],a:0,
 e:'watch() accepts an aggregation pipeline that filters and reshapes events. Filtering server-side saves bandwidth and client CPU compared with filtering locally.'},

{q:'What does an invalidate event mean?',
 o:['The stream has fallen behind','The client disconnected','The watched collection or database was dropped or renamed, closing the stream','The oplog is full'],a:2,
 e:'Invalidate terminates the stream. The consumer must reopen it with a fresh resume token, since the previous position no longer refers to a valid namespace.'},

{q:'Which option starts a change stream at a specific cluster time?',
 o:['resumeAfter','startAtOperationTime','fromClusterTime','beginAt'],a:1,
 e:'startAtOperationTime gives you a stream from a known cluster time, which is useful when bootstrapping a new consumer from a consistent snapshot.'},

{q:'What must be enabled on a collection to receive fullDocumentBeforeChange in change events?',
 o:['readConcern: majority','changeStreamPreImages: true in the URI','fullDocument: updateLookup','Enable changeStreamPreAndPostImages on the collection'],a:3,
 e:'Pre- and post-images are opt-in per collection to avoid the storage cost. Without them, fullDocumentBeforeChange returns unavailable.'},

{q:'Which option controls how long the server holds a getMore open waiting for new events?',
 o:['maxAwaitTimeMS','timeoutMS','waitTimeMS','getMoreTimeoutMS'],a:0,
 e:'maxAwaitTimeMS bounds each batch wait, which lets a consumer loop periodically check for shutdown signals rather than blocking indefinitely.'},

{q:'Why can a change stream fail with a resumability error after a long pause?',
 o:['The resume token expired','The collection was renamed','The required oplog entries were overwritten, so the stream cannot resume from that position','The client lost TLS'],a:2,
 e:'If the resume token points to an oplog position that has rolled off, the stream cannot continue. Size the oplog so it covers the longest expected consumer outage.'},

/* ---------- 81–90 : Errors & troubleshooting ---------- */
{q:'What does an E11000 error indicate?',
 o:['A schema validation failure','A duplicate key violation on a unique index','A network timeout','A write concern timeout'],a:1,
 e:'E11000 means a unique index rejected the write. The error message names the index and the duplicate key value, which is what you inspect to find the offending document.'},

{q:'What does a NotWritablePrimary error usually mean?',
 o:['The collection is locked','The disk is full','The user lacks permission','The member is no longer primary, typically after a failover; the driver should rediscover and retry'],a:3,
 e:'This is a transient error. Drivers with retryable writes and proper topology discovery handle it automatically, but a stale connection string or disabled retries surfaces it to the application.'},

{q:'What causes CursorNotFound?',
 o:['The server-side cursor timed out or was killed before the client consumed it','The query used too much memory','The index was dropped','The collection was dropped'],a:0,
 e:'Cursors expire after about 10 minutes of inactivity by default (cursorTimeoutMillis). Long batch loops should page with ranges or increase the timeout deliberately.'},

{q:'In a sharded cluster, what does a StaleConfig error mean?',
 o:['The shard key is wrong','The balancer is disabled','The client cached outdated chunk metadata and must retry after refreshing routing information','The config servers are down'],a:2,
 e:'StaleConfig happens when a chunk moved between the time a request was routed and when it executed. It is transient; retrying after the metadata refresh succeeds.'},

{q:'Two transactions update the same document. What error does one of them receive?',
 o:['DuplicateKey','WriteConflict','Deadlock','LockTimeout'],a:1,
 e:'WriteConflict is a TransientTransactionError, so the whole transaction should be retried. Designing documents so concurrent transactions touch different documents avoids it.'},

{q:'Which error is returned when maxTimeMS is exceeded?',
 o:['ExceededTimeLimit','OperationTimedOut','CursorNotFound','MaxTimeMSExpired'],a:3,
 e:'MaxTimeMSExpired (code 50) tells you the operation was cut off by the client-set limit, not by a server failure. Investigate the query plan rather than raising the limit.'},

{q:'The driver fails with "Server selection timed out". What is the most likely cause?',
 o:['No member matching the read preference is reachable, or the host list or TLS configuration is wrong','The database does not exist','The user password is wrong','The collection is capped'],a:0,
 e:'Check DNS and SRV resolution, the replicaSet name, TLS settings and firewall rules. The driver cannot even choose a server, so this is a connectivity problem, not a query problem.'},

{q:'mongod fails with "Too many open files". What should you change?',
 o:['Reduce the cache size','Disable journaling','Raise the file descriptor ulimits and use the recommended values from the production notes','Restart mongod'],a:2,
 e:'MongoDB needs a high file descriptor limit because every data file, index file and connection consumes descriptors. The production notes publish the recommended values.'},

{q:'Application threads are frequently recruited for eviction. What does that indicate?',
 o:['The oplog is too small','The WiredTiger cache cannot keep up with the write rate, so application threads participate in eviction','The disk is full','An index is corrupt'],a:1,
 e:'User-thread eviction shows up as increased latency under write load. Add RAM, raise the cache size, or reduce the working set by archiving or resharding.'},

{q:'Many application instances each open a large connection pool, exhausting server connections. What is the standard remedy?',
 o:['Increase maxPoolSize on every instance','Restart the applications','Disable retryWrites','Reduce maxPoolSize per instance and add a mongos or connection proxy in front of the cluster'],a:3,
 e:'Connection storms multiply quickly: 50 pods with a pool of 100 is 5,000 connections. A proxy or smaller pools per instance keeps the total within the server limit.'},

/* ---------- 91–100 : Atlas & operations ---------- */
{q:'Which Atlas tier is the smallest dedicated cluster?',
 o:['M0','M10','M5','M30'],a:1,
 e:'M0, M2 and M5 are shared tiers with limited IOPS and connections. M10 is the entry dedicated tier, and production workloads should start there or above.'},

{q:'Which Atlas feature provides continuous point-in-time backup snapshots?',
 o:['Filesystem snapshots only','Atlas Search','Cloud Backup with continuous point-in-time recovery','mongodump'],a:2,
 e:'Continuous Cloud Backup lets you restore to a specific moment, which is essential for recovering from an accidental delete or a bad migration.'},

{q:'Which Atlas feature automatically moves aged documents to cheaper object storage while keeping them queryable?',
 o:['Online Archive','Data Federation','Atlas Search','Charts'],a:0,
 e:'Online Archive applies a rule to a collection and moves matching documents to S3-backed storage, where you can still query them through the same connection string.'},

{q:'Which Atlas feature runs queries across Atlas clusters and S3 data without importing it?',
 o:['Atlas Search','Online Archive','Triggers','Atlas Data Federation'],a:3,
 e:'Data Federation creates a virtual database over multiple sources, which is useful for analytics across operational data and a data lake without ETL.'},

{q:'Which Atlas feature runs a function in response to a database change, a schedule or a user authentication event?',
 o:['Atlas Functions','Atlas Triggers','Atlas Charts','Atlas Search'],a:1,
 e:'Triggers come in database, scheduled and authentication flavours. They are a convenient way to react to changes without running your own event consumer.'},

{q:'Which Atlas feature performs approximate nearest-neighbour search on embeddings for semantic search and RAG?',
 o:['Atlas Search','Atlas Charts','Atlas Vector Search','Atlas Data Federation'],a:2,
 e:'Atlas Vector Search indexes embeddings and exposes them through the $vectorSearch aggregation stage, which is the standard building block for retrieval-augmented generation.'},

{q:'What happens when a new replica-set member performs initial sync?',
 o:['It copies all data from an existing member, then applies the oplog from that point to catch up','It only copies the oplog','It copies a single collection','It restores from the most recent backup'],a:0,
 e:'Initial sync clones the databases and then tails the oplog from the clone point. For large data sets, seeding from a filesystem snapshot is faster and safer.'},

{q:'What does the oplog window measure?',
 o:['The time since the last checkpoint','The time since the last election','The size of the oplog in bytes','How long a secondary can be offline and still catch up from the oplog without a full resync'],a:3,
 e:'Monitor the oplog window and alert when it approaches your longest expected maintenance or outage. A window of a few hours is too short for most production clusters.'},

{q:'Why is mongod --repair a last resort?',
 o:['It is always safe and lossless','It may discard documents it cannot read, so data can be lost','It rebuilds all indexes for free','It requires no downtime'],a:1,
 e:'--repair can salvage a damaged data directory but it drops documents it cannot parse. Restoring from a backup or re-syncing from a healthy replica is almost always safer.'},

{q:'Which internal authentication mechanism avoids sharing a single secret across all members and supports per-member certificate rotation?',
 o:['A shared keyfile','SCRAM-SHA-1','x.509 certificates','No authentication'],a:2,
 e:'x.509 lets each member present its own certificate signed by a trusted CA, so rotation is per member instead of a cluster-wide shared-secret cutover. Keyfiles are simpler but harder to rotate.'}

];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>MongoDB Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
