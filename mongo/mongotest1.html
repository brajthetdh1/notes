<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB Mock Test — Set 1 · 100 MCQs</title>
<meta name="description" content="100 MongoDB MCQs with explanations: document model, BSON, CRUD, query operators, indexes, aggregation, replica sets, sharding, transactions, schema design and security.">
<style>
  :root{
    --brand:#00684a;
    --brand-dark:#023430;
    --accent:#00ed64;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#023430;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#ccfbf1;border-color:#99f6e4}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,104,74,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0fdf4}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#ccfbf1}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">🍃 MongoDB Mock Test <span class="setpill">SET 1</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — MONGODB SET 1 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Document model & basics ---------- */
{q:'What type of database is MongoDB?',
 o:['Relational','Document-oriented NoSQL','Key-value only','Graph'],a:1,
 e:'MongoDB is a document database: it stores records as BSON documents inside collections, with a flexible schema rather than fixed relational tables.'},

{q:'How does a collection relate to a document in MongoDB?',
 o:['A collection is one document','A collection is a group of documents, roughly analogous to a relational table','A collection is a database','A collection is an index'],a:1,
 e:'A database contains collections, and a collection contains documents. Unlike relational tables, documents in the same collection may have different fields.'},

{q:'What is the default primary-key field name in a MongoDB document?',
 o:['_key','id','_id','pk'],a:2,
 e:'Every document must have a unique _id field. If you do not supply one, the driver generates an ObjectId. A unique index on _id is created automatically.'},

{q:'What happens if you insert a document without an _id field?',
 o:['The insert fails','The driver generates an ObjectId and uses it as _id','The document is inserted with a null _id','_id is left empty'],a:1,
 e:'Drivers generate an ObjectId client-side when _id is missing, which avoids a server round trip. If a driver does not, the server generates one.'},

{q:'Which BSON type is generated by default for _id and encodes a timestamp plus machine and counter bytes?',
 o:['String','UUID','ObjectId','Int64'],a:2,
 e:'ObjectId is a 12-byte value: 4-byte Unix timestamp, 5-byte random per-process value, and a 3-byte incrementing counter. It is roughly time-ordered.'},

{q:'Which of the following is a valid BSON type that has no direct SQL equivalent?',
 o:['Integer','ObjectId','VARCHAR','DATE'],a:1,
 e:'ObjectId, embedded documents, arrays, Binary, Decimal128, Timestamp, MinKey and MaxKey are all BSON types without a direct relational counterpart.'},

{q:'What does the document size limit default to in MongoDB?',
 o:['4 MB','8 MB','16 MB','64 MB'],a:2,
 e:'A single BSON document is limited to 16 MB. Larger payloads should use GridFS, which splits files into chunks stored in two collections.'},

{q:'What is GridFS used for?',
 o:['Encrypting documents','Storing and retrieving files larger than the BSON document limit by splitting them into chunks','Replicating data across shards','Compressing collections'],a:1,
 e:'GridFS stores file metadata and chunks in fs.files and fs.chunks. It is a convention over two collections rather than a separate storage engine.'},

{q:'What does the _id index guarantee?',
 o:['Document size limits','Uniqueness of the _id field in a collection','Field ordering','Encryption at rest'],a:1,
 e:'MongoDB creates a unique index on _id when a collection is created. You cannot drop it, and you cannot insert a duplicate _id.'},

{q:'Which statement about MongoDB schema design is correct?',
 o:['All documents in a collection must have identical fields','MongoDB enforces a fixed schema at the collection level','Documents in a collection may have different fields, which is why schema design is an application concern','You must declare columns before inserting'],a:2,
 e:'Flexible schema is a core MongoDB feature, but it shifts responsibility to the application. Most production collections still follow a disciplined, consistent shape, optionally enforced by JSON Schema validation.'},

/* ---------- 11–22 : CRUD ---------- */
{q:'Which method inserts one document into a collection?',
 o:['db.coll.addOne()','db.coll.insertOne()','db.coll.put()','db.coll.create()'],a:1,
 e:'insertOne inserts a single document and returns an acknowledged result with the insertedId. Use insertMany for batches.'},

{q:'What does `db.users.updateOne({name:"Sam"}, {$set:{age:30}})` do?',
 o:['Replaces the whole document','Updates at most one matching document, setting age to 30 while keeping other fields','Updates every matching document','Deletes the field age'],a:1,
 e:'updateOne affects only the first match. $set modifies fields in place; without an update operator, the second argument would be treated as a full replacement.'},

{q:'What is the difference between replaceOne and updateOne?',
 o:['They are identical','replaceOne replaces the whole document (keeping _id) while updateOne modifies specified fields','replaceOne only works on arrays','updateOne cannot set fields'],a:1,
 e:'replaceOne replaces everything except _id, so any field not present in the replacement is lost. updateOne with operators preserves unspecified fields.'},

{q:'What is the purpose of the upsert option?',
 o:['Deletes documents that do not match','Inserts a new document when no document matches the filter','Updates every document','Creates an index'],a:1,
 e:'With upsert: true, an update that matches nothing creates a new document from the filter plus the update operators. It is the standard way to implement "insert or update".'},

{q:'Which method removes a single matching document?',
 o:['db.coll.deleteMany()','db.coll.drop()','db.coll.deleteOne()','db.coll.removeAll()'],a:2,
 e:'deleteOne removes the first matching document; deleteMany removes all matches. drop() removes the entire collection including its indexes.'},

{q:'Which command returns documents in a collection but does not give a cursor?',
 o:['db.coll.find()','db.coll.find().toArray()','db.coll.findOne()','db.coll.aggregate()'],a:2,
 e:'findOne returns a single document (or null), while find returns a cursor. toArray() materialises a find cursor into an array on the client.'},

{q:'What does the projection `{name:1, _id:0}` do in a find?',
 o:['Returns only the _id','Returns only the name field and excludes _id','Returns all fields except name','Sorts by name'],a:1,
 e:'Inclusion projections list the fields to return with 1. _id is included by default, so it must be explicitly excluded with 0.'},

{q:'What does `find().sort({age:-1}).limit(10).skip(20)` return?',
 o:['The first 10 documents','Documents 21 through 30 after sorting by age descending','All documents older than 20','The top 20 documents'],a:1,
 e:'Order matters: sort, then skip 20, then limit 10. This is offset pagination, which becomes slow at high offsets and is often replaced by range-based pagination on an indexed field.'},

{q:'Which method counts documents matching a filter without returning them?',
 o:['db.coll.countDocuments({status:"open"})','db.coll.size({status:"open"})','db.coll.total({status:"open"})','db.coll.length({status:"open"})'],a:0,
 e:'countDocuments runs a count against the filter. estimatedDocumentCount is faster but ignores the filter and uses collection metadata.'},

{q:'What does the `$setOnInsert` operator do?',
 o:['Sets a field only when a new document is inserted by an upsert','Sets a field only on replacement','Sets a field only when deleting','Sets a field only if it does not exist'],a:0,
 e:'$setOnInsert applies only on the insert branch of an upsert, which is useful for fields like createdAt that should be written once.'},

{q:'Which write concern acknowledges only after the write reaches the primary\'s journal?',
 o:['w:0','w:1','w:"majority"','j:true with w:1'],a:3,
 e:'{w:1, j:true} waits for the primary to journal the write before acknowledging. w:"majority" additionally waits for a majority of replica-set members to apply it.'},

{q:'What does an unordered bulkWrite do differently from an ordered one?',
 o:['It ignores errors entirely','It continues past failed operations instead of stopping at the first error','It writes only to secondaries','It skips validation'],a:1,
 e:'Ordered (the default) stops at the first error. Unordered executes operations in parallel and continues after failures, which is faster and more resilient for independent writes.'},

/* ---------- 23–34 : Query operators ---------- */
{q:'Which operator finds documents where age is greater than 18?',
 o:['{age:{$gt:18}}','{age:{$gte:18}}','{age:{$lt:18}}','{age:{$eq:18}}'],a:0,
 e:'$gt is strictly greater than. $gte includes equality. Comparison operators include $gt, $gte, $lt, $lte, $ne, $eq and $in.'},

{q:'Which operator checks whether a value is one of several options?',
 o:['$any','$in','$oneOf','$among'],a:1,
 e:'$in matches any value in the array, for example {status:{$in:["open","pending"]}}. $nin does the opposite.'},

{q:'What does `{tags: "red"}` match when tags is an array?',
 o:['Only documents where tags is exactly ["red"]','Documents where the tags array contains the element "red"','Nothing, because arrays need $elemMatch','Only documents where tags is a string'],a:1,
 e:'MongoDB has array-aware equality: querying a scalar against an array field matches if any element equals it. $all requires all specified elements to be present.'},

{q:'What does $elemMatch do?',
 o:['Matches all array elements','Matches documents where at least one array element satisfies all the specified conditions','Removes matching elements','Counts array elements'],a:1,
 e:'$elemMatch is essential when multiple conditions must apply to the same array element, such as {grades:{$elemMatch:{score:{$gt:80}, subject:"math"}}}.'},

{q:'Which operator tests for the existence of a field, including null values?',
 o:['$exists','$has','$defined','$present'],a:0,
 e:'{field:{$exists:true}} matches documents where the field is present, even if it is null. {field:null} also matches documents where the field is missing, which surprises many people.'},

{q:'Which query matches documents where the field is missing or is null?',
 o:['{field:{$eq:null}}','{field:null}','{field:{$exists:false}}','Both {field:null} and {field:{$exists:false}}'],a:3,
 e:'{field:null} matches missing and null values. {field:{$exists:false}} matches only missing fields. Combine with $type:"null" if you need to distinguish them.'},

{q:'Which operator counts documents that match a condition within an aggregation stage?',
 o:['$match','$sum','$count','$expr'],a:2,
 e:'In aggregation, {$count:"total"} returns a document with a single field holding the count. Use $match before it to count matching documents.'},

{q:'What does the $regex operator do?',
 o:['Replaces text','Matches field values against a regular expression','Indexes text','Encrypts a field'],a:1,
 e:'{name:{$regex:"^Sam", $options:"i"}} performs a case-insensitive prefix match. Anchored prefixes can use an index; arbitrary regex patterns usually cannot.'},

{q:'What does a text index enable?',
 o:['Exact match queries only','$text search with word stemming, stop-word removal and relevance scoring','Regex queries without scanning','Compound sorting'],a:1,
 e:'A text index powers $text queries and the $meta:"textScore" ranking. Only one text index per collection, and it has significant storage and write cost.'},

{q:'Which operator matches a JavaScript expression against a field?',
 o:['$where','$expr','$js','$fn'],a:1,
 e:'$expr lets a query compare two fields in the same document, for example {$expr:{$gt:["$spent","$budget"]}}. $where with JavaScript is deprecated and slow.'},

{q:'What does `{age:{$not:{$gt:30}}}` match?',
 o:['Only documents where age is missing','Documents where age is not greater than 30, including documents missing the field','Only documents where age is exactly 30','Nothing, $not is invalid here'],a:1,
 e:'$not negates an operator expression and, unlike $ne, also matches documents where the field is absent. This distinction is a common source of bug reports.'},

{q:'Which operator selects documents whose array field has exactly N elements?',
 o:['$size','$count','$length','$len'],a:0,
 e:'{tags:{$size:3}} matches arrays with exactly three elements. $size does not accept ranges, so you need $expr with $size and comparison operators for that.'},

/* ---------- 35–46 : Indexes ---------- */
{q:'Which command creates an index on the email field?',
 o:['db.users.createIndex({email:1})','db.users.addIndex("email")','db.users.index("email")','db.users.ensureIndex("email", true)'],a:0,
 e:'createIndex takes a key pattern, where 1 is ascending and -1 is descending. The old ensureIndex name is deprecated and now aliases createIndex.'},

{q:'What is the difference between a compound index {a:1, b:1} and two single-field indexes?',
 o:['They are equivalent','A compound index supports queries and sorts on the prefix (a, then a+b); two single-field indexes are separate and may need an index intersection','Compound indexes cannot be unique','Single-field indexes are always faster'],a:1,
 e:'A compound index follows the ESR rule for design: Equality fields first, then Sort, then Range. It also covers a query on a alone because of the prefix rule.'},

{q:'Which index type enforces that no two documents share a value?',
 o:['Sparse index','Unique index','Partial index','Text index'],a:1,
 e:'A unique index rejects inserts or updates that would create a duplicate key. A compound unique index enforces uniqueness across the combination of fields.'},

{q:'What does a sparse index do?',
 o:['Compresses the index on disk','Indexes only documents that contain the indexed field, which saves space but cannot answer all queries','Indexes every field automatically','Skips duplicate values'],a:1,
 e:'Sparse indexes do not include documents where the field is missing. A partial index with a filter expression is often a better, more predictable choice.'},

{q:'What is a partial index?',
 o:['An index on part of a document\'s fields','An index built only on documents matching a filter expression','An index that is temporarily unavailable','An index built in the background'],a:1,
 e:'For example createIndex({status:1},{partialFilterExpression:{status:"open"}}) indexes only open documents, reducing size and write cost when the query matches the same filter.'},

{q:'What is a TTL index used for?',
 o:['Speeding up range queries','Automatically deleting documents after a time, based on a date field or an array of dates','Encrypting documents','Caching query results'],a:1,
 e:'A TTL index with expireAfterSeconds removes documents once the indexed date is older than the threshold. The background task runs about every 60 seconds, so expiry is not immediate.'},

{q:'What does a covered query mean?',
 o:['The query is wrapped in a transaction','The query is answered entirely from the index without fetching the documents','The query uses a hint','The query is cached'],a:1,
 e:'A covered query needs all queried and returned fields in the index and an _id:0 projection if _id is not in the index. It avoids document fetches and is much faster.'},

{q:'In explain output, which stage means the collection was scanned without an index?',
 o:['IXSCAN','COLLSCAN','FETCH','PROJECTION'],a:1,
 e:'COLLSCAN means a full collection scan. IXSCAN indicates an index was used, and FETCH shows documents still had to be retrieved for fields not in the index.'},

{q:'What does a multikey index mean?',
 o:['An index that stores multiple data types','An index on an array field, with one index entry per array element','An index with multiple columns','A unique index across replicas'],a:1,
 e:'Indexing an array field creates a multikey index with an entry per element. This enables efficient queries on array membership but increases index size and write cost.'},

{q:'Which index supports geospatial queries like $near and $geoWithin?',
 o:['Text index','Hashed index','2dsphere index','Wildcard index'],a:2,
 e:'A 2dsphere index supports GeoJSON geometries and spherical calculations. A 2d index handles legacy flat coordinate pairs and planar math.'},

{q:'What does a wildcard index { "field.$**" : 1 } provide?',
 o:['Faster writes','An index covering arbitrary, unknown subfields of a document, useful for unpredictable schemas','A unique constraint','A partial filter'],a:1,
 e:'Wildcard indexes make ad-hoc queries on arbitrary paths efficient but are large and not a substitute for thoughtful schema design. They are best for genuinely polymorphic data.'},

{q:'What does the `background: true` option historically do when building an index?',
 o:['Builds the index during off-peak hours','Allowed the build to proceed without blocking all database activity, though it is now the default behaviour','Encrypts the index','Builds the index on secondaries only'],a:1,
 e:'Background index builds are the default in modern MongoDB. The option is deprecated, and the storage engine builds indexes without blocking reads and writes on the collection.'},

/* ---------- 47–60 : Aggregation ---------- */
{q:'What does the $match stage do in an aggregation pipeline?',
 o:['Joins collections','Filters documents, like a find query, and should be placed early to reduce the working set','Sorts documents','Groups documents'],a:1,
 e:'$match can use indexes when it is the first stage. Placing it early shrinks the number of documents flowing through later, more expensive stages.'},

{q:'What does the $group stage do?',
 o:['Sorts documents','Groups documents by a key and computes accumulators such as $sum, $avg and $max','Filters documents','Joins collections'],a:1,
 e:'$group requires an _id expression for the grouping key (null for a single global group) and computes accumulator fields for each group.'},

{q:'Which accumulator counts documents in a $group stage?',
 o:['$count','$sum:1','$total','$size'],a:1,
 e:'There is no $count accumulator inside $group. Use {$sum:1} to count, or the $count pipeline stage for a whole pipeline count.'},

{q:'What does the $project stage do?',
 o:['Selects fields and computes new ones, similar to a SELECT list','Sorts results','Joins collections','Writes to another collection'],a:0,
 e:'$project can include, exclude, rename and compute fields. It cannot mix inclusion and exclusion (other than _id), and computed fields are useful for reshaping documents.'},

{q:'What does $lookup do?',
 o:['Looks up the query plan','Performs a left outer join with another collection in the same database','Searches text indexes','Creates an index'],a:1,
 e:'$lookup joins documents by a localField and foreignField (or a pipeline for complex conditions). It is powerful but can be expensive on large collections without indexes.'},

{q:'What does $unwind do?',
 o:['Joins arrays','Deconstructs an array field into one output document per element','Sorts arrays','Removes duplicate documents'],a:1,
 e:'$unwind is essential before grouping by an array element. Options preserveNullAndEmptyArrays keeps documents with missing or empty arrays.'},

{q:'What does the $facet stage allow?',
 o:['Parallel cursor execution','Running several sub-pipelines on the same input in one pass, such as computing multiple summaries','Faceted index creation','Sharding by a field'],a:1,
 e:'$facet is how you implement faceted search: one branch counts by category, another computes price ranges, all from the same input documents.'},

{q:'What does $out do at the end of an aggregation pipeline?',
 o:['Returns results to the client','Writes the pipeline results to a collection, replacing it atomically','Logs the results','Exports to a file'],a:1,
 e:'$out replaces the target collection. $merge is the safer alternative because it can insert, update and merge into an existing collection instead of replacing it.'},

{q:'What is the difference between $bucket and $bucketAuto?',
 o:['They are identical','$bucket uses explicit boundaries; $bucketAuto determines boundaries automatically to distribute documents across a number of buckets','$bucket is for text','$bucketAuto cannot sort'],a:1,
 e:'$bucket is best when business boundaries matter, such as price tiers. $bucketAuto is useful for exploratory analysis when you just want roughly even groups.'},

{q:'Why place a $match stage before $lookup?',
 o:['It is required by the aggregation engine','It reduces the number of documents the join has to process, which cuts memory and time','It disables the index','It changes the output shape'],a:1,
 e:'Aggregation stages are evaluated in order. Filtering first means $lookup runs on a smaller set. The 100 MB per-stage limit and allowDiskUse make this especially important.'},

{q:'What does $addFields (or $set) do?',
 o:['Adds a new collection','Adds or overwrites fields in the documents flowing through the pipeline','Adds an index','Adds a database'],a:0,
 e:'Despite the name, $addFields adds fields to each document in the pipeline, not to a collection. $set is an alias in modern versions.'},

{q:'Which stage would you use to sort documents after grouping?',
 o:['$order','$sort','$arrange','$rank'],a:1,
 e:'$sort takes a key pattern like {total:-1}. When it comes after $group, it sorts the aggregated results; when it comes first and matches an index prefix, it can use the index.'},

{q:'What does allowDiskUse: true enable?',
 o:['Writes results to disk instead of memory','Lets aggregation stages that exceed the 100 MB memory limit spill to disk','Enables a disk-based cache','Stores the pipeline'],a:1,
 e:'By default, each aggregation stage is limited to 100 MB of memory. allowDiskUse permits spilling for large sorts and groups at the cost of performance.'},

{q:'What does $graphLookup do?',
 o:['Creates a chart of query times','Performs recursive lookups across a collection, useful for traversing hierarchies and graphs','Plots indexes','Indexes hierarchical data'],a:1,
 e:'$graphLookup follows a startWith and connectFromField/connectToField pattern to traverse an arbitrary depth graph in a single pipeline stage.'},

/* ---------- 61–72 : Replica sets ---------- */
{q:'What is the minimum recommended number of members in a replica set?',
 o:['1','2','3','5'],a:2,
 e:'Three members are the practical minimum: a primary, a secondary and a third voter so that a majority can still be elected after one node fails. Two members cannot elect a new primary if one fails.'},

{q:'What is the role of the primary in a replica set?',
 o:['Only replicating data','Accepting all writes and, by default, reads unless read preference says otherwise','Monitoring the secondaries','Balancing connections'],a:1,
 e:'The primary accepts writes and records them in the oplog. Secondaries replicate the oplog and can serve reads based on the client\'s read preference.'},

{q:'What is the oplog?',
 o:['A user-visible audit log','A capped collection that records the ordered operations the primary applies, which secondaries replay to stay in sync','A backup file','An index'],a:1,
 e:'The oplog is the replication mechanism. Its size determines how far a secondary can fall behind before needing a full resync.'},

{q:'What does read preference "secondaryPreferred" do?',
 o:['Always reads from a secondary and fails if none exist','Reads from a secondary if one is available, otherwise from the primary','Never reads from a secondary','Reads only from the primary'],a:1,
 e:'It prefers secondaries for load distribution but falls back to the primary. That fallback is what distinguishes it from "secondary", which errors when no secondary is available.'},

{q:'What does read concern "majority" guarantee?',
 o:['The data has been written to at least one node','The data has been acknowledged by a majority of replica-set members and will not be rolled back under normal operation','The data is encrypted','The data is on disk'],a:1,
 e:'majority read concern returns data that a majority has acknowledged, protecting against reading data later rolled back by a primary stepdown. Pair it with majority write concern for strong consistency.'},

{q:'What happens during a replica-set election?',
 o:['All data is re-copied from a backup','Members with the most up-to-date oplog and highest priority vote to elect a new primary when the current one becomes unavailable','The cluster stops accepting reads','A shard is added'],a:1,
 e:'Elections are triggered by a primary failure or a stepdown. Most modern setups use the Raft-like protocol introduced in 3.2, which makes elections faster and more predictable.'},

{q:'What does arbiter-only membership mean?',
 o:['A member that stores data but does not vote','A member that votes in elections but stores no data, used to achieve an odd voter count at low cost','A hidden member','A delayed member'],a:1,
 e:'Arbiters are cheap tie-breakers, but they add no data redundancy. Modern guidance often favours an odd number of data-bearing members over relying on arbiters.'},

{q:'What is the purpose of a hidden replica-set member?',
 o:['Encrypts data','Stores a copy of the data but is invisible to clients and read preferences, often used for analytics or backups','Serves writes','Replaces an arbiter'],a:1,
 e:'Hidden members have priority 0 and are excluded from read preference targeting. They are typically used for reporting or dedicated backup workloads.'},

{q:'What does a delayed replica-set member do?',
 o:['Delays its network response','Applies the oplog with a configured delay, providing a window to recover from accidental data loss','Delays elections','Delays index builds'],a:1,
 e:'A delayed member replays operations N seconds behind the primary. If someone accidentally drops a collection, the delayed member may still hold the data.'},

{q:'What is "write concern w: majority" in a three-member replica set?',
 o:['Wait for the primary only','Wait for acknowledgement from the primary and one secondary, i.e. a majority of the members','Wait for all three members','Do not wait for any acknowledgement'],a:1,
 e:'A majority of three is two. The write is acknowledged once the primary and at least one secondary have applied it, so the data survives the loss of any single member.'},

{q:'What is a rollback in replica-set terms?',
 o:['A transaction rollback','Discarding writes the old primary accepted but that never replicated before a new primary was elected','Restoring from backup','Reverting a schema change'],a:1,
 e:'When a failed primary rejoins and discovers diverging writes, MongoDB saves them to a rollback file and reverts them. Writing with majority write concern prevents this from being visible to clients.'},

{q:'Which command reports the replica-set status, including member states and oplog lag?',
 o:['rs.status()','rs.show()','rs.info()','db.replication()'],a:0,
 e:'rs.status() lists each member with its state (PRIMARY, SECONDARY, ARBITER), health, optime and lag information, which is the first thing to check when replication looks slow.'},

/* ---------- 73–84 : Sharding ---------- */
{q:'What problem does sharding solve?',
 o:['Encrypting data','Horizontal scaling by distributing data across multiple shards when a single replica set cannot handle the data volume or throughput','Replacing backups','Compressing indexes'],a:1,
 e:'Sharding partitions a collection by shard key across shards, each of which is a replica set. It increases storage and write capacity beyond what one replica set can deliver.'},

{q:'Which components make up a sharded cluster?',
 o:['Shards, config servers and mongos routers','Only shards','A primary and secondaries','A load balancer and cache'],a:0,
 e:'mongos routes client requests, config servers store cluster metadata, and shards hold the data. Drivers talk to mongos as if it were a single mongod.'},

{q:'What is the shard key?',
 o:['A password for shards','One or more immutable indexed fields that determine how documents are distributed across shards','The primary key of the config server','A replication setting'],a:1,
 e:'The shard key determines which chunk a document belongs to. It is chosen at sharding time and is very difficult to change later, so it is a critical design decision.'},

{q:'Which sharding strategy hashes the shard key to distribute documents?',
 o:['Ranged sharding','Hashed sharding','Zone sharding','Compound sharding'],a:1,
 e:'Hashed sharding spreads writes evenly, which avoids hot shards. The trade-off is that range queries on the hashed field must scatter-gather across all shards.'},

{q:'What is a chunk in a sharded cluster?',
 o:['A backup file','A contiguous range of shard-key values that the balancer migrates between shards','A client connection','An index segment'],a:1,
 e:'Chunks are the unit of distribution and migration. The balancer moves chunks between shards to keep them balanced, which is why an evenly distributed shard key matters.'},

{q:'What is a "hot shard" problem usually caused by?',
 o:['Too many replicas','A monotonically increasing shard key such as an ObjectId or timestamp, which sends all new writes to the same shard','Hashed sharding','Too many indexes'],a:1,
 e:'If the shard key always increases, new documents always land on the last chunk, overloading one shard. Hashed keys or composite keys with a high-cardinality prefix avoid this.'},

{q:'What does zone sharding (tag-aware sharding) let you do?',
 o:['Restrict queries to a zone','Pin specific shard-key ranges to specific shards, for example to keep EU data in EU data centres','Encrypt a zone','Balance chunks automatically'],a:1,
 e:'Zones map ranges to shards. They are used for data residency, tiered storage (hot and cold shards) and isolating workloads, and the balancer respects them.'},

{q:'Why is a scatter-gather query expensive in a sharded cluster?',
 o:['It uses too much memory','It must be sent to every shard because the shard key is not in the query, and results are merged by mongos','It cannot use indexes','It requires a transaction'],a:1,
 e:'Targeted queries include the shard key so mongos can route to a single shard. Scatter-gather queries fan out to all shards, multiplying latency and resource use.'},

{q:'What does mongos do with a query that includes the shard key?',
 o:['Broadcasts it to all shards','Routes it to the specific shard or shards that own the relevant chunk range','Rejects it','Sends it to the config servers'],a:1,
 e:'This is the targeted query path, and it is the main reason to design queries around the shard key. The config servers are consulted for routing metadata, not for the data itself.'},

{q:'What happens if you try to shard a collection that already has a lot of data?',
 o:['Nothing changes','The collection is partitioned into chunks and distributed, which can take significant time and load on the cluster','The collection is dropped','Indexes are rebuilt'],a:1,
 e:'sh.shardCollection begins distributing existing data. It should be planned for a quiet window, because the initial split and migration can be heavy.'},

{q:'After sharding a collection, which queries can still use an index efficiently?',
 o:['None; all queries scan','Those that include the shard key in the query and match an index prefix','Only count queries','Only queries with $in'],a:1,
 e:'Ideally the shard key is a prefix of your most important indexes. Otherwise mongos may have to fan out to all shards even when a local index exists.'},

{q:'What are the best-practice properties of a good shard key?',
 o:['Low cardinality and monotonic increase','High cardinality, low frequency of duplicates and non-monotonic distribution so writes spread evenly','A single boolean field','A field that changes frequently'],a:1,
 e:'High cardinality gives the balancer room to split chunks. Low frequency avoids un-splittable jumbo chunks, and non-monotonic distribution avoids hot shards.'},

/* ---------- 85–92 : Transactions & consistency ---------- */
{q:'Since which version are multi-document transactions supported in replica sets?',
 o:['3.2','3.6','4.0','4.2'],a:2,
 e:'Multi-document ACID transactions arrived in 4.0 for replica sets, and 4.2 extended them to sharded clusters. They require a replica set or sharded cluster, not a standalone server.'},

{q:'What is the default lifetime limit for a multi-document transaction?',
 o:['10 seconds','60 seconds','5 minutes','There is no limit'],a:1,
 e:'By default transactionLifetimeLimitSeconds is 60 seconds. Long-running transactions hold locks and affect the oplog, so they should be short and focused.'},

{q:'What happens if a transaction fails in the middle?',
 o:['Committed changes remain','All writes in the transaction are aborted and none are applied','Only the last write is rolled back','The database restarts'],a:1,
 e:'Transactions are atomic across all writes they contain. The application should retry transient errors, which is why drivers expose withTransaction and retryable writes.'},

{q:'What are retryable writes?',
 o:['A client-side cache','A server feature where the driver retries a write once automatically on a transient network or failover error','A backup feature','An index option'],a:1,
 e:'Retryable writes are enabled by default in modern drivers and require a replica set. The operation uses a session and transaction number so the server can detect a duplicate retry.'},

{q:'What does causal consistency guarantee?',
 o:['All nodes see writes at the same time','A client session sees its own writes and a causally ordered sequence of operations across reads and writes','Reads are always fast','Writes are always on the primary'],a:1,
 e:'Causal consistency uses sessions and operation times so that a read after a write sees that write, even if the read is served by a secondary with a matching read concern.'},

{q:'Which read concern would you use to avoid reading data that a majority has not acknowledged?',
 o:['local','available','majority','linearizable'],a:2,
 e:'majority read concern returns only data acknowledged by a majority, protecting against rollbacks. linearizable is the strongest but only valid for reads from the primary.'},

{q:'What is a transaction in a sharded cluster limited by?',
 o:['The number of databases','The number of shards involved and the transaction lifetime, plus write concern requirements','The collection size','The index count'],a:1,
 e:'Sharded transactions work across shards but are more expensive. Keep them small, include the shard key where possible, and prefer redesigning the data model if you find you need them constantly.'},

{q:'What is the recommended approach when you seem to need a transaction for a high-volume write path?',
 o:['Always use a transaction','Reconsider the schema — embed related data in one document so a single atomic write is enough','Disable replication','Use a standalone server'],a:1,
 e:'Single-document writes are always atomic in MongoDB. Careful embedding often removes the need for multi-document transactions, which are more expensive and have lifetime limits.'},

/* ---------- 93–100 : Schema design, security & operations ---------- */
{q:'When should you embed documents rather than reference them?',
 o:['Never; always reference','When the data is accessed together, has a bounded size, and does not grow without limit','Only when documents are tiny','Only for time-series data'],a:1,
 e:'Embedding gives atomic single-document updates and fast reads. Unbounded arrays, such as an ever-growing list of log entries, cause document growth and eventually hit the 16 MB limit.'},

{q:'What is the extended reference pattern?',
 o:['Storing a copy of the full referenced document','Storing a small subset of frequently needed fields from a referenced document to avoid a $lookup on every read','A backup strategy','A sharding strategy'],a:1,
 e:'It duplicates only the fields readers need, trading a little duplication for much faster reads. Updates to the source must propagate the changed fields.'},

{q:'Which pattern suits time-series data with high write volume?',
 o:['One document per measurement in a single collection without indexes','Bucketing many measurements into a single document per time window','Storing everything in a single array','Using ObjectIds as shard keys only'],a:1,
 e:'The bucket pattern groups measurements by device and time window, reducing document count and index size. Native time-series collections in modern versions formalise this approach.'},

{q:'What does the computed pattern store?',
 o:['A copy of the query','Pre-computed values such as totals or counts, refreshed when the underlying data changes, to avoid expensive recalculation on every read','Encrypted fields','Index statistics'],a:1,
 e:'It is the MongoDB equivalent of a materialised view. The trade-off is write complexity: every update must also maintain the computed field.'},

{q:'Which authentication mechanism is most commonly used for application connections to Atlas and self-managed clusters?',
 o:['LDAP only','SCRAM-SHA-256 username and password, and X.509 client certificates','Kerberos only','No authentication'],a:1,
 e:'SCRAM is the standard password mechanism. X.509 client certificates and cloud provider IAM are common in enterprise deployments, with LDAP and Kerberos for centralised directory integration.'},

{q:'What is role-based access control in MongoDB?',
 o:['A table of users','Built-in and custom roles that grant specific privileges on specific databases and collections, assigned to users','A network firewall','An encryption key store'],a:1,
 e:'Least privilege is enforced with roles such as read, readWrite, dbAdmin and clusterMonitor, or custom roles that list explicit resources and actions.'},

{q:'What does encryption at rest protect against?',
 o:['Slow queries','Someone with access to the underlying storage files reading data directly','Network interception','Weak passwords'],a:1,
 e:'Encryption at rest (WiredTiger encryption or cloud-provider volume encryption) protects the data files. In transit, use TLS. Field-level or queryable encryption covers sensitive fields even from administrators.'},

{q:'Which tool produces a binary dump that mongorestore can consume?',
 o:['mongoexport','mongodump','mongofiles','mongostat'],a:1,
 e:'mongodump writes BSON files that preserve types and indexes (in the metadata). mongoexport writes JSON or CSV and is meant for data interchange, not backups.'},

{q:'What does mongostat show?',
 o:['The contents of a collection','A live snapshot of operations per second, connections, memory and other server metrics','Index usage','Replica-set status'],a:1,
 e:'mongostat is a quick per-second health check: opcounters, page faults, connections and the dirty cache percentage. Combine it with serverStatus and the profiler for deeper analysis.'},

{q:'What is a change stream?',
 o:['A replication log file','A server feature that lets applications subscribe to real-time changes on a collection, database or cluster, with resume tokens','A backup stream','A sharding migration'],a:1,
 e:'Change streams use the oplog and are available on replica sets and sharded clusters. They provide resumability via resume tokens, which makes them robust event sources.'}

];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>MongoDB Mock Test — Set 1 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
