<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySQL Mock Test — 100 New MCQs (Set 3)</title>
<style>
  :root{
    --brand:#00758f;--brand-dark:#005a6e;--accent:#f29111;
    --ok:#10b981;--bad:#ef4444;--warn:#f59e0b;
    --bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 16px 60px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,117,143,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.06rem;font-weight:600;margin:0 0 18px}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155}
  .option .otext{flex:1;font-size:.95rem}
  .option .otext code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .option.selected{border-color:var(--brand);background:#e0f2f7}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{transform:none}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .explain-body code{background:#dcfce7;padding:1px 6px;border-radius:5px;font-size:.88em}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;transition:.14s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  .hint{margin-top:12px;font-size:.76rem;color:var(--muted)}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.96rem}
  .revline{font-size:.87rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:110px}
  .revexp{margin-top:10px;font-size:.86rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .revexp code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐬 MySQL Mock Test <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark · <b>S</b> show answer</div>
    </div>
    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — 100 NEW MySQL MCQs (Set 3)
   ============================================================ */
const QS = [
{q:"What does EXPLAIN FORMAT=JSON produce?",
 o:["A JSON representation of the execution plan with cost estimates","A JSON copy of the table","A JSON schema","A JSON backup"],
 a:0,
 e:"EXPLAIN FORMAT=JSON outputs the query plan as JSON, including cost estimates, access paths and optimizer details. TRADITIONAL is the default; TREE format is available from MySQL 8.0.16+."},

{q:"What is a histogram in MySQL 8.0?",
 o:["A chart of query performance","Statistics about data distribution in a column that help the optimizer estimate selectivity","A backup type","A replication topology"],
 a:1,
 e:"Histograms are created with ANALYZE TABLE ... UPDATE HISTOGRAM ON col. They store bucket-based distributions and are especially useful for columns with skewed data that are not well served by index statistics."},

{q:"What is the default number of histogram buckets in MySQL 8.0?",
 o:["10","100","254","1000"],
 a:2,
 e:"The default is 254 buckets, adjustable with the WITH N BUCKETS clause. More buckets give finer granularity but require more statistics to maintain."},

{q:"What does SELECT ... FOR UPDATE SKIP LOCKED do?",
 o:["Skips rows that are already locked, returning only unlockable rows","Skips the first N rows","Skips validation","Skips indexes"],
 a:0,
 e:"SKIP LOCKED is designed for queue-style workloads: multiple workers can claim different rows without blocking each other. NOWAIT instead raises an error immediately if a lock is held."},

{q:"What does NOWAIT do in a SELECT ... FOR UPDATE statement?",
 o:["Waits indefinitely","Returns immediately with an error if the row is locked","Skips the row silently","Commits the transaction"],
 a:1,
 e:"NOWAIT raises ER_LOCK_NOWAIT (3572) when a lock cannot be acquired immediately rather than waiting. Use it when the application prefers to fail fast and retry rather than block."},

{q:"What is a functional index in MySQL 8.0.13+?",
 o:["An index on an expression, e.g. INDEX ((col1 + col2))","An index that only works for stored functions","An index on the primary key","A full-text index"],
 a:0,
 e:"Functional (expression) indexes let you index the result of an expression. They are especially useful for JSON columns, e.g. INDEX idx ((CAST(doc->'$.name' AS CHAR(50))))."},

{q:"What is the default character set collation in MySQL 8.0?",
 o:["latin1_swedish_ci","utf8mb4_0900_ai_ci","utf8mb4_general_ci","utf8_general_ci"],
 a:1,
 e:"MySQL 8.0 defaults to utf8mb4 with utf8mb4_0900_ai_ci, which is based on Unicode 9.0 and is accent-insensitive and case-insensitive."},

{q:"What does the ai_ci suffix mean in a collation name?",
 o:["Accent-insensitive, case-insensitive","Auto-increment, cascade-index","Array-index, collation-index","ASCII-insensitive, character-insensitive"],
 a:0,
 e:"ai = accent-insensitive (é and e compare equal), ci = case-insensitive (A and a compare equal). Other variants include as_cs (accent-sensitive, case-sensitive), ai_cs and as_ci."},

{q:"Which of these collations is case-sensitive?",
 o:["utf8mb4_0900_ai_ci","utf8mb4_general_ci","utf8mb4_0900_as_cs","utf8mb4_unicode_ci"],
 a:2,
 e:"The _cs suffix indicates case-sensitive; _ci indicates case-insensitive. Similarly, _as vs _ai controls accent sensitivity."},

{q:"What does the BINARY operator do?",
 o:["Converts to BLOB","Forces a byte-wise comparison of strings","Creates a binary index","Encodes the string as base64"],
 a:1,
 e:"BINARY str casts the string to a binary string, so 'a' = BINARY 'A' returns 0 (false). This bypasses the collation's case-insensitive comparison."},

{q:"What does SHOW WARNINGS display?",
 o:["Only errors","Warnings and notes generated by the previous statement","All past errors","Server startup warnings only"],
 a:1,
 e:"SHOW WARNINGS shows warnings, errors and notes from the most recent statement that produced them. Use SHOW COUNT(*) WARNINGS for just the count."},

{q:"What does LAST_INSERT_ID() return?",
 o:["The ID of the last row inserted by any session","The AUTO_INCREMENT value generated by the last INSERT in the current session","The last updated row's ID","The row count of the last statement"],
 a:1,
 e:"LAST_INSERT_ID() is session-scoped. It returns the auto-generated value from the most recent INSERT into an AUTO_INCREMENT column in this connection, and it is not affected by other sessions."},

{q:"What does ROW_COUNT() return?",
 o:["The number of rows in the table","The number of rows affected by the previous DML statement","The number of rows returned by the previous SELECT","The total row count of all tables"],
 a:1,
 e:"ROW_COUNT() returns rows changed by the last INSERT, UPDATE or DELETE (or rows returned by SELECT ... INTO). It resets to -1 for statements that do not affect rows."},

{q:"What does FOUND_ROWS() return in MySQL?",
 o:["The number of rows matched by the last SELECT, ignoring LIMIT","The number of rows in the last table","The total rows found by a full scan","The rows found by a JOIN"],
 a:0,
 e:"FOUND_ROWS() works with the deprecated SQL_CALC_FOUND_ROWS. It returns how many rows the SELECT would have returned without the LIMIT. It is deprecated in 8.0 in favour of separate COUNT queries."},

{q:"What is SQL_CALC_FOUND_ROWS?",
 o:["A hint that forces a full scan","A modifier that makes a SELECT compute the total row count ignoring LIMIT","A function that returns row count","A parameter for stored procedures"],
 a:1,
 e:"SQL_CALC_FOUND_ROWS is deprecated in MySQL 8.0.20+. It was used to get pagination totals, but it is usually slower than running a separate COUNT(*) query."},

{q:"What does RESET BINARY LOGS (formerly RESET MASTER) do?",
 o:["Clears the binary log files and resets the binlog position","Clears the slow query log","Resets the master password","Resets replication on the replica"],
 a:0,
 e:"RESET BINARY LOGS deletes all binary log files and resets the binlog index. Use with extreme care on a replication source."},

{q:"What does RESET REPLICA (formerly RESET SLAVE) do?",
 o:["Resets the replica's replication metadata, allowing you to point it at a new source","Restarts the replica server","Deletes all replicated data","Promotes the replica to primary"],
 a:0,
 e:"RESET REPLICA ALL removes all replication metadata and configuration, while RESET REPLICA keeps the connection parameters. The old SLAVE terminology is deprecated in favour of REPLICA/SOURCE."},

{q:"What is the difference between the mysql and mysqladmin clients?",
 o:["They are identical","mysql is an interactive SQL client; mysqladmin performs administrative commands like status, ping and shutdown","mysqladmin executes SQL; mysql is for backups","mysql is a GUI tool"],
 a:1,
 e:"mysql is the command-line SQL client. mysqladmin is a utility for administrative operations: ping, status, variables, processlist, shutdown and create/drop database."},

{q:"What does mysqlcheck do?",
 o:["Checks the syntax of SQL files","Checks, repairs, optimizes and analyzes tables","Creates users","Backs up tables"],
 a:1,
 e:"mysqlcheck wraps CHECK TABLE, REPAIR TABLE, ANALYZE TABLE and OPTIMIZE TABLE. It is mostly useful for MyISAM; InnoDB rarely needs repair."},

{q:"What is the difference between mysqldump and mysqlpump?",
 o:["mysqlpump is a parallel, multi-threaded replacement for mysqldump with more features, but was deprecated in 8.0.34","mysqldump is newer","They are identical","mysqlpump is for InnoDB only"],
 a:0,
 e:"mysqlpump offered parallel dumps and compression. It was deprecated in MySQL 8.0.34 in favour of MySQL Shell's dump utilities (util.dumpInstance())."},

{q:"What is the difference between logical and physical backups?",
 o:["Logical backs up SQL statements; physical copies data files directly","Logical is faster","Physical works only with MyISAM","They are identical"],
 a:0,
 e:"Logical backups (mysqldump) produce SQL or delimited files and are portable but slow to restore. Physical backups (XtraBackup, clone plugin) copy data files directly, restore quickly, but are tied to the engine and version."},

{q:"What is innodb_buffer_pool_instances used for?",
 o:["Splitting the buffer pool into multiple instances to reduce contention on large memory systems","Creating multiple buffer pools for different databases","Setting the number of backup buffers","Choosing the storage engine"],
 a:0,
 e:"When innodb_buffer_pool_size is large, splitting it into multiple instances (each with its own mutex) reduces contention. Each instance should be at least 1 GB; it only applies with a large buffer pool."},

{q:"What is innodb_io_capacity used for?",
 o:["Telling InnoDB the approximate I/O operations per second the storage can handle","Setting the disk quota","Configuring network bandwidth","Setting the redo log size"],
 a:0,
 e:"innodb_io_capacity (default 200) informs background tasks like flushing and purge how much I/O is available. On fast SSDs, set it higher (e.g. 2000+) for better throughput."},

{q:"What does innodb_flush_method=O_DIRECT do?",
 o:["Bypasses the OS page cache for data file I/O, avoiding double caching","Forces all writes to be synchronous","Disables the redo log","Uses compression"],
 a:0,
 e:"O_DIRECT avoids double buffering (InnoDB buffer pool + OS page cache) and is often the best choice on Linux. Alternatives include fsync (default) and O_DSYNC."},

{q:"What was the query cache, and when was it removed?",
 o:["A cache of query results, removed in MySQL 8.0","A cache of indexes, removed in 5.7","A cache of users, removed in 8.0","Still present in MySQL 8.0"],
 a:0,
 e:"The query cache was removed in MySQL 8.0 because it scaled poorly under concurrency and was often disabled in production. Use application-level caching or ProxySQL's query cache instead."},

{q:"What is the thread cache in MySQL?",
 o:["A cache of result sets","A pool of OS threads reused for new connections to avoid thread creation overhead","A cache of prepared statements","A cache of user passwords"],
 a:1,
 e:"thread_cache_size controls how many threads are kept for reuse. With high connection churn, a larger cache reduces thread creation overhead."},

{q:"What does max_allowed_packet control?",
 o:["The maximum size of a single network packet or query","The maximum number of connections","The maximum row size","The maximum index size"],
 a:0,
 e:"max_allowed_packet limits the size of a single communication packet. Large BLOB inserts or long queries can exceed it. The default is 64 MB in MySQL 8.0; some clients default to 16 MB."},

{q:"What does wait_timeout control?",
 o:["How long an idle connection is kept open before the server closes it","The time a query can run","The replication timeout","The lock wait timeout"],
 a:0,
 e:"wait_timeout (default 28800 seconds = 8 hours) closes idle connections. interactive_timeout applies to interactive clients. Setting it too low can break connection pools that do not validate connections."},

{q:"What does SHOW ENGINE INNODB MUTEX show?",
 o:["The InnoDB mutexes and their contention statistics","The list of InnoDB tables","The replication status","The error log"],
 a:0,
 e:"It shows internal InnoDB mutexes with counts and spin waits. It is a diagnostic for advanced concurrency issues and can be expensive to run."},

{q:"What does information_schema.INNODB_TRX contain?",
 o:["Currently active InnoDB transactions, their start times, isolation levels and the SQL they are running","The list of InnoDB tables","The deadlock history","The list of indexes"],
 a:0,
 e:"INNODB_TRX is the go-to view for long-running transactions. Join it with INNODB_LOCKS and INNODB_LOCK_WAITS (or the sys.innodb_lock_waits view) to identify blocking chains."},

{q:"What does the sys.innodb_lock_waits view show?",
 o:["A human-readable join of INNODB_TRX and lock waits, identifying blockers and waiters","The list of tables with locks","The lock wait timeout setting","The replication lock status"],
 a:0,
 e:"sys.innodb_lock_waits combines information_schema.innodb_trx and innodb_lock_waits to show who is blocking whom, including the SQL of both parties. It is the fastest way to diagnose lock contention."},

{q:"What is innodb_lock_wait_timeout?",
 o:["How long a transaction waits for a row lock before giving up with an error","The maximum lock duration","The deadlock detection interval","The lock table size"],
 a:0,
 e:"Default is 50 seconds. A transaction that exceeds it receives ER_LOCK_WAIT_TIMEOUT (1205). Some applications set a shorter timeout and retry rather than waiting the full time."},

{q:"What happens if innodb_deadlock_detect=OFF?",
 o:["Deadlocks are not detected automatically; transactions wait until innodb_lock_wait_timeout","Deadlocks are impossible","The server refuses writes","Deadlocks are detected more aggressively"],
 a:0,
 e:"Disabling deadlock detection can improve throughput when deadlocks are rare, because detection has a cost. But when deadlocks occur, they surface as lock wait timeouts instead of immediate rollbacks."},

{q:"What is the difference between READ COMMITTED and REPEATABLE READ regarding gap locks?",
 o:["READ COMMITTED does not use gap locks; REPEATABLE READ does (for most statements)","REPEATABLE READ does not use gap locks","Both avoid gap locks","Neither uses gap locks"],
 a:0,
 e:"Under READ COMMITTED, InnoDB disables gap locking except for foreign key and duplicate-key checks, reducing deadlocks. Under REPEATABLE READ, gap and next-key locks help prevent phantom reads."},

{q:"What is an XA transaction in MySQL?",
 o:["A distributed transaction that spans multiple resources, coordinated by a two-phase commit protocol","A transaction with a specific isolation level","A read-only transaction","A transaction that cannot be rolled back"],
 a:0,
 e:"XA supports distributed transactions across multiple MySQL instances or other resource managers. Statements include XA START, XA END, XA PREPARE, XA COMMIT, XA ROLLBACK and XA RECOVER."},

{q:"What does the two-phase commit in XA guarantee?",
 o:["All resource managers either commit or roll back together","The transaction runs in two parallel threads","Data is written twice","The transaction completes in two seconds"],
 a:0,
 e:"Phase 1 (prepare) has each resource manager vote; phase 2 (commit/rollback) tells them the outcome. If any participant fails to prepare, the coordinator rolls back the whole transaction."},

{q:"What is binlog_group_commit_sync_delay used for?",
 o:["Delaying the binlog sync to allow more transactions to be flushed together, reducing fsync cost","Slowing down replication","Delaying binlog purge","Setting the binlog rotation time"],
 a:0,
 e:"It groups multiple commits into a single fsync, improving throughput under high concurrency at the cost of added commit latency. Related: binlog_group_commit_sync_no_delay_count."},

{q:"What does performance_schema.setup_consumers control?",
 o:["Which categories of instrumentation are collected and stored","Which users can see performance_schema","Which tables are instrumented","Which indexes are instrumented"],
 a:0,
 e:"Consumers such as events_statements_history, events_waits_current and events_stages_history turn instrumentation on or off. Setting them OFF reduces overhead. setup_actors controls which connections are instrumented."},

{q:"What is the difference between THREAD_ID and PROCESSLIST_ID in performance_schema?",
 o:["THREAD_ID is the internal performance_schema thread identifier; PROCESSLIST_ID matches the SHOW PROCESSLIST Id","They are identical","THREAD_ID is the OS thread ID","PROCESSLIST_ID is deprecated"],
 a:0,
 e:"THREAD_ID is a performance_schema-internal identifier, while PROCESSLIST_ID is what SHOW PROCESSLIST and information_schema.PROCESSLIST expose. The performance_schema.threads table maps between them."},

{q:"What is a DEFINER in a stored routine or view?",
 o:["The MySQL account whose privileges are used when the routine or view runs","The account that created the table","The account that can drop the routine","A synonym for the table owner"],
 a:0,
 e:"The DEFINER clause (default CURRENT_USER) controls which account's privileges apply. A DEFINER pointing to a dropped user causes errors when the object executes. Use SQL SECURITY INVOKER to use the caller's privileges instead."},

{q:"What is the difference between SQL SECURITY DEFINER and SQL SECURITY INVOKER?",
 o:["DEFINER runs with the creator's privileges; INVOKER runs with the caller's privileges","They are identical","INVOKER runs with root privileges","DEFINER disables the object"],
 a:0,
 e:"DEFINER (the default) is convenient but can create privilege escalation or orphaned-definer problems. INVOKER is safer for multi-tenant or restricted scenarios."},

{q:"What does the event scheduler do?",
 o:["Runs scheduled SQL events (jobs) at defined intervals","Schedules replication","Schedules backups","Schedules index creation"],
 a:0,
 e:"CREATE EVENT defines a task that runs on a schedule (e.g. every hour). The event_scheduler system variable must be ON for events to fire. Events run as their DEFINER."},

{q:"How do you enable the event scheduler?",
 o:["SET GLOBAL event_scheduler = ON;","START EVENTS;","ENABLE SCHEDULER;","SET GLOBAL scheduler = 1;"],
 a:0,
 e:"The event scheduler is disabled by default. Set it in my.cnf (event_scheduler=ON) for persistence, or at runtime with SET GLOBAL for a temporary change."},

{q:"What is the difference between a stored function and a stored procedure?",
 o:["A function returns a single value and can be used in SQL expressions; a procedure can return multiple result sets and is called with CALL","A function cannot have parameters","A procedure cannot have parameters","They are identical"],
 a:0,
 e:"Functions must return a value and are used in SELECT/WHERE; procedures are invoked with CALL and may return multiple result sets, use OUT/INOUT parameters, and manage transactions."},

{q:"What does DETERMINISTIC mean in a stored function declaration?",
 o:["The function always returns the same result for the same inputs","The function is fast","The function always succeeds","The function runs in parallel"],
 a:0,
 e:"DETERMINISTIC tells the optimizer the function's result depends only on its arguments. This is required for replication safety and allows optimizations. A function using RAND() or NOW() must be declared NOT DETERMINISTIC."},

{q:"What does READS SQL DATA mean for a stored routine?",
 o:["The routine only reads data and does not modify it","The routine reads and writes data","The routine does not access the database","The routine is read-only at the table level"],
 a:0,
 e:"The characteristics are CONTAINS SQL (default), NO SQL, READS SQL DATA and MODIFIES SQL DATA. These are advisory and help the optimizer and replication choose the right behaviour."},

{q:"What does SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'error' do?",
 o:["Raises a custom error with the given message","Suppresses the error","Converts the error to a warning","Logs the error without raising it"],
 a:0,
 e:"SIGNAL raises an error from a stored program. SQLSTATE '45000' is the generic user-defined exception. RESIGNAL re-raises an error from inside a handler, optionally modifying it."},

{q:"What is DECLARE ... HANDLER FOR SQLSTATE '23000' used for?",
 o:["Catching duplicate-key errors (and other integrity violations) inside a stored program","Declaring a variable","Creating a cursor","Setting the isolation level"],
 a:0,
 e:"Handlers catch conditions and take an action: CONTINUE, EXIT or UNDO. SQLSTATE '23000' covers integrity constraint violations, including duplicate keys and foreign key errors."},

{q:"What is the difference between a CONTINUE and an EXIT handler?",
 o:["CONTINUE resumes execution after the failing statement; EXIT terminates the enclosing BEGIN...END block","CONTINUE exits the loop; EXIT continues","They are identical","EXIT can only be used with cursors"],
 a:0,

{q:"What is the correct order of declarations in a stored procedure's BEGIN...END block?",
 o:["Variables, then conditions, then cursors, then handlers","Handlers, then cursors, then variables","Cursors, then variables, then handlers","Any order"],

{q:"What does DECLARE ... CURSOR FOR SELECT ... do?",

{q:"What is the difference between a local variable and a user variable?",
 o:["Local variables are declared with DECLARE inside a routine and scoped to it; user variables (@var) are session-scoped and persist across statements","They are identical","User variables are only for SELECT","Local variables can be used outside the routine"],

{q:"What is the difference between @var and @@var?",
 o:["@var is a user variable; @@var is a system variable (global or session)","They are identical","@@var is a user variable","@var is a system variable"],
 a:0,

{q:"What does SELECT ... INTO @var do?",
 o:["Stores the result of the SELECT into a user variable","Creates a table","Inserts into a table","Creates an index"],

{q:"What does INSERT INTO t SET a=1, b=2 do?",
 o:["Inserts a row using column=value pairs instead of a VALUES list","Updates existing rows","Creates columns","Sets session variables"],

{q:"What is the DEFAULT keyword in INSERT?",
 o:["Inserts the column's default value explicitly","Inserts NULL","Inserts the previous row's value","Inserts the next AUTO_INCREMENT value"],

{q:"What is the difference between NULL and DEFAULT?",
 o:["NULL is an unknown value; DEFAULT is the column's declared default value when none is supplied","They are identical","DEFAULT is only for integers","NULL is a keyword for defaults"],
 a:0,

{q:"What does the COALESCE(col, 'default') pattern accomplish?",

{q:"What is the difference between WHERE col IS NULL and WHERE col = NULL?",

{q:"What does CREATE TABLE t AS SELECT ... do?",
 o:["Creates a new table with the columns and data from the SELECT, without indexes or constraints","Creates an empty table with indexes","Creates a view","Creates a temporary table"],

{q:"What does CREATE TABLE t LIKE other do?",

{q:"What is the difference between TRUNCATE TABLE and DROP TABLE?",

{q:"What does the CASCADE option in DROP TABLE do in MySQL?",
 o:["It is parsed but ignored; MySQL does not cascade dependent objects","Drops the database","Cascades the delete to rows","Nothing; it is a syntax error"],
 a:0,

{q:"What is SET FOREIGN_KEY_CHECKS=0 used for?",

{q:"What does sql_require_primary_key do in MySQL 8.0?",

{q:"What is the difference between a PRIMARY KEY and a UNIQUE index when it comes to NULLs?",

{q:"What does ON UPDATE CURRENT_TIMESTAMP do?",

{q:"What is the difference between DATETIME and TIMESTAMP?",

{q:"What is the difference between SRID 0 and SRID 4326?",

{q:"What is the difference between CHECK TABLE and ANALYZE TABLE?",

{q:"What is a proxy user in MySQL?",

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').innerHTML = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.innerHTML = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').innerHTML =
      '✅ Correct answer: <b>' + LETTERS[q.a] + '</b> — ' + q.o[q.a];
    $('explainText').innerHTML = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }
    if(state.ans[i] === q.a && state.ans[i] !== null){
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }
    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}
function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
