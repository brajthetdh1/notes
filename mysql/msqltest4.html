<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySQL Mock Test — 100 Query & Statement MCQs (Set 4)</title>
<style>
  :root{
    --brand:#00758f;--brand-dark:#005a6e;--accent:#f29111;
    --ok:#10b981;--bad:#ef4444;--warn:#f59e0b;
    --bg:#eef2f7;--card:#ffffff;--line:#d8e0ea;--text:#1c2733;--muted:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px}
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 16px 60px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:74px}
  @media (max-width:900px){aside.palette{position:static}}
  .palette-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,117,143,.3)}
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.06rem;font-weight:600;margin:0 0 18px}
  .options{display:grid;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:.14s}
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155}
  .option .otext{flex:1;font-size:.95rem}
  .option .otext code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .option.selected{border-color:var(--brand);background:#e0f2f7}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{transform:none}
  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .explain-body code{background:#dcfce7;padding:1px 6px;border-radius:5px;font-size:.88em}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{border:1.5px solid transparent;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;transition:.14s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  .hint{margin-top:12px;font-size:.76rem;color:var(--muted)}
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.96rem}
  .revline{font-size:.87rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:110px}
  .revexp{margin-top:10px;font-size:.86rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .revexp code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐬 MySQL Mock Test <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark · <b>S</b> show answer</div>
    </div>
    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — 100 NEW MySQL Query & Statement MCQs (Set 4)
   ============================================================ */
const QS = [
/* ---------- 1–10 : Expressions & operators ---------- */
{q:"What does <code>SELECT 5 BETWEEN 1 AND 10</code> return?",
 o:["0","1","NULL","10"],a:1,
 e:"BETWEEN is inclusive on both ends, so 5 BETWEEN 1 AND 10 is TRUE. The expression is equivalent to 5 >= 1 AND 5 <= 10. The result is returned as the integer 1 (TRUE)."},

{q:"What does <code>SELECT NULL = NULL</code> return?",
 o:["1","0","NULL","An error"],a:2,
 e:"NULL represents an unknown value, and any comparison with NULL (using =, <>, <, >) yields NULL — not TRUE or FALSE. Use IS NULL or the NULL-safe equal operator <=> to test for NULL."},

{q:"What does <code>SELECT NULL &lt;=&gt; NULL</code> return?",
 o:["1","0","NULL","An error"],a:0,
 e:"The <=> operator is the NULL-safe equal. NULL <=> NULL is TRUE (1), and NULL <=> 1 is FALSE (0). Unlike =, it always returns 1 or 0, never NULL. It is useful for comparing nullable columns."},

{q:"What does <code>SELECT '5' + 3</code> return?",
 o:["'53'","8","'5 + 3'","An error"],a:1,
 e:"The + operator is arithmetic, so '5' is implicitly converted to the number 5, giving 8. To concatenate, use CONCAT('5', 3). If the string cannot be converted to a number, it becomes 0 with a warning."},

{q:"What does <code>SELECT 'abc' = 0</code> return?",
 o:["0","1","NULL","An error"],a:1,
 e:"In a comparison, 'abc' is converted to a number, which fails and becomes 0, so 0 = 0 is TRUE. This is a classic bug when comparing a VARCHAR column to a number — always compare like types."},

{q:"What does <code>SELECT 10 % 3</code> return?",
 o:["3","1","3.33","0"],a:1,
 e:"The % operator (and MOD()) returns the remainder of the division: 10 mod 3 = 1. It works on integers and, for non-integers, on their integer parts."},

{q:"What does <code>SELECT 10 DIV 3</code> return?",
 o:["3.33","3","1","4"],a:1,
 e:"DIV performs integer division: 10 DIV 3 = 3. Use / for floating-point division, which returns 3.3333. DIV is equivalent to FLOOR(10 / 3) for positive numbers."},

{q:"What does <code>SELECT 5 / 0</code> return in default MySQL mode?",
 o:["0","NULL with a warning","An error","Infinity"],a:1,
 e:"Division by zero in a SELECT returns NULL and raises a warning ('Division by 0'). In an INSERT or UPDATE under strict mode with ERROR_FOR_DIVISION_BY_ZERO, it can raise an error instead."},

{q:"What does <code>SELECT CONCAT('a', NULL, 'b')</code> return?",
 o:["'ab'","'aNULLb'","NULL","An error"],a:2,
 e:"CONCAT returns NULL if any argument is NULL. This is a frequent bug with optional columns. Use CONCAT_WS() (which skips NULLs) or COALESCE(col, '') to handle nullable values."},

{q:"What does <code>SELECT CONCAT_WS('-', 'a', NULL, 'b')</code> return?",
 o:["'a--b'","'a-b'","NULL","'a-NULL-b'"],a:1,
 e:"CONCAT_WS (with separator) skips NULL arguments entirely rather than returning NULL. Here the NULL is skipped, producing 'a-b'. The separator is only inserted between non-NULL arguments."},

/* ---------- 11–20 : String functions & pattern matching ---------- */
{q:"What does <code>SELECT 'Hello' LIKE 'H%'</code> return?",
 o:["0","1","NULL","'Hello'"],a:1,
 e:"The % wildcard matches any sequence of characters, so 'Hello' starts with 'H' and matches. LIKE returns 1 (TRUE) or 0 (FALSE). Use _ to match exactly one character."},

{q:"Under MySQL's default collation (utf8mb4_0900_ai_ci), what does <code>SELECT 'Hello' LIKE 'h%'</code> return?",
 o:["0","1","NULL","An error"],a:1,
 e:"The default collation is case-insensitive (ci), so 'H' and 'h' compare equal and the pattern matches. Use a binary collation (utf8mb4_0900_as_cs) or BINARY if you need case-sensitive matching."},

{q:"What does <code>SELECT 'Hello' LIKE BINARY 'h%'</code> return?",
 o:["0","1","NULL","'h'"],a:0,
 e:"The BINARY operator forces byte-wise comparison, making the match case-sensitive. 'H' != 'h', so the result is 0. Use this when you need case-sensitive pattern matching without changing the column's collation."},

{q:"What does <code>SELECT REPLACE('abcabc', 'a', 'x')</code> return?",
 o:["'xbcabc'","'xbcxbc'","'abcxbc'","'x'"],a:1,
 e:"REPLACE replaces every occurrence of the substring, not just the first. So both 'a' characters become 'x', giving 'xbcxbc'. There is no flag to limit the number of replacements."},

{q:"What does <code>SELECT SUBSTRING('MySQL', 2, 3)</code> return?",
 o:["'ySQ'","'MyS'","'SQL'","'yS'"],a:0,
 e:"SUBSTRING(str, pos, len) is 1-based: position 2 is 'y', and 3 characters are taken, giving 'ySQ'. SUBSTRING('MySQL', 3) with no length returns 'SQL' (from position 3 to the end)."},

{q:"In utf8mb4, what does <code>SELECT LENGTH('café')</code> return?",
 o:["4","5","3","6"],a:1,
 e:"LENGTH returns the number of bytes. In utf8mb4, 'c', 'a', 'f' are 1 byte each and 'é' is 2 bytes, totalling 5. Use CHAR_LENGTH to count characters (which would return 4)."},

{q:"In utf8mb4, what does <code>SELECT CHAR_LENGTH('café')</code> return?",
 o:["4","5","3","6"],a:0,
 e:"CHAR_LENGTH counts characters rather than bytes, so 'café' is 4 characters. This is the correct function to use for character-based limits and validation."},

{q:"What does <code>SELECT LPAD('7', 3, '0')</code> return?",
 o:["'700'","'007'","'7  '","'0 7'"],a:1,
 e:"LPAD left-pads the string to a total length of 3 using '0', giving '007'. RPAD pads on the right. If the input is already longer than the target length, both truncate it."},

{q:"What does <code>SELECT TRIM('  hi  ')</code> return?",
 o:["'  hi  '","'hi'","'hi  '","'  hi'"],a:1,
 e:"TRIM() without arguments removes both leading and trailing spaces. Use TRIM(LEADING ...) or TRIM(TRAILING ...) to remove from only one side, and specify a character to trim something other than space."},

{q:"What does <code>SELECT LOCATE('SQL', 'MySQL')</code> return?",
 o:["0","2","3","4"],a:2,
 e:"LOCATE(substr, str) returns the 1-based position of substr in str. 'SQL' starts at position 3 of 'MySQL'. It returns 0 if the substring is not found."},

/* ---------- 21–32 : Joins & set operations ---------- */
{q:"What does an INNER JOIN return?",
 o:["All rows from both tables","Only rows that have matching values in both tables","All rows from the left table only","The Cartesian product of the tables"],a:1,
 e:"INNER JOIN returns the intersection: rows that satisfy the join condition in both tables. Rows with no match on either side are excluded."},

{q:"What does a LEFT JOIN with <code>WHERE b.id IS NULL</code> find?",
 o:["Rows that match in both tables","Rows in the left table that have no match in the right table","Rows in the right table that have no match","All rows from both tables"],a:1,
 e:"This is the classic anti-join pattern. LEFT JOIN keeps all left rows and fills right columns with NULL when there is no match; the WHERE filters to only those unmatched rows."},

{q:"What does <code>SELECT * FROM a, b</code> (no WHERE) produce?",
 o:["An error","A Cartesian product (every combination of rows)","An INNER JOIN on the primary keys","All rows from a only"],a:1,
 e:"Comma-separated tables with no join condition produce a CROSS JOIN — |a| × |b| rows. This is almost always a bug and can explode row counts on large tables. Always specify the join condition."},

{q:"How do you emulate a FULL OUTER JOIN in MySQL?",
 o:["Use FULL OUTER JOIN directly","UNION of a LEFT JOIN and a RIGHT JOIN","Use CROSS JOIN","Use INNER JOIN twice"],a:1,
 e:"MySQL does not support FULL OUTER JOIN syntax. Emulate it with a LEFT JOIN UNION a RIGHT JOIN (or UNION ALL with de-duplication). MySQL 8.0 does not add native FULL OUTER JOIN."},

{q:"What does <code>SELECT COUNT(*) FROM a CROSS JOIN b</code> return?",
 o:["The number of rows in a","The number of rows in b","The product of the row counts of a and b","The number of matching rows"],a:2,
 e:"CROSS JOIN produces |a| × |b| rows, so COUNT(*) equals that product. For example, 10 rows × 5 rows = 50. Always check for accidental cross joins in EXPLAIN output."},

{q:"With <code>a JOIN b USING (id)</code>, how many times does the column <code>id</code> appear in the result?",
 o:["Twice, once from each table","Once","Not at all","Three times"],a:1,
 e:"USING coalesces the join column into a single output column, whereas ON would include it from both tables. NATURAL JOIN goes further and joins on all same-named columns."},

{q:"What does a NATURAL JOIN use as its join condition?",
 o:["The primary key of each table","All columns with the same name in both tables","The first column of each table","A specified index"],a:1,
 e:"NATURAL JOIN builds the ON condition implicitly from every identically named column. This is fragile: adding a same-named column later silently changes the join. Prefer explicit ON clauses."},

{q:"Why does a self join require two aliases?",
 o:["Aliases are optional","Each reference to the table needs a distinct name so the join condition can distinguish them","Aliases speed up the query","It does not; you can use the table name twice"],a:1,
 e:"Without aliases, the two references to the same table would be ambiguous. Example: SELECT e.name, m.name FROM employees e JOIN employees m ON e.manager_id = m.id."},

{q:"What does a CROSS JOIN produce?",
 o:["Only matching rows","Every combination of rows from both tables","The intersection of both tables","A foreign key relationship"],a:1,
 e:"CROSS JOIN is the Cartesian product: each row of the first table is paired with every row of the second. It is rarely intended and usually indicates a missing ON clause."},

{q:"What is the difference between UNION and UNION ALL?",
 o:["UNION keeps duplicates; UNION ALL removes them","UNION removes duplicates; UNION ALL keeps all rows","They are identical","UNION ALL works only with three tables"],a:1,
 e:"UNION performs an implicit DISTINCT across the result (slower, sorts). UNION ALL just concatenates. Prefer UNION ALL unless you actually need de-duplication."},

{q:"Which SELECT determines the column names in a UNION result?",
 o:["The last SELECT","The first SELECT","The column with the most rows","MySQL generates new names"],a:1,
 e:"The column names (and types, with some coercion) of a UNION come from the first SELECT. Use aliases in the first SELECT to control the output names."},

/* ---------- 33–42 : Subqueries ---------- */
{q:"What does <code>EXISTS (subquery)</code> return?",
 o:["The number of rows in the subquery","TRUE if the subquery returns at least one row, otherwise FALSE","The first row of the subquery","The last row of the subquery"],a:1,
 e:"EXISTS is a boolean test that short-circuits as soon as one row is found. It is often more efficient than IN for correlated subqueries and, unlike IN, is not tripped up by NULLs."},

{q:"What does <code>WHERE x NOT IN (1, NULL)</code> return?",
 o:["Rows where x is not 1","No rows at all, because the comparison with NULL is unknown","Rows where x is NULL","An error"],a:1,
 e:"NOT IN with a NULL in the list returns UNKNOWN for every row (since x <> NULL is unknown), so the filter matches nothing. This is a classic bug. Use NOT EXISTS or add IS NOT NULL to the subquery."},

{q:"What must a scalar subquery used in a SELECT list return?",
 o:["At most one row and one column","Any number of rows","At least two columns","Only an integer"],a:0,
 e:"A scalar subquery used as an expression must return exactly one row and one column (or NULL if no rows). Returning more than one row raises error 1242 ('Subquery returns more than 1 row')."},

{q:"What does <code>WHERE x > ANY (SELECT ...)</code> mean?",
 o:["x is greater than every value returned","x is greater than at least one value returned","x is greater than no value returned","x equals any returned value"],a:1,
 e:"ANY (or SOME) succeeds if the comparison holds for at least one row, equivalent to x > (SELECT MIN(...)). ALL requires it to hold for every row, equivalent to x > (SELECT MAX(...))."},

{q:"What does <code>WHERE x > ALL (SELECT ...)</code> mean?",
 o:["x is greater than at least one value returned","x is greater than every value returned","x is greater than zero","The subquery returns no rows"],a:1,
 e:"ALL requires the comparison to hold for every row of the subquery, equivalent to x > (SELECT MAX(...)). If the subquery returns no rows, the comparison is vacuously TRUE."},

{q:"What is a derived table in MySQL?",
 o:["A table created with CREATE TABLE AS SELECT","A subquery in the FROM clause that must have an alias","A temporary table","A view"],a:1,
 e:"A derived table is a subquery used in the FROM clause. MySQL requires it to have an alias: SELECT * FROM (SELECT ...) AS t. Without the alias, you get error 1248."},

{q:"What is a correlated subquery?",
 o:["A subquery that references columns from the outer query and is re-evaluated per outer row","A subquery that returns only one row","A subquery in the FROM clause","A subquery with a JOIN inside"],a:0,
 e:"Because it depends on the outer row, a correlated subquery conceptually runs once per candidate row, which can be slow. It can often be rewritten as a JOIN or window function for better performance."},

{q:"Can a subquery appear in the SELECT list?",
 o:["No, never","Yes, as a scalar subquery returning one row and one column","Only with GROUP BY","Only with UNION"],a:1,
 e:"A scalar subquery such as (SELECT MAX(salary) FROM emp WHERE dept = d.id) in the SELECT list is valid and must return at most one row. It is often slower than a JOIN or window function."},

{q:"What happens if a scalar subquery returns more than one row?",
 o:["MySQL returns the first row","MySQL returns the last row","MySQL raises error 1242","MySQL silently returns NULL"],a:2,
 e:"Error 1242: 'Subquery returns more than 1 row'. Fix it by adding LIMIT 1 (if any row is acceptable) or by rewriting as a JOIN or aggregate subquery."},

{q:"What does <code>NOT EXISTS</code> correctly handle that <code>NOT IN</code> may not?",
 o:["Duplicate values","NULL values in the subquery result","Large result sets","Indexes"],a:1,
 e:"NOT IN with NULLs returns UNKNOWN for every row, matching nothing. NOT EXISTS is not affected by NULLs, so it is the safer choice for anti-join patterns when the subquery column is nullable."},

{q:"What is the difference between IN and EXISTS for performance?",
 o:["IN is always faster","EXISTS is always faster","It depends: IN materializes the list, EXISTS short-circuits, so the better choice depends on the data and indexes","They are identical"],a:2,
 e:"Modern MySQL optimizers can convert many IN subqueries to semi-joins, blurring the difference. As a rule, EXISTS is often better for correlated subqueries, and IN for small static lists. Always confirm with EXPLAIN."},

/* ---------- 43–54 : INSERT, UPDATE, DELETE ---------- */
{q:"What does <code>INSERT INTO t VALUES (DEFAULT)</code> do?",
 o:["Inserts NULL","Inserts the column's declared default value","Inserts 0","Raises an error"],a:1,
 e:"The DEFAULT keyword explicitly inserts the column's declared default. If no default is declared and the column is NOT NULL, this raises an error in strict mode. The same keyword works in UPDATE."},

{q:"What is the difference between <code>INSERT IGNORE</code> and <code>INSERT ... ON DUPLICATE KEY UPDATE</code>?",
 o:["They are identical","INSERT IGNORE silently skips rows that would violate constraints; ON DUPLICATE KEY UPDATE updates the existing row instead","INSERT IGNORE updates existing rows","ON DUPLICATE KEY UPDATE skips rows"],a:1,
 e:"INSERT IGNORE turns errors into warnings and skips the offending rows. ON DUPLICATE KEY UPDATE (or REPLACE) allows you to merge into the existing row instead of skipping it."},

{q:"What does <code>REPLACE INTO</code> do when a duplicate key is found?",
 o:["Updates only the changed columns","Deletes the existing row and inserts the new one","Inserts a duplicate row","Raises an error"],a:1,
 e:"REPLACE INTO is delete-then-insert. Columns not listed in the statement are reset to their defaults, which differs from INSERT ... ON DUPLICATE KEY UPDATE that only touches the named columns."},

{q:"Which is a valid multi-row INSERT?",
 o:["<code>INSERT INTO t (a,b) VALUES (1,2), (3,4);</code>","<code>INSERT INTO t VALUES (1,2) AND (3,4);</code>","<code>INSERT ALL INTO t (1,2),(3,4);</code>","<code>MULTI INSERT INTO t (1,2),(3,4);</code>"],a:0,
 e:"MySQL supports multi-row VALUES lists: INSERT INTO t (a,b) VALUES (1,2),(3,4),(5,6); It is far faster than separate statements because it needs only one round trip and one commit."},

{q:"What happens if you run <code>UPDATE users SET active = 0;</code> with no WHERE clause?",
 o:["No rows are updated","Every row in the table is updated","An error is raised","Only the first row is updated"],a:1,
 e:"Without WHERE, the UPDATE affects every row — a classic production accident. Test with a SELECT using the same WHERE first, and consider enabling sql_safe_updates to block UPDATE/DELETE without a key in the WHERE."},

{q:"What does <code>DELETE FROM t;</code> do?",
 o:["Drops the table","Deletes all rows but keeps the table structure","Resets the AUTO_INCREMENT counter","Deletes only the first row"],a:1,
 e:"DELETE FROM t without WHERE deletes every row but keeps the table, its indexes and its structure. It is DML, so it can be rolled back inside a transaction (unlike TRUNCATE)."},

{q:"How do you delete rows from one table based on values in another table?",
 o:["<code>DELETE FROM t1 WHERE id IN (SELECT id FROM t2 WHERE ...);</code>","<code>DELETE FROM t1 JOIN t2 ON ...</code> only","<code>DROP TABLE t1;</code>","You cannot do this"],a:0,
 e:"The IN-subquery form is the most portable. MySQL also supports multi-table DELETE syntax: DELETE t1 FROM t1 JOIN t2 ON ... WHERE ...; which deletes matching rows from t1."},

{q:"What is the difference between TRUNCATE TABLE and DELETE FROM?",
 o:["They are identical","TRUNCATE is DDL-like and cannot be rolled back; DELETE is DML and can be rolled back","DELETE is faster","TRUNCATE accepts a WHERE clause"],a:1,
 e:"TRUNCATE drops and recreates the table (resets AUTO_INCREMENT, cannot use WHERE, implicit commit). DELETE removes rows one by one, supports WHERE and triggers, and can be rolled back in InnoDB."},

{q:"What does <code>INSERT INTO t1 SELECT * FROM t2;</code> do?",
 o:["Creates t1 from t2","Inserts all rows from t2 into t1 (structures must be compatible)","Copies the structure of t2 into t1","Drops t2 after copying"],a:1,
 e:"INSERT ... SELECT inserts rows returned by any SELECT. The column counts must match and types must be compatible. This is useful for copying or archiving data between tables."},

{q:"What does <code>INSERT ... ON DUPLICATE KEY UPDATE col = VALUES(col)</code> do?",
 o:["Inserts a new row or updates the existing row when a duplicate key is found, using the value that would have been inserted","Always inserts a new row","Deletes the existing row","Requires a foreign key"],a:0,
 e:"This is MySQL's upsert. VALUES(col) refers to the value that would have been inserted. Note that the VALUES() function is deprecated in MySQL 8.0.20+ in favour of the new row alias syntax."},

{q:"What does <code>UPDATE t SET a = a + 1 ORDER BY id LIMIT 10;</code> do?",
 o:["Increments a for the 10 lowest id rows","Increments a for all rows","Raises an error","Increments a for the 10 highest id rows"],a:0,
 e:"MySQL supports ORDER BY and LIMIT on UPDATE. This updates only the first 10 rows by id, which is useful for batched processing. Standard SQL does not allow LIMIT on UPDATE."},

{q:"What does <code>DELETE FROM t ORDER BY id LIMIT 100;</code> do?",
 o:["Deletes the 100 highest-id rows","Deletes the 100 lowest-id rows (by id) and stops","Deletes all rows","Raises an error"],a:1,
 e:"MySQL supports ORDER BY and LIMIT on DELETE. This batches deletions to avoid long locks and huge undo logs — a common technique for deleting large volumes in chunks."},

/* ---------- 55–64 : DDL statements ---------- */
{q:"What does <code>CREATE TABLE t AS SELECT * FROM other;</code> copy?",
 o:["Data and indexes","Data, but not indexes, primary keys, or AUTO_INCREMENT","Only the structure","Only indexes"],a:1,
 e:"CREATE TABLE ... AS SELECT (CTAS) copies data and column definitions, but not indexes, primary keys, AUTO_INCREMENT attributes or foreign keys. Use CREATE TABLE ... LIKE to copy the structure."},

{q:"What does <code>CREATE TABLE t LIKE other;</code> copy?",
 o:["Data and structure","Structure (including indexes), but not data","Only column names","Only the primary key"],a:1,
 e:"CREATE TABLE ... LIKE copies the full structure, including indexes and constraints, but not data. It is commonly used to create empty clones for testing or staging."},

{q:"Where is a new column added by default with <code>ALTER TABLE t ADD COLUMN c INT;</code>?",
 o:["First","At the end of the column list","After the primary key","Before the first column"],a:1,
 e:"New columns are added at the end by default. Use FIRST or AFTER other_col to position them: ALTER TABLE t ADD COLUMN c INT AFTER b; Note that INSTANT algorithm supports adding at the end with no rebuild."},

{q:"What is the difference between ALTER TABLE MODIFY and ALTER TABLE CHANGE?",
 o:["They are identical","MODIFY changes a column's definition but not its name; CHANGE can also rename it","CHANGE cannot rename","MODIFY can rename, CHANGE cannot"],a:1,
 e:"MODIFY col new_definition changes the type or attributes. CHANGE old_name new_name new_definition can rename and change the definition in one step. Both may require a table rebuild depending on the change."},

{q:"Which statement renames a table?",
 o:["<code>RENAME TABLE old TO new;</code>","<code>RENAME old TO new;</code>","<code>ALTER old RENAME new;</code>","<code>TABLE old RENAME TO new;</code>"],a:0,
 e:"RENAME TABLE old TO new renames one or more tables atomically. ALTER TABLE old RENAME TO new also works. RENAME TABLE is preferred for atomic multi-table swaps."},

{q:"What does <code>DROP TABLE IF EXISTS t;</code> do?",
 o:["Drops t, raising an error if it does not exist","Drops t, silently doing nothing if it does not exist","Creates t if it does not exist","Empties t"],a:1,
 e:"IF EXISTS suppresses the error when the table is missing, making scripts idempotent. The same pattern works for DROP DATABASE, DROP INDEX and DROP VIEW."},

{q:"Which is a valid CREATE INDEX statement?",
 o:["<code>CREATE INDEX idx ON t (col);</code>","<code>CREATE INDEX idx ON t col;</code>","<code>NEW INDEX idx ON t (col);</code>","<code>MAKE INDEX idx ON t (col);</code>"],a:0,
 e:"CREATE [UNIQUE|FULLTEXT|SPATIAL] INDEX name ON table (col1, col2, ...); Also available: ALTER TABLE t ADD INDEX idx (col); The two forms are equivalent."},

{q:"How do you drop an index in MySQL?",
 o:["<code>DROP INDEX idx ON t;</code>","<code>DELETE INDEX idx ON t;</code>","<code>REMOVE INDEX idx;</code>","<code>DROP idx ON t;</code>"],a:0,
 e:"DROP INDEX idx ON t; or ALTER TABLE t DROP INDEX idx; Both work. Note that dropping the index behind a PRIMARY KEY requires ALTER TABLE t DROP PRIMARY KEY;."},

{q:"What does <code>CREATE OR REPLACE VIEW v AS SELECT ...;</code> do?",
 o:["Creates the view, or replaces its definition if it already exists","Creates a new table","Drops and recreates the underlying tables","Updates the view's data"],a:0,
 e:"CREATE OR REPLACE VIEW replaces an existing view's definition atomically. Without OR REPLACE, you must DROP VIEW first. Views store the query, not the data."},

{q:"What is the scope of a table created with <code>CREATE TEMPORARY TABLE</code>?",
 o:["The whole server","The current session; it is dropped automatically when the session ends","The current statement","The current database, shared by all users"],a:1,
 e:"Temporary tables are session-scoped, and two sessions can each have their own temp table with the same name without conflicting. They live in the temporary tablespace."},

/* ---------- 65–74 : GROUP BY, HAVING & aggregates ---------- */
{q:"What does ONLY_FULL_GROUP_BY enforce?",
 o:["Only full-text indexes can be used","Every non-aggregated column in the SELECT must appear in the GROUP BY","Only one GROUP BY column is allowed","GROUP BY must come before WHERE"],a:1,
 e:"ONLY_FULL_GROUP_BY (in the default sql_mode) rejects queries where a non-aggregated column is neither in GROUP BY nor functionally dependent on it. It prevents ambiguous results that other databases allow."},

{q:"What is the difference between WHERE and HAVING?",
 o:["WHERE filters groups; HAVING filters rows","HAVING filters groups after aggregation; WHERE filters rows before grouping","They are identical","HAVING cannot use aggregates"],a:1,
 e:"WHERE runs before GROUP BY and cannot reference aggregate functions. HAVING runs after grouping and can filter on aggregates such as COUNT(*) > 5. Put conditions in WHERE when possible for better performance."},

{q:"What is the difference between <code>COUNT(*)</code> and <code>COUNT(col)</code>?",
 o:["They are identical","COUNT(*) counts all rows; COUNT(col) counts only non-NULL values in col","COUNT(col) counts all rows","COUNT(*) ignores NULLs"],a:1,
 e:"COUNT(*) counts every row regardless of NULLs. COUNT(col) counts only rows where col is NOT NULL, so it can be smaller. COUNT(DISTINCT col) counts distinct non-NULL values."},

{q:"What does <code>COUNT(DISTINCT col)</code> return?",
 o:["The number of all rows","The number of distinct non-NULL values in col","The number of NULL values","The number of duplicates"],a:1,
 e:"COUNT(DISTINCT col) counts unique non-NULL values. It is equivalent to COUNT(DISTINCT col) after filtering NULLs. Multiple columns can be combined: COUNT(DISTINCT a, b)."},

{q:"What does <code>SUM(col)</code> return when every value in the group is NULL?",
 o:["0","NULL","An error","1"],a:1,
 e:"SUM ignores NULLs, but if there are no non-NULL values to add, the result is NULL, not 0. Wrap it in COALESCE(SUM(col), 0) when a zero is needed."},

{q:"How does <code>AVG(col)</code> treat NULL values?",
 o:["Counts them as 0","Ignores them and averages only non-NULL values","Returns NULL if any value is NULL","Raises an error"],a:1,
 e:"AVG(col) = SUM(col) / COUNT(col), and COUNT(col) excludes NULLs. So AVG over (10, NULL, 20) is 15, not 10. This is a common source of reporting discrepancies."},

{q:"What is the default separator for <code>GROUP_CONCAT(col)</code>?",
 o:["Space","Comma (,)","Semicolon (;)","Newline"],a:1,
 e:"The default separator is a comma. Change it with SEPARATOR, e.g. GROUP_CONCAT(name SEPARATOR ' | '). The output is also truncated at group_concat_max_len (default 1024 bytes)."},

{q:"What is the default value of <code>group_concat_max_len</code>?",
 o:["256","1024","8192","65535"],a:1,
 e:"The default is 1024 bytes. GROUP_CONCAT silently truncates its output beyond this limit, which frequently surprises people on large groups. Raise it with SET SESSION group_concat_max_len = ..."},

{q:"What does <code>GROUP BY ... WITH ROLLUP</code> add?",
 o:["Extra summary rows with NULLs for the grouped columns","A random ordering","A temporary table","A second GROUP BY"],a:0,
 e:"WITH ROLLUP adds subtotal rows (with NULL in the grouped columns) for each group level and a grand total. It is a fast way to compute totals without a separate query, but you must distinguish real NULLs from rollup NULLs (e.g. using GROUPING())."},

{q:"Can you use a SELECT alias in the GROUP BY clause?",
 o:["No","Yes, MySQL allows it","Only with ONLY_FULL_GROUP_BY disabled","Only for integer columns"],a:1,
 e:"MySQL allows aliases in GROUP BY (e.g. SELECT YEAR(d) AS y, COUNT(*) ... GROUP BY y). This is a MySQL extension; standard SQL requires the full expression. Aliases are also allowed in HAVING and ORDER BY, but not in WHERE."},

/* ---------- 75–84 : ORDER BY, LIMIT & pagination ---------- */
{q:"What is the default sort order of ORDER BY?",
 o:["DESC","ASC","Random","No ordering"],a:1,
 e:"The default is ascending (ASC). Use ORDER BY col DESC for descending. NULLs sort first in ASC and last in DESC in MySQL."},

{q:"Where do NULL values appear when you sort a column with ORDER BY col ASC?",
 o:["Last","First","In the middle","At random positions"],a:1,
 e:"In MySQL, NULLs sort before all non-NULL values in ascending order. Use ORDER BY col IS NULL, col (or ORDER BY col IS NOT NULL) to force NULLs last if needed."},

{q:"What rows does <code>LIMIT 5 OFFSET 10</code> return?",
 o:["Rows 1–5","Rows 11–15","Rows 10–14","Rows 6–10"],a:1,
 e:"OFFSET 10 skips the first 10 rows; LIMIT 5 returns the next 5, which are rows 11–15. The equivalent LIMIT 10, 5 means 'skip 10, take 5'."},

{q:"What does <code>LIMIT 10, 5</code> return?",
 o:["Rows 1–10","Rows 10–14","Rows 11–15","Rows 5–15"],a:2,
 e:"LIMIT offset, count means 'skip offset rows, return count rows'. So LIMIT 10, 5 skips 10 and returns 5, i.e. rows 11–15. This is the same as LIMIT 5 OFFSET 10."},

{q:"Why is <code>ORDER BY RAND()</code> problematic on large tables?",
 o:["It returns rows in insertion order","It sorts the entire table with a random value for every row, which is expensive","It only works with LIMIT 1","It is not supported in MySQL"],a:1,
 e:"ORDER BY RAND() assigns a random value to every row and sorts the full result, which scales poorly. For large tables, use a random offset with LIMIT or a precomputed random column instead."},

{q:"What does <code>ORDER BY 1, 2</code> mean?",
 o:["Order by the first and second columns (by position)","Order by the values 1 and 2","Order by a constant","Raises an error"],a:0,
 e:"Integer literals in ORDER BY refer to the position of the column in the SELECT list. ORDER BY 1, 2 sorts by the first column, then the second. This is a MySQL/standard extension; avoid it for readability."},

{q:"Can a query use an alias defined in the SELECT list inside ORDER BY?",
 o:["No","Yes","Only with GROUP BY","Only for integer columns"],a:1,
 e:"ORDER BY can reference SELECT aliases: SELECT price*qty AS total FROM t ORDER BY total DESC. This works because ORDER BY is evaluated after the SELECT list. WHERE cannot reference such aliases."},

{q:"What does <code>LIMIT 0</code> return?",
 o:["An error","Zero rows but the column metadata","One row","All rows"],a:1,
 e:"LIMIT 0 returns no rows but still sends the column metadata. It is a common trick to inspect a query's result shape without fetching data."},

{q:"When does LIMIT execute relative to ORDER BY?",
 o:["Before ORDER BY","After ORDER BY: the sort happens first, then the rows are limited","Simultaneously","LIMIT cannot be combined with ORDER BY"],a:1,
 e:"ORDER BY sorts the full result set first, then LIMIT takes the requested rows. For large tables, ensure the ORDER BY is supported by an index to avoid sorting the whole result."},

{q:"What does <code>SELECT ... ORDER BY col LIMIT 10 OFFSET 100000</code> suffer from?",
 o:["It returns nothing","Deep pagination: MySQL must skip 100,000 rows, which gets slower as the offset grows","It raises an error","It uses more memory than RAM"],a:1,
 e:"Deep OFFSET pagination is slow because the server still has to read and discard the skipped rows. Use keyset pagination (WHERE id > last_id ORDER BY id LIMIT 10) for large offsets."},

/* ---------- 85–94 : CTEs, views & advanced query patterns ---------- */
{q:"How do you define a CTE in MySQL 8.0+?",
 o:["<code>WITH cte AS (SELECT ...) SELECT ... FROM cte;</code>","<code>CREATE CTE cte AS SELECT ...;</code>","<code>CTE cte AS (SELECT ...);</code>","<code>WITH cte = SELECT ...;</code>"],a:0,
 e:"A CTE is defined with WITH name AS (query), optionally followed by more CTEs separated by commas, then the main query. MySQL 8.0+ supports both non-recursive and recursive CTEs."},

{q:"How do you define a recursive CTE?",
 o:["<code>WITH RECURSIVE cte AS (anchor UNION ALL recursive) SELECT ...</code>","<code>WITH cte RECURSIVE AS (...)</code>","<code>CREATE RECURSIVE cte AS (...)</code>","<code>RECURSIVE WITH cte AS (...)</code>"],a:0,
 e:"The RECURSIVE keyword must follow WITH. The CTE body is anchor UNION [ALL] recursive member, where the recursive member references the CTE itself. Always include a termination condition."},

{q:"What does <code>WITH CHECK OPTION</code> do on a view?",
 o:["Prevents inserting or updating rows through the view that would not be visible through the view","Checks the syntax of the view","Locks the view against reads","Encrypts the view"],a:0,
 e:"WITH CHECK OPTION makes the view enforce its own WHERE condition: rows inserted or updated through the view must satisfy it. This prevents data from silently disappearing from the view after an update."},

{q:"What does <code>LATERAL</code> allow in a derived table?",
 o:["A derived table that can reference columns from preceding tables in the FROM clause","A derived table that runs in parallel","A view that can be updated","A table that cannot be joined"],a:0,
 e:"LATERAL derived tables (MySQL 8.0.14+) can reference sibling tables, effectively allowing a correlated subquery in FROM: FROM t, LATERAL (SELECT ... WHERE x = t.id LIMIT 1) AS d. Without LATERAL, derived tables cannot reference other tables in the same FROM."},

{q:"What does a window function with <code>OVER()</code> (no arguments) compute?",
 o:["The aggregate over the entire result set, returned on every row","The aggregate over the current row only","A random value","An error"],a:0,
 e:"OVER() with no PARTITION BY or ORDER BY uses the entire result set as the window, returning the aggregate on every row without collapsing rows. Add PARTITION BY to segment, ORDER BY for a running total."},

{q:"What is the difference between PARTITION BY and GROUP BY?",
 o:["They are identical","PARTITION BY keeps all rows and computes window values per partition; GROUP BY collapses rows to one per group","GROUP BY keeps all rows","PARTITION BY collapses rows"],a:1,
 e:"GROUP BY reduces each group to one output row. PARTITION BY (in a window function) keeps every row and computes the aggregate over its partition. Use window functions when you need per-row values alongside aggregates."},

{q:"What does <code>FIRST_VALUE(col) OVER (PARTITION BY p ORDER BY o)</code> return?",
 o:["The last value in the partition","The first value in the partition according to the ordering","The maximum value","The average value"],a:1,
 e:"FIRST_VALUE returns the value from the first row of the window frame. LAST_VALUE returns the last row of the frame — beware that its default frame extends only to the current row, so you often need ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING."},

{q:"What does <code>NTILE(4) OVER (ORDER BY score DESC)</code> do?",
 o:["Returns the top 4 rows","Divides the rows into 4 roughly equal buckets and returns the bucket number","Returns the 4th row","Rounds to 4 decimals"],a:1,
 e:"NTILE(n) splits the window's rows into n buckets as evenly as possible. It is useful for quartiles, deciles and equal-sized cohorts. Ties are assigned to the same bucket depending on the bucket boundaries."},

{q:"What does <code>SELECT DISTINCT a, b FROM t</code> return?",
 o:["Distinct values of a only","Distinct combinations of (a, b)","Distinct values of b only","All rows"],a:1,
 e:"DISTINCT applies to the whole row of the SELECT list, so it returns distinct combinations of (a, b). To get distinct values of a single column, use SELECT DISTINCT a or COUNT(DISTINCT a)."},

{q:"What is the difference between DISTINCT and GROUP BY for de-duplication?",
 o:["They are semantically equivalent for simple de-duplication; GROUP BY may be faster in some cases","DISTINCT is always faster","GROUP BY cannot de-duplicate","DISTINCT collapses rows permanently"],a:0,
 e:"SELECT DISTINCT a, b and SELECT a, b GROUP BY a, b return the same rows. The optimizer usually treats them similarly. Choose DISTINCT for clarity and GROUP BY when you also need aggregates."},

/* ---------- 95–100 : Misc query output & behavior ---------- */
{q:"What does <code>SELECT 1 = TRUE</code> return?",
 o:["0","1","NULL","An error"],a:1,
 e:"TRUE is a synonym for 1 in MySQL, so 1 = 1 is TRUE and the result is 1. FALSE is a synonym for 0. Booleans are represented as TINYINT(1) values 0 and 1."},

{q:"What does <code>SELECT 1 = '1'</code> return?",
 o:["0","1","NULL","An error"],a:1,
 e:"In a comparison, MySQL converts the string to a number when comparing with a numeric, so '1' becomes 1 and the result is TRUE (1). This is why type-consistent comparisons are important for index use."},

{q:"What does <code>SELECT CAST('2024-01-15' AS DATE)</code> return?",
 o:["A string","A DATE value","NULL","An error"],a:1,
 e:"CAST converts the string to a DATE. The server validates the format; an invalid date string raises a warning and produces NULL in non-strict contexts. Use STR_TO_DATE for custom formats."},

{q:"What does <code>SELECT CONVERT('123', SIGNED)</code> return?",
 o:["'123'","123 (a signed integer)","An error","0"],a:1,
 e:"CONVERT(expr, type) converts to the given type. SIGNED, UNSIGNED, DECIMAL, DATE, DATETIME, CHAR, BINARY and JSON are common targets. The USING form of CONVERT changes character set instead."},

{q:"Why does <code>WHERE YEAR(created_at) = 2024</code> often prevent index use?",
 o:["YEAR() is not a valid function","Applying a function to an indexed column prevents the index from being used for a range scan","It requires a full-text index","It only works with DATETIME"],a:1,
 e:"Wrapping the column in a function hides the raw value from the index, forcing a full scan. Rewrite as created_at >= '2024-01-01' AND created_at < '2025-01-01' to use the index. This applies to all 'sargable' rewrites."},

{q:"Which pattern can use an index on a VARCHAR column?",
 o:["<code>WHERE col LIKE '%abc'</code>","<code>WHERE col LIKE 'abc%'</code>","<code>WHERE col LIKE '%abc%'</code>","<code>WHERE LOWER(col) = 'abc'</code>"],a:1,
 e:"A leading-wildcard pattern cannot use a B+Tree index. WHERE col LIKE 'abc%' can use a range scan on the index because the prefix is known. Functions on the column (LOWER(col)) also block index use unless you have a functional index."}
];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').innerHTML = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.innerHTML = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').innerHTML =
      '✅ Correct answer: <b>' + LETTERS[q.a] + '</b> — ' + q.o[q.a];
    $('explainText').innerHTML = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }
    if(state.ans[i] === q.a && state.ans[i] !== null){
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }
    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}
function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
