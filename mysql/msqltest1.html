<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySQL Mock Test — 100 MCQs</title>
<style>
  :root{
    --brand:#00758f;
    --brand-dark:#005a6e;
    --accent:#f29111;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 18px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;
    background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 16px 60px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  /* ---------- palette ---------- */
  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,117,143,.3)}
  .pbtn.correct{background:#bbf7d0;border-color:#16a34a}
  .pbtn.wrong{background:#fecaca;border-color:#dc2626}
  .pbtn.skipped{background:#e2e8f0}

  /* ---------- main ---------- */
  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.06rem;font-weight:600;margin:0 0 18px}

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#f0f9ff}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option .otext code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .option.selected{border-color:var(--brand);background:#e0f2f7}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{transform:none}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}
  .explain-body code{background:#dcfce7;padding:1px 6px;border-radius:5px;font-size:.88em}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;
    font-size:.9rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  .hint{margin-top:12px;font-size:.76rem;color:var(--muted)}

  /* ---------- results ---------- */
  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.96rem}
  .revline{font-size:.87rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:110px}
  .revexp{margin-top:10px;font-size:.86rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .revexp code{background:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:.88em}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🐬 MySQL Mock Test <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — 100 MySQL MCQs
   o = options, a = index of correct option, e = explanation
   ============================================================ */
const QS = [
/* ---------- 1–16 : Fundamentals & DDL ---------- */
{q:"Which storage engine is the default in modern MySQL (8.0 and later)?",
 o:["MyISAM","InnoDB","MEMORY","ARCHIVE"],a:1,
 e:"InnoDB has been the default storage engine since MySQL 5.5. It supports transactions, row-level locking, foreign keys, MVCC and crash recovery. MyISAM, MEMORY and ARCHIVE are alternative engines lacking full transactional support."},

{q:"What does ACID stand for in the context of MySQL transactions?",
 o:["Atomicity, Consistency, Isolation, Durability","Availability, Consistency, Integrity, Durability","Atomicity, Concurrency, Isolation, Dependency","Accuracy, Consistency, Isolation, Durability"],a:0,
 e:"ACID = Atomicity (all-or-nothing), Consistency (valid state transitions), Isolation (concurrent transactions do not interfere) and Durability (committed data survives crashes). InnoDB guarantees all four."},

{q:"Which statement creates a new database named shop?",
 o:["MAKE DATABASE shop;","CREATE DATABASE shop;","NEW DATABASE shop;","ADD DATABASE shop;"],a:1,
 e:"The correct DDL is CREATE DATABASE shop; optionally with a character set, e.g. CREATE DATABASE shop CHARACTER SET utf8mb4. You then switch to it with USE shop;"},

{q:"Which data type is best suited for storing monetary values with exact precision?",
 o:["FLOAT","DOUBLE","DECIMAL","INT"],a:2,
 e:"DECIMAL stores exact fixed-point values (e.g. DECIMAL(10,2)). FLOAT and DOUBLE are binary floating-point types and can introduce rounding errors, which is unacceptable for money."},

{q:"What is the maximum number of columns allowed in a MySQL table (by default)?",
 o:["256","512","1017","4096"],a:2,
 e:"The MySQL limit is 1017 columns per table (internal columns excluded). Other limits include 64 indexes per table and 16 columns per index."},

{q:"Which of the following is NOT a valid MySQL numeric data type?",
 o:["INT","BIGINT","NUMBER","SMALLINT"],a:2,
 e:"NUMBER is an Oracle type. MySQL numeric types include TINYINT, SMALLINT, MEDIUMINT, INT, BIGINT, DECIMAL/NUMERIC, FLOAT, DOUBLE and BIT."},

{q:"What is the key difference between CHAR and VARCHAR?",
 o:["VARCHAR is fixed length, CHAR is variable length","VARCHAR is variable length; CHAR is fixed length and space-padded","Both are variable length","CHAR can store longer strings than VARCHAR"],a:1,
 e:"CHAR(n) always occupies n characters (padded with spaces on storage); VARCHAR(n) stores only the actual characters plus 1–2 length bytes. Use CHAR for fixed-length codes and VARCHAR for variable text."},

{q:"Which statement about AUTO_INCREMENT is TRUE?",
 o:["A table can have multiple AUTO_INCREMENT columns","The AUTO_INCREMENT column must be indexed, typically as the PRIMARY KEY","AUTO_INCREMENT values are always reused after a DELETE","AUTO_INCREMENT only works with VARCHAR columns"],a:1,
 e:"An AUTO_INCREMENT column must be a key (usually the PRIMARY KEY). There can be only one per table, and deleted values are generally not reused. In MySQL 8.0 the counter is persisted across restarts."},

{q:"Which statement about a PRIMARY KEY is correct?",
 o:["It can contain NULL values","It allows duplicate values if an index exists","It uniquely identifies each row and cannot contain NULL","It can only be defined on VARCHAR columns"],a:2,
 e:"A PRIMARY KEY is a unique, non-NULL index that identifies each row. A table can have only one PRIMARY KEY; use a UNIQUE index when you need additional unique constraints."},

{q:"Which operator correctly tests for NULL values?",
 o:["= NULL","== NULL","IS NULL","EQUALS NULL"],a:2,
 e:"NULL is unknown, so = NULL always evaluates to NULL (not TRUE). Use IS NULL or IS NOT NULL. The NULL-safe equality operator <=> also exists for comparisons."},

{q:"What does the ENUM data type do?",
 o:["Stores a numeric range","Stores exactly one value chosen from a predefined list","Stores only JSON documents","Stores a set of up to 64 values"],a:1,
 e:"ENUM stores one value from a declared list, e.g. ENUM('small','medium','large'). Internally it is stored as an integer index (1 byte for up to 255 values). SET stores multiple values from the list."},

{q:"What is the range of a signed TINYINT in MySQL?",
 o:["-128 to 127","0 to 255","-32768 to 32767","-255 to 255"],a:0,
 e:"A signed TINYINT occupies 1 byte: -128 to 127. An UNSIGNED TINYINT is 0 to 255. SMALLINT is 2 bytes (-32768 to 32767), MEDIUMINT 3 bytes, INT 4 bytes and BIGINT 8 bytes."},

{q:"Which statement displays the structure of a table?",
 o:["SHOW TABLE users;","DESCRIBE users;","SELECT * FROM users;","LIST users;"],a:1,
 e:"DESCRIBE users; (or DESC users;) shows column names, types, nullability, keys and defaults. SHOW CREATE TABLE users; gives the full DDL including indexes and engine."},

{q:"Which of the following is a DDL (Data Definition Language) statement?",
 o:["INSERT","UPDATE","ALTER TABLE","SELECT"],a:2,
 e:"DDL changes schema objects: CREATE, ALTER, DROP, TRUNCATE, RENAME. DML manipulates rows: SELECT, INSERT, UPDATE, DELETE. DCL handles privileges: GRANT, REVOKE."},

{q:"What is the difference between DELETE and TRUNCATE?",
 o:["DELETE is DDL and TRUNCATE is DML","Both accept a WHERE clause","DELETE is DML and can be rolled back; TRUNCATE is DDL, faster, and resets AUTO_INCREMENT","TRUNCATE deletes only selected rows"],a:2,
 e:"DELETE removes rows one by one, supports WHERE, fires triggers and can be rolled back inside a transaction. TRUNCATE drops and recreates the table, resets AUTO_INCREMENT, is much faster, does not fire triggers and cannot use WHERE."},

{q:"What is required for a FOREIGN KEY to work in MySQL?",
 o:["The parent column must be indexed (usually PRIMARY KEY) and the table must use InnoDB","The parent column must be VARCHAR","Foreign keys work with any storage engine","The child table must be empty"],a:0,
 e:"Foreign keys require the InnoDB engine, and the referenced parent column must be indexed (typically a PRIMARY KEY or UNIQUE key). MyISAM parses but ignores foreign key definitions."},

/* ---------- 17–35 : SQL queries ---------- */
{q:"What does SELECT DISTINCT do?",
 o:["Returns only unique rows, removing duplicates","Sorts the result set","Returns only the first row","Permanently deletes duplicates from the table"],a:0,
 e:"DISTINCT eliminates duplicate rows from the result set. It affects only the output, never the stored data. It can add a sort/dedup cost on large result sets."},

{q:"What is the difference between WHERE and HAVING?",
 o:["WHERE filters groups, HAVING filters rows","HAVING filters groups after aggregation; WHERE filters rows before grouping","They are identical","HAVING can only be used without GROUP BY"],a:1,
 e:"WHERE runs before GROUP BY and filters individual rows (it cannot reference aggregate functions). HAVING runs after grouping and can filter on aggregates such as COUNT(*) > 5."},

{q:"How do the LIKE wildcards % and _ behave?",
 o:["% matches exactly one character, _ matches any sequence","% matches any sequence of characters, _ matches exactly one character","Both match only digits","LIKE does not support wildcards"],a:1,
 e:"% matches zero or more characters; _ matches exactly one character. Example: WHERE name LIKE 'A%' finds names starting with A. Use ESCAPE to search for literal % or _."},

{q:"How does the BETWEEN operator treat its endpoints?",
 o:["Exclusive of both endpoints","Inclusive of both endpoints","Only inclusive of the lower bound","It only works with dates"],a:1,
 e:"BETWEEN low AND high is inclusive on both ends, equivalent to (col >= low AND col <= high). It works with numbers, dates and strings."},

{q:"What does the IN operator do?",
 o:["Compares a value against a list of values","Joins two tables","Creates an index","Inserts rows"],a:0,
 e:"WHERE col IN (1,2,3) is shorthand for col = 1 OR col = 2 OR col = 3. IN also accepts a subquery: WHERE id IN (SELECT user_id FROM orders)."},

{q:"If ORDER BY has no ASC or DESC keyword, what is the default?",
 o:["DESC","ASC","Random order","No ordering at all"],a:1,
 e:"The default sort order is ascending (ASC). Use ORDER BY col DESC for descending. NULLs sort first in ascending order in MySQL."},

{q:"What does LIMIT 10 OFFSET 20 return?",
 o:["Rows 1 to 10","Rows 21 to 30","Rows 10 to 20","Rows 11 to 20"],a:1,
 e:"OFFSET 20 skips the first 20 rows and LIMIT 10 then returns the next 10 — that is, rows 21 through 30. LIMIT 20,10 is equivalent syntax."},

{q:"What does COUNT(*) return?",
 o:["The number of all rows, including rows containing NULLs","Only rows where every column is non-NULL","The number of distinct values","The sum of a column"],a:0,
 e:"COUNT(*) counts every row regardless of NULLs. COUNT(column) counts only rows where that column is NOT NULL. COUNT(DISTINCT column) counts distinct non-NULL values."},

{q:"How does COUNT(column) differ from COUNT(*)?",
 o:["COUNT(column) ignores NULLs in that column; COUNT(*) counts every row","They always return the same number","COUNT(*) ignores NULLs","COUNT(column) counts all rows"],a:0,
 e:"COUNT(column) counts only non-NULL values of that column, so it can be smaller than COUNT(*). This is a common source of subtle reporting bugs."},

{q:"What does an INNER JOIN return?",
 o:["All rows from both tables","Only rows that have matching values in both tables","Only unmatched rows","The product of the two row counts"],a:1,
 e:"INNER JOIN returns the intersection — only rows satisfying the join condition. Rows with no match on either side are excluded."},

{q:"What does a LEFT JOIN return?",
 o:["Only matching rows","All rows from the left table plus matching rows from the right (NULLs where there is no match)","All rows from the right table","The same as CROSS JOIN"],a:1,
 e:"LEFT JOIN preserves every row of the left table. When no match exists on the right, the right-hand columns appear as NULL. This is useful for finding missing relationships with WHERE right.id IS NULL."},

{q:"What does a CROSS JOIN produce?",
 o:["The Cartesian product of both tables","Only matching rows","The intersection of both tables","A foreign key relationship"],a:0,
 e:"CROSS JOIN returns every combination of rows: m × n rows. It is rarely intended and usually indicates a missing join condition when produced accidentally."},

{q:"What is a SELF JOIN?",
 o:["It cannot be done in MySQL","Joining a table to itself using two different aliases","A join that requires a temporary table","A join that only works with views"],a:1,
 e:"A self join joins a table to itself with two aliases, e.g. SELECT e.name, m.name FROM employees e JOIN employees m ON e.manager_id = m.id; — classic for hierarchical data."},

{q:"What is the difference between UNION and UNION ALL?",
 o:["Both remove duplicates","UNION removes duplicate rows; UNION ALL keeps all rows","UNION ALL removes duplicates","They are identical"],a:1,
 e:"UNION performs an implicit DISTINCT across the combined result (slower). UNION ALL simply concatenates, keeping duplicates and avoiding the sort — always prefer UNION ALL when duplicates are acceptable."},

{q:"What does WHERE id IN (SELECT user_id FROM orders) do?",
 o:["Keeps rows whose id exists in the subquery result","Inserts rows into orders","Creates a temporary table","Requires an explicit JOIN"],a:0,
 e:"It is a subquery filter: the outer query keeps rows whose id appears in the subquery's result set. It is logically similar to a JOIN but can behave differently with NULLs."},

{q:"What does the EXISTS operator return?",
 o:["TRUE if the subquery returns at least one row","The number of rows in the subquery","The text of the subquery","It only works with UPDATE"],a:0,
 e:"EXISTS is a boolean test that short-circuits as soon as one row is found. NOT EXISTS is the standard way to find rows with no matching related rows."},

{q:"Which statement inserts multiple rows in a single INSERT?",
 o:["INSERT INTO t (a,b) VALUES (1,2), (3,4);","INSERT INTO t VALUES (1,2) AND (3,4);","INSERT ALL INTO t (1,2),(3,4);","MULTI INSERT INTO t (1,2),(3,4);"],a:0,
 e:"MySQL supports multi-row VALUES lists: INSERT INTO t (a,b) VALUES (1,2),(3,4),(5,6); This is far faster than separate statements because it needs only one round trip and one commit."},

{q:"What happens if you run UPDATE users SET active = 0; with no WHERE clause?",
 o:["No rows are updated","Every row in the table is updated","An error is raised","Only the first row is updated"],a:1,
 e:"Without WHERE, the UPDATE affects all rows. This is a classic production accident — always test with a SELECT using the same WHERE clause first, and consider setting sql_safe_updates."},

{q:"What does INSERT ... ON DUPLICATE KEY UPDATE do?",
 o:["Inserts a row, or updates it if a duplicate key is found","Always inserts a duplicate row","Deletes duplicate rows","Requires a foreign key"],a:0,
 e:"It is MySQL's upsert: if the insert would violate a PRIMARY or UNIQUE key, the existing row is updated instead. Note that it can consume AUTO_INCREMENT values on failed inserts."},

/* ---------- 36–50 : Indexes & performance ---------- */
{q:"What is the primary purpose of an index in MySQL?",
 o:["To enforce data types","To speed up reads at the cost of slower writes and extra disk space","To compress the table","To automatically back up data"],a:1,
 e:"Indexes let the optimizer find rows without scanning the whole table. The trade-off: every INSERT, UPDATE and DELETE must also maintain the indexes, and each index consumes disk and buffer-pool memory."},

{q:"In InnoDB, what is the clustered index?",
 o:["A separate copy of the table","The primary key index, whose leaf pages store the actual row data","An in-memory cache","A full-text index"],a:1,
 e:"InnoDB is a clustered-index storage engine: the table IS the primary key B+Tree, and leaf pages contain full rows. A table with no primary key gets a hidden 6-byte row ID clustered index instead."},

{q:"What does a secondary index store in InnoDB?",
 o:["A full copy of the row","The indexed column values plus the primary key value, requiring a lookup into the clustered index","Nothing but a pointer to disk","Only a hash of the row"],a:1,
 e:"Secondary indexes store the indexed columns plus the primary key. A lookup that needs other columns performs an extra 'bookmark lookup' into the clustered index — unless the index is covering."},

{q:"With an index on (a, b, c), which query CANNOT use the index efficiently?",
 o:["WHERE a = 1","WHERE a = 1 AND b = 2","WHERE b = 2","WHERE a = 1 AND b = 2 AND c = 3"],a:2,
 e:"This is the leftmost-prefix rule: a composite index can be used only if the query constrains a leading portion of the index. Filtering on b alone (skipping a) cannot use the index for a range scan."},

{q:"What is a covering index?",
 o:["An index that includes every column of the table","An index containing all the columns the query needs, so no table lookup is required","An encrypted index","An index rebuilt on every write"],a:1,
 e:"When every column referenced by a query is present in the index, the optimizer can answer the query from the index alone (EXPLAIN shows 'Using index'). This eliminates the bookmark lookup and is a major optimization."},

{q:"What does the EXPLAIN statement do?",
 o:["Executes the query faster","Shows the query execution plan: access type, chosen keys, rows examined and extra notes","Logs the query to a file","Creates an index automatically"],a:1,
 e:"EXPLAIN (or EXPLAIN ANALYZE in 8.0.18+) reveals how the optimizer will execute a statement. Look at the type column (ALL is bad, ref/eq_ref/const are good), key, rows and the Extra column."},

{q:"In EXPLAIN output, what does type = ALL mean?",
 o:["A unique index lookup","A full table scan","The query failed","Only one row is read"],a:1,
 e:"type = ALL means MySQL will scan every row of the table. For large tables this is usually the main performance problem to fix, typically by adding an appropriate index."},

{q:"What is the difference between a UNIQUE index and a PRIMARY KEY?",
 o:["A UNIQUE index permits multiple NULLs; a PRIMARY KEY does not permit NULL","They are exactly identical","A table can have only one UNIQUE index","A PRIMARY KEY allows NULL values"],a:0,
 e:"Both enforce uniqueness, but a PRIMARY KEY is non-NULL and there is only one per table. A UNIQUE index allows multiple NULL values (since NULLs are never equal) and you can create many of them."},

{q:"Which column is generally the best candidate for an index?",
 o:["A column with very few distinct values, such as a gender flag","A high-cardinality column with many distinct values, frequently used in WHERE or JOIN","Any column, because more indexes are always better","Only TEXT columns"],a:1,
 e:"High cardinality (high selectivity) means the index can narrow the search to few rows. Low-cardinality columns like boolean flags usually are not worth indexing alone, though they can be useful in composite indexes."},

{q:"What is the downside of adding too many indexes to a table?",
 o:["No effect on performance","They slow down INSERT, UPDATE and DELETE and consume disk and memory","They make SELECT queries slower in all cases","They automatically reduce the table size"],a:1,
 e:"Each index must be updated on every write, so write throughput drops and storage grows. Keep only indexes that support real query patterns, and drop unused ones (check sys.schema_unused_indexes)."},

{q:"What does ANALYZE TABLE do?",
 o:["Rebuilds all indexes","Updates the index statistics used by the query optimizer","Deletes old rows","Compresses the table"],a:1,
 e:"ANALYZE TABLE re-samples index distributions so the optimizer can estimate row counts accurately. Stale statistics commonly cause the optimizer to pick a bad plan."},

{q:"What does the FORCE INDEX hint do?",
 o:["Creates an index","Tells the optimizer to prefer a specific index","Deletes an index","Makes an index unique"],a:1,
 e:"SELECT ... FROM t FORCE INDEX (idx_name) biases the optimizer toward that index. Also available: USE INDEX and IGNORE INDEX. Use these only as a last resort after confirming a bad plan."},

{q:"When would you use a prefix index?",
 o:["To index only the first N characters of a long string column","To index the last characters of a string","To index every word in a text column","Prefix indexes are only for numeric columns"],a:0,
 e:"CREATE INDEX idx ON t (url(50)) indexes only the first 50 characters. This saves space for long VARCHAR/TEXT columns, but the index cannot be used for ORDER BY or as a covering index on the full value."},

{q:"What is a FULLTEXT index used for?",
 o:["Exact numeric comparisons","Natural-language and boolean text searching with relevance ranking","Spatial/geographic data","JSON documents only"],a:1,
 e:"FULLTEXT enables MATCH ... AGAINST queries on CHAR, VARCHAR and TEXT columns with relevance scoring, stopwords and boolean operators (+word, -word, \"phrase\")."},

{q:"What data structure does InnoDB use for its indexes?",
 o:["Hash table","B+Tree","Linked list","Flat array"],a:1,
 e:"InnoDB indexes are B+Trees, which keep data sorted and support range scans, prefix lookups and ordered traversal with a small number of disk reads. MEMORY tables can use HASH indexes; InnoDB also has an adaptive hash index internally."},

/* ---------- 51–65 : Transactions & concurrency ---------- */
{q:"How do you explicitly start a transaction in MySQL?",
 o:["BEGIN; or START TRANSACTION;","OPEN TRANSACTION;","NEW TRANSACTION;","START WORK ONLY;"],a:0,
 e:"BEGIN or START TRANSACTION opens an explicit transaction, ended by COMMIT or ROLLBACK. With autocommit=1 (the default), any statement run outside an explicit transaction commits immediately."},

{q:"What does ROLLBACK do?",
 o:["Permanently saves all changes","Undoes the uncommitted changes of the current transaction","Drops the table","Creates a savepoint"],a:1,
 e:"ROLLBACK discards all changes made since the transaction started (or since the last SAVEPOINT if ROLLBACK TO SAVEPOINT is used). Once committed, changes cannot be rolled back this way."},

{q:"What is the default transaction isolation level in InnoDB?",
 o:["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],a:2,
 e:"InnoDB's default is REPEATABLE READ. Within a transaction, repeated SELECTs see a consistent snapshot, preventing non-repeatable reads. Many production shops deliberately switch to READ COMMITTED."},

{q:"Which anomaly is possible only at the READ UNCOMMITTED isolation level?",
 o:["Dirty read","Non-repeatable read","Phantom read","Deadlock"],a:0,
 e:"A dirty read is reading data written by another transaction that has not yet committed (and might roll back). READ UNCOMMITTED allows it; every stricter level prevents it."},

{q:"Which anomaly does READ COMMITTED still allow?",
 o:["Dirty reads","Non-repeatable reads (the same row can change between two reads in one transaction)","It allows no anomalies at all","It allows phantom reads only"],a:1,
 e:"Under READ COMMITTED each statement sees a fresh snapshot, so re-reading the same row in one transaction can return a different value (a non-repeatable read). Dirty reads are prevented."},

{q:"What does the REPEATABLE READ isolation level guarantee?",
 o:["Repeated reads of the same row within a transaction return the same values","It permits dirty reads","It is not supported by InnoDB","It disables indexes"],a:0,
 e:"REPEATABLE READ takes a consistent snapshot at the first read, so the same query returns the same result throughout the transaction. InnoDB additionally uses gap locks and next-key locks to largely prevent phantom reads."},

{q:"Which isolation level is the strictest and most serialized?",
 o:["SERIALIZABLE","READ COMMITTED","REPEATABLE READ","READ UNCOMMITTED"],a:0,
 e:"SERIALIZABLE makes transactions behave as if executed one after another, typically by converting plain SELECTs into locking reads. It prevents all anomalies but sharply reduces concurrency."},

{q:"What is a phantom read?",
 o:["A new row appearing (or a row disappearing) between two identical range queries in the same transaction","Reading uncommitted data","A deadlock between two sessions","A lock wait timeout"],a:0,
 e:"A phantom read happens when a range query returns a different set of rows the second time because another transaction inserted or deleted matching rows. InnoDB's next-key/gap locks in REPEATABLE READ prevent most cases."},

{q:"What is the purpose of SAVEPOINT?",
 o:["To create a named point within a transaction you can roll back to","To commit the transaction early","To delete the transaction log","To start a new session"],a:0,
 e:"SAVEPOINT sp1; creates a marker. ROLLBACK TO SAVEPOINT sp1; undoes work after that marker while keeping earlier work in the transaction. RELEASE SAVEPOINT removes it."},

{q:"What does InnoDB do when it detects a deadlock?",
 o:["It waits indefinitely","It immediately rolls back one of the transactions with an error (ER_LOCK_DEADLOCK)","It lets both transactions succeed","It restarts the server"],a:1,
 e:"InnoDB detects the circular wait and rolls back the transaction with the smaller amount of work, returning error 1213. Applications should catch this error and retry the transaction."},

{q:"How does InnoDB handle locking?",
 o:["Table-level locks only","Row-level locking with multi-version concurrency control (MVCC)","No locking at all","Database-level locks only"],a:1,
 e:"InnoDB uses row-level locks plus MVCC so readers do not block writers and writers do not block readers. MyISAM, by contrast, uses table-level locks."},

{q:"What does SELECT ... FOR UPDATE do?",
 o:["Reads the rows and locks them exclusively until the transaction ends","Deletes the selected rows","Releases all locks","Creates a view"],a:0,
 e:"FOR UPDATE takes exclusive (write) locks on the selected rows, preventing other transactions from modifying or locking them — essential for read-modify-write logic. FOR SHARE takes shared locks instead."},

{q:"What is MySQL's default autocommit setting?",
 o:["OFF by default","ON by default, so each statement commits immediately unless in an explicit transaction","It cannot be changed","It applies only to MyISAM"],a:1,
 e:"autocommit=1 is the default: every statement is its own transaction. Set autocommit=0 or use START TRANSACTION for multi-statement atomicity. Some drivers implicitly disable autocommit."},

{q:"What does MVCC stand for and what does it provide?",
 o:["Multiversion concurrency control: readers see a consistent snapshot and do not block writers","A backup tool","A replication protocol","A type of index"],a:0,
 e:"MVCC keeps older row versions (via the undo log and hidden transaction IDs) so a consistent-read SELECT can see a snapshot without taking locks. This is why InnoDB reads do not block writes."},

{q:"What is a gap lock in InnoDB?",
 o:["A lock on an index range that prevents inserts, helping prevent phantom reads","A lock on a single row only","A lock on the entire table","A full-text search lock"],a:0,
 e:"Gap locks block inserts into the gaps between index records. Combined with record locks they form next-key locks, which is how REPEATABLE READ largely eliminates phantom reads. Gap locking is disabled under READ COMMITTED."},

/* ---------- 66–85 : Administration & advanced ---------- */
{q:"What does the mysqldump utility do?",
 o:["Starts the MySQL server","Creates a logical backup of databases as SQL statements","Repairs corrupted tables","Shows currently running queries"],a:1,
 e:"mysqldump produces a text file of CREATE TABLE and INSERT statements (or delimited data with --tab) that can be replayed to restore. For large databases, physical backups such as MySQL Enterprise Backup or Percona XtraBackup are faster."},

{q:"What is the purpose of the MySQL binary log?",
 o:["It records data-changing events for replication and point-in-time recovery","It stores error messages","It stores slow queries","It caches query results"],a:0,
 e:"The binary log records committed data changes (statement-, row- or mixed-format). It is the basis of replication and allows point-in-time recovery by replaying from a backup plus binlogs."},

{q:"How does standard MySQL replication work?",
 o:["The source writes changes to its binary log; the replica pulls them and applies them from a relay log","The replica writes to the source's binary log","Replication is fully synchronous only","Replication requires MyISAM tables"],a:0,
 e:"The replica's I/O thread reads the source's binary log and writes to a local relay log; the SQL (applier) thread replays it. This is asynchronous by default; semi-synchronous replication waits for at least one replica acknowledgment."},

{q:"What is a GTID in MySQL replication?",
 o:["A globally unique identifier for each transaction, which simplifies failover and topology changes","A type of index","A user privilege","A backup file format"],a:0,
 e:"A GTID (source_uuid:transaction_id) uniquely identifies each transaction across the whole replication topology. With GTID-based replication, a replica knows exactly which transactions it has applied, making failover and re-pointing much simpler."},

{q:"What does table partitioning do in MySQL?",
 o:["Splits a large table into smaller physical parts that remain one logical table","Creates a full copy of the database","Duplicates every row","Removes all indexes"],a:0,
 e:"Partitioning (RANGE, LIST, HASH, KEY) stores rows in separate physical partitions while applications query one table. Partition pruning lets queries scan only relevant partitions; the partition key must be part of every unique key."},

{q:"How do you execute a stored procedure in MySQL?",
 o:["EXEC proc_name();","RUN proc_name();","CALL proc_name();","SELECT proc_name();"],a:2,
 e:"Stored procedures are invoked with CALL proc_name(args);. They can contain control flow, transactions and multiple result sets. Functions, by contrast, are called inside expressions with SELECT."},

{q:"When does a trigger execute?",
 o:["Automatically BEFORE or AFTER an INSERT, UPDATE or DELETE on its table","Only when called manually","Only on SELECT statements","Only during backup"],a:0,
 e:"Triggers fire automatically for each row affected by DML. They are useful for auditing and enforcing complex rules, but they add hidden overhead and can make logic hard to trace."},

{q:"What is a view in MySQL?",
 o:["A virtual table defined by a stored SELECT statement","A physical copy of a table","An index structure","A backup snapshot"],a:0,
 e:"A view stores a query, not data. It can simplify complex joins and restrict column exposure. Simple views are updatable; views with aggregates, DISTINCT or UNION generally are not."},

{q:"What does the ROW_NUMBER() window function do?",
 o:["Assigns a unique sequential number to each row within its window partition","Counts the total rows in the table","Returns the maximum value","Removes duplicate rows"],a:0,
 e:"ROW_NUMBER() OVER (PARTITION BY x ORDER BY y) numbers rows per partition with no ties. RANK() leaves gaps after ties; DENSE_RANK() does not. All three are MySQL 8.0+ features."},

{q:"What is a Common Table Expression (CTE)?",
 o:["A temporary named result set defined with WITH, usable within a single statement","A permanent table","A type of index","A stored function"],a:0,
 e:"WITH cte AS (SELECT ...) SELECT ... FROM cte; improves readability and allows recursive queries with WITH RECURSIVE, e.g. traversing a manager hierarchy. MySQL 8.0+."},

{q:"How do you extract a value from a JSON column in MySQL?",
 o:["JSON_EXTRACT(doc, path) or the -> operator","JSON.GET()","GET_JSON()","JSON_FETCH()"],a:0,
 e:"JSON_EXTRACT(doc, '$.name') returns a JSON value; the -> operator is shorthand. Use ->> to return an unquoted SQL string: doc->>'$.name'. Also useful: JSON_UNQUOTE, JSON_SET, JSON_TABLE."},

{q:"What is a generated column?",
 o:["A column whose value is computed automatically from an expression","A column that auto-increments","A hidden primary key","A temporary table column"],a:0,
 e:"Generated columns can be VIRTUAL (computed on read) or STORED (computed on write). Example: total DECIMAL(10,2) AS (price * qty) STORED. Stored generated columns can be indexed."},

{q:"Which statement grants privileges to a MySQL user?",
 o:["GRANT SELECT ON db.* TO 'user'@'host';","ALLOW SELECT TO user;","PERMIT SELECT ON db.*;","ASSIGN SELECT TO user;"],a:0,
 e:"GRANT assigns privileges; REVOKE removes them. Follow the principle of least privilege and remember that in MySQL 8.0, CREATE USER must be run before GRANT."},

{q:"When is FLUSH PRIVILEGES needed?",
 o:["When you modify the grant tables directly (e.g. with INSERT/UPDATE) rather than with GRANT/REVOKE","After every GRANT statement","To delete all users","To clear the query cache"],a:0,
 e:"GRANT and REVOKE update the in-memory privilege structures automatically. FLUSH PRIVILEGES reloads them from the mysql system tables — necessary only after direct manipulation of those tables."},

{q:"Why is utf8mb4 preferred over MySQL's utf8 charset?",
 o:["utf8mb4 supports full 4-byte UTF-8 including emoji; MySQL's utf8 is limited to 3 bytes","They are exactly the same","utf8mb4 only supports ASCII","utf8mb4 is not supported by InnoDB"],a:0,
 e:"MySQL's 'utf8' alias means utf8mb3, which cannot store 4-byte characters such as emoji. utf8mb4 is the true UTF-8 encoding and has been the server default since MySQL 8.0."},

{q:"What is the slow query log used for?",
 o:["Recording queries that take longer than long_query_time so they can be optimized","Recording all login attempts","Recording replication events","Recording server errors"],a:0,
 e:"Enable slow_query_log and set long_query_time (e.g. 1 second). The log — or the sys.statements_with_runtimes_in_95th_percentile view — is the starting point for query optimization work."},

{q:"What does the performance_schema database provide?",
 o:["Detailed low-level instrumentation of server execution: waits, statements, stages, locks and memory","Storage for application user data","A backup facility","A pluggable storage engine for user tables"],a:0,
 e:"performance_schema collects in-server instrumentation with minimal overhead. The sys schema builds friendly views on top of it, such as statements_with_full_table_scans and schema_unused_indexes."},

{q:"Which is generally the most important InnoDB tuning parameter?",
 o:["innodb_buffer_pool_size — it caches data and index pages in memory","max_connections","character_set_server","log_bin"],a:0,
 e:"The buffer pool should hold the working set of data and indexes — often 60–80% of RAM on a dedicated database server. A too-small buffer pool forces disk I/O on nearly every read."},

{q:"How can you find the size of a table in MySQL?",
 o:["Query information_schema.TABLES (data_length + index_length)","Query information_schema.SIZES","Run SHOW TABLESIZE","SELECT SIZE FROM TABLE"],a:0,
 e:"SELECT table_name, ROUND((data_length+index_length)/1024/1024,2) AS mb FROM information_schema.TABLES WHERE table_schema='db'; These figures are approximate for InnoDB."},

{q:"How can you check how far a replica has fallen behind its source?",
 o:["SHOW REPLICA STATUS and look at Seconds_Behind_Source","Run SHOW LAG","SELECT REPLICA_DELAY()","Query INFORMATION_SCHEMA.LAG"],a:0,
 e:"Seconds_Behind_Source (formerly Seconds_Behind_Master) is an estimate of replication lag. For accuracy, use heartbeats (pt-heartbeat) or check GTID gaps, since the built-in value can be misleading during idle periods."},

/* ---------- 86–100 : MySQL 8.0 / 9.x features ---------- */
{q:"What is an invisible index in MySQL 8.0+?",
 o:["An index the optimizer ignores but that is still maintained on writes, useful for safely testing index removal","An index that cannot be dropped","An encrypted index","A temporary index"],a:0,
 e:"ALTER TABLE t ALTER INDEX idx INVISIBLE; hides the index from the optimizer while keeping it up to date. This lets you verify that an index is truly unused before dropping it, with instant rollback."},

{q:"What did MySQL 8.0 change about descending indexes?",
 o:["It added true descending indexes; before 8.0 the DESC keyword was parsed but ignored","Descending indexes are impossible in MySQL","Only PRIMARY KEY can be descending","DESC was always honored before 8.0"],a:0,
 e:"Before 8.0, DESC in an index definition was silently ignored. MySQL 8.0 supports genuine descending index key parts, which matters for composite indexes used with mixed ORDER BY directions."},

{q:"What changed about CHECK constraints in MySQL 8.0.16?",
 o:["They became actually enforced; previously they were parsed and silently ignored","They were removed","They only work in MyISAM","They replaced foreign keys"],a:0,
 e:"Before 8.0.16, CHECK clauses were accepted but never evaluated. Since 8.0.16 they are enforced for INSERT and UPDATE, and a violation raises error 3819."},

{q:"What is atomic DDL in MySQL 8.0?",
 o:["DDL statements are either fully applied or fully rolled back, leaving no partial metadata changes","DDL can no longer be rolled back","DDL became faster than DML","DDL now requires MyISAM"],a:0,
 e:"MySQL 8.0 stores DDL in a transactional data dictionary, so a crash during ALTER TABLE no longer leaves a half-applied schema. This fixed a long-standing class of corrupt-metadata bugs."},

{q:"What is the default character set in MySQL 8.0?",
 o:["latin1","utf8mb4","utf8 (utf8mb3)","ascii"],a:1,
 e:"MySQL 8.0 changed the default from latin1/utf8 to utf8mb4 with the utf8mb4_0900_ai_ci collation, finally making full 4-byte Unicode the out-of-the-box behavior."},

{q:"What are roles in MySQL 8.0?",
 o:["Named collections of privileges that can be granted to multiple users","A type of index","A replication topology mode","A storage engine"],a:0,
 e:"CREATE ROLE 'app_read'; GRANT SELECT ON db.* TO 'app_read'; GRANT 'app_read' TO 'alice'@'%'; Roles simplify privilege management. Use SET DEFAULT ROLE to activate them at login."},

{q:"What did MySQL 8.0.18 introduce for joins?",
 o:["Hash joins for equi-join conditions when no suitable index exists","A new storage engine","Synchronous replication","Descending indexes"],a:0,
 e:"Hash join builds an in-memory hash table from the smaller input, which is much faster than nested-loop scans for large unindexed equi-joins. EXPLAIN shows 'Using join buffer (hash join)'."},

{q:"What are lateral derived tables in MySQL 8.0.14+?",
 o:["Derived tables declared with LATERAL that can reference columns from preceding tables in the FROM clause","A type of index hint","A window function","A partitioning method"],a:0,
 e:"LATERAL allows something like a correlated subquery in the FROM clause: FROM t, LATERAL (SELECT ... WHERE x = t.id LIMIT 1) AS d. Without LATERAL, derived tables cannot reference sibling tables."},

{q:"In MySQL 9.6, what major architectural change was made to foreign keys?",
 o:["Foreign key constraint checks and cascade actions are now handled by the SQL layer instead of InnoDB","Foreign keys were removed entirely","Cascades are no longer logged","Foreign keys now require a plugin"],a:0,
 e:"Previously InnoDB performed cascaded child-row changes internally and those changes were invisible to the binary log, so CDC and replication tools could miss them. With SQL-layer enforcement every cascaded change is logged, giving complete audit trails and reliable downstream replication. Oracle reports performance is nearly identical."},

{q:"Which startup variable lets you temporarily restore the old InnoDB-level foreign key behavior in MySQL 9.6?",
 o:["innodb_fk_legacy","foreign_key_mode=innodb","innodb_native_foreign_keys","sql_layer_fk=off"],a:2,
 e:"innodb_native_foreign_keys restores the legacy InnoDB handling. It exists only for validating a migration, and Oracle has indicated it may be removed in a future release, so treat it as temporary."},

{q:"What happened to the MD5() and SHA1() functions in MySQL 9.6?",
 o:["They were removed entirely","They moved to the separate classic_hashing component","They moved to a deprecated_funcs plugin","Nothing changed"],a:1,
 e:"MD5() and SHA1() were moved into the classic_hashing component so weak hashing algorithms are not available by accident. Install the component if you still need them, or better, migrate to SHA2()."},

{q:"What does the container_aware startup option do in MySQL 9.6?",
 o:["Lets the server discover and respect CPU and memory limits set by container environments such as Docker","Enables Docker installation","Disables the buffer pool","Turns on replication"],a:0,
 e:"container_aware lets the server detect cgroup limits so it does not size internal buffers based on the host's full memory, which previously caused OOM kills in memory-constrained containers."},

{q:"What is the VECTOR data type introduced in MySQL 9.0?",
 o:["A native type for storing vector embeddings, aimed at AI/ML and similarity-search workloads","A type of index","A replication feature","An alias for JSON"],a:0,
 e:"VECTOR stores arrays of floats for embeddings, with supporting distance functions and a vector index. It brings similarity search into the database instead of requiring a separate vector store."},

{q:"What is the status of the mysql_native_password authentication plugin in MySQL 9.x?",
 o:["It is deprecated and disabled by default in favour of caching_sha2_password","It is the recommended default","It was never deprecated","It is required for replication"],a:0,
 e:"mysql_native_password was deprecated in 8.0 and is disabled by default in MySQL 9.x. caching_sha2_password is the default; older clients and drivers must be updated before upgrading."}
];

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

/* ---------- Timer ---------- */
function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

/* ---------- Palette ---------- */
function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

/* ---------- Progress ---------- */
function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

/* ---------- Render question ---------- */
function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').innerHTML = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.innerHTML = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  // explanation
  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').innerHTML =
      '✅ Correct answer: <b>' + LETTERS[q.a] + '</b> — ' + q.o[q.a];
    $('explainText').innerHTML = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  // button states
  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Actions ---------- */
function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;  // click again to clear
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

/* ---------- Submit / Results ---------- */
function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Test Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }
    if(state.ans[i] === q.a && state.ans[i] !== null){
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  // wire up results buttons
  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

/* ---------- Wiring ---------- */
$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

/* ---------- Boot ---------- */
$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
