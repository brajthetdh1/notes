<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes Mock Test — Set 1 · 100 MCQs</title>
<meta name="description" content="100 Kubernetes MCQs with explanations: architecture, pods, deployments, services, storage, scheduling, RBAC, probes, autoscaling, kubectl and troubleshooting.">
<style>
  :root{
    --brand:#326ce5;
    --brand-dark:#1e3a8a;
    --accent:#60a5fa;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#062b5c;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#dbeafe;border-color:#bfdbfe}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(50,108,229,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#eff6ff}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#dbeafe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">☸️ Kubernetes Mock Test <span class="setpill">SET 1</span> <span class="pill" id="qcountPill">100 Questions</span></div>
  <div class="timer" id="timer">120:00</div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>
      <span><i class="lg-ans"></i>Answered</span>
      <span><i class="lg-mark"></i>Marked</span>
      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="options" id="options"></div>
        <div class="explain" id="explainBox" hidden>
          <div class="explain-title" id="explainTitle"></div>
          <div class="explain-body" id="explainText"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">← Previous</button>
        <button class="btn ghost" id="btnMark">★ Mark for Review</button>
        <button class="btn warn"  id="btnShow">👁 Show Answer</button>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
      <div class="hint">Keyboard: <b>1–4</b> select option · <b>← →</b> navigate · <b>R</b> mark for review · <b>S</b> show answer</div>
    </div>

    <div id="resultView" hidden></div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK — KUBERNETES SET 1 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Core architecture ---------- */
{q:'What is the smallest deployable unit in Kubernetes?',
 o:['A container','A Pod','A Deployment','A Node'],a:1,
 e:'A Pod is the smallest deployable object. It wraps one or more containers that share a network namespace, a hostname and any declared volumes.'},

{q:'Which control-plane component decides which node a newly created Pod should run on?',
 o:['kube-apiserver','kube-controller-manager','kube-scheduler','kubelet'],a:2,
 e:'kube-scheduler watches for Pods with no nodeName, filters and scores the eligible nodes using resources, affinity, taints and topology rules, then binds the Pod to a node.'},

{q:'Which component stores the entire cluster state, including the desired state of every object?',
 o:['etcd','kube-proxy','kubelet','kube-scheduler'],a:0,
 e:'etcd is the consistent key-value store that holds the source of truth. The API server is the only component that talks to it directly; everything else reads and writes through the API.'},

{q:'What is kubelet?',
 o:['A CNI plugin','The agent running on each node that ensures containers described by PodSpecs are running and healthy','The load balancer for Services','The CLI used to talk to the API server'],a:1,
 e:'kubelet runs on every worker node. It watches PodSpecs assigned to its node, starts and stops containers via the container runtime, mounts volumes, runs probes and reports status back to the API server.'},

{q:'Which node component implements the virtual IPs behind Services?',
 o:['CoreDNS','kube-proxy','kube-scheduler','etcd'],a:1,
 e:'kube-proxy programs iptables, IPVS or nftables rules on each node so traffic to a Service ClusterIP is forwarded to one of the ready Pod endpoints.'},

{q:'What is the role of the kube-apiserver?',
 o:['It runs containers on nodes','It schedules pods to nodes','It is the front end of the control plane — the only component that talks to etcd and the single entry point for all REST operations','It stores cluster state'],a:2,
 e:'Every component, including kubelet and controllers, talks to the cluster through the API server. It validates, authenticates, authorises, applies admission controllers and persists the result to etcd.'},

{q:'Which command shows the address of the API server and other control-plane endpoints?',
 o:['kubectl info','kubectl cluster-info','kubectl get endpoints','kubectl config view'],a:1,
 e:'kubectl cluster-info prints the control-plane URL and the addon endpoints such as CoreDNS. If it fails, kubectl is not connected to a reachable cluster.'},

{q:'What is the primary purpose of a Namespace?',
 o:['To provide network isolation between Pods','To logically partition cluster resources so names, RBAC and quotas can be scoped per team or environment','To schedule Pods onto specific nodes','To encrypt Secrets'],a:1,
 e:'Namespaces are virtual clusters inside a physical cluster. Names must be unique within a namespace, and RBAC roles, resource quotas and network policies can be scoped per namespace.'},

{q:'What is the key difference between kubectl create and kubectl apply?',
 o:['create is declarative; apply is imperative','They are interchangeable','apply is declarative and records what was last applied; create is imperative and fails if the object already exists','apply only works with YAML, create only with JSON'],a:2,
 e:'apply stores a last-applied annotation so it can compute a three-way merge on later runs, making it idempotent. create simply sends a create request and errors if the object exists.'},

{q:'What format are Kubernetes manifests usually written in?',
 o:['XML','YAML or JSON','TOML','Protobuf'],a:1,
 e:'YAML is the idiomatic format because it is human-friendly; the API also accepts JSON. Both are serialised into the same JSON structure that the API server validates.'},

/* ---------- 11–20 : Workloads ---------- */
{q:'When a Pod has multiple containers, what do they share?',
 o:['Nothing — each has its own isolated network','The network namespace (including localhost) and any declared volumes, but not the filesystem','The same PID namespace by default','The same filesystem root'],a:1,
 e:'Containers in a Pod share the network namespace, so they talk over localhost, and they share Pod-level volumes. They do not share a process namespace unless shareProcessNamespace is set.'},

{q:'What is an init container?',
 o:['A container that runs after the app containers and cleans up','A container that runs to completion before the app containers start, useful for setup tasks like schema migration','A sidecar for logging','A container that restarts on failure'],a:1,
 e:'Init containers run sequentially and must exit successfully before the app containers start. If one fails, the Pod is restarted according to its restart policy.'},

{q:'What is a sidecar container in a Pod?',
 o:['A container that runs before the main app','A helper container that runs alongside the main container for cross-cutting concerns such as logging, proxying or metrics','A container used only for init tasks','A container that runs only on the control plane'],a:1,
 e:'The sidecar pattern co-locates a companion process in the same Pod so it shares the network and volumes, for example a service mesh proxy or a log shipper.'},

{q:'What does a ReplicaSet guarantee?',
 o:['That Pods are scheduled on every node','That a specified number of identical Pod replicas are running at all times','That Pods restart at midnight','That a Pod has a stable network identity'],a:1,
 e:'A ReplicaSet maintains the desired replica count. If a Pod dies, is deleted, or an extra one appears, the ReplicaSet controller creates or removes Pods to reconcile the count.'},

{q:'What does a Deployment add over a bare ReplicaSet?',
 o:['Nothing — they are the same thing','Rolling updates, rollback, scaling and revision history, while managing the ReplicaSet for you','Stateful storage','Node affinity rules'],a:1,
 e:'A Deployment owns one or more ReplicaSets and shifts traffic between them during a rollout, so you get declarative updates, rollbacks and history without managing ReplicaSets by hand.'},

{q:'What is the default update strategy for a Deployment?',
 o:['Recreate','RollingUpdate','BlueGreen','Canary'],a:1,
 e:'RollingUpdate replaces Pods gradually, respecting maxSurge and maxUnavailable (both 25% by default). Recreate is opt-in and causes downtime because all Pods are killed first.'},

{q:'How do you roll back a Deployment to its previous revision?',
 o:['kubectl revert deployment/myapp','kubectl rollout undo deployment/myapp','kubectl apply --previous','kubectl delete deployment/myapp'],a:1,
 e:'kubectl rollout undo restores the previous ReplicaSet. Use --to-revision=N to go to a specific revision, and kubectl rollout history to list the revisions.'},

{q:'What is a StatefulSet designed for?',
 o:['Stateless web servers','Applications that need stable network identity, stable storage per replica and ordered create/delete','Batch jobs','Running a Pod on every node'],a:1,
 e:'StatefulSets give each replica a stable ordinal name (app-0, app-1), a stable DNS name and its own PersistentVolumeClaim via volumeClaimTemplates. Ordering and graceful scaling make them right for databases.'},

{q:'What does a DaemonSet do?',
 o:['Runs one Pod on every eligible node, typically for node-level agents such as log shippers or CNI daemons','Runs a Pod at a fixed time','Runs a Pod only on the control plane','Runs a Pod only when a condition is met'],a:0,
 e:'DaemonSets schedule one Pod per node that matches their selector and tolerations. Node agents, monitoring agents and storage daemons are common examples.'},

{q:'What is the difference between a Job and a CronJob?',
 o:['A Job runs on a schedule; a CronJob runs once','A Job runs to completion once; a CronJob creates Jobs on a cron schedule','They are the same object with different names','A CronJob cannot be scheduled'],a:1,
 e:'A Job manages Pods until a target number of successful completions is reached. A CronJob uses a five-field cron expression to create Jobs at intervals.'},

/* ---------- 21–30 : Services & networking ---------- */
{q:'What is a ClusterIP Service?',
 o:['A virtual IP reachable only from inside the cluster, with load balancing across matching Pods','A public IP on each node','A cloud load balancer','A DNS alias with no proxy'],a:0,
 e:'ClusterIP is the default Service type. It gives a stable in-cluster IP and DNS name, and kube-proxy distributes traffic to the ready Pods matching the selector.'},

{q:'What does a NodePort Service do?',
 o:['Provisions a cloud load balancer','Opens a static port on every node and forwards traffic to the Service','Creates only a DNS record','Gives the Service a public IP directly'],a:1,
 e:'NodePort allocates a port in 30000-32767 by default (configurable via --service-node-port-range on the API server) and forwards traffic arriving on any node to the Service.'},

{q:'What does a LoadBalancer Service provision?',
 o:['A TCP proxy inside the cluster','An external load balancer through the cloud provider (or MetalLB on bare metal), which forwards traffic to the Service','Only a DNS CNAME','A new Ingress controller'],a:1,
 e:'LoadBalancer builds on NodePort and asks the cloud provider for an external LB. On clusters without a cloud provider, a controller such as MetalLB or kube-vip must supply the external IP.'},

{q:'What does an ExternalName Service do?',
 o:['Creates endpoints for pods outside the cluster','Returns a CNAME record to an external DNS name without proxying traffic','Assigns an external IP','Provisions a load balancer'],a:1,
 e:'ExternalName maps the Service name to a DNS name via a CNAME. No ClusterIP or endpoints are created, and traffic goes directly from the client to the target DNS name.'},

{q:'What makes a Service "headless"?',
 o:['It has no selector','It sets clusterIP: None, so DNS returns the individual Pod IPs instead of a virtual IP','It has no ports','It uses ExternalName'],a:1,
 e:'Headless Services expose Pod IPs directly through DNS A records. They are commonly used with StatefulSets so clients can address a specific replica by name.'},

{q:'What is an Ingress?',
 o:['A TCP load balancer','An API object that defines L7 HTTP/HTTPS routing rules (host and path based) into Services','A node-level proxy','A CNI plugin'],a:1,
 e:'Ingress describes host and path routing, TLS termination and similar HTTP concerns. It only takes effect when an Ingress controller is installed in the cluster.'},

{q:'Which of these is an Ingress controller?',
 o:['kube-proxy','ingress-nginx','CoreDNS','kube-scheduler'],a:1,
 e:'ingress-nginx is a popular controller that watches Ingress resources and configures an nginx deployment to implement them. Traefik, HAProxy and cloud-native controllers are alternatives.'},

{q:'What is the role of a CNI plugin?',
 o:['To schedule pods','To provide pod networking — IP allocation, routing and often network policy enforcement','To store cluster state','To terminate TLS'],a:1,
 e:'The Container Network Interface is a spec that networking plugins implement. Calico, Cilium, Flannel and Antrea are common choices; the choice determines NetworkPolicy support and performance.'},

{q:'What is the default NodePort range?',
 o:['1024-65535','1-1024','30000-32767','8000-9000'],a:2,
 e:'NodePort allocates from 30000-32767 by default. The range is configurable through the API server flag --service-node-port-range.'},

{q:'What does a NetworkPolicy do?',
 o:['Encrypts traffic between pods','Defines L3/L4 allow rules for which pods can talk to which pods or endpoints','Assigns IPs to pods','Load-balances traffic across pods'],a:1,
 e:'NetworkPolicy selects pods and specifies allowed ingress and egress. Enforcement requires a CNI that supports it — Calico, Cilium and Antrea do; a bare Flannel install does not.'},

/* ---------- 31–40 : Config & storage ---------- */
{q:'What is a ConfigMap for?',
 o:['Storing secrets','Storing non-sensitive configuration as key-value pairs or files that can be mounted or injected into Pods','Persisting database data','Defining network rules'],a:1,
 e:'ConfigMaps decouple configuration from images. They can be consumed as environment variables, command-line arguments, or mounted files, and updated without rebuilding.'},

{q:'How is data stored in a Secret by default?',
 o:['Encrypted with the cluster key','Base64-encoded, which is encoding not encryption, and stored in etcd as plaintext unless encryption at rest is configured','Hashed with SHA256','Compressed and encrypted'],a:1,
 e:'A base64 value is trivially reversible. Enable EncryptionConfiguration on the API server and restrict RBAC on Secrets; base64 alone is not a security boundary.'},

{q:'What is an emptyDir volume?',
 o:['A volume that persists beyond the Pod','An ephemeral scratch directory created when the Pod is scheduled and deleted when the Pod is removed','A PVC backed by a cloud disk','A host directory mounted into the Pod'],a:1,
 e:'emptyDir is useful for scratch space or for sharing files between containers in a Pod. Its lifetime is tied to the Pod, and by default it lives on node disk (or in tmpfs with medium: Memory).'},

{q:'What is a hostPath volume?',
 o:['A portable volume across nodes','A volume that mounts a file or directory from the node filesystem into the Pod, which couples the Pod to a specific node','A cloud block device','A projected volume'],a:1,
 e:'hostPath is common for node-level agents but is risky: it exposes node files, ties the Pod to that node, and is a frequent privilege-escalation vector in multi-tenant clusters.'},

{q:'What is the difference between a PersistentVolume and a PersistentVolumeClaim?',
 o:['They are interchangeable','A PV is a piece of storage provisioned in the cluster; a PVC is a request for storage that binds to a PV','A PVC is the physical disk and PV is the request','PV is only for StatefulSets'],a:1,
 e:'The PV is the cluster-level resource (administrator or dynamic provisioning creates it). The PVC is the user request. A PVC binds to a matching PV, and Pods mount the claim.'},

{q:'What does a StorageClass enable?',
 o:['Automatic creation of PVCs','Dynamic provisioning of PersistentVolumes based on a named storage backend and parameters','Encryption of Secrets','Scheduling of stateful pods'],a:1,
 e:'When a PVC names a StorageClass, the provisioner creates a matching PV automatically. StorageClasses are cluster-scoped and define parameters such as disk type, replication and reclaim policy.'},

{q:'Which access mode allows a volume to be mounted read-write by a single node?',
 o:['ReadWriteMany (RWX)','ReadOnlyMany (ROX)','ReadWriteOnce (RWO)','ReadWriteOncePod (RWOP)'],a:2,
 e:'RWO allows read-write mounting by one node (multiple pods on that node can share it). RWX needs a shared filesystem such as NFS or CephFS; RWOP restricts to a single Pod.'},

{q:'What is the maximum size of a single ConfigMap?',
 o:['1 MiB','100 MiB','10 MiB','Unlimited'],a:0,
 e:'Kubernetes enforces a 1 MiB limit per ConfigMap and Secret because they are stored in etcd, which has a request-size limit. Store large blobs in object storage instead.'},

{q:'What is a projected volume?',
 o:['A volume that presents a projection of the host filesystem','A volume that combines multiple sources (Secrets, ConfigMaps, downwardAPI, serviceAccountToken) into a single directory','A volume that mirrors another Pod','A PVC bound to a StorageClass'],a:1,
 e:'Projected volumes are how the bound ServiceAccount token is injected. They let several small configuration sources appear as one mountpoint inside the container.'},

{q:'What does volumeClaimTemplates in a StatefulSet provide?',
 o:['A template for the Deployment','A per-replica PVC created for each StatefulSet Pod, so each replica gets its own stable storage','A shared PVC for all replicas','A ConfigMap for storage settings'],a:1,
 e:'Each Pod gets its own PVC named <template-name>-<statefulset-name>-<ordinal>. Deleting the StatefulSet does not automatically delete these PVCs, protecting data by default.'},

/* ---------- 41–50 : Scheduling & resources ---------- */
{q:'What are taints and tolerations?',
 o:['A way to pin Pods to nodes by label','A mechanism where a node repels Pods unless the Pod declares a matching toleration','A pod restart policy','A type of volume'],a:1,
 e:'Taints live on nodes and tolerations live on Pods. Common uses are dedicating GPU nodes or keeping general workloads off the control plane.'},

{q:'What is node affinity used for?',
 o:['Attaching volumes to nodes','Constraining which nodes a Pod can be scheduled on based on node labels','Choosing which containers run in a Pod','Setting resource limits'],a:1,
 e:'requiredDuringSchedulingIgnoredDuringExecution and preferredDuringScheduling... express hard and soft constraints. Node selectors are the simpler, equality-only version of the same idea.'},

{q:'What does pod anti-affinity provide?',
 o:['Keeping Pods together on the same node','Spreading Pods apart so replicas do not land on the same node or topology domain','Pinning a Pod to a node','Setting Pod priority'],a:1,
 e:'Anti-affinity is used for high availability, for example ensuring the replicas of a web tier land on different zones or nodes.'},

{q:'What is the difference between a resource request and a resource limit?',
 o:['They are the same','A request is what the scheduler reserves for the Pod; a limit is the maximum the container may use at runtime','A request is the maximum and a limit is the minimum','A limit only applies to CPU'],a:1,
 e:'Requests drive scheduling and QoS. Limits are enforced by cgroups: CPU is throttled at the limit while memory over-use triggers the OOM killer.'},

{q:'What happens when a container exceeds its memory limit?',
 o:['It is throttled','It is OOMKilled (exit code 137) and restarted according to the Pod restart policy','It is moved to another node','Nothing happens'],a:1,
 e:'Memory is incompressible. The kernel OOM killer terminates the process, the kubelet records the OOMKill, and the container restarts if the Pod restart policy allows it.'},

{q:'What happens when a container exceeds its CPU limit?',
 o:['It is OOMKilled','It is throttled by the cgroup CPU quota','It is evicted from the node','It is rescheduled'],a:1,
 e:'CPU is compressible. Exceeding the quota causes throttling (visible in cpu_cfs_throttled metrics), not termination, which often shows up as latency rather than errors.'},

{q:'What are the three Kubernetes QoS classes?',
 o:['Low, Medium, High','Guaranteed, Burstable, BestEffort','Critical, Normal, Low','Standard, Premium, Basic'],a:1,
 e:'Guaranteed means every container has requests equal to limits for both CPU and memory. Burstable means some are set but not equal. BestEffort means none are set. The class determines eviction order under pressure.'},

{q:'What is a PriorityClass used for?',
 o:['To set a Pod restart policy','To give a Pod a scheduling priority so the scheduler can preempt lower-priority Pods when the node is full','To set a Pod resource limit','To label a Pod'],a:1,
 e:'Pods with a higher priority value can evict lower-priority Pods on a full node. Setting preemptionPolicy: Never makes a Pod preemptible but never preempting.'},

{q:'What is a PodDisruptionBudget for?',
 o:['Limiting Pod CPU','Ensuring a minimum number of Pods remain available during voluntary disruptions such as node drains and upgrades','Defining a Pod restart policy','Setting Pod priority'],a:1,
 e:'A PDB expresses intent like minAvailable: 2 or maxUnavailable: 1. kubectl drain and cluster autoscaler respect it, which prevents accidental full outages during maintenance.'},

{q:'What does kubectl drain do?',
 o:['Deletes the node','Cordons the node and evicts its Pods (respecting PDBs and skipping DaemonSet Pods unless --ignore-daemonsets is set)','Restarts all Pods on the node','Reboots the node'],a:1,
 e:'drain prepares a node for maintenance. Use kubectl cordon to just mark it unschedulable, and kubectl uncordon to bring it back into rotation.'},

/* ---------- 51–60 : Security & RBAC ---------- */
{q:'What is the difference between a Role and a ClusterRole?',
 o:['A Role is cluster-wide; a ClusterRole is namespaced','A Role grants permissions within a namespace; a ClusterRole grants permissions cluster-wide or across all namespaces','They are identical','A ClusterRole can only be used by the API server'],a:1,
 e:'ClusterRoles also cover cluster-scoped resources such as nodes and PersistentVolumes, and can be bound inside a namespace with a RoleBinding when reuse across namespaces is needed.'},

{q:'What is a RoleBinding used for?',
 o:['To define a role','To grant the permissions in a Role or ClusterRole to a user, group or ServiceAccount within a namespace','To mount a Secret','To create a Pod'],a:1,
 e:'A RoleBinding references a Role (same namespace) or a ClusterRole and grants those permissions to the subjects inside that namespace. ClusterRoleBinding is cluster-wide.'},

{q:'What is a ServiceAccount?',
 o:['A user account for human operators','An identity for Pods to authenticate to the API server and other services','A secret used for TLS','A type of ConfigMap'],a:1,
 e:'Every Pod runs as a ServiceAccount, by default the "default" one in its namespace. Its projected token is mounted into the Pod and is what RBAC subjects are bound to.'},

{q:'What does automountServiceAccountToken: false do?',
 o:['Deletes the ServiceAccount','Stops the token from being mounted into the Pod, reducing the impact if the Pod is compromised','Disables RBAC','Removes the namespace'],a:1,
 e:'Set it on the Pod or ServiceAccount when the workload does not call the Kubernetes API. Many applications do not, so removing the token is a cheap security win.'},

{q:'What replaced PodSecurityPolicy, which was removed in Kubernetes 1.25?',
 o:['OPA Gatekeeper','Pod Security Admission (PSA), using the pod-security.kubernetes.io labels on namespaces','NetworkPolicy','SecurityContext'],a:1,
 e:'PSA is built into the API server and enforces one of three Pod Security Standards levels. Admission webhooks such as Gatekeeper and Kyverno provide richer policy engines.'},

{q:'What are the three Pod Security Standards levels?',
 o:['Low, Medium, High','Privileged, Baseline, Restricted','Open, Standard, Locked','Default, Strict, Custom'],a:1,
 e:'Privileged has no restrictions. Baseline blocks known privilege escalations. Restricted enforces hardened best practices such as non-root, dropped capabilities and a read-only root filesystem.'},

{q:'What is securityContext used for?',
 o:['Setting container resource limits','Configuring security settings such as runAsUser, runAsNonRoot, capabilities and readOnlyRootFilesystem at Pod or container level','Defining RBAC rules','Encrypting Secrets'],a:1,
 e:'Some fields (runAsUser, fsGroup, seccompProfile) are Pod-level; others (capabilities, allowPrivilegeEscalation) are container-level. Container-level settings override the Pod-level defaults.'},

{q:'What is an admission controller?',
 o:['A component that intercepts requests to the API server after authentication and authorization, and can mutate or reject them','A load balancer for Pods','A CNI plugin','A scheduler plugin'],a:0,
 e:'Built-in admission controllers enforce things like namespaces and resource quotas. ValidatingAdmissionWebhooks reject bad requests; MutatingAdmissionWebhooks modify them before validation.'},

{q:'Which authorizer mode is used by kubelets by default?',
 o:['AlwaysAllow','Node, which authorises kubelets to read the objects tied to the Pods scheduled on their node','AlwaysDeny','RBAC only'],a:1,
 e:'The Node authorizer restricts kubelet access based on which Pods run on its node, and RBAC typically handles everything else. This is why kubelet credentials should never be shared.'},

{q:'Which command checks whether an identity can perform a specific action?',
 o:['kubectl get roles','kubectl auth can-i get pods --namespace=default','kubectl check access','kubectl policy test'],a:1,
 e:'kubectl auth can-i answers from the perspective of the current user, or with --as for impersonation, which makes RBAC debugging much faster.'},

/* ---------- 61–70 : Probes & lifecycle ---------- */
{q:'What does a liveness probe do?',
 o:['Removes the Pod from Service endpoints','Restarts the container when the probe fails repeatedly','Only logs the failure','Scales the Deployment'],a:1,
 e:'A failing liveness probe kills and restarts the container according to its restart policy. A well-tuned liveness probe should detect a genuine deadlock, not a slow start.'},

{q:'What does a readiness probe do?',
 o:['Restarts the container','Removes the Pod from Service endpoints until the probe passes, so it does not receive traffic while not ready','Terminates the Pod','Upgrades the Pod'],a:1,
 e:'Readiness governs traffic, not lifecycle. A common pattern is a generous liveness probe plus a strict readiness probe so slow-starting Pods are not killed but also do not receive traffic early.'},

{q:'What problem does a startup probe solve?',
 o:['It replaces the liveness probe entirely','It disables liveness and readiness checks until it succeeds, giving slow-starting applications time to come up without being killed','It speeds up image pulls','It checks the node'],a:1,
 e:'Before startup probes existed, slow-booting apps needed very high initialDelaySeconds on the liveness probe. A startup probe expresses that intent directly.'},

{q:'When does a preStop hook run?',
 o:['Immediately after the container starts','Before SIGTERM is sent when the container is being terminated, giving it a chance to drain in-flight work','Before the image is pulled','After the container exits'],a:1,
 e:'preStop is often used to wait a few seconds for the endpoint controller to remove the Pod from Service endpoints, avoiding 502s during rolling updates.'},

{q:'What is the pod termination sequence when a Pod is deleted?',
 o:['The container is killed immediately','The Pod is marked Terminating and removed from endpoints, preStop runs, SIGTERM is sent, then SIGKILL after terminationGracePeriodSeconds','The node is drained first','The Deployment is rolled back'],a:1,
 e:'Endpoint removal is asynchronous and can race with SIGTERM. A brief sleep in preStop, or a readiness probe that fails on SIGTERM, is the standard fix.'},

{q:'What is the default terminationGracePeriodSeconds?',
 o:['0','10','30','60'],a:2,
 e:'The default is 30 seconds. After the preStop hook completes, the container gets the remaining time to exit on SIGTERM before the runtime sends SIGKILL.'},

{q:'Why is a readiness probe critical during a rolling update?',
 o:['Because the Deployment needs it to scale','Because a new Pod only starts receiving traffic once it is Ready, so a broken revision does not take over the Service','Because it accelerates the rollout','Because it disables the old ReplicaSet'],a:1,
 e:'Rollouts respect the readiness probe. Without one, a Pod that has started but is not serving would be added to endpoints and serve errors.'},

{q:'What are the five Pod phases?',
 o:['New, Ready, Live, Dead, Gone','Pending, Running, Succeeded, Failed, Unknown','Created, Started, Stopped, Failed, Deleted','Scheduled, Pulling, Starting, Running, Done'],a:1,
 e:'The phase is a high-level summary in status.phase. "Terminating" is a display state driven by metadata.deletionTimestamp, not a phase.'},

{q:'What are the three container states?',
 o:['New, Running, Stopped','Waiting, Running, Terminated','Created, Started, Failed','Pending, Active, Done'],a:1,
 e:'containerStatuses reports each container as Waiting, Running or Terminated with a reason such as CrashLoopBackOff, ImagePullBackOff or Completed.'},

{q:'What does kubectl get pods show when a container is stuck restarting?',
 o:['Terminated','ImagePullBackOff','CrashLoopBackOff, with the restart count visible in the RESTARTS column','ErrImagePull'],a:2,
 e:'CrashLoopBackOff means the container starts, exits, and is being restarted with exponential backoff. Use kubectl logs --previous to see why the last run exited.'},

/* ---------- 71–80 : kubectl & troubleshooting ---------- */
{q:'Which kubectl command shows detailed state and recent Events for a resource?',
 o:['kubectl get -o yaml','kubectl describe','kubectl explain','kubectl logs'],a:1,
 e:'describe is the fastest way to see scheduling failures, probe failures, image pull errors and volume mount errors because it renders the Events at the bottom.'},

{q:'How do you see logs from the previous run of a restarted container?',
 o:['kubectl logs --previous <pod>','kubectl logs --old <pod>','kubectl logs --history <pod>','kubectl describe logs <pod>'],a:0,
 e:'--previous (-p) reads the terminated container log from the last instance, which is essential when CrashLoopBackOff has overwritten the current run.'},

{q:'How do you get an interactive shell inside a running Pod?',
 o:['kubectl shell <pod>','kubectl exec -it <pod> -- /bin/sh','kubectl attach <pod>','kubectl ssh <pod>'],a:1,
 e:'exec starts a new process inside an existing container. Use -c to target a specific container in a multi-container Pod.'},

{q:'What does kubectl port-forward do?',
 o:['Exposes a Deployment to the internet','Creates a temporary tunnel from your local machine to a Pod or Service port through the API server, for debugging','Creates a NodePort Service','Publishes an Ingress'],a:1,
 e:'It is great for local debugging without exposing anything publicly, but it is not a production traffic path and has no load balancing beyond the target it forwards to.'},

{q:'Which command shows current CPU and memory usage of Pods?',
 o:['kubectl top pods','kubectl stats pods','kubectl get pods --usage','kubectl metrics pods'],a:0,
 e:'kubectl top requires the metrics-server (or another resource metrics API). Without it, the command fails with "Metrics API not available".'},

{q:'A Pod is stuck in Pending. What is the most likely cause?',
 o:['The image does not exist','The scheduler cannot place it — for example insufficient resources, unmatched node selector/affinity, or a taint without a toleration','The readiness probe is failing','The application crashed'],a:1,
 e:'Pending means the Pod exists but has not been scheduled. kubectl describe shows the scheduler events with the exact reason, such as Insufficient cpu or node(s) had untolerated taint.'},

{q:'A Pod shows ImagePullBackOff. What should you check first?',
 o:['The container command','The image name/tag, registry credentials (imagePullSecrets) and whether you hit a pull rate limit','The resource limits','The readiness probe'],a:1,
 e:'ImagePullBackOff is a retryable version of ErrImagePull. Inspect the event message — it usually names the exact problem, such as a missing tag or 401 Unauthorized.'},

{q:'What does CreateContainerConfigError mean?',
 o:['The container image could not be pulled','A referenced ConfigMap or Secret is missing or has a missing key, so the container cannot be created','The node is out of memory','The probe failed'],a:1,
 e:'This error appears before the container starts, so there are no logs. kubectl describe reveals which ConfigMap or Secret key is missing.'},

{q:'Which command shows the documentation for a Kubernetes field?',
 o:['kubectl help <field>','kubectl explain <field>','kubectl docs <field>','kubectl describe <field>'],a:1,
 e:'kubectl explain walks the API schema, for example `kubectl explain pod.spec.containers.resources --recursive`, which is faster than guessing field names.'},

{q:'How do you view only the Ready condition of a Pod?',
 o:['kubectl get pod <name> -o jsonpath=\'{.status.conditions[?(@.type=="Ready")].status}\'','kubectl get pod <name> --ready','kubectl describe pod <name> --ready-only','kubectl ready pod <name>'],a:0,
 e:'jsonpath and custom-columns are the standard way to extract fields for scripts. --output=json plus jq is often easier for more complex expressions.'},

/* ---------- 81–90 : Autoscaling & advanced ---------- */
{q:'What does a HorizontalPodAutoscaler do?',
 o:['Adds nodes to the cluster','Adjusts the number of Pod replicas based on observed metrics such as CPU utilization','Changes container resource limits','Scales storage'],a:1,
 e:'HPA reads metrics from the metrics API (CPU/memory by default, or custom metrics in v2) and scales the target Deployment, ReplicaSet or StatefulSet up and down.'},

{q:'What does a VerticalPodAutoscaler do?',
 o:['Adds more replicas','Adjusts the requests and limits of existing Pods, which usually requires the Pod to be recreated','Scales the node pool','Scales storage'],a:1,
 e:'VPA recommends or applies new resource requests. Its updater evicts Pods to apply the new values, which is why it is often used in recommendation-only mode until tuned.'},

{q:'What does the Cluster Autoscaler do?',
 o:['Scales Pods within a Deployment','Adds or removes nodes in the underlying cloud node group when Pods cannot be scheduled or nodes are underutilized','Scales storage','Restarts unhealthy nodes'],a:1,
 e:'It is provider-specific (AWS ASGs, GKE node pools, AKS node pools). Pair it with HPA: HPA adds Pods, and when those Pods cannot be scheduled, the Cluster Autoscaler adds nodes.'},

{q:'What is KEDA for?',
 o:['Event-driven autoscaling based on sources such as Kafka lag, RabbitMQ queues, SQS depth or Prometheus metrics','Kubernetes network policy','A Helm alternative','A CNI plugin'],a:0,
 e:'KEDA adds scale-to-zero and event-based triggers on top of HPA. It is common for queue workers where CPU is not the right scaling signal.'},

{q:'Why is metrics-server required for kubectl top and default HPA?',
 o:['It stores the cluster state','It exposes the resource metrics API (metrics.k8s.io) that both kubectl top and the HPA resource metrics path depend on','It runs the scheduler','It provides persistent storage'],a:1,
 e:'metrics-server scrapes kubelets and serves aggregated CPU and memory metrics. Without it, kubectl top fails and HPA on CPU or memory cannot compute a target.'},

{q:'What is a CustomResourceDefinition?',
 o:['A policy engine','A way to extend the Kubernetes API with your own resource types, which then behave like built-in objects','A replacement for ConfigMaps','A networking plugin'],a:1,
 e:'A CRD registers a new type such as Prometheus or Certificate. The API server then validates, stores and serves objects of that type using the normal Kubernetes mechanisms.'},

{q:'What is the Operator pattern?',
 o:['A CRD plus a controller that encodes operational knowledge — day-two tasks like backups, upgrades and failover — into software','A user who deploys Pods','A CLI plugin','A type of ConfigMap'],a:0,
 e:'Examples include the Prometheus Operator, CloudNativePG and cert-manager. They watch custom resources and reconcile the cluster toward the desired state using domain knowledge.'},

{q:'What is Helm?',
 o:['A Kubernetes distribution','A package manager for Kubernetes that renders templated charts and tracks releases','A CNI plugin','A replacement for kubectl'],a:1,
 e:'A chart bundles templates with values.yaml and metadata. Helm stores a release record in the cluster (by default as a Secret), which enables upgrades and rollbacks.'},

{q:'How does Kustomize differ from Helm?',
 o:['They are identical','Kustomize customises plain YAML with overlays and patches, without templating; it is built into kubectl -k','Kustomize is a package manager','Kustomize only works with Helm charts'],a:1,
 e:'Kustomize keeps YAML valid and applies overlays for different environments. Helm is better when you need parameterised packaging and release lifecycle management.'},

{q:'What does server-side apply add over client-side apply?',
 o:['Faster scheduling','The API server tracks field ownership, which resolves conflicts between multiple managers applying to the same object','Automatic scaling','Encryption of manifests'],a:1,
 e:'Server-side apply records which manager owns which field. It is more predictable when several controllers or people edit the same object, and it is the direction the ecosystem is moving.'},

/* ---------- 91–100 : Misc & ecosystem ---------- */
{q:'What is a finalizer?',
 o:['A Pod restart policy','A metadata entry that blocks an object from being deleted until a controller removes it, enabling cleanup of external resources','A type of volume','A CNI plugin'],a:1,
 e:'Finalizers prevent orphaned cloud resources — a LoadBalancer Service, a PVC, a CRD-managed database. If a controller is broken, the finalizer can leave objects stuck Terminating.'},

{q:'What does a validating admission webhook do?',
 o:['Modifies incoming requests','Rejects incoming requests that do not meet policy, such as requiring image signatures or resource limits','Schedules pods','Stores state'],a:1,
 e:'MutatingAdmissionWebhooks run first and can add defaults; ValidatingAdmissionWebhooks run afterwards and can only allow or deny. Both are configured through a *WebhookConfiguration object.'},

{q:'What is a kubeconfig context?',
 o:['A namespace','A named combination of cluster, user and default namespace that kubectl uses to determine where to send commands','A type of secret','A node label'],a:1,
 e:'kubectl config use-context switches contexts, which is how you move between clusters and identities. The --context flag overrides per command without changing the default.'},

{q:'What is the default maximum number of Pods per node set by kubelet?',
 o:['50','110','250','Unlimited'],a:1,
 e:'kubelet defaults to --max-pods=110. Managed clusters may use different values, and it is worth checking because it determines how many Pods a node can actually host.'},

{q:'Under memory pressure, which QoS class is evicted first?',
 o:['Guaranteed','Burstable','BestEffort','All are evicted equally'],a:2,
 e:'Eviction order is BestEffort, then Burstable (those over their requests), then Guaranteed. This is why setting requests for critical workloads matters.'},

{q:'How do you gracefully scale down a StatefulSet from 3 to 1?',
 o:['Delete the Pods at random','Scale down; StatefulSets delete Pods in reverse ordinal order (2, then 1) after each is terminated, preserving data on the retained PVCs','Delete the StatefulSet and recreate with 1 replica','Use kubectl drain'],a:1,
 e:'Ordered, graceful scaling is a core StatefulSet guarantee. PVCs are retained by default, so scaling back up reattaches the same storage.'},

{q:'Why does kubectl drain fail with DaemonSet Pods present?',
 o:['DaemonSet Pods cannot be evicted normally; add --ignore-daemonsets to proceed','DaemonSet Pods are protected by PDBs only','DaemonSets are cluster-scoped','drain never fails'],a:0,
 e:'Evicting a DaemonSet Pod would just cause it to be recreated on the same node. --ignore-daemonsets lets drain skip them, and --delete-emptydir-data handles Pods with emptyDir volumes.'},

{q:'What is a topologySpreadConstraint used for?',
 o:['Restricting storage to a zone','Spreading Pods evenly across topology domains such as zones or nodes, with configurable skew tolerance','Setting a Pod resource limit','Choosing a CNI plugin'],a:1,
 e:'It is a more expressive alternative to pod anti-affinity for multi-zone availability, and it can be applied on node, zone or custom topology keys.'},

{q:'What do maxSurge and maxUnavailable control during a Deployment rollout?',
 o:['How many replicas are deleted','How many extra Pods may be created and how many existing Pods may be unavailable at any point during the rolling update','The resource limits for new Pods','The probe timing'],a:1,
 e:'With maxSurge: 1 and maxUnavailable: 0, availability is never reduced during the rollout, at the cost of temporarily running one extra Pod. The defaults are 25% for both.'},

{q:'What is the correct fix when a Pod cannot mount a PVC?',
 o:['Delete the StorageClass','Check that the PVC is Bound, the access mode matches the node count, and the StorageClass provisioner is working','Increase the CPU limit','Add a readiness probe'],a:1,
 e:'The Event log tells you exactly which condition failed: WaitForFirstConsumer, Multi-Attach (RWO on two nodes), or provisioning failure. Fix the underlying storage issue, not the Pod.'},

{q:'Which command shows what changed between your local manifest and the live object on the server?',
 o:['kubectl diff -f manifest.yaml','kubectl compare -f manifest.yaml','kubectl get --diff','kubectl describe --changes'],a:0,
 e:'kubectl diff performs a server-side dry-run and shows the diff, which is essential in CI to catch unintended changes before applying a manifest.'},

{q:'What does kubectl rollout status deployment/myapp do?',
 o:['Shows the Deployment history','Blocks until the rolling update finishes or fails, printing progress','Rolls back the Deployment','Scales the Deployment'],a:1,
 e:'It is the correct way to gate CI on a successful rollout. Pair it with --timeout, and check kubectl rollout history and undo for recovery.'},

{q:'What is the recommended way to handle application configuration across environments in Kubernetes?',
 o:['Bake each environment into a separate image','Keep one image and inject configuration through ConfigMaps, Secrets and environment variables (or Kustomize/Helm overlays)','Use hostPath volumes','Edit the Pod spec in the cluster'],a:1,
 e:'One immutable image promoted across environments is the standard practice. Configuration varies at deploy time; secrets come from an external secret manager or an encrypted Secret.'},

{q:'What does a Kubernetes Operator use to keep the cluster in the desired state?',
 o:['A cron job','A reconcile loop that watches resources and repeatedly compares current state to desired state, acting to close the gap','A sidecar that runs on every node','A Helm chart'],a:1,
 e:'The reconcile loop is Kubernetes\' core design principle, and operators apply it to domain-specific resources. It is level-triggered, which means it tolerates missed events and restarts cleanly.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;   // 2 hours
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Kubernetes Mock Test — Set 1 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
