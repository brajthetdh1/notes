<style>
  :root{
    --brand:#4338ca;
    --brand-dark:#312e81;
    --accent:#818cf8;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;

  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#1e1b4b;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;

  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;

  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#e0e7ff;border-color:#c7d2fe}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(67,56,202,.3)}

  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}

  .option.selected{border-color:var(--brand);background:#e0e7ff}
  .option.selected .key{background:var(--brand);color:#fff}

  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}

  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">☸️ Kubernetes Mock Test <span class="setpill">SET 3</span> <span class="pill" id="qcountPill">100 Questions</span></div>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>

    </div>

  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>

<script>
/* ============================================================
   QUESTION BANK — KUBERNETES SET 3 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : etcd operations ---------- */
{q:'Which command creates a consistent etcd snapshot for backup?',
 o:['etcdctl backup','etcdctl snapshot save (with --endpoints, --cacert, --cert, --key)','etcdctl export','kubectl etcd snapshot'],a:1,
 e:'ETCDCTL_API=3 etcdctl snapshot save /backup/etcd.db with the peer certificates. Always verify the result with etcdctl snapshot status before you rely on it — a corrupt snapshot you discover during an outage is worse than no snapshot at all.'},

{q:'How do you restore an etcd member from a snapshot?',
 o:['etcdctl restore','etcdctl snapshot load','etcdctl snapshot restore --data-dir /var/lib/etcd-new','kubeadm etcd restore'],a:2,
 e:'snapshot restore writes a fresh data directory. Stop kubelet, move the old data dir aside, point the etcd static pod or kubeadm config at the new dir, and restart. The restore rewrites member identity, so never copy the result over a running cluster.'},

{q:'When is etcd defragmentation necessary?',
 o:['After compaction, to reclaim disk space','Never','Automatically after each write','Only during restore'],a:0,
 e:'Compaction drops old revisions but does not return freed space to the filesystem. etcdctl defrag rewrites the backend and reclaims it. Defrag one member at a time in production — it blocks that member while it runs.'},

{q:'What does etcd compaction do?',
 o:['Increases storage','Is automatic','Is for backups','Removes old revisions so the backend can be defragmented'],a:3,
 e:'etcd keeps revision history so watchers can resume. Compaction discards revisions older than the target. Without it the database grows without bound. Set --auto-compaction-retention and check --auto-compaction-mode.'},

{q:'What happens when etcd hits its backend quota?',
 o:['etcd keeps working normally','etcd goes into maintenance or read-only mode at quota-backend-bytes (default 2GiB)','etcd deletes old data automatically','etcd restarts automatically'],a:1,
 e:'The NOSPACE alarm makes writes fail rather than the backend running out of disk. Delete unnecessary objects, defragment, then etcdctl alarm disarm. Raise quota-backend-bytes only after confirming the disk can take it.'},

{q:'What is an etcd learner member?',
 o:['A voting member','A backup member','A non-voting member that catches up before promotion','A mirror of the leader'],a:2,
 e:'etcdctl member add --learner adds a member that does not count toward quorum while it syncs. Once it has caught up, etcdctl member promote makes it voting. This avoids disrupting a healthy cluster during expansion.'},

{q:'What does etcd quorum require?',
 o:['A majority of members available for writes','All members available','One member','Two members'],a:0,
 e:'Raft requires a majority. Three members tolerate one failure, five tolerate two. Even numbers add no extra fault tolerance and complicate quorum during failures.'},

{q:'How are etcd snapshots scheduled in a typical cluster?',
 o:['Built into etcd','Managed by the API server','Configured via kubeadm','Not built in — use cron, Velero or a sidecar'],a:3,
 e:'etcd has no built-in scheduler. Common patterns are a cron job on each control-plane node running etcdctl snapshot save, or Velero, which also snapshots PVs and cluster objects. Ship snapshots off-cluster.'},

{q:'How do you migrate from stacked etcd to external etcd?',
 o:['Delete and recreate etcd','Use etcdctl member add/remove and reconfigure kubeadm','Kubernetes handles it automatically','Restore from snapshot on the new hosts'],a:1,
 e:'Add the external members, promote them so they share load, update the kubeadm ClusterConfiguration to point at the new endpoints, then remove the stacked members. Plan a maintenance window and take a snapshot first.'},

{q:'A control-plane node reports a corrupt etcd data directory. What is the correct recovery?',
 o:['etcd heals itself','kubelet restores it','Restore from the most recent snapshot into a new data directory','Delete and recreate the cluster'],a:2,
 e:'Corrupted data directories cannot be repaired in place. Restore into a new directory and reinitialize the member. Anything written since the snapshot is lost, which is why off-cluster snapshot frequency matters.'},

/* ---------- 11–20 : Node troubleshooting ---------- */
{q:'What does Node NotReady usually indicate?',
 o:['kubelet is healthy','kubelet cannot reach the API server or the container runtime is broken','The node is out of disk','The Pods are pending'],a:1,
 e:'NotReady means kubelet stopped posting status. The usual causes are network partition to the control plane, a failed container runtime, or the node being unresponsive. Check journalctl -u kubelet on the node itself.'},

{q:'Where do you find kubelet logs on a systemd host?',
 o:['journalctl -u kubelet','journalctl -u containerd','kubectl logs kubelet','tail /var/log/kubelet.log'],a:0,
 e:'On systemd hosts kubelet logs to the journal. If you run the plain binary, logs go to /var/log/kubelet.log — check --log-dir in the kubelet config.'},

{q:'How do you read container logs on a node without Docker?',
 o:['docker logs','kubectl logs --previous','journalctl -u crictl','crictl logs <container-id>'],a:3,
 e:'When Docker is not installed, crictl talks to the CRI runtime directly. Use crictl ps to find the container id and crictl logs to read its output. kubectl logs still works from a client if the API is reachable.'},

{q:'When the host runs systemd as init, which cgroup driver should containerd and kubelet be configured with?',
 o:['cgroupfs','cgroupv1','systemd','None of them'],a:2,
 e:'The systemd cgroup driver lets the two share a single resource-management hierarchy. Mismatched drivers cause the node to report resource errors and duplicate cgroups, so align them when you set up a node.'},

{q:'What is the default kubelet evictionHard memory threshold?',
 o:['memory.available<1Gi','memory.available<100Mi','disk.available<10%','cpu.available<1'],a:1,
 e:'kubelet evicts Pods when memory.available drops below 100Mi by default. Tune it via evictionHard in the kubelet config. CPU is not an eviction trigger — it is throttled, not reclaimed.'},

{q:'What does GracefulNodeShutdown do?',
 o:['Lets kubelet stop Pods cleanly during OS shutdown','Enabled by default','Same as drain','Deprecated'],a:0,
 e:'When the OS signals shutdown, kubelet terminates Pods gracefully within a deadline. Useful for OS patching without hard-killing workloads. Configure it with shutdownGracePeriod and shutdownGracePeriodCriticalPods.'},

{q:'In AWS, what handles a Spot instance before it is reclaimed?',
 o:['kubelet does it automatically','The API server terminates pods','AWS Node Termination Handler intercepts the termination notice and cordons and drains the node','The scheduler reschedules'],a:2,
 e:'Cloud Spot and preemptible instances get a short termination notice. Handlers such as AWS Node Termination Handler, GKE node termination handling and Azure\'s handler cordon and drain before the instance disappears, so workloads move cleanly.'},

{q:'Which kubelet setting controls when image garbage collection starts?',
 o:['imageGCThreshold','imageGCHighThresholdPercent (default 85)','imageGCLowThresholdPercent','imageGCPeriod'],a:1,
 e:'kubelet starts image GC at imageGCHighThresholdPercent (85%) and continues until usage drops below imageGCLowThresholdPercent (80%). Change both together — a low threshold above the high one is silently ignored.'},

{q:'How does evictionSoft differ from evictionHard?',
 o:['evictionSoft triggers after a grace period defined by evictionSoftGracePeriod; evictionHard is immediate','They are the same','evictionSoft only affects system pods','evictionSoft only works with local storage'],a:0,
 e:'evictionSoft lets a Pod linger at threshold for evictionSoftGracePeriod before eviction, which reduces churn under transient pressure. evictionHard fires immediately when the threshold is crossed.'},

{q:'What does Node Problem Detector do?',
 o:['Monitors pods','Monitors the API server','Monitors etcd','Monitors node-level problems and reports them as Node conditions and Events'],a:3,
 e:'NPD runs as a DaemonSet and turns low-level symptoms — kernel deadlocks, filesystem corruption, hardware errors — into something the control plane can react to. Without it, these failures only show up as random Pod crashes.'},

/* ---------- 21–30 : Downward API & projection ---------- */
{q:'How do you expose the Pod name as an environment variable?',
 o:['env.valueFrom.configMapKeyRef','env.valueFrom.secretKeyRef','env.valueFrom.fieldRef.fieldPath: metadata.name','env.value: metadata.name'],a:2,
 e:'fieldRef exposes Pod metadata such as metadata.name, metadata.namespace, metadata.uid, spec.nodeName and spec.serviceAccountName. Combine with a downwardAPI volume if you also need updates at runtime.'},

{q:'Which resourceFieldRef.resource value exposes a container CPU limit as an environment variable?',
 o:['resources.limits.cpu','limits.cpu','cpu','container.cpu.limit'],a:1,
 e:'resourceFieldRef.resource takes a relative name like limits.cpu, requests.memory or limits.ephemeral-storage. When the Pod has more than one container, you must also set containerName.'},

{q:'Why might you prefer a downwardAPI volume over environment variables for Pod metadata?',
 o:['env is only for secrets','volume is only for ConfigMaps','They are identical','env values are frozen at container start, while volume contents are updated by kubelet'],a:3,
 e:'Environment variables cannot change after the container starts. A downwardAPI volume is re-synced by kubelet, so files reflect the current Pod metadata. For configuration that never changes mid-life, env is simpler.'},

{q:'What does a projected volume do?',
 o:['Combines multiple sources into one mountpoint','Acts as a backup volume','Takes a snapshot','Acts as a PVC subtype'],a:0,
 e:'A projected volume can include downwardAPI, ConfigMap, Secret, serviceAccountToken and clusterTrustBundle sources. Fewer mounts and atomic updates of everything together are the main wins.'},

{q:'What does the audience field on a serviceAccountToken projection do?',
 o:['Optional only','Required only','Limits which API servers accept the token','Only for admin tokens'],a:2,
 e:'An audience-scoped token is rejected by API servers that do not declare it. A token minted for vault.example.com is not accepted by the Kubernetes API server, which limits the blast radius of a leak.'},

{q:'What does expirationSeconds control in a projected serviceAccountToken?',
 o:['Fixed at one year','Sets the requested token lifetime','Only applies to legacy tokens','Deprecated'],a:1,
 e:'expirationSeconds sets how long the token is valid, and kubelet rotates it before expiry. The API server caps the maximum and the default is 3600 seconds. Legacy token Secrets had no expiry.'},

{q:'Which sources can a downwardAPI volume item reference?',
 o:['fieldRef only','resourceFieldRef only','metadata only','Both fieldRef and resourceFieldRef'],a:3,
 e:'A downwardAPI volume item can reference a metadata field with fieldRef or a container resource field with resourceFieldRef plus containerName. Both kinds can appear in the same volume.'},

{q:'How do you expose a Pod annotation via the downward API?',
 o:['fieldRef on metadata.annotations','Not possible','Only via environment variable','Only via a ConfigMap'],a:0,
 e:'metadata.annotations, metadata.labels and metadata.name are all exposed via fieldRef. Annotations are often used for site-specific hints without changing the image or the object name.'},

{q:'Which of the following is a valid projected volume source?',
 o:['ConfigMaps only','Secrets only','ConfigMap, Secret, downwardAPI, serviceAccountToken and clusterTrustBundle','PersistentVolumeClaims'],a:2,
 e:'Those five are the projection sources. PVCs are separate volumes and cannot be part of a projection.'},

{q:'What is the main reason to use a projected volume with several sources instead of separate mounts?',
 o:['It is faster','Fewer mounts and atomic updates of all sources together','The API requires it','It is encrypted'],a:1,
 e:'Projection reduces the number of mount points (which matters on Windows) and makes updates atomic — the Pod sees a consistent view rather than a mixed state across several independent mounts.'},

/* ---------- 31–40 : Advanced scheduling ---------- */
{q:'What is spec.schedulingGates used for?',
 o:['A scheduler filter','An affinity rule','A taint','To hold a Pod unscheduled until an external controller removes the gate'],a:3,
 e:'schedulingGates is a list of opaque strings; the scheduler ignores the Pod until all are removed. This is the native way to sequence a controller-driven provisioning step before scheduling.'},

{q:'What does spec.schedulerName do?',
 o:['Selects which scheduler handles the Pod','Sets its priority','Sets its node','Sets its namespace'],a:0,
 e:'schedulerName defaults to default-scheduler. Point it at your custom scheduler to have that controller handle the Pod. Multiple schedulers can run side by side.'},

{q:'Which extension points does the scheduler framework expose?',
 o:['Filter only','Score only','Filter, Score, Bind, PreFilter, PostFilter, Permit and more','Bind only'],a:2,
 e:'PreFilter, Filter, PostFilter, PreScore, Score, Reserve, Permit, PreBind, Bind and Unreserve are the main ones. Custom plugins can plug into any of them without forking the scheduler.'},

{q:'Can multiple schedulers run in one cluster?',
 o:['Yes — each Pod names its scheduler','No','Only one cluster-wide','Only in managed clusters'],a:0,
 e:'Each scheduler watches for Pods with a matching schedulerName, and leader election prevents duplicate scheduling from multiple replicas of the same scheduler. This is how GPU or batch workloads can get specialised logic.'},

{q:'Which node affinity operators are valid?',
 o:['Only In','Only In and NotIn','In, NotIn, Exists','In, NotIn, Exists, DoesNotExist, Gt, Lt'],a:3,
 e:'Gt and Lt only work with integer values in a node label, which makes them useful for numeric selectors like a rack index. In and NotIn require a values list; Exists and DoesNotExist do not.'},

{q:'What does a topologySpreadConstraint do?',
 o:['Same as affinity','Same as taints','Spreads Pods across topology domains with a skew tolerance','Only for StatefulSets'],a:2,
 e:'You specify a maxSkew, a topologyKey such as topology.kubernetes.io/zone or kubernetes.io/hostname, and a whenUnsatisfiable policy. It generalises pod anti-affinity to N domains.'},

{q:'What does whenUnsatisfiable: DoNotSchedule do?',
 o:['Treats the constraint as a soft preference','Makes the constraint a hard rule; Pods will not schedule if the skew cannot be satisfied','Disables the scheduler','Deprecated'],a:1,
 e:'DoNotSchedule blocks the Pod if the skew cannot be met. ScheduleAnyway is a soft preference and is usually the right choice when availability matters more than perfect balance.'},

{q:'What does requiredDuringScheduling mean in an affinity rule?',
 o:['A hard constraint — the Pod is not scheduled if it is unmet','A soft preference','Valid only for tolerations','Deprecated'],a:0,
 e:'required* is a hard filter: no matching node means the Pod stays Pending indefinitely. preferred* lets the scheduler rank nodes and still place the Pod when the constraint cannot be met.'},

{q:'What is the system-node-critical PriorityClass for?',
 o:['Same as system-cluster-critical','Only for user Pods','A built-in class for node-critical components, higher than system-cluster-critical','Deprecated'],a:2,
 e:'system-node-critical has value 2000001000 and is for components without which the node cannot function, such as kube-proxy and CNI agents. system-cluster-critical sits one step lower at 2000000000.'},

{q:'What does preemptionPolicy: Never do on a high-priority Pod?',
 o:['Same as default','Never schedules the Pod','Never deletes the Pod','The Pod can be scheduled ahead in the queue but will not preempt lower-priority Pods'],a:3,
 e:'Useful when you want the queue ordering of priority without the disruption of eviction. The Pod simply waits for capacity to free up naturally, which is often the right call for latency-sensitive but non-critical workloads.'},

/* ---------- 41–50 : Extended resources & runtime ---------- */
{q:'How must extended resources like nvidia.com/gpu be requested?',
 o:['Limit only','Request only; extended resources must not set limits different from requests','Both request and limit must differ','Neither is required'],a:1,
 e:'Extended resources are integer-only and require requests equal to limits. Setting them differently is rejected. Kubernetes uses the request for scheduling and the value itself for accounting.'},

{q:'What is a Kubernetes device plugin?',
 o:['A gRPC service on each node that advertises and allocates hardware resources','A CNI plugin','A CSI driver','A scheduler plugin'],a:0,
 e:'Device plugins run on each node, expose a Unix socket under /var/lib/kubelet/device-plugins, and register with kubelet. They report allocatable devices and receive Allocate calls with the Pod\'s request.'},

{q:'What does the NVIDIA GPU Operator provide?',
 o:['A CNI plugin','A monitoring tool','A set of DaemonSets and CRDs that install and manage the GPU driver, device plugin, container toolkit and DCGM exporter','A Helm chart for monitoring only'],a:2,
 e:'The operator bundles every component a GPU workload needs so the cluster is GPU-ready without hand-installing drivers on each node. It also handles driver upgrades and node reboots in a controlled way.'},

{q:'Which hugepage resources does Kubernetes expose?',
 o:['hugepages-1Gi only','hugepages-2Mi and hugepages-1Gi','hugepages-4Ki','Only via annotations'],a:1,
 e:'These are first-class resources when the kernel is configured with hugepages. They are requested in whole numbers and are not overcommitted, so a Pod waiting for hugepages stays Pending rather than getting a partial allocation.'},

{q:'What does ephemeral-storage measure?',
 o:['Memory','CPU','PVC size','Node-local disk used by logs, emptyDir and the container writable layer'],a:3,
 e:'ephemeral-storage requests and limits prevent one Pod from filling a node\'s disk. kubelet evicts Pods that exceed their limit, and the scheduler accounts for the request when placing new Pods.'},

{q:'What does PodOverhead account for?',
 o:['Resources consumed by the Pod sandbox, added to the Pod total','Only init containers','Only Windows','Deprecated'],a:0,
 e:'RuntimeClass can declare an overhead for Pods running a heavier runtime. Kubernetes adds that overhead to the Pod\'s total resource request for scheduling and quota, which matters on platforms like Kata or gVisor.'},

{q:'How is the QoS class of a Pod with init containers computed?',
 o:['BestEffort always','Same as app containers only','From the highest of the init and app containers','Ignored'],a:2,
 e:'The QoS class uses the maximum across app containers and any init containers. A single high-request init container can promote the whole Pod from BestEffort to Burstable.'},

{q:'How do you set a per-Pod PID limit to prevent fork bombs?',
 o:['--pod-max-pids kubelet flag or a pids limit in cgroup','Only for system pods','Only for Swarm','Not supported'],a:0,
 e:'Without a limit, a runaway workload can exhaust the node\'s PID space and take down every Pod on it. Set --pod-max-pids so one Pod cannot starve the node.'},

{q:'What does the topology manager do?',
 o:['Aligns CPU, memory and device allocation to the same NUMA node per the chosen policy (none, best-effort, restricted, single-numa-node)','Load balances across NUMA nodes','Limits disk I/O','Deprecated'],a:0,
 e:'single-numa-node is the strictest policy and is required for some HPC and NFV workloads where cross-NUMA memory access destroys performance. Looser policies give up alignment for guaranteed scheduling.'},

{q:'What does the CPU manager static policy provide?',
 o:['Cgroup shares only','Same as dynamic','Not supported','Guarantees exclusive CPU allocation for Guaranteed Pods with integer CPU requests'],a:3,
 e:'cpuManagerPolicy: static with full-pcpus-only grants exclusive CPUs to Guaranteed Pods. All other Pods still share the default pool via cgroup shares, so enabling static does not break BestEffort workloads.'},

/* ---------- 51–60 : Advanced networking ---------- */
{q:'What does NodeLocal DNSCache provide?',
 o:['Runs a DNS cache on each node to reduce latency and load on CoreDNS','Replaces CoreDNS','Only on Windows','Deprecated'],a:0,
 e:'It runs as a DaemonSet listening on a link-local address. Pods query it first and misses fall through to CoreDNS. This removes a network hop and dramatically reduces conntrack pressure on the CoreDNS Pods.'},

{q:'How do you enable topology-aware routing for a Service?',
 o:['Always on by default','Only with IPVS mode','service.kubernetes.io/topology-mode: Auto annotation on the Service','Requires manual configuration on each node'],a:2,
 e:'Topology-aware routing (formerly TopologyAwareHints) lets kube-proxy favour endpoints in the same zone. The EndpointSlice controller fills in the hints; you just opt in with the annotation.'},

{q:'What does trafficDistribution: PreferClose do?',
 o:['Prefers endpoints on the same node or zone when available','Same as sessionAffinity','Deprecated','Only works on AWS'],a:0,
 e:'This is the newer, first-class way to express preference for nearby endpoints. It supersedes the annotation and is the field that recent kube-proxy implementations use to route same-zone first.'},

{q:'What is MetalLB?',
 o:['A cloud provider','A CNI plugin','A load balancer implementation for bare-metal clusters using ARP (L2) or BGP','A monitoring tool'],a:2,
 e:'MetalLB fills the gap when no cloud provider hands out external IPs. In L2 mode one node advertises an IP via ARP; in BGP mode every node advertises the service prefix and the fabric load-balances.'},

{q:'What does internalTrafficPolicy: Local do?',
 o:['Routes internal cluster traffic only to Pods on the same node','Same as externalTrafficPolicy','Deprecated','Only for headless Services'],a:0,
 e:'It keeps east-west traffic on the same node, which reduces cross-node hops and often latency. Nodes without a local endpoint drop the traffic instead of forwarding, so plan capacity accordingly.'},

{q:'What does externalTrafficPolicy: Local do?',
 o:['Same as Cluster','Load balances across all nodes','Only for headless Services','Preserves client source IP and reduces one hop, but drops traffic on nodes with no local ready Pods'],a:3,
 e:'Common when you need the real client IP for logging or allow-lists. It requires a load balancer with health checks that can route around nodes lacking local Pods, otherwise it becomes a fault-isolation risk.'},

{q:'What does an egress rule in a NetworkPolicy do?',
 o:['Allows outbound connections from Pods selected by the policy to specified destinations','Only applies to ingress','Both ingress and egress in one rule','Deprecated'],a:0,
 e:'egress: [] means no egress is allowed; egress: [{...}] adds allow rules. Like ingress, policies from multiple NetworkPolicies that select a Pod are additive.'},

{q:'What is an egress gateway in service mesh networking?',
 o:['Only for Ingress','Not supported in Kubernetes','A dedicated set of Pods that outbound traffic is routed through so its source IP is stable and policy can be applied','A CNI plugin name'],a:2,
 e:'Egress gateways give a stable source IP for outgoing traffic, which matters when a partner allow-lists an address. Cilium, Istio and other mesh tools implement this with a dedicated Deployment plus routing rules.'},

{q:'How does sidecar injection work in a service mesh?',
 o:['Automatically via a mutating admission webhook that adds the proxy container','Manual only','Only with Istio','Only via a kubectl plugin'],a:0,
 e:'The mesh installs a MutatingAdmissionWebhook that sees a Pod create request and, if the namespace carries the injection label, adds the proxy container. Istio and Linkerd both work this way.'},

{q:'How does Istio ambient mode differ from sidecar mode?',
 o:['It is identical','Uses a single proxy per namespace','No encryption','Uses a per-node L4 ztunnel and optional per-namespace waypoint proxies, avoiding sidecars'],a:3,
 e:'Ambient moves most work to a shared per-node proxy, so adding workloads does not add sidecars. Waypoint proxies handle L7 policy only where it is actually needed, which reduces the per-Pod footprint enormously.'},

/* ---------- 61–70 : Autoscaling ---------- */
{q:'What does HPA behavior control?',
 o:['behavior.scaleUp and behavior.scaleDown define policies, steps and stabilization windows','Only scale-down','Only custom metrics','Deprecated'],a:0,
 e:'Each direction has a stabilization window plus a list of policies, and selectPolicy decides whether the most permissive or the most restrictive wins. This is how you prevent a single spike from tripling replicas.'},

{q:'What does stabilizationWindowSeconds prevent?',
 o:['Fixed at 300','Only affects scale-up','Rapid flapping by using the highest or lowest metric over the window','Only applies to VPA'],a:2,
 e:'For scale-down the highest recent recommendation is used, so a brief dip does not trigger a shrink. For scale-up the lowest is used, avoiding overreaction to a spike. Both smooth out the churn.'},

{q:'Which metric types does HPA support in the v2 API?',
 o:['Resource, ContainerResource, Pods, Object and External','Only Resource','Only Custom','Only External'],a:0,
 e:'Resource metrics come from metrics-server (CPU, memory). ContainerResource narrows them to a single container. Pods, Object and External require an adapter such as prometheus-adapter or KEDA.'},

{q:'What does KEDA provide?',
 o:['A HPA replacement that only supports CPU','Only cloud-provider metrics','Only AWS SQS','Event-driven autoscaling with scalers for Kafka lag, SQS depth, cron and dozens more, supporting scale-to-zero'],a:3,
 e:'KEDA sits in front of HPA, providing the metrics and, crucially, scale-to-zero. That makes it the default choice for queue workers, Kafka consumers and cron-driven batch jobs.'},

{q:'What do VPA updateMode values do?',
 o:['Off, Initial and Auto — Off only recommends, Initial sets on creation, Auto updates and evicts','Always auto','Only Off','Deprecated'],a:0,
 e:'Off is the safest first step — VPA publishes recommendations in the object status. Initial sets requests at creation. Auto updates and evicts running Pods, which is risky for stateful workloads without disruption budgets.'},

{q:'Which expanders does the Cluster Autoscaler support?',
 o:['Only random','Only least-waste','random, most-pods, least-waste and priority','Only priority'],a:2,
 e:'Expanders decide which node group to scale. least-waste picks the smallest group that fits, most-pods picks the group that schedules the most pending Pods, and priority respects the group priority config.'},

{q:'How do you reduce scale-up latency with the Cluster Autoscaler?',
 o:['Run low-priority placeholder Pods that are preempted for real workloads','Reserve EC2 instances','Increase limits','Disable HPA'],a:0,
 e:'Over-provisioning keeps a small pool of placeholder Pods on nodes that are already running. When a real workload needs capacity, the placeholder is preempted and the workload schedules immediately while the autoscaler catches up.'},

{q:'In AWS, what moves Pods before a Spot instance is reclaimed?',
 o:['kubelet handles it','The API server terminates pods','Only the Cluster Autoscaler','AWS Node Termination Handler listens to the termination notice and cordons and drains the node'],a:3,
 e:'Cloud Spot and preemptible instances get a short termination notice. The handler cordons and drains before the instance is removed, giving workloads a chance to move cleanly rather than disappearing.'},

{q:'How do HPA and the Cluster Autoscaler interact?',
 o:['HPA scales Pods; CA adds nodes when Pending Pods cannot be scheduled','They conflict and cannot run together','CA replaces HPA','HPA adds nodes'],a:0,
 e:'The two are complementary. HPA reacts to load by changing replicas; CA reacts to unschedulable Pods by changing nodes. A well-tuned pair means latency scaling and capacity scaling happen at the same time.'},

{q:'What does the Prometheus Adapter provide?',
 o:['Same as metrics-server','Only CPU and memory','Custom and external metrics from Prometheus through the metrics APIs','A Prometheus fork'],a:2,
 e:'prometheus-adapter translates PromQL queries into the Kubernetes metrics APIs, which is how HPA can scale on request rate, queue depth or any other Prometheus metric.'},

/* ---------- 71–80 : Storage advanced ---------- */
{q:'What does allowVolumeExpansion: true enable on a StorageClass?',
 o:['Allows PVCs to be resized','Only for StatefulSets','Deprecated','Same as resize'],a:0,
 e:'Without it, editing the PVC spec.resources.requests.storage is rejected. Expansion is online for supported drivers and requires a Pod restart for others — check the driver documentation.'},

{q:'What does fsType do in a StorageClass?',
 o:['Only ext4','Only xfs','Deprecated','Specifies the filesystem type to format the volume with, if the CSI driver supports it'],a:3,
 e:'The CSI driver decides which filesystems it supports. Setting fsType on a driver that does not honour it is silently ignored, which is a common surprise when migrating from in-tree plugins.'},

{q:'What does mountOptions do in a StorageClass?',
 o:['A list of options passed to the underlying mount','Same as fsType','Deprecated','Only for NFS'],a:0,
 e:'Options like noatime, nfsvers=4.1 or discard are passed to the mount inside the CSI driver. Support depends entirely on the driver and the filesystem.'},

{q:'What does allowedTopologies do?',
 o:['Only for StatefulSets','Deprecated','Constrains dynamic provisioning to specific zones or regions','Only on GKE'],a:2,
 e:'allowedTopologies on the StorageClass restricts where PVs may be created, for example limiting to zones in a specific region. It is often used with WaitForFirstConsumer for multi-zone clusters.'},

{q:'What does a VolumeSnapshotClass define?',
 o:['How snapshots are created and deleted for a CSI driver','Same as StorageClass','Only for EBS','Deprecated'],a:0,
 e:'A VolumeSnapshotClass names a CSI driver and a deletion policy. The VolumeSnapshot object references it, and a VolumeSnapshotContent object represents the actual snapshot.'},

{q:'What is a CSI ephemeral volume?',
 o:['Persistent','Same as emptyDir','Only for Kubernetes 1.20+','An inline volume in a Pod spec that is provisioned per Pod and destroyed with it'],a:3,
 e:'CSI ephemeral volumes are declared inline and the CSI driver runs NodePublishVolume without a PV or PVC. Useful for injecting credentials through a CSI driver such as Secrets Store CSI.'},

{q:'What happens to StatefulSet PVCs when you scale down?',
 o:['Retained by default','Automatically deleted','Deleted with finalizers','Only deleted with --purge'],a:0,
 e:'Scaling down leaves the PVCs in place, so scaling back up reattaches the same data. Delete the PVCs manually when you no longer need them. Newer versions expose persistentVolumeClaimRetentionPolicy to change this.'},

{q:'What is a generic ephemeral volume?',
 o:['Same as emptyDir','Only for CSI','A Pod-spec volume that provisions a PVC for the lifetime of the Pod','Deprecated'],a:2,
 e:'It lets you use any StorageClass without writing a PVC by hand. The controller creates a PVC tied to the Pod and deletes it when the Pod goes away, which is useful for one-off jobs that need real disk.'},

{q:'What does ReadWriteOncePod add over ReadWriteOnce?',
 o:['Allows a volume to be mounted read-write by a single Pod, not just a single node','Same as RWO','Only for Windows','Deprecated'],a:0,
 e:'RWOP is a stricter mode that prevents two Pods on the same node from mounting the same volume simultaneously. It matters when the application would corrupt data under concurrent access.'},

{q:'How does volumeBindingMode: WaitForFirstConsumer differ from Immediate?',
 o:['No difference','Only for StatefulSets','Only for CSI drivers','Immediate binds right away; WaitForFirstConsumer defers until a Pod is scheduled, respecting zonal topology'],a:3,
 e:'WaitForFirstConsumer is essential for zonal disks. Without it a PV can be created in a zone the Pod cannot run in, and the Pod stays Pending with a topology mismatch that is hard to diagnose.'},

/* ---------- 81–90 : Security & tenancy ---------- */
{q:'What is the CSR API used for?',
 o:['Only for service accounts','Same as OIDC','Requesting and approving X.509 certificates through certificates.k8s.io/v1','Deprecated'],a:2,
 e:'CSRs are how kubelets, kube-proxies and service accounts get certificates. The request is signed by the cluster CA after a person or controller approves it, so the private key never leaves the client.'},

{q:'How do you approve a kubelet CertificateSigningRequest?',
 o:['kubectl certificate approve <csr-name>','kubectl auth','Requires a cluster-admin token in the node','Deprecated'],a:0,
 e:'kubelet submits a CSR on first boot. kubeadm-managed clusters auto-approve via the CSR approver controller. On a manual cluster you may need to approve them yourself, and renewals appear as new CSRs.'},

{q:'How are Pod Security Admission exemptions configured?',
 o:['On the API server with --admission-control-config-file, exempting usernames, namespaces or runtime classes','Only via annotations','Deprecated','Only for kube-system'],a:1,
 e:'Exemptions live in the AdmissionConfiguration referenced by the API server. Without them, privileged infrastructure components such as CNI, storage and monitoring agents would be blocked by restricted-mode namespaces.'},

{q:'What is Hierarchical Namespace Controller (HNC)?',
 o:['Same as namespaces','Only for GKE','Deprecated','A controller that lets namespaces inherit policies, RBAC and objects from a parent namespace'],a:3,
 e:'HNC adds a hierarchy on top of flat namespaces. NetworkPolicy, RBAC and object propagation come from the parent, which helps multi-tenant platforms avoid duplicating everything in each namespace.'},

{q:'What is vCluster?',
 o:['Same as kind','A CNI plugin','A virtual Kubernetes cluster running inside a namespace of a host cluster','Deprecated'],a:2,
 e:'vCluster runs a full API server and etcd inside a single namespace, giving tenants what looks like their own cluster with their own CRDs and RBAC. The host only pays for the vCluster\'s control-plane Pods.'},

{q:'What does failurePolicy: Fail on a validating webhook do?',
 o:['Blocks requests when the webhook is unreachable','Allows them through','Deprecated','Only Ignore is valid'],a:0,
 e:'Fail is the safer default for security-relevant webhooks — you would rather reject than bypass. Ignore keeps the cluster working when the webhook is down, which is safer for availability. Set a timeout either way.'},

{q:'How does mTLS identify workloads in a service mesh?',
 o:['Same as TLS','Only for north-south traffic','Only for Ingress','Each workload receives a cryptographic identity, and the mesh enforces mutual authentication and derives authorisation from that identity'],a:3,
 e:'The mesh issues a certificate per workload identity, typically the SPIFFE ID derived from the ServiceAccount, and rotates it automatically. Authorisation policies then match on identity rather than IP, which survives Pod churn.'},

{q:'What is a bound service account token?',
 o:['Projected with audience, expiration and bound object reference','Same as the legacy Secret','Only for privileged Pods','Deprecated'],a:0,
 e:'Bound tokens are audience-scoped and expire, and kubelet rotates them before they expire. The legacy token Secrets are deprecated precisely because they never expired and had no audience restriction.'},

{q:'How does OIDC authentication work for the API server?',
 o:['Same as basic auth','Only for kubelet','Configures the API server to trust an external OIDC identity provider for user authentication','Deprecated'],a:2,
 e:'With OIDC the API server validates tokens issued by an identity provider such as Okta, Entra ID or Keycloak. RBAC binds to groups and users from those tokens, so short-lived credentials replace long-lived admin certificates.'},

{q:'Which audit policy levels are available?',
 o:['None, Metadata, Request and RequestResponse','Only All','Only None','Only RequestResponse'],a:0,
 e:'Each level logs more than the previous. Most policies apply RequestResponse to sensitive resources such as Secrets and Metadata to everything else, keeping log volume manageable while preserving forensic detail.'},

/* ---------- 91–100 : API machinery & ecosystem ---------- */
{q:'How do you paginate a large list request against the API server?',
 o:['Only possible in large clusters','Deprecated','Use limit and continue tokens to page through results and reduce API server memory pressure','Same as watch'],a:2,
 e:'A list request without limit can return every object, which is expensive for both the API server and the client. Use limit=500 and follow the continue token until it is empty.'},

{q:'What does allowWatchBookmarks enable?',
 o:['The full object on each event','Deprecated','Only for event resources','Bookmark events that let a client resume a watch without relisting when it has fallen behind'],a:3,
 e:'The API server periodically sends a BOOKMARK event carrying the current resourceVersion. A client can save that and resume the watch from there, avoiding a full relist whenever the connection drops.'},

{q:'What is resourceVersion in Kubernetes?',
 o:['A timestamp','An opaque string that reflects the state of the object, used for optimistic concurrency and watch resume','A hash of the object','A UUID'],a:1,
 e:'Treat resourceVersion as opaque. Use it with a matching precondition on update or delete to avoid clobbering concurrent changes, and with a watch to resume from the last observed state.'},

{q:'What does ownerReferences enable?',
 o:['Cascading deletion: child is garbage collected when owner is deleted','Same as labels','Only for Pods','Deprecated'],a:0,
 e:'A ReplicaSet owns its Pods, so deleting the ReplicaSet cascades. blockOwnerDeletion and propagationPolicy control whether children block owner deletion or are removed in the background.'},

{q:'What do finalizers do?',
 o:['Same as ownerReferences','Only for namespaces','Block deletion until the controller that added them removes them','Deprecated'],a:2,
 e:'Finalizers are how external resources — a cloud load balancer, an object-storage bucket, a database — are cleaned up. If the controller is broken, the object gets stuck Terminating; removing the finalizer is the fix, but only after verifying there is nothing left to clean up.'},

{q:'What is the Kubernetes release cadence?',
 o:['Every month','Every six months','Every two years','Roughly every four months, with three minor releases per year'],a:3,
 e:'Kubernetes ships three minor releases per year (for example 1.28 in August, 1.29 in December, 1.30 in April). Patch releases continue on the three most recent minors.'},

{q:'How does Kubernetes handle API deprecation?',
 o:['Deprecated APIs are removed immediately','GA APIs are deprecated after a defined window; alpha APIs can be removed without notice','APIs are never deprecated','Deprecated only on request'],a:1,
 e:'Beta APIs are typically deprecated for 9 months or three minor releases. Alpha APIs have no stability guarantee. Always check the deprecation guide and run kubectl api-resources before upgrading a cluster.'},

{q:'Which APIs were removed in Kubernetes 1.25 and 1.26?',
 o:['Same as 1.24','None removed','PodSecurityPolicy removed in 1.25 and many autoscaling/v2beta APIs in 1.26','PodSecurityPolicy is still available'],a:2,
 e:'v1.25 removed PodSecurityPolicy plus several beta EndpointSlice and Events APIs. v1.26 removed autoscaling/v2beta2 and flow-control beta APIs. Check the deprecation guide and the kubectl warnings before upgrading.'},

{q:'What do Windows containers require?',
 o:['Windows nodes with a compatible process or Hyper-V isolation mode','Same as Linux','Only Docker Desktop','Deprecated'],a:0,
 e:'Windows containers run on Windows nodes. HostProcess containers are the Windows equivalent of privileged Linux containers for node-level agents. Mixed clusters run separate node pools per OS with a nodeSelector on each workload.'},

{q:'What does kubectl auth reconcile do?',
 o:['Checks permissions','Same as kubectl auth can-i','Deprecated','Applies RBAC objects and ensures they match the manifest without removing extra subjects'],a:3,
 e:'Unlike apply, auth reconcile merges rules instead of replacing them, so subjects or rules added out-of-band are preserved. That makes it the safe choice for platform-managed Roles and ClusterRoles that tenants also modify.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Kubernetes Mock Test — Set 3 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
