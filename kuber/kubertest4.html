<style>
  :root{
    --brand:#047857;
    --brand-dark:#065f46;
    --accent:#34d399;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;

  *{box-sizing:border-box}
  body{

  header.topbar{

  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#022c22;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;

  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}

    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;

  }

  .pbtn.seen{background:#d1fae5;border-color:#a7f3d0}

  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(4,120,87,.3)}

  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}

  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}

  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<body>

<header class="topbar">
  <div class="brand">☸️ Kubernetes Mock Test <span class="setpill">SET 4</span> <span class="pill" id="qcountPill">100 Questions</span></div>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>

      <span><i></i>Not visited</span>
    </div>
    <div class="grid" id="pgrid"></div>
  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>

<script>
/* ============================================================
   QUESTION BANK — KUBERNETES SET 4 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Controllers & informers ---------- */
{q:"What is the primary purpose of an informer cache in a Kubernetes controller?",
 o:["To schedule Pods onto nodes","To proxy traffic to Pods","To store etcd data","To maintain a local, watch-backed cache of resources so the controller can read state without hammering the API server"],a:3,
 e:"Informers open a watch and keep a local store in sync. The controller reads from that store, so a reconcile loop does not issue a GET per object per event. This is the single most important scalability design in the controller pattern."},

{q:"Why does the controller-runtime work queue deduplicate keys?",
 o:["To preserve strict ordering","So a work item is processed once even if multiple events for the same object arrive before it is handled","To reduce memory usage","To increase throughput"],a:1,
 e:"A single object often generates several events (create plus update, or resyncs). Deduplication collapses them into one queue entry, so the reconcile runs once and the controller does not do redundant work."},

{q:"How does controller leader election decide that a replica has died?",
 o:["Via etcd leader election","Via node heartbeats","Via CRD status","Via a Lease object with a renewDeadline; if a replica fails to renew within that deadline, another takes over"],a:3,
 e:"Controllers use coordination.k8s.io/v1 Lease with configurable leaseDuration, renewDeadline and retryPeriod. Only the holder of the Lease reconciles, so multiple replicas can run safely for high availability."},

{q:"What does the default client-go rate limiter protect?",
 o:["The API server, via QPS and burst limits applied on the client side","The kubelet","The container runtime","The scheduler"],a:0,
 e:"rest.Config has QPS and Burst fields. Without them a controller recovering from an outage can flood the API server and trigger throttling for everyone. Tuning these is a common fix for controller-induced cluster incidents."},

{q:"Why do controllers reconcile the current observed state rather than reacting to each event?",
 o:["It is faster","It reduces memory","Because level-triggering is self-healing — missed events are corrected on the next reconcile","It avoids leader election"],a:2,
 e:"Edge-triggered designs must handle every event exactly once and break when an event is lost. Level-triggered designs compare desired and observed state, so a restarted controller recovers by simply reconciling again."},

{q:"What is the purpose of a finalizer added by a controller?",
 o:["To prevent the controller from being deleted","To mark the object as immutable","To speed up deletion","To block object deletion until external cleanup such as cloud resources or PVCs has completed"],a:3,
 e:"The finalizer keeps the object in Terminating while the controller releases external resources. A broken controller leaves the object stuck; removing the finalizer is the fix, but only after verifying nothing is left behind."},

{q:"What does enabling the status subresource on a CRD achieve?",
 o:["Increases storage","Removes validation","Separates status writes from spec writes, so a client update to spec cannot overwrite status","Disables RBAC"],a:2,
 e:"With the subresource enabled, writes to status go through a different endpoint. This prevents a controller's status update from racing with a user's spec update and silently clobbering it."},

{q:"What does the scale subresource on a CRD expose?",
 o:["A specReplicasPath, statusReplicasPath and labelSelectorPath that HPA and kubectl scale use to read and change replicas","Container metrics","The storage size","The Pod count"],a:0,
 e:"Once the scale subresource is declared, a custom resource behaves like a Deployment for scaling. That is what lets HPA autoscale an operator-managed custom resource without special-casing it."},

{q:"What does additionalPrinterColumns control on a CRD?",
 o:["Container logs","Extra columns printed by kubectl get for a custom resource","The Pod spec","The audit log format"],a:1,
 e:"Printer columns are how an operator makes `kubectl get myresource` useful. Without them, users see only NAME and AGE and must run describe for everything else."},

{q:"How does a structural OpenAPI schema enforce validation on a CRD?",
 o:["By calling a webhook","By encoding rules in the manifest annotations","By using a separate CRD","Fields are validated against the schema, and unknown fields are pruned by default because structural schemas require a defined type at every level"],a:3,
 e:"Structural schemas are mandatory for CRD v1 and are what make server-side apply and pruning work. If you need to preserve unknown fields, set x-kubernetes-preserve-unknown-fields deliberately rather than relying on the old behaviour."},

/* ---------- 11–20 : CRDs & API extension ---------- */
{q:"What is a CRD conversion webhook used for?",
 o:["YAML to JSON","RBAC translation","Admission mutation","Translating between served versions of the same CRD when the client and stored version differ"],a:3,
 e:"With multiple served versions, the API server calls the conversion webhook to translate. Without it, every version must be schema-identical, which defeats the point of having multiple versions."},

{q:"How does a CRD with both v1 and v1beta1 served versions work?",
 o:["One stored version, both versions served, and objects are converted on read and write","Two separate storage locations","Only one version can ever be served","v1beta1 always overrides v1"],a:0,
 e:"The stored version lives in etcd; served versions are converted on the fly. This lets clients migrate from v1beta1 to v1 gradually while the data stays in one place."},

{q:"What requirement does a structural schema impose on a CRD?",
 o:["It must be written in YAML","Every level must declare a type, with no top-level type alternatives such as anyOf or oneOf at the root","It must have no properties","It must be cluster-scoped"],a:1,
 e:"Structural schemas are what allow pruning of unknown fields and server-side apply. Non-structural definitions are rejected by CRD v1 because they cannot be reasoned about mechanically."},

{q:"Which Kubernetes release removed apiextensions.k8s.io/v1beta1 CRDs?",
 o:["1.18","1.20","1.22","1.25"],a:2,
 e:"CRD v1beta1 was deprecated in 1.16 and removed in 1.22. Clusters upgrading past that point need to migrate CRDs to v1, which also means adding structural schemas and printer columns."},

{q:"Can the scope of a CRD (namespaced versus cluster-scoped) be changed after creation?",
 o:["Yes, with kubectl patch","Yes, on any version","Only through a webhook","No — scope is immutable after creation"],a:3,
 e:"Changing scope would invalidate every existing object's storage path. The only supported way to change it is to create a new CRD with a different name and migrate the objects."},

{q:"How does an aggregated API differ from a CRD?",
 o:["An aggregated API runs in its own server registered with the API server; a CRD is stored and served by the main API server","They are identical","Aggregated APIs cannot be versioned","CRDs need a separate server"],a:0,
 e:"Aggregation is used when a CRD is not enough — for example metrics.k8s.io or custom APIs with their own storage. The trade-off is that you now operate and scale another API server."},

{q:"What does an APIService object register?",
 o:["A ServiceMonitor","An aggregated API server that the main API server proxies requests to","A NetworkPolicy","A ClusterRole"],a:1,
 e:"APIService in apiregistration.k8s.io/v1 ties an API group and version to a backend Service. If that backend goes down, requests to the group fail — which is why metrics-server outages show up as `kubectl top` failures, not scheduler failures."},

{q:"Where does Kubernetes publish its OpenAPI v3 schema?",
 o:["/swagger","/openapi/v2","/openapi/v3, replacing the older swagger endpoints","/schema"],a:2,
 e:"OpenAPI v3 is fetched per group and version, which keeps responses small. Tools such as kubectl explain and IDE validators use it to describe and validate fields."},

{q:"What advantage does a CEL-based ValidatingAdmissionPolicy have over a validating webhook?",
 o:["It supports mutation","It requires a network call","It is written in Go","It runs in-process, with no network hop or dependency on an external service"],a:3,
 e:"Because the policy evaluates inside the API server, it cannot fail due to a webhook outage. Webhooks are still needed for mutation and for validations that must consult an external system."},

{q:"What does metadata.managedFields track?",
 o:["Which field manager owns each field, so server-side apply can detect conflicts","The last user to read the object","The audit log","The resource request"],a:0,
 e:"Each manager — kubectl, a controller, an operator — is recorded per field. Server-side apply uses this to merge safely and to report a conflict only when two managers genuinely disagree about the same field."},

/* ---------- 21–30 : Admission & API server ---------- */
{q:"In what order do admission webhooks run?",
 o:["Validating webhooks, then mutating webhooks","Mutating webhooks, then validating webhooks, then mutating webhooks again if reinvocationPolicy is IfNeeded","Alphabetically by webhook name","Random order"],a:1,
 e:"Mutation runs before validation because a validating webhook should see the final object. Reinvocation exists because a later mutating webhook may have changed fields a validating webhook already inspected."},

{q:"What does reinvocationPolicy: IfNeeded do on a mutating webhook?",
 o:["Skips the webhook entirely","Runs it before all other webhooks","Runs the webhook again after other webhooks have mutated the object, so it sees the final state","Disables the webhook"],a:2,
 e:"Sidecar injectors often need this. If one webhook adds a container and another must react to it, a single pass is not enough. The API server re-runs webhooks that opt in until the object stops changing or a limit is reached."},

{q:"Why must a webhook declare sideEffects?",
 o:["For logging","For metrics","For security auditing","So the API server can skip webhooks with side effects during dry-run requests"],a:3,
 e:"Dry-run must not change the world. A webhook that declares SideEffectClassNone or NoneOnDryRun can still run; one that declares Unknown or Some is skipped during dry-run, which prevents a dry-run from accidentally provisioning a resource."},

{q:"What does failurePolicy: Fail on an admission webhook mean?",
 o:["If the webhook is unreachable or returns an error, the request is rejected","The webhook never fails","Errors are silently ignored","The Pod is deleted"],a:0,
 e:"Fail is the safer choice for security-relevant policies — you would rather block than bypass. Ignore keeps the cluster working when the webhook is down, which matters more for non-critical defaulting webhooks."},

{q:"What does namespaceSelector on a webhook configuration do?",
 o:["Names the webhook","Limits the webhook to namespaces with matching labels","Excludes the webhook from the namespace","Sets the webhook priority"],a:1,
 e:"namespaceSelector is the standard way to opt namespaces in or out, for example excluding kube-system from a sidecar injector. objectSelector does the same for individual objects."},

{q:"What does API Priority and Fairness protect against?",
 o:["Image pull rate limits","Storage exhaustion","One client or controller flooding the API server, by isolating requests into priority levels with fair queuing","DNS amplification"],a:2,
 e:"FlowSchemas classify requests by user, group and resource, then route them into PriorityLevelConfigurations. A runaway controller is throttled in its own bucket instead of starving kubectl and system components."},

{q:"What does max-in-flight control in API Priority and Fairness?",
 o:["The number of etcd connections","The total connections to the API server","The kubelet QPS","The concurrency limit for in-flight requests in a priority level"],a:3,
 e:"Each PriorityLevelConfiguration caps how many requests it can have in flight. Requests beyond the cap queue in the fair queue rather than being rejected outright, so bursts are absorbed instead of dropped."},

{q:"What is the API server's default timeout for a single webhook call?",
 o:["Controlled by timeoutSeconds per webhook, typically 10–30 seconds depending on the version","Five minutes","One hour","There is no timeout"],a:0,
 e:"timeoutSeconds is capped by the API server. A webhook that hangs blocks every matching API request, so keep webhooks fast and set the failurePolicy deliberately. Slow webhooks are one of the most common causes of cluster-wide API latency."},

{q:"What does a ValidatingAdmissionPolicy require to take effect?",
 o:["A running webhook server","An in-cluster CEL expression plus a ValidatingAdmissionPolicyBinding; no external webhook is needed","An etcd restart","A separate CRD"],a:1,
 e:"The policy carries the CEL expression and a paramKind for optional parameters; the binding decides which namespaces and resources it applies to. Together they replace a webhook for straightforward validations."},

{q:"Why does server-side apply report a conflict?",
 o:["Because RBAC failed","Because of a webhook timeout","Because different field managers claim ownership of the same field and the update would overwrite another manager","Because the object is cluster-scoped"],a:2,
 e:"Conflicts are a signal that two controllers or people are editing the same field. The fix is to align the managers — for example by making one manager stop writing the field — not to force the update repeatedly."},

/* ---------- 31–40 : Scheduler internals ---------- */
{q:"What does the profiles field in the scheduler configuration allow?",
 o:["Multiple API servers","Multiple kubelets","Multiple CNI plugins","Multiple scheduling profiles, each with its own plugins and configuration, running in one scheduler"],a:3,
 e:"A Pod selects a profile via spec.schedulerName matching the profile's schedulerName. This lets one scheduler binary serve, say, a default profile and a GPU-optimised profile without running two separate Deployments."},

{q:"What does the NodeResourcesFit plugin do?",
 o:["Filters and scores nodes based on whether they have enough CPU, memory and other resources for the Pod","Sets the Pod priority","Handles affinity","Schedules to a specific node"],a:0,
 e:"Its scoring strategy can be LeastAllocated (spread) or MostAllocated (pack). The choice is a direct trade-off between resilience — spreading across nodes — and cost efficiency from higher utilisation."},

{q:"What does the ImageLocality plugin prefer?",
 o:["The first node alphabetically","Nodes that already have the Pod's image cached locally","Nodes with the most free memory","Control-plane nodes"],a:1,
 e:"Starting on a node that already has the image avoids a slow pull and reduces registry traffic. It is a soft score, so it never blocks scheduling — it only breaks ties."},

{q:"What does the InterPodAffinity plugin do?",
 o:["Preempts other Pods","Sets a Pod's priority","Filters and scores nodes based on existing Pods' labels, to co-locate or spread Pods","Assigns IPs"],a:2,
 e:"required and preferred pod affinity and anti-affinity all run through this plugin. topologySpreadConstraints are handled separately by the PodTopologySpread plugin and are often the better tool for N-way spreading."},

{q:"What does the scheduler's cache hold?",
 o:["Audit events","Webhook configurations","etcd snapshots","An informer-backed view of nodes, Pods and assumed bindings, so it can schedule without an API call per decision"],a:3,
 e:"The cache makes scheduling fast. The scheduler also records an assumption when it picks a node, so concurrent scheduling cycles do not overcommit the same node before the binding is persisted."},

{q:"What does percentageOfNodesToScore control?",
 o:["It bounds how many nodes the scheduler examines before it stops searching, which keeps scheduling cost manageable in large clusters","The number of Pods per node","The CPU request","The container concurrency"],a:0,
 e:"The scheduler stops evaluating once it has found enough feasible nodes, and the threshold adapts with cluster size. Raising it improves placement quality at the cost of scheduling latency."},

{q:"What are the three internal queues of the scheduler?",
 o:["Static, dynamic and deferred","Active, backoff and unschedulable","Fast, slow and default","Hot, warm and cold"],a:1,
 e:"Pods move from active to backoff on a transient failure, or to unschedulable when no node can fit them. Cluster events such as a node being added move unschedulable Pods back to active."},

{q:"What does the QueueSort plugin do?",
 o:["Sorts API resources","Orders the nodes","Orders Pods in the scheduling queue, typically by priority and then arrival time","Sorts volumes"],a:2,
 e:"PriorityClass directly affects queue order. A high-priority Pod jumps ahead of lower-priority Pods, which is why setting priorities carelessly can starve batch workloads."},

{q:"What is the PreFilter extension point used for?",
 o:["Mutating the Pod","Validating the Pod","Filtering nodes","Optional per-cycle precomputation that runs once before Filter, so the work is not repeated for every node"],a:3,
 e:"InterPodAffinity uses PreFilter to build a count of matching Pods per topology domain once per cycle. Without it, every node evaluation would repeat the same expensive scan."},

{q:"What does spec.schedulingGates do?",
 o:["Holds the Pod out of the scheduling queue until the gates are removed by an external controller","Locks the Pod to a node","Sets the Pod priority","Enables preemption"],a:0,
 e:"Gates are opaque strings the scheduler does not interpret. This is the native way to let a controller provision a resource or make an admission decision before the Pod competes for capacity."},

/* ---------- 41–50 : Kubelet & CRI ---------- */
{q:"What is PLEG in kubelet?",
 o:["Pre-Log Event Generator","The Pod Lifecycle Event Generator, which periodically syncs Pod state with the container runtime","Persistent Log Event Gateway","Provision Load Event Group"],a:1,
 e:"PLEG is why kubelet knows a container exited. If PLEG is slow or stuck, the node eventually reports NotReady even though the runtime is healthy — a classic sign of runtime or PLEG issues."},

{q:"How does kubelet prove liveness to the control plane?",
 o:["By writing to etcd","By restarting itself","By renewing a Lease object in the kube-node-lease namespace on a short interval","By using SSH"],a:2,
 e:"Lease renewals are lightweight and separate from the full node status update. That is why a node can show a very recent heartbeat while still being unhealthy — check both the Lease and the Node conditions."},

{q:"What are the two kubelet heartbeats?",
 o:["Logs and metrics","DNS and DHCP","HTTPS and HTTP","Node status updates and Lease renewals"],a:3,
 e:"Node status is posted at nodeStatusUpdateFrequency and only when it changes meaningfully. Lease renewals are far more frequent. Both being stale points at a kubelet or network problem, not a workload problem."},

{q:"What is the difference between static Pods and mirror Pods?",
 o:["Static Pods are defined by kubelet manifest files; mirror Pods are their read-only API representation","They are the same thing","Mirror Pods are defined by the API","Static Pods are managed by a Deployment"],a:0,
 e:"kubelet watches the manifest directory and creates a mirror Pod so the Pod is visible through the API, but the API copy cannot be edited or deleted. That is why deleting a static Pod's mirror does nothing."},

{q:"Why does Kubernetes create a pause container (the Pod sandbox) for every Pod?",
 o:["For logging","It holds the network and IPC namespaces so containers can be added or restarted without losing the Pod's network identity","For monitoring","For DNS"],a:1,
 e:"The sandbox owns the namespaces and the Pod IP. Container restarts then happen inside the existing namespaces, so the Pod keeps its IP and its Service endpoints stay stable."},

{q:"Which containerd namespace does kubelet use?",
 o:["default","moby","k8s.io","docker"],a:2,
 e:"This matters when debugging. `ctr` defaults to the default namespace, so `ctr -n k8s.io containers ls` is required to see Kubernetes workloads. Forgetting the namespace is a common reason a container appears to not exist."},

{q:"What does the RuntimeClass handler field select?",
 o:["The CNI plugin","The CSI driver","The API group","The containerd runtime handler, such as runc, runsc or kata, used for the Pod"],a:3,
 e:"The handler name must be configured on every node. A Pod referencing a handler that does not exist on its node stays unschedulable or fails to start, so RuntimeClass rollouts need the node side deployed first."},

{q:"How can kubelet configuration be managed declaratively on kubeadm clusters?",
 o:["Through a kubeletconfig ConfigMap or a KubeletConfiguration file, which kubeadm reads during init and upgrades","Only through command-line flags","Only through environment variables","Only through a CRD"],a:0,
 e:"Keeping kubelet configuration in the ClusterConfiguration or a separate KubeletConfiguration file makes upgrades predictable. Hand-edited unit files are the usual cause of config drift after an upgrade."},

{q:"Which kubelet settings govern graceful node shutdown?",
 o:["--grace-period","shutdownGracePeriod and shutdownGracePeriodCriticalPods","--termination-grace","--kill-timeout"],a:1,
 e:"shutdownGracePeriod is the total time for Pod shutdown; shutdownGracePeriodCriticalPods is the portion reserved for critical Pods. Critical Pods are terminated last so the node does not lose essential services before ordinary workloads stop."},

{q:"How is a node's allocatable resource computed?",
 o:["It is equal to capacity","Capacity minus kubelet memory","Capacity minus kube-reserved, system-reserved and eviction thresholds","The sum requested by the Pods"],a:2,
 e:"Allocatable is what the scheduler can actually use. If allocatable is well below capacity, the node will look half empty to the scheduler even though it is not — check kubeReserved and systemReserved when capacity seems underused."},

/* ---------- 51–60 : Jobs & lifecycle ---------- */
{q:"What does spec.completions set on a Job?",
 o:["The number of retries","The Pod timeout","The parallelism","The target number of successful Pod completions before the Job is marked Complete"],a:3,
 e:"A Job with completions: 10 and parallelism: 2 runs two Pods at a time until ten have succeeded. Setting parallelism equal to completions effectively runs everything at once."},

{q:"What does spec.parallelism set on a Job?",
 o:["The maximum number of Pods the Job may run concurrently","The total completions","The retry count","The CPU request"],a:0,
 e:"parallelism only caps concurrency; it does not affect the completion target. A value of 0 effectively pauses the Job without deleting it, which is useful during an incident."},

{q:"What does completionMode: Indexed provide on a Job?",
 o:["Ordered execution","Each Pod receives a unique completion index via the JOB_COMPLETION_INDEX environment variable, enabling sharded work","Parallel execution only","Pod IP assignment"],a:1,
 e:"Indexed Jobs are the standard way to run a queue or dataset shard per Pod. Each index runs exactly once, and the Job completes when every index has succeeded."},

{q:"What does backoffLimit control?",
 o:["The maximum Pod lifetime","The image pull timeout","The number of retries before the Job is marked Failed","The readiness probe failure count"],a:2,
 e:"Backoff is exponential, capped by the Job controller. Once the limit is reached the Job is marked Failed and no further Pods are created, so alerts should fire on the Job condition rather than on individual Pod failures."},

{q:"What does ttlSecondsAfterFinished do?",
 o:["Deletes the Pod immediately","Adds a sleep before starting","Restarts the Job","Automatically deletes a finished Job and its Pods after the given number of seconds"],a:3,
 e:"Without it, completed Jobs and their Pods accumulate and clutter the namespace. A TTL controller performs the deletion, and the TTL is also visible on CronJob-created Jobs."},

{q:"With restartPolicy: Never, how does a Job count failures?",
 o:["Each failed Pod counts toward backoffLimit and is replaced by a new Pod","Failures are never counted","The Job retries forever","Only the container is restarted"],a:0,
 e:"With OnFailure, the same Pod restarts the container in place. With Never, the Pod terminates and the Job creates a replacement, which makes node-level failure handling cleaner but leaves more Pod objects behind."},

{q:"What does Deployment strategy Recreate do?",
 o:["Adds surge Pods","Terminates all old Pods before starting new ones, causing downtime","Rolls back automatically","Scales the Deployment"],a:1,
 e:"Recreate is sometimes required when two versions cannot run concurrently — for example because they share a database schema or a single-writer lock. Accept the downtime deliberately rather than accidentally."},

{q:"Why set minReadySeconds on a Deployment?",
 o:["To speed up rollouts","To set the image pull policy","So a new Pod must stay Ready for that duration before counting as available, catching flapping Pods","To reduce memory usage"],a:2,
 e:"Without it, a Pod that becomes Ready and then crashes immediately is still counted as available, letting a broken rollout complete. A few seconds of minReadySeconds catches most of these cases cheaply."},

{q:"Why do many teams add a short sleep to a preStop hook?",
 o:["To wait for the container image","To give Prometheus time to scrape","To trigger the readiness probe","To let the endpoint controller remove the Pod from Service endpoints before SIGTERM is sent, avoiding 5xx during rolling updates"],a:3,
 e:"Endpoint removal is asynchronous and can race with the start of termination. A two- or three-second sleep in preStop is the standard, low-cost fix for the 502s that otherwise appear during every rollout."},

{q:"What is the default terminationGracePeriodSeconds and what happens after it?",
 o:["30 seconds; the runtime sends SIGKILL if the container has not exited","60 seconds","0 seconds","Five minutes"],a:0,
 e:"The grace period covers both the preStop hook and the time after SIGTERM. A hook that sleeps longer than the grace period is cut short by SIGKILL, so keep the hook well inside the budget."},

/* ---------- 61–70 : Networking ---------- */
{q:"What does dnsPolicy: ClusterFirst mean?",
 o:["Uses the node resolver only","Uses cluster DNS for name resolution, with forwards to the node resolver for external names","Uses no DNS at all","Uses only the host's /etc/hosts"],a:1,
 e:"ClusterFirst is the default for Pods that are not on hostNetwork. ClusterFirstWithHostNet does the same for hostNetwork Pods, and Default and None give you the node resolver or a fully custom configuration."},

{q:"What does spec.hostAliases do?",
 o:["Adds labels","Sets the Pod hostname","Adds entries to the Pod's /etc/hosts","Sets the DNS server"],a:2,
 e:"hostAliases is the supported way to inject extra name mappings. Editing /etc/hosts at runtime is not possible because kubelet manages that file, and changes would be overwritten."},

{q:"Why does ndots:5 cause extra DNS queries?",
 o:["Because 5 is an odd number","Because it sets a low TTL","Because the cluster always has five search domains","Because a name with fewer than five dots is tried against every search domain before being resolved absolutely"],a:3,
 e:"For a name like api.example.com, that means up to five wasted lookups before the real query. Lowering ndots to 2 for clients that resolve many external names is a common latency fix."},

{q:"What is the kube-proxy nftables mode?",
 o:["A newer implementation that replaces iptables rules with nftables, with better scaling and atomic updates","A Windows-only mode","A backup mode","An etcd mode"],a:0,
 e:"nftables is the modern successor to iptables and avoids the linear rule-evaluation cost that shows up in large clusters. It has been graduating through alpha and beta, so check your version before relying on it."},

{q:"What is a common cause of intermittent connection drops in large clusters?",
 o:["Image pull failures","Conntrack table exhaustion, often on a node forwarding many connections through a Service","Disk full","Missing RBAC"],a:1,
 e:"Every new connection consumes a conntrack entry. High-churn clients such as load generators and gRPC services can exhaust the table, causing silent drops. Raise nf_conntrack_max, reduce churn, or move away from connection tracking where possible."},

{q:"What does Calico BGP mode do?",
 o:["Encrypts Pod traffic","Provides DNS","Advertises Pod and Service routes to the upstream network, so Pods are directly routable","Acts as a load balancer"],a:2,
 e:"BGP mode avoids an overlay, which improves performance and makes Pod IPs routable on the LAN. It requires the network fabric to accept the routes, which is why it is common in on-prem and bare-metal clusters."},

{q:"What does Cilium's WireGuard option provide?",
 o:["Load balancing","DNS caching","Ingress","Transparent node-to-node encryption of Pod traffic without a separate VPN appliance"],a:3,
 e:"WireGuard encryption is configured per cluster and works alongside Cilium's identity-based policies. The main trade-off is throughput on encrypted paths, so benchmark before enabling it everywhere."},

{q:"What is IPAM in a CNI context?",
 o:["The allocation of Pod IP addresses from configured pools","The assignment of Roles","The storage of Pod logs","The distribution of DNS records"],a:0,
 e:"IPAM decides which Pod gets which address and whether it comes from a per-node block or a shared pool. Exhausting the IPAM pool is a common cause of Pods stuck in ContainerCreating."},

{q:"How does a LoadBalancer Service differ from a ClusterIP Service?",
 o:["LoadBalancer is internal only","LoadBalancer asks the cloud provider or MetalLB for an external address that forwards to the Service","ClusterIP is external","They are identical"],a:1,
 e:"LoadBalancer builds on NodePort internally. On a cluster without a cloud provider, the external address stays `<pending>` until something like MetalLB or kube-vip supplies it."},

{q:"What does the default backend of an Ingress controller handle?",
 o:["TLS termination","Rewrites","Requests that do not match any Ingress rule","Health checks"],a:2,
 e:"Without a default backend, unmatched requests usually get a controller-specific 404. Setting one to a friendly page or a metrics sink makes those requests observable rather than confusing."},

/* ---------- 71–80 : Storage & data ---------- */
{q:"What does Velero back up?",
 o:["Only Pods","Only Secrets","Only etcd","Cluster resources plus, through CSI or restic, PersistentVolume data"],a:3,
 e:"Velero also restores into a different cluster or namespace, which makes it a migration tool as well as a backup tool. Test restores regularly — an untested backup is a hope, not a plan."},

{q:"How do you clone a PVC with a CSI driver?",
 o:["Create a new PVC whose dataSource references the source PVC, and the driver provisions a copy","Copy the bytes with dd","Create a new StorageClass","Use kubectl cp"],a:0,
 e:"Cloning is a CSI feature, not a Kubernetes-level copy. It is faster and more consistent than a snapshot-plus-restore cycle because the driver copies at the storage layer."},

{q:"What is the local-path provisioner typically used for?",
 o:["Multi-zone HA","Single-node or development clusters, provisioning hostPath-like volumes on the node","Production databases","Cross-region replication"],a:1,
 e:"K3s ships it by default. The PV is tied to the node, so a Pod rescheduled elsewhere cannot see the data — fine for development, dangerous for anything that needs to survive node loss."},

{q:"What does TopoLVM provide?",
 o:["A DNS cache","An ingress controller","An LVM-backed CSI driver with topology awareness, so volumes land on the node with capacity","A container runtime"],a:2,
 e:"TopoLVM manages a volume group per node and exposes per-node capacity to the scheduler. It is a common way to run stateful workloads with local-disk performance and still get dynamic provisioning."},

{q:"What does a VolumeAttachment object represent?",
 o:["A PersistentVolume","A StorageClass","A snapshot","The attach operation of a volume to a node, tracked by the attach/detach controller"],a:3,
 e:"VolumeAttachment is how Kubernetes coordinates attach and detach so two nodes do not mount the same ReadWriteOnce disk simultaneously. Stuck attachments here are the root cause of Multi-Attach errors."},

{q:"What do topology keys do in a CSI driver?",
 o:["Restrict provisioning and scheduling to nodes that match the volume's topology, such as zone or rack","Set a Pod's node","Configure the CNI","Set the Pod priority"],a:0,
 e:"Topology keys are how zonal cloud disks work safely. Combined with WaitForFirstConsumer, they ensure the PV is created in the zone where the Pod will actually run."},

{q:"What does persistentVolumeClaimRetentionPolicy on a StatefulSet control?",
 o:["The StorageClass","Whether PVCs are deleted when the StatefulSet is deleted or scaled down","The volume size","The reclaim policy"],a:1,
 e:"The default is to keep PVCs so data survives a scale-down. Setting the policy to Delete is appropriate for disposable stateful workloads but dangerous for databases — decide deliberately."},

{q:"Why does a ConfigMap mounted with subPath not receive updates?",
 o:["Because it is read-only","Because of SELinux","Because subPath mounts a single file rather than the whole directory, so kubelet's symlink swap never reaches it","Because ConfigMaps cannot be updated"],a:2,
 e:"kubelet updates ConfigMaps by swapping a symlink at the directory level. A subPath bind-mounts the resolved file, so the swap is invisible. Restart the Pod or mount the directory without subPath if updates matter."},

{q:"What does the Secrets Store CSI driver do?",
 o:["Encrypts Secrets in etcd","Rotates tokens","Replaces RBAC","Mounts secrets from an external store such as Vault or AWS Secrets Manager as volumes, optionally syncing them to Kubernetes Secrets"],a:3,
 e:"It is how many teams avoid putting secrets in etcd at all. The optional sync feature keeps compatibility with workloads that read environment variables, at the cost of reintroducing the etcd copy."},

{q:"What does the ReadWriteOnce access mode actually restrict?",
 o:["Read-write mounting by a single node, though multiple Pods on that node may share it","A single Pod","Read-only access","Multi-zone access"],a:0,
 e:"ReadWriteOnce is node-scoped, not Pod-scoped, which is why two Pods on the same node can both mount it. ReadWriteOncePod is the mode that truly limits it to one Pod."},

/* ---------- 81–90 : GitOps, Helm, Kustomize ---------- */
{q:"What do Argo CD sync waves do?",
 o:["Split resources across clusters","Order resource application by wave annotation, so CRDs and namespaces apply before the workloads that need them","Encrypt the sync","Roll back automatically"],a:1,
 e:"Waves are applied in ascending order, with health checks between waves. That is how a GitOps pipeline avoids the classic 'custom resource applied before its CRD exists' race."},

{q:"What is the Argo CD app-of-apps pattern?",
 o:["A single Helm chart","A Kustomize overlay","One Application that manages other Applications, letting you version a whole platform in Git","A sync wave"],a:2,
 e:"It is a bootstrap pattern: one root Application points at a directory of Application manifests. Adding a new service to the platform then means adding one file, not running kubectl by hand."},

{q:"What does a Flux Kustomization reconcile?",
 o:["A Helm chart","A CRD","An ingress","A directory of Kustomize or plain YAML into the cluster, with pruning and health checks"],a:3,
 e:"Flux's Kustomization is the workload-reconciliation unit, distinct from the Kustomize CLI's kustomization.yaml. It supports dependsOn, which gives you ordering without sync waves."},

{q:"What does a Helm chart contain at minimum?",
 o:["Chart.yaml, a templates directory and values.yaml","A Dockerfile","A kustomization.yaml","A Makefile"],a:0,
 e:"Chart.yaml carries metadata and apiVersion, templates carry the templated manifests, and values.yaml supplies defaults. Charts may also include charts/ for dependencies, crds/ for CRDs, and .helmignore."},

{q:"What does helm test do?",
 o:["Lints the chart","Runs the chart's test hooks against a deployed release","Dry-runs the templates","Rolls back the release"],a:1,
 e:"Test hooks are Pods annotated with helm.sh/hook: test. They are how a chart can verify a deployment post-install — for example, hitting an endpoint or running a smoke-test job."},

{q:"How are Helm charts distributed via OCI registries?",
 o:["They are not","Only with a third-party plugin","helm push and helm pull support OCI since Helm 3.8, so charts live alongside images","Only on Docker Hub"],a:2,
 e:"OCI distribution means one registry, one authentication model and one set of policies for both images and charts. The older chart repository index model still works but is increasingly treated as legacy."},

{q:"What are Kustomize components?",
 o:["Helm subcharts","CRDs","Patches","Reusable, optional pieces an overlay enables with a components list, keeping shared customisations DRY"],a:3,
 e:"Components were added because variants could not be reused across overlays cleanly. A component declares its own kustomization.yaml with kind: Component and is enabled explicitly per overlay."},

{q:"What do Kustomize replacements do?",
 o:["Copy field values from one resource to another, for example inserting an image digest into a Deployment","Delete resources","Rename namespaces","Patch containers"],a:0,
 e:"replacements replaced the older vars and are what you use when a value generated at build time — a ConfigMap name hash, a namespace, an image digest — must be written into another resource."},

{q:"What do configMapGenerator and secretGenerator do?",
 o:["Patch an existing ConfigMap","Create ConfigMaps or Secrets from files or literals, with a content-hash suffix that triggers a rollout on change","Mount a Secret","Delete a ConfigMap"],a:1,
 e:"The hash suffix is the point: changing the source file changes the generated name, which changes the Pod template, which triggers a rolling update. It solves the classic 'I updated the ConfigMap but nothing restarted' problem."},

{q:"What does GitOps drift detection mean?",
 o:["A CNI check","A backup check","Comparing the live cluster state against the desired state in Git, and flagging or correcting differences","A test failure"],a:2,
 e:"Argo CD reports OutOfSync and Flux can be configured to reconcile automatically. Drift detection is what stops ad-hoc kubectl edits from quietly becoming the real source of truth."},

/* ---------- 91–100 : Cost, observability, ops ---------- */
{q:"What does OpenCost provide?",
 o:["Ingress routing","DNS caching","Image signing","Cost allocation by namespace, workload and label, using on-cluster metrics plus cloud pricing data"],a:3,
 e:"OpenCost is the open-source engine behind several commercial offerings. It exposes cost as Prometheus metrics, so you can alert on a runaway namespace the same way you alert on CPU."},

{q:"What is the main trade-off of aggressive bin-packing in the scheduler?",
 o:["Higher utilisation and lower cost, but less headroom for spikes and a larger blast radius if a node fails","Higher cost","Slower scheduling","Better isolation"],a:0,
 e:"MostAllocated scoring packs Pods onto fewer nodes, which is cheaper but fragile. Production clusters usually mix strategies: pack batch workloads, spread latency-sensitive services."},

{q:"What does the VPA recommender component do?",
 o:["Applies requests to Pods","Analyses historical usage and publishes recommended requests and limits in the VPA status","Evicts Pods","Changes node size"],a:1,
 e:"Running VPA in recommendation-only mode is a safe way to right-size requests across a cluster. Only enable the updater once you are confident in the recommendations and have disruption budgets in place."},

{q:"What does the OpenTelemetry Operator provide?",
 o:["A CNI plugin","A CSI driver","Management of OpenTelemetry collectors and auto-instrumentation injection from CRDs","A Helm chart"],a:2,
 e:"The operator turns collector configuration into a CRD and can inject auto-instrumentation into Pods. That makes tracing and metrics setup consistent rather than copy-pasted across services."},

{q:"What kinds of faults can Chaos Mesh inject?",
 o:["Only network faults","Only Pod kills","Only disk faults","Network, Pod, stress and other faults through CRDs, to test resilience"],a:3,
 e:"Chaos Mesh supports network partitions and delays, Pod kills, CPU and memory stress, I/O faults and more. LitmusChaos and Gremlin are common alternatives; the value is running them continuously, not once."},

{q:"How do Velero and Kasten K10 compare?",
 o:["Both back up and restore Kubernetes resources and PV data; Velero is open source and Kasten is a commercial product with a GUI and policy-driven protection","Only Velero exists","Only Kasten exists","They are identical"],a:0,
 e:"Velero is the default open-source choice and integrates with CSI snapshots and restic. Kasten adds application-aware backups, policy engines and a management UI, which matters when many teams share a platform."},

{q:"What does kube-state-metrics expose?",
 o:["Node CPU metrics","Object state metrics derived from the Kubernetes API, such as Deployment replica counts and Pod phases","Application traces","Container logs"],a:1,
 e:"kube-state-metrics answers questions about desired versus actual state — replicas available, Jobs failed, PVCs pending. That is why almost every Kubernetes alerting rule set depends on it rather than on raw CPU metrics."},

{q:"What does node-exporter collect?",
 o:["Kubernetes objects","Container logs","Host-level metrics such as CPU, memory, disk and network, exposed as Prometheus metrics","Cost data"],a:2,
 e:"node-exporter runs as a DaemonSet and reports the node itself, not the workloads. Pair it with kube-state-metrics for object state and cAdvisor or kubelet metrics for container resource usage."},

{q:"Why is metrics-server unsuitable for long-term metrics?",
 o:["It only supports CPU","It requires a database","It is deprecated","It keeps only the latest values for the resource metrics API and has no retention or query language"],a:3,
 e:"metrics-server exists to satisfy the resource metrics API for HPA and kubectl top. Any trend, alerting or capacity planning should use a real time-series store such as Prometheus or Thanos."},

{q:"What does the audit webhook backend do?",
 o:["Sends audit events to an external HTTP endpoint so they can be shipped to a SIEM or log store","Signs images","Encrypts Secrets","Proxies traffic"],a:0,
 e:"Audit backends include log, webhook and the newer batch and kafka-style options. Pair the webhook with an audit policy that captures RequestResponse for sensitive resources and Metadata for everything else."}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Kubernetes Mock Test — Set 4 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
