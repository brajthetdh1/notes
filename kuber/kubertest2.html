<style>
  :root{
    --brand:#1d4ed8;
    --brand-dark:#1e3a8a;
    --accent:#38bdf8;
    --ok:#10b981;
    --bad:#ef4444;
    --warn:#f59e0b;
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#d8e0ea;
    --text:#1c2733;
    --muted:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--brand);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .setpill{background:var(--accent);color:#062b5c;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;
    background:rgba(255,255,255,.16);padding:6px 13px;border-radius:10px;white-space:nowrap;
  }
  .timer.low{background:#dc2626;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1240px;margin:18px auto;padding:0 14px 70px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }

  aside.palette{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    height:fit-content;position:sticky;top:74px;
  }
  @media (max-width:900px){ aside.palette{position:static} }
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-ans{background:#d1fae5;border-color:#10b981!important}
  .lg-mark{background:#fef3c7;border-color:#f59e0b!important}
  .lg-cur{background:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:430px;overflow:auto;padding-right:4px}
  .pbtn{
    border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:8px;
    padding:7px 0;font-size:.76rem;font-weight:600;cursor:pointer;transition:.12s;
  }
  .pbtn:hover{transform:translateY(-1px);border-color:var(--brand)}
  .pbtn.seen{background:#dbeafe;border-color:#bfdbfe}
  .pbtn.answered{background:#d1fae5;border-color:#10b981}
  .pbtn.marked{background:#fef3c7;border-color:#f59e0b}
  .pbtn.current{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px rgba(29,78,216,.3)}

  .progressbar{height:8px;background:#dbe3ec;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progressbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .25s}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(16,40,70,.05)}
  @media (max-width:520px){ .card{padding:16px} }
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .marktag{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;border:1px solid #fbbf24}
  .qtext{font-size:1.04rem;font-weight:600;margin:0 0 18px}
  @media (max-width:520px){ .qtext{font-size:.98rem} }

  .options{display:grid;gap:10px}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
    cursor:pointer;font:inherit;color:inherit;transition:.14s;
  }
  .option:hover{border-color:var(--brand);background:#eff6ff}
  .option .key{
    flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:#e2e8f0;font-weight:700;font-size:.8rem;color:#334155;
  }
  .option .otext{flex:1;font-size:.95rem}
  .option.selected{border-color:var(--brand);background:#dbeafe}
  .option.selected .key{background:var(--brand);color:#fff}
  .option.correct{border-color:var(--ok);background:#ecfdf5}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#f8fafc}

  .explain{margin-top:18px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:0 11px 11px 0;padding:14px 16px;font-size:.92rem}
  .explain-title{font-weight:700;color:#166534;margin-bottom:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    border:1.5px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;
    font-size:.88rem;cursor:pointer;transition:.14s;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.warn{background:#fff7ed;border-color:#fdba74;color:#b45309}
  .btn.warn:hover{background:#ffedd5}
  .btn.danger{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;margin-left:auto}
  .btn.danger:hover{background:#fee2e2}
  @media (max-width:520px){ .btn.danger{margin-left:0;width:100%} }
  .hint{margin-top:12px;font-size:.75rem;color:var(--muted)}
  @media (max-width:640px){ .hint{display:none} }

  .scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-bottom:18px}
  .scorecard h2{margin:0 0 4px}
  .bignum{font-size:3rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:16px;font-size:.9rem}
  .stats b{display:block;font-size:1.3rem}
  .st-ok b{color:var(--ok)} .st-bad b{color:var(--bad)} .st-skip b{color:var(--muted)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
  .fbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .revitem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .revitem.ok{border-left-color:var(--ok)}
  .revitem.bad{border-left-color:var(--bad)}
  .revitem.skip{border-left-color:#94a3b8}
  .revq{font-weight:600;margin:0 0 10px;font-size:.95rem}
  .revline{font-size:.86rem;margin:3px 0}
  .revline .lbl{color:var(--muted);font-weight:600;display:inline-block;min-width:108px}
  .revexp{margin-top:10px;font-size:.85rem;background:#f8fafc;border-radius:8px;padding:10px 12px;color:#334155}
  .tagbad{color:var(--bad);font-weight:700}
  .tagok{color:var(--ok);font-weight:700}
</style>

<header class="topbar">
  <div class="brand">☸️ Kubernetes Mock Test <span class="setpill">SET 2</span> <span class="pill" id="qcountPill">100 Questions</span></div>

</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="palette-head">
      <span>Question Palette</span>
      <button class="fbtn" id="togglePalette" style="padding:3px 10px;font-size:.72rem">Hide</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-cur"></i>Current</span>

  </aside>

  <main class="main">
    <div id="quizView">
      <div class="progressbar"><div id="pbar"></div></div>
      <div class="card">
        <div class="qhead">
          <span class="qnum" id="qnum">Question 1 of 100</span>
          <span class="marktag" id="markTag" hidden>★ Marked for review</span>

        <button class="btn ghost" id="btnPrev">← Previous</button>

<script>
/* ============================================================
   QUESTION BANK — KUBERNETES SET 2 · 100 MCQs
   ============================================================ */
const QS = [

/* ---------- 1–10 : Control-plane HA, kubeadm, upgrades ---------- */
{q:'What is the minimum number of control-plane nodes for a highly available cluster with stacked etcd?',
 o:['Two','Four','Three','One'],a:2,
 e:'etcd needs a Raft majority, so you need an odd number. Three control-plane nodes tolerate one failure; five tolerate two. Two nodes are worse than one for availability because no majority can form.'},

{q:'What does the --control-plane-endpoint flag do in kubeadm init?',
 o:['Sets the Pod network CIDR','Provides a stable load-balanced address for all control-plane nodes, which kubelets and components use to reach the API server','Sets the node name','Configures the cloud provider'],a:1,
 e:'That endpoint is written into kubeconfigs and the kubeadm ClusterConfiguration. Without a stable VIP or load balancer in front of the API servers, joining a second control-plane node and keeping clients connected is fragile.'},

{q:'Under the Kubernetes version skew policy, how far behind the API server can a kubelet be?',
 o:['Up to 3 minor versions older','Up to 1 minor version older','It must match exactly','It can be newer than the API server'],a:0,
 e:'kubelet may not be newer than kube-apiserver and may be up to three minor versions older. kubectl is supported within one minor version either way, which is why the upgrade order matters.'},

{q:'What is the correct upgrade order for a kubeadm-managed cluster?',
 o:['All kubelets first, then the control plane','etcd only, then everything at once','Worker nodes, then the API server','Control plane (including etcd) first, then kubelets and kube-proxy on the nodes'],a:3,
 e:'The control plane must never be older than the kubelets. Upgrade the primary control-plane node with kubeadm upgrade apply, the others with kubeadm upgrade node, then drain and upgrade each worker.'},

{q:'Which command renews all control-plane certificates before they expire?',
 o:['kubeadm token renew','kubectl certificate renew','kubeadm certs renew all','systemctl restart kubelet'],a:2,
 e:'Certificates issued by kubeadm last one year by default. Use kubeadm certs check-expiration to review them, then restart the control-plane static Pods so they pick up the new certs.'},

{q:'What is the difference between stacked etcd and an external etcd topology?',
 o:['Stacked runs etcd as a Deployment','Stacked runs an etcd member on each control-plane node; external runs etcd on dedicated hosts separate from the control plane','External etcd is always faster','Stacked etcd has no quorum'],a:1,
 e:'Stacked is simpler and uses fewer machines but couples etcd performance and failure to the control plane. External separates the two, which is preferred when etcd load or blast radius matters.'},

{q:'Where does kubelet look for static Pod manifests on a kubeadm control-plane node?',
 o:['/etc/kubernetes/manifests','/var/lib/kubelet/static','/etc/kubelet/pods','/opt/kubernetes/manifests'],a:0,
 e:'kubelet watches that directory and runs the kube-apiserver, etcd, controller-manager and scheduler as static Pods. Their mirrored Pod objects are visible through the API as <name>-<node>'},

{q:'How does a new worker node join an existing kubeadm cluster?',
 o:['kubeadm join with a bootstrap token and the CA cert hash','Copying the admin kubeconfig to the node','Installing the API server on the node','kubectl create node'],a:0,
 e:'The token authenticates the node and the CA hash lets it verify the API server. Tokens are short-lived; create a new one with kubeadm token create --print-join-command.'},

{q:'Which command upgrades the control plane of a kubeadm cluster to a new minor version?',
 o:['kubectl upgrade cluster','kubeadm upgrade node','kubeadm upgrade apply v1.x.y','apt upgrade kubernetes'],a:2,
 e:'kubeadm upgrade apply plans and executes the control-plane upgrade on the first node. Other control-plane nodes use kubeadm upgrade node, and workers are drained and upgraded afterwards.'},

{q:'What is the cloud-controller-manager responsible for?',
 o:['Scheduling pods onto nodes','Serving the Kubernetes dashboard','Storing cluster state','Cloud-provider-specific control loops such as load balancers, node lifecycle and routes'],a:3,
 e:'Extracting this from kube-controller-manager let the core project drop provider-specific code. It is what makes a LoadBalancer Service actually provision a cloud load balancer.'},

/* ---------- 11–20 : kubectl power commands ---------- */
{q:'Which patch type performs a strategic merge that understands list merge keys such as containers by name?',
 o:['merge','strategic','json','apply'],a:1,
 e:'Strategic merge patch uses struct tags in the Go types, so lists of containers merge by name rather than being replaced. JSON merge patch replaces arrays wholesale, which is a common source of surprise.'},

{q:'Which command updates the image of a container in a running Deployment?',
 o:['kubectl patch image','kubectl edit image','kubectl replace image','kubectl set image deployment/myapp app=nginx:1.27'],a:3,
 e:'kubectl set image is a shortcut that triggers a rollout. kubectl set env and kubectl set resources do the analogous thing for environment variables and resource requests.'},

{q:'What does kubectl cp do?',
 o:['Copies files between the local filesystem and a container in a Pod','Copies a Pod definition between namespaces','Copies an image between registries','Copies a Secret between namespaces'],a:0,
 e:'It requires tar in the container image, which is why it fails on distroless or scratch images. kubectl exec with a base64-encoded stream is the workaround there.'},

{q:'Which command blocks until a resource reaches a given condition?',
 o:['kubectl watch','kubectl poll','kubectl wait --for=condition=Ready pod/myapp --timeout=120s','kubectl rollout block'],a:2,
 e:'kubectl wait is the correct CI primitive. Available conditions depend on the resource: Available for Deployments, Ready for Pods, Complete for Jobs.'},

{q:'Which command lists the API resources available in the cluster, including CRDs?',
 o:['kubectl get apis','kubectl api-resources','kubectl list types','kubectl explain --all'],a:1,
 e:'Add --namespaced=false to see cluster-scoped types and --api-group to filter. It is the fastest way to check whether a CRD is installed and what short names it has.'},

{q:'How do you manually trigger a Job from an existing CronJob?',
 o:['kubectl trigger cronjob/myjob','kubectl run --from cronjob/myjob','kubectl patch cronjob/myjob --trigger','kubectl create job --from=cronjob/myjob myjob-manual'],a:3,
 e:'This creates a one-off Job using the CronJob template, which is exactly what you want when a scheduled run failed and you need to replay it immediately.'},

{q:'How do you force a rolling restart of a Deployment without changing the image?',
 o:['kubectl rollout restart deployment/myapp','kubectl restart deployment/myapp','kubectl delete pods -l app=myapp','kubectl scale deployment/myapp --replicas=0'],a:0,
 e:'It patches a restart annotation on the Pod template, producing a new ReplicaSet and a normal rolling update. Deleting Pods is also possible but bypasses rollout controls and readiness.'},

{q:'Which command starts an ephemeral debug container inside an existing Pod?',
 o:['kubectl attach --debug','kubectl exec --init','kubectl debug -it pod/myapp --image=busybox --target=myapp','kubectl shell pod/myapp --debug'],a:2,
 e:'Ephemeral containers cannot be removed and do not appear in the Pod restart policy. With --target they share the target container process namespace, which is how you inspect a distroless workload.'},

{q:'Which command sorts cluster Events by their last timestamp?',
 o:['kubectl events --order=time','kubectl get events --sort-by=.lastTimestamp','kubectl get events --newest','kubectl describe events --sort'],a:1,
 e:'Events are namespaced and expire quickly by default. --sort-by=.lastTimestamp or .metadata.creationTimestamp makes recent failures easy to spot.'},

{q:'How do you mint a short-lived token for a ServiceAccount using kubectl?',
 o:['kubectl get secret sa-token','kubectl create secret token sa','kubectl auth token sa','kubectl create token mysa --duration=1h'],a:3,
 e:'Since the legacy auto-generated token Secrets were deprecated, kubectl create token requests a bound token from the TokenRequest API with an explicit audience and lifetime.'},

/* ---------- 21–30 : Rollout tuning & strategies ---------- */
{q:'What does minReadySeconds do in a Deployment?',
 o:['Sets the probe interval','Requires a new Pod to stay Ready for that many seconds before it counts as available, slowing rollouts and catching flapping Pods','Sets the termination grace period','Sets the rollout timeout'],a:1,
 e:'Without it, a Pod that becomes Ready and immediately crashes can be counted as available, letting a bad rollout complete. It is a cheap safety net for unstable applications.'},

{q:'What does progressDeadlineSeconds control?',
 o:['The lifetime of the old ReplicaSet','How long a Job may run','How long a rollout may make no progress before it is marked as failed','The Pod termination grace period'],a:2,
 e:'Exceeding it sets the Deployment condition Progressing=False with reason ProgressDeadlineExceeded. It does not roll back automatically — kubectl rollout undo or a GitOps revert is still needed.'},

{q:'What does revisionHistoryLimit set on a Deployment?',
 o:['The maximum number of Pods','The number of days a revision is kept','The number of ConfigMaps used','How many old ReplicaSets are retained for rollback'],a:3,
 e:'The default is 10. Old ReplicaSets are cheap because they usually have zero replicas, but in clusters with thousands of Deployments they add up in etcd, so lowering it is common.'},

{q:'What does pausing a Deployment do?',
 o:['It stops all reconciliation of the Pod template, letting you make several changes and then resume with a single rollout','It scales the Deployment to zero','It stops the Pods from receiving traffic','It freezes the image tag'],a:0,
 e:'kubectl rollout pause followed by several edits and kubectl rollout resume produces one rollout instead of several, which matters when you change both image and resources together.'},

{q:'How is a canary release typically implemented with plain Deployments?',
 o:['By editing the Service selector to point at one Pod','By running two Deployments with the same app label but different versions, and splitting traffic with replica counts or a mesh/Ingress weight','By using a StatefulSet','By scaling the old Deployment to zero immediately'],a:1,
 e:'Plain Kubernetes has no traffic splitting. You either approximate it with replica ratios, which is imprecise, or delegate weight to an Ingress controller, a service mesh or a tool like Argo Rollouts.'},

{q:'What does Argo Rollouts add over a native Deployment?',
 o:['It replaces the scheduler','Canary and blue-green strategies with analysis, traffic weighting and automated promotion or rollback via a Rollout CRD','It manages etcd','It provides persistent storage'],a:1,
 e:'A Rollout object plus an AnalysisTemplate can query Prometheus and abort a release automatically. Flagger is the other mainstream tool for the same job.'},

{q:'With maxSurge: 25% and maxUnavailable: 0 on 4 replicas, what happens during a rollout?',
 o:['All Pods are killed and recreated','Two Pods are terminated first','No Pods are created until one is deleted','One extra Pod is created (rounded up), and no existing Pod is removed until a new one is Ready'],a:3,
 e:'25% of 4 rounds up to 1 surge Pod, and maxUnavailable 0 means availability never drops. This gives a zero-downtime rollout at the cost of temporarily running one extra replica.'},

{q:'How do you roll back a Deployment to a specific older revision?',
 o:['kubectl rollout undo deployment/myapp --to-revision=3','kubectl rollout revert deployment/myapp 3','kubectl apply --revision 3','kubectl history restore 3'],a:0,
 e:'List revisions with kubectl rollout history deployment/myapp, which shows change-cause annotations if you set them with --record or the kubernetes.io/change-cause annotation.'},

{q:'What is the main difference between blue-green and canary?',
 o:['Blue-green has no rollback path','Blue-green switches all traffic to a fully deployed new version at once; canary sends a small percentage of traffic first','Canary requires two clusters','They are the same strategy'],a:1,
 e:'Blue-green gives instant rollback by switching the Service back, and instant cutover risk. Canary limits blast radius but needs traffic weighting and meaningful metrics to decide promotion.'},

{q:'Which command shows the status of an in-progress rollout with progress updates?',
 o:['kubectl describe deployment','kubectl get pods -w','kubectl rollout status deployment/myapp','kubectl logs deploy/myapp'],a:2,
 e:'rollout status prints the current state and blocks until completion or failure. In CI it is the standard gate before promoting to the next environment.'},

/* ---------- 31–40 : DNS, Services, networking ---------- */
{q:'What is the fully qualified DNS name of a Service named api in namespace prod?',
 o:['api.svc.prod','api.prod.svc','api.prod.svc.cluster.local','prod.api.cluster.local'],a:2,
 e:'The form is <service>.<namespace>.svc.<domain>, with cluster.local as the default cluster domain. Clients in the same namespace can use just api.'},

{q:'What does the ndots:5 setting in a Pod resolv.conf affect?',
 o:['How many dots a name must contain before it is tried as absolute first, which causes extra DNS queries for external names','The DNS TTL','The number of search domains','The resolver timeout'],a:0,
 e:'With ndots:5, a name like api.example.com is tried against every search domain before being resolved absolutely, multiplying queries. Lowering ndots is a common fix for DNS latency.'},

{q:'What are EndpointSlices used for?',
 o:['Splitting Services across clusters','Storing TLS certificates','Replacing ConfigMaps','Scalably tracking Service endpoints, replacing the single Endpoints object for large Services'],a:3,
 e:'A single Endpoints object for a Service with thousands of Pods becomes huge and causes churn. EndpointSlices split endpoints into chunks of up to 100 and support topology hints.'},

{q:'Which Service setting keeps a client on the same Pod for the duration of a session?',
 o:['externalTrafficPolicy: Local','sessionAffinity: ClientIP','publishNotReadyAddresses: true','internalTrafficPolicy: Local'],a:1,
 e:'The default is sessionAffinity: None. ClientIP affinity is IP-based and therefore coarse behind NAT; application-level session handling is usually more reliable.'},

{q:'What is a major advantage of IPVS mode over iptables mode for kube-proxy in large clusters?',
 o:['IPVS supports network policies','IPVS is the only mode that works with IPv6','IPVS uses hash tables, so rule update cost does not grow linearly with the number of Services','IPVS does not need a CNI'],a:2,
 e:'iptables performance degrades as the rule set grows into the tens of thousands. IPVS scales better and offers more load-balancing algorithms, at the cost of extra operational complexity.'},

{q:'What does hostNetwork: true do to a Pod?',
 o:['It uses the node network namespace, so the Pod sees the node IPs and binds directly to node ports','It assigns a public IP to the Pod','It creates a NodePort Service','It enables IPv6'],a:0,
 e:'Common for CNI agents and node-level controllers. Two Pods with hostNetwork on the same node cannot bind the same port, and network policies generally do not apply.'},

{q:'How does the Gateway API differ from Ingress?',
 o:['It only works on cloud providers','It replaces Services entirely','It is an older, deprecated API','It uses role-oriented resources (GatewayClass, Gateway, HTTPRoute) and supports richer routing such as header matching and traffic splitting natively'],a:3,
 e:'Ingress has a minimal, ambiguous spec that each controller implements differently. Gateway API standardises routing and splits ownership between infrastructure and application teams.'},

{q:'What does dual-stack support in Kubernetes mean?',
 o:['Two CNI plugins per node','Pods and Services can have both IPv4 and IPv6 addresses, with the cluster able to route both families','Two kube-proxies per node','Two DNS servers'],a:1,
 e:'It requires a CNI that supports both families and matching settings on the cluster. A Service can be single-stack or dual-stack, and each family has its own CIDRs.'},

{q:'What resolves cluster DNS names by default?',
 o:['kube-proxy','etcd','CoreDNS, deployed as a Deployment behind the kube-dns Service','The kubelet'],a:2,
 e:'CoreDNS replaced kube-dns as the default. It is configured by a ConfigMap named coredns in kube-system, and its upstream forwarders come from there.'},

{q:'How do you implement default-deny ingress for a namespace?',
 o:['Create a NetworkPolicy that selects all Pods with podSelector: {} and an empty ingress rule list','Delete the default ServiceAccount','Set hostNetwork to false','Disable the CNI'],a:0,
 e:'An empty ingress: [] means no ingress is allowed. You then add allow policies on top. This requires a CNI that enforces NetworkPolicy, such as Calico, Cilium or Antrea.'},

/* ---------- 41–50 : Storage ---------- */
{q:'Which PersistentVolume reclaim policy keeps the underlying storage and data after the PVC is deleted?',
 o:['Delete','Retain','Recycle','Archive'],a:1,
 e:'Delete removes the backing volume; Recycle does a basic scrub and is deprecated. Retain leaves the PV in Released state so an administrator can recover data or rebind it deliberately.'},

{q:'What does volumeBindingMode: WaitForFirstConsumer do?',
 o:['Delays PVC binding until a Pod using it is scheduled','Binds the PVC to the first PV in the cluster','Deletes the PVC after use','Binds the PVC immediately on creation'],a:0,
 e:'This is essential for topology-constrained storage such as zonal disks. The provisioner waits so the PV is created in the zone where the Pod will actually run, avoiding unschedulable Pods.'},

{q:'A Pod is stuck in ContainerCreating with a Multi-Attach error. What is the usual cause?',
 o:['A ReadWriteOnce volume is still attached to another node after a Pod reschedule','The image pull failed','The readiness probe failed','The Service has no endpoints'],a:0,
 e:'RWO means one node at a time. If the old Pod is still running on another node, or the detach has not completed, the new Pod cannot attach the disk. Fix the old Pod or use RWX storage.'},

{q:'Which resource captures a point-in-time copy of a PVC for backup or cloning?',
 o:['VolumeBackup','PersistentVolumeClone','VolumeSnapshot, provided a CSI driver with snapshot support is installed','ConfigMap snapshot'],a:2,
 e:'VolumeSnapshotClass and VolumeSnapshotContent mirror the PV/PVC/StorageClass model. Restoring creates a new PVC whose dataSource points at the snapshot.'},

{q:'What does setting volumeName on a PVC do?',
 o:['Renames the PV','Pre-binds the PVC to a specific existing PV instead of letting the binder choose','Makes the volume read-only','Enables dynamic provisioning'],a:1,
 e:'It is a deliberate manual binding, typically when you want a Pod to reuse data on a Retained PV. If the named PV does not exist or does not match, the PVC stays Pending.'},

{q:'What does marking a ConfigMap immutable do?',
 o:['Encrypts its contents','Prevents deletion','Makes it read-only for Pods','Prevents any updates to its data, which reduces API server load and lets kubelets stop watching it'],a:3,
 e:'Immutable ConfigMaps and Secrets improve cluster performance at scale because kubelets can cache them without watches. To change one, you create a new object with a new name.'},

{q:'Which Secret type is used to hold registry credentials for imagePullSecrets?',
 o:['kubernetes.io/dockerconfigjson','Opaque','kubernetes.io/tls','kubernetes.io/basic-auth'],a:0,
 e:'kubectl create secret docker-registry generates it. kubernetes.io/tls holds a cert and key; service-account-token is the legacy token type; Opaque is for arbitrary key-value data.'},

{q:'Which of these is a valid EncryptionConfiguration provider for encrypting Secrets at rest in etcd?',
 o:['sha256','aescbc, aesgcm, secretbox or kms','base64','jwt'],a:1,
 e:'aescbc is common but kms is recommended for production because the key never has to live on the API server host. identity means no encryption, which is the default if nothing is configured.'},

{q:'What does a CSI driver provide?',
 o:['A CNI plugin','A standard implementation of storage operations — provisioning, attach, mount and snapshot — that works across orchestrators','A DNS server','An admission webhook'],a:1,
 e:'CSI replaced in-tree volume plugins. Storage vendors write one driver and it works with Kubernetes and other orchestrators, which is why the in-tree cloud providers were removed.'},

{q:'How does dynamic provisioning differ from static provisioning?',
 o:['Dynamic provisions PVs in advance by an administrator','Static creates PVs at Pod runtime','Static requires the CNI to create volumes','Dynamic creates a PV automatically when a PVC referencing a StorageClass is created'],a:3,
 e:'Dynamic provisioning removes the need for administrators to pre-create PVs. The StorageClass provisioner creates a PV that satisfies the claim, and the reclaim policy handles cleanup.'},

/* ---------- 51–60 : Resource governance & scheduling ---------- */
{q:'What does a LimitRange set?',
 o:['Cluster-wide total quotas','Pod priority classes','Default and min/max resource requests and limits for Pods and containers in a namespace','Node taints'],a:2,
 e:'A LimitRange supplies defaults when a container specifies nothing, and can reject Pods that exceed a maximum. It works per object, unlike ResourceQuota which caps totals.'},

{q:'Which ResourceQuota scope targets Pods with no requests or limits set?',
 o:['BestEffort','NotTerminating','Guaranteed','PriorityClass'],a:0,
 e:'BestEffort scopes the quota to Pods with no resource requirements. Other scopes include NotBestEffort, Terminating and NotTerminating, and you can combine them with a PriorityClass.'},

{q:'How does preemption work when a high-priority Pod cannot be scheduled?',
 o:['The scheduler waits indefinitely','It evicts lower-priority Pods on a suitable node to make room, unless preemptionPolicy is Never','It scales the node pool immediately','It rejects the Pod permanently'],a:1,
 e:'Victims are chosen to minimise disruption, and the preempted Pods are rescheduled elsewhere if capacity allows. The Cluster Autoscaler is what adds nodes; preemption only rearranges what exists.'},

{q:'What is the difference between evicting a Pod and deleting it?',
 o:['They are identical','Deleting respects PDBs; evicting ignores them','Evicting is faster','Eviction goes through the Eviction API, which respects PodDisruptionBudgets; a plain delete bypasses them'],a:3,
 e:'kubectl drain uses the Eviction API, which is why a PDB can block a drain. kubectl delete pod removes the object regardless, so it should not be used for maintenance operations.'},

{q:'Which Node condition indicates the kubelet can reach the API server and the node is functional?',
 o:['MemoryPressure','DiskPressure','Ready','PIDPressure'],a:2,
 e:'Ready=True means the node is healthy. The pressure conditions (MemoryPressure, DiskPressure, PIDPressure) signal resource exhaustion that can trigger Pod eviction.'},

{q:'What happens to Pods on a node that is under DiskPressure?',
 o:['BestEffort and over-requesting Pods are evicted by kubelet, and new Pods are not admitted','All Pods are deleted immediately','Pods are moved to another node automatically','Nothing happens'],a:0,
 e:'kubelet evicts local Pods to reclaim the resource; it does not reschedule them. The scheduler simply stops placing new Pods there until the pressure clears.'},

{q:'Which quota field caps the sum of CPU requests across Pods in a namespace?',
 o:['limits.cpu','requests.cpu','cpu.total','requests-cpu'],a:1,
 e:'requests.cpu and requests.memory cap total requests; limits.cpu and limits.memory cap total limits. If a quota is present, every incoming Pod must declare the corresponding fields or it is rejected.'},

{q:'What does the Descheduler do?',
 o:['Adds nodes to the cluster','Deletes completed Jobs','Evicts Pods that violate desired scheduling properties, such as spreading across zones or avoiding a hot node','Compresses etcd'],a:2,
 e:'The scheduler only places Pods once. The Descheduler periodically rebalances so long-running clusters do not drift into a skewed or fragmented state.'},

{q:'How does Karpenter differ from the Cluster Autoscaler?',
 o:['Karpenter only works on GKE','Karpenter replaces the scheduler','Karpenter is a metrics server','Karpenter provisions nodes directly, choosing instance types and sizes from pending Pod requirements, rather than scaling fixed node groups'],a:3,
 e:'Because it bypasses pre-defined node groups, Karpenter can consolidate and bin-pack far more aggressively. It is AWS-first with growing support elsewhere.'},

{q:'What does the InPlacePodVerticalScaling feature gate enable?',
 o:['Changing a running container CPU or memory requests and limits without restarting the Pod','Resizing volumes','Scaling nodes','Rescaling Deployments'],a:0,
 e:'Where it is available, updates to resources on a running Pod are applied in place instead of requiring a recreate, which matters for stateful and long-running workloads.'},

/* ---------- 61–70 : Security ---------- */
{q:'What does a seccomp profile do for a container?',
 o:['Encrypts the filesystem','Restricts which syscalls the process may make, reducing kernel attack surface','Limits network egress','Enforces RBAC'],a:1,
 e:'RuntimeDefault is a reasonable baseline that blocks dangerous syscalls while keeping normal applications working. Custom profiles can be far stricter at the cost of compatibility.'},

{q:'How is an AppArmor profile applied to a Pod on a modern cluster?',
 o:['With the security.beta.kubernetes.io/apparmor annotation','With a NetworkPolicy','With a ResourceQuota','With the container securityContext appArmorProfile field (or the legacy annotation)'],a:3,
 e:'AppArmor requires the profile to be loaded on every node. Use a DaemonSet or a node image build to distribute profiles before referencing them in a Pod spec.'},

{q:'What does securityContext.readOnlyRootFilesystem: true accomplish?',
 o:['Mounts the container root filesystem read-only, so a compromised process cannot modify binaries or write a payload','Makes volumes read-only','Prevents image pulls','Disables logging'],a:0,
 e:'Most applications still need writable /tmp and caches, so pair it with emptyDir or tmpfs mounts at those paths. It is a strong, cheap hardening measure.'},

{q:'Which three modes does Pod Security Admission support per namespace?',
 o:['Allow, Deny, Log','Open, Closed, Mixed','enforce, audit, warn','Permissive, Enforcing, Silent'],a:2,
 e:'Each mode is labelled separately, for example pod-security.kubernetes.io/enforce=restricted. audit and warn let you roll out a stricter level without breaking workloads immediately.'},

{q:'What is a RuntimeClass used for?',
 o:['Choosing a container image','Selecting which container runtime handles a Pod, for example gVisor or Kata for stronger isolation','Setting the CNI plugin','Defining a StorageClass'],a:1,
 e:'A RuntimeClass names a handler configured on the nodes. It lets you run most workloads on runc and route sensitive ones to an isolated runtime without separate clusters.'},

{q:'What is the default lifetime of a ServiceAccount token projected into a Pod?',
 o:['Forever','24 hours','One year','One hour, after which kubelet refreshes it (and it is audience-bound)'],a:3,
 e:'Bound, audience-scoped tokens replaced the old non-expiring Secrets. That is a major security improvement because stolen tokens stop working and are scoped to the API audience.'},

{q:'What does the API server audit log record?',
 o:['Each request with its identity, verb, resource, decision and response, according to the audit policy','Container stdout','etcd disk usage','Node metrics'],a:0,
 e:'Audit policy levels run from None through Metadata and Request to RequestResponse. Recording at RequestResponse is verbose, so policies usually apply that level only to sensitive resources.'},

{q:'What does API Priority and Fairness protect against?',
 o:['Image pull rate limits','etcd disk exhaustion','One client or controller flooding the API server and starving others, by isolating requests into priority levels with fair queuing','Node memory pressure'],a:2,
 e:'FlowSchemas route requests into PriorityLevelConfigurations. This is why a runaway controller can no longer lock out kubectl or critical system components.'},

{q:'What is an aggregated ClusterRole?',
 o:['A ClusterRole created by the API server','A ClusterRole that combines rules from several other ClusterRoles via the aggregationRule selector','A ClusterRole bound to every namespace','A ClusterRole with no rules'],a:1,
 e:'The built-in admin and edit roles aggregate rules from roles labelled rbac.authorization.k8s.io/aggregate-to-admin. It lets operators extend built-in roles without editing them.'},

{q:'Which RBAC field restricts a permission to specific named objects?',
 o:['verbs','apiGroups','resourceNames','nonResourceURLs'],a:2,
 e:'resourceNames limits a rule to named objects, such as a single Secret or ConfigMap. It does not work for list, watch or create because those acts are not scoped to one name.'},

/* ---------- 71–80 : Workloads & lifecycle ---------- */
{q:'What is an ephemeral container used for?',
 o:['Debugging a running Pod, especially one without a shell, without restarting it','Temporary storage','Running a Job','A short-lived Service'],a:0,
 e:'Ephemeral containers are added to a running Pod via the ephemeralcontainers subresource. They cannot be removed, have no probes, and are excluded from the Pod restart policy.'},

{q:'What is a native sidecar container in modern Kubernetes?',
 o:['A second container in the same Pod','An init container with restartPolicy: Always, which starts alongside the app and is shut down after it','A DaemonSet Pod','A container with no limits'],a:1,
 e:'Making init containers restartable gives sidecars correct startup ordering and, importantly, correct shutdown ordering, which the classic sidecar pattern could not guarantee.'},

{q:'What does Pod phase Unknown indicate?',
 o:['The image does not exist','The Pod state could not be obtained, usually because the node is unreachable','The Pod was evicted','The Pod is being created'],a:1,
 e:'Unknown usually follows a network partition to the node or a kubelet failure. The control plane cannot confirm the state, so it reports Unknown rather than guessing.'},

{q:'Which combination produces the Guaranteed QoS class?',
 o:['No requests or limits set','Only limits set','Requests set but lower than limits','Requests equal to limits for CPU and memory in every container'],a:3,
 e:'Guaranteed Pods are the last to be evicted under node pressure. BestEffort has nothing set, and Burstable is everything in between.'},

{q:'Which restartPolicy should a Job Pod typically use?',
 o:['Never or OnFailure','Always','UnlessStopped','RestartOnExit'],a:0,
 e:'Always is invalid for Jobs, because a container that keeps restarting never completes. backoffLimit controls how many failed attempts are tolerated before the Job is marked Failed.'},

{q:'What does a CronJob concurrencyPolicy: Forbid do?',
 o:['Skips all future runs','Runs jobs in parallel','Skips a new run if the previous one is still running','Deletes the previous Job'],a:2,
 e:'Allow (the default) runs them concurrently, Forbid skips the new run, and Replace kills the running Job and starts a new one.'},

{q:'What does StatefulSet podManagementPolicy: Parallel change?',
 o:['It scales in parallel with the Deployment','Pods are created and deleted in parallel instead of in strict ordinal order, trading ordering guarantees for faster startup','It enables parallel storage provisioning','It disables the headless Service'],a:1,
 e:'The default is OrderedReady. Parallel is appropriate for replicas that do not need to form a cluster in sequence, such as a sharded cache.'},

{q:'What do DaemonSet Pods need to run on tainted control-plane nodes?',
 o:['A NodePort Service','A PriorityClass','A ResourceQuota','Matching tolerations for the node taints'],a:3,
 e:'DaemonSet controllers do not add tolerations automatically. Node agents that must run everywhere usually tolerate node-role.kubernetes.io/control-plane and the NoSchedule taint.'},

{q:'An init container keeps failing and the Pod never starts. What will you see?',
 o:['Pod phase Pending with Init:CrashLoopBackOff or Init:Error in the container statuses','The Pod runs but the app container crashes','The Pod is Succeeded','Nothing at all'],a:0,
 e:'Because the app containers have not started, there are no app logs. kubectl logs <pod> -c <init-container> shows why the init step is failing.'},

{q:'What does shareProcessNamespace: true on a Pod enable?',
 o:['Sharing volumes between Pods','Sharing the network namespace','Containers in the Pod seeing and signalling each other processes, with a single PID 1 for the Pod','Sharing the host PID namespace'],a:2,
 e:'It is used by debug sidecars and process supervisors. Note that it changes which process is PID 1, so signal handling in the main container can be affected.'},

/* ---------- 81–90 : Ecosystem & tooling ---------- */
{q:'What is the core difference between Argo CD and Flux?',
 o:['Flux has no Git support','Both are GitOps controllers; Argo CD has a richer UI and application model, Flux is more composable CLI-driven tooling','Argo CD only works with Helm','Flux only works with Kustomize'],a:1,
 e:'Both reconcile cluster state from Git. Argo CD focuses on a visual application model and multi-cluster UI; Flux is a set of controllers designed to be assembled.'},

{q:'What is a Helm hook used for?',
 o:['Caching chart values','Linting templates','Storing release history','Running a resource at a specific point in the release lifecycle, such as a pre-install migration Job or a post-install smoke test'],a:3,
 e:'Hooks are annotated with helm.sh/hook, and their ordering and deletion policy are configurable. They are the standard way to sequence database migrations with a deploy.'},

{q:'How do you revert to a previous release with Helm?',
 o:['helm rollback <release> <revision>','helm revert <release>','helm undo <release>','helm history --restore <release>'],a:0,
 e:'Helm keeps every revision, so rollback creates a new revision with the old manifests. helm history shows the revisions and their statuses.'},

{q:'Which Kustomize feature lets you patch only part of a resource in an overlay?',
 o:['kustomize delete','kustomize replace','patches (or patchesStrategicMerge) referencing a partial YAML file that is merged into the base','kustomize copy'],a:2,
 e:'Strategic merge patches match list entries by key, so a patch containing only the changed container merges correctly. JSON6902 patches are the alternative for precise operations.'},

{q:'What is Krew?',
 o:['A Kubernetes distribution','A plugin manager for kubectl that installs and updates community plugins','A CNI plugin','A chart repository'],a:1,
 e:'kubectl krew install <plugin> adds plugins such as ctx, ns, neat and tree, which many teams consider essential quality-of-life tooling.'},

{q:'What do kubectx and kubens do?',
 o:['Build images and push them','Manage Helm releases','Rotate certificates and tokens','Switch quickly between kubeconfig contexts and namespaces'],a:3,
 e:'They are thin wrappers over kubectl config use-context and config set-context --current --namespace. Both are installable through Krew.'},

{q:'What is Stern used for?',
 o:['Tailing logs from multiple Pods and containers at once, with pattern matching and colour-coded output','Scanning images','Running a service mesh','Backing up etcd'],a:0,
 e:'It solves the common problem of wanting logs from all replicas of a Deployment. kubectl logs can only follow a single Pod, or with -l, a limited selection.'},

{q:'What does kube-state-metrics expose?',
 o:['Node CPU and memory usage','Container filesystem usage','Object state metrics such as Deployment replica counts, Pod phases and Job statuses, derived from the Kubernetes API','etcd latency'],a:2,
 e:'It answers questions about desired versus actual state, which node-exporter and metrics-server cannot. Prometheus alerting rules for Kubernetes almost always rely on it.'},

{q:'What is a ServiceMonitor?',
 o:['A DaemonSet that scrapes nodes','A Prometheus Operator CRD that declaratively defines which Services to scrape and on which port and path','A Service type','A NetworkPolicy'],a:1,
 e:'It removes the need to hand-edit prometheus.yml. The operator renders scrape configs from ServiceMonitors and reloads Prometheus automatically.'},

{q:'What is the most common pattern for cluster-wide log collection?',
 o:['A sidecar per Pod','A CronJob that copies files','Logging to etcd','A DaemonSet running an agent such as fluent-bit that reads container log files on each node and ships them'],a:3,
 e:'A node agent is cheap and covers every Pod without per-workload changes. Sidecars are used when the application writes to files and needs its own tailer.'},

/* ---------- 91–100 : API machinery & advanced ---------- */
{q:'What is the stability guarantee for an alpha API version?',
 o:['It is stable and safe for production','It is deprecated and will be removed soon','It may be changed or removed without notice and is disabled by default','It is supported for five years'],a:2,
 e:'Alpha (v1alpha1) is experimental. Beta (v1beta1) is enabled by default and generally well tested but may still change. GA (v1) is stable with a compatibility commitment.'},

{q:'What is a feature gate?',
 o:['A per-component toggle that enables or disables a specific Kubernetes feature, often alpha by default','A node label','An admission policy','A Service annotation'],a:0,
 e:'Feature gates are set with --feature-gates=Name=true on components such as the API server and kubelet. They are how the project stages new functionality.'},

{q:'What does an APIService object do?',
 o:['Defines a Service for the API server','Registers an aggregated API server so its resources are served under a custom API group by the main API server','Creates a ClusterRole','Defines a CRD'],a:1,
 e:'Aggregation is how metrics.k8s.io is served by metrics-server and how some extension APIs work. The API server proxies requests to the registered backend Service.'},

{q:'What is a CRD conversion webhook used for?',
 o:['Converting YAML to JSON','Converting admission requests','Converting RBAC rules','Translating between different versions of a custom resource when the stored version differs from the requested one'],a:3,
 e:'Without it, multiple versions must be identical in schema. The webhook lets you serve v1 and v1beta1 with real translation, so users can migrate gradually.'},

{q:'What does ValidatingAdmissionPolicy (CEL) provide?',
 o:['A replacement for RBAC','A CNI plugin','In-cluster validation written in CEL, without deploying and operating an admission webhook','Automatic image scanning'],a:2,
 e:'It runs in the API server, so it has no network hop and no availability risk from a broken webhook. Webhooks are still needed for mutation and for external data lookups.'},

{q:'What does mTLS in a service mesh provide?',
 o:['Mutual authentication and encryption between workloads, with automatic certificate issuance and rotation','Node-level firewalling','DNS caching','Image signing'],a:0,
 e:'The mesh sidecar or node proxy handles handshakes and rotation, so applications do not manage certificates. Authorization policies then build on the verified workload identity.'},

{q:'What is a distinguishing feature of Cilium?',
 o:['It only supports IPv4','It uses eBPF in the kernel for networking, security and observability, reducing reliance on iptables','It replaces the API server','It is a storage plugin'],a:1,
 e:'Cilium also provides L7-aware network policies and a Hubble observability layer. Its eBPF datapath is a major reason it scales well in large clusters.'},

{q:'What does the Node Problem Detector do?',
 o:['Detects Pods with failing probes','Runs CNI plugins','Monitors node disk usage only','Watches node-level problems such as kernel deadlocks and reports them as Node conditions and Events'],a:3,
 e:'It bridges node-level symptoms that kubelet does not interpret into something the control plane can act on, such as marking a node NotReady for a specific hardware fault.'},

{q:'What is Cluster API (CAPI)?',
 o:['The Kubernetes REST API','A CNI plugin','A set of CRDs and controllers that manage the lifecycle of Kubernetes clusters themselves declaratively','A logging stack'],a:2,
 e:'CAPI treats clusters as Kubernetes objects, so you can create, upgrade and scale clusters with the same reconcile-loop model as workloads. It is the foundation of many internal platforms.'},

{q:'Why does kubectl get all not show every object in a namespace?',
 o:['It only covers a fixed set of common resources (Pods, Services, Deployments, ReplicaSets, StatefulSets, DaemonSets, Jobs, CronJobs), omitting ConfigMaps, Secrets, PVCs, Ingresses and CRDs','It only shows Pods','It shows deleted objects','It requires a flag'],a:0,
 e:'It is a convenience alias, not a complete listing. Use kubectl api-resources --verbs=list --namespaced and loop over the types to get a genuine inventory.'}

/* ============================================================
   STATE + APP LOGIC
   ============================================================ */
const TOTAL_SECONDS = 120 * 60;
let remaining = TOTAL_SECONDS;
let timerId = null;

const state = {
  cur: 0,
  ans:     new Array(QS.length).fill(null),
  revealed:new Array(QS.length).fill(false),
  marked:  new Array(QS.length).fill(false),
  visited: new Array(QS.length).fill(false),
  submitted:false
};

const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimer(){
  const t = $('timer');
  t.textContent = fmt(remaining);
  t.classList.toggle('low', remaining <= 300);
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0; updateTimer(); clearInterval(timerId);
      submitExam(true); return;
    }
    updateTimer();
  }, 1000);
}

function buildPalette(){
  const g = $('pgrid');
  g.innerHTML = '';
  for(let i=0;i<QS.length;i++){
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = i+1;
    b.dataset.i = i;
    b.addEventListener('click', ()=> goTo(i));
    g.appendChild(b);
  }
}
function refreshPalette(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    const i = +b.dataset.i;
    b.className = 'pbtn';
    if(state.visited[i]) b.classList.add('seen');
    if(state.marked[i])  b.classList.add('marked');
    if(state.ans[i] !== null) b.classList.add('answered');
    if(i === state.cur) b.classList.add('current');
  });
}

function refreshProgress(){
  const done = state.ans.filter(a=>a!==null).length;
  $('pbar').style.width = (done / QS.length * 100) + '%';
}

function renderQuestion(){
  const i = state.cur, q = QS[i];
  state.visited[i] = true;

  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + QS.length;
  $('qtext').textContent = q.q;
  $('markTag').hidden = !state.marked[i];

  const wrap = $('options');
  wrap.innerHTML = '';
  q.o.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = LETTERS[idx];

    const txt = document.createElement('span');
    txt.className = 'otext';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);

    if(state.ans[i] === idx) btn.classList.add('selected');

    if(state.revealed[i]){
      btn.classList.add('locked');
      if(idx === q.a) btn.classList.add('correct');
      else if(state.ans[i] === idx) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=> selectOption(idx));
    }
    wrap.appendChild(btn);
  });

  const box = $('explainBox');
  if(state.revealed[i]){
    box.hidden = false;
    $('explainTitle').textContent = '✅ Correct answer: ' + LETTERS[q.a] + ' — ' + q.o[q.a];
    $('explainText').textContent = q.e;
    $('btnShow').textContent = '🙈 Hide Answer';
  } else {
    box.hidden = true;
    $('btnShow').textContent = '👁 Show Answer';
  }

  $('btnPrev').disabled = (i === 0);
  $('btnNext').disabled = (i === QS.length - 1);
  $('btnMark').textContent = state.marked[i] ? '★ Unmark' : '★ Mark for Review';

  refreshPalette();
  refreshProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(idx){
  if(state.submitted) return;
  const i = state.cur;
  if(state.revealed[i]) return;
  state.ans[i] = (state.ans[i] === idx) ? null : idx;
  renderQuestion();
}
function goTo(i){
  if(i < 0 || i >= QS.length) return;
  state.cur = i;
  renderQuestion();
}
function toggleMark(){
  if(state.submitted) return;
  state.marked[state.cur] = !state.marked[state.cur];
  renderQuestion();
}
function toggleReveal(){
  if(state.submitted) return;
  state.revealed[state.cur] = !state.revealed[state.cur];
  renderQuestion();
}

function submitExam(auto){
  if(state.submitted) return;
  if(!auto){
    const unanswered = state.ans.filter(a=>a===null).length;
    const msg = 'Submit the test now?\n\nAnswered: ' + (QS.length - unanswered) +
                '\nUnanswered: ' + unanswered +
                '\n\nYou will still be able to review every answer and explanation.';
    if(!confirm(msg)) return;
  }
  state.submitted = true;
  clearInterval(timerId);
  $('quizView').hidden = true;
  $('resultView').hidden = false;
  renderResults(auto);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults(auto){
  let correct=0, wrong=0, skipped=0;
  QS.forEach((q,i)=>{
    if(state.ans[i] === null) skipped++;
    else if(state.ans[i] === q.a) correct++;
    else wrong++;
  });
  const pct = Math.round(correct / QS.length * 100);
  const used = TOTAL_SECONDS - remaining;

  let grade, gradeColor;
  if(pct >= 90){ grade='Outstanding 🏆'; gradeColor='#16a34a'; }
  else if(pct >= 75){ grade='Strong 👍'; gradeColor='#0d9488'; }
  else if(pct >= 60){ grade='Pass ✅'; gradeColor='#f59e0b'; }
  else if(pct >= 40){ grade='Needs review 📖'; gradeColor='#ea580c'; }
  else { grade='Keep practising 🔁'; gradeColor='#dc2626'; }

  let html = '';
  if(auto) html += '<div class="card" style="border-left:5px solid #dc2626;margin-bottom:16px"><b>⏰ Time expired.</b> The test was submitted automatically.</div>';

  html += '<div class="scorecard">' +
    '<h2>Kubernetes Mock Test — Set 2 Complete</h2>' +
    '<div class="bignum">' + pct + '%</div>' +
    '<div style="color:' + gradeColor + ';font-weight:700;font-size:1.05rem">' + grade + '</div>' +
    '<div class="stats">' +
      '<div class="st-ok"><b>' + correct + '</b>Correct</div>' +
      '<div class="st-bad"><b>' + wrong + '</b>Incorrect</div>' +
      '<div class="st-skip"><b>' + skipped + '</b>Unanswered</div>' +
      '<div><b>' + fmt(used) + '</b>Time used</div>' +
    '</div>' +
    '<div style="margin-top:20px">' +
      '<button class="btn primary" id="btnRetake">🔄 Retake Test</button> ' +
      '<button class="btn ghost" id="btnBackTop">↑ Back to top</button>' +
    '</div>' +
  '</div>';

  html += '<div class="filters">' +
      '<button class="fbtn active" data-f="all">All (' + QS.length + ')</button>' +
      '<button class="fbtn" data-f="wrong">Incorrect (' + wrong + ')</button>' +
      '<button class="fbtn" data-f="skipped">Unanswered (' + skipped + ')</button>' +
      '<button class="fbtn" data-f="correct">Correct (' + correct + ')</button>' +
    '</div>';

  QS.forEach((q,i)=>{
    let status, cls;
    if(state.ans[i] === null){ status='skipped'; cls='skip'; }
    else if(state.ans[i] === q.a){ status='correct'; cls='ok'; }
    else { status='wrong'; cls='bad'; }

    html += '<div class="revitem ' + cls + '" data-status="' + status + '">' +
      '<p class="revq">Q' + (i+1) + '. ' + q.q + '</p>';

    if(state.ans[i] === null){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">Not answered</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    } else if(state.ans[i] === q.a){
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagok">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✓</span></div>';
    } else {
      html += '<div class="revline"><span class="lbl">Your answer:</span><span class="tagbad">' +
              LETTERS[state.ans[i]] + ') ' + q.o[state.ans[i]] + ' ✗</span></div>';
      html += '<div class="revline"><span class="lbl">Correct answer:</span><span class="tagok">' +
              LETTERS[q.a] + ') ' + q.o[q.a] + '</span></div>';
    }

    html += '<div class="revexp"><b>Explanation:</b> ' + q.e + '</div>';
    html += '</div>';
  });

  $('resultView').innerHTML = html;

  $('btnRetake').addEventListener('click', retake);
  $('btnBackTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

  document.querySelectorAll('.fbtn[data-f]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.f;
      document.querySelectorAll('.revitem').forEach(it=>{
        it.style.display = (f === 'all' || it.dataset.status === f) ? '' : 'none';
      });
    });
  });
}

function retake(){
  state.ans.fill(null);
  state.revealed.fill(false);
  state.marked.fill(false);
  state.visited.fill(false);
  state.cur = 0;
  state.submitted = false;

  remaining = TOTAL_SECONDS;
  updateTimer();
  startTimer();

  $('resultView').hidden = true;
  $('quizView').hidden = false;
  renderQuestion();
}

$('btnPrev').addEventListener('click', ()=> goTo(state.cur - 1));
$('btnNext').addEventListener('click', ()=> goTo(state.cur + 1));
$('btnMark').addEventListener('click', toggleMark);
$('btnShow').addEventListener('click', toggleReveal);
$('btnSubmit').addEventListener('click', ()=> submitExam(false));

$('togglePalette').addEventListener('click', ()=>{
  const g = $('pgrid'), l = $('legend');
  const hidden = g.style.display === 'none';
  g.style.display = hidden ? '' : 'none';
  l.style.display = hidden ? '' : 'none';
  $('togglePalette').textContent = hidden ? 'Hide' : 'Show';
});

document.addEventListener('keydown', (e)=>{
  if(state.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if(k === 'ArrowRight'){ e.preventDefault(); goTo(state.cur + 1); }
  else if(k === 'ArrowLeft'){ e.preventDefault(); goTo(state.cur - 1); }
  else if(['1','2','3','4'].includes(k)){ e.preventDefault(); selectOption(+k - 1); }
  else if(k.toLowerCase() === 'r'){ e.preventDefault(); toggleMark(); }
  else if(k.toLowerCase() === 's'){ e.preventDefault(); toggleReveal(); }
});

$('qcountPill').textContent = QS.length + ' Questions';
buildPalette();
updateTimer();
startTimer();
renderQuestion();
</script>
</body>
</html>
